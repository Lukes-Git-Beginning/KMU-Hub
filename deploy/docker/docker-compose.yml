      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  livekit-egress:
    image: livekit/egress:v1.9.1
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./egress.yaml:/etc/egress.yaml
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    cap_add:
