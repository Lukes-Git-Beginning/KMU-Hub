services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kmuhub
      POSTGRES_USER: kmuhub
      POSTGRES_PASSWORD: kmuhub_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmuhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/kmuhub-files;
      exit 0;
      "
    restart: "no"

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable", "up"]
    restart: on-failure

  auth:
    build:
      context: ../../backend
      dockerfile: Dockerfile.auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 168h
      AUTH_GRPC_PORT: ":50051"
      HEALTH_PORT: ":9091"
      VAULT_MASTER_SECRET: docker-dev-vault-secret-minimum-32-characters-long
    ports:
      - "50051:50051"
      - "9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:9091/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  crm:
    build:
      context: ../../backend
      dockerfile: Dockerfile.crm
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      CRM_GRPC_PORT: ":50052"
      CRM_HEALTH_PORT: ":9092"
    ports:
      - "50052:50052"
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:9092/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  chat:
    build:
      context: ../../backend
      dockerfile: Dockerfile.chat
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      CHAT_GRPC_PORT: ":50053"
      CHAT_HEALTH_PORT: ":9093"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: kmuhub-files
      MINIO_USE_SSL: "false"
      FILE_SIZE_LIMIT_MB: "50"
    ports:
      - "50053:50053"
      - "9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:9093/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  notification:
    build:
      context: ../../backend
      dockerfile: Dockerfile.notification
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      NOTIFICATION_GRPC_PORT: ":50054"
      NOTIFICATION_HEALTH_PORT: ":9094"
    ports:
      - "50054:50054"
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:9094/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:7880 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  livekit-egress:
    image: livekit/egress:latest
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./egress.yaml:/etc/egress.yaml
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped

  work:
    build:
      context: ../../backend
      dockerfile: Dockerfile.work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      WORK_GRPC_PORT: ":50055"
      WORK_HEALTH_PORT: ":9095"
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret
      LIVEKIT_WS_URL: ws://livekit:7880
      LIVEKIT_EGRESS_TEMPLATE_URL: ""
      LIVEKIT_WEBHOOK_SECRET: devsecret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: kmuhub-files
      MINIO_USE_SSL: "false"
    ports:
      - "50055:50055"
      - "9095:9095"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:9095/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  email:
    build:
      context: ../../backend
      dockerfile: Dockerfile.email
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      EMAIL_GRPC_PORT: ":50056"
      EMAIL_HEALTH_PORT: ":9096"
      VAULT_MASTER_SECRET: docker-dev-vault-secret-minimum-32-characters-long
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: kmuhub-files
      MINIO_USE_SSL: "false"
    ports:
      - "50056:50056"
      - "9096:9096"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:9096/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  document:
    build:
      context: ../../backend
      dockerfile: Dockerfile.document
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      DOCUMENT_GRPC_PORT: ":50057"
      DOCUMENT_HEALTH_PORT: ":9097"
      WOPI_JWT_SECRET: docker-dev-wopi-secret-minimum-32-characters
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: kmuhub-files
      MINIO_USE_SSL: "false"
      FILE_SIZE_LIMIT_MB: "50"
    ports:
      - "50057:50057"
      - "9097:9097"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:9097/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  onlyoffice:
    image: onlyoffice/documentserver:latest
    environment:
      JWT_ENABLED: "false"
    ports:
      - "8443:443"
      - "8088:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost/healthcheck || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  gateway:
    build:
      context: ../../backend
      dockerfile: Dockerfile.gateway
    depends_on:
      auth:
        condition: service_started
      crm:
        condition: service_started
      chat:
        condition: service_started
      notification:
        condition: service_started
      work:
        condition: service_started
      email:
        condition: service_started
      document:
        condition: service_started
      livekit:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 168h
      AUTH_GRPC_ADDRESS: auth:50051
      AUTH_GRPC_PORT: ":50051"
      CRM_GRPC_ADDRESS: crm:50052
      CRM_GRPC_PORT: ":50052"
      CHAT_GRPC_ADDRESS: chat:50053
      CHAT_GRPC_PORT: ":50053"
      NOTIFICATION_GRPC_ADDRESS: notification:50054
      NOTIFICATION_GRPC_PORT: ":50054"
      WORK_GRPC_ADDRESS: work:50055
      WORK_GRPC_PORT: ":50055"
      EMAIL_GRPC_ADDRESS: email:50056
      EMAIL_GRPC_PORT: ":50056"
      DOCUMENT_GRPC_ADDRESS: document:50057
      DOCUMENT_GRPC_PORT: ":50057"
      WOPI_JWT_SECRET: docker-dev-wopi-secret-minimum-32-characters
      GATEWAY_HTTP_PORT: ":8080"
      METRICS_PORT: ":9090"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000;http://localhost:5173;http://localhost:8080"
      RATE_LIMIT_RPS: 100
      LIVEKIT_WEBHOOK_SECRET: devsecret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: kmuhub-files
      MINIO_USE_SSL: "false"
      FILE_SIZE_LIMIT_MB: "50"
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
  onlyoffice_data:
  onlyoffice_logs:
