      NOTIFICATION_HEALTH_PORT: ":9094"
      # Teams/Slack integration (optional -- integration disabled when not set)
      TEAMS_APP_ID: ""
      TEAMS_APP_PASSWORD: ""
      SLACK_BOT_TOKEN: ""
      SLACK_SIGNING_SECRET: ""
      SLACK_CLIENT_ID: ""
      SLACK_CLIENT_SECRET: ""
    ports:
      - "50054:50054"
      - "9094:9094"
    healthcheck:
