version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kmuhub
      POSTGRES_USER: kmuhub
      POSTGRES_PASSWORD: kmuhub_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmuhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable", "up"]
    restart: on-failure

  auth:
    build:
      context: ../../backend
      dockerfile: Dockerfile.auth
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 168h
      AUTH_GRPC_PORT: ":50051"
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:50051 || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: ../../backend
      dockerfile: Dockerfile.gateway
    depends_on:
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kmuhub:kmuhub_dev@postgres:5432/kmuhub?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 168h
      AUTH_GRPC_ADDRESS: auth:50051
      AUTH_GRPC_PORT: ":50051"
      GATEWAY_HTTP_PORT: ":8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080"
      RATE_LIMIT_RPS: 100
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
