services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kmuhub
      POSTGRES_USER: kmuhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/docker/.env or .env.production}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmuhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbucket:
    image: minio/mc:RELEASE.2025-04-16T19-25-36Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/kmuhub-files;
      exit 0;
      "
    restart: "no"

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["${DATABASE_URL:?DATABASE_URL must be set in deploy/docker/.env or .env.production}", "up"]
    restart: on-failure

  auth:
    build:
      context: ../../backend
      dockerfile: Dockerfile.auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in deploy/docker/.env or .env.production}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 168h
      AUTH_GRPC_PORT: ":50051"
      HEALTH_PORT: ":9091"
      VAULT_MASTER_SECRET: docker-dev-vault-secret-minimum-32-characters-long
    ports:
      - "50051:50051"
      - "9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:9091/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  crm:
    build:
      context: ../../backend
      dockerfile: Dockerfile.crm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
