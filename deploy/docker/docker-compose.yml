      RAPPORTE_HEALTH_PORT: ":9114"
    ports:
      - "50074:50074"
      - "9114:9114"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:9114/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  schichten:
    build:
      context: ../../backend
      dockerfile: Dockerfile.schichten
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in deploy/docker/.env or .env.production}
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      SCHICHTEN_GRPC_PORT: ":50075"
      SCHICHTEN_HEALTH_PORT: ":9115"
    ports:
      - "50075:50075"
      - "9115:9115"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:9115/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  onlyoffice:
    image: onlyoffice/documentserver:8.2.2
    environment:
      JWT_ENABLED: "false"
    ports:
      - "8443:443"
      - "8088:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost/healthcheck || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  gateway:
    build:
      context: ../../backend
      dockerfile: Dockerfile.gateway
    depends_on:
      auth:
        condition: service_started
      crm:
        condition: service_started
      chat:
        condition: service_started
      notification:
        condition: service_started
      work:
        condition: service_started
      email:
        condition: service_started
      document:
        condition: service_started
      biz:
        condition: service_started
      automation:
        condition: service_started
      plugin:
        condition: service_started
      dialer:
        condition: service_started
      wiki:
        condition: service_started
      helpdesk:
        condition: service_started
      berichte:
        condition: service_healthy
      formulare:
        condition: service_healthy
      inventar:
        condition: service_healthy
      einkauf:
        condition: service_healthy
      produktion:
        condition: service_healthy
      vertraege:
        condition: service_healthy
      rapporte:
        condition: service_healthy
      schichten:
        condition: service_healthy
      fuhrpark:
        condition: service_healthy
      vermietung:
        condition: service_healthy
      livekit:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in deploy/docker/.env or .env.production}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 168h
      AUTH_GRPC_ADDRESS: auth:50051
      AUTH_GRPC_PORT: ":50051"
      CRM_GRPC_ADDRESS: crm:50052
      CRM_GRPC_PORT: ":50052"
      CHAT_GRPC_ADDRESS: chat:50053
      CHAT_GRPC_PORT: ":50053"
      NOTIFICATION_GRPC_ADDRESS: notification:50054
      NOTIFICATION_GRPC_PORT: ":50054"
      WORK_GRPC_ADDRESS: work:50055
      WORK_GRPC_PORT: ":50055"
      EMAIL_GRPC_ADDRESS: email:50056
      EMAIL_GRPC_PORT: ":50056"
      DOCUMENT_GRPC_ADDRESS: document:50057
      DOCUMENT_GRPC_PORT: ":50057"
      BIZ_GRPC_ADDRESS: biz:50058
      BIZ_GRPC_PORT: ":50058"
      AUTOMATION_GRPC_ADDRESS: automation:50059
      AUTOMATION_GRPC_PORT: ":50059"
      PLUGIN_GRPC_ADDRESS: plugin:50060
      PLUGIN_GRPC_PORT: ":50060"
      DIALER_GRPC_ADDRESS: dialer:50061
      DIALER_GRPC_PORT: ":50061"
      WIKI_GRPC_ADDRESS: wiki:50062
      WIKI_GRPC_PORT: ":50062"
      HELPDESK_GRPC_ADDRESS: helpdesk:50065
      HELPDESK_GRPC_PORT: ":50065"
      BERICHTE_GRPC_ADDRESS: berichte:50063
      BERICHTE_GRPC_PORT: ":50063"
      FORMULARE_GRPC_ADDRESS: formulare:50064
      FORMULARE_GRPC_PORT: ":50064"
      INVENTAR_GRPC_ADDRESS: inventar:50070
      INVENTAR_GRPC_PORT: ":50070"
      EINKAUF_GRPC_ADDRESS: einkauf:50071
      EINKAUF_GRPC_PORT: ":50071"
      PRODUKTION_GRPC_ADDRESS: produktion:50072
      PRODUKTION_GRPC_PORT: ":50072"
      VERTRAEGE_GRPC_ADDRESS: vertraege:50073
      VERTRAEGE_GRPC_PORT: ":50073"
      RAPPORTE_GRPC_ADDRESS: rapporte:50074
      RAPPORTE_GRPC_PORT: ":50074"
      SCHICHTEN_GRPC_ADDRESS: schichten:50075
      SCHICHTEN_GRPC_PORT: ":50075"
      FUHRPARK_GRPC_ADDRESS: fuhrpark:50076
      FUHRPARK_GRPC_PORT: ":50076"
      VERMIETUNG_GRPC_ADDRESS: vermietung:50077
      VERMIETUNG_GRPC_PORT: ":50077"
      WOPI_JWT_SECRET: docker-dev-wopi-secret-minimum-32-characters
      GATEWAY_HTTP_PORT: ":8080"
      METRICS_PORT: ":9090"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000;http://localhost:5173;http://localhost:8080"
      RATE_LIMIT_RPS: 100
      LIVEKIT_WEBHOOK_SECRET: devsecret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # HardMode in Dev so missing Idempotency-Key triggers 400 during local development.
      # Production leaves this unset (defaults to WarnMode) until Sprint 3 cutover.
      IDEMPOTENCY_MODE: hard
      MINIO_BUCKET: kmuhub-files
      MINIO_USE_SSL: "false"
      FILE_SIZE_LIMIT_MB: "50"
      # Teams/Slack integration (optional -- for inbound webhook signature verification)
      SLACK_SIGNING_SECRET: ""
      TEAMS_APP_ID: ""
      TEAMS_APP_PASSWORD: ""
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

