      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in deploy/docker/.env or .env.production}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-dev-secret-minimum-32-characters
      CRM_GRPC_PORT: ":50052"
      CRM_HEALTH_PORT: ":9092"
    ports:
      - "50052:50052"
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:9092/health || exit 1"]
