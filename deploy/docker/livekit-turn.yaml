# livekit-turn.yaml — OBSOLETE, DO NOT MOUNT
# =============================================================================
# This file was originally intended as an overlay config to enable an external
# coturn server. That approach is conceptually wrong — LiveKit's `turn:` block
# configures its OWN embedded TURN server, not an external one.
#
# Correct way to wire the external coturn (turn.zentria.tech) into LiveKit:
# see `deploy/turn/livekit-integration.md` → "Pending work" section.
#
# Short version: the `video` service must attach per-session TURN credentials
# to each AccessToken using the shared TURN_SECRET from .env.production.
#
# This file is left in the repo for git-history context and will be removed
# once the backend-side TURN wiring is implemented (Sprint 2 task).
# =============================================================================
