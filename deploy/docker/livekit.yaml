port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # use_external_ip: announce the server's public IP to WebRTC clients for
  # direct ICE candidates. Set to true in production (app server has a public
  # IP). Keeps working without TURN — just ensures clients get the right
  # candidate address even behind a one-NIC Hetzner server.
  # In dev (docker-compose.yml without prod overlay) this remains false so
  # local containers can reach each other without external IP resolution.
  use_external_ip: false
redis:
  address: redis:6379
keys:
  devkey: devsecret
webhook:
  urls:
    - http://gateway:8080/api/v1/webhooks/livekit
  api_key: devkey

# ---------------------------------------------------------------------------
# Overlays — applied via additional `--config` flags in docker-compose.prod.yml
# ---------------------------------------------------------------------------
# This base config carries dev-friendly defaults (devkey/devsecret, no TURN).
# Production keeps `port`, `rtc`, `redis`, `webhook.urls` from this file but
# replaces sensitive fields via overlays:
#
#   livekit-secrets.yaml   — generated by deploy/scripts/render-configs.sh
#                            from $LIVEKIT_API_KEY / $LIVEKIT_API_SECRET in
#                            .env.production. ALWAYS active in prod (mounted
#                            unconditionally by docker-compose.prod.yml).
#                            Overrides `keys` and `webhook.api_key`.
#
#   livekit-turn.yaml      — TURN activation overlay. Currently commented out
#                            in docker-compose.prod.yml; uncomment after coturn
#                            is wired (Sprint 2 R2.1b).
#
# Why overlays instead of inline ${VAR} substitution?
# LiveKit does not natively support env-var substitution in livekit.yaml.
# Docker Compose substitutes ${VAR} in compose files, but NOT in mounted
# config files. A missing or empty value would cause LiveKit to either
# crash or silently mis-configure — both undesirable. The overlay approach
# is explicit: render-configs.sh fails loud if env vars are missing.
#
# To enable TURN:
#   1. Provision the coturn CPX11 (deploy/hetzner/coturn-setup.sh) — done
#   2. Set TURN_SECRET and COTURN_HOST in .env.production
#   3. Uncomment the livekit-turn.yaml volume mount and the alt `command:`
#      line in docker-compose.prod.yml
#   4. docker compose restart livekit
