# Production-only LiveKit overlay.
#
# Merged (key-by-key) after livekit.yaml + livekit-secrets.yaml via an extra
# `--config /etc/livekit-prod.yaml` flag in docker-compose.prod.yml.
#
# Why this exists: the base livekit.yaml keeps use_external_ip:false so that in
# dev (docker-compose.yml without the prod overlay) local containers reach each
# other by their internal Docker IPs. In production the LiveKit SFU must announce
# the server's PUBLIC IP to WebRTC clients — otherwise it advertises its internal
# container IP as the ICE candidate and media fails for any client outside the
# host (i.e. every real participant). This overlay flips that on for prod only.
rtc:
  use_external_ip: true
