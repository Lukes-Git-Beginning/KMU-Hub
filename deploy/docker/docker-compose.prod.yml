services:
  # ===== Infrastructure =====

  postgres:
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=12GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "max_connections=150"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  redis:
    command: ["redis-server", "--maxmemory", "400mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"

  minio:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  createbucket:
    logging: *default-logging

  migrate:
    logging: *default-logging

  # ===== Third-Party Services =====

  onlyoffice:
    logging: *default-logging
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  livekit:
    logging: *default-logging
    # ---------------------------------------------------------------------------
    # Prod overlay configs — base livekit.yaml is mounted by docker-compose.yml.
    # We additionally mount:
    #   - livekit-secrets.yaml: rendered by deploy/scripts/render-configs.sh
    #     from .env.production (LIVEKIT_API_KEY/LIVEKIT_API_SECRET). MUST exist
    #     before `docker compose up` — render-configs.sh writes it.
    #   - livekit-turn.yaml: TURN activation overlay (commented out until coturn
    #     is wired in S2.R2.1b). To enable, uncomment both lines below and the
    #     `--config /etc/livekit-turn.yaml` flag in command.
    # LiveKit merges multiple --config files key-by-key.
    # ---------------------------------------------------------------------------
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
      - ./livekit-secrets.yaml:/etc/livekit-secrets.yaml
      # livekit-prod.yaml: prod-only overlay (use_external_ip:true) so the SFU
      # announces the server's public IP — required for media across NATs.
      - ./livekit-prod.yaml:/etc/livekit-prod.yaml
      # - ./livekit-turn.yaml:/etc/livekit-turn.yaml  # obsolete: client-side TURN
      #   is injected via the backend ice_servers response, not a LiveKit overlay.
    command: --config /etc/livekit.yaml --config /etc/livekit-secrets.yaml --config /etc/livekit-prod.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  livekit-egress:
    logging: *default-logging
    # Same container path as the base mount — compose merges volumes by target,
    # so the rendered secrets file (real LiveKit key + MinIO credentials from
    # .env.production, written by render-configs.sh) replaces the dev egress.yaml.
    volumes:
      - ./egress-secrets.yaml:/etc/egress.yaml

  # ===== Go Microservices =====

  auth:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  crm:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  chat:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  notification:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  work:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  email:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  document:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  biz:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  automation:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  plugin:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  wiki:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  helpdesk:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  berichte:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  formulare:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  dialer:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  inventar:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  einkauf:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  produktion:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  vertraege:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  fuhrpark:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  vermietung:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  rapporte:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  schichten:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ===== API Gateway =====

  gateway:
    environment:
      BEHIND_PROXY: "true"
      # HardMode: reject duplicate POSTs with missing/duplicate Idempotency-Key (400).
      # WarnMode (default) only logs — enables silent data duplication in production.
      IDEMPOTENCY_MODE: hard
      # Per-call deadline for outbound gateway→service gRPC. Override via
      # .env.production if a legitimately slow endpoint needs more headroom.
      GATEWAY_GRPC_TIMEOUT: "${GATEWAY_GRPC_TIMEOUT:-30s}"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ===== Reverse Proxy =====

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ===== Monitoring =====

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "127.0.0.1:9190:9090"
    restart: unless-stopped
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      # Host bind moved to 9193 to avoid collision with chat service health port (9093).
      # Container internal still listens on 9093; prometheus and other compose services
      # reach it as alertmanager:9093 via the docker network.
      - "127.0.0.1:9193:9093"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.1"

  grafana:
    image: grafana/grafana:11.4.0
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  alertmanager_data:
