services:
  # ===== Infrastructure =====

  postgres:
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Production command merges pg_cron preload (from base compose) with
    # performance tuning. Both shared_preload_libraries and cron.database_name
    # must be repeated here because docker-compose prod overlay replaces
    # (not merges) the command array from the base file.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=kmuhub"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=12GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "max_connections=150"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  redis:
    command: ["redis-server", "--maxmemory", "400mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"

  minio:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  createbucket:
    logging: *default-logging

  migrate:
    logging: *default-logging

  # ===== Third-Party Services =====

  onlyoffice:
    logging: *default-logging
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  livekit:
    logging: *default-logging
    # ---------------------------------------------------------------------------
    # Prod overlay configs — base livekit.yaml is mounted by docker-compose.yml.
    # We additionally mount:
    #   - livekit-secrets.yaml: rendered by deploy/scripts/render-configs.sh
    #     from .env.production (LIVEKIT_API_KEY/LIVEKIT_API_SECRET). MUST exist
    #     before `docker compose up` — render-configs.sh writes it.
    #   - livekit-turn.yaml: TURN activation overlay (commented out until coturn
    #     is wired in S2.R2.1b). To enable, uncomment both lines below and the
    #     `--config /etc/livekit-turn.yaml` flag in command.
    # LiveKit merges multiple --config files key-by-key.
    # ---------------------------------------------------------------------------
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
      - ./livekit-secrets.yaml:/etc/livekit-secrets.yaml
      # - ./livekit-turn.yaml:/etc/livekit-turn.yaml  # uncomment when TURN active
    # LiveKit v1.7.2 is last-wins on repeated --config (NOT a key merge), so the
    # effective config is livekit-secrets.yaml — it carries keys + webhook + the
    # full rtc block (incl. use_external_ip). See livekit-secrets.yaml.tmpl.
    command: --config /etc/livekit.yaml --config /etc/livekit-secrets.yaml
    # Bump this revision whenever livekit-secrets.yaml.tmpl changes. LiveKit reads
    # its config only at process start, and `compose up -d` will NOT recreate the
    # container for a changed bind-mounted file alone — a changed label forces the
    # recreate so the new webhook/room config actually loads.
    labels:
      com.cosmi.config-revision: "2026-06-23-webhook-urls-empty-timeout"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  livekit-egress:
    logging: *default-logging
    # Same container path as the base mount — compose merges volumes by target,
    # so the rendered secrets file (real LiveKit key + MinIO credentials from
    # .env.production, written by render-configs.sh) replaces the dev egress.yaml.
    volumes:
      - ./egress-secrets.yaml:/etc/egress.yaml

  # ===== Go Microservices =====

  auth:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  crm:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  chat:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  notification:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  work:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  email:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  document:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  biz:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  automation:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  plugin:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  wiki:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  helpdesk:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  berichte:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  formulare:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  dialer:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  inventar:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  einkauf:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  produktion:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  vertraege:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  fuhrpark:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  vermietung:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  rapporte:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  schichten:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ===== API Gateway =====

  gateway:
    environment:
      BEHIND_PROXY: "true"
      # HardMode: reject duplicate POSTs with missing/duplicate Idempotency-Key (400).
      # WarnMode (default) only logs — enables silent data duplication in production.
      IDEMPOTENCY_MODE: hard
      # Per-call deadline for outbound gateway→service gRPC. Override via
      # .env.production if a legitimately slow endpoint needs more headroom.
      GATEWAY_GRPC_TIMEOUT: "${GATEWAY_GRPC_TIMEOUT:-30s}"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ===== Reverse Proxy =====

  # Cosmi as a web app. Separate from the edge Caddy on purpose: a failed
  # frontend build must not be able to take TLS termination -- and with it the
  # API -- down. Not published to a host port; only the edge proxies to it.
  webapp:
    build:
      context: ../../desktop
      dockerfile: Dockerfile.web
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ===== Monitoring =====

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "127.0.0.1:9190:9090"
    restart: unless-stopped
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      # Host bind moved to 9193 to avoid collision with chat service health port (9093).
      # Container internal still listens on 9093; prometheus and other compose services
      # reach it as alertmanager:9093 via the docker network.
      - "127.0.0.1:9193:9093"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.1"

  grafana:
    image: grafana/grafana:11.4.0
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  alertmanager_data:
