services:
  # ===== Infrastructure =====

  postgres:
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=12GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "max_connections=150"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  redis:
    command: ["redis-server", "--maxmemory", "400mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"

  minio:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  createbucket:
    logging: *default-logging

  migrate:
    logging: *default-logging

  # ===== Third-Party Services =====

  onlyoffice:
    logging: *default-logging
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  livekit:
    logging: *default-logging
    # ---------------------------------------------------------------------------
    # TURN activation: when coturn is provisioned, uncomment the volumes block
    # below AND set TURN_SECRET + COTURN_HOST in .env.production.
    # Then update livekit-turn.yaml: replace "turn.zentria.tech" with the value
    # of COTURN_HOST if it differs, then restart livekit.
    #
    # To activate:
    #   1. Run deploy/hetzner/coturn-setup.sh on the CPX11
    #   2. Set TURN_SECRET and COTURN_HOST in .env.production
    #   3. Uncomment the volumes section below
    #   4. sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml restart livekit
    #
    # volumes:
    #   - ./livekit.yaml:/etc/livekit.yaml           # base config (already mounted in base)
    #   - ./livekit-turn.yaml:/etc/livekit-turn.yaml # TURN overlay — activates TURN
    # command: --config /etc/livekit.yaml --config /etc/livekit-turn.yaml
    # ---------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  livekit-egress:
    logging: *default-logging

  # ===== Go Microservices =====

  auth:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  crm:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  chat:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  notification:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  work:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  email:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  document:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  biz:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  automation:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  plugin:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ===== API Gateway =====

  gateway:
    environment:
      BEHIND_PROXY: "true"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ===== Reverse Proxy =====

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ===== Monitoring =====

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "127.0.0.1:9190:9090"
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
