groups:
  - name: service_health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 2 minutes."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "{{ $labels.job }} error rate is above 5% for the last 2 minutes."

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P99 latency on {{ $labels.job }}"
          description: "{{ $labels.job }} P99 latency is above 2 seconds for the last 5 minutes."

      - alert: DBConnectionsHigh
        expr: |
          pg_stat_activity_count
          / on() group_left()
          pg_settings_max_connections
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"
          description: "Active DB connections exceed 80% of max_connections for more than 5 minutes."

  - name: infrastructure
    rules:
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "{{ $labels.job }} is using more than 200MB of memory."

      - alert: HighGoroutineCount
        expr: go_goroutines > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High goroutine count on {{ $labels.job }}"
          description: "{{ $labels.job }} has more than 500 goroutines."

      - alert: GRPCHighErrorRate
        expr: |
          (
            sum(rate(grpc_server_handled_total{grpc_code!="OK"}[5m])) by (job)
            /
            sum(rate(grpc_server_handled_total[5m])) by (job)
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High gRPC error rate on {{ $labels.job }}"
          description: "{{ $labels.job }} gRPC error rate is above 5%."

  - name: websocket
    rules:
      - alert: HighWSConnectionCount
        expr: sum(ws_connections_active) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High WebSocket connection count"
          description: "More than 500 active WebSocket connections."

      - alert: WSAuthFailures
        expr: rate(ws_errors_total{error_type="auth_failed"}[5m]) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated WebSocket authentication failures"
          description: "More than 1 WS auth failure per second sustained for 2 minutes."

  - name: audit
    rules:
      # Every dropped audit row is a compliance finding, so any increase fires.
      # A reason label only exists after its first drop and increase() needs two
      # samples, so the second branch catches a series that is new in the window.
      - alert: AuditEventsDropped
        expr: |
          sum by (job, reason) (increase(audit_events_dropped_total[15m])) > 0
          or
          sum by (job, reason) (audit_events_dropped_total > 0 unless audit_events_dropped_total offset 15m)
        labels:
          severity: critical
        annotations:
          summary: "Audit events dropped on {{ $labels.job }} ({{ $labels.reason }})"
          description: "{{ $labels.job }} lost HTTP audit events (reason: {{ $labels.reason }}) in the last 15 minutes. The audit log has a gap."
