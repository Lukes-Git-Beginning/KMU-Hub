# =============================================================================
# coturn configuration template — Zentria / Cosmi TURN server
# =============================================================================
# This file documents all relevant directives used by coturn-setup.sh.
# The setup script generates the LIVE /etc/turnserver.conf from this template
# (via heredoc with variable substitution). Do NOT edit /etc/turnserver.conf
# directly — re-run coturn-setup.sh to regenerate it.
#
# Reference: https://github.com/coturn/coturn/blob/master/examples/etc/turnserver.conf
# =============================================================================

# ---------------------------------------------------------------------------
# Network: listening ports
# ---------------------------------------------------------------------------

# Plain TURN/STUN (UDP + TCP)
listening-port=3478

# TURN over TLS (required for WebRTC in secure contexts)
tls-listening-port=5349

# Bind on all interfaces; coturn resolves the external IP via external-ip=
listening-ip=0.0.0.0

# ---------------------------------------------------------------------------
# NAT traversal: external / relay IP
# ---------------------------------------------------------------------------

# Announce this public IP to clients for ICE candidates.
# coturn-setup.sh fills this automatically from ipify.org.
# Format: external-ip=<public-ip> (single IP)
# For dual-stack: external-ip=<public-ipv4>/<public-ipv6>
external-ip=CHANGE_ME

# The IP address used for relay endpoints (usually the same as external-ip
# on a single-NIC Hetzner instance).
relay-ip=CHANGE_ME

# ICE relay port range — opened in ufw and Hetzner firewall
min-port=49152
max-port=65535

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------

# The auth realm sent to clients. Should match the domain, not the FQDN.
realm=zentria.tech

# Server-Name in TURN responses (FQDN of this TURN server).
server-name=turn.zentria.tech

# ---------------------------------------------------------------------------
# WebRTC / RFC 5389 compliance
# ---------------------------------------------------------------------------

# Include RFC 5389 message integrity fingerprint in all responses.
# Required by WebRTC clients and LiveKit.
fingerprint

# ---------------------------------------------------------------------------
# Authentication: REST API / shared-secret mode
# ---------------------------------------------------------------------------
# LiveKit uses coturn's "time-limited shared-secret" mechanism:
#   - LiveKit generates a temporary username/password per room/user via HMAC-SHA1
#   - The shared secret below must match TURN_SECRET in LiveKit's config
#   - Clients receive credentials in the LiveKit join response — no static passwords
# See: https://github.com/coturn/coturn/wiki/turnserver#secret-based-authorization
# and: https://docs.livekit.io/home/self-hosting/turn/

use-auth-secret

# IMPORTANT: Replace with the actual secret (generated by coturn-setup.sh or openssl rand -hex 32)
# This value must match TURN_SECRET in .env.production on the app server.
static-auth-secret=CHANGE_ME

# ---------------------------------------------------------------------------
# TLS: Let's Encrypt certificate
# ---------------------------------------------------------------------------

# Full certificate chain (including intermediates) for turn.zentria.tech
cert=/etc/letsencrypt/live/turn.zentria.tech/fullchain.pem

# Private key
pkey=/etc/letsencrypt/live/turn.zentria.tech/privkey.pem

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

# Write logs to file instead of stdout
log-file=/var/log/coturn.log

# Suppress stdout output (use log-file instead)
no-stdout-log

# Simple single-line log format (easier to parse with grep/journalctl)
simple-log

# ---------------------------------------------------------------------------
# Security hardening
# ---------------------------------------------------------------------------

# Disable the coturn management CLI (attack surface reduction)
no-cli

# Prevent relay to loopback addresses (SSRF protection)
no-loopback-peers

# Prevent relay to multicast addresses
no-multicast-peers

# Block relay to all RFC-1918 and reserved ranges.
# This prevents SSRF attacks where an external attacker relays traffic
# to internal services (e.g., Docker network, metadata endpoints).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
