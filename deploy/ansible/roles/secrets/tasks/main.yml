---
# ============================================================
# secrets/tasks/main.yml
# Generate 12 cryptographic secrets via lookup('password')
# and render env.production.j2 to the target path.
# no_log: true on the set_fact block to prevent secret leakage.
# ============================================================

- name: Generate cryptographic secrets
  ansible.builtin.set_fact:
    JWT_SECRET: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.long ~ ' chars=ascii_letters,digits') }}"
    VAULT_MASTER_SECRET: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.long ~ ' chars=ascii_letters,digits') }}"
    WOPI_JWT_SECRET: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.long ~ ' chars=ascii_letters,digits') }}"
    ONLYOFFICE_JWT_SECRET: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.long ~ ' chars=ascii_letters,digits') }}"
    LIVEKIT_API_KEY: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.medium ~ ' chars=ascii_letters,digits') }}"
    LIVEKIT_API_SECRET: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.long ~ ' chars=ascii_letters,digits') }}"
    LIVEKIT_WEBHOOK_SECRET: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.long ~ ' chars=ascii_letters,digits') }}"
    TURN_SECRET: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.long ~ ' chars=ascii_letters,digits') }}"
    POSTGRES_PASSWORD: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.medium ~ ' chars=ascii_letters,digits') }}"
    MINIO_ROOT_PASSWORD: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.medium ~ ' chars=ascii_letters,digits') }}"
    MINIO_SECRET_KEY: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.medium ~ ' chars=ascii_letters,digits') }}"
    GF_SECURITY_ADMIN_PASSWORD: "{{ lookup('password', '/dev/null length=' ~ secret_lengths.short ~ ' chars=ascii_letters,digits') }}"
  no_log: true

- name: Render env.production from template
  ansible.builtin.template:
    src: env.production.j2
    dest: "{{ env_target_path }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
