---
turn_realm: turn.zentria.tech
turn_listening_port: 3478
turn_tls_listening_port: 5349
turn_min_port: 49152
turn_max_port: 65535
turn_external_ip: "{{ ansible_host }}"
# turn_secret is generated by the secrets role and referenced here.
# Override via vault: ansible-vault encrypt_string '<secret>' --name turn_secret
turn_secret: "{{ TURN_SECRET | default('CHANGEME') }}"
certbot_email: "ops@zentria.tech"
ufw_turn_ports:
  - { port: "3478", proto: tcp }
  - { port: "3478", proto: udp }
  - { port: "5349", proto: tcp }
  - { port: "5349", proto: udp }
  - { port: "80", proto: tcp }
  - { port: "{{ turn_min_port }}:{{ turn_max_port }}", proto: udp }
