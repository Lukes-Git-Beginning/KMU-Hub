compose_path: /opt/kmuhub/deploy/docker
env_path: /opt/kmuhub/.env.production
# App services connect as kmuhub_app (NOSUPERUSER NOBYPASSRLS) — RLS enforces.
# Created in migration 000121; password is generated by the secrets role.
pilot_database_url: "postgres://kmuhub_app:{{ KMUHUB_APP_DB_PASSWORD }}@postgres:5432/kmuhub?sslmode=disable"
# Migration service connects as kmuhub (superuser) for DDL operations.
pilot_migration_database_url: "postgres://kmuhub:{{ POSTGRES_PASSWORD }}@postgres:5432/kmuhub?sslmode=disable"
pilot_redis_url: "redis://redis:6379/0"
gateway_http_port: "8080"
cors_allowed_origins: "https://{{ pilot_domain }}"
rate_limit_rps: "100"
file_size_limit_mb: "100"
behind_proxy: "true"
access_token_expiry: "15m"
refresh_token_expiry: "168h"
gf_users_allow_sign_up: "false"
# Public MinIO endpoint proxied by Caddy — browser-reachable for presigned URLs.
# Must match the DNS A-record pointing at this server. Default: s3.zentria.tech
minio_public_domain: "s3.zentria.tech"

# ===== SYSTEM SMTP (Brevo) — REQUIRED for a new pilot provision =====
# External transactional-mail credentials. These are NOT generated by the secrets
# role and MUST be supplied (encrypted) before provisioning, e.g.:
#   ansible-vault create deploy/ansible/inventory/group_vars/pilots/vault.yml
# containing:
#   system_smtp_host: "smtp-relay.brevo.com"
#   system_smtp_user: "<brevo-smtp-login>"
#   system_smtp_password: "<brevo-smtp-key>"
# Optional (have template defaults): system_smtp_port (587),
# system_smtp_from (noreply@zentria.tech), password_reset_base_url
# (https://{{ pilot_domain }}/reset-password).
# If host/user/password are unset the playbook fails at env.production.j2 render
# (mandatory filter) — by design, so auth never crash-loops on missing SMTP.
