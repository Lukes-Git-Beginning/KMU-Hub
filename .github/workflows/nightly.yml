name: Nightly

# Integration smoke suite. It overlaps heavily with the per-push E2E job, so it
# doesn't gate every push — it runs once a night as a safety net (and on demand).
# Self-contained: builds and starts its own services instead of consuming the
# e2e job's artifact. Split out of ci.yml on 2026-06-09 to cut per-push minutes.
on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

env:
  GO_VERSION: "1.25.6"

# Least-privilege token: only checkout + tests run here — read-only is sufficient.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Must match deploy/docker/docker-compose.yml — migration 000072
        # needs the pgvector extension, plain postgres images lack it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kmuhub_test
          POSTGRES_USER: kmuhub_test
          POSTGRES_PASSWORD: kmuhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kmuhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://kmuhub_test:kmuhub_test@localhost:5432/kmuhub_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-smoke-test-secret-minimum-32-characters
      SMOKE_URL: http://localhost:8080
      # Same CI-only headroom as the e2e job — production stays at 100 rps.
      RATE_LIMIT_RPS: 1000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.0

      - name: Run migrations
        run: migrate -path backend/migrations -database "$DATABASE_URL" up

      - name: Start MinIO
        # chat + document exit on startup without object storage. Same pinned
        # image as deploy/docker/docker-compose.yml; docker-run step because
        # GitHub service containers cannot pass the `server /data` command.
        # Credentials match the dev defaults in internal/config/config.go.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=kmuhub -e MINIO_ROOT_PASSWORD=kmuhub_dev \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "MinIO healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "MinIO failed to start"
              docker logs minio
              exit 1
            fi
            sleep 1
          done

      - name: Build services
        # Self-contained: this workflow has no e2e job to inherit binaries from.
        working-directory: backend
        run: |
          go build -o bin/auth ./cmd/auth
          go build -o bin/gateway ./cmd/gateway
          go build -o bin/crm ./cmd/crm
          go build -o bin/chat ./cmd/chat
          go build -o bin/work ./cmd/work
          go build -o bin/document ./cmd/document

      - name: Start services
        working-directory: backend
        run: |
          ./bin/auth > /tmp/auth.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9091/health > /dev/null 2>&1 && break; sleep 1; done

          ./bin/crm > /tmp/crm.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9092/health > /dev/null 2>&1 && break; sleep 1; done

          ./bin/chat > /tmp/chat.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9093/health > /dev/null 2>&1 && break; sleep 1; done

          ./bin/work > /tmp/work.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9095/health > /dev/null 2>&1 && break; sleep 1; done

          ./bin/document > /tmp/document.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9097/health > /dev/null 2>&1 && break; sleep 1; done

          ./bin/gateway > /tmp/gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health > /dev/null 2>&1 && break; sleep 1; done

      - name: Run smoke tests
        working-directory: backend
        run: go test -tags=smoke ./test/smoke/... -v -count=1

      - name: Dump service logs on failure
        if: failure()
        run: |
          for log in auth crm chat work document gateway; do
            echo "=== $log Service Logs ==="
            cat /tmp/$log.log || true
          done

  integration:
    name: Finance Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs in parallel with smoke — both are independent nightly safety nets.
    # testcontainers-go spins up its own pgvector/pgvector:pg16 container
    # internally; no external Postgres service is needed here.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run Finance integration tests
        working-directory: backend
        env:
          # testcontainers-go starts its own pgvector/pgvector:pg16 container and
          # runs all *.up.sql migrations via pgtc.StartPostgres — no external DB
          # needed. Ryuk reaper is disabled to avoid Docker-in-Docker permission
          # issues on GitHub Actions runners.
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # Optional: override the migrations directory if the runtime.Caller path
          # resolution fails in the CI sandbox (unlikely, but documented).
          # MIGRATIONS_DIR: ${{ github.workspace }}/backend/migrations
        run: |
          go test -tags=integration \
            ./internal/biz/invoice/... \
            ./internal/biz/quote/... \
            ./internal/biz/creditnote/... \
            -race -count=1 -v -timeout 15m
