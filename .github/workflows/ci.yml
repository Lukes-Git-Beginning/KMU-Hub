name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

env:
  GO_VERSION: "1.25.6"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8
          working-directory: backend
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kmuhub_test
          POSTGRES_USER: kmuhub_test
          POSTGRES_PASSWORD: kmuhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kmuhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run tests with race detector
        env:
          DATABASE_URL: postgres://kmuhub_test:kmuhub_test@localhost:5432/kmuhub_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-minimum-32-characters
        working-directory: backend
        run: go test ./... -v -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage
        working-directory: backend
        run: |
          echo "=== Coverage report ==="
          go tool cover -func=coverage.out
          echo ""
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${TOTAL}%"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.out
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build all services
        working-directory: backend
        run: make build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kmuhub_test
          POSTGRES_USER: kmuhub_test
          POSTGRES_PASSWORD: kmuhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kmuhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://kmuhub_test:kmuhub_test@localhost:5432/kmuhub_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-e2e-test-secret-minimum-32-characters
      GATEWAY_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.0

      - name: Run migrations
        run: migrate -path backend/migrations -database "$DATABASE_URL" up

      - name: Build services
        working-directory: backend
        run: go build -o bin/auth ./cmd/auth && go build -o bin/gateway ./cmd/gateway

      - name: Start auth service
        working-directory: backend
        run: |
          ./bin/auth > /tmp/auth.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9091/health > /dev/null 2>&1; then
              echo "Auth service healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Auth service failed to start"
              cat /tmp/auth.log
              exit 1
            fi
            sleep 1
          done

      - name: Start gateway service
        working-directory: backend
        run: |
          ./bin/gateway > /tmp/gateway.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Gateway service healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Gateway service failed to start"
              cat /tmp/gateway.log
              exit 1
            fi
            sleep 1
          done

      - name: Run E2E tests
        working-directory: backend
        run: go test -tags=e2e ./test/e2e/... -v -count=1

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== Auth Service Logs ==="
          cat /tmp/auth.log || true
          echo ""
          echo "=== Gateway Service Logs ==="
          cat /tmp/gateway.log || true

  openapi-validate:
    name: Validate OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OpenAPI spec
        run: npx --yes @apidevtools/swagger-cli validate backend/api/openapi.yaml
