name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "desktop/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "desktop/**"
      - ".github/workflows/ci.yml"

env:
  GO_VERSION: "1.25.6"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8
          working-directory: backend
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match deploy/docker/docker-compose.yml — migration 000072
        # needs the pgvector extension, plain postgres images lack it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kmuhub_test
          POSTGRES_USER: kmuhub_test
          POSTGRES_PASSWORD: kmuhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kmuhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.0

      - name: Run migrations
        # Superuser URL — DDL needs kmuhub_test (table owner). Tests below
        # connect as kmuhub_app so RLS policies actually apply (NOBYPASSRLS).
        run: migrate -path backend/migrations -database "postgres://kmuhub_test:kmuhub_test@localhost:5432/kmuhub_test?sslmode=disable" up

      - name: Set app role password
        # Migration 000121 creates kmuhub_app with a placeholder password.
        # Mirror the local-dev convention from backend/.env.example.
        run: PGPASSWORD=kmuhub_test psql -h localhost -U kmuhub_test -d kmuhub_test -c "ALTER ROLE kmuhub_app WITH PASSWORD 'app_dev'"

      - name: Run tests with race detector
        env:
          DATABASE_URL: postgres://kmuhub_app:app_dev@localhost:5432/kmuhub_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-minimum-32-characters
        working-directory: backend
        run: go test ./... -v -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage
        working-directory: backend
        run: |
          # Exclude generated proto stubs — they carry zero handwritten logic
          # and dilute the ratio (10.9% raw vs 20.0% real at time of writing).
          grep -v "github.com/kmuhub/kmuhub/proto/" coverage.out > coverage_filtered.out
          echo "=== Coverage report (generated proto code excluded) ==="
          go tool cover -func=coverage_filtered.out
          echo ""
          TOTAL=$(go tool cover -func=coverage_filtered.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${TOTAL}%"
          THRESHOLD=15
          if [ "$(echo "$TOTAL < $THRESHOLD" | bc -l)" = "1" ]; then
            echo "::error::Coverage ${TOTAL}% is below minimum threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${TOTAL}% meets minimum threshold ${THRESHOLD}%"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.out
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build all services
        working-directory: backend
        run: make build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        # Must match deploy/docker/docker-compose.yml — migration 000072
        # needs the pgvector extension, plain postgres images lack it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kmuhub_test
          POSTGRES_USER: kmuhub_test
          POSTGRES_PASSWORD: kmuhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kmuhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://kmuhub_test:kmuhub_test@localhost:5432/kmuhub_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-e2e-test-secret-minimum-32-characters
      GATEWAY_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.0

      - name: Run migrations
        run: migrate -path backend/migrations -database "$DATABASE_URL" up

      - name: Start MinIO
        # chat + document exit on startup without object storage. Same pinned
        # image as deploy/docker/docker-compose.yml; docker-run step because
        # GitHub service containers cannot pass the `server /data` command.
        # Credentials match the dev defaults in internal/config/config.go.
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=kmuhub -e MINIO_ROOT_PASSWORD=kmuhub_dev             minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "MinIO healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "MinIO failed to start"
              docker logs minio
              exit 1
            fi
            sleep 1
          done

      - name: Build services
        working-directory: backend
        run: |
          go build -o bin/auth ./cmd/auth
          go build -o bin/gateway ./cmd/gateway
          go build -o bin/crm ./cmd/crm
          go build -o bin/chat ./cmd/chat
          go build -o bin/work ./cmd/work
          go build -o bin/document ./cmd/document

      - name: Start auth service
        working-directory: backend
        run: |
          ./bin/auth > /tmp/auth.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9091/health > /dev/null 2>&1; then
              echo "Auth service healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Auth service failed to start"
              cat /tmp/auth.log
              exit 1
            fi
            sleep 1
          done

      - name: Start CRM service
        working-directory: backend
        run: |
          ./bin/crm > /tmp/crm.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9092/health > /dev/null 2>&1; then
              echo "CRM service healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "CRM service failed to start"
              cat /tmp/crm.log
              exit 1
            fi
            sleep 1
          done

      - name: Start chat service
        working-directory: backend
        run: |
          ./bin/chat > /tmp/chat.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9093/health > /dev/null 2>&1; then
              echo "Chat service healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Chat service failed to start"
              cat /tmp/chat.log
              exit 1
            fi
            sleep 1
          done

      - name: Start work service
        working-directory: backend
        run: |
          ./bin/work > /tmp/work.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9095/health > /dev/null 2>&1; then
              echo "Work service healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Work service failed to start"
              cat /tmp/work.log
              exit 1
            fi
            sleep 1
          done

      - name: Start document service
        working-directory: backend
        run: |
          ./bin/document > /tmp/document.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9097/health > /dev/null 2>&1; then
              echo "Document service healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Document service failed to start"
              cat /tmp/document.log
              exit 1
            fi
            sleep 1
          done

      - name: Start gateway service
        working-directory: backend
        run: |
          ./bin/gateway > /tmp/gateway.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Gateway service healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Gateway service failed to start"
              cat /tmp/gateway.log
              exit 1
            fi
            sleep 1
          done

      - name: Run E2E tests
        working-directory: backend
        run: go test -tags=e2e ./test/e2e/... -v -count=1

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== Auth Service Logs ==="
          cat /tmp/auth.log || true
          echo "=== CRM Service Logs ==="
          cat /tmp/crm.log || true
          echo "=== Chat Service Logs ==="
          cat /tmp/chat.log || true
          echo "=== Work Service Logs ==="
          cat /tmp/work.log || true
          echo "=== Document Service Logs ==="
          cat /tmp/document.log || true
          echo "=== Gateway Service Logs ==="
          cat /tmp/gateway.log || true

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [e2e]
    services:
      postgres:
        # Must match deploy/docker/docker-compose.yml — migration 000072
        # needs the pgvector extension, plain postgres images lack it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kmuhub_test
          POSTGRES_USER: kmuhub_test
          POSTGRES_PASSWORD: kmuhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kmuhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://kmuhub_test:kmuhub_test@localhost:5432/kmuhub_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-smoke-test-secret-minimum-32-characters
      SMOKE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.0

      - name: Run migrations
        run: migrate -path backend/migrations -database "$DATABASE_URL" up

      - name: Start MinIO
        # chat + document exit on startup without object storage. Same pinned
        # image as deploy/docker/docker-compose.yml; docker-run step because
        # GitHub service containers cannot pass the `server /data` command.
        # Credentials match the dev defaults in internal/config/config.go.
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=kmuhub -e MINIO_ROOT_PASSWORD=kmuhub_dev             minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "MinIO healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "MinIO failed to start"
              docker logs minio
              exit 1
            fi
            sleep 1
          done

      - name: Build and start services
        working-directory: backend
        run: |
          go build -o bin/auth ./cmd/auth
          go build -o bin/gateway ./cmd/gateway
          go build -o bin/crm ./cmd/crm
          go build -o bin/chat ./cmd/chat
          go build -o bin/work ./cmd/work
          go build -o bin/document ./cmd/document

          ./bin/auth > /tmp/auth.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9091/health > /dev/null 2>&1 && break; sleep 1; done

          ./bin/crm > /tmp/crm.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9092/health > /dev/null 2>&1 && break; sleep 1; done

          ./bin/chat > /tmp/chat.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9093/health > /dev/null 2>&1 && break; sleep 1; done

          ./bin/work > /tmp/work.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9095/health > /dev/null 2>&1 && break; sleep 1; done

          ./bin/document > /tmp/document.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9097/health > /dev/null 2>&1 && break; sleep 1; done

          ./bin/gateway > /tmp/gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health > /dev/null 2>&1 && break; sleep 1; done

      - name: Run smoke tests
        working-directory: backend
        run: go test -tags=smoke ./test/smoke/... -v -count=1

      - name: Dump service logs on failure
        if: failure()
        run: |
          for log in auth crm chat work document gateway; do
            echo "=== $log Service Logs ==="
            cat /tmp/$log.log || true
          done

  gosec:
    name: gosec (Go Security)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run gosec
        # gosec -conf only accepts JSON, not YAML — exclusions live here as
        # flags instead, mirroring the gosec excludes in backend/.golangci.yml.
        uses: securego/gosec@master
        with:
          args: >-
            -fmt sarif
            -out gosec.sarif
            -exclude=G101,G104,G108,G109,G115,G304,G402,G404
            -exclude-dir=proto
            ./backend/...

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gosec-sarif
          path: gosec.sarif
          retention-days: 30

  trivy:
    name: trivy (Filesystem Vuln Scan)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # trivy ignores the severity filter when emitting SARIF (by design, so
      # code scanning can filter), which made exit-code 1 fire on MEDIUM
      # findings too. Split: a table-format gate that actually enforces
      # HIGH/CRITICAL, plus a non-failing SARIF pass for the artifact.
      - name: Run trivy gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Run trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "0"
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy.sarif
          retention-days: 30

  npm-audit:
    name: npm audit (Desktop Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Run npm audit
        working-directory: desktop
        run: npm audit --audit-level=high --omit=dev

  openapi-validate:
    name: Validate OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OpenAPI spec
        run: npx --yes @apidevtools/swagger-cli validate backend/api/openapi.yaml
