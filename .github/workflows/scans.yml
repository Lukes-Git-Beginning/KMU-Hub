name: Scans

# Dependency / security scans. These change only when dependencies change, so
# they don't belong on the per-push hot path. They run weekly as a safety net,
# whenever a dependency manifest changes, and on demand. Split out of ci.yml on
# 2026-06-09 to cut per-push Actions minutes.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  push:
    branches: [main]
    paths:
      - "backend/go.mod"
      - "backend/go.sum"
      - "desktop/package-lock.json"
      - ".github/workflows/scans.yml"
  workflow_dispatch:

env:
  GO_VERSION: "1.25.6"

# Least-privilege token: scans only checkout + upload SARIF as artifacts (not to
# code-scanning), so read-only contents is sufficient. Add security-events:write
# only if an upload-sarif step is introduced.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec:
    name: gosec (Go Security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run gosec
        # gosec -conf only accepts JSON, not YAML — exclusions live here as
        # flags instead, mirroring the gosec excludes in backend/.golangci.yml.
        uses: securego/gosec@v2.27.1 # pinned from @master, 2026-06-05
        with:
          args: >-
            -fmt sarif
            -out gosec.sarif
            -exclude=G101,G104,G108,G109,G115,G304,G402,G404
            -exclude-dir=proto
            ./backend/...

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gosec-sarif
          path: gosec.sarif
          retention-days: 30

  trivy:
    name: trivy (Filesystem Vuln Scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      # Workspace-relative so the dir is mounted into the trivy Docker action;
      # persisted across runs so the vuln DB isn't re-downloaded every time.
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute cache week
        # Weekly cache key — the vuln DB is refreshed at most daily upstream, so
        # a per-week key reuses the download across runs (the old run_id key was
        # unique per run and never hit).
        id: cachekey
        run: echo "week=$(date +%Y-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache trivy vuln DB
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.trivycache
          key: trivy-db-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            trivy-db-

      # trivy ignores the severity filter when emitting SARIF (by design, so
      # code scanning can filter), which made exit-code 1 fire on MEDIUM
      # findings too. Split: a table-format gate that actually enforces
      # HIGH/CRITICAL, plus a non-failing SARIF pass for the artifact.
      - name: Run trivy gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0 # pinned from @master, 2026-06-05
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Run trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0 # pinned from @master, 2026-06-05
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "0"
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-sarif
          path: trivy.sarif
          retention-days: 30

  npm-audit:
    name: npm audit (Desktop Dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Run npm audit
        working-directory: desktop
        run: npm audit --audit-level=high --omit=dev

      # `--omit=dev` above hides electron, because npm lists it as a devDependency.
      # It is not a build tool: electron-builder bundles it and it IS the runtime our
      # users execute, so its advisories ship with the app. Audit it explicitly.
      - name: Run npm audit (shipped Electron runtime)
        working-directory: desktop
        # Runs even when the step above failed — that step reports a different
        # surface (production deps), and a failure there must not hide this one.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # --audit-level=none keeps the full vulnerability data but stops npm
          # from exiting non-zero just because findings exist, so a non-zero exit
          # here means an OPERATIONAL failure (ENOLOCK, registry down, ...).
          # Without this the `|| true` idiom would swallow those, and the error
          # payload — which has no `vulnerabilities` key — would read as "clean".
          if ! report=$(npm audit --json --audit-level=none); then
            echo "npm audit failed to produce a report:" >&2
            echo "$report" >&2
            exit 1
          fi
          node --input-type=commonjs -e '
            const raw = require("fs").readFileSync(0, "utf8");
            let a;
            try { a = JSON.parse(raw); } catch {
              console.error("npm audit did not return JSON:"); console.error(raw.slice(0, 2000)); process.exit(1);
            }
            if (a.error) { console.error("npm audit reported an error:", JSON.stringify(a.error)); process.exit(1); }
            if (!a.vulnerabilities) { console.error("npm audit JSON has no `vulnerabilities` key — refusing to call this clean."); process.exit(1); }

            const e = a.vulnerabilities.electron;
            if (!e) { console.log("electron: no advisories"); process.exit(0); }

            // `via` mixes advisory objects with plain strings; a string names a
            // dependency whose own advisory propagates here (meta-vulnerability).
            const direct = (e.via || []).filter((v) => v && typeof v === "object");
            const indirect = (e.via || []).filter((v) => typeof v === "string");
            const counts = direct.reduce((m, v) => ((m[v.severity] = (m[v.severity] || 0) + 1), m), {});
            const summary = Object.entries(counts).map(([s, n]) => `${n} ${s}`).join(", ");

            console.error(`electron ${e.range} is vulnerable (severity: ${e.severity})`);
            if (direct.length) console.error(`  ${direct.length} advisories${summary ? ": " + summary : ""}`);
            for (const v of direct) console.error(`  - [${v.severity}] ${v.title}`);
            if (indirect.length) console.error(`  via vulnerable dependencies: ${indirect.join(", ")}`);

            const fix = e.fixAvailable;
            if (fix && typeof fix === "object") {
              console.error(`fix available: ${fix.name}@${fix.version}${fix.isSemVerMajor ? " (semver-major)" : ""}`);
            } else if (fix === true) {
              console.error("fix available: run `npm audit fix`");
            } else {
              console.error("no fix available yet — assess exposure and document the acceptance");
            }
            process.exit(1);
          ' <<< "$report"
