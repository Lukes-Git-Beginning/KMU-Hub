name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "Skip database backup before deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Least-privilege token: the deploy runs on a self-hosted runner via local
# scripts + webhook secrets — GITHUB_TOKEN is unused, so read-only is enough.
permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/kmuhub

jobs:
  deploy:
    name: Deploy to Production
    # Self-hosted runner on the production host (deploy user). The deploy runs
    # locally — no SSH hop, no idle GitHub-hosted minutes. Only cd.yml targets
    # this label; CI/nightly/scans stay on ubuntu-latest for isolation.
    runs-on: [self-hosted, kmuhub-prod]
    # Serial 24-service build (~19 min, OOM if parallelised on 16 GB) + DB migration
    # + recreate + smoke can exceed 20 min when a shared proto forces wide rebuilds.
    timeout-minutes: 40
    environment: production
    # For workflow_run trigger: only deploy when CI succeeded.
    # workflow_dispatch bypasses this check (manual override).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Deploy
        # Runs directly on the production host (self-hosted runner as the deploy
        # user) — no SSH hop, no checkout. deploy.sh operates on /opt/kmuhub and
        # does its own `git pull` via the server-local github_deploy key.
        # - sudo: deploy.sh needs root for compose/build (deploy has passwordless
        #   sudo); GIT_SSH_COMMAND is forwarded by sudo's NAME=value parsing.
        # Smoke tests run inside deploy.sh; a failing smoke triggers auto-rollback.
        run: |
          DEPLOY_FLAGS=""
          if [[ "${{ inputs.skip_backup }}" == "true" ]]; then
            DEPLOY_FLAGS="--skip-backup"
          fi

          cd ${{ env.DEPLOY_PATH }}
          sudo GIT_SSH_COMMAND='ssh -i /home/deploy/.ssh/github_deploy' bash deploy/scripts/deploy.sh --force $DEPLOY_FLAGS

      - name: Post-deploy smoke check
        run: |
          echo "Waiting for services to stabilize..."
          sleep 10

          HEALTH=$(curl -sf --max-time 10 https://app.zentria.tech/health || echo '{"status":"unreachable"}')
          echo "Health response: $HEALTH"

          STATUS=$(echo "$HEALTH" | jq -r '.status' 2>/dev/null || echo "unknown")
          if [[ "$STATUS" != "healthy" ]]; then
            echo "::error::Post-deploy health check failed: status=$STATUS"
            exit 1
          fi

          VERSION=$(echo "$HEALTH" | jq -r '.version // "unknown"' 2>/dev/null)
          COMMIT=$(echo "$HEALTH" | jq -r '.commit // "unknown"' 2>/dev/null)
          echo "Deployed version: $VERSION (commit: $COMMIT)"

      - name: Notify Discord on success
        if: success()
        run: |
          curl -s -X POST "${{ secrets.ALERT_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\":white_check_mark: Deploy to production succeeded — commit \`${{ github.sha }}\`\"}"

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.ALERT_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\":x: Deploy to production FAILED — commit \`${{ github.sha }}\` — check <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run>\"}"
