name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "Skip database backup before deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 178.104.38.195
  DEPLOY_USER: deploy
  DEPLOY_PATH: /opt/kmuhub

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    # For workflow_run trigger: only deploy when CI succeeded.
    # workflow_dispatch bypasses this check (manual override).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        # Invocation matches the documented manual deploy:
        # - sudo: deploy.sh needs root for compose/build operations
        # - GIT_SSH_COMMAND: git pull inside deploy.sh authenticates with the
        #   server-local github_deploy key
        # - --skip-smoke: legacy smoke issues open (POST /contacts 403,
        #   OnlyOffice JWT) — the post-deploy health check below covers
        #   basic verification until those are fixed
        run: |
          DEPLOY_FLAGS=""
          if [[ "${{ inputs.skip_backup }}" == "true" ]]; then
            DEPLOY_FLAGS="--skip-backup"
          fi

          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && sudo GIT_SSH_COMMAND='ssh -i /home/deploy/.ssh/github_deploy' bash deploy/scripts/deploy.sh --force --skip-smoke $DEPLOY_FLAGS"

      - name: Post-deploy smoke check
        run: |
          echo "Waiting for services to stabilize..."
          sleep 10

          HEALTH=$(curl -sf --max-time 10 https://app.zentria.tech/health || echo '{"status":"unreachable"}')
          echo "Health response: $HEALTH"

          STATUS=$(echo "$HEALTH" | jq -r '.status' 2>/dev/null || echo "unknown")
          if [[ "$STATUS" != "healthy" ]]; then
            echo "::error::Post-deploy health check failed: status=$STATUS"
            exit 1
          fi

          VERSION=$(echo "$HEALTH" | jq -r '.version // "unknown"' 2>/dev/null)
          COMMIT=$(echo "$HEALTH" | jq -r '.commit // "unknown"' 2>/dev/null)
          echo "Deployed version: $VERSION (commit: $COMMIT)"

      - name: Notify Discord on success
        if: success()
        run: |
          curl -s -X POST "${{ secrets.ALERT_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\":white_check_mark: Deploy to production succeeded — commit \`${{ github.sha }}\`\"}"

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.ALERT_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\":x: Deploy to production FAILED — commit \`${{ github.sha }}\` — check <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run>\"}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
