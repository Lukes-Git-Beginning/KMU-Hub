name: Runner Healthcheck

# Manual-only smoke test for the self-hosted production runner. Verifies the
# runner picks up jobs and the deploy user's environment works (sudo, docker,
# the /opt/kmuhub git checkout) — WITHOUT running a deploy. Read-only, safe to
# run any time. Used to validate the runner before cd.yml is switched over.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Runner Smoke Test
    runs-on: [self-hosted, kmuhub-prod]
    timeout-minutes: 5
    steps:
      - name: Identity + environment
        run: |
          echo "whoami:  $(whoami)"
          echo "pwd:     $(pwd)"
          echo "PATH:    $PATH"

      - name: Passwordless sudo (the deploy.sh path)
        run: |
          sudo -n true && echo "passwordless sudo: OK"

      - name: Docker access via sudo (deploy.sh runs as root)
        run: |
          sudo docker ps --format '{{.Names}}' | head -30

      - name: Deploy checkout reachable
        run: |
          cd /opt/kmuhub
          echo "git HEAD: $(git rev-parse --short HEAD)"
          test -f deploy/scripts/deploy.sh && echo "deploy.sh present: OK"
