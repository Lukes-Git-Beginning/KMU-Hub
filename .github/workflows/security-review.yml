name: Security Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    name: Claude Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Run Claude Security Review
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # pinned from @main, 2026-06-05 — no release tags exist, SHA of HEAD (2026-02-11)
        with:
          claude-api-key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          comment-pr: true
          upload-results: true
          exclude-directories: "desktop/design-reference,.planning,.claude/get-shit-done,desktop/scripts/asset-gen"
          custom-security-scan-instructions: |
            Focus areas for KMU Hub CRM:
            - Authentication and authorization (JWT handling, session management)
            - SQL injection in Go backend (must use prepared statements)
            - XSS in React/TypeScript frontend
            - CORS misconfiguration (must use explicit allowlist, no wildcard)
            - CSRF protection for mutating endpoints
            - Secrets in code (API keys, passwords, tokens)
            - Input validation at system boundaries
            - DSGVO/GDPR compliance (PII handling, data export/deletion)
            - IPC security in Electron (preload scripts, context isolation)
            - gRPC service-to-service authentication
