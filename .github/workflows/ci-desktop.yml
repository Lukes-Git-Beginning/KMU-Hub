name: CI Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/ci-desktop.yml"

# Least-privilege token: jobs only checkout + run npm — read-only is sufficient.
permissions:
  contents: read

# Cancel superseded runs on the same ref to avoid burning Actions minutes on
# commits that a later push has already obsoleted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck and test have no inter-dependencies, so they share one
  # runner and a single `npm ci` instead of spinning up three jobs that each
  # re-download the (heavy, Electron) node_modules from scratch.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        working-directory: desktop
        run: npm run lint

      - name: TypeScript type check
        working-directory: desktop
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: desktop
        run: npx vitest run --passWithNoTests

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build desktop app
        working-directory: desktop
        run: npm run build
