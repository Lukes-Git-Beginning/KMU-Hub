name: CI Desktop

on:
  push:
    branches: [main, develop]
    paths:
      - "desktop/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "desktop/**"
      - ".github/workflows/ci-desktop.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: rm package-lock.json && npm install --no-audit --no-fund

      - name: Run ESLint
        working-directory: desktop
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: rm package-lock.json && npm install --no-audit --no-fund

      - name: TypeScript type check
        working-directory: desktop
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: rm package-lock.json && npm install --no-audit --no-fund

      - name: Run tests
        working-directory: desktop
        run: npx vitest run --passWithNoTests

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: rm package-lock.json && npm install --no-audit --no-fund

      - name: Build desktop app
        working-directory: desktop
        run: npm run build
