<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    CSP: style-src 'unsafe-inline' is required in development only (Vite HMR injects inline styles).
    In production builds, Tailwind v4 compiles to a CSS file so only 'self' is needed.
    TODO: Use environment-conditional CSP for production builds.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:8080 http://localhost:8080 https://app.zentria.tech wss://app.zentria.tech; img-src 'self' data: blob:; font-src 'self'" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Cosmi</title>
</head>
<body>
  <div id="root">
    <!-- Skeleton shown until React hydrates -->
    <div id="app-skeleton" style="display:flex;height:100vh;background:#0a0a0f;color:#a1a1aa;font-family:system-ui,sans-serif">
      <!-- Sidebar skeleton -->
      <div style="width:220px;background:#111118;padding:16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #1e1e2e">
        <div style="width:100px;height:24px;background:#1e1e2e;border-radius:6px"></div>
        <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
          <div style="width:100%;height:36px;background:#1e1e2e;border-radius:6px"></div>
          <div style="width:100%;height:36px;background:#1e1e2e;border-radius:6px"></div>
          <div style="width:100%;height:36px;background:#1e1e2e;border-radius:6px"></div>
          <div style="width:100%;height:36px;background:#1e1e2e;border-radius:6px"></div>
          <div style="width:100%;height:36px;background:#1e1e2e;border-radius:6px"></div>
        </div>
      </div>
      <!-- Main content skeleton -->
      <div style="flex:1;padding:24px;display:flex;flex-direction:column;gap:16px">
        <div style="width:200px;height:32px;background:#1e1e2e;border-radius:8px"></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
          <div style="height:120px;background:#111118;border-radius:12px;border:1px solid #1e1e2e"></div>
          <div style="height:120px;background:#111118;border-radius:12px;border:1px solid #1e1e2e"></div>
          <div style="height:120px;background:#111118;border-radius:12px;border:1px solid #1e1e2e"></div>
        </div>
        <div style="flex:1;background:#111118;border-radius:12px;border:1px solid #1e1e2e"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
