<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    CSP: style-src 'unsafe-inline' is required in development only (Vite HMR injects inline styles).
    In production builds, Tailwind v4 compiles to a CSS file so only 'self' is needed.
    TODO: Use environment-conditional CSP for production builds.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:8080 http://localhost:8080 https://app.zentria.tech wss://app.zentria.tech; img-src 'self' data: blob:; font-src 'self'" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Cosmi</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
