appId: tech.zentria.kmuhub
productName: KMU Hub
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
win:
  target: nsis
  icon: build/icon.png
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KMU Hub
