appId: tech.zentria.cosmi
productName: Cosmi
directories:
  buildResources: build
  output: dist
extraResources:
  - from: src/main/resources/
    to: resources/
    filter:
      - "**/*"
files:
  - out/**/*
win:
  target: nsis
  icon: build/icon.ico
  # true → electron-builder editiert die .exe via rcedit (brennt Icon + Version
  # ein). Bei false bleibt das Electron-Default-Icon. Signieren passiert nur mit
  # konfiguriertem Zertifikat (sonst übersprungen) — der Icon-Edit greift trotzdem.
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cosmi
