appId: tech.zentria.cosmi
productName: Cosmi
directories:
  buildResources: build
  output: dist
extraResources:
  - from: src/main/resources/
    to: resources/
    filter:
      - "**/*"
files:
  - out/**/*
win:
  target: nsis
  icon: build/icon.png
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cosmi
