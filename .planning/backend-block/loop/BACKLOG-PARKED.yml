        Datumsinterpolation. Erwartete Formen: `GuestMilestone{id,title,dueDate,status,progress}`
        und `GuestStatusUpdate{id,date,author,text,type}`
        (`api/hooks/useProjects.ts:41-54`, Aufruf `:536-545` gegen
        `GET /api/v1/projects/{id}/guest-overview` — 0 Treffer im Backend).
      FRONTEND-FOLGEARBEIT: `GuestProjectView.tsx`, den MSW-Handler und
      `useProjectGuestOverview` im Zuge der Streichung entfernen, damit kein totes Mock-UI
      stehen bleibt.
      FALLS ES ZURÜCKKOMMT: der billigste Zuschnitt ist eine INTERNE Projektübersicht ohne
      Gast — `start_date`/`end_date`/`completed_task_count` ans Projektmodell, Rest aus echten
      `tasks`-Daten, Meilensteine entfallen, "Status-Updates" aus Task-Abschlüssen abgeleitet.

