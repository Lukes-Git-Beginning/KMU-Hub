  - id: a-inbox-sla
    service: inbox
    status: dropped
    decided: 2026-08-10
    decision: >
      Aus dem Scope genommen. Ausschlaggebend war nicht die Backend-Lücke, sondern dass auch
      das Frontend nichts davon verlangt: `desktop/src/renderer/src/**/inbox/**` hat 0 Treffer
      für `sla|overdue|überfällig`. Es gibt also weder eine Anzeige noch einen Filter, den
      eine Frist bedienen würde — die Unit hätte Datenmodell und Semantik erfunden, die
      niemand abruft.
    scope: >
      SLA-Verfolgung im Posteingang: Reaktions- und Lösungsfrist je Nachricht, Filter auf
      überfällige Vorgänge.
    notes: >
      Befundlage am 2026-08-10: `sla_policies` existiert (Migration
      `000077_create_helpdesk.up.sql:4-13`, Spalten `id, tenant_id, name, first_response_mins,
      resolution_mins, business_hours, created_at, updated_at`), hängt aber ausschließlich an
      `ticket_queues.sla_policy_id` (Z. 20) und wird nur von `internal/helpdesk` gelesen
      (`sla.go`, `service.go`, `models.go`, `repository.go`, `postgres_repository.go`).
      `sla_policies` taucht in genau vier Migrationsdateien auf: 000077 (Create + Down) und
      000122 (`CALL enable_tenant_rls('sla_policies')` + Down, Z. 111) — keine davon fügt eine
      Verknüpfung zu `team_inboxes` hinzu. Die Inbox-Migrationen (000047, 000110, 000124)
      legen keine `sla_policy_id`-Spalte an. `backend/internal/inbox/**` hat 0 Treffer für
      `sla|due_at|first_response|resolution`.
      WENN ES ZURÜCKKOMMT: eine EIGENE Inbox-Policy-Tabelle mit Zuordnung pro `team_inbox` ist
      der saubere Weg. `team_inboxes.sla_policy_id` auf Helpdesks Tabelle zu zeigen wäre zwar
      billiger, koppelt aber zwei bisher unabhängige Bounded Contexts dauerhaft.

  - id: fe-projects-guest-overview
    service: work
    status: dropped
    decided: 2026-08-10
    decision: >
      Aus dem Scope genommen bis nach dem Launch. Die Unit hängt an derselben fehlenden
      öffentlichen Oberfläche wie CSAT und die sieben Public-Token-Routen, PLUS an zwei neuen
      Datenmodellen, PLUS an einem Projekt-Gastzugang, den es nicht gibt. Drei ungelöste
      Voraussetzungen für eine Ansichtsseite ist kein Zuschnitt, den man vor dem 01.09. angeht.
    scope: >
      Gast-Projektübersicht mit Meilensteinen und Status-Updates.
    notes: >
      Am 2026-08-10 verifiziert, und die Lage ist schlechter als die alte `blocked_reason`
      sagte:
      - Kein Meilenstein-/Status-Update-Modell. 0 Treffer für
        `milestone|meilenstein|status_update|project_update` in `backend/migrations/**`,
        `backend/internal/work/**`, `backend/internal/models/**`.
      - AUCH DER "ECHTE" TEIL DER SEITE BRICHT: `GuestProjectView.tsx:52-58` liest
        `project.completed_task_count`, `project.start_date` und `project.end_date`. Keines
        existiert. `models/project.go:24-45` kennt weder Start- noch Enddatum, und
        `ProjectWithDetails` trägt nur `MemberCount`, `TaskCount`, `OwnerName`
        (`work/project/postgres_repository.go:54-55` berechnet die beiden per Subquery);
        `completed_task_count` kommt im Backend nirgends vor. Migration
        `000024_create_projects.up.sql:8-20` hat kein `start_date`/`end_date`.
      - Kein Projekt-Gastzugang. `backend/internal/gateway/route_guest.go:43-56` ist
        ausschließlich Chat-Gast (`/api/v1/guest/sessions`, `X-Guest-Token`, Kanal-Nachrichten);
        für Projekte gibt es kein `public_token`- oder Share-Konzept.
      - Der FE-Mock ist reine Fiktion: `GuestProjectView.tsx:1-8` sagt es selbst
        ("Mock data for design — backend swap"), `mocks/handlers/work.ts:1087-1128` generiert
        Meilensteine und Status-Updates synthetisch aus einem Titel-Array mit
        Datumsinterpolation. Erwartete Formen: `GuestMilestone{id,title,dueDate,status,progress}`
        und `GuestStatusUpdate{id,date,author,text,type}`
        (`api/hooks/useProjects.ts:41-54`, Aufruf `:536-545` gegen
        `GET /api/v1/projects/{id}/guest-overview` — 0 Treffer im Backend).
      FRONTEND-FOLGEARBEIT: `GuestProjectView.tsx`, den MSW-Handler und
      `useProjectGuestOverview` im Zuge der Streichung entfernen, damit kein totes Mock-UI
      stehen bleibt.
      FALLS ES ZURÜCKKOMMT: der billigste Zuschnitt ist eine INTERNE Projektübersicht ohne
      Gast — `start_date`/`end_date`/`completed_task_count` ans Projektmodell, Rest aus echten
      `tasks`-Daten, Meilensteine entfallen, "Status-Updates" aus Task-Abschlüssen abgeleitet.

