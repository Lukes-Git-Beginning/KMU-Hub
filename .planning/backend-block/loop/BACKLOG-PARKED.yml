    scope: >
      Build-Stage für `guest-chat` in `Dockerfile.gateway`, Ergebnis nach `guest-chat/dist`
      ins Gateway-Image.
    notes: >
      Doppelt nützlich: derselbe Build-Schritt ist der Trittstein für die Public Web Surface —
      das Muster "Gateway serviert eine statische SPA unter einem Präfix" wäre damit einmal
      real durchgezogen statt nur angelegt.
    target: >
      Projekt "Public Web Surface" bzw. eine Deploy-Session. Vor dem Launch prüfen, ob der
      Guest-Chat überhaupt im Scope ist — sonst ersatzlos ausbauen statt reparieren.

  # ==========================================================================================
