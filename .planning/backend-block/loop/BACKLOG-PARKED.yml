      Gast-Projektübersicht mit Meilensteinen und Status-Updates.
    notes: >
      Am 2026-08-10 verifiziert, und die Lage ist schlechter als die alte `blocked_reason`
      sagte:
      - Kein Meilenstein-/Status-Update-Modell. 0 Treffer für
        `milestone|meilenstein|status_update|project_update` in `backend/migrations/**`,
        `backend/internal/work/**`, `backend/internal/models/**`.
      - AUCH DER "ECHTE" TEIL DER SEITE BRICHT: `GuestProjectView.tsx:52-58` liest
        `project.completed_task_count`, `project.start_date` und `project.end_date`. Keines
