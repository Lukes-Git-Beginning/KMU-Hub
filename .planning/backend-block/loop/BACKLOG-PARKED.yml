  - id: a-inbox-sla
    service: inbox
    status: dropped
    decided: 2026-08-10
    decision: >
      Aus dem Scope genommen. Ausschlaggebend war nicht die Backend-Lücke, sondern dass auch
      das Frontend nichts davon verlangt: `desktop/src/renderer/src/**/inbox/**` hat 0 Treffer
      für `sla|overdue|überfällig`. Es gibt also weder eine Anzeige noch einen Filter, den
      eine Frist bedienen würde — die Unit hätte Datenmodell und Semantik erfunden, die
      niemand abruft.
    scope: >
      SLA-Verfolgung im Posteingang: Reaktions- und Lösungsfrist je Nachricht, Filter auf
      überfällige Vorgänge.
    notes: >
      Befundlage am 2026-08-10: `sla_policies` existiert (Migration
      `000077_create_helpdesk.up.sql:4-13`, Spalten `id, tenant_id, name, first_response_mins,
      resolution_mins, business_hours, created_at, updated_at`), hängt aber ausschließlich an
      `ticket_queues.sla_policy_id` (Z. 20) und wird nur von `internal/helpdesk` gelesen
      (`sla.go`, `service.go`, `models.go`, `repository.go`, `postgres_repository.go`).
      `sla_policies` taucht in genau vier Migrationsdateien auf: 000077 (Create + Down) und
      000122 (`CALL enable_tenant_rls('sla_policies')` + Down, Z. 111) — keine davon fügt eine
      Verknüpfung zu `team_inboxes` hinzu. Die Inbox-Migrationen (000047, 000110, 000124)
      legen keine `sla_policy_id`-Spalte an. `backend/internal/inbox/**` hat 0 Treffer für
      `sla|due_at|first_response|resolution`.
      WENN ES ZURÜCKKOMMT: eine EIGENE Inbox-Policy-Tabelle mit Zuordnung pro `team_inbox` ist
      der saubere Weg. `team_inboxes.sla_policy_id` auf Helpdesks Tabelle zu zeigen wäre zwar
      billiger, koppelt aber zwei bisher unabhängige Bounded Contexts dauerhaft.

  - id: fe-projects-guest-overview
    service: work
    status: dropped
    decided: 2026-08-10
    decision: >
      Aus dem Scope genommen bis nach dem Launch. Die Unit hängt an derselben fehlenden
      öffentlichen Oberfläche wie CSAT und die sieben Public-Token-Routen, PLUS an zwei neuen
      Datenmodellen, PLUS an einem Projekt-Gastzugang, den es nicht gibt. Drei ungelöste
