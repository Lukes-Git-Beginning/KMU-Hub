        `000024_create_projects.up.sql:8-20` hat kein `start_date`/`end_date`.
      - Kein Projekt-Gastzugang. `backend/internal/gateway/route_guest.go:43-56` ist
        ausschließlich Chat-Gast (`/api/v1/guest/sessions`, `X-Guest-Token`, Kanal-Nachrichten);
