  - id: harden-lexware-webhook-organization-id-scoping
    phase: 4
    service: biz
    model: opus
    deps: []
    status: parked
    decided: 2026-08-24
    decision: >-
      TEURE HAELFTE GEPARKT, billige Vorbereitung ausgegliedert. Entscheidung Luke 2026-08-24
      (A3). Der Webhook-Pfad bleibt ungefixt, weil heute genau ein Lexware-Tenant aktiv ist -
      der Schaden ist nicht real, und der Fix braucht ein Unterscheidungsmerkmal, das es im
      Datenmodell noch gar nicht gibt. Die Vorbereitung dafuer laeuft als eigene Unit in
      BACKLOG.yml (`feat-lexware-store-organization-id-on-connect`): sie schreibt die
      `organization_id` beim Connect und beim Verbindungstest in die Config-Metadata. Ohne
      diesen Wert ist DIESER Fix spaeter gar nicht baubar, deshalb wird er jetzt schon
      angelegt.
    target: >-
      Zurueck nach BACKLOG.yml, sobald ein ZWEITER Lexware-Tenant aktiv ist. Voraussetzung:
      `feat-lexware-store-organization-id-on-connect` ist `done` und die Configs tragen den
      Wert. Der Fix ist dann: `HandleWebhookEvent` loest die Config ueber die
      `organization_id` aus dem Webhook-Body auf, statt ueber `GetByPlatform(ctx, "lexware")`
      unter Systemkontext. Bringt ein Webhook keine `organization_id` mit, wird er abgelehnt
      statt geraten.
    blocked_reason: "ENTSCHEIDUNG GEHOERT LUKE (Variante a/b/c, siehe notes) — kein Loop-Auftrag; stand seit Iteration 86 als todo am Backlog-Kopf und wurde in jeder Iteration uebersprungen. Wieder auf todo setzen, sobald Luke die Variante gewaehlt hat."
    coverage_start: "n.a. (Datenmodell-Entscheidung vor jeder Coverage-Zahl, siehe scope)"
    scope: >
      Restrisiko aus fix-lexware-config-lookup-cross-tenant-under-sysctx (Iteration 86):
      der Scheduler-Pfad (SyncContacts) ist gefixt (der Ticker übergibt jetzt sein eigenes
      `ts.configID` statt es unter Systemkontext neu über `GetByPlatform` aufzulösen,
      analog zu bexios `PullInvoicesWithConfig`-Muster). Der WEBHOOK-Pfad
      (`Service.HandleWebhookEvent`, `internal/biz/lexware/service.go:262-280`) bleibt
      bewusst UNGEFIXT: er läuft unter `sysctx.With(ctx)` (kein Tenant im Context, die
      Anfrage kommt von Lexware, authentifiziert per HMAC über `LEXWARE_WEBHOOK_SECRET`)
      und ruft `s.configRepo.GetByPlatform(ctx, "lexware")` — bei mehr als einem aktiven
      Lexware-Tenant kann das die Config eines FREMDEN Tenants zurückgeben, und
      `webhookHandler.HandleEvent` verarbeitet das Event danach mit dessen
      `config.ID`/`config.TenantID`.
      Anders als beim Scheduler-Pfad kennt der Aufrufer die `tenantID` hier VOR dem
      Lookup nicht — der Webhook trägt keine Tenant-Info, nur eine Lexware-Ressourcen-ID
      (`resource_id`) und optional eine `organization_id`
      (`internal/gateway/route_lexware.go:579-592` liest sie aus dem Body, camelCase
      oder snake_case). Diese `organization_id` wird aber NIRGENDS beim Verbinden
      gespeichert: `Service.Connect` (`service.go:78-125`) legt die Config nur mit
      `Metadata: map[string]any{"auth_type": "api_key"}` an — keine Lexware-Organisations-
      Kennung. Ein Abgleich "Webhook-OrgID gegen gespeicherte Config-OrgID" ist also HEUTE
      technisch nicht möglich, das Feld existiert nicht.
      Ebenso ist `LEXWARE_WEBHOOK_SECRET` ein einziges globales Secret
      (`internal/gateway/route_lexware.go:517-531`), kein Secret pro Tenant — die
      HMAC-Prüfung kann also nicht zur Tenant-Unterscheidung dienen, nur zur
      Herkunftsprüfung "kommt wirklich von Lexware".
    sources:
      - backend/internal/biz/lexware/service.go
      - backend/internal/biz/lexware/webhook_handler.go
      - backend/internal/gateway/route_lexware.go
      - backend/internal/biz/lexware/profile.go
      - backend/internal/biz/lexware/postgres_config_repo.go
    notes: >
      ENTSCHEIDUNG GEHÖRT LUKE, nicht dem Loop: mindestens zwei valide Wege, keiner
      trivial nebenbei zu bauen.
      (a) `organization_id` bei `Connect` per `GET /v1/profile`-Call abfragen
      (`LexwareProfile.OrganizationID`, bereits genutzt in `TestConnection`,
      `profile.go:15`) und in `IntegrationConfig.Metadata` speichern; `GetByPlatform`
      um eine `GetByPlatformAndOrgID`- oder `GetActiveByPlatform`-Variante ergänzen, die
      im Systemkontext über ALLE aktiven Configs iteriert und die mit passender
      `organization_id` aus dem Webhook-Payload wählt (analog zu bexios
      `ListActiveByPlatform`, `bexio/scheduler.go:48`, das bereits über mehrere Configs
      iterieren kann).
      (b) pro Tenant einen eigenen Webhook-Pfad/eigenes Secret ausgeben (z. B.
      `/api/v1/integrations/lexware/webhooks/{config_id}` mit Secret aus dem Vault statt
      der globalen Env-Var) — verändert den bei Lexware zu hinterlegenden Callback-URL,
      ist also ein Vertrag mit einem externen System, nicht nur interner Code.
      Solange das System produktiv Single-Tenant je Plattform läuft (Kommentar
      `retention_scheduler.go:15-16`), ist der Bug latent, nicht aktiv ausgenutzt — genau
      wie beim Bexio-Pendant. Kein Grund, ihn liegen zu lassen, aber auch kein Grund für
      eine überstürzte Lösung ohne Rücksprache: G2 (Geld-/Compliance-Pfade vor dem ersten
      zahlenden Kunden) verlangt den Fix VOR dem zweiten aktiven Lexware-Tenant, nicht
      sofort.
      `.proto`/Migrationen nur falls (a) gewählt wird und `organization_id` dauerhaft
      persistiert werden soll — Nummer zur Laufzeit ermitteln, forward-only.
    done_when:
      - Entscheidung (a), (b) oder eine dritte, von Luke freigegebene Variante liegt vor
        und ist im Journal begründet
      - HandleWebhookEvent wählt die Config nachweislich anhand eines
        Tenant-eindeutigen Merkmals (nicht mehr "erste Zeile für platform=lexware")
      - Ein Test mit zwei aktiven Lexware-Configs (zwei Tenants, zwei organization_ids
        oder zwei Webhook-Secrets, je nach gewählter Variante) belegt, dass ein
        eingehender Webhook nachweislich beim richtigen Tenant landet
      - go test -count=1 ./internal/biz/lexware/... ./internal/gateway/ gruen

  - id: fix-crm-tag-endpoints-are-501-stubs
    phase: 4
    service: gateway
    model: opus
    deps: []
    status: parked
    decided: 2026-08-24
    decision: >-
      DUBLETTE, aufgeloest durch Entscheidung Luke 2026-08-24 (A1). Diese Unit und
      `feat-crm-activity-deal-tag-rpcs` beschreiben denselben Sachverhalt aus zwei Richtungen;
      Iteration 97 hatte hier beide Wege als verschlossen gemeldet und die Entscheidung an
      Luke gegeben. Entschieden ist WEG A - die vier gRPC-RPCs werden gebaut. Die Arbeit steht
      vollstaendig in `feat-crm-activity-deal-tag-rpcs` (BACKLOG.yml, `status: todo`,
      `model: opus`), inklusive der Begruendung und der Vorabpruefung am Frontend.
      Zwei Units fuer eine Arbeit haben in Lauf 11 zwei Iterationen gekostet, die beide nur
      gelesen und weitergezogen haben.
    target: >-
      Keine eigene Rueckkehr vorgesehen - die Arbeit lebt in
      `feat-crm-activity-deal-tag-rpcs` weiter. Dieser Eintrag bleibt als Spur, damit ein
      spaeterer Scan den 501-Befund nicht ein drittes Mal als neue Unit anlegt.
    blocked_reason: >
      Beide im scope vorgesehenen Wege sind in Iteration 97 verschlossen. Durchreichen geht
      nicht: `proto/crm/v1/crm.proto` hat Tag-RPCs nur fuer Contacts
      (`AddContactTags`/`RemoveContactTags`, Zeilen 28/29); `AddActivityTags`,
      `RemoveActivityTags`, `AddDealTags`, `RemoveDealTags` existieren weder als RPC noch als
      Message, und in `internal/proto/crm/v1/` gibt es keine passenden generierten Typen. Vier
      neue RPCs anzulegen ist laut notes dieser Unit ausdruecklich Lukes Entscheidung.
      Entfernen geht ebenfalls nicht guten Gewissens: die Annahme des scope, dass ohne RPC
      auch keine Faehigkeit da ist, ist falsch. Die Fachlogik ist vollstaendig gebaut und
      tenant-gescoped — `activity.Service.AddTags/RemoveTags` (activity/service.go:441/466),
      `deal.Service.AddTags/RemoveTags` (deal/service.go:458/483), beide inkl.
      Tag-Existenzpruefung ueber `TagExists`, dazu Repository-Methoden, die Join-Tabellen
      `activity_tags`/`deal_tags` (Migration 000006, `tenant_id` seit 000111) und die
      Permission-Guards `activities:write`/`deals:write` am Router (route_crm.go:165/166/178/179).
      Die openapi-Eintraege beschreiben den Vertrag bereits fertig
      (`200` + `DealResponse`/`ActivityResponse`, openapi.yaml:2731/2964) — genau das, was die
      Services liefern koennen. Es fehlt ausschliesslich der gRPC-Hop. Beide Service-Methoden
      haben aktuell null Nicht-Test-Aufrufer (verifiziert per grep), sind also toter Code.
      Vier fertig spezifizierte, fachlich implementierte Endpunkte zu loeschen, weil eine
      Verdrahtungsschicht fehlt, ist eine Produktentscheidung, keine Loop-Aufgabe.
      Entscheidungsvorlage als Unit `feat-crm-activity-deal-tag-rpcs` am Backlog-Ende.
    coverage_start: "internal/gateway 56,6 % (gemessen Iteration 93)"
    scope: >
      Verifizierter Befund von `TestOpenAPIStatusCodeDrift` (Iteration 93): vier registrierte,
      in `api/openapi.yaml` dokumentierte CRM-Routen sind dauerhafte Stubs und antworten
      immer `501 Not Implemented`:
      `POST` und `DELETE /api/v1/activities/{id}/tags` (route_crm_activities.go:300 und :312,
      "add/remove activity tags not implemented via HTTP, use gRPC") sowie
      `POST` und `DELETE /api/v1/deals/{id}/tags` (route_crm_pipeline.go:500 und :512).
      Fuer einen FE-Aufrufer sind das vier Endpunkte, die es laut Spec gibt und die nie
      funktionieren. Zu klaeren ist, ob der gRPC-Weg existiert (dann Handler ueber den
      Client durchreichen und die Fehlerklasse "Stub statt Implementierung" schliessen) oder
      nicht (dann Routen und Spec-Eintraege entfernen).
      Ebenfalls in der Liste, aber bewusst getrennt: `route_integration.go:609`
      ("slack oauth install is not available on this deployment") - das ist ein
      absichtliches Deployment-Nein, kein Stub, und bleibt.
    sources:
      - backend/internal/gateway/route_crm_activities.go
      - backend/internal/gateway/route_crm_pipeline.go
      - backend/api/openapi.yaml
    notes: >
      Erst pruefen, ob der CRM-Service die passenden RPCs ueberhaupt hat. Kein `.proto`
      erweitern, ohne im selben Commit zu regenerieren - und waere dafuer ein neuer RPC
      noetig, ist das eine Entscheidung fuer Luke, dann `blocked` mit Begruendung.
      Werden Routen entfernt: `TestOpenAPISpecDrift` und `TestOpenAPIMethodDrift` erzwingen,
      dass die Spec-Eintraege im selben Commit mitgehen.
    done_when:
      - Fuer alle vier Routen ist entschieden und umgesetzt (durchgereicht oder entfernt)
      - Kein Handler in route_crm_activities.go oder route_crm_pipeline.go antwortet mehr 501
      - Die vier Eintraege sind aus statusDriftBaseline entfernt
