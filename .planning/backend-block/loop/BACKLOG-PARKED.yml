      eine Electron-App, also unmöglich", sondern "das Muster existiert, es ist nur für diese
      sieben Routen nicht gebaut". Siehe Block-Kopf.
    scope: >
      Öffentliche Weboberfläche, in der ein Empfänger die Public-Token-Routen einlöst.
    notes: >
      Genau sieben Registrare, alle am 2026-08-10 verifiziert
      (`backend/cmd/gateway/main.go:359,365,370,376,382,389,395`):
        1. `GET /api/v1/public/booking-pages/{slug}` + `/availability` + `POST /public/bookings`
           — `route_booking.go:77-81`
        2. `POST /api/v1/public/berichte/reports/{token}`   — `route_berichte.go:151`
        3. `POST /api/v1/public/documents/share/{token}`    — `route_document.go:204`
        4. `POST /api/v1/public/automations/webhooks/{id}`  — `route_automation.go:123`
        5. `POST /api/v1/public/helpdesk/csat/{token}`      — `route_helpdesk.go:144`
        6. `POST /api/v1/public/formulare/submit/{token}`   — `route_formulare.go:156`
        7. `POST /api/v1/public/wiki/articles/{token}`      — `route_wiki.go:135`
      Sicherheitsseitig sind sie dicht: registriert mit `publicRateLimiter.Middleware` statt
      `authWithIdempotency` (`main.go:356-395`), eigener Redis-Präfix `ratelimit:public`
      (`main.go:166`), `PUBLIC_RATE_LIMIT_RPS` Default 10 (`config.go:74`), schmaler Wire-Typ,
      einheitliches 404 für jede Ablehnung. Nicht mitgezählt: `route_guest.go:45-53`
      (Chat-Gast, sessionbasiert statt Token-in-URL).
      Base-URL-Env-Vars existieren nur für `PASSWORD_RESET_BASE_URL` (`config.go:204`) und
      `CSAT_SURVEY_BASE_URL` (`config.go:209`) — für Berichte, Dokument, Formular und Wiki
      gibt es keine, deren Links entstehen anderswo. Das gehört beim Projektzuschnitt geklärt.
    target: >
      Projekt "Public Web Surface".

  - id: deploy-guest-chat-spa-never-built
    service: deploy
    status: parked
    decided: 2026-08-10
    decision: >
      NEUER BEFUND aus der Verifikationsrunde, keine Alt-Unit. Der Guest-Chat ist auf
      Production tot: `guest-chat/` liegt als Vite-SPA im Repo (`index.html`, `package.json`,
