# Backend-Nachtloop — geparkte und gestrichene Units
#
# Diese Datei liest der Treiber NICHT. Sie ist das Gegenstück zu `BACKLOG.yml`: hier liegt,
# was der Loop strukturell nicht bearbeiten kann oder was bewusst aus dem Scope fällt.
#
# Anlass: nach Lauf 7 lagen neun Units auf `status: blocked` — teils seit drei Läufen. Der Loop
# las sie jede Iteration mit, übersprang sie und verfälschte damit den Backlog-Stand. In der
# Entscheidungsrunde am 2026-08-10 wurden alle neun aufgelöst: zwei wurden zu Lauf-8-Units
# (`fix-einkauf-contract-call-cap`, `hr-salary-*`), vier sind hier geparkt, zwei gestrichen.
# Dazu zwei Nebenbefunde, die bei der Verifikation aus dem Code gefallen sind.
#
# status: parked   — die Arbeit bleibt gültig, gehört aber woanders hin (siehe `target`)
# status: dropped  — bewusst aus dem Scope genommen, mit Begründung
#
# Jeder Eintrag trägt `decided`, `decision` und `target`. Eine Unit ohne diese drei Felder
# gehört nicht in diese Datei, sondern zurück in die Entscheidungsrunde.
#
# Historie der Units selbst: `archive/lauf-7/BACKLOG.yml` (unveränderte Kopie mit den
# ursprünglichen `blocked_reason`-Texten).

units:

  # ==========================================================================================
  # GEPARKT — Frontend-Arbeit
  # ==========================================================================================

  - id: fe-salary-statements-endpoint
    service: desktop
    status: parked
    decided: 2026-08-10
    decision: >
      Reiner Frontend-Fix, Backend-Anteil ist erledigt. Der Loop hat in Lauf 8
      (`hr-salary-self-service-route`) `GET /api/v1/hr/employees/me/documents` gebaut
      (`backend/internal/gateway/route_hr.go`, `HandleListOwnDocuments`, Spec-Eintrag in
      `backend/api/openapi.yaml`). Damit steht die Selbstzugriffs-Route bereit, die das FE
      heute nur als MSW-Mock kennt.
    scope: >
      `desktop/src/renderer/src/modules/team/SelfServiceView.tsx:130-141` ruft
      `GET /api/v1/hr/employees/me/salary-statements` und erwartet
      `{ statements: SalaryStatement[] }`. Diesen Pfad gibt es im Backend nicht und wird es
      auch nicht geben — Cosmi rechnet kein Brutto/Netto (Entscheidung Luke, 2026-08-10),
      Gehaltsabrechnungen sind PDFs in der Personalakte. Umzustellen auf
      `GET /api/v1/hr/employees/me/documents?category=gehaltsabrechnung`, Antwort
      `{ documents: EmployeeDocument[] }`.
    notes: >
      Der FE-Typ `SalaryStatement` (Brutto/Netto/Zeitraum) hat im Backend keine Entsprechung
      und muss durch die Dokument-Felder ersetzt werden: `title`, `file_name`, `file_size`,
      `created_at`, `file_id` (zum Download), `category_key`. Die Kategorie
      `gehaltsabrechnung` legt Migration 000310 als System-Kategorie mit
      `visibility='employee'` an; RLS-Policy `hr_document_access` sorgt dafuer, dass ein
      Mitarbeiter nur seine eigene sieht. `TIME_ACCOUNTS` in derselben Datei (Zeile 103-108)
      ist weiterhin hartkodiert und braucht eine eigene Entscheidung — nicht Teil dieses Fixes.
    target: >
      Frontend-Session, `.planning/nico-block/`.

  - id: fe-helpdesk-ticket-number
    service: desktop
    status: parked
    decided: 2026-08-10
    decision: >
      Reiner Frontend-Fix, kein Backend-Anteil. Verifiziert am 2026-08-10: das Backend liefert
      `ticket_number` als Pflichtfeld auf jeder Ticket-Response
      (`backend/internal/helpdesk/models.go:118`, gesetzt in
      `postgres_repository.go:44,67,75,143,488,520,1294` aus der per-Tenant-Sequenz
      `helpdesk_ticket_counters`, Migration 000236). Dokumentiert in
      `backend/api/openapi.yaml:14329,14387,14545`, gRPC-Mapping in
      `backend/internal/server/helpdesk_grpc.go:435,1196`. Es fehlt ausschließlich auf der
      FE-Seite.
    scope: >
      `desktop/src/renderer/src/api/helpdesk-types.ts:24-60` kennt das Feld `ticket_number`
      nicht; `helpdesk-adapters.ts:124-146` baut stattdessen eine Pseudonummer (Zeile 131
      `parseInt(t.id, 16)`, Zeile 132 Regex auf Trailing-Digits, Zeile 142-144
      FNV-1a-Hash-Fallback, Ergebnis Zeile 146). Der Nutzer sieht damit eine andere Nummer als
      die im Backend und in der CSAT-Mail.
    notes: >
      Fix betrifft genau zwei Dateien, kein Fan-out: `ticketNr` wird nur an dieser einen Stelle
      berechnet, alle Verbraucher (`HelpdeskPage.tsx`, `stores/helpdesk.ts`,
      `dashboard/widgets/OpenTickets.tsx`, `stores/kommunikation.ts`) lesen nur das fertige
      `DisplayTicket.ticketNr`. MITZUENTSCHEIDEN: Backend und CSAT-Mail formatieren
      `Ticket #%d` (`helpdesk/csat_dispatch.go:288,291,296`), das FE zeigt `HD-YYYY-XXXX`. Auch
      nach dem Fix bleibt eine Darstellungsentscheidung offen — beide Seiten müssen dieselbe
      Zeichenkette zeigen, sonst ist der Fix halb.
    target: >
      Frontend-Session, `.planning/nico-block/`.

