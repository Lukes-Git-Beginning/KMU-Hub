  - id: g-decode-disallow-unknown-fields
    service: gateway
    status: parked
    decided: 2026-08-10
    decision: >
      Bleibt eine repo-weite Entscheidung mit Breaking-Potenzial und gehört nicht in eine
      Nachtlauf-Iteration. Der Blast Radius ist jetzt beziffert statt geschätzt (2026-08-10):
      `decodeAndValidate` (`backend/internal/gateway/helpers.go:174-189`, Decode ohne
      `DisallowUnknownFields` in Z. 176) hat 437 Call-Sites in 64 `route_*.go`-Dateien
      (Spannweite 1-25 pro Datei, z. B. `route_auth.go` 25, `route_hr.go` 21). Repo-weit gibt es
      0 Treffer für `DisallowUnknownFields`.
    scope: >
      `decodeAndValidate` auf `DisallowUnknownFields` umstellen.
    notes: >
      ZWEI Dinge, die vor einer Freigabe auf dem Tisch liegen müssen:
      (1) Ein Umbau NUR am Helfer wäre unvollständig. Rund 30 weitere Decode-Stellen umgehen
          ihn: `route_email.go` (14 Stellen, u. a. 270, 330, 390, 452, 841…1597),
          `route_plugin.go` (7: 141, 233, 395, 467, 489, 557, 579), `route_automation.go`
          (279, 578), `route_notification.go` (260, 299), `route_inbox.go:1310`,
          `route_settings.go:961`.
      (2) Entlastend: kein FE-Aufrufer sendet nachweislich unbekannte Felder. Der einzige
          Spread-Verdachtsfall `useContactTags.ts:93`
          (`JSON.stringify({ ...body, entity_type: 'contact' })`) bekommt von seinem einzigen
          Aufrufer `TagManager.tsx:34-35` ein eng typisiertes Literal `{name, color}`. Die
          übrigen `...data`-Fundstellen (`useAutomation.ts:144-148`, `useInbox.ts:364-365`,
          `useIntegration.ts:190-195`, `TeamInboxSettings.tsx:74-83`) sind gegen enge
          Request-Typen destrukturiert. Kein Full-State-Spread gefunden.
      Kein Test nagelt das heutige Verhalten fest (0 Treffer für "unknown field" in
      `backend/internal/gateway`) — eine Umstellung fällt also nicht durch ein Gate auf, sondern
      erst beim Client.
    target: >
      Eigene Session nach ausdrücklicher Freigabe durch Luke. Reihenfolge dort: erst die ~30
      Umgehungen auf den Helfer ziehen, dann einen Test schreiben, der das Alt-Verhalten
      festnagelt, dann umstellen.

