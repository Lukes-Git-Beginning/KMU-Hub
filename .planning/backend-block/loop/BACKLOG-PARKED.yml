    sources:
      - backend/internal/gateway/openapi_status_code_drift_test.go
      - backend/api/openapi.yaml
      - backend/internal/gateway/helpers.go
    notes: >
      Arbeitsliste erzeugen wie in Iteration 100/103/106/109/112/113/116/118/120:
      `systemicUndocumentedCodes` (openapi_status_code_drift_test.go:430) testweise auf
      `map[int]string{}` setzen, `go test -count=1 -run TestOpenAPIStatusCodeDrift
      ./internal/gateway/ -v > /tmp/drift.txt 2>&1` laufen lassen (IMMER mit Datei-Redirect,
      nie nur die Konsolen-Vorschau lesen) und die Zeilen `METHOD /pfad writes [...] - not
      documented` fuer die gewaehlte Gruppe vollstaendig sammeln (`grep "/api/v1/<gruppe>"
      /tmp/drift.txt`) - das umfasst i.d.R. auch GET/PATCH/DELETE-Operationen, die nur
      teilweise (z. B. nur 503, ohne 400) fehlen; nicht bei den ersten paar POST-Treffern
      aufhoeren. Danach die Testdatei aus der Sicherungskopie zuruecksetzen und `git diff`
      darauf pruefen (muss leer sein).
      Einsortiert wird numerisch in den `responses:`-Block der jeweiligen Operation: `400`
      vor einem vorhandenen `401`/`404`, `503` ans Ende (nach `409`, falls vorhanden). Die
      Leerzeile zwischen zwei Pfad-Bloecken gehoert NICHT in den `responses:`-Block.
      Nur auf den Operationen eintragen, die der Test wirklich nennt - manche Operationen
      einer Gruppe haben schon ein `400` und brauchen nur `503`, oder umgekehrt.
      Sobald eine Gruppe vollstaendig geschlossen ist, mit demselben emptied-Map-Testlauf
      gegenpruefen, dass `grep -c "/api/v1/<gruppe>" /tmp/drift.txt` nach den Aenderungen 0
      ergibt (Vorher/Nachher-Zeilenzahl-Differenz muss exakt der Anzahl neu eingefuegter
      Response-Zeilen entsprechen).
      ACHTUNG (Lehre aus Iteration 106/109): fuer die Mutations-Probe reicht es NICHT, nur
      einen frisch eingefuegten Eintrag zu entfernen und den normalen Testlauf (mit
      gefuellter `systemicUndocumentedCodes`-Map) zu pruefen - 400/503 sind dort systemisch
      unterdrueckt und der Test bleibt IMMER gruen, egal was in `api/openapi.yaml` steht.
      Fuer die Mutations-Probe muss die Map ZUSAETZLICH testweise geleert werden, dann erst
      wird ein entfernter Eintrag als Fund sichtbar; danach beide Aenderungen (Testdatei und
      YAML) zurueckdrehen und normal-gruen erneut bestaetigen.
      ZUSAETZLICHE LEHRE aus Iteration 120: die Backup-Kopie fuer die Mutations-Probe
      (`/tmp/openapi_backup_..._good.yaml`) IMMER unmittelbar VOR der Mutations-Probe ziehen,
      NICHT vor dem eigentlichen inhaltlichen Edit - sonst faellt beim Zuruecksetzen der
      Datei aus der Backup-Kopie auch die eigentliche beabsichtigte Aenderung weg und muss
      danach nochmal nachgezogen werden (in Iteration 120 passiert, per Diff sofort erkannt
      und korrigiert, keine Auswirkung auf den finalen Commit).
    done_when:
      - Mindestens eine weitere Registrar-Gruppe hat ihre fehlenden 400 UND 503 VOLLSTAENDIG
        dokumentiert (alle Methoden der Gruppe, nicht nur ein Teil)
      - Die im Test geloggten Zaehler sind nachweislich gesunken (Zahlen im Journal, aus
        einem vollstaendig in eine Datei umgeleiteten Testlauf, nicht aus der Tool-Preview)
      - "swagger-cli validate gruen"
