  # ==========================================================================================
  # GEPARKT — Projekt "Public Web Surface"
  #
  # Drei Einträge, ein Problem: es gibt keine öffentliche Weboberfläche. Sie werden bewusst
  # gebündelt, weil sie dieselbe Lösung teilen und einzeln jeweils halb wären.
  #
  # NEU UND WICHTIG (2026-08-10): das Hosting-Muster existiert bereits im Repo. Der Gateway
  # serviert statische Dateien unter `/guest/*`, wenn `guest-chat/dist` vorliegt
  # (`backend/cmd/gateway/main.go:405-417`), und der Caddyfile reicht `app.zentria.tech`
  # ohnehin vollständig an `gateway:8080` durch (`deploy/docker/Caddyfile:1-21`, Ausnahme nur
  # `/rtc*`). Die Infrastrukturfrage ist damit beantwortet — offen sind Design, i18n, Consent
  # und ein Build-Schritt im Gateway-Image.
  # ==========================================================================================

  - id: g-csat-public-surface
    service: helpdesk
    status: parked
    decided: 2026-08-10
    decision: >
      CSAT bleibt STILLGELEGT, bis die öffentliche Oberfläche existiert. Der Default steht
      seit `f855272f` auf `false` (`backend/internal/helpdesk/csat_config.go:56-60`) und ist per
      `TestDefaultCsatConfig_IsOptIn` (`csat_config_test.go:21-25`) festgenagelt — es ist also
      nichts zu bauen, sondern etwas ausdrücklich NICHT zu tun. Kein SMTP-Passthrough, kein
      Scharfschalten. Der Passthrough allein wäre schädlich: dann gingen Umfragen mit totem
      Link an echte Empfänger.
    scope: >
      CSAT vom Token bis zur abgegebenen Bewertung nutzbar machen: öffentliche Seite hinter
      `CSAT_SURVEY_BASE_URL`, SMTP-Passthrough für `helpdesk`, Config-Route für den
      Tenant-Toggle, danach erst `Enabled` erwägen.
    notes: >
      Alle vier Teilaussagen am 2026-08-10 einzeln gegen den Code geprüft, alle gelten:
      (1) `SYSTEM_SMTP_*` geht in `deploy/docker/docker-compose.yml` nur an `auth` (Z. 118-122),
          `biz` (Z. 437-441) und `berichte` (Z. 615-619). Der `helpdesk`-Block (Z. 572-596)
          hat keine SMTP-Zeile, `docker-compose.prod.yml` ergänzt keine. Folge:
          `backend/cmd/helpdesk/main.go:121-139` — `systemSender.Configured()` (Z. 128) gated
          `go dispatcher.Run(ctx)` (Z. 135), es greift immer der Warn-Zweig Z. 137-138
          "system SMTP not configured — CSAT survey invitations are issued but not sent".
      (2) `CsatSurveyBaseURL` Default `https://app.zentria.tech/csat`
          (`backend/internal/config/config.go:209`), nirgends im Compose überschrieben.
          Link-Bau `csat_dispatch.go:323-325` = baseURL + "/" + Token. Der Gateway hat auf
          bloszem `/csat/{token}` keine Route — die einzige CSAT-Route ist
          `POST /api/v1/public/helpdesk/csat/{token}` (`route_helpdesk.go:144`).
      (3) Empfänger ist `COALESCE(NULLIF(t.requester_email,''), req.email)`
          (`helpdesk/postgres_repository.go:521`) — also auch Mitarbeiteradressen.
      (4) Kein Fernzugriff auf die CSAT-Config. PRÄZISIERUNG zur alten Notiz: `GetCsatConfig`
          und `SetCsatConfig` (`server/helpdesk_grpc.go:57,74`) sind KEINE gRPC-RPCs — das
          Proto (`backend/proto/helpdesk/v1/helpdesk.proto`) kennt nur `SubmitCsat` (Z. 30) und
          `SubmitCsatByToken` (Z. 38). Es sind reine Go-Methoden ohne Wire-Anbindung. Der
          Desktop-Toggle in `HelpdeskSettingsPanel.tsx:83-108` schreibt nur in
          `stores/helpdesk.ts:670` (Zustand-Persist), nie ans Backend. Ein Tenant kann CSAT
          heute weder ein- noch ausschalten.
    target: >
      Projekt "Public Web Surface", gemeinsam mit `g-public-token-landing-pages` und
      `deploy-guest-chat-spa-never-built`. Erst danach SMTP-Passthrough und `Enabled`.

  - id: g-public-token-landing-pages
    service: gateway
    status: parked
    decided: 2026-08-10
    decision: >
      Bleibt ein eigenes Projekt, aber die Begründung ist zu präzisieren: nicht "Cosmi ist
      eine Electron-App, also unmöglich", sondern "das Muster existiert, es ist nur für diese
      sieben Routen nicht gebaut". Siehe Block-Kopf.
    scope: >
      Öffentliche Weboberfläche, in der ein Empfänger die Public-Token-Routen einlöst.
    notes: >
      Genau sieben Registrare, alle am 2026-08-10 verifiziert
      (`backend/cmd/gateway/main.go:359,365,370,376,382,389,395`):
        1. `GET /api/v1/public/booking-pages/{slug}` + `/availability` + `POST /public/bookings`
           — `route_booking.go:77-81`
        2. `POST /api/v1/public/berichte/reports/{token}`   — `route_berichte.go:151`
        3. `POST /api/v1/public/documents/share/{token}`    — `route_document.go:204`
        4. `POST /api/v1/public/automations/webhooks/{id}`  — `route_automation.go:123`
        5. `POST /api/v1/public/helpdesk/csat/{token}`      — `route_helpdesk.go:144`
        6. `POST /api/v1/public/formulare/submit/{token}`   — `route_formulare.go:156`
        7. `POST /api/v1/public/wiki/articles/{token}`      — `route_wiki.go:135`
      Sicherheitsseitig sind sie dicht: registriert mit `publicRateLimiter.Middleware` statt
      `authWithIdempotency` (`main.go:356-395`), eigener Redis-Präfix `ratelimit:public`
      (`main.go:166`), `PUBLIC_RATE_LIMIT_RPS` Default 10 (`config.go:74`), schmaler Wire-Typ,
      einheitliches 404 für jede Ablehnung. Nicht mitgezählt: `route_guest.go:45-53`
      (Chat-Gast, sessionbasiert statt Token-in-URL).
      Base-URL-Env-Vars existieren nur für `PASSWORD_RESET_BASE_URL` (`config.go:204`) und
      `CSAT_SURVEY_BASE_URL` (`config.go:209`) — für Berichte, Dokument, Formular und Wiki
      gibt es keine, deren Links entstehen anderswo. Das gehört beim Projektzuschnitt geklärt.
    target: >
      Projekt "Public Web Surface".

  - id: deploy-guest-chat-spa-never-built
    service: deploy
    status: parked
    decided: 2026-08-10
    decision: >
      NEUER BEFUND aus der Verifikationsrunde, keine Alt-Unit. Der Guest-Chat ist auf
      Production tot: `guest-chat/` liegt als Vite-SPA im Repo (`index.html`, `package.json`,
      `src/`, `vite.config.ts`), und `backend/cmd/gateway/main.go:405-417` serviert sie unter
