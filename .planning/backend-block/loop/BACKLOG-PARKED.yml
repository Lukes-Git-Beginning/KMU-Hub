    sources:
      - backend/internal/gateway/route_settings.go   # :88-91 subscription, :74-76 module-grants, :82-85 license
      - desktop/src/renderer/src/api/hooks/useBilling.ts
      - desktop/src/renderer/src/api/hooks/useTenantModules.ts
    notes: >
