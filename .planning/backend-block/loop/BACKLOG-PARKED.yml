  - id: check-password-reset-link-target
    service: auth
    status: parked
    decided: 2026-08-10
    decision: >
      NEUER BEFUND aus der Verifikationsrunde. Zu PRÜFEN, nicht zu bauen — und vor dem Launch,
      weil ein toter Reset-Link Nutzer aussperrt.
    scope: >
      Klären, wohin der Passwort-Reset-Link tatsächlich führt.
    notes: >
      `PASSWORD_RESET_BASE_URL` hat zwei verschiedene Defaults:
      `https://app.zentria.tech/reset-password` (`backend/internal/config/config.go:204`) und
      `https://zentria.tech/reset-password` (`deploy/docker/docker-compose.yml:123`,
      ebenso `deploy/docker/PRODUCTION_TEMPLATE:49`); die Ansible-Vorlage
      (`deploy/ansible/roles/secrets/templates/env.production.j2:46`) baut ihn aus
      `pilot_domain`. Gesetzt wird er in `backend/cmd/auth/main.go:69`.
