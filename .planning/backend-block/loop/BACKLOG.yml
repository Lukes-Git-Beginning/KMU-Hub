  - id: scan-enum-and-fk-violation-500
    phase: 4
    service: gateway
    model: sonnet
    deps: [fix-vertraege-enum-and-reference-validation-500]
    status: done
    target: ungültige Enum-Werte und unbekannte Referenzen antworten überall 400/404 statt 500
    coverage_start: n.a. (Scan)
    scope: >
      Klasse 500 STATT 400. Einzelfall: Verträge prüften weder Enums noch Referenzen, die CHECK- und FK-Verletzungen
      kamen als 500 an (Fix in Block B). ZUERST die gemeinsame Stelle prüfen: Gibt es ein zentrales Mapping von
      Postgres-Fehlern (`23514` check_violation, `23503` foreign_key_violation, `22P02` invalid_text_representation)
      auf InvalidArgument/NotFound im gRPC-Fehlermapping oder im Repository-Helper? Wenn nicht und wenn es ohne
      Informationsleck geht, ist DAS die eine Fix-Unit (Regel 1), mit Test je Code. Danach die Stellen auflisten, die
      das Mapping umgehen (eigene `fmt.Errorf` ohne Wrap). Belegen per Router-Test mit ungültigem Enum.
    notes: >
      VORARBEIT Iteration 61 (nicht verloren gehen lassen): Es gibt KEIN zentrales Postgres-Fehlermapping. Gemeinsame Stelle
      sind die `default:`-Zweige der 41 `map*Error`/`*Error`-Funktionen in `internal/server/*_grpc*.go` (automation, berichte,
      bexio, biz + bankaccount/banking/einvoice/expense/gobd, calendar, chat, crm, datev, dialer, document, einkauf, email,
      formulare, fuhrpark, auth `mapError`, helpdesk, hr, inbox, inventar, lexware, notification, plugin, produktion,
      rapporte, schichten, security, vermietung, vertraege, video x4, wiki, work x2): alle enden in `codes.Internal`,
      `pgconn.PgError` mit 23503/23514/22P02 wird nirgends erkannt (nur auth/fuhrpark/helpdesk/produktion/schichten/
      vermietung/banking/invoice u. a. prüfen 23505 oder einzelne 23514 im Repository). Fix = EIN Helfer in `internal/server`
      (z. B. `pgConstraintStatus(err) error`, nil wenn kein PgError; ohne pg-Meldung im Text, sonst Leck von Tabellen-/
      Constraintnamen) und dessen Aufruf als erste Zeile jedes `default:`; 23514/22P02 -> InvalidArgument, 23503 ->
      InvalidArgument bei INSERT/UPDATE (unbekannte Referenz), FailedPrecondition bei DELETE ("still referenced"; nur über
      `pgErr.Detail`/`TableName` unterscheidbar, locale-abhängig, im Zweifel FailedPrecondition). Einzige Unit statt 41.
      Zusätzlich Umgehungen zu listen: direkte `status.Error(codes.Internal, err.Error())` (biz_grpc.go:2843, crm_grpc.go:3207,
      email_grpc.go:2037, plugin_grpc.go:602) geben die Roh-Meldung nach außen. Gateway-`validate:"oneof=..."` fängt die
      meisten Enums vorab (Beispiel fuhrpark doc_type); `contacts.client_segment` hat keinen Go-Code. Beleg-Test dafür:
      Wegwerf-Tabellentest über alle 41 Funktionen mit `fmt.Errorf("x: %w", &pgconn.PgError{Code: "23503"})` erwartet heute
      überall Internal.
    sources:
      - backend/internal/server/
      - backend/internal/gateway/
      - backend/migrations/
    done_when:
      - Ergebnis zur gemeinsamen Stelle und Liste der Umgehungen im Journal
      - Fix-Units nach Regel 1

