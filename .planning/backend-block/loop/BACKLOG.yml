      Fix: Gateway setzt `ReviewerId` aus `middleware.GetUserID`, das Body-Feld bleibt für das FE
      akzeptiert (Desktop sendet es, `rapporte-client.ts`), wird aber ignoriert; Validierung
      `required` entfällt, damit ein Client ohne das Feld nicht mit 400 scheitert. Desktop-Aufrufer
      prüfen. Optional: Selbstfreigabe verbieten (Autor == Reviewer) — Produktfrage, dann nach
      BACKLOG-NEXT statt bauen.
    sources:
