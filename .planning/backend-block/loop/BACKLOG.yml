  - id: a-chat-permission-seeds
    phase: 3
    service: chat
    model: opus
    deps: []
    status: done
    scope: >
      Permission-Seeds fuer chat und channels. Verifiziert 2026-08-07 - unter den
      Seed-Migrationen fuer Berechtigungen taucht chat nirgends auf, waehrend das FE laengst
      `kommunikation:channel:manage` und `kommunikation:webhook:manage` erzwingt. Die
      fehlenden Schluessel als Seed-Migration nachziehen, mit denselben Subjekt-Namen, die das
      FE benutzt.
    sources:
      - backend/migrations/000129_seed_module_permissions.up.sql
      - desktop/src/renderer/src/config/capability-catalog.ts
      - backend/internal/gateway/route_chat.go
    notes: >
      REIHENFOLGE IST HIER SICHERHEITSKRITISCH und in diesem Repo schon einmal schiefgegangen:
      erst SEEDS, dann Guards. Ein `RequirePermission` ohne passenden Seed sperrt ALLE aus,
      auch Admin. In dieser Unit werden deshalb NUR die Seeds angelegt und den Preset-Rollen
      zugeordnet - keine neuen Guards an den Routen. Die Namen exakt aus dem FE-Katalog
      uebernehmen, nicht sinngemaess: das FE ist hier die Referenz, und ein Tippfehler ist ein
      stiller Default-Deny. Bestehende Guards NIE ersetzen, nur additiv erweitern - ein hart
      ersetzter Guard sperrt jeden Nutzer mit gueltigem Alt-Token aus, bis er sich neu anmeldet.
    done_when:
      - Seed-Migration legt die chat-/channels-Schluessel an, up und down gefuellt
      - Schluesselnamen stimmen zeichengenau mit dem FE-Katalog ueberein
      - Zuordnung zu den Preset-Rollen entspricht dem FE-Katalog
      - KEIN neuer RequirePermission-Aufruf in diesem Commit
    result: >
      PRAEMISSE WIDERLEGT (2026-08-08). Es fehlt kein einziger Seed: alle 252 Keys des
      FE-Katalogs und alle 174 Keys aus RequirePermission-Aufrufen sind geseedet, die
      fuenf kommunikation:*-Keys seit Migration 000256. Die Backlog-Notiz hatte nach dem
      Praefix `chat` gesucht, das FE benutzt aber `kommunikation:`.
      Der beschriebene Fehlermodus existierte trotzdem, nur eine Ebene tiefer: `mentions:read`
      war seit Migration 000017 geseedet und KEINER Rolle zugeordnet, waehrend
      route_chat.go:83 es erzwingt - GET /api/v1/messages/mentions gab jedem Nutzer 403,
      Admin eingeschlossen. Es war die einzige Permission der Tabelle ohne jeden
      System-Rollen-Grant. Migration 000306 ordnet sie den drei Rollen zu, die schon
      messages:read halten. Zusaetzlich TestEveryRouteGuardHasAUsablePermission als
      Standing-Guard (AST-Scan aller 784 Guard-Call-Sites gegen die DB), damit der
      naechste solche Lockout im Test auffaellt statt in Produktion.

  - id: a-inbox-sla
    phase: 3
    service: inbox
    model: sonnet
    deps: []
    status: blocked
    blocked_reason: >
      `sla_policies` existiert (Migration 000077), gehoert aber vollstaendig dem Helpdesk-
      Bounded-Context: es haengt an `ticket_queues.sla_policy_id`, traegt `first_response_mins`/
      `resolution_mins`/`business_hours` fuer Ticket-Queues und wird ausschliesslich von
      `internal/helpdesk` gelesen. Inbox (`inbox_messages`, `team_inboxes`,
      `team_inbox_members`, `routing_rules`, Migration 000047 + Folgen) hat keine Spalte, keinen
      Code-Pfad und keine Migration, die je auf `sla_policies` verweist - verifiziert per Grep
      ueber `backend/internal/inbox/**` (0 Treffer fuer sla/due_at/first_response/resolution)
      und ueber alle Migrationen, die `team_inboxes` anfassen (000047, 000110, 000124 - keine
      fuegt eine `sla_policy_id`-Spalte hinzu). Es gibt also keine bestehende Zuordnung
      "welche Policy gilt fuer welchen Team-Inbox/Channel" und keine Vorgabe, ob Inbox
      ueberhaupt dieselbe Tabelle wie Helpdesk teilen soll oder eine eigene braucht. Genau das
      ist die in den notes selbst benannte Produktentscheidung ("Gibt es keine ... eine
      Produktentscheidung") - nur eine Ebene tiefer als vermutet: die Tabelle existiert, aber
      nicht fuer diesen Bounded Context, und die Zuordnungsfrage ist ungeklaert.
    scope: >
      SLA-Verfolgung im Posteingang. Status, Threading, Tags und Weiterleiten sind gebaut;
      SLA ist der letzte offene Punkt aus dem Inbox-Block. Reaktions- und Loesungsfrist je
      Nachricht berechnen und im Listen- und Detail-Wire mitliefern, plus einen Filter auf
      ueberfaellige Vorgaenge.
    sources:
      - backend/internal/inbox/service.go
      - backend/internal/inbox/postgres_repository.go
      - backend/internal/gateway/route_inbox.go
    notes: >
      Bleibt blockiert bis Luke entscheidet: (a) Inbox bekommt eine eigene Policy-Tabelle
      analog `sla_policies`, mit eigener Zuordnung (global? pro `team_inbox`? pro `channel`?),
      oder (b) `team_inboxes.sla_policy_id` referenziert Helpdesks `sla_policies` direkt
      (Cross-Modul-Kopplung zweier bisher unabhaengiger Services), oder (c) Scope-Streichung.
      Sobald entschieden, ist die Berechnung selbst mechanisch (serverseitig, Filter in SQL).
    done_when:
      - Praemisse geprueft, Ergebnis mit Fundstelle im Journal belegt
      - Falls gebaut - Fristen im Wire, Filter auf ueberfaellig greift in SQL
      - Nachricht ohne zutreffende Richtlinie liefert keine Frist statt einer Nullfrist
      - openapi.yaml nachgezogen, go test ./internal/gateway/ gruen

