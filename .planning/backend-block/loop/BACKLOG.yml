      Journal-Befund 1 aus Lauf 10 (Iteration 57): seit Lauf 10 bekommt ein Request, dessen
      erster Versuch abstürzte BEVOR `Complete` lief, beim Retry mit demselben
      Idempotency-Key 409 mit `Retry-After: 2` — statt durchzulaufen. Das ist die dokumentierte
      Semantik und die Voraussetzung dafür, dass der Schlüssel Doppelbuchungen überhaupt
      verhindert. Es ist aber eine VERHALTENSÄNDERUNG IN PRODUKTION, und sie steht in keiner
      Spezifikation: ein Client, der 409 nicht erwartet, bricht ab, ohne den Retry-After
      auszuwerten.
      Betroffen sind alle mutierenden Routen hinter der Idempotency-Middleware, insbesondere
      die Finanz- und Dialer-Buchungen.
    sources:
      - backend/internal/middleware/idempotency.go
      - backend/api/openapi.yaml
      - backend/internal/gateway/route_biz_billing.go
      - backend/internal/gateway/route_hr.go
      - backend/internal/gateway/route_schichten.go
    notes: >
      Erst die Menge bestimmen: welche Routen laufen tatsächlich durch `middleware.Idempotency`
      (montiert in `cmd/gateway/main.go:204`)? Der Mode (`WarnMode`/`HardMode`) entscheidet
      mit, ob ein fehlender Key 400 liefert — auch das gehört dokumentiert, wenn es fehlt.
      `TestOpenAPIRouteDrift` prüft NUR, ob ein Pfad existiert, nicht die Antwortcodes. Diese
      Unit schließt also eine Lücke, die kein Test findet — siehe auch D2.
      Nach jeder `openapi.yaml`-Änderung `swagger-cli validate` fahren; der Drift-Test ist
      keine Spec-Validierung.
      KEINE Verhaltensänderung an der Middleware. Wenn beim Lesen auffällt, dass der
      Retry-After-Wert 2 zu kurz ist, ist das ein eigener Fund und eine eigene Unit.
    done_when:
