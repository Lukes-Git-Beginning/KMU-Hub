  - id: fix-crm-import-company
    phase: fix
    service: crm
    model: sonnet
    deps: []
    status: done
    scope: >
      Die Firma geht beim Kontakt-Import verloren. Verifiziert am 2026-08-02 in
      `backend/internal/email/contact/import_service.go`: `knownMappings` (Zeile 73) kennt
      `firma|company|unternehmen|organisation` -> `company`, und der vCard-Pfad befuellt
      `fields["company"]` (Zeile 372) — aber `importSingleContact` persistiert ausschliesslich
      email, first_name, last_name, phone, position, notes (Zeilen 234-320). Das gemappte Feld
      faellt ersatzlos raus. Der CSV-Export liest die Firma aus der company-Relation und liefert
      deshalb immer leer: der Export-Import-Round-Trip des eigenen CRM ist kaputt.
    sources:
      - backend/internal/email/contact/import_service.go
      - backend/internal/gateway/route_crm_contacts.go
      - backend/internal/crm/
    notes: >
      Die Firma gehoert auf die company-Relation (`contacts.company_id` -> `companies`), nicht in
      ein neues Freitextfeld am Kontakt — sonst hat das CRM zwei Wahrheiten ueber denselben
      Sachverhalt.
      Bestehende Firma per Name im eigenen Tenant finden, sonst anlegen. Beim Anlegen `tenant_id`
      aus `middleware.GetTenantID(ctx)`, nie aus dem Request. Der Namensvergleich braucht eine
      Entscheidung (exakt, getrimmt, case-insensitiv) — treffen und im Journal begruenden, nicht
      offenlassen.
      Ein Import mit 500 Zeilen darf nicht 500 Einzelabfragen auf `companies` ausloesen: die
      bereits aufgeloesten Namen innerhalb eines Laufs zwischenspeichern.
      Der Import ist idempotent gedacht — pruefen, dass ein zweiter Lauf derselben Datei keine
      Firmen-Dubletten erzeugt.
      Test: Round-Trip. Export erzeugen, wieder importieren, Firma muss ankommen.
    done_when:
      - Firma landet auf der company-Relation, Export liest sie zurueck
      - keine Dubletten bei doppeltem Import, kein N+1 bei grossen Dateien
      - tenant_id beim Anlegen aus dem Context
      - Round-Trip-Test gruen, go test -count=1 ./internal/email/... gruen
    ergebnis: >
      ERLEDIGT (Iteration 28). Namensvergleich: case-insensitiv + getrimmt (`LOWER(name) =
      LOWER($2)`), Praemisse ist, dass `company.Service.Create` den Namen bereits trimmt, bevor er
      in die DB kommt — die Datenbankseite vergleicht also getrimmt gegen getrimmt.
      Neue Repository-/Service-Methoden in `internal/crm/company/`: `GetByName` (case-insensitiv,
      `merged_into_id IS NULL`, tenant-gescopt) und `GetNamesByIDs` (Batch, `id = ANY($1) AND
      tenant_id = $2`) sowie darauf aufbauend `Service.FindOrCreateByName` (find-or-create,
      idempotent -- zweiter Lauf derselben Datei findet die beim ersten Lauf angelegte Firma wieder
      und legt keine Dublette an, siehe `TestService_FindOrCreateByName_FindsCaseInsensitive`) und
      `Service.GetNamesByIDs`.
      `ContactProvider`-Interface (`internal/email/contact/import_service.go`, genutzt von Import
      UND Export) um `FindOrCreateCompany(ctx, name, createdBy) (uuid.UUID, error)` und
      `GetCompanyNames(ctx, ids) (map[uuid.UUID]string, error)` erweitert.
      `TenantScopedAdapter` bekommt einen zweiten `TenantedCompanyService`-Parameter (Konstruktor-
      Signatur geaendert), alle vier Aufrufstellen in `internal/server/crm_grpc.go` (Import CSV/
      VCard, Export CSV/VCard) auf `NewTenantScopedAdapter(s.contactService, s.companyService,
      tenantID)` gezogen -- `CRMGRPCServer` hatte `companyService` bereits als Feld.
      N+1 vermieden auf beiden Seiten: Import cached aufgeloeste Firmennamen in einer lokalen
      `map[string]uuid.UUID` PRO IMPORT-LAUF (in `ImportCSV`/`ImportVCard` angelegt, nicht am
      Service haengend, da der Service ueber mehrere Requests hinweg geteilt sein kann) --
      `TestImportCSV_CompanyDedupedWithinRun` beweist genau 1 `FindOrCreateCompany`-Aufruf fuer 2
      Zeilen derselben Firma (unterschiedliche Gross-/Kleinschreibung und Leerraum). Export holt
      alle noetigen Firmennamen in einem `GetCompanyNames`-Batch-Call statt pro Kontakt.
      Merge-Pfad (`mergeByEmail`) uebernimmt die Firma nachtraeglich nur, wenn der bestehende
      Kontakt noch keine hat (`existing.CompanyID == nil`) -- dieselbe "nur leere Felder auffuellen"-
      Semantik wie bei Telefon/Position/Notizen.
      vCard-Export schrieb bisher `vcard.FieldOrganization` GAR NICHT (weder vorher noch durch die
      Luecke dieser Unit verursacht) -- im selben Zug mitgefixt, sonst waere der Round-Trip nur fuer
      CSV, nicht fuer vCard geschlossen gewesen.
      Test: `TestExportImportRoundTrip_CompanyCSV` und `TestExportVCard_CompanyRoundTrip` exportieren
      in einen Provider, importieren die Bytes in einen ZWEITEN, frischen Provider (kein geteilter
      Firmen-Cache) und pruefen, dass die Firma ankommt -- beweist den Fix ueber den Prozess-Cache
      hinaus. Zusaetzlich `TestCompanyGetByName_CaseInsensitiveIgnoresMergedAndOtherTenant` als
      Repository-Test gegen die echte DB (merged Company wird nicht gefunden, fremder Tenant sieht
      nichts).
      NEUER FUND, nicht in dieser Unit behoben: `internal/server/email_grpc.go`
      `ImportContactsCSV`/`ImportContactsVCard` rufen `s.importService.ImportCSV/VCard` direkt auf
      dem in `cmd/email/main.go` mit `nil`-Provider konstruierten Singleton auf -- im Gegensatz zum
      CRM-Pfad baut der Email-gRPC-Server KEINEN Tenant-scoped Adapter pro Request. Jeder Aufruf
      dieser beiden RPCs (Route `POST /api/v1/email/.../import/csv` bzw. `/import/vcard`,
      `route_email.go:198-199`) haette schon vor dieser Unit bei JEDEM `contactProvider`-Zugriff
      (`GetByEmail`, `CreateForImport`, ...) mit einer Nil-Pointer-Panik geendet, nicht erst durch
      die neuen `FindOrCreateCompany`/`GetCompanyNames`-Aufrufe. Eigene Unit noetig (Tenant-ID aus
      dem Kontext ziehen + Adapter pro Request bauen, analog `crm_grpc.go`).
      gate: build ok (`go build -p 2 ./...`) | vet ok (`go vet -p 2 ./...`) | lint ok
      (golangci-lint auf `internal/email/contact`, `internal/crm/company`, `internal/crm/contact`,
      `internal/server`, 0 issues) | test ok -- `go test -count=1 ./internal/crm/company/...
      ./internal/crm/contact/... ./internal/email/contact/... ./internal/server/...` gruen mit
      `DATABASE_URL` auf `kmuhub_app`, 0 Skips in den beruehrten Paketen. Keine Migration (keine
      neue Tabelle/Spalte, `companies` hatte bereits RLS aus Migration 000120), keine neue Route
      (kein openapi.yaml-Eintrag noetig), kein neuer `RequirePermission`-Guard.

  - id: fix-email-import-nil-provider-panic
    phase: fix
    service: email
    model: sonnet
    deps: []
    status: done
    scope: >
      Gefunden in Iteration 28 (`fix-crm-import-company`), nicht dort behoben. In
      `backend/internal/server/email_grpc.go` rufen `ImportContactsCSV` und `ImportContactsVCard`
      (Zeilen 1079-1110) `s.importService.ImportCSV`/`ImportVCard` DIREKT auf. `s.importService`
