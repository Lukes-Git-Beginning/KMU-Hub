    sources:
      - backend/internal/vertraege/service.go
      - backend/internal/vertraege/postgres_repository.go
      - backend/internal/gateway/route_vertraege.go
      - backend/migrations/000252_report_share_tokens.up.sql
    notes: >
      Verifiziert 2026-08-07 - weder eine Migration mit `contract_event` im Namen noch ein
