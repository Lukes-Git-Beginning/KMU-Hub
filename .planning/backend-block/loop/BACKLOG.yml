  # ==========================================================================
  # BLOCK B — RBAC Phase 2 (Enforcement je Modul), additiv-sicher
  #
  # SICHERHEITSREGEL FUER DEN GANZEN BLOCK:
  # Permissions liegen im JWT und werden nur bei Login/Refresh gebacken. Ein Guard, der hart von
  # einem groben auf einen feinen Key umgestellt wird, sperrt in Produktion JEDEN User mit gueltigem
  # Alt-Token aus. Deshalb ausschliesslich additiv: Alt-Key bleibt immer gueltig.
  # ==========================================================================

  - id: p2-guard-compat
    phase: 2
    service: middleware
    model: opus
    deps: []
    status: done
    scope: >
      `RequirePermissionAny(pairs ...[2]string)` in `internal/middleware/rbac.go` — laesst durch,
      wenn der JWT MINDESTENS EINEN der angegebenen `resource:action`-Keys traegt.
      Bestehendes `RequirePermission` bleibt unveraendert.
    sources:
      - backend/internal/middleware/rbac.go
    notes: >
      Das ist die Voraussetzung fuer jede weitere Unit in Block B. Ohne diesen Helper waere jede
      Guard-Verfeinerung ein Aussperrungs-Risiko.
      Reiner In-Memory-Vergleich gegen den perms-Slice aus dem Context, wie das bestehende
      `RequirePermission` — kein DB-Query, kein Cache.
      Signatur so waehlen, dass der Aufruf am Call-Site lesbar bleibt, z.B.
      `RequirePermissionAny([2]string{"files","write"}, [2]string{"documents:file","upload"})`.
      Test: Token mit nur dem Alt-Key kommt durch, Token mit nur dem Neu-Key kommt durch, Token mit
      keinem von beiden bekommt 403.
    done_when:
      - Helper implementiert, drei Testfaelle gruen
      - RequirePermission unveraendert
      - go build/vet/lint/test gruen

  - id: p2a-wiki-zeiterfassung-infra
    phase: 2
    service: querschnitt
    model: opus
    deps: [p1a-migration, p2-guard-compat]
    status: done
    scope: >
      Die drei Module ohne jeden Permission-Seed (wiki, zeiterfassung, infrastructure): feine
      Capability-Keys aus dem FE-Katalog seeden und die Routen additiv per
      `RequirePermissionAny(alt, neu)` absichern.
    sources:
      - desktop/src/renderer/src/config/capability-catalog.ts
      - .planning/backend-block/WELLEN-BRIEFING.md
    notes: >
      Nur additiv (Blockregel oben). Jeder Guard behaelt seinen bestehenden groben Key.
      Die Seeds kommen aus `p1a-migration` — pruefe zuerst, ob die Keys dieser drei Module dort
      schon angelegt wurden (der Generator emittiert den GESAMTEN Katalog). Ist das der Fall,
      braucht diese Unit KEINE eigene Migration und beschraenkt sich auf die Guards.
      Fehlt ein Key, eigene Seed-Migration im selben Commit — ein Guard ohne Seed ist 403 fuer alle.

      NACHTRAG (aus `p2-guard-compat`, 2026-08-01), drei Dinge, die dir Arbeit sparen:
      (a) SIGNATUR weicht bewusst vom urspruenglichen Vorschlag ab: nicht `pairs ...[2]string`,
          sondern `RequirePermissionAny(first [2]string, rest ...[2]string)` — ein Aufruf ganz ohne
          Paar wuerde jeden aussperren und faellt so schon beim Kompilieren durch. Die Call-Site
          bleibt identisch:
          `RequirePermissionAny([2]string{"files","write"}, [2]string{"documents:file","upload"})`.
      (b) DER JWT TRAEGT DIE FEINEN KEYS BEREITS. `auth.Service.createTokenPair` ruft
          `repo.GetUserPermissions` (`SELECT DISTINCT p.name ... JOIN role_permissions`) ohne
          jeden Filter — nach Migration 000256 landen grobe UND feine Keys im Token. Der Neu-Key
          eines additiven Guards ist ab dem naechsten Login also real erfuellt, nicht erst nach
          weiterer Arbeit. Nichts daran aendern muessen.
      (c) Keys pro Rolle in der lokalen DB nach 000256 (gemessen, nicht geschaetzt): admin 454,
          manager 305, member 159, it_admin 104, readonly 74, hr_admin 71, extern 11. Beim Pruefen
          "existiert der Key?" gegen `permissions` also mit `resource LIKE '%:%'` auf die feinen
          Keys filtern (354 von 456).
    done_when:
      - Routen der drei Module tragen RequirePermissionAny mit Alt- und Neu-Key
      - jeder referenzierte Key existiert in permissions (gegen die lokale DB geprueft)
      - go build/vet/lint/test gruen

  - id: p2b-helpdesk-kommunikation-kalender
    phase: 2
    service: querschnitt
    model: sonnet
    deps: [p2a-wiki-zeiterfassung-infra]
    status: done
    scope: >
      Wie p2a, fuer helpdesk, kommunikation und kalender (dort existieren bisher nur grobe Seeds).
    sources:
      - desktop/src/renderer/src/config/capability-catalog.ts
    notes: >
      Gleiche Regeln wie p2a. Additiv, Alt-Key bleibt, Seed-Existenz gegen die DB pruefen.

      MUSTER AUS `p2b` (2026-08-01), vier Punkte on top von p2a's fuenf:
      (a) NICHT JEDER CATALOGUE-KEY HAT EINE PERMISSION-BASIERTE ROUTE. Manche Routen sind mit
          `RequireRole("admin","manager")` statt `RequirePermission(...)` gegated (kommunikation
          `routing:manage`/Team-Inbox-Create+Delete). Es gibt KEINEN Helper, der Rolle und
          Permission additiv kombiniert — den nicht spontan bauen (Scope-Kriechen fuer eine
          Guard-Tightening-Unit). Route unveraendert lassen, Key im Journal als "kein additives
          Ziel" vermerken. Nur wo die NACHBAR-Route desselben Resources bereits `RequirePermission`
          nutzt (z.B. Team-Inbox-Update/Add-/RemoveMember neben Create/Delete), dort additiv
          erweitern.
      (b) EIN MODUL-KEY KANN MEHRERE GATEWAY-DATEIEN TREFFEN. "kommunikation" im Katalog bildet
          NICHT 1:1 auf eine `route_kommunikation.go` ab, sondern verteilt sich auf `route_chat.go`
          (channel:manage), `route_inbox.go` (canned:manage, team_inbox:manage) und hat fuer
          webhook:manage gar keinen Endpoint. Vor dem Guarding den FE-Gate-Call
          (`useHasCapability('modul:key')`) grep'en, die UI-Aktion identifizieren, dann DEREN
          Backend-Route suchen — nicht von der Modul-Datei her raten. `WELLEN-BRIEFING.md` (Welle
          2b/2c-Absaetze) nennt oft schon, welche Sub-Keys pro Modul ueberhaupt erwartet werden.
      (c) EIN "manage"-KEY DECKT NICHT ZWINGEND ALLE CRUD-VERBEN GLEICH AB. Booking-Pages: write+
          delete beide auf denselben `kalender:booking_page:manage`-Key. Ticket-Edit: PUT+close+
          reopen+assign+merge alle auf `helpdesk:ticket:edit` (verifiziert gegen den FE-Gate in
          `HelpdeskPage.tsx:1047` `canEditTicket`-Block, nicht geraten). Jede Aktion einzeln gegen
          den FE-Gate-Call pruefen, nicht pauschal "alle Mutationen".
      (d) Guard-Tests gehen weiterhin in `route_capability_guard_test.go` — pro neuem Router-Setup
          (`chi.NewRouter()` + `RegisterRoutes`) EINMAL oben in der Testfunktion, danach nur neue
          Tabellenzeilen. Fuer featureflag-gated Module (helpdesk) den bestehenden
          `newHelpdeskRoutes(...)`-Test-Helper aus `route_helpdesk_test.go` wiederverwenden statt
          neu zu bauen (gleiches Package, package-private Funktion ist sichtbar).

      MUSTER AUS `p2a` (2026-08-01), fuenf Punkte, die dir Arbeit sparen:
      (a) KEINE MIGRATION NOETIG. `p1a-migration` (000256) hat den GESAMTEN Katalog geseedet,
          inklusive Grants pro Preset-Rolle. Vor dem Bauen einmal gegenpruefen, dann nur Guards:
          `docker exec docker-postgres-1 psql -U kmuhub -d kmuhub -tAc "SELECT name||' | '||resource
          ||' | '||action FROM permissions WHERE name LIKE 'helpdesk:%'"` — die resource/action-
          Zerlegung ist die, die `RequirePermissionAny` erwartet (`wiki:article:read` ->
          `[2]string{"wiki:article","read"}`), nicht raten.
      (b) GUARDS ALS LOKALE VARIABLEN vor dem `r.Route(...)` deklarieren, nicht inline pro Zeile —
          die Key-Map wird dann einmal beim Wiring gebaut statt pro Route, und die Route-Tabelle
          bleibt lesbar. Vorlage: `route_wiki.go` (var-Block direkt ueber `r.Route("/api/v1/wiki")`).
      (c) TESTS GEHOEREN IN DIE BESTEHENDE `internal/gateway/route_capability_guard_test.go` —
          Faelle in die Tabelle ergaenzen, keine zweite Datei. Die Helper `guardTestAuth` und
          `withPermissions` liegen dort. WICHTIG: auf den EXAKTEN Status pruefen
          (`allowed` = 503 bei leerer Registry, `denied` = 403), nicht auf "irgendwas ausser 403" —
          ein vertippter Pfad liefert 404 und wuerde eine lockere Assertion erfuellen, ohne dass je
          ein Guard lief. Mindestens ein Fall pro Route-Gruppe: nur Alt-Key, nur Neu-Key, keiner
          von beiden.
      (d) NICHT JEDER KATALOG-KEY HAT EINEN ENDPOINT und nicht jede Route hat einen Katalog-Key.
          Fehlt der Endpoint: Key liegen lassen, im Journal vermerken, KEINE Route erfinden. Fehlt
          der Katalog-Key zu einer Route (in wiki: `wiki:categories:read`): Guard unveraendert
          lassen, nicht "sinngemaess" einen fremden Key danebenlegen.
      (e) Additiv heisst hier real ERWEITERND: der Neu-Key hat teils mehr Rollen als der Alt-Key
          (`wiki:article:read` auch fuer readonly/it_admin/hr_admin, `wiki:articles:read` nur
          admin/manager/member). Das ist die Katalog-Absicht und gewollt. Umgekehrt darf ein Guard
          nie enger werden — wer heute durchkommt, muss morgen durchkommen.
    done_when:
      - Routen additiv abgesichert, Keys existieren
      - go build/vet/lint/test gruen

