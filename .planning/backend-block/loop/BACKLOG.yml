      - backend/internal/rapporte/postgres_repository.go
      - backend/internal/rapporte/postgres_repository_test.go
      - backend/internal/rapporte/service.go
      - backend/migrations/000163_measurements_and_templates.up.sql
    notes: >
      Beim Bauen der Schwester-Unit ist eine Eigenschaft der lokalen DB aufgefallen, die den
      Test scheinbar gruen macht, obwohl der Guard schwaecher ist als gedacht: laeuft der
      EXISTS-Subselect als `kmuhub_app`, filtert die RLS-Policy der ELTERN-Tabelle die fremde
      Zeile bereits weg — ein `WHERE EXISTS (SELECT 1 FROM work_reports WHERE id=$n)` OHNE
      `tenant_id`-Filter besteht denselben Test. Den expliziten `tenant_id`-Filter trotzdem
      schreiben (Defense-in-Depth gegen einen Aufruf unter `sysctx`/BYPASSRLS), aber die
      Mutations-Probe muss den GANZEN Guard entfernen (zurueck auf `VALUES`), sonst beweist
      sie nichts.
    done_when:
      - >-
        `AddWorker` und `CreateMeasurement` lehnen eine `report_id` ab, die nicht zum
        aufrufenden Tenant gehoert (`ErrReportNotFound`), statt die Zeile einzufuegen
      - >-
        Je ein DB-Test pro Funktion belegt die Ablehnung ueber einen zweiten echten Tenant, und
        fuer `CreateMeasurement` belegt ein weiterer, dass ein NIL-`reportID` weiterhin
        akzeptiert wird
