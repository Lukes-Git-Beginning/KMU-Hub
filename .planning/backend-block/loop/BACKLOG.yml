      lang gueltig; der aeltere funktioniert nachweislich noch, nachdem der neuere erzeugt
      wurde. Wer an die aeltere Mail kommt (geteiltes Postfach, weitergeleitete Nachricht,
      Mailarchiv), uebernimmt das Konto -- und der Kontoinhaber sieht davon nichts, weil er
      seinen eigenen, neueren Link ja benutzt hat.
    sources:
      - backend/internal/auth/service.go
      - backend/internal/auth/postgres_repository.go
      - backend/internal/auth/repository.go
      - backend/internal/auth/login_paths_test.go
    notes: >
      Schlankster Weg: eine Repository-Methode, die vor dem Anlegen alle noch offenen
      Tokens des Nutzers als benutzt markiert (`used_at = now() WHERE user_id = $1 AND
      used_at IS NULL`), im selben Statement-Block wie das Insert. KEINE neue Tabelle, KEINE
      neue Route. `MarkPasswordResetTokenUsed` gibt es schon, sie zielt nur auf eine ID --
      die Erweiterung ist eine zweite Methode daneben, nicht ein Umbau der bestehenden.
      Der Mock in `service_test.go` muss mitziehen. Achtung Tenant: das UPDATE laeuft im
      `sysctx`-Pfad wie das Insert, `tenant_id` gehoert trotzdem in die WHERE-Klausel, damit
      es unter RLS und ohne identisch wirkt.
    done_when:
      - >-
        Ein zweiter Reset-Antrag entwertet den Token des ersten
      - >-
        `TestRequestPasswordReset_ASecondRequestDoesNotKillTheFirstToken` ist auf die neue
        Zusage umgeschrieben (aelterer Link -> ErrResetTokenUsed)
      - >-
        Die bestehenden Reset-Tests in `password_reset_test.go` bleiben unveraendert gruen
      - go test -count=1 ./internal/auth/ gruen, DATABASE_URL gesetzt, 0 Skips

  - id: fix-gobd-archive-hash-never-verified
    phase: 4
    service: biz/gobdarchive
    model: opus
    deps: []
    status: todo
    coverage_start: n.a. (verifizierter Befund, kein Coverage-Ziel)
    scope: >
      VERIFIZIERTER BEFUND (2026-08-27, gefunden beim Bauen von
      `cov-server-gobd-archive-grpc-handlers`, Punkt (4) jener Unit). Der SHA-256 eines
      archivierten Belegs wird beim Schreiben per `io.TeeReader` berechnet und in
      `gobd_documents.sha256` abgelegt (`internal/biz/gobdarchive/service.go:95-113`) --
      und danach nie wieder geprueft. `GetByID`, `List` und `GetDownloadURL` reichen den
      gespeicherten Hash nur durch; `toProtoGobdDocument` schreibt ihn ins Proto
      (`internal/server/biz_grpc_gobd_archive.go:291`). Ein grep ueber das gesamte Backend
      nach `sha256`/`Sha256` findet ausserhalb von Schreibpfad, Repository-Spaltenliste und
      Proto-Mapping keine einzige Vergleichsstelle. Zweiter Beleg: die Konstante
      `models.GobdEventTypeIntegrityCheck = "integrity_check"` (`internal/models/gobd.go:60`)
      existiert im Datenmodell, wird aber von keiner Zeile Go-Code je emittiert -- das Schema
      hat die Pruefung vorgesehen, der Code hat sie nie bekommen. Wirkung: wird ein Objekt im
      MinIO-Bucket ausgetauscht, faellt das nirgends auf; der Hash, der die Unveraenderbarkeit
      nach Paragraph 147 AO belegen soll, erfuellt seinen Zweck nicht. Migration 000315
      (`REVOKE UPDATE, DELETE`) haertet nur die DB-Zeile, nicht die Bytes im Objektspeicher.
    sources:
      - backend/internal/biz/gobdarchive/service.go
      - backend/internal/models/gobd.go
      - backend/internal/server/biz_grpc_gobd_archive.go
      - backend/internal/chat/file/minio_store.go
      - backend/migrations/000315_gobd_archive_worm_privileges.up.sql
    notes: >
      Scope dieser Unit ist ausdruecklich NUR die Service-Methode plus ihre Tests, kein
      Aufrufer. Grund: die Bytes fliessen heute nirgends durch die App -- `GetDownloadURL`
      presigned direkt gegen MinIO, der Prozess sieht den Inhalt nach dem Upload nie wieder.
      Wo die Pruefung ausgeloest wird (periodischer Worker analog
      `internal/security/gdpr/retention_scheduler.go` mit Advisory-Lock, RPC auf Zuruf, oder
      beim GoBD-Export), ist eine Architekturentscheidung und gehoert Luke -- sie haengt
      daran, wie teuer ein Vollscan des Buckets sein darf. Keine neue Route, kein neues
      Feature-Flag, keine `config.RequireX`-Assertion, keine Migration: `integrity_check`
      ist als Event-Typ bereits im ENUM.
      `chatfile.FileStore.Download` existiert und liefert den `io.ReadCloser`, den die
      Pruefung braucht.
    done_when:
      - >-
        `gobdarchive.Service` hat eine Methode, die einen Beleg tenant-gescoped laedt, seine
        Bytes ueber `store.Download` streamt, SHA-256 neu berechnet und gegen die gespeicherte
        Spalte vergleicht
      - >-
        Bei Abweichung liefert sie einen eigenen Sentinel-Fehler (z. B. `ErrIntegrityMismatch`)
        und schreibt ein `models.GobdEventTypeIntegrityCheck`-Event mit dem erwarteten und dem
        gefundenen Hash in `metadata`; bei Uebereinstimmung ebenfalls ein Event, aber ohne
        Fehler
      - >-
        Ein Test belegt den Trefferfall (Store liefert manipulierte Bytes -> Fehler + Event),
        den Gutfall (unveraenderte Bytes -> kein Fehler) und den Fremd-Tenant-Fall
        (`ErrDocumentNotFound`, kein Download, kein Event)
      - Der Aufrufer bleibt aus dem Scope; die offene Entscheidung steht im Journal-Eintrag
      - go test -count=1 ./internal/biz/gobdarchive/ ./internal/server/ gruen, DATABASE_URL gesetzt, 0 Skips

  - id: fix-fuhrpark-delete-driver-license-no-last-check-guard
    phase: 4
    service: fuhrpark
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Bugfix, kein Coverage-Ziel)"
    scope: >
      Fund aus `cov-gateway-fuhrpark-licenses-and-documents` (Iteration 17, Lauf 12).
      `driver_licenses` fuehrt eine Zeile je durchgefuehrter Fuehrerscheinkontrolle; die
      JEWEILS LETZTE Zeile je `driver_id` ist der aktuelle Kontrollstand und der Nachweis
      der Halterpflicht (siehe `internal/gateway/route_fuhrpark.go` HandleDeleteDriverLicense
      Doc-Kommentar). `Service.DeleteDriverLicense` (`internal/fuhrpark/service.go:849`)
      delegiert ungeprueft an `PostgresRepository.DeleteDriverLicense`
      (`internal/fuhrpark/postgres_repository.go:948`), die jede Zeile per `id` loescht — ohne
      zu pruefen, ob es die einzige oder juengste Kontrollzeile fuer ihren `driver_id` ist. Der
      Gateway-Handler `HandleDeleteDriverLicense` (Route `DELETE
      /api/v1/fuhrpark/driver-licenses/{id}`, Permission `fuhrpark:license:write`) reicht das
      unveraendert durch. Ein Loeschen der letzten Kontrollzeile eines Fahrers macht die
      Halterhaftungs-Pruefung fuer diesen Fahrer spurlos verschwinden.
      Fix: vor dem Loeschen pruefen, ob die Zeile die neueste (`checked_at` bzw. `created_at`
      MAX) fuer ihren `driver_id` innerhalb des Tenants ist, und in diesem Fall mit einem
      fachlichen Fehler (z. B. `codes.FailedPrecondition`, HTTP 409) ablehnen. Alternativ, falls
      Luke das Feature stattdessen fuer nachtraegliche Korrekturen (Tippfehler-Zeile loeschen)
      offen halten will, wenigstens ein Audit-Event schreiben, das den Verlust nachvollziehbar
      macht — die Entscheidung zwischen beiden Wegen gehoert Luke, nicht der Unit.
    sources:
      - backend/internal/fuhrpark/service.go
      - backend/internal/fuhrpark/postgres_repository.go
      - backend/internal/fuhrpark/repository.go
      - backend/internal/server/fuhrpark_grpc.go
      - backend/internal/gateway/route_fuhrpark.go
      - backend/internal/fuhrpark/driver_license_test.go
    notes: >
      `driver_license_test.go` deckt DeleteDriverLicense bereits fuer Not-Found und
      Cross-Tenant ab, aber nicht fuer den Fall "letzte/einzige Kontrollzeile eines Fahrers".
      Vor dem Bauen mit Luke klaeren, ob ein harter Block (409) oder ein Audit-Trail die
      richtige Antwort ist — das ist eine Produktentscheidung, kein reiner Bugfix.
    done_when:
      - >-
        DeleteDriverLicense blockiert das Loeschen der neuesten Kontrollzeile eines
        driver_id (409/FailedPrecondition) ODER schreibt beim Loeschen ein Audit-Event, das
        den Verlust nachvollziehbar macht — Wahl zwischen beiden Wegen mit Luke vorab klaeren,
        bevor gebaut wird
      - Die gewaehlte Absicherung ist implementiert und durch einen Test belegt
      - >-
        Ein bestehender Kontrollstand kann nicht mehr spurlos verschwinden, ohne dass es
        nachvollziehbar ist

