  - id: fix-inbox-routing-rule-actions-struct-vs-array
    phase: 3
    service: server
    model: sonnet
    deps: []
    status: done
    coverage_start: "n.a."
    scope: >
      Gefunden in Iteration 43 (cov-server-inbox-and-grpc-core). Routing-Regeln lassen sich ueber
      die API gar nicht anlegen (Totalausfall des Features). Vertrag widerspricht sich:
      `inbox.proto` typisiert `conditions` UND `actions` als `google.protobuf.Struct` (JSON-Objekt),
      `routing.validateActions` (`internal/inbox/routing/service.go:387`) verlangt aber ein
      JSON-ARRAY `[{type, config}]` (`[]models.Action`), und das Frontend (`inbox-types.ts:113`,
      `RuleAction[]`) schickt ein Array. Pfad: Gateway `rawJSONToStruct` (`route_inbox.go:1387`)
      scheitert an einem Array mit 400 "invalid actions JSON"; ein Objekt oder fehlendes `actions`
      (`structToJSON(nil)` = `{}`) scheitert in `validateActions` mit `ErrInvalidAction` -> 400.
      Reproduziert gRPC-seitig in
      `TestCreateRoutingRule_StructActionsAreAlwaysRejected` (`internal/server/inbox_grpc_handlers_test.go`),
      das den IST-Zustand festschreibt und mit dem Fix auf NoError kippen muss.
      Dasselbe gilt fuer `UpdateRoutingRule` mit `actions`. `jsonToStruct` (Lesepfad,
      `inbox_grpc.go:1371`) hat zwar einen Wrap-Fallback, der bei einem Array aber selbst
      scheitert (`json.Unmarshal` Array in `map`) -- gespeicherte Array-Regeln koennten beim
      Lesen also ebenfalls fehlschlagen; beim Bauen pruefen.
    sources:
      - backend/proto/inbox/v1/inbox.proto
      - backend/internal/server/inbox_grpc.go
      - backend/internal/gateway/route_inbox.go
      - backend/internal/inbox/routing/service.go
      - desktop/src/renderer/src/api/inbox-types.ts
    notes: >
      Der `.proto`-Typ ist der Kern: `actions` muss ein `google.protobuf.ListValue` (oder
      `bytes`/`string` mit rohem JSON) werden, damit ein Array durch die Leitung passt --
      Proto-Aenderung = Regen im selben Commit (`make proto-inbox`), Wire-Form
      `{items}`/Array gegen den FE-Typ pruefen, nicht raten. Alternative ohne Proto-Aenderung:
      Gateway wickelt das Array in `{"actions":[...]}` und der Server entpackt -- haesslich,
      aber rueckwaertskompatibel; Entscheidung begruenden. Feld-Nummern nie wiederverwenden.
    done_when:
      - >-
        POST /api/v1/inbox/rules mit `actions: [{type:"add_tags",config:{...}}]` legt eine Regel an
        und GET /rules liefert sie im selben Array-Format zurueck (Test gegen Gateway+Server)
      - >-
        `TestCreateRoutingRule_StructActionsAreAlwaysRejected` ist durch einen Erfolgstest
        ersetzt; ein unbekannter Action-Typ bleibt 400
      - openapi.yaml beschreibt `actions` als Array; swagger-cli validate gruen
      - go test -count=1 ./internal/server/ ./internal/gateway/ ./internal/inbox/... gruen, DATABASE_URL gesetzt, 0 Skips

