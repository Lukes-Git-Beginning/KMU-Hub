  - id: fix-inbox-chat-reply-adapter-not-wired
    phase: 4
    service: notification
    model: opus
    deps: []
    status: done
    target: eine Antwort auf eine Chat-DM oder Erwähnung in der Inbox landet als Nachricht im Chat-Kanal
    coverage_start: n.a. (Bugfix)
    scope: >
      TOTALAUSFALL, gefunden in `scan-stub-reports-success` (Lauf 18, Iteration 36). Chat-DMs und Erwähnungen werden
      über den Event-Bus zu Inbox-Nachrichten mit `channel = "chat"` und `SourceID = ChannelID`
      (`internal/chat/message/service.go:201-237`, `cmd/notification/main.go:421-445,520-528`). Der Notification-Service
      registriert aber `adapter.NewChatAdapter(nil)` (`cmd/notification/main.go:195`). `ChatAdapter.HandleReply`
      (`internal/inbox/adapter/chat_adapter.go:99-104`) antwortet dann immer mit "client not configured", das fällt in
      `mapInboxError` auf den Default (`internal/server/inbox_grpc.go:1557`) und endet als 500. Jede Antwort aus dem
      Kommunikations-Modul (`desktop/.../modules/kommunikation/ConversationThread.tsx:191`, `useReplyToMessage`) auf
      eine Chat-Nachricht scheitert damit für jeden Nutzer. Fix: in `cmd/notification/main.go` analog zum Email-Client
      einen gRPC-Client auf `cfg.ChatGRPCAddress` (existiert, Default `localhost:50053`) mit
      `TenantOutboundUnaryInterceptor` bauen und einen `ChatClient`-Adapter implementieren: `CreateMessage` über
      `SendMessage` (Absender = antwortender Nutzer, über die Metadaten bzw. das Request-Feld, das der Chat-Server
      wirklich liest), `MarkRead` über `MarkChannelRead`. `ListDMsAndMentions` hat keine passende RPC: leer lassen wie
      heute (Ingest läuft über den Event-Bus), mit `lean:`-Marker. Ohne erreichbaren Chat-Dienst bleibt die Antwort ein
      ehrlicher Fehler, kein 500 ohne Text: eigener Sentinel bzw. Mapping auf `Unavailable`.
    sources:
      - backend/cmd/notification/main.go
      - backend/internal/inbox/adapter/chat_adapter.go
      - backend/internal/server/inbox_grpc.go
      - backend/internal/server/chat_grpc.go
      - backend/proto/chat/v1/chat.proto
    notes: >
      `deploy/` ist in diesem Lauf gesperrt: der Notification-Dienst bekommt in `deploy/docker/docker-compose.yml:237-249`
      weder `CHAT_GRPC_ADDRESS` noch `EMAIL_GRPC_ADDRESS`. Der Code-Fix wirkt in Produktion erst mit dem Passthrough aus
      `ops-notification-grpc-address-passthrough` (BACKLOG-NEXT.yml), in `offen:` vermerken. Keine neue
      `config.RequireX`. Prüfen, ob der Chat-Server Mitgliedschaft des Absenders im Kanal erzwingt (sonst kann über
      die Inbox in einen fremden Kanal geschrieben werden; die Inbox-Nachricht gehört aber dem Empfänger der DM).
    done_when:
      - 'Test: Reply auf eine chat-Inbox-Nachricht ruft SendMessage mit Kanal = SourceID und Absender = antwortender Nutzer'
      - 'Test: Chat-Dienst nicht erreichbar -> kein Internal ohne Text, sondern Unavailable bzw. eigener Fehler'
      - go test -count=1 für internal/inbox/... und internal/server -run Inbox grün, DATABASE_URL gesetzt, 0 Skips

