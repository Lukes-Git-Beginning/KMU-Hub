  - id: fix-gateway-id-validation-consistency
    phase: 3
    service: gateway
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/gateway 34,9 %"
    scope: >
      `internal/gateway/route_biz_billing.go` liest an elf Stellen `chi.URLParam(r, "id")`
      (Z. 115, 141, 167, 206, 246, 284, 394, 457, 702, 766, 803) und ruft `validateUUIDParam`
      (helpers.go:114) an KEINER — der Helfer kommt in der Datei null mal vor. Dasselbe gilt
      laut Lauf-7-Journal für `HandleDeleteTask` und `HandleMoveTask` in
      route_work_tasks.go. Eine unbrauchbare ID erreicht damit die RPC und kommt als
      Downstream-Fehler zurück statt als 400 an der Grenze.
    sources:
      - backend/internal/gateway/route_biz_billing.go
      - backend/internal/gateway/route_work_tasks.go
      - backend/internal/gateway/helpers.go
      - backend/internal/gateway/testutil_test.go
    notes: >
      Das ist ausdrücklich KEIN Sicherheitsproblem — der Service validiert serverseitig, das
      Journal hält das so fest. Es geht um einen einheitlichen Statuscode an der Grenze und
      darum, dass der Downstream nicht mit offensichtlichem Müll belastet wird.
      Vor dem Umbau greppen, wie viele Handler im ganzen Gateway `chi.URLParam` ohne
      `validateUUIDParam` lesen. Wird die Zahl groß (deutlich über ~20), NICHT alles in
      dieser Unit umbauen: die Fundstellen im Journal auflisten, hier nur
      `route_biz_billing.go` und die beiden Task-Handler erledigen und eine Folge-Unit für
      Lauf 9 anlegen. Eine Iteration, die 60 Handler anfasst, läuft in den Budget-Deckel.
      Achtung Grenzfälle: nicht jeder `{id}`-Parameter IST eine UUID (Slugs, numerische Ids,
      Composite-Keys). Vor dem Umstellen je Handler prüfen, sonst brichst du eine Route.
    done_when:
      - Alle elf ID-Handler in route_biz_billing.go lesen über validateUUIDParam, sofern der
        Parameter tatsächlich eine UUID ist
      - HandleDeleteTask und HandleMoveTask ebenso
      - Parameter, die keine UUID sind, sind identifiziert und bewusst ausgenommen, mit
        Begründung im Journal
      - Gesamtzahl der verbleibenden ungeprüften Fundstellen im Gateway im Journal genannt,
        Folge-Unit angelegt falls nötig
      - Ungültige ID liefert 400 statt eines Downstream-Fehlers
      - Mutations-Probe durchgeführt und im Journal belegt
      - go test -count=1 ./internal/gateway/ grün

  - id: fix-email-sync-imap-connect-no-timeout
    phase: 3
    service: email
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/email/sync 10,9 %"
    scope: >
      `IMAPClient.Connect` (internal/email/sync/imap_client.go) ruft
      `imapclient.DialTLS(addr, nil)` bzw. `DialStartTLS(addr, nil)` mit NIL-Optionen auf —
      also ohne Dial-Timeout und ohne Read-Deadline. Ein Postfach-Server, der die Verbindung
      annimmt und dann schweigt, hängt den Sync-Worker unbegrenzt. Das Schwesterpaket
      `internal/email/send` macht es richtig und ist die Vorlage:
      `smtpDialTimeout = 10 * time.Second` und `smtpExchangeDeadline = 30 * time.Second`
      (service.go:344-355), angewandt über `net.DialTimeout` (:378), `conn.SetDeadline` (:383)
      und `tls.DialWithDialer(&net.Dialer{Timeout: ...})` (:403).
    sources:
      - backend/internal/email/sync/imap_client.go
      - backend/internal/email/send/service.go
      - backend/internal/email/send/smtp_timeout_test.go
      - backend/internal/email/sync/worker.go
    notes: >
      Gefunden beim Backlog-Bau am 2026-08-10 (nicht von Lauf 7). Die Konstanten aus
      `email/send` wiederverwenden statt neue zu erfinden — gleicher Zweck, gleiche Werte,
      und ein Postfach-Abruf ist nicht zeitkritischer als ein Versand.
      `smtp_timeout_test.go` ist die fertige Vorlage für den Test: ein TCP-Fake-Server, der
      die Verbindung annimmt und dann schweigt. Das Muster lässt sich für IMAP übernehmen,
      ohne einen echten Mailserver zu brauchen.
      Prüf beim Lesen mit, ob `worker.go` einen eigenen Kontext mit Deadline mitgibt — falls
      ja, greift der bereits teilweise und das gehört in die Begründung im Journal statt einer
      doppelten Absicherung.
    done_when:
