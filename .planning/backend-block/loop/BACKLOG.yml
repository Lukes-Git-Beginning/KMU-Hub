  - id: fix-work-task-custom-field-values-wrong-fk
    phase: 4
    service: work
    model: opus
    deps: []
    status: done
    coverage_start: "n.a. (Schema-Fix, kein Coverage-Ziel)"
    scope: >
      Gefunden in cov-gateway-work-labels-custom-fields (Iteration 36, 2026-08-22), live gegen die
      lokale DB verifiziert: `task_custom_field_values.field_id` traegt noch die urspruengliche FK
      aus Migration 000026 (`REFERENCES custom_field_definitions(id) ON DELETE CASCADE`) —
      der GENERISCHEN, CRM-only Tabelle aus Migration 000005, deren `entity_type`-Check-Constraint
      NUR 'contact', 'company', 'deal', 'activity' erlaubt ('task' ist kein gueltiger Wert).
      Migration 000146 hat spaeter `work_custom_field_definitions` als EIGENE Tabelle mit eigenem
      ID-Raum angelegt, exponiert ueber `/api/v1/work/custom-fields` (internal/work/customfield).
      Jede ID, die `HandleCreateCustomFieldDefinition` zurueckgibt, stammt aus
      `work_custom_field_definitions` — aber `HandleSetTaskCustomFieldValues`
      (route_work_tasks.go) reicht genau diese ID als `field_id` an
      `work/task/postgres_repository.go:586` (`SetCustomFieldValues`) durch, welches sie in
      `task_custom_field_values` einfuegt. Die FK zeigt auf die falsche Tabelle: JEDER Versuch,
      einen Custom-Field-Wert an einer Aufgabe zu setzen, schlaegt mit
      `foreign_key_violation` auf `task_custom_field_values_field_id_fkey` fehl. Live bestaetigt:

        DO $$ ... INSERT INTO task_custom_field_values (..., field_id, ...)
        VALUES (..., <echte work_custom_field_definitions.id>, ...)
        -- ERROR: insert or update on table "task_custom_field_values" violates
        -- foreign key constraint "task_custom_field_values_field_id_fkey"

      `GetCustomFieldValues` (postgres_repository.go:613) hat denselben Fehler auf der Lesenseite:
      `JOIN custom_field_definitions cfd ON tcfv.field_id = cfd.id` statt
      `work_custom_field_definitions`. Beide Pfade sind seit Migration 000146 (nicht datierbar aus
      dem Repo, aber klar VOR diesem Lauf) tot — die Custom-Fields-Sektion der TaskDetailPage kann
      nie erfolgreich einen Wert speichern.
    sources:
      - backend/migrations/000026_create_task_collaboration.up.sql
      - backend/migrations/000146_work_custom_field_definitions.up.sql
      - backend/internal/work/task/postgres_repository.go
      - backend/internal/work/customfield/postgres_repository.go
      - backend/internal/gateway/route_work_tasks.go
    notes: >
      Migration statt Code-Fix: die FK muss von `custom_field_definitions(id)` auf
      `work_custom_field_definitions(id)` umgehaengt werden (DROP CONSTRAINT + ADD CONSTRAINT mit
      `REFERENCES work_custom_field_definitions(id) ON DELETE CASCADE`). Vor dem DROP pruefen, ob in
      Produktion ueberhaupt Zeilen in `task_custom_field_values` liegen — wenn ja, sind das
      Karteileichen mit IDs aus der falschen Tabelle und muessen vor dem ALTER geloescht werden
      (mit Begruendung im Migrationskopf, nicht stillschweigend), sonst schlaegt die neue FK beim
      Anlegen fehl.
      `GetCustomFieldValues`s JOIN im selben Commit auf `work_custom_field_definitions` umstellen,
      sonst bleibt die Lesenseite kaputt, obwohl die Schreibseite repariert ist.
      Root Cause, nicht Symptom: NICHT die App-Schicht so bauen, dass sie den FK-Fehler abfaengt und
      stillschweigend verwirft — das wuerde den Bug nur verstecken.
      Nach dem Fix: ein DB-Test in `internal/work/task` oder `internal/work/customfield`, der einen
      echten Custom-Field-Wert ueber eine `work_custom_field_definitions`-ID setzt und liest, als
      Regressionsschutz — bislang existiert dafuer kein Test (die Luecke ist nie aufgefallen, weil
      niemand sie DB-gestuetzt getestet hat).
    done_when:
      - Migration haengt task_custom_field_values.field_id auf work_custom_field_definitions(id) um,
        mit Begruendung im Kopf und einer Aussage zu bestehenden Karteileichen-Zeilen
      - GetCustomFieldValues joint auf work_custom_field_definitions statt custom_field_definitions
      - Ein DB-Test setzt einen Wert mit einer echten work_custom_field_definitions-ID und liest ihn
        zurueck, ohne FK-Fehler
      - down-Migration stellt die alte FK wieder her
      - go test -count=1 ./internal/work/task/... ./internal/work/customfield/... gruen,
        DATABASE_URL gegen kmuhub_app

  - id: fix-idempotency-reserve-inflight-race
    phase: 4
    service: gateway
    model: opus
    deps: []
    status: done
    coverage_start: "n.a. (Verhaltens-Fix, kein Coverage-Ziel)"
    scope: >
      Gefunden in fix-idempotency-real-sql-coverage-core (Iteration 37, 2026-08-22), live gegen
      die lokale DB verifiziert: `postgresRepository.Reserve` (internal/idempotency/postgres_repository.go:79)
      kann unter der echten `INSERT ... ON CONFLICT (tenant_id, key) DO UPDATE ... RETURNING`-Query
      NICHT unterscheiden zwischen "ich habe die Zeile gerade frisch angelegt" und "jemand anders
      war eine Millisekunde vor mir mit demselben Schluessel da". Beide Faelle liefern
      `(nil, nil)`, solange `completed_at` noch NULL ist — der dokumentierte Vertrag
      ("same hash, no response yet → ErrInFlight", Zeile 47) wird vom Code nicht eingehalten;
      `ErrInFlight` wird VON KEINER STELLE in `postgres_repository.go` je zurueckgegeben, nur vom
      Mock in `repository_test.go`. Zwei nahezu gleichzeitige Requests mit demselben
      Idempotency-Key fuehren die Handler-Logik dadurch BEIDE aus — genau der Doppelbuchungsfall,
      den der Schluessel verhindern soll (Dialer-Outcomes, Finance-Buchungen, Webhooks).
      Neu bewiesen in `internal/idempotency/postgres_repository_db_test.go`
      (`TestPostgresReserve_ConcurrentSameKey_NoErrorEitherSide`, echte Nebenlaeufigkeit ueber
      zwei Goroutinen). Bereits als Randnotiz bekannt, aber nur fuer EINEN Aufrufer als out-of-scope
      markiert: `internal/automation/workflow/webhook.go:164` traegt seit einem frueheren Lauf einen
      `lean:`-Marker genau dazu ("Upgrade when internal/idempotency's Reserve is hardened for
      that race") — diese Unit ist dieses Upgrade, fuer die gemeinsame Infrastruktur statt nur
      fuer den Webhook-Pfad.
    sources:
      - backend/internal/idempotency/postgres_repository.go
      - backend/internal/idempotency/postgres_repository_db_test.go
      - backend/internal/middleware/idempotency.go
      - backend/internal/automation/workflow/webhook.go
    notes: >
      Root Cause: die RETURNING-Zeile allein sagt nicht, ob der eigene INSERT oder der
      ON-CONFLICT-Zweig gefeuert hat. Der uebliche Trick ist `xmax = 0` im RETURNING-Ausdruck
      (xmax=0 heisst: diese Zeilenversion wurde von dieser Transaktion frisch eingefuegt, nicht
      per UPDATE veraendert) — `RETURNING ..., (xmax = 0) AS inserted`. Bei `inserted = false` UND
      `completed_at IS NULL` ist der Aufrufer NICHT der erste; das ist der Fall, der `ErrInFlight`
      auslösen muss, nicht `(nil, nil)`.
      Diese Aenderung veraendert das Verhalten von JEDEM bestehenden Aufrufer von `Reserve` —
      `internal/middleware/idempotency.go` behandelt `ErrInFlight` bereits korrekt (Zeile 193,
      `isInFlightErr`), ebenso `internal/automation/workflow/webhook.go` (Zeile 213). Beide Caller
      pruefen, nicht anpassen ist das Ziel — sie sollen den Fehler jetzt tatsaechlich SEHEN statt
      ihn nie auszuloesen.
      Reine Code-Aenderung, kein Schema-Wechsel und keine neue Migration noetig (xmax ist
      System-Spalte, keine Tabellenspalte).
      Mutations-Probe Pflicht: `inserted`-Bedingung umdrehen oder entfernen, pruefen dass die
      Concurrent-Reserve-Tests rot werden, zurueckdrehen.
    done_when:
      - Reserve liefert ErrInFlight fuer den Nicht-Gewinner einer gleichzeitigen Reservierung
        desselben Schluessels, ueber `xmax = 0` oder eine gleichwertige Erkennung
      - Der Gewinner (frischer INSERT) erhaelt weiterhin (nil, nil) wie bisher
      - `TestPostgresReserve_ConcurrentSameKey_NoErrorEitherSide` wird durch eine Version ersetzt,
        die ErrInFlight fuer genau eine Seite und (nil, nil) fuer die andere erwartet — Testname
        entsprechend anpassen (nicht mehr "NoErrorEitherSide")
      - `internal/middleware/idempotency.go` und `internal/automation/workflow/webhook.go` bleiben
        unveraendert korrekt (bestehende Tests gruen), der `lean:`-Marker in webhook.go wird entfernt
        oder auf "resolved" aktualisiert
      - go test -count=1 -race ./internal/idempotency/... ./internal/middleware/...
        ./internal/automation/workflow/... gruen, DATABASE_URL gegen kmuhub_app

