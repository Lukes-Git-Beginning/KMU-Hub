# ------------------------------------------------------------------------------------------
# HARTE REGELN FÜR DIESEN LAUF
#
#   1. Root Cause, nicht Symptom. Vor jedem Fix alle Caller der angefassten Funktion greppen.
#      Sitzt derselbe Bug in einer Schwesterfunktion, gehört er in dieselbe Unit.
#   2. Mutations-Probe ist Pflicht: eine Zeile der Fix-Logik brechen, prüfen dass ein Test rot
#      wird, zurückdrehen, Diff sauber. Ohne Probe ist der Test nicht bewiesen. Zum
#      Zurückdrehen eine `cp`-Sicherungskopie verwenden, NICHT `git checkout --` — das löscht
#      uncommittete Arbeit mit (Lehre aus Lauf 11 Iteration 3).
#   3. `go test` ohne `DATABASE_URL` ist KEIN Gate. Die Rolle muss `kmuhub_app` sein —
#      `kmuhub` hat BYPASSRLS und würde jede RLS-Lücke durchwinken.
#   4. NEUE DB-TESTS UNGETAGT. Kein `//go:build integration` — getaggte Tests laufen weder im
#      lokalen Gate noch im Coverage-Job und bewegen `coverage_start` nicht.
#   5. Ein DB-Test, der lokal grün ist, weil der Pool nur EINE warme Verbindung hatte, beweist
#      nichts. Wer eine Ressource PRO VERBINDUNG prüft (Advisory Locks, Session-GUCs, temporäre
#      Tabellen), hält vorher eine zweite Verbindung fest.
#   6. Wer ein bestehendes Muster als Vorlage kopiert, kopiert seine Fehler mit. Die Vorlage
#      vorher prüfen, nicht nur nachbauen.
#   7. `-race` läuft auf dieser Maschine nicht (kein `gcc` im PATH). Wo eine Unit `-race`
#      verlangt, gehört das in die `offen:`-Zeile; CI ist der Beweis.
#   8. `go test` über mehrere DB-Pakete mit vollem Parallelismus reißt mit
#      "53300 remaining connection slots are reserved" ab. `-p 1` verwenden. Kein Code-Fehler.
#   9. Scan-Units: ein Fund ohne angelegte Unit ist kein Fund. `neue-units:` im Journal muss
#      die IDs nennen, die wirklich in dieser Datei stehen.
#  10. Jede neue Tabelle braucht `tenant_id UUID NOT NULL` + RLS-Policy — oder einen Eintrag in
#      der System-Global-Liste (ADR-006). Kein stiller dritter Weg. Jeder neue
#      `RequirePermission`-Guard braucht seine Seed-Migration, sonst 403 für alle.
#  11. Eine Prämisse aus dem Backlog, die sich am Code als falsch erweist, wird NICHT trotzdem
#      gebaut. Sie wird im Journal widerlegt und die Unit IM SELBEN COMMIT auf `blocked` mit
#      `blocked_reason` gesetzt. Kommentarlos überspringen ist ein Fehlschlag der Iteration.
#  12. Keine neue `config.RequireX`-Assertion, kein Scharfschalten neuer `modules.*`-Flags.
#
# GESPERRT IN DIESEM LAUF (nicht anfassen, auch nicht "nur schnell"):
#   - Frontend/Desktop jeder Art. Der Loop hat kein Playwright-Gate.
#   - CSAT und die übrigen Public-Token-Routen — stillgelegt, siehe BACKLOG-PARKED.yml
#     (Projekt "Public Web Surface").
#   - `internal/biz/bexio` — G3, produktiv aus, Schweizer Software außerhalb der DE-Fokussierung.
#   - Electron-Upgrade / Dependency-Bumps.
#   - Migrations-Umnummerierungen. Neue Migrationen sind forward-only, Nummer zur Laufzeit.
#   - Preise, Modul-Zuschnitt, `lib/pricing.ts` — offene Produktentscheidungen.
#   - UMBENENNUNGEN (Go-Modulpfad `github.com/kmuhub/kmuhub`, DB-Rollen, Container-, Volume-
#     und Verzeichnisnamen). Die Konsolidierung auf Cosmi/Zentria ist gewollt, aber sie ist
#     EIN zusammenhängender Schnitt und keine Iteration — ein halb umbenannter Modulpfad
#     kompiliert nicht. In diesem Lauf wird sie nur INVENTARISIERT (Scan D10), nicht ausgeführt.
#   - `RETENTION_MODE` bleibt `dry_run`. Kein Scharfstellen im Loop, auch nicht für die neuen
#     Retention-Handler.
#   - `deploy/` — GESPERRT BIS AUF ZWEI NAMENTLICH FREIGEGEBENE AUSNAHMEN (Entscheidung Luke,
#     2026-08-24), beide als eigene Unit in Block C:
#       (a) eine Prometheus-Regel für "kein erfolgreicher Backup-Lauf seit 26 h" in
#           `deploy/docker/prometheus/rules/alerts.yml`
#       (b) die Angleichung der SMTP-Anbieter-Empfehlung in
#           `deploy/docker/PRODUCTION_TEMPLATE` an `deploy/ansible/.../env.production.j2`
#     Beide OHNE Compose-Änderung, OHNE neues Env, OHNE `config.RequireX`. Jede weitere
#     Berührung von `deploy/` bleibt verboten — auch `docker-compose.yml`, auch "nur ein Wert".
# ==========================================================================================

