  - id: harden-quote-conversion-unique-index
    phase: 4
    service: biz
    model: opus
    deps: [fix-quote-to-invoice-duplicate-creation]
    status: blocked
    blocked_reason: >
      Die Unit verlangt in ihren eigenen Notes einen Produktionsbefund, den der Loop
      nicht erheben darf (kein Prod-Zugriff): existieren in Produktion nicht-stornierte
      Mehrfach-Rechnungen zum selben `source_quote_id`? Der partielle Unique-Index wuerde
      bei der Migration hart scheitern, CD deployt automatisch — also Deploy-Hazard ohne
      diesen Befund. Luke braucht dafuer genau eine Abfrage auf Prod
      (`-U kmuhub -d kmuhub`):
      SELECT tenant_id, source_quote_id, count(*) FROM finance_invoices
      WHERE source_quote_id IS NOT NULL AND status <> 'cancelled'
      GROUP BY 1,2 HAVING count(*) > 1;
      Leeres Ergebnis => Unit auf todo zuruecksetzen, Migration ist gefahrlos.
      Treffer => vorher eine Entscheidung ueber die Altdaten (welche Rechnung storniert
      wird) — das ist eine Datenaenderung in Produktion und gehoert Luke, nicht dem Loop.
      Kein Bauversuch unternommen, Arbeitsbaum unberuehrt.
    coverage_start: "n.a. (Race-Haertung zu fix-quote-to-invoice-duplicate-creation, Lauf 11 Iteration 70)"
    scope: >
      Restrisiko aus Iteration 70: die Doppelkonversions-Sperre in
      `Service.CreateFromQuote` ist ein Service-seitiger Read-vor-Write-Check
      (`lean:`-Marker im Code). Zwei wirklich gleichzeitige Requests lesen beide
      "keine Rechnung" und schreiben beide. Die robuste Grenze waere ein partieller
      Unique-Index auf `finance_invoices (tenant_id, source_quote_id)
      WHERE source_quote_id IS NOT NULL AND status <> 'cancelled'`.
    sources:
      - backend/internal/biz/invoice/service.go
      - backend/internal/biz/invoice/postgres_repository.go
      - backend/internal/biz/invoice/postgres_repository_quote_link_time_tracking_db_test.go
      - backend/migrations
    notes: >
      VORAB ZU KLAEREN, nicht anzunehmen: existieren in Produktion bereits mehrere
      nicht-stornierte Rechnungen zum selben `source_quote_id`? Dann schlaegt die
      Migration beim Anlegen des Index fehl. Luke hat Prod-Zugriff, der Loop nicht —
      ohne diesen Befund ist die Unit `blocked`.
      Der Index ist partiell ueber die MUTABLE Spalte `status`: ein UPDATE auf
      'cancelled' entfernt die Zeile aus dem Index, ein UPDATE zurueck fuegt sie wieder
      ein und kann dann kollidieren. Das ist gewollt (zwei lebende Rechnungen zu einem
      Angebot bleiben verboten), muss aber im Storno-Pfad getestet werden.
      `TestPostgresRepository_GetByQuoteID_MultipleInvoices` legt heute ZWEI nicht
      stornierte Rechnungen zum selben Quote an und wuerde am Index scheitern — der
      Test ist dann anzupassen (eine der beiden auf 'cancelled'), nicht zu loeschen:
      seine Aussage (GetByQuoteID muss mit mehreren Treffern deterministisch umgehen)
      bleibt gueltig.
      Die Unique-Violation ist im Repository auf einen Sentinel zu mappen — Vorlage
      `isAccountIBANConflict` in `internal/biz/banking` (Constraint-NAME pruefen, nicht
      blossen SQLSTATE) — und im Service auf `ErrQuoteAlreadyConverted` zu falten,
      damit beide Wege denselben 409 liefern.
      Migrationsnummer zur Laufzeit ermitteln, forward-only, `.up.sql` UND `.down.sql`.
    done_when:
      - Der Produktionsbefund zu vorhandenen Mehrfach-Rechnungen pro Quote steht im
        Journal (oder die Unit ist genau deswegen blocked)
      - Partieller Unique-Index per neuer Forward-Migration, .down.sql gefuellt
      - Ein Test belegt: nach Storno der ersten Rechnung gelingt eine zweite Konversion
        weiterhin (der Index blockiert den legitimen Weg nicht)
      - Die Unique-Violation kommt als ErrQuoteAlreadyConverted (409) beim Aufrufer an,
        nicht als roher pg-Fehler (500)
      - go test -count=1 ./internal/biz/invoice/ ./internal/server/ gruen, DATABASE_URL
        gegen kmuhub_app

