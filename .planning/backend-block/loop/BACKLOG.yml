      `COSMI_ENV=production` am 2026-06-05 scharf wurde, kann demnach kein Tenant jemals eine
      DATEV-Client-Nummer speichern oder einen Buchungsstapel hochladen -- rund zwei Monate
      stiller Totalausfall eines steuerlich relevanten Features, ohne dass ein Fehler im
      Frontend anders als ein generischer 500/404 sichtbar wuerde.
    sources:
