      `internal/biz/hr/timetracking/service.go` bekommt `settingsRepo` zwar per
      `NewService(..., settingsRepo, ...)` injiziert (Feld `s.settingsRepo`, Zeile 32/53),
      liest es an KEINER einzigen Stelle im Paket (`grep -n "s\.settingsRepo" service.go`
      liefert null Treffer). Konkret hartkodiert statt konfiguriert:
      - `GetTimeBalance` und `GetTimeAnalytics` rechnen `targetWeeklyMinutes = workDays * 8 * 60`
        — das konfigurierbare `WorkHoursPerDay` hat keinerlei Wirkung auf Saldo oder Analytics.
      - Der ArbZG-Block in `ClockIn` (`errors.go:21`, `service.go:131`) lehnt bei
