      `Service.Import` geht. Für xrechnung geht `resp.Data` direkt rein.
      Kein eigener HTTP-Layer noetig fuer diesen Test — der RPC ist direkt aufrufbar wie die
      bestehenden `internal/server`-Tests es fuer andere RPCs tun, keine neue Test-Infrastruktur
      noetig.
    done_when:
