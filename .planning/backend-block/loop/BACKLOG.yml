  - id: scan-business-logic-in-handlers
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Scan, kein Coverage-Ziel)"
    scope: >
      Architekturregel 1 lautet "Thick Services, Thin Handlers" — Handler machen Parse, Call,
      Respond. Lauf 11 hat den teuersten Verstoss dagegen gefunden: die USt-Gruppierung des
      GoBD-Exports war im gRPC-Handler nachgebaut, mit einem Schluesselfehler, der beim
      Steuerberater gelandet waere (`fix-gobd-export-tax-grouping-rate-key-collision`).
      Zu tun: `internal/gateway/route_*.go` und `internal/server/*_grpc.go` systematisch nach
      demselben Muster absuchen. Kennzeichen: Schleifen ueber Ergebnismengen, Arithmetik,
      `map[...]`-Aggregation, Sortierung mit fachlicher Bedeutung, Statusuebergaenge, alles
      was mit `decimal.` oder `time.` rechnet.
      Fuer jeden Fund die Frage: ist das nur haesslich, oder ist es ein Ort, an dem ein Fehler
      unbemerkt bliebe, weil ihn kein Service-Test erreicht? Nur Letzteres wird eine Unit.
      Reine Stilverstoesse gehoeren ins Journal, nicht in den Backlog — sonst erzeugt dieser
      Scan fuenfzig Refactor-Units, die niemand braucht.
    sources:
      - backend/internal/gateway/
      - backend/internal/server/
      - backend/internal/server/biz_grpc.go
      - backend/internal/biz/tax/calculator.go
    notes: >
      Die Priorisierung ist der eigentliche Wert dieses Scans. Ein Handler, der eine Liste
      sortiert, ist harmlos. Ein Handler, der rechnet, rundet oder gruppiert, ist es nicht.
      Wer einen Fund hat, prueft zuerst, ob dieselbe Rechnung anderswo schon existiert (das
      war bei der Steuerarithmetik der Fall: vier unabhaengige Implementierungen). Dann ist
      die Unit "auf die vorhandene Implementierung ziehen", nicht "in einen neuen Service
      verschieben".
    done_when:
      - >-
        Alle Handler mit Arithmetik, Aggregation oder Statuslogik sind gefunden und im Journal
        gelistet, mit Einordnung "harmlos" oder "riskant" und Begruendung
      - >-
        Fuer jeden riskanten Fund ist eine Unit angelegt; reine Stilverstoesse stehen nur im
        Journal
      - >-
        Fuer jeden Fund ist geprueft, ob dieselbe Rechnung anderswo existiert; falls ja, sagt
        die angelegte Unit "auf die vorhandene ziehen"
      - Kein Verhalten geaendert

  - id: scan-worker-restart-and-lock-release
    phase: 4
    service: server
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Scan, kein Coverage-Ziel)"
    scope: >
      Lauf 10 hat einen Worker gefunden, der nach dem ersten Tick dauerhaft einschlief, ohne
      Fehlermeldung: `idempotency.CleanupWithLock` gab einen Session-Advisory-Lock ueber den
      Pool frei statt ueber die haltende Verbindung, und der neue gdpr-Retention-Scheduler
      hatte den Fehler mitkopiert (behoben in `778a2e44`).
      Zu tun: alle Hintergrundlaeufer im Backend finden und dieselbe Pruefung anwenden.
      Kennzeichen: `go func`, `time.Ticker`, `time.AfterFunc`, `pg_advisory_lock`,
      `pg_try_advisory_lock`, alles was in einem `cmd/*/main.go` mit `go ` startet.
      Je Worker pruefen: (1) haelt er einen Lock, und gibt er ihn ueber DIESELBE Verbindung
      frei, die ihn genommen hat? (2) faengt er Panics ab, oder beendet eine Panik in einem
      Tick den ganzen Worker? (3) laeuft er nach einem Fehlschlag wieder an, oder bricht die
      Schleife ab? (4) gibt es einen Beleg dafuer — einen Test, der den zweiten Durchlauf
      prueft, mit zwei gehaltenen Verbindungen?
      Bekannte Kandidaten: RetentionScheduler, Idempotency-Cleanup, email/sync-Worker,
      fuhrpark/worker.go, vertraege/worker.go, automation/trigger/poller.go.
    sources:
      - backend/cmd/
      - backend/internal/security/gdpr/retention_scheduler.go
      - backend/internal/idempotency/
