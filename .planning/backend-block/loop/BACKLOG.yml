    scope: >
      `middleware.Idempotency` ist in `cmd/gateway/main.go:204` montiert, aber nicht jede
      mutierende Finanzroute verlangt einen Schlüssel. Am 2026-08-22 vorab gesehen:
      `route_hr.go:1621` und `route_schichten.go:790` verlangen ihn HART (400 ohne),
      `route_biz_billing.go:234` und `route_automation.go:706` reichen ihn nur weiter.
      Dieser Scan listet alle mutierenden Routen auf Geldpfaden auf und ordnet je Route ein, ob
      ein fehlender Schlüssel eine Doppelbuchung ermöglicht.
    sources:
      - backend/internal/middleware/idempotency.go
      - backend/cmd/gateway/main.go
      - backend/internal/gateway/
      - backend/api/openapi.yaml
    notes: >
      ZUERST feststellen, welcher `IdempotencyMode` in Produktion gilt — `WarnMode` lässt einen
      fehlenden Schlüssel durch, `HardMode` weist ihn ab. Die Antwort steht in der Konfiguration,
      nicht im Code, und sie entscheidet über die Bedeutung jedes Funds. Ohne diese Antwort ist
      der ganze Scan spekulativ.
      Grundgesamtheit: alle POST/PUT/PATCH/DELETE-Routen unter den Finanz-, Zahlungs-, Mahn-,
