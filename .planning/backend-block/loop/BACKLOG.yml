      - backend/internal/models/datev_upload.go
      - backend/internal/biz/datev/upload_service.go
      - backend/migrations/000115_option_b_phase2_integrations_chat.up.sql
      - backend/migrations/000122_rls_phase2_long_tail.up.sql
      - backend/internal/biz/datev/postgres_upload_repo_test.go
    notes: >
      Gefunden beim Bau der Coverage-Unit f-cov-biz-datev (Lauf 8, Iteration 90). Sauberster
      Fix: `TenantID uuid.UUID` auf beide Modelle ergaenzen, in beiden INSERTs die Spalte
      `tenant_id` mit `middleware.GetTenantID(ctx)` (Muster aus anderen Repos in diesem Repo,
      z. B. rapporte/postgres_repository.go) fuellen -- NICHT per Spalten-Default, das wuerde
