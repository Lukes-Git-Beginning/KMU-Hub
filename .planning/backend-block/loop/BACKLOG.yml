  - id: chore-work-project-actor-and-admin-bypass-lean
    phase: 4
    service: work
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/server 74,8 % · internal/work/project 78,2 %"
    decided: 2026-10-23
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-10-23: Projekte bleiben offen — jeder mit Projektrechten sieht,
      ändert und verwaltet alle Projekte des Tenants. `isAdmin=true` bleibt. Durchgereicht wird
      nur der echte Akteur, damit er dort ankommt, wo er persistiert oder protokolliert wird.
      Die Mitgliedschaftsprüfung im Service bleibt ungenutzt und wird mit `lean:`-Marker
      markiert. Upgrade-Trigger: der erste Kunde, der Projekte nach Mitgliedschaft trennen will.
    scope: >
      VERIFIZIERT bei der Vorbereitung (2026-10-23). `internal/server/work_grpc.go` übergibt
      an 16 Stellen `uuid.Nil` als Nutzer/Akteur UND `isAdmin=true` an `project.Service`
      (Z. 110, 126, 161, 182, 186, 207, 234, 239, 271, 289, 320, 324, 2057, 2089, 2093; Grep
      `\(ctx, [^)]*uuid\.Nil`). Wegen `isAdmin=true` überspringt der Service die
      Mitgliedschaftsprüfung (`project/service.go:114-131` `if !isAdmin { IsMember… }`), es
      blockiert also nichts. Fehlen tut der Akteur: `AddMember`, `RemoveMember`,
      `UpdateMemberRole` nehmen `actorID` (`service.go:255`, `:297`, `:344`).
      Dasselbe Muster ohne `uuid.Nil` bei den Kalender-Ressourcen:
      `internal/server/calendar_grpc.go:901` (`IsAdmin: true, // Gateway handles auth`),
      `:1022`, `:1043` (`isAdmin=true, gateway handles auth`).
      Zu bauen: `callerID(ctx)` an allen 16 work-Stellen als userID/actorID; `isAdmin=true`
      bleibt, je Aufrufgruppe ein `lean:`-Marker mit dem Upgrade-Trigger aus `decision`; bei den
      drei Kalender-Ressourcen-Stellen dieselbe Markierung, Kommentar "Gateway handles auth"
      ersetzen.
    sources:
      - backend/internal/server/work_grpc.go
      - backend/internal/work/project/service.go
      - backend/internal/work/project/postgres_repository.go
      - backend/internal/server/calendar_grpc.go
    notes: >
      Erst ermitteln, wohin `actorID` geht (Spalte `added_by`, Aktivitätslog, Audit-Event,
      nur Log) und das im Journal tabellieren. Wird er nirgends persistiert, ist der Beitrag
      dieser Unit der lean:-Marker plus der Test, der das offene Verhalten festschreibt —
      dann im Journal so benennen, nicht aufblasen.
    done_when:
      - "Test: AddMember als Nutzer X -> der Akteur X kommt dort an, wo er persistiert/protokolliert wird (oder Journal belegt, dass er nirgends ankommt)"
      - "Test: ein Nicht-Mitglied mit Projektrechten sieht das Projekt weiterhin (offenes Verhalten festgeschrieben)"
      - "Kein uuid.Nil-Akteur mehr in work_grpc.go (Grep im Journal)"
      - "lean:-Marker mit Upgrade-Trigger an den isAdmin=true-Stellen in work_grpc.go und calendar_grpc.go"
      - "go test -count=1 ./internal/server/ ./internal/work/... grün, DATABASE_URL gesetzt, 0 Skips"

