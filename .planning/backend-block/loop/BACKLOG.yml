    status: todo
    coverage_start: "n.a. (Fund aus scan-inet-cidr-scanned-into-go-string, Lauf 9 Iteration 11)"
    scope: >
      MUSTER D — Typ-Scan-Mismatch, identisch zur bereits gefixten Vorlage
      `fix-audit-list-verifychain-ip-address-scan`. `SecurityGRPCServer.ListIPRules`
      (backend/internal/server/security_grpc.go:711) selektiert `ip_cidr` (Spaltentyp CIDR,
      Migration 000039_create_security_tables.up.sql:139, `NOT NULL`) roh und scannt sie in
      `models.IPAccessRule.IPCIDR` (Typ `string`, kein Cast). pgx v5 kann CIDR nicht direkt in
      einen Go-`string` scannen. Da die Spalte NOT NULL ist, betrifft das JEDE Zeile ohne
      Ausnahme -- `ListIPRules` ist fuer jeden Tenant mit mindestens einer IP-Regel komplett
      unbenutzbar.
      Reproduziert per DB-gestuetztem Wegwerf-Test (Lauf 9, Iteration 11, nicht committet):
      Zeile mit `ip_cidr = '10.0.0.0/8'` eingefuegt, dieselbe Query wie in `ListIPRules`
      abgesetzt -- Fehler exakt:
      `can't scan into dest[1] (col: ip_cidr): cannot scan cidr (OID 650) in binary format
      into *string`.
    sources:
      - backend/internal/server/security_grpc.go
      - backend/internal/models/security.go
      - backend/migrations/000039_create_security_tables.up.sql
      - backend/internal/security/audit/postgres_repository.go
    notes: >
      Sauberster Fix nach dem Vorlagen-Muster aus `fix-audit-list-verifychain-ip-address-scan`:
      die SELECT-Liste in `ListIPRules` (security_grpc.go:711) von `ip_cidr` auf
      `host(ip_cidr)` oder `ip_cidr::text` umstellen (CIDR ist NOT NULL, `COALESCE` also nicht
      noetig, aber unschaedlich). `CreateIPRule` (INSERT) ist NICHT betroffen -- Parameter-Bindung
      beim INSERT funktioniert bereits (Vorbild: dieselbe Asymmetrie bei `user_sessions`).
      `models.IPAccessRule.IPCIDR` bleibt `string` (Spalte ist NOT NULL, kein Pointer noetig).
      Pin-Test analog zum Repro: eine Regel mit gesetztem CIDR anlegen, `ListIPRules` aufrufen,
      `IPCIDR` im Ergebnis pruefen -- mit MINDESTENS EINER Zeile in der Tabelle, sonst bleibt der
      Bug unsichtbar (bestehende Tests in `security_grpc_test.go` pruefen vermutlich nur den
      leeren Fall oder mocken die DB-Schicht, sonst waere das bereits aufgefallen -- vor dem Fix
      verifizieren).
    done_when:
