      werden (Outstanding netto 600 statt 1000, ggf. TotalPaidAmount 450 statt 400, je nach
      obiger Entscheidung), nicht eine zweite Testdatei danebenlegen.
      `avg_days_to_pay` ist von diesem Fund nicht betroffen (haengt nicht an Zahlungshoehe).
    done_when:
