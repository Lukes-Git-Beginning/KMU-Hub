  # --- berichte -------------------------------------------------------------

  - id: p3-berichte-document-persistence
    phase: 3
    service: berichte
    model: opus
    deps: []
    status: done
    scope: >
      Backend-Persistenz fuer "Bericht-Authoring-Dokumente" (Schicht 4,
      unterscheidet sich von ReportDefinition/Schicht 3). Existiert serverseitig
      bisher ueberhaupt nicht: kein Modell, keine Tabelle, keine Proto-RPCs,
      keine Gateway-Routen — nur FE-Fiktion. `berichte-client.ts` ruft bereits
      list/get/create/update/deleteReportDocument gegen `${BASE}/documents...`,
      die RPCs existieren nicht. CRUD + List fuer ReportDocument nachbauen,
      Schema exakt gegen den FE-Typ.
    sources:
      - desktop/src/renderer/src/api/berichte-types.ts (ab Zeile 377, Abschnitt
        "Report Documents — multi-page authoring (Schicht 4)")
      - desktop/src/renderer/src/api/berichte-client.ts
      - backend/internal/berichte/models.go
      - backend/internal/berichte/postgres_repository.go
      - backend/proto/berichte/v1/berichte.proto
    notes: >
      Als opus eingestuft (nicht sonnet-mechanisch), weil hier ein echter
      Entwurf ansteht: ReportDocument.rows ist ein rows->columns->blocks-Baum
      mit 13 Blocktypen (cover/heading/text/chart/table/kpi/callout/bullet/
      divider/image/pagebreak + geteilte code/simpletable/quote-Bloecke aus dem
      document-Package), text-Bloecke tragen TipTap-HTML. Kernentscheidung:
      rows/settings als schema-loses JSONB speichern und nur an tenant_id +
      Groessenlimit validieren (lean, FE bleibt Owner der Blockstruktur) vs.
      serverseitige Typvalidierung pro Blocktyp. Ersteres ist der lean-Pfad;
      Zweiteres kostet deutlich mehr, faengt aber kaputte Bloecke frueher ab.
      Migrationsnummer zur Laufzeit ermitteln (Stand 2026-07-26: hoechste ist
      000244). status-Enum draft/final/released/archived ohne Genehmigungs-Gate
      (siehe FE-Kommentar "zu buerokratisch fuer KMU"). `template_id` referenziert
      vermutlich eine noch fehlende `report_templates`-Tabelle/Seed-Daten (siehe
      ReportTemplate im selben FE-Typfile) — pruefen, ob Templates hart im FE
      liegen oder ebenfalls Backend brauchen, bevor template_id als FK gebaut wird.
      ERLEDIGT Iteration 10 (Migration 000245). Getroffene Entscheidungen:
      (a) JSONB-Passthrough — rows/settings werden nur auf Form (Array/Objekt),
      JSON-Gueltigkeit und 4-MiB-Deckel geprueft, nie auf Blocktypen; die
      camelCase-Keys des Editors bleiben unveraendert. (b) template_id ist
      TEXT ohne FK, weil Templates FE-seitige Starter-Strukturen sind
      (DEMO_TEMPLATES im MSW-Handler, keine Tabelle) — siehe neue Unit
      p3-berichte-templates. (c) Dokumente gehen NICHT ueber response.Proto:
      protojson wuerde die JSONB-bytes base64-kodieren, darum ein
      handgebautes Wire-Struct (RFC3339-Timestamps, verschachteltes JSON).
    done_when:
      - report_documents-Tabelle, tenant_id NOT NULL + RLS-Policy
      - Create/Get/Update/Delete/List-RPCs + Gateway-Routen, tenant-gescoped
      - Wire-Shape exakt gegen ReportDocument/ListReportDocumentsResponse/
        ReportDocumentResponse in berichte-types.ts
      - RLS-Smoke gruen
      - go build/vet/lint/test gruen

  - id: p3-berichte-server-pdf
    phase: 3
    service: berichte
    model: sonnet
    deps: [p3-berichte-document-persistence]
    status: blocked
    blocked_reason: >
      Architektur-Entscheidung, nicht Mechanik — braucht Luke. Die
      Persistenz-Haelfte ist seit Iteration 10 erledigt
      (p3-berichte-document-persistence, Migration 000245), offen bleibt allein
      die Chart-Frage: ein "chart"-Block laesst sich nicht ueber
      maroto/v2 rendern (kein Chart-Rendering in reinem Go ohne neue
      Dependency wie go-chart/gonum-plot) — Verstoss gegen die
      "keine neue Dependency ohne Not"-Vorgabe dieser Unit. Lean-Vorschlag fuer
      Luke: chart/table-Bloecke im PDF als Datentabelle statt Grafik rendern
      (`lean:`-Marker, Upgrade-Trigger "wenn Kunden PDF-Charts als Pflicht
      melden") — muesste Luke absegnen, bevor eine Iteration das umsetzt.
    scope: >
      Server-PDF fuer Berichte. Das FE hat heute nur window.print() mit
      Print-CSS; fuer einen echten Download fehlt der Server-Render.
    sources:
      - .planning/backend-gaps.md:236
      - backend/internal/berichte/export/pdf.go
      - backend/internal/biz/pdf/
    notes: >
      WICHTIG — der Gaps-Eintrag schlaegt Playwright/Chromium vor. Das ist
      ueberholt: im Repo liegt maroto/v2 als reine-Go-Loesung mit zwei
      funktionierenden Generatoren (internal/biz/pdf fuer Rechnungen und
      Mahnungen, internal/berichte/export/pdf.go). Kein chromedp, kein
      gotenberg, keine neue Dependency. Muster: CRM-Advisory-PDF in Commit
      1c639adf — vorhandenen Generator ueber eine gRPC-RPC exponieren und den
      Gateway-501 ersetzen. Dieses Muster passt aber nur, sobald die
      Document-Persistenz existiert und die Chart-Rendering-Frage geklaert ist
      (siehe blocked_reason).
    done_when:
      - GET /berichte/documents/{id}/export/pdf liefert application/pdf
      - Erzeugt ueber maroto, keine neue Dependency
      - go build/vet/lint/test gruen

  - id: p3-berichte-templates
    phase: 3
    service: berichte
    model: sonnet
    deps: [p3-berichte-document-persistence]
    status: done
    scope: >
      GET /berichte/templates existiert serverseitig nicht — das FE ruft es
      ueber `listReportTemplates` (berichte-client.ts) und die
      Berichts-Bibliothek blendet den Template-Bereich stillschweigend aus
      (`templatesData?.templates ?? []`, kein Crash). Startvorlagen
      (Titel/Beschreibung/Modul/Icon + fertiger rows-Baum) serverseitig
      ausliefern, damit "Neuer Bericht aus Vorlage" gegen echtes BE
      funktioniert.
    sources:
      - desktop/src/renderer/src/api/berichte-client.ts (listReportTemplates)
      - desktop/src/renderer/src/mocks/handlers/berichte.ts (DEMO_TEMPLATES)
      - desktop/src/renderer/src/modules/berichte/components/documents/BerichtLibrary.tsx
      - backend/internal/berichte/
    notes: >
      Lean-Pfad: Templates sind statische Startstrukturen, keine Nutzerdaten —
      also KEINE Tabelle und kein tenant_id, sondern eine serverseitige
      Konstante (analog der system-Definitionen), aus DEMO_TEMPLATES
      uebernommen. Erst wenn Kunden eigene Vorlagen speichern wollen, wird
      daraus eine tenant-gescopte Tabelle; das dann als eigene Unit mit
      RLS-Policy. `report_documents.template_id` ist bewusst TEXT ohne FK
      (Migration 000245), passt also zu beiden Auspraegungen.
      ERLEDIGT Iteration 11. tpl-projekt nutzte im FE-Mock module:"work" —
      "work" ist kein gueltiges Backend-Modul (isValidModule/CHECK-Constraint
      kennen nur finanzen|crm|helpdesk|inventar|produktion|cross). Auf
      Template-Ebene auf "cross" gemappt, damit "Neuer Bericht aus Vorlage"
      nie an der Modul-Validierung scheitert; Block-interne Felder (kpi.source)
      bleiben unveraendert "work", da sie opaque JSONB sind. Siehe Journal.
    done_when:
      - GET /berichte/templates liefert {templates:[...]} im FE-Typ ReportTemplate
      - Wire-Shape der rows-Baeume identisch zu ReportDocument.rows
      - Pfad-Eintrag in backend/api/openapi.yaml
      - go build/vet/lint/test gruen

  - id: p3-berichte-kpi-service
    phase: 3
    service: berichte
    model: opus
    deps: []
    status: done
    scope: >
      Echter KPI-Service statt vorberechneter Platzhalter — Kennzahlen aus den
      echten Modul-Tabellen aggregieren.
    sources:
      - .planning/backend-gaps.md
      - backend/internal/berichte/
    notes: >
      Als opus eingestuft, weil der Zuschnitt der Aggregate und ihre
      Tenant-Isolation Entwurfsarbeit ist, keine Mechanik. Jede Aggregat-Query
      muss tenant-gescoped sein — ein vergessener Scope ist hier ein Datenleck
      ueber Tenant-Grenzen, kein Anzeigefehler.
      ERLEDIGT Iteration 12. Kern des Befundes: der Executor hatte zwar eine
      KPI-Ableitung, `cmd/berichte` wirete aber `executor.Deps{}` — alle
      Downstream-Repos nil, also lieferte `GET /berichte/kpis` produktiv immer
      eine leere Liste. Entscheidungen: (a) EIN neues Interface `KPIRepo`
      (Snapshot pro Periode) statt der vier vollen Report-Repos — die
      Report-Kinds bleiben bewusst auf "downstream_not_available", das ist eine
      eigene Unit. (b) Neues Package `internal/berichte/downstream` mit einer
      Query ueber vier Modul-Tabellen; der Executor bleibt pgx-frei.
      (c) Helpdesk-KPI von "Ersantwort-SLA %" auf "Offene Tickets" gewechselt
      (`lean:`-Marker) — die SLA-Quote braucht Policy-Ziele pro Queue.
      (d) change_percent gegen denselben Zeitraum des Vormonats, damit
      backend-gaps.md:234 mitgeschlossen ist; Bestands-KPIs werden dafuer zum
      Perioden-Ende rekonstruiert, stock_warnings hat keine Historie und traegt
      darum keinen Trend. NICHT enthalten: die Filterung der KPI-Liste nach den
      Modul-Rechten des Users (backend-gaps.md:92) — das braucht das
      RBAC-Fundament aus Phase 1 und gehoert nach Phase 2.
    done_when:
      - KPIs kommen aus echten Tabellen
      - Jede Aggregat-Query tenant-gescoped
      - RLS-Smoke gruen
      - go build/vet/lint/test gruen

  - id: p3-berichte-share-token
    phase: 3
    service: berichte
    model: opus
    deps: [p3-berichte-server-pdf]
    status: todo
    scope: >
      Externer, unauthentifizierter Zugriff auf einen geteilten Bericht:
