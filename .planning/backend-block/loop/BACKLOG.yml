      Wire-Vertrags-Aenderung (Proto-Feldtyp), keine Coverage-Aenderung, nach Backlog-Regel eine
      eigene Unit. Fix-Vorschlag: `actions` im .proto von `google.protobuf.Struct` auf
      `google.protobuf.ListValue` (oder `repeated ActionConfigProto` als eigene Message, falls das
      Team strukturierte statt opaquer Actions bevorzugt) umstellen - das ist ein Breaking Change
      am Wire-Format auf allen drei betroffenen Messages (CreateAutomationRequest,
      UpdateAutomationRequest, AutomationInfo) und erfordert `protoc`-Neugenerierung
      (`C:/Users/Luke/AppData/Local/Microsoft/WinGet/Packages/Google.Protobuf_Microsoft.Winget.
      Source_8wekyb3d8bbwe/bin/protoc.exe`), Anpassung von `automationStructToJSON`/
      `automationJSONToStruct` auf ListValue-Konvertierung, Anpassung von
      `rawJSONToAutomationStruct` im Gateway (arrayJSON -> `structpb.NewList`), und Korrektur der
      "documents current gap"-Tests in `automation_grpc_test.go`
      (`TestCreateAutomation_ActionsStructCannotCarryAnArray`) auf das dann gewuenschte Verhalten.
      Da kein einziges Frontend-Modul automation.actions aktuell erfolgreich schreiben kann, lohnt
      sich vor dem Fix ein kurzer Griff in den FE-Code (`desktop/src/renderer/src/api/
      automation*`), um zu pruefen, ob die FE bereits (fehlerhaft) ein Array sendet oder das
      Feature dort noch gar nicht verdrahtet ist - das aendert nur die Dringlichkeit, nicht den Fix.
    done_when:
