# Backend-Nachtloop — Arbeitsqueue (Lauf 18, gestaged 2026-10-29)
#
# Eine Unit = eine Iteration = ein Commit.
#
# status: todo | in_progress | done | blocked
# model:  sonnet (Default) | opus (architektonisch schwer, Proto, Security, Migration+RLS)
#
# Treiber-Parsing: `hooks/backlog-check.py` lädt diese Datei mit yaml.safe_load. Der Vorflug
# (`--preflight`) bricht ab bei: nicht ladbarem YAML in EINER der drei Dateien, einer Unit ohne
# `id`/`status`, einer Dubletten-ID über die drei Dateien hinweg, `status: blocked` oder einem
# `blocked_reason`-Feld IN DIESER DATEI, einem `done_when[0]`, das eine Entscheidung von Luke
# verlangt, einer `deps`-ID die nirgends existiert, und bei Zyklen in `deps`.
#
# `--state` liefert dem Treiber OPEN=, NEXT= und MODEL=. MODEL kommt von der ERSTEN BAUBAREN
# Unit — `status: todo` UND alle `deps` auf `done`, in DATEIREIHENFOLGE. Wo eine `opus`-Unit
# steht, entscheidet also mit, wie viele Iterationen auf opus laufen.
#
# Läufe 1+2 (58 Units): archive/lauf-1-2/ — Lauf 3 (61): archive/lauf-3/
# Lauf 4 (54): archive/lauf-4/ — Lauf 5 (41): archive/lauf-5/ — Lauf 6 (46): archive/lauf-6/
# Lauf 7 (71): archive/lauf-7/ — Lauf 8 (94): archive/lauf-8/ — Lauf 9 (37): archive/lauf-9/
# Lauf 10 (93, davon 91 done + 2 blocked): archive/lauf-10/
# Lauf 11 (131 Einträge, davon 121 done in 120 Iterationen): archive/lauf-11/ (inkl. Bilanz).
# Lauf 12 (99 Einträge, davon 41 done in 43 Iterationen): archive/lauf-12/ (inkl. Bilanz).
# Lauf 13 (120 Einträge, davon 21 done in 21 Iterationen): archive/lauf-13/ (inkl. Bilanz).
#   Lauf 13 brach nach 21 von 130 Iterationen ab — Ursache und Abhilfe: archive/lauf-13/BACKLOG.yml.
# Lauf 14 (108 Einträge, alle done in 110 Iterationen, Backlog leergelaufen): archive/lauf-14/
#   (inkl. Bilanz). Gemergt als `cadf4bf4` (PR #26), dazu vier Review-Fixes.
# Lauf 15 (26 gestaged, durch Scans auf 74 gewachsen, alle done in 74 Iterationen, Backlog
#   leergelaufen): archive/lauf-15/ (inkl. Bilanz). PR #27 gemergt als `da9fc602`, dazu fünf
#   Review- und CI-Fixes, deployt 2026-10-24.
# Lauf 16 (52 gestaged, durch Scans auf 82 gewachsen, alle done in 82 Iterationen, Backlog
#   leergelaufen um 02:20): archive/lauf-16/ (inkl. Bilanz). PR #28 gemergt als `b88d7eac`,
#   dazu fünf Fixes aus den ersten member-E2E-Flows, deployt 2026-10-25.
# Lauf 17 (107 gestaged, auf 132 gewachsen, 116 done in 117 Iterationen, Deadline 10:00 mit 16
#   Units übrig): archive/lauf-17/ (inkl. Bilanz). PR #29 gemergt als `90b03133`, deployt
#   2026-10-26. Die 16 Reste stehen unten in Block A und B.
#
# Was der Loop NICHT zieht — geparkt oder gestrichen, mit Entscheidung und Zielort:
# BACKLOG-PARKED.yml. Was auf eine Entscheidung wartet: BACKLOG-NEXT.yml. In DIESER Datei steht
# keine `blocked`-Unit. Wird eine Unit im Lauf blockiert, gehört ein `blocked_reason` dazu, der
# sagt, WORAUF sie wartet und WER das entscheidet — und sie wandert IM SELBEN COMMIT nach
# BACKLOG-NEXT.yml. Nicht "vor dem nächsten Lauf": eine blocked-Unit, die hier liegen bleibt,
# lässt den Vorflug des nächsten Laufs abbrechen, bevor die erste Iteration startet (Regel 11).
#
# ==========================================================================================
# STAND DER VORBEREITUNG (2026-10-29, gegen Code, CI und Produktion geprüft)
#
#   - `main` = `90b03133` (Merge PR #29), Produktion auf demselben Code (CD 2026-10-26 09:49,
#     `/health` meldet `90b03133`, 23 Dienste registriert). `backend-loop` = `main` plus
#     Staging-Commits (Archiv Lauf 17, dieser Backlog) plus die FE-Commits des Tages.
#   - MIGRATIONSKOPF = 364 im Repo. Nummer IMMER zur Laufzeit ermitteln:
#     ls backend/migrations | grep -E "^[0-9]{6}" | sort | tail -1
#   - CI grün auf `90b03133` (Run 40300605217: Test, Finance & HR Integration, OpenAPI, Lint,
#     E2E mit 21 Diensten), Nightly 27./28./29.10. grün.
#   - Lokales E2E-Gate `hooks/e2e-local.sh` lief in Lauf 17 in der Loop-Umgebung (368 PASS).
#
# COVERAGE-AUSGANGSLAGE: 76,8 % gesamt bei Gate 15 % (Run 40300605217). Unter 75 % liegen nur
# noch acht Pakete (ohne bexio, das gesperrt ist). Coverage ist in diesem Lauf Auffüller, nicht
# Ziel.
#
# ------------------------------------------------------------------------------------------
# DER ROTE FADEN DIESES LAUFS
#
# "FEHLERKLASSEN-ZWILLINGE."
#
# Lauf 17 hat in seinen E2E- und Coverage-Units Fehler gefunden, die nicht nach Einzelfall
# aussehen, sondern nach Muster: ein PATCH, der die ganze Zeile überschreibt; eine Route, die die
# Eltern-ID im Pfad ignoriert; eine leere Liste, die als `{}` ankommt; ein Enum, das als 500
# endet; eine Aktion, die Erfolg meldet und nichts tut; ein Wareneingang, der die volle statt der
# offenen Menge bucht. Wo es einen gibt, gibt es meist mehr. Lauf 18 baut zuerst den Pilot-Pfad
# und die am 2026-10-29 entschiedenen Units, dann die Einzelfälle aus Lauf 17, und scannt danach
# jede Klasse repo-weit.
#
#   BLOCK A (11)  — PILOT-PFAD UND ENTSCHIEDENES: Einladung per Mail mit Annahmeseite im
#                   Gateway plus E2E, `notification.send` über den Event-Bus, CSAT-Token beim
#                   Versand, Personalakte für manager, Aufnahme-Einwilligung auf pending,
#                   Abo-Rechnung nicht vor Fälligkeit, Schäden für manager, Vorlagen-Anlage.
#                   Review r1.
#   BLOCK B (13)  — EINZELFÄLLE AUS LAUF 17, Datenverlust und Lecks zuerst. Review r2.
#   BLOCK C (11)  — ZWILLINGS-SCANS (Regel 1). Jeder Scan legt seine Fix-Units DIREKT HINTER
#                   sich. Reviews r3 und r4 dazwischen.
#   BLOCK D (7)   — COVERAGE-AUFFÜLLER, nur wenn alles davor durch ist.
#
#   ZUSAMMENSETZUNG: 45 Units gestaged, davon 14 opus (`harden-share-tokens-hashed-berichte` kam am
#   Abend dazu, nachdem der Desktop-Teil gemergt war). Scans und Reviews legen Fix-Units nach;
#   die Nacht hat Platz für rund 85 Iterationen (22:00 bis 08:45).
#   Reihenfolge = Dateireihenfolge = Priorität. Was ein Scan, ein Review oder ein E2E-Flow als
#   Totalausfall oder Leck findet, gehört VOR die erste `todo`-Unit.
#
# ------------------------------------------------------------------------------------------
# REGELN, DIE IN DIESEM LAUF NEU SIND
#
#   1. ZWILLINGS-SCANS (`scan-*` in Block C). Ein Scan ändert keinen Produktivcode. Er sucht die
#      Fehlerklasse repo-weit nach WORTSTÄMMEN und Strukturen, nicht nur nach dem Importmuster
#      des Einzelfalls (Lehre: ein zu enger Grep ist ein falscher Negativbefund). Jeder Kandidat
#      wird verifiziert (Test, psql oder Codepfad mit Datei:Zeile), bevor er zählt. Pro Fund
#      bzw. pro Modulgruppe (höchstens ~5 Dateien) eine Fix-Unit DIREKT HINTER den Scan, im
#      selben Commit; Totalausfall oder Leck VOR die erste todo-Unit. Mehr als sechs Fix-Units
#      aus einem Scan: die übrigen als eine Sammel-Unit nach BACKLOG-NEXT.yml mit Liste. Gibt es
#      eine gemeinsame Funktion, an der die ganze Klasse hängt (Fehler-Mapping, Response-Helper),
#      ist der Fix dort EINE Unit statt einer je Aufrufer. "0 Funde" ist ein gültiges Ergebnis,
#      mit der Suchstrategie im Journal.
#   2. ENTSCHEIDUNGEN STEHEN IN DER UNIT. `decision` ist Lukes Entscheidung vom 2026-10-29 (bzw.
#      dem genannten Datum), nicht neu verhandeln. Passt der Code nicht zur Annahme der
#      Entscheidung, `blocked` mit präziser Frage, nicht eigenmächtig umdeuten.
#   3. IST-SUBTESTS WERDEN ERWARTUNGEN. Lauf 17 hat falsches Verhalten in E2E-Flows als
#      `IST: ...`-Subtest festgehalten. Behebt eine Unit genau dieses Verhalten, wird der Subtest
#      im selben Commit zur Erwartung umgeschrieben und läuft im lokalen E2E-Gate (Regel a).
#   4. REVIEW-UNITS (`review-run18-r*`, opus) prüfen die Fix-Commits seit dem vorigen Review:
#      Hält der Fix an allen Zwillingsstellen, die der Scan nennt? Ist der Test echt
#      (Mutationsprobe)? Grenzen und Rechte mit echtem Token (Regel b). End-SHA ins Journal.
#   5. JOURNAL-STEMPEL = Startzeit aus dem Laufkontext, wörtlich (ITERATION.md Schritt 6).
#
#   WEITER GÜLTIG AUS LAUF 17 (Volltext: archive/lauf-17/BACKLOG.yml):
#   a. LOKALES E2E-GATE. Für E2E-Units und für jede Unit, die einen Flow in `backend/test/e2e/`
#      ändert oder deren Verhalten ein bestehender Flow prüft (die Unit nennt ihn), gilt:
#      `bash .planning/backend-block/loop/hooks/e2e-local.sh '<Regex>'` ist grün. Gate-Zeile
#      `e2e ok (lokal, <Laufzeit>)`. Scheitert der STACK (nicht der Test), steht die Ursache in
#      `offen:` und es gilt der Fallback (`go vet -tags=e2e` plus "E2E erst in CI abgenommen").
#      Stack-Fixes im Skript darf der Loop machen, `.github/` nicht.
#   b. RECHTE NUR MIT ECHTEM TOKEN PRÜFEN (`ResolveTokenPermissions`/`GetUserGrants` nach der
#      Migration oder Login im E2E), nie von Hand gebaut. Neue Keys dreiteilig.
#   c. ERST DIE DATENGRENZE, DANN DER GRANT. Guards nur additiv (`RequirePermissionAny`), bei
#      Own-Scope `ownerFilterForScopeAny` (`gateway/helpers.go`).
#   d. SEED-FORM wie 000256 (Up zweimal anwendbar, Down entfernt genau die eigenen Zeilen, admin
#      bekommt jeden neuen Key). Neue Keys wirken erst nach Re-Login, in `offen:` vermerken.
#   e. ROLLEN IM gRPC-SERVER: Rollen reisen nicht über den Hop, nur `x-user-id`, `x-tenant-id`,
#      die Whitelist `forwardedPermissions` und `forwardedRoles` (`middleware/grpc_tenant.go`).
#   f. E2E ALS MEMBER, `registerAndLoginAdmin` nur, wo die Funktion admin-only ist.
#   g. Kein "nur dokumentiert" für Totalausfälle. Desktop-Aufrufer greppen und die Pflichtzeile
#      `desktop-aufrufer:` füllen.
#   h. MUTATIONSPROBEN GEGEN RLS: Überlebt eine Probe auf ein Tenant-Prädikat, weil RLS die Zeile
#      schon verbirgt, gehört ein Subtest unter System-Kontext dazu (Muster aus Lauf 17,
#      Iterationen 108 bis 113). Viele Altdateien sind CRLF: Proben mit passendem Zeilenende.
#
# SPERREN
#
#   - Kein Push, kein PR, kein Produktionszugriff (Guard). Keine neue `config.RequireX`.
#   - `.github/` und `deploy/` gesperrt, ohne Ausnahme in diesem Lauf. Ein neues optionales Env
#     darf in `internal/config`, der Compose-Passthrough nicht; dann in `offen:` vermerken. Die
#     Einladungs-Unit kommt ohne neues Env aus (Basis-URL ableiten).
#   - Desktop-Code (`desktop/`) ist tabu: lesen ja, ändern nein. FE-Funde als Unit nach NEXT.
#   - Customization Draft/Deploy-Overlay, Code in `internal/biz/bexio` (G3), WASM: gesperrt. CSAT
#     bleibt aus; der Umbau des Dispatch für `harden-csat-token-minted-at-dispatch` ist erlaubt.
#   - Dokumente: KEIN Zugriffsmodell bauen (`decide-document-access-baseline` hängt am Pilot).
#   - Aufbewahrungsfristen: KEINE neuen Fristen oder Lösch-Handler (warten auf Legal). Der Scan
#     `scan-child-tables-cascade-on-parent-delete-and-scrub` prüft nur, ob vorhandene Löschwege
#     ihre Kindtabellen mitnehmen.
#   - Neue Tabelle: `tenant_id NOT NULL` + RLS + tenant-gescopte INSERTs UND SELECTs.
# ==========================================================================================

units:
