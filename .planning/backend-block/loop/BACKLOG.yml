  - id: fix-money-format-de-and-document-currency
    phase: 4
    service: biz
    model: sonnet
    deps: [scan-money-format-double-currency]
    status: todo
    target: Rechnung, Angebot, Gutschrift und Mahnung drucken Beträge de-DE ("1.234,50 EUR") und in der Währung des Belegs
    coverage_start: n.a. (Fix an gemeinsamer Funktion)
    scope: >
      Aus `scan-money-format-double-currency`. `formatEUR` (`internal/biz/pdf/templates.go:420`) ist die EINE Stelle, an
      der alle fünf PDF-Typen (Angebot, Rechnung, Gutschrift, Mahnung, ZUGFeRD) ihre Beträge drucken. Sie liefert
      `d.StringFixed(2) + " EUR"`: "1234.50 EUR" statt "1.234,50 EUR", während dieselben Dokumente Daten als `02.01.2006`
      drucken. Außerdem ist "EUR" fest verdrahtet, obwohl der Mandant über `company_settings.default_currency` eine andere
      Währung haben kann (`internal/biz/invoice/service.go:199-209`, `Invoice.Currency`/`Quote.Currency`/
      `CreditNote.Currency` existieren, XRechnung und DATEV lesen sie): eine CHF-Rechnung druckt im PDF "EUR", im
      XRechnung-XML "CHF". Fix: `formatEUR` wird `formatMoney(d decimal.Decimal, currency string)` (leere Währung ->
      `models.DefaultCurrency`), de-DE mit Tausenderpunkt und Komma (rein per Stdlib/`StringFixed` plus Gruppierung, keine
      neue Dependency; negative Beträge der Gutschrift beachten), alle Aufrufer reichen die Belegwährung durch
      (`buildDunningBody`, `buildTotalsSection`, `buildLineItemRow`). Der Helfer soll in ein kleines exportiertes
      Paket (z. B. `internal/format`, `Money(d, currency)`), weil `fix-advisory-dsar-money-format-de` ihn braucht.
      Betroffene Tests erwarten heute "238.00 EUR" (`generator_documents_test.go`, `invoice_ustg14_test.go`): sie werden
      zur Erwartung "238,00 EUR" umgeschrieben. Neuer Test mit Betrag >= 1000 und mit CHF-Beleg.
