      analog zum Schedule-Scheduler (`internal/berichte/scheduler/`, das bereits per Ticker
      auf `ListDueSchedules` pollt) oder ein Hook im bestehenden Scheduler-Tick, der
      `DeleteExpiredCacheEntries(ctx, now)` in sinnvollem Intervall aufruft (z. B. stuendlich,
      nicht bei jedem Schedule-Tick). Muss in `cmd/berichte/main.go` verdrahtet werden.
