      `ApplyGoodsReceipt` sperrt die PO erst danach und leitet nur den Abrufwert aus den ersetzten Mengen ab
      (`postgres_repository_extended.go:611`). (1) VERIFIZIERT per Wegwerf-Test (Mock): `PartialReceive` mit derselben
      Zeile zweimal in einem Aufruf (`4`, dann `10`, Bestellmenge 10) setzt `received_quantity=10`, bucht aber nur 6 ins
