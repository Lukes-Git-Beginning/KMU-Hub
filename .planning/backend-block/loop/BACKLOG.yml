    phase: 4
    service: rapporte
    model: sonnet
    deps: []
    status: todo
    coverage_start: n.a. (Bugfix, kein Coverage-Ziel)
    scope: >
      VERIFIZIERTER BEFUND (2026-08-26, gefunden beim Bauen von
      `cov-gateway-rapporte-lines-attachments-export`, siehe
      `TestSaveSignature_OverwritesExistingSignatureWithoutGuard`,
      `internal/rapporte/postgres_repository_test.go`). `PostgresRepository.SaveSignature`
      (postgres_repository.go:911) hat kein "AND signature_data IS NULL" in der WHERE-Klausel
      und keinen Status-Check auf `work_reports.status` — ein Rapport, der bereits eine
      Unterschrift traegt, akzeptiert klaglos einen zweiten `SaveSignature`-Aufruf und
      ueberschreibt `signature_data`, `signed_at` und `signed_by` unwiderruflich, ohne dass die
      erste Unterschrift irgendwo erhalten bleibt. `Service.SaveSignature` (service.go:599)
      validiert nur Format/Groesse/Pflichtfelder der NEUEN Signatur, nicht ob bereits eine
      existiert. Eine Unterschrift ist ein personenbezogenes Datum und Beweismittel fuer einen
      fixierten Zustand (siehe scope-Text der Coverage-Unit, die den Fund gemacht hat) — als
      gebaut ist sie zeitlich unbegrenzt veraenderbar, auch nach Freigabe (`StatusApproved`).
      Fix vermutlich: entweder in `Service.SaveSignature` vor dem Repo-Aufruf pruefen, ob
      `s.repo.GetReport(...).SignatureData != nil` und dann einen Fehler zurueckgeben (z. B.
      `ErrReportAlreadySigned`), oder die SQL-WHERE-Klausel um `AND signature_data IS NULL`
      erweitern und `RowsAffected() == 0` bei bereits vorhandener Signatur separat von
      `ErrReportNotFound` behandeln (sonst verwechselt der Aufrufer "nicht gefunden" mit
      "bereits signiert"). Zu klaeren beim Fixen: gibt es einen legitimen Korrektur-Workflow
      (z. B. Signatur-Widerruf durch einen Reviewer), der einen expliziten
      "Unsign"-Pfad statt eines stillen Overwrite braeuchte? Nicht Teil dieser Unit,
      aber die Entscheidung dazu gehoert Luke, falls sie ueber einen einfachen Guard
      hinausgeht.
