  - id: fix-video-egress-after-initiator-consent
    phase: 4
    service: work
    model: opus
    deps: []
    status: done
    decided: '2026-10-25'
    decision: >
      ENTSCHEIDUNG LUKE, 2026-10-25 (Entscheidungsrunde zur Vorbereitung von Lauf 17): Variante (a) im Backend.
      Auf Prod ist `LIVEKIT_EGRESS_TEMPLATE_URL` leer (am 2026-10-25 geprüft), Aufnahmen gehen dort noch
      nicht. Der Fix kommt VOR dem Scharfschalten. `StartRecording` legt nur `pending` an, erst `ConfirmInitiatorConsent`
      startet den Egress (genau einmal, idempotent). Bleibt eine pending-Zeile ohne Bestätigung liegen,
      startet nichts.
    target: ohne Initiator-Stempel kein Egress
    coverage_start: internal/work/recording (ungemessen)
    scope: >
      Gefunden in fix-video-initiator-consent-rpc-cannot-marshal (Lauf 16, Iteration 14), gegen Code belegt:
      `recording.Service.StartRecording` legt die Zeile an und startet den LiveKit-Egress SOFORT (`service.go`,
      `StartRoomCompositeEgress` nach `CountPendingConsents`). Das Desktop (`CallControls.tsx:121-150`)
      ruft erst `startRecording`, zeigt DANN den Initiator-Dialog und stempelt bei „Bestätigen" `initiator-consent`;
      „Abbrechen" (`handleCancelStart`) schließt nur den Dialog — die Aufnahme läuft weiter, ohne dass der
      Initiator bestätigt hat, und `activeRecordingId` bleibt leer (UI weiß ggf. nicht, dass aufgenommen
      wird). Der als Gegenmittel gebaute `PreConsentChecker` ist NICHT verdrahtet: `cmd/work/main.go` ruft
      `recording.NewService` ohne Checker, und es gibt keine einzige Implementierung von `HasInitiatorConsented`.
      Der Stempel ist damit rein dokumentarisch. Erster Schritt: prüfen, ob Egress in Produktion konfiguriert
      ist (`LIVEKIT_EGRESS_TEMPLATE_URL` im work-Service, ohne den `ErrEgressNotConfigured` und die Frage
      ist akademisch) — das gehört Luke (Prod-Lesezugriff). Danach eine Architektur-Entscheidung (Luke):
      (a) Egress erst nach dem Stempel starten (StartRecording legt nur `pending` an, `ConfirmInitiatorConsent`
      startet den Egress), oder (b) Abbrechen ruft `stopRecording` + Löschung — (b) wäre Desktop-Code, den
      der Loop nicht ändert. Kein Bau ohne Entscheidung.
    sources:
      - backend/internal/work/recording/service.go
      - backend/cmd/work/main.go
      - desktop/src/renderer/src/features/video/CallControls.tsx
    done_when:
      - >
        Service-Test: ohne Stempel kein StartRoomCompositeEgress-Aufruf, nach Stempel genau einer, zweiter
        Stempel startet nichts erneut
      - >
        Desktop-Ablauf (start -> Dialog -> bestätigen) funktioniert weiter (desktop-aufrufer belegt)
      - go test -count=1 ./internal/work/... ./internal/server/ grün

