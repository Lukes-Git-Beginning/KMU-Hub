    phase: 4
    service: dialer
    model: opus
    deps: []
    status: done
    coverage_start: "n.a. (Sicherheits-Fix)"
    scope: >
      VERIFIZIERTER Cross-Tenant-WRITE (Lauf 14, Iteration 6, beim Bauen von
      `fix-dialer-agent-status-missing-tenant-check` per Wegwerf-Test reproduziert):
      `PUT /api/v1/dialer/agent-status` nimmt `user_id` aus dem Body
