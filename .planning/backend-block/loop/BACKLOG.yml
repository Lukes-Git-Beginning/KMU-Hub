# Backend-Nachtloop — Arbeitsqueue (Lauf 6, gestaged 2026-08-07, Fenster 2026-08-08 14:30–00:45)
#
# Eine Unit = eine Iteration = ein Commit.
#
# status: todo | in_progress | done | blocked
# model:  sonnet (Default) | opus (architektonisch schwer, Proto, Security, Migration+RLS)
#
# ACHTUNG Treiber-Parsing: `model:` muss VOR `status:` stehen, und hinter `status: todo`
# darf kein Kommentar stehen (der Treiber zaehlt offene Units per Zeilen-Regex).
#
# Laeufe 1+2 (58 Units): archive/lauf-1-2/ — Lauf 3 (61): archive/lauf-3/
# Lauf 4 (54): archive/lauf-4/ — Lauf 5 (41): archive/lauf-5/
#
# ------------------------------------------------------------------------------------------
# STAND DER VORBEREITUNG (2026-08-07, alles gegen den laufenden Code verifiziert)
#
#   - Laeufe 1-5 sind gemergt und deployt. Repo-Kopf = Prod-Kopf. Migrationskopf lokal wie
#     produktiv = 297, `dirty=false`. NAECHSTE FREIE = 298, aber IMMER zur Laufzeit ermitteln:
#     `ls backend/migrations | grep -E '^[0-9]{6}' | sort | tail -1`
#   - `backend-loop` wurde VOR diesem Lauf auf origin/main gemergt (Fast-Forward, 3 Commits).
#   - RLS ist FLAECHENDECKEND: `knownRLSGaps` in
#     `backend/internal/testutil/rls_regression_test.go` ist seit Migration 000286 LEER, und
#     der Standing-Guard `TestAllPublicTablesHaveRLSOrAreAllowlisted` haelt das so. Jede neue
#     Tabelle in diesem Lauf MUSS `tenant_id UUID NOT NULL` + `CALL enable_tenant_rls(...)`
#     haben, sonst ist der Guard rot — das ist Absicht, nicht Schikane.
#   - RBAC Phase 1 (Welle 1a UND 1b), Per-User-Overrides und Vendor-Access sind ABGESCHLOSSEN
#     (Lauf 4). Kein RBAC-Nachbau in diesem Lauf.
#   - Die lokale DB laeuft und ist verifiziert: `docker-postgres-1` auf 297, Rolle `kmuhub_app`
#     hat das Passwort `app_dev`, RLS-Integrationstests in `internal/crm/contact` laufen real
#     durch (0 Skips). `DATABASE_URL` ist damit KEIN Alibi — siehe ITERATION.md Schritt 5.
#
# DER ROTE FADEN DIESES LAUFS
#
#   Zwei Straenge, bewusst in dieser Reihenfolge:
#
#   BLOCK A (20 Units) sind die echten Luecken. Sie stammen aus einem zweiten
#   Verifikationslauf durch `.planning/backend-gaps.md` am 2026-08-07 — gegen Migrationskopf
#   297, die 820 Pfade in `api/openapi.yaml` und den Service-Quelltext, nicht gegen
#   Funktionsnamen. Rund zwanzig weitere Eintraege der Datei haben sich dabei als von den
#   Laeufen 4/5 bereits geschlossen erwiesen und sind dort abgehakt; was hier steht, ist der
#   verbliebene Rest. Diese Units laufen zuerst, weil sie Urteil brauchen und ihr Wert
#   verfaellt, wenn sie liegen bleiben.
#
#   BLOECKE C und B (46 Units) sind Test-Coverage — der gemessene Engpass. Gemessen am
#   2026-08-07 lokal: `internal/server` 6,2 %, `internal/gateway` 24,1 % (CI mit DB: 8,1 /
#   27,2). Kritische Pfade liegen unter dem 60-%-Ziel. C zuerst (biz/crm = das eigentliche
#   Ziel, DB-abhaengig, laeuft frueh am zuverlaessigsten), B als Schluss und Puffer:
#   mechanisch, DB-frei, laeuft auch um 05:00 durch. Was von B ueberlaeuft, startet Lauf 7 —
#   das ist eingeplant, kein Versaeumnis.
#
# HARTE QUALITAETSREGEL FUER JEDE COVERAGE-UNIT (Bloecke C und B)
#
#   Zeilen-Abdeckung ohne Aussage ist wertlos und schlimmer als keine, weil sie eine
#   Sicherheit vortaeuscht. Deshalb traegt JEDE Coverage-Unit zwei Kriterien:
#
#     1. FEHLERPFAD: mindestens einer pro getesteter Funktion, nicht nur Happy Path —
#        falsche UUID, fehlender Tenant, Downstream-Fehler, Validierungsbruch.
#     2. MUTATIONS-PROBE: eine Zeile im getesteten Code absichtlich brechen, pruefen dass
#        der neue Test rot wird, zurueckdrehen. Wird er NICHT rot, testet er nichts — dann
#        die Unit `blocked` setzen mit genau diesem Grund. Das Ergebnis der Probe gehoert
#        ins Journal, nicht nur die Behauptung, sie sei gelaufen.
#
#   Getestet wird das, was in einem Thin Handler wirklich Logik ist, in dieser Rangfolge:
#     a) die `map<X>Error`-Tabelle — jedes Sentinel gegen den erwarteten gRPC-Code. Eine
#        falsche Zuordnung ist in Produktion ein falscher HTTP-Status.
#     b) die `toProto*`-Konvertierungen — Wire-Shape: `[]` statt `null`, snake_case,
#        gewrappt, nil-Eingabe. Genau diese Klasse hat in diesem Repo mehrfach Phantom-404
#        und leere FE-Listen erzeugt.
#     c) die Validierungspfade der RPC-/Handler-Methoden.
#
#   MUSTER, DAS WIEDERZUVERWENDEN IST — NICHT NEU ERFINDEN:
#     - `internal/server/formulare_grpc_test.go` ist die Referenz: `stubFormulareRepo`
#       (Zeilen 20-391) implementiert das Repository-Interface, `newTestFormulareServer()`
#       baut den Server mit NIL-Service fuer die Validierungspfade (die laufen vor jedem
#       Service-Aufruf, deshalb kein Nil-Panic), `newFormulareServerWithRepo(repo)` fuer den
#       Happy Path. Gemeinsame Helfer stehen in `internal/server/testhelpers_test.go`
#       (`requireGRPCCode`, `assertGRPCCode`).
#     - `internal/gateway/testutil_test.go` haelt `emptyRegistry`/`registryWithService`,
#       `withAuth`/`withTenantID`/`withChiURLParam`, `jsonBody`/`invalidJSON`,
#       `assertStatus`/`assertErrorContains`.
#     Ein Server mit Nil-Service darf NUR fuer Pfade benutzt werden, die vor dem
#     Service-Aufruf abbrechen. Wer damit in den Happy Path laeuft, bekommt einen
#     Nil-Panic — dann Stub-Repo bauen.
#
# GESPERRT IN DIESEM LAUF
#
#   - Frontend. Der Loop baut Backend. Die drei Stores mit hartkodiertem Mock-Seed
#     (`helpdesk`, `vertraege`, `timetracking`) und die 34 fehlenden fr/it-i18n-Schluessel
#     gehoeren in eine Frontend-Session.
#   - CSAT. Der SMTP-Passthrough an `helpdesk` und die oeffentliche Umfrageseite sind eine
#     Deploy-Entscheidung, keine Nachtlauf-Iteration. Nicht anfassen.
#   - RLS-Scans. `knownRLSGaps` ist leer, ein Standing-Guard haelt es so. Nichts zu tun.
#   - Phase 4 im Sinne von: kein Neubau ganzer Branchen-Module. Einzelluecken und Bugfixes in
#     bestehenden Branchen-Modulen sind erlaubt — Block A enthaelt genau solche.
#   - Neue `config.RequireX`-Assertionen (Deploy-Hazard: COSMI_ENV=production ist live, CD
#     deployt automatisch). Scharfschalten neuer `modules.*`-Feature-Flags.
#   - Merge, Push, PR, Deploy, Production-Zugriff.
#   - Customization Draft/Deploy-Overlay und `moduleAreas`-Persistenz.
# ------------------------------------------------------------------------------------------

units:

  - id: fix-a-video-caller-identity
    phase: 3
    service: video
    model: opus
    deps: []
    status: done
    scope: >
      Der `call.incoming`-Broadcast aus `e736f324` loest den Anrufernamen in Produktion
      NIE auf. Die Goroutine in `HandleCreateCall` ruft `resolveCallerIdentity` mit
      `context.Background()` auf; damit haengt kein Tenant/User mehr im Kontext,
      `middleware.TenantOutboundUnaryInterceptor` (`internal/gateway/registry.go:112`)
      setzt kein `x-tenant-id`, und `TenantInboundUnaryInterceptor`
      (`internal/middleware/grpc_tenant.go:75`) antwortet garantiert mit
      `codes.Unauthenticated`. Ergebnis: `caller_name`/`caller_avatar` immer leer plus
      ein `slog.Error` bei JEDER Anruferstellung. Kontext beim Abkoppeln behalten statt
      wegwerfen — `context.WithoutCancel(r.Context())` wie in
      `internal/middleware/idempotency.go:164`.
    sources:
      - backend/internal/gateway/route_video.go
      - backend/internal/middleware/grpc_tenant.go
      - backend/internal/middleware/idempotency.go
    notes: >
      Kein neuer RPC, kein neuer Pfad, keine Migration. Die Goroutine muss abgekoppelt
      bleiben (der Handler kehrt vor ihr zurueck), aber die Werte des Request-Kontexts
      behalten — genau das leistet `WithoutCancel` und `Background` nicht. Den
      Goroutine-Rumpf als benannte Methode herausziehen, damit der Kontext an einer
      testbaren Naht ankommt; `recordingBroadcaster` ist bereits ein Interface, ein
      Fake-Hub reicht.
    done_when:
      - Broadcast-Goroutine laeuft auf einem Kontext, der Tenant und User traegt
      - Test faengt den Kontext am Hub ab und belegt, dass der Tenant ankommt
      - Bestehende resolveCallerIdentity-Tests bleiben gruen
      - go test ./internal/gateway/ gruen (inkl. TestOpenAPIRouteDrift)

