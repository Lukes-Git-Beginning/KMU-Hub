  - id: a-dokumente-version-download
    phase: 3
    service: document
    model: sonnet
    deps: []
    status: done
    scope: >
      Versionsspezifischer Download. Die Spec kennt heute nur
      `/api/v1/documents/files/{id}/versions` (Liste) und `/versions/revert`; der
      Herunterladen-Knopf im Versionsverlauf kann deshalb nur die aktuelle Datei laden.
      Neu: `GET /api/v1/documents/files/{id}/versions/{versionId}/download` — laedt die
      Version, prueft dass sie zum File und zum Tenant gehoert, und liefert eine
      Presign-Download-URL nach dem bestehenden Muster.
    sources:
      - backend/internal/gateway/route_document.go
      - backend/internal/document/service.go
      - backend/internal/chat/file/minio_store.go
    notes: >
      Kein neuer Storage-Code - das Presign-Muster steht in `internal/chat/file/minio_store.go`
      und wird im document-Modul bereits benutzt. Die Fallgrube ist die Zugehoerigkeitspruefung
      - eine Version eines FREMDEN Files darf nicht ueber die eigene File-ID abrufbar sein;
      also gegen `(tenant_id, file_id, version_id)` pruefen, nicht nur gegen die version_id.
      Unbekannte oder fremde Version - 404, nicht 403.
    done_when:
      - Route registriert, Handler geht ueber den document-gRPC-Client, nie direkt am Service
      - Version eines fremden Files liefert 404, nicht die Datei
      - Pfad in api/openapi.yaml mit allen wirklich gelieferten Status-Codes
      - go test ./internal/gateway/ und ./internal/document/ gruen

  - id: a-schichten-minor-compliance
    phase: 3
    service: schichten
    model: opus
    deps: []
    status: done
    scope: >
      JArbSchG-Flag am Mitarbeiter und Auswertung in der Compliance-Pruefung. Heute existiert
      `/api/v1/schichten/compliance`, aber kein `is_minor` irgendwo im Repo (verifiziert
      2026-08-07 ueber `internal/` und `migrations/`). Spalte `is_minor BOOLEAN NOT NULL
      DEFAULT false` am HR-Mitarbeiter ergaenzen, im Wire mitfuehren, und die
      Compliance-Pruefung um die Jugendarbeitsschutz-Regeln erweitern, die sich aus den
      bereits geprueften Schichtdaten ableiten lassen - keine Nachtschicht, hoechstens acht
      Stunden am Tag, Wochenendbeschraenkung.
    sources:
      - backend/internal/schichten/service.go
      - backend/internal/gateway/route_schichten.go
      - backend/internal/biz/hr/employee/models.go
    notes: >
      Zuerst die bestehende Compliance-Pruefung LESEN und ihre Struktur uebernehmen - es geht
      um eine zusaetzliche Regelgruppe, nicht um eine zweite Engine daneben. Die Spalte gehoert
      an den HR-Mitarbeiter, nicht an die Schicht: sie ist eine Personeneigenschaft. Verstoesse
      als Befunde derselben Form zurueckgeben wie die vorhandenen, damit das FE nichts
      Neues lernen muss. Laesst sich die vorhandene Pruefung nicht sauber erweitern, lieber
      NUR die Spalte plus Wire liefern und die Regeln als eigene Unit vermerken.
    done_when:
      - Migration ergaenzt is_minor am HR-Mitarbeiter, up und down gefuellt
      - Feld im Proto und im Wire, snake_case, im selben Commit regeneriert
      - Compliance-Endpoint meldet mindestens einen Jugendschutz-Verstoss-Typ
      - Test deckt einen verletzenden und einen zulaessigen Plan ab

  - id: a-fuhrpark-vehicle-booking
    phase: 3
    service: fuhrpark
    model: opus
    deps: []
    status: done
    scope: >
      Fahrzeugbuchung mit Konfliktpruefung (Pool-Nutzung). Verifiziert 2026-08-07 - unter den
