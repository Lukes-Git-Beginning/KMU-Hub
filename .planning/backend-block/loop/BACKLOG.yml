    scope: >
      Architekturregel 1 lautet "Thick Services, Thin Handlers" — Handler machen Parse, Call,
      Respond. Lauf 11 hat den teuersten Verstoss dagegen gefunden: die USt-Gruppierung des
      GoBD-Exports war im gRPC-Handler nachgebaut, mit einem Schluesselfehler, der beim
