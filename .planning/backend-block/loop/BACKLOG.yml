      die RPC ist der einzige Aufrufpfad, ein reiner Handler-Check waere umgehbar. Bei
      `approverID == correction.EmployeeID` einen neuen Sentinel-Error liefern (analog
      `ErrCorrectionNotFound`), im gRPC-Server auf `codes.PermissionDenied` mappen
      (`mapHRError`, `internal/server/hr_grpc.go`) und im Gateway ueber `respondGRPCError`
      als 403 durchreichen. `TestApproveTimeCorrection_EmployeeCanApproveOwnCorrection` muss
      danach auf den neuen Fehler statt auf Erfolg pruefen; `TestApproveTimeCorrection_
      TransitionsStatus` (fremder Genehmiger) darf sich nicht aendern.
