      ausdrückliche Freigabe: `HardMode` auf eine Route zu schalten, die Clients bisher ohne
      Schlüssel aufrufen, bricht die Oberfläche. Solche Funde gehören mit `blocked_reason` in
      BACKLOG-NEXT.yml, nicht in denselben Lauf.
