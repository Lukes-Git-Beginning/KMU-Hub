      available, Tenant A setzt danach X auf break -> kein Fehler, und Tenant B sieht X seit
      dem Lese-Fix als offline (der Eintrag traegt jetzt Tenant A). Zusaetzlich landet X im
      Kampagnen-SET einer beliebigen `campaign_id`, die ebenfalls nicht tenant-geprueft
      wird. Wer eine fremde User-UUID kennt (Rolle mit `dialer:agent:manage`), kann so den
      Live-Status fremder Agenten manipulieren und deren Eintrag fuer den eigenen Tenant
      unsichtbar machen.
      Zu tun -- vor dem Schreiben pruefen, dass der Ziel-User im Tenant des Aufrufers liegt
      (fail-closed), und eine uebergebene `campaign_id` tenant-gescopt laden.
    sources:
