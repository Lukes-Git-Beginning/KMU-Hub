      - Token-Lookup unter System-Kontext, danach tenant-gescopt, im Code sichtbar
      - abgelaufen, widerrufen, unbekannt und missgebildet liefern alle 404
      - Body-Groesse begrenzt, Dateifelder werden explizit abgelehnt
      - openapi.yaml im selben Commit

