# Backend-Nachtloop — Arbeitsqueue (Lauf 16, gestaged 2026-10-24)
#
# Eine Unit = eine Iteration = ein Commit.
#
# status: todo | in_progress | done | blocked
# model:  sonnet (Default) | opus (architektonisch schwer, Proto, Security, Migration+RLS)
#
# Treiber-Parsing: `hooks/backlog-check.py` lädt diese Datei mit yaml.safe_load. Der Vorflug
# (`--preflight`) bricht ab bei: nicht ladbarem YAML in EINER der drei Dateien, einer Unit ohne
# `id`/`status`, einer Dubletten-ID über die drei Dateien hinweg, `status: blocked` oder einem
# `blocked_reason`-Feld IN DIESER DATEI, einem `done_when[0]`, das eine Entscheidung von Luke
# verlangt, einer `deps`-ID die nirgends existiert, und bei Zyklen in `deps`.
#
# `--state` liefert dem Treiber OPEN=, NEXT= und MODEL=. MODEL kommt von der ERSTEN BAUBAREN
# Unit — `status: todo` UND alle `deps` auf `done`, in DATEIREIHENFOLGE. Wo eine `opus`-Unit
# steht, entscheidet also mit, wie viele Iterationen auf opus laufen.
#
# Läufe 1+2 (58 Units): archive/lauf-1-2/ — Lauf 3 (61): archive/lauf-3/
# Lauf 4 (54): archive/lauf-4/ — Lauf 5 (41): archive/lauf-5/ — Lauf 6 (46): archive/lauf-6/
# Lauf 7 (71): archive/lauf-7/ — Lauf 8 (94): archive/lauf-8/ — Lauf 9 (37): archive/lauf-9/
# Lauf 10 (93, davon 91 done + 2 blocked): archive/lauf-10/
# Lauf 11 (131 Einträge, davon 121 done in 120 Iterationen): archive/lauf-11/ (inkl. Bilanz).
# Lauf 12 (99 Einträge, davon 41 done in 43 Iterationen): archive/lauf-12/ (inkl. Bilanz).
# Lauf 13 (120 Einträge, davon 21 done in 21 Iterationen): archive/lauf-13/ (inkl. Bilanz).
#   Lauf 13 brach nach 21 von 130 Iterationen ab — Ursache und Abhilfe: archive/lauf-13/BACKLOG.yml.
# Lauf 14 (108 Einträge, alle done in 110 Iterationen, Backlog leergelaufen): archive/lauf-14/
#   (inkl. Bilanz). Gemergt als `cadf4bf4` (PR #26), dazu vier Review-Fixes.
# Lauf 15 (26 gestaged, durch Scans auf 74 gewachsen, alle done in 74 Iterationen, Backlog
#   leergelaufen): archive/lauf-15/ (inkl. Bilanz). PR #27 gemergt als `da9fc602`, dazu fünf
#   Review- und CI-Fixes, deployt 2026-10-24.
#
# Was der Loop NICHT zieht — geparkt oder gestrichen, mit Entscheidung und Zielort:
# BACKLOG-PARKED.yml. Was auf eine Entscheidung wartet: BACKLOG-NEXT.yml. In DIESER Datei steht
# keine `blocked`-Unit. Wird eine Unit im Lauf blockiert, gehört ein `blocked_reason` dazu, der
# sagt, WORAUF sie wartet und WER das entscheidet — und sie wandert IM SELBEN COMMIT nach
# BACKLOG-NEXT.yml. Nicht "vor dem nächsten Lauf": eine blocked-Unit, die hier liegen bleibt,
# lässt den Vorflug des nächsten Laufs abbrechen, bevor die erste Iteration startet (Regel 11).
#
# ==========================================================================================
# STAND DER VORBEREITUNG (2026-10-24, gegen Code, CI, lokale DB und Produktion gemessen)
#
#   - `main` = `da9fc602` (Merge PR #27), Produktion auf demselben Code (CD 2026-10-24 10:44
#     UTC, `/health` bestätigt, Smoke 27/27). `backend-loop` = `main` plus Staging-Commits
#     (Entscheidungsrunde in BACKLOG-NEXT, E2E-Stack-Erweiterung, dieser Backlog).
#   - MIGRATIONSKOPF = 332 (Repo, lokale DB, Produktion, `dirty = f`). Lauf 16 bringt mehrere
#     Seed-Migrationen. Nummer IMMER zur Laufzeit ermitteln:
#     ls backend/migrations | grep -E "^[0-9]{6}" | sort | tail -1
#   - CI grün auf `da9fc602` (Run 40085600528, alle fünf Jobs inkl. E2E, plus CI Desktop).
#   - E2E-STACK NEU (Staging-Commit, `.github/workflows/ci.yml`): zusätzlich `inventar`
#     (Health :9110), `einkauf` (:9111), `schichten` (:9115) und deren Modul-Flags
#     `COSMI_MODULE_*_ENABLED=true` in der Job-Env. HR, Video und Kalender laufen schon mit
#     (HR steckt in `biz`, Video/Kalender in `work`). Abgenommen wird das im Morgen-PR.
#   - `go test -race` läuft hier nicht (kein C-Compiler). Tests mit Goroutinen oder
#     nebenläufigem Zustand in `offen:` vermerken, abgenommen erst in CI.
#
# COVERAGE-AUSGANGSLAGE (CI-Run 40085600528 auf `da9fc602`, gesamt 73,7 % bei Gate 15 %;
# Lauf 15 hat 72,6 -> 73,7 gehoben). Bezugswerte der Pakete, die dieser Lauf anfasst:
#     internal/gateway            76,6 %      internal/server             75,3 %
#     internal/middleware         71,8 %      internal/auth               77,9 %
#     internal/biz/hr/leave       85,7 %      internal/biz/hr/timetracking 65,6 %
#     internal/biz/hr/employee    75,3 %      internal/biz/creditnote     49,5 %
#     internal/biz/invoice        62,6 %      internal/berichte           86,3 %
#     internal/inbox/team         68,4 %      internal/inventar           74,7 %
#     internal/work/task          67,4 %      internal/fuhrpark           82,3 %
#     internal/security/gdpr      76,1 %      internal/document/share     96,8 %
#     internal/document/file      84,2 %      internal/dialer             78,0 %
#     internal/chat/message       77,2 %      internal/chat/file          66,4 %
#     internal/email/account      48,4 %      internal/email/message      70,4 %
#     internal/rapporte           79,6 %      internal/settings           82,8 %
#     internal/crm/contact        81,3 %      internal/crm/deal           88,2 %
#     internal/notification/preference 87,9 %
# biz/creditnote liegt nur scheinbar unter 60 %: seine Integrationstests tragen
# `//go:build integration` und zählen nicht.
#
# ------------------------------------------------------------------------------------------
# DER ROTE FADEN DIESES LAUFS
#
# "ECHTE NUTZER, TEIL 2: DER MITARBEITER, NICHT DER ADMIN — UND JEDE EINGABE KOMMT AN."
#
# Lauf 15 hat das Gateway an das Desktop angepasst, aber jede Prüfung lief als ADMIN: Smoke und
# E2E melden sich als Admin an, Admin hat 462 von 463 Keys. Bei der Vorbereitung (2026-10-24)
# wurden die Rollen-Grants aus der DB rekonstruiert und gegen die Guards gelegt. Ergebnis:
# ein normaler Mitarbeiter (`member`) und ein Teamleiter (`manager`) bekommen 403 auf ganze
# Module, die die Oberfläche anzeigt — E-Mail komplett, Team-Inbox, globale Suche, HR
# (Urlaub, Stempeluhr, Team-Verzeichnis und damit der @Mention- und Personen-Picker), eigene
# Termine und Chat-Nachrichten löschen, virtuelle Dateiansicht, Rapporte füllen. Ursache:
# Migration 129 hat die groben Keys (`email:*`, `inbox:*`, `search:read`, `hr:*`,
# `documents:read|write`, `calendars:delete`, ...) "bewusst zunächst nur an admin" gegeben,
# die Folge-Zuordnung kam nie. Umgekehrt hat jeder member `settings:write` und darf damit
# Branding und Tenant-Einstellungen überschreiben.
#
#   BLOCK S (1)  — SICHERHEIT: member darf Tenant-Einstellungen schreiben. Steht vorn.
#
#   BLOCK A (16) — DER MITARBEITER: Totalausfälle für member/manager. Entscheidung Luke
#     2026-10-24: Self-Service-Lücken fixt der Loop DIREKT (Seed-Migration + additiver Guard),
#     alles, was eine Produktfrage ist (darf ein member Rechnungen sehen?), geht nach NEXT.
#     A1-A4 sind die entschiedene HR-Kette, A5-A16 bei der Vorbereitung verifizierte Lücken.
#
#   BLOCK B (11) — ENTSCHIEDENE EINZELFIXES aus der Entscheidungsrunde 2026-10-24 und dem
#     Post-Run-Review von Lauf 15.
#
#   BLOCK C (14) — GEISTER-ROUTEN UND VERLORENE EINGABEN: das Desktop ruft Routen, die es nicht
#     gibt, sendet Parameter und Felder, die das Gateway verwirft. Bei der Vorbereitung
#     vollständig abgeglichen; verifizierte Fälle sind Fix-Units, dazu Scans für die
#     Domänen, die nie gescannt wurden (Work, Chat inkl. WebSocket, Dialer, Dashboard/
#     Einstellungen/Suche, CRM-Reste) und der Rest der Rollen-Matrix (8 Fixes, 6 Scans).
#
#   BLOCK D (8)  — E2E ALS MITARBEITER: die Flows melden sich als member an (manager, wo
#     genehmigt wird), mit dem Body, den das Desktop wirklich sendet.
#
#   BLOCK E (2)  — COVERAGE-FÜLLUNG, nur wenn alles davor durch ist.
#
#   ZUSAMMENSETZUNG: 1 + 16 + 11 + 14 + 8 + 2 = 52 Units gestaged. Die Scans in Block C legen
#   Fix-Units nach (Lauf 15: 26 gestaged, 74 gebaut). Reihenfolge = Dateireihenfolge: erst die
#   Sicherheitslücke, dann die Totalausfälle, dann Entschiedenes, dann Geister-Routen und
#   Scans, dann E2E (hängt per `deps` an den Block-A-Fixes), Coverage zuletzt. Was die Scans
#   als Totalausfall finden, gehört VOR die erste `todo`-Unit (Regel aus Lauf 15).
#   Bewusst NICHT im Lauf: sieben Desktop-Hooks mit rohem `fetch` ohne Authorization-Header
#   (Team-Arbeitszeit-Widget, Kanal bearbeiten, Tags, Posteingang-Zähler, Lesezeichen,
#   Geburtstage, Personalakte) — 401 egal welche Route; Sammel-Unit
#   `fe-raw-fetch-without-auth-header` in NEXT.
#
# ------------------------------------------------------------------------------------------
# REGELN, DIE IN DIESEM LAUF NEU SIND
#
#   1. ERST DIE DATENGRENZE, DANN DER GRANT. Bevor eine Migration einem member/manager einen
#      Key gibt, belegst du im Code, dass der Service die Daten auf den Aufrufer begrenzt
#      (eigenes Postfach, eigene Nachricht, eigener Termin, Mitgliedschaft). Gibt der Key
#      nach dem Grant fremde Daten frei (fremde Mails, alle Inbox-Nachrichten,
#      Suchtreffer aus Modulen ohne Leserecht), ist das KEIN Self-Service-Fix: erst die
#      Begrenzung bauen (wenn eindeutig) oder die Unit nach NEXT (`blocked_reason`: welche
#      Sichtbarkeitsregel fehlt). Ein Grant, der ein Leck öffnet, ist schlimmer als der 403.
#   2. GUARDS NUR ADDITIV. `RequirePermission(grob)` -> `RequirePermissionAny(grob, fein)`,
#      nie ersetzen (JWT-gebackene Permissions sperren sonst jeden mit Alt-Token aus). Bei
#      Any-Guards mit Own-Scope `ownerFilterForScopeAny` (`gateway/helpers.go`) benutzen, nicht
#      `ownerFilterForScope` — sonst löst der nicht vergebene Key zu `all` auf.
#   3. SEED-FORM. Neue Keys: `INSERT INTO permissions (name, resource, action) ... ON CONFLICT
#      DO NOTHING`. Grants: `INSERT INTO role_permissions (role_id, permission_id, scope)
#      SELECT r.id, p.id, '<own|team|all>' FROM roles r, permissions p WHERE r.name = '<rolle>'
#      AND r.tenant_id IS NULL AND p.name IN (...) ON CONFLICT (role_id, permission_id) DO
#      NOTHING` (Vorlage `000256_rbac_phase1a_role_scope_and_presets.up.sql`). Down-Migration
#      entfernt genau diese Zeilen. Admin bekommt jeden neuen Key mit (Admin hat keinen
#      Wildcard). Zweimal anwendbar, ohne Fehler.
#   4. NEUE KEYS WIRKEN ERST NACH RE-LOGIN. Ein Test, der Grants prüft, holt das Token NACH
#      der Migration. In `offen:` vermerken, wenn ein Fix in Produktion einen Re-Login braucht.
#   5. ROLLE IM gRPC-SERVER. Rollen reisen NICHT über den gRPC-Hop. Weitergereicht werden
#      `x-user-id`, `x-tenant-id` und die Whitelist `forwardedPermissions`
#      (`middleware/grpc_tenant.go:~41`). Muss ein Server "darf alles" erkennen, Key in die
#      Whitelist und `slices.Contains(middleware.GetUserPermissions(ctx), key)` (Muster
#      `withTeamManage`, `server/inbox_grpc.go:~714`). Whitelist-Test mitziehen.
#   6. E2E ALS MEMBER. `registerAndLogin` legt einen member an. Ein Flow, der eine
#      Mitarbeiter-Funktion prüft, läuft als member; `registerAndLoginAdmin` nur, wo die
#      Funktion admin-only ist (er überdeckt jeden fehlenden Seed).
#
#   Weiter gültig aus Lauf 15: kein "nur dokumentiert" für Totalausfälle (Fix-Unit VOR die
#   erste `todo`-Unit), Desktop-Aufrufer greppen und die Pflichtzeile `desktop-aufrufer:`
#   füllen, E2E-Gate = `go vet -tags=e2e ./test/e2e/` plus "E2E erst in CI abgenommen".
#
# SPERREN
#
#   - Kein Push, kein PR, kein Produktionszugriff (Guard). Keine neue `config.RequireX`.
#   - `deploy/` und `.github/` sind gesperrt, ohne Ausnahme in diesem Lauf. Die
#     E2E-Erweiterung ist beim Staging gebaut. Braucht ein Flow einen weiteren Service
#     (z. B. `email`, `rapporte`), wird das eine Unit in BACKLOG-NEXT.yml.
#   - Desktop-Code (`desktop/`) ist tabu — lesen ja, ändern nein (Entscheidung Luke
#     2026-10-24: strikt Backend, das Gateway passt sich an). FE-Funde als Unit nach
#     BACKLOG-NEXT.yml (Muster `fe-handle-geld-waren-shape-findings`).
#   - CSAT, Customization Draft/Deploy-Overlay, `internal/biz/bexio` (G3), WASM: gesperrt.
#   - Dokumente: KEIN Zugriffsmodell bauen (Besitz/Raum/Freigabe-Wirkung). Entscheidung Luke
#     2026-10-24: im Lauf nur die ShareEntity-Prüfung (B5); das Grundmodell ist eine eigene
#     Entscheidung mit Pilotabstimmung (`decide-document-access-baseline` in NEXT).
#   - Team-Inbox-Sichtbarkeit für member: NICHT granten, solange `harden-inbox-message-user-
#     scoping` (NEXT) keine Regel hat — `inbox:read` an member gäbe jede Inbox-Nachricht frei.
#   - Neue Tabelle: `tenant_id NOT NULL` + RLS + tenant-gescopte INSERTs UND SELECTs.
# ==========================================================================================

units:
  # ========================================================================================
  # BLOCK S — SICHERHEIT
  # ========================================================================================

  - id: fix-member-can-write-tenant-settings-and-branding
    phase: 4
    service: settings
    model: opus
    deps: []
    status: done
    coverage_start: "internal/gateway 76,6 % · internal/settings 82,8 %"
    scope: >
      VERIFIZIERT bei der Vorbereitung (2026-10-24, lokale DB, `role_permissions`): die
      System-Rollen `member` und `manager` haben `settings:write` (Scope all). Der Key schützt
      tenantweite Schreibrouten: `PUT /api/v1/settings/branding` (`route_settings.go:96`),
      `PUT /api/v1/settings/tenant` (`:103`) und `PUT /api/v1/video/presence/config`
      (`route_video.go:149`). Ein normaler Mitarbeiter kann damit Logo, Farben und
      Tenant-Einstellungen aller überschreiben — sofern der Service selbst nicht auf Admin
      prüft. ERST PRÜFEN: lesen `HandlePutBranding`, `HandlePutTenantSettings`,
      `HandleUpdatePresenceConfig` und die Services darunter (`internal/settings/`, Kommentar
      `route_settings.go:~817` nennt für eine andere Route "the service enforces
      admin-or-module-lead"). Prüft ein Service schon, belege es mit einem Test und markiere
      die Route im Journal als sicher.
      Derselbe Key schützt die PERSÖNLICHEN Routen `PUT /settings/user` (`:105`) und
      `PUT /settings/preferences` (`:111`) — die müssen für member weiter gehen. Deshalb den
      Key NICHT entziehen. Weg: die drei tenantweiten Routen zusätzlich auf einen Admin-Key
      begrenzen, der mit Alt-Tokens funktioniert. Kandidaten in dieser Reihenfolge prüfen:
      (1) ein vorhandener Key, den nur admin hat und der semantisch passt (Katalog
      `permissions` lesen, z. B. `settings:admin`/`tenant:*`/`branding:*` — gibt es ihn
      nicht, nicht erfinden), (2) sonst `middleware.RequireRole("admin")` vor dem
      bestehenden Guard (Rollen stehen schon im Alt-Token, kein Re-Login). Begründung der
      Wahl ins Journal.
      Nebenbefund derselben Klasse, im selben Commit prüfen und nur bei eindeutigem Ergebnis
      fixen: member hat `calendars:admin` und `resources:admin`. `calendars:admin` schützt
      `POST/DELETE/PUT /calendar/calendars/{id}/members...` (`route_calendar.go:68-70`, der
      Service prüft den Kalender-Besitzer — dann ist es harmlos) und
      `POST /calendar/holidays/seed` (`:113`, tenantweit). Ist `holidays/seed` für member
      offen und ohne Admin-Prüfung im Service, gleiche Behandlung wie oben.
    sources:
      - backend/internal/gateway/route_settings.go
      - backend/internal/gateway/route_video.go
      - backend/internal/gateway/route_calendar.go
      - backend/internal/settings/
      - backend/internal/middleware/rbac.go
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
    notes: >
      Kein Permission-Grant wird hier ENTZOGEN. Ein Entzug von `settings:write` würde die
      persönlichen Einstellungen jedes Mitarbeiters brechen (Totalausfall gegen Leck
      getauscht). Desktop-Aufrufer: `settings-persist.ts` und die Branding-/Tenant-Seiten
      unter `modules/settings` bzw. `modules/admin` — prüfen, dass das FE die tenantweiten
      Seiten nur Admins zeigt (dann ändert sich für niemanden sichtbar etwas).
    done_when:
      - "Router-Test: member-Token (settings:write, Rolle member) auf PUT /settings/branding und PUT /settings/tenant ergibt 403"
      - "Router-Test: admin-Token auf dieselben Routen weiter 2xx"
      - "Router-Test: member-Token auf PUT /settings/user und PUT /settings/preferences weiter 2xx"
      - "presence/config und holidays/seed geprüft, Ergebnis im Journal (gefixt oder belegt sicher)"
      - "Mutations-Probe: Admin-Begrenzung an branding entfernt, der member-Test wird rot"
      - "go test -count=1 ./internal/gateway/ ./internal/settings/ grün, 0 Skips"

  # ========================================================================================
  # BLOCK A — DER MITARBEITER: TOTALAUSFÄLLE FÜR MEMBER UND MANAGER
  # ========================================================================================

  - id: feat-hr-self-service-key-for-members
    phase: 4
    service: hr
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/gateway 76,6 %"
    decided: 2026-10-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-10-24 (`decide-hr-self-service-permissions-for-member-manager`):
      Self-Service ja. Neuer Key `hr:self` für member und manager (Scope own). Genehmigen läuft
      NICHT über einen neuen Key, sondern über das schon gesäte `team:absence:approve`
      (Nachfrage 2026-10-24, siehe `feat-hr-leave-approve-by-manager-for-reporting-line`).
    scope: >
      TOTALAUSFALL: `hr:read`/`hr:write` hängen nur an admin (Migration 129). Jeder Nicht-Admin
      bekommt auf `/hr/leave/*` und `/hr/time/*` 403 — Urlaubsantrag, Saldo, Stempeluhr,
      Pausen, eigene Zeiteinträge, Wochen einreichen.
      Bau: Seed-Migration mit `('hr:self','hr','self')` in `permissions`, Grant an member und
      manager mit Scope `own`, an admin mit `all`. Die Self-Service-Routen in `route_hr.go`
      bekommen `RequirePermissionAny(hr:<alt>, hr:self)`:
      Urlaub (`:76-87`): POST `/requests` (anlegen), POST `/requests/{id}/cancel` (eigenen
      zurückziehen — der Service erlaubt Cancel nur dem Antragsteller, `leave/service.go:~337`),
      GET `/requests`, `/requests/{id}`, `/balance`, `/types`.
      Zeit (`:105-124`): clock-in/out, break/start|end, active, status, POST/GET `/entries`,
      `/corrections` (anlegen), summary/daily|weekly, balance, analytics, POST `/weeks/submit`,
      weeks/status.
      NICHT auf `hr:self`: approve/reject (eigene Unit), `/sick` (Krankmeldung erfasst die
      Personalabteilung, bleibt `hr:write`), `/balance/{userId}` (fremder Saldo, eigene Unit),
      alles unter `/hr/employees`, `/hr/settings`, Supervisor-Routen (laufen schon additiv über
      `zeiterfassung:*`, `:100-102`).
      `hr:time_category|template|project` (Migration 224) decken Stempeluhr und Einträge NICHT
      ab (sie hängen an `/categories`, `/templates`, `/projects`) — kein Ersatz für `hr:self`.
      Prüfe vor dem Bauen, dass jeder umgestellte Handler die Identität aus dem JWT nimmt und
      keinen fremden `user_id`/`employee_id` aus Body oder Query annimmt; wo er das tut (bekannt:
      `HandleListWorkTimeEntries` liest `employee_id` aus der Query, `route_hr.go:~818`), Route in
      dieser Unit NICHT umstellen, sondern der Folge-Unit überlassen.
    sources:
      - backend/internal/gateway/route_hr.go
      - backend/internal/gateway/helpers.go
      - backend/internal/middleware/rbac.go
      - backend/migrations/000129_seed_missing_module_permissions.up.sql
      - backend/migrations/000224_seed_module_manager_member_permissions.up.sql
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
      - backend/internal/gateway/route_hr_leave_scope_test.go
      - desktop/src/renderer/src/api/hr-client.ts
    done_when:
      - "Migration up/down läuft lokal, zweites up ist ein No-op, admin/manager/member tragen hr:self mit dem richtigen Scope (SQL-Probe im Journal)"
      - "Router-Test: Token mit nur hr:self legt einen Urlaubsantrag an, stempelt ein und aus, liest eigenen Saldo und eigene Einträge (2xx)"
      - "Router-Test: Token mit nur hr:self auf approve, reject, /sick und /hr/employees ergibt 403"
      - "Router-Test: hr:read/hr:write-Token unverändert 2xx (Regression)"
      - "Mutations-Probe: hr:self aus dem Guard von POST /hr/leave/requests entfernt, der Test wird rot"
      - "desktop-aufrufer: hr-client.ts Leave- und Zeit-Aufrufe gelistet, Ergebnis im Journal"

  - id: fix-hr-own-scope-foreign-balance-and-time-entries
    phase: 4
    service: hr
    model: sonnet
    deps: [feat-hr-self-service-key-for-members]
    status: done
    coverage_start: "internal/gateway 76,6 %"
    scope: >
      Mit `hr:self` (Scope own) dürfen zwei Routen nicht fremde Daten liefern:
      `GET /hr/leave/balance/{userId}` (`HandleGetEmployeeLeaveBalance`, `route_hr.go:~489`,
      nimmt `{userId}` ungeprüft) und `GET /hr/time/entries?employee_id=` (`HandleListWorkTimeEntries`,
      `:~818`). Muster: `HandleListLeaveRequests` mit `ownerFilterForScope` (`:~305-318`, Tests
      `route_hr_leave_scope_test.go:58/69/84`). Weil der Guard jetzt zwei Keys hat:
      `ownerFilterForScopeAny` (`helpers.go:~197`). Scope own + fremde ID -> 403; Scope own
      ohne ID -> eigene Daten; hr:read (Scope all) -> wie bisher. Danach beide Routen auf
      `RequirePermissionAny(hr:read, hr:self)` stellen.
      Desktop: welche Ansichten fragen fremde IDs ab (Team-/Mitarbeiter-Ansichten in
      `hr-client.ts`, `modules/team`)? Die sehen für einen member künftig 403 statt Daten —
      das ist gewollt, aber im Journal festhalten.
    sources:
      - backend/internal/gateway/route_hr.go
      - backend/internal/gateway/helpers.go
      - backend/internal/gateway/route_hr_leave_scope_test.go
      - desktop/src/renderer/src/api/hr-client.ts
    done_when:
      - "Router-Test: hr:self(own) fragt /balance/{fremde id} an -> 403, /balance/{eigene id} -> 2xx"
      - "Router-Test: hr:self(own) mit employee_id=fremd -> 403, ohne -> eigene Einträge"
      - "Router-Test: hr:read(all) unverändert"
      - "Mutations-Probe: Owner-Filter an /balance/{userId} entfernt, der Fremd-Test wird rot"

  - id: feat-hr-reporting-line-and-team-time-scope
    phase: 4
    service: hr
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/biz/hr/timetracking 65,6 % · internal/biz/hr/employee 75,3 %"
    decided: 2026-10-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-10-24 (`decide-hr-team-time-scope-for-managers`): Teamleiter sehen
      nur ihre Berichtslinie, admin sieht alle (Beschäftigtendaten).
    scope: >
      `GET /api/v1/hr/time/team` (`route_hr.go:~121`, Guard `hr:read` ODER `zeiterfassung:team view`)
      ruft `GetTeamTime` (`hr_grpc.go:~1237-1271`); der Service (`timetracking/service.go:~693-720`)
      listet ALLE Mitarbeiter des Tenants (`employeeRepo.List`, `PerPage: 500`, nur TenantID).
      Berichtslinie existiert: `hr_employee_profiles.manager_user_id` (Migration 000046, Index
      vorhanden). Muster für Scope-Auflösung: `changerequest.approveScopeAllows`
      (`biz/hr/changerequest/service.go:~270`, `repo.ManagerOf`, `postgres_repository.go:~212`).
      Bau: (1) wiederverwendbarer Helper "Mitarbeiter-IDs der Berichtslinie von X" in
      `biz/hr/employee` (Filter in der SQL-Query, nicht als Post-Filter), (2) der Gateway reicht
      den Scope des Aufrufers für `zeiterfassung:team:view` durch (`middleware.PermissionScope`;
      hr:read = all), der gRPC-Server nimmt den Aufrufer per `callerID(ctx)`, (3) Scope team ->
      nur `manager_user_id = caller`, Scope all -> alle. Ob das per neuem Proto-Feld
      (`GetTeamTimeReq`, `proto/hr/v1/hr.proto:~1000`, Regen im selben Commit) oder per
      weitergereichter Permission (Regel 5 im Kopf) geschieht, beim Bauen entscheiden und im
      Journal begründen. FAIL-CLOSED: unbekannter oder fehlender Scope -> Berichtslinie, nie alle.
      Seed: `zeiterfassung:team:view` hat für manager heute Scope `all` (Migration 256). Eine
      Seed-Migration stellt manager auf `team` um (admin bleibt `all`). Wirkt erst nach Re-Login
      — bis dahin lösen Alt-Tokens zu `all` auf (`middleware/auth.go:~142-152`); in `offen:`.
      Den veralteten Kommentar `middleware/auth.go:~141` ("ScopeTeam nicht vorhanden") und den
      Testkommentar `route_hr_time_tracking_test.go:~310` (nennt eine nie angelegte Unit)
      nachziehen.
