      `internal/server/work_grpc.go`, erste Haelfte - Projekte, Projektstatus und Aufgaben.
      2.532 Zeilen und 66 Methoden ohne eine einzige Testdatei; deshalb auf zwei Units
      geteilt. Diese Unit deckt die Projekt- und Aufgabenmethoden ab plus die beiden
      Fehler-Abbildungen der Datei.
    sources:
      - backend/internal/server/work_grpc.go
      - backend/internal/server/formulare_grpc_test.go
      - backend/internal/server/testhelpers_test.go
    notes: >
      `NewWorkGRPCServer` nimmt acht Dienste - fuer die Validierungspfade genuegt ein Server
      mit nil-Diensten, weil `middleware.GetTenantID(ctx)` und die UUID-Pruefungen VOR jedem
      Dienstaufruf laufen. Nur wer in den Happy Path will, braucht Stubs; dann NUR fuer den
      einen benoetigten Dienst, nicht fuer alle acht. Die zweite Haelfte liegt in
      `b-cov-server-work-rest` - Doppelarbeit vermeiden, Dateinamen entsprechend trennen.
    done_when:
      - Fehler-Abbildung als Tabellentest ueber alle Sentinels, inklusive nil und unbekannt
      - Validierungspfade je Methode - ungueltige UUID und fehlender Tenant
      - Leere Listen kommen als [] zurueck, nicht als null
      - Mutations-Probe durchgefuehrt und ihr Ergebnis im Journal belegt
      - go test -count=1 ./internal/server/ gruen

