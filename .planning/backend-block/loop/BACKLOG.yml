        einem Fehler ab statt zu hängen
      - Dial-Timeout und Deadline stammen aus den bestehenden Konstanten in email/send, keine
        neuen Magic Numbers
      - Der Test nutzt einen TCP-Fake nach dem Muster smtp_timeout_test.go, keinen echten Server
      - Mutations-Probe durchgeführt und im Journal belegt
      - go test -count=1 ./internal/email/... grün

