      - backend/internal/gateway/route_biz_document_chains.go
    notes: >
      Mechanisch anfangen: über `internal/` nach `Round(`, `Div(`, `Mul(` auf
      `decimal.Decimal` greppen, plus alle Importe von `biz/tax`. Das ist die Grundgesamtheit —
      nach Wortstämmen suchen, nicht nach einem einzelnen Importmuster, sonst entsteht ein
      falscher Negativbefund.
      Je Stelle drei Fragen: Rechnet sie Geld oder etwas anderes (Prozentsatz, Dauer, Anzahl)?
