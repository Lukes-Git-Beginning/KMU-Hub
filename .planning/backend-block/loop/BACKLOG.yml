      DST-Umstellungen ist die typische Falle - feste Zeitpunkte im Test hart codieren, nie
      `time.Now()` verwenden. `SetUntil` gegen COUNT ist der interessante Fall: laut RFC 5545
      sind COUNT und UNTIL exklusiv, die Funktion entfernt COUNT beim Setzen von UNTIL - das
      Verhalten ist bereits Vertrag im Code (Kommentarzeile 56), also als Testfall
      festschreiben. `RemoveUntil`/`SetUntil` auf eine syntaktisch ungueltige RRULE anwenden
      muss `ErrInvalidRRule` liefern, nicht die kaputte Regel weiterreichen.
    done_when:
