      Außerdem ist ein Pre-Send-Anhang ohne Nachricht keinem Postfach zuzuordnen; die
      Besitzprüfung (`ownMessage`) lässt ihn deshalb nicht herunterladen. Fix-Optionen prüfen:
      Anhang erst beim Senden/Entwurf an die Nachricht hängen (Entwurf zuerst anlegen, dann
      Upload mit `message_id` des Entwurfs) oder `account_id`-Spalte + nullable `message_id`
      per Migration. Die Wahl muss die Besitzprüfung erhalten (Anhang -> Konto -> Aufrufer).
    sources:
      - backend/internal/server/email_grpc.go
