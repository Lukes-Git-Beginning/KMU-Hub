  - id: feat-retention-worker-schema-and-engine
    phase: 3
    service: security
    model: opus
    deps: []
    status: done
    coverage_start: "internal/security/gdpr 61,2 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      `retention_policies` existiert als Tabelle und laesst sich ueber die Oberflaeche pflegen
      (`internal/server/security_grpc.go`, `route_security.go`). Ausgefuehrt wird sie von
      NIEMANDEM. Es gibt keinen Worker, kein Scheduling und keine Zuordnung von
      `resource_type` auf eine Tabelle. Eine angelegte Policy sieht damit aus wie eine
      erfuellte Loeschpflicht und ist keine — die gefaehrlichste Form eines fehlenden Features,
      weil sie im Audit als vorhanden durchgeht. Diese Unit baut Schema und Motor, nicht die
      Handler.
    sources:
      - backend/internal/server/security_grpc.go
      - backend/internal/gateway/route_security.go
      - backend/internal/models/security.go
      - backend/internal/security/gdpr/erasure.go
    notes: >
      DRY-RUN IST DER DEFAULT. Ein Worker, der beim ersten Start scharf loescht, ist bei einem
      Zuordnungsfehler nicht zurueckzuholen. Der erste Modus zaehlt nur und schreibt das
      Ergebnis fort; scharf schalten ist eine bewusste, dokumentierte Einstellung. Das ist
      keine Vorsichtsgeste, sondern die einzige Reihenfolge, in der man einer Loeschmechanik
      trauen kann.
      Die Zuordnung resource_type -> Tabelle gehoert in eine EXPLIZITE Registry im Go-Code, mit
      der Datumsspalte je Eintrag. `resource_type` ist ein freier String (Befund 6): ein
      unbekannter Wert darf NICHT raten und nicht stillschweigend nichts tun, sondern muss als
      "nicht zugeordnet" sichtbar werden. Sonst legt jemand eine Policy fuer "kontakte" an,
      waehrend die Registry "contacts" kennt, und niemand merkt es.
      `action` kennt bereits delete und anonymize (Check-Constraint, `route_security.go:146`).
      Die Erasure-Handler in `erasure.go` haben fuer Anonymisierung eine funktionierende
      Mechanik inklusive Label — die wiederverwenden, nicht daneben eine zweite bauen.
      Neue Tabelle fuer Laufprotokolle: `tenant_id UUID NOT NULL` + RLS-Policy, wie jede andere.
      Ein Lauf muss idempotent sein: zweimal hintereinander ausgefuehrt darf beim zweiten Mal
      nichts mehr passieren. C8 prueft genau das.
    done_when:
      - Migration legt die Protokolltabelle mit tenant_id und RLS-Policy an, down entfernt sie
      - Registry resource_type -> Tabelle + Datumsspalte liegt explizit im Code; unbekannte Werte
        erscheinen als "nicht zugeordnet" statt still zu verpuffen
      - Motor arbeitet im Dry-Run-Default, scharfes Ausfuehren ist eine explizite Einstellung
      - Anonymisierung nutzt die bestehende Mechanik aus erasure.go, keine zweite Implementierung
      - Ein Test belegt: zweiter Lauf direkt nach dem ersten aendert nichts
      - go test -count=1 ./internal/security/... gruen, DATABASE_URL gegen kmuhub_app

