      - Das Kodierungsverhalten des Exporters ist unveraendert, per Diff belegt
      - Das Ergebnis steht als Kommentar am Test, damit die Frage nicht ein drittes Mal gestellt wird
      - go test -count=1 ./internal/biz/datev/ gruen

