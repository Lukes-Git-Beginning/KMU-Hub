      `bom.items.map` wirft (`ProduktionPage.tsx:472/504`); `items:[]` schreiben. (c) Listen ohne
      `page_size` liefern 20 (`route_produktion.go:186`) und die UI ignoriert `total` -> ab dem 21.
      Auftrag/BOM/Maschine/QC/Buchung fehlen sie; Default anheben oder Obergrenze wie bei Vermietung
      klären. (d) `createMachineBooking`/`updateMachineBooking`/`createPlan`/`getPlan`/`updatePlan`/
      `getCapacityOverview` schreiben `{booking}`/`{plan}`/`{overview}`, der Client typisiert flach —
      latent (Hooks ohne UI-Aufrufer); beim Anschließen entscheiden, FE-Thema nach BACKLOG-NEXT, falls
      das Gateway richtig ist. (e) `GET /boms?active=` ignoriert den Parameter. RAPPORTE: (f) `/stats`:
      Zähler 0 fehlen -> `approved_count + submitted_count` = NaN, Kachel "activeProjects" zeigt "NaN"
      bei jedem neuen Tenant (`RapportePage.tsx:259`); `ProtoFull`. (g) `POST /reports` liest nur
      title/description/author_id/report_date (`route_rapporte.go:133-140`), die UI erfasst Wetter,
      Temperatur, Arbeitszeiten, Pause, Notizen, Signatur — Datenverlust bei jedem Anlegen; das Proto hat
      die Felder (`rapporte.proto:197-202`) — durchreichen. `PUT …/signature` hat keinen Client (FE-Thema,
      nach BACKLOG-NEXT). (h) `addLine`/`uploadAttachment` verlangen `quantity > 0`/`size_bytes > 0`, der
      FE-Typ macht sie optional; `size_bytes` kommt als String. Latent. VERMIETUNG: (i) `page_size` 200/500
      wird still auf 50 gekappt (`helpers.go:105`) -> ab 51 Objekten/Mietvorgängen fehlen sie in Liste und
      Kalender. (j) `total_price` = 0 fehlt. (k) `start_date` kommt als UTC-Timestamp, das FE schneidet
      `.slice(0,10)` -> Starttag um 1 Tag zu früh bei UTC+; wie bei den Verträgen als reines Datum
      behandeln, falls die Spalte ein DATE ist. FUHRPARK: (l) `reportDamage` validiert `reported_by` als
      UUID, das FE-Feld ist Freitext (400 beim Eintragen eines Namens); `createTripLog` verlangt
      `driver_name` und `purpose` (FE: optional, Privatfahrt ohne Zweck) -> 400. (m)
      `GET /services/upcoming?days_ahead`, `/tuev-due?days_ahead`, `/gps/positions?limit` werden nicht
      durchgereicht (latent). (n) `service_type` Round-Trip: FE speichert `tires`, liest `tire_change`.
      Pro Punkt: erst prüfen, ob er noch stimmt (Befunde stammen aus einem Agenten-Scan, Stichproben
      verifiziert, nicht jeder Punkt), dann bauen oder begründet verwerfen.
    sources:
