      - backend/internal/server/dialer_grpc.go
      - backend/internal/dialer/service.go
      - backend/internal/dialer/redis_agent_store.go
      - backend/internal/dialer/postgres_repository.go
    notes: >
      Der Lesepfad ist seit Iteration 6 gefiltert (`visibleAgentEntry` in dialer/service.go);
      dieser Fix gehoert an den Schreibpfad. Billigster Weg fuer den User-Check: der Dialer
      hat einen Pool und `agentRepo.GetUserDisplayNames` liest bereits `users` -- eine
      tenant-gescopte Existenzpruefung daneben, analog `presence.PostgresUserDirectory`
      (Iteration 5). Kampagne ueber das vorhandene `campaigns.GetByIDForTenant`. Nicht den
      Redis-Schluessel umbauen. Ob ein Supervisor ueberhaupt fuer ANDERE User im eigenen
      Tenant schreiben darf, ist bestehendes Verhalten (FE schickt `user_id` optional) --
      nicht aendern, nur die Tenant-Grenze ziehen.
    done_when:
      - >-
        `SetAgentStatus` fuer eine User-UUID ausserhalb des Aufrufer-Tenants schreibt nichts
        und liefert denselben Fehler wie fuer eine unbekannte UUID; ein Test belegt, dass der
        Eintrag des fremden Tenants unveraendert bleibt
      - Eine `campaign_id` aus einem fremden Tenant wird abgelehnt, ohne das SET zu beruehren (per Test)
      - go test -count=1 ./internal/dialer/ ./internal/server/ ./internal/gateway/ gruen, DATABASE_URL gesetzt

  - id: fix-rapporte-worker-and-measurement-parent-report-tenant-check
    phase: 4
    service: rapporte
    model: sonnet
    deps: []
    status: done
    coverage_start: n.a. (Bugfix, kein Coverage-Ziel)
    scope: >
      VERIFIZIERTER BEFUND (2026-08-27, gefunden beim Bauen von
      `fix-rapporte-measurement-position-cross-tenant-insert`). Dieselbe Fehlerklasse wie dort,
      nur eine Ebene hoeher: `RapporteGRPCServer.AddWorker` (server/rapporte_grpc.go:539) und
      `RapporteGRPCServer.CreateMeasurement` (server/rapporte_grpc.go:600) reichen die
      `report_id` aus dem Request unveraendert an `s.repo.AddWorker` bzw.
      `s.repo.CreateMeasurement` durch, ohne vorher `GetReport(ctx, tenantID, reportID)` zu
      rufen. Beide Repository-Funktionen fuegen mit einem reinen `VALUES`-INSERT ein
      (postgres_repository.go:446 bzw. 512); der FK auf `work_reports(id)` prueft nur Existenz,
      nicht Eigentum, und die RLS-Policy prueft die `tenant_id` der NEUEN Zeile. Tenant A kann
      also einen Mitarbeiter-Eintrag (mit `hours`, abrechnungsrelevant) bzw. ein Aufmass an
      einen fremden Report haengen; die Zeile ist fuer Tenant A unsichtbar, haengt aber an
      Tenant B's Report und wird von dessen CASCADE mitgeloescht.
      Der Gegenbeweis, dass das kein Generalproblem ist: `Service.AddLine`
      (rapporte/service.go:377) und `Service.UploadAttachment` (service.go:503) rufen beide
      vorher `s.repo.GetReport(ctx, input.TenantID, input.ReportID)` — die beiden gRPC-Handler
      sind die zwei Stellen, die am Service vorbei direkt auf das Repository gehen.
      Fix analog zum bereits gebauten: Guard in die Repository-Funktion, nicht in den Handler
      (`INSERT ... SELECT ... WHERE EXISTS (SELECT 1 FROM work_reports WHERE id=$n AND
      tenant_id=$m)` + `RowsAffected()==0` -> `ErrReportNotFound`). Bei `CreateMeasurement` ist
      `reportID` optional (`*uuid.UUID`) — der Guard darf nur greifen, wenn er gesetzt ist.
      Nebenbefund fuer denselben Commit pruefen: `CreateAttachment` traegt neben `report_id`
      auch eine optionale `line_id`, die nirgends gegen den Report/Tenant geprueft wird.
    sources:
      - backend/internal/server/rapporte_grpc.go
      - backend/internal/rapporte/postgres_repository.go
      - backend/internal/rapporte/postgres_repository_test.go
      - backend/internal/rapporte/service.go
      - backend/migrations/000163_measurements_and_templates.up.sql
    notes: >
      Beim Bauen der Schwester-Unit ist eine Eigenschaft der lokalen DB aufgefallen, die den
      Test scheinbar gruen macht, obwohl der Guard schwaecher ist als gedacht: laeuft der
      EXISTS-Subselect als `kmuhub_app`, filtert die RLS-Policy der ELTERN-Tabelle die fremde
      Zeile bereits weg — ein `WHERE EXISTS (SELECT 1 FROM work_reports WHERE id=$n)` OHNE
      `tenant_id`-Filter besteht denselben Test. Den expliziten `tenant_id`-Filter trotzdem
      schreiben (Defense-in-Depth gegen einen Aufruf unter `sysctx`/BYPASSRLS), aber die
      Mutations-Probe muss den GANZEN Guard entfernen (zurueck auf `VALUES`), sonst beweist
      sie nichts.
    done_when:
      - >-
        `AddWorker` und `CreateMeasurement` lehnen eine `report_id` ab, die nicht zum
        aufrufenden Tenant gehoert (`ErrReportNotFound`), statt die Zeile einzufuegen
      - >-
        Je ein DB-Test pro Funktion belegt die Ablehnung ueber einen zweiten echten Tenant, und
        fuer `CreateMeasurement` belegt ein weiterer, dass ein NIL-`reportID` weiterhin
        akzeptiert wird
      - go test -count=1 ./internal/rapporte/... ./internal/server/ gruen, DATABASE_URL gesetzt, 0 Skips

