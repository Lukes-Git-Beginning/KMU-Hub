    status: done
    coverage_start: "internal/gateway 46,1 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      Ein Handler, der einen Datenbankfehler mit `err.Error()` an den Aufrufer durchreicht,
      verraet Tabellennamen, Spaltennamen, Constraint-Namen und gelegentlich Datenwerte. Das
      ist Aufklaerungsmaterial fuer jeden, der die Oberflaeche erreicht. Dieser Scan geht die
      75 `route_*.go` durch.
    sources:
      - backend/internal/gateway/
    notes: >
      Grep-Grundlage: `err.Error()`, `%v` und `%s` mit einem error-Argument in einer
      Antwortstruktur, sowie das direkte Durchreichen eines pgconn-Fehlers. Nach Wortstaemmen
      suchen, nicht nach einem einzelnen Muster — ein zu enger Grep erzeugt einen falschen
      Negativbefund.
      Nicht jeder Treffer ist ein Fund: ein Fehler, der nur ins Log geht, ist legitim (dafuer
      ist C6 zustaendig). Es zaehlt der Weg in die HTTP-ANTWORT.
      Bei jedem Fund den Statuscode mitnotieren: ein 500 mit SQL-Text ist schlimmer als ein
      400 mit einer Feldmeldung.
      Die Fix-Units koennen gebuendelt werden (eine je Routendatei), nicht eine je Zeile —
      sonst entstehen 40 Ein-Zeilen-Units.
