    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: done
    scope: >
      In Iteration 19 belegt (`TestCheckMsgRate_ReconnectResetsTheBucket`):
      `unregisterConnection` loescht `h.rateLimiters[userID]`, sobald die letzte Verbindung
      des Nutzers weg ist. Ein Client, der nach dem Aufbrauchen seines Bursts die Verbindung
      schliesst und neu aufbaut, bekommt sofort wieder `msgBurstSize` = 20 Nachrichten frei.
      Der Per-Nutzer-Limiter (10 Nachrichten/s dauerhaft, Burst 20) ist damit durch
      Reconnect-Schleifen aushebelbar. Das Aufraeumen selbst ist richtig (sonst waechst die
      Map unbegrenzt) -- falsch ist nur, dass es den Bucket-Stand mitnimmt.
    sources:
      - backend/internal/server/websocket.go
      - backend/internal/server/websocket_connection_test.go
    notes: >
      Schlankster Weg: den Bucket nicht sofort loeschen, sondern mit einem
      `lastSeen`-Zeitstempel versehen und erst verwerfen, wenn er laenger unberuehrt ist als
      die Zeit, die ihn ohnehin komplett auffuellen wuerde
      (`msgBurstSize / maxMsgsPerSecond` = 2 s, grosszuegig gerundet). Danach ist ein
      geloeschter Bucket von einem vollen nicht mehr unterscheidbar, und die Map waechst
      trotzdem nicht. Aufraeumen kann beim naechsten `checkMsgRate` desselben Nutzers
      passieren oder in `unregisterConnection` ueber einen Durchlauf -- KEINE neue Goroutine,
      kein Ticker. Der bestehende Test dreht sich dabei um; das ist der Beleg.
    done_when:
      - >-
        Ein Reconnect unmittelbar nach dem Aufbrauchen des Bursts bekommt kein volles
        Kontingent zurueck
      - >-
        Ein Test belegt, dass ein Bucket nach ausreichend langer Abwesenheit dennoch
        verworfen wird, die Map also nicht unbegrenzt waechst
      - "`TestCheckMsgRate_IsPerUser_NotGlobal` und `_NotPerConnection` bleiben gruen"
      - go test -count=1 ./internal/server/ gruen, DATABASE_URL gesetzt, 0 Skips

  - id: fix-retention-engine-drops-partial-affected-count-on-apply-failure
    phase: 4
    service: security
    model: sonnet
    deps: []
    status: done
    scope: >
      In Iteration 21 belegt
      (`TestRetentionEngine_Run_PartialBatchFailure_UndercountsButHandlerStaysIdempotent`):
      `RetentionEngine.runPolicy` (`internal/security/gdpr/retention.go:400-407`) ruft
      `handler.Apply` auf, das `(affected int, err error)` zurueckgibt. Liefert `Apply` einen
      Fehler UND einen affected-Wert > 0 (ein Handler, der mitten in einem Batch scheitert,
      nachdem er einen Teil bereits verarbeitet hat), verwirft der Fehlerpfad den `affected`-Wert
      komplett -- `item.Affected` bleibt auf 0, sowohl im In-Memory-Result als auch in der
      `retention_run_items`-Zeile. Ein Audit dieses Laufs liest "0 betroffen", obwohl der Handler
      real Datensaetze veraendert hat. Kein Datenverlust (die Handler-eigene Idempotenz sorgt
      dafuer, dass der naechste Lauf nur die tatsaechlich offenen Datensaetze erneut plant), aber
      ein falscher Audit-Trail fuer einen fehlgeschlagenen Enforce-Lauf -- genau die Flaeche, die
      dieses Modul laut seinem eigenen Dateikommentar verhindern soll ("eine Regel, die nichts
      loescht, aber wie eine erfuellte Loeschpflicht aussieht"). `RETENTION_MODE` steht produktiv
      auf `dry_run`, daher kein akutes Produktionsrisiko, aber der Bug ist scharf, sobald das
      erste `enforce`-Handling angeschaltet wird.
    sources:
      - backend/internal/security/gdpr/retention.go
      - backend/internal/security/gdpr/retention_test.go
    notes: >
      Schlankster Fix: `item.Affected = affected` auch im Fehlerpfad setzen (vor dem `return item`
      in Zeile 406), analog zur bestehenden Zuweisung im Erfolgspfad. Keine Schema-Aenderung
      noetig -- `retention_run_items.affected` ist bereits eine normale INT-Spalte ohne
      CHECK-Constraint auf 0 im `failed`-Status. Die Mutations-Probe aus Iteration 21 (genau diese
      eine Zeile ergaenzt) hat bereits belegt, dass der vorhandene Test
      `TestRetentionEngine_Run_PartialBatchFailure_UndercountsButHandlerStaysIdempotent` dann
      rot wird -- die Assertions dort muessen auf den reparierten Wert umgeschrieben werden
      (erwartet dann `item.Affected == 2`, nicht `0`).
    done_when:
      - >-
        `item.Affected` spiegelt in JEDEM Pfad von `runPolicy` (Erfolg UND Fehler) den von
        `Apply` real zurueckgegebenen Wert wider
      - >-
        `TestRetentionEngine_Run_PartialBatchFailure_UndercountsButHandlerStaysIdempotent` ist
        auf die neue Zusage umgeschrieben (`item.Affected == 2` im Fehlerfall) und gruen
      - go test -count=1 ./internal/security/gdpr/ gruen, DATABASE_URL gesetzt, 0 Skips

  - id: fix-gdpr-anonymized-label-counter-race
    phase: 4
    service: security
    model: sonnet
    deps: []
    status: done
    scope: >
      In Iteration 21 belegt (`TestGetNextAnonymizedLabel_ConcurrentCallersCollide`):
      `PostgresRepository.GetNextAnonymizedLabel` (`internal/security/gdpr/postgres_repository.go:
      197`) ist ein blankes `SELECT COUNT(*) FROM gdpr_erasure_log` gefolgt von `count+1`, ganz
      ohne Sperre und ohne Sequence dahinter. Zwei Aufrufer, die beide lesen, bevor irgendeiner
      schreibt -- ein manueller Erasure-Call (`service.go:314`) und ein zeitgleich laufender
      Retention-Enforce-Lauf mit `action=anonymize` (`retention.go:391`), oder zwei parallele
      Erasure-Anfragen -- erhalten denselben "naechsten" Wert und damit denselben
      `anonymized_label`-String fuer zwei verschiedene anonymisierte Personen. Kein
      Tenant-Datenleck (das Label traegt keine Personendaten, nur eine laufende Nummer, und die
      Zaehlung ist ohnehin global ueber alle Tenants -- ob DAS beabsichtigt ist, ist eine
      separate Frage, hier nicht angefasst), aber ein Bruch der impliziten Eindeutigkeitszusage,
      die der Name "Geloeschter Benutzer #N" macht, und potenziell verwirrend fuer einen Pruefer,
      der zwei Eintraege mit identischem Label im Erasure-Log findet und nicht weiss, ob das ein
      Duplikat oder zwei echte Faelle sind. `RETENTION_MODE` bleibt `dry_run`, daher betrifft das
      Risiko aktuell nur die manuelle Erasure (Service.AnonymizeUser), nicht die automatisierte
      Retention.
    sources:
      - backend/internal/security/gdpr/postgres_repository.go
      - backend/internal/security/gdpr/erasure_log_test.go
      - backend/internal/security/gdpr/service.go
    notes: >
      Sauberster Fix ist vermutlich eine echte Postgres-SEQUENCE
      (`CREATE SEQUENCE gdpr_anonymized_label_seq`) statt `COUNT(*)` -- `nextval()` ist
      unter concurrent Zugriff atomar, ohne expliziten Lock im Anwendungscode. Das braucht eine
      neue, forward-only Migration (Nummer zur Laufzeit ermitteln). Alternative ohne Migration:
      `SELECT COUNT(*) ... FOR UPDATE` auf einer Sentinel-Zeile oder ein
      `pg_advisory_xact_lock` um Read+Insert -- beides schlechter nachvollziehbar als eine
      Sequence und beide brauchen eine Transaktion, die Aufrufer heute nicht aufspannen (Repo
      und Handler rufen `GetNextAnonymizedLabel` und das nachfolgende Insert als zwei getrennte
      Pool-Queries auf). Der bestehende Test
      `TestGetNextAnonymizedLabel_IncrementsPerCall` erwartet exakte Werte ("Geloeschter
      Benutzer #1"/"#2") und muss mit einer Sequence weiterhin gruen bleiben, ohne von der
      globalen `gdpr_erasure_log`-Zeilenzahl anderer paralleler Tests abzuhaengen -- das ist
      mit einer Sequence sogar robuster als heute (die Sequence startet unabhaengig vom
      Tabelleninhalt bei 1, muss aber ggf. per Migration auf den bestehenden Hoechstwert
      vorgespult werden, damit keine Kollision mit historischen Labels entsteht).
    done_when:
      - >-
        Zwei Aufrufe von `GetNextAnonymizedLabel` ohne dazwischenliegenden Insert -- ob
        sequentiell oder unter zwei gehaltenen Verbindungen wie in
        `TestGetNextAnonymizedLabel_ConcurrentCallersCollide` -- liefern garantiert
        VERSCHIEDENE Werte
      - >-
        `TestGetNextAnonymizedLabel_ConcurrentCallersCollide` ist auf die neue Zusage
        umgeschrieben (`labelA != labelB`) und gruen
      - >-
        `TestGetNextAnonymizedLabel_IncrementsPerCall` bleibt unveraendert gruen
      - go test -count=1 ./internal/security/gdpr/ gruen, DATABASE_URL gesetzt, 0 Skips

  - id: doc-align-smtp-provider-templates-eu
    phase: 4
    service: deploy
    model: sonnet
    deps: []
    status: done
    decided: 2026-08-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-08-24: zweite der beiden namentlich freigegebenen Ausnahmen von
      der `deploy/`-Sperre. Begruendung: die beiden Betriebsvorlagen widersprechen sich in
      einer Frage, die fuer das Versprechen der EU-Datensouveraenitaet zentral ist.
      `deploy/docker/PRODUCTION_TEMPLATE:41` empfiehlt woertlich "Postmark/SES/Mailgun" —
      drei US-Anbieter. `deploy/ansible/roles/secrets/templates/env.production.j2:36` nennt
      "External Brevo (or other)" — Frankreich. Wer nach der einen Vorlage provisioniert,
      baut etwas anderes als wer nach der anderen geht.
      Freigegeben ist AUSSCHLIESSLICH die Angleichung der KOMMENTARE/EMPFEHLUNGEN in diesen
      beiden Dateien. KEINE Aenderung eines gesetzten Werts, KEIN neues Env, KEINE
      Compose-Aenderung. Der Go-Default bleibt leer (`config.go:205`) — das ist korrekt.
    coverage_start: "n.a. (Doku-Unit, kein Coverage-Ziel)"
    scope: >
      Beide Vorlagen auf dieselbe Empfehlung bringen: EU-ansaessige Versanddienste, mit
      einem kurzen Satz, WARUM (Auftragsverarbeitung im EU-Raum, keine
      Drittlandsuebermittlung nach Kapitel V DSGVO ohne zusaetzliche Grundlage).
      Vorher pruefen, ob es noch weitere Stellen gibt, die einen SMTP-Anbieter empfehlen —
      `deploy/`, `docs/`, `.env.example` und die Ansible-Rollen mit einem breiten Grep nach
      Anbieternamen absuchen (postmark, sendgrid, mailgun, ses, brevo, sendinblue,
      mailjet). Root Cause statt Symptom: wenn eine dritte Vorlage existiert, gehoert sie in
      dieselbe Unit.
      Keine Empfehlung fuer einen KONKRETEN Anbieter aussprechen, die ueber das hinausgeht,
      was schon dasteht — die Anbieterwahl ist eine Geschaeftsentscheidung. Es geht darum,
      dass die Vorlagen einander nicht widersprechen und dass das EU-Kriterium benannt ist.
    sources:
      - deploy/docker/PRODUCTION_TEMPLATE
      - deploy/ansible/roles/secrets/templates/env.production.j2
      - backend/internal/config/config.go
      - docs/
    notes: >
      Der Go-Default fuer den SMTP-Host ist leer und soll leer bleiben. Diese Unit setzt
      keinen Wert, sie raeumt die Empfehlung auf.
      Falls beim Grep auffaellt, dass eine Vorlage einen Anbieter nicht nur empfiehlt,
      sondern als Default SETZT: das ist ein Befund und gehoert ins Journal — geaendert wird
      er in dieser Unit NICHT, weil ein gesetzter Wert in einer Provisionierungsvorlage ein
      Deploy-Hazard ist.
      Kein Test moeglich. Der Beleg ist der Diff und die Grep-Liste im Journal.
    done_when:
      - >-
        Beide Vorlagen empfehlen dasselbe Kriterium (EU-Ansaessigkeit) mit derselben kurzen
        Begruendung
      - >-
        Die Grep-Liste aller Fundstellen, die einen SMTP-Anbieter nennen, steht im Journal;
        jede weitere Fundstelle ist mitgezogen oder als bewusst ausgelassen begruendet
      - Kein gesetzter Wert wurde geaendert, nur Kommentare und Empfehlungen (git diff belegt das)
      - >-
        Ausser den beiden genannten Dateien ist keine Datei unter deploy/ veraendert, ausser
        einer dritten Vorlage, die der Grep gefunden hat und die im Journal benannt ist

