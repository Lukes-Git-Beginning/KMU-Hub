#     - RLS/Cross-Tenant: `internal/plugin/repository/manifest_rls_test.go`
#       (Paket `repository_test`, `testutil.PoolFromEnv`/`SeedRow`/`WithTenantCtx`, eigene
#       Tenants pro Test statt geteilter Konstanten — sonst Unique-Index-Kollisionen).
#     - Redis ohne echten Server: `internal/cache/cache_test.go` (`miniredis.RunT(t)` plus
#       `redis.NewClient(&redis.Options{Addr: mr.Addr()})`). miniredis/v2 steht in go.mod.
#     - TCP-Fake-Server für Wire-Protokolle: `internal/email/send/smtp_timeout_test.go`.
#     Ein Server mit Nil-Service darf NUR für Pfade benutzt werden, die vor dem
#     Service-Aufruf abbrechen. Wer damit in den Happy Path läuft, bekommt einen
