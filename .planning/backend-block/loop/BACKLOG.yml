    service: gateway
    model: sonnet
    deps: []
    status: todo
    coverage_start: "internal/gateway 46,1 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      Dritter Fund aus scan-gateway-sql-error-leakage (Iteration 44), identisches Muster.
      `ConnectLexware`, `PushInvoiceToLexware` (o. ae.) in `internal/server/lexware_grpc.go:43,
