      Pfad `/vertraege/contracts/{id}/events` in den 820 Spec-Pfaden. `tenant_id UUID NOT NULL`
      + `CALL enable_tenant_rls('contract_events')` sind Pflicht. `user_id` aus
      `middleware.GetTenantID`-Nachbarschaft, also aus dem Auth-Kontext, NICHT aus dem Body.
      Append-only: kein UPDATE, kein DELETE im Repository. Die Route braucht einen Eintrag in
      `backend/api/openapi.yaml` im selben Commit, sonst ist `TestOpenAPIRouteDrift` rot.
    done_when:
