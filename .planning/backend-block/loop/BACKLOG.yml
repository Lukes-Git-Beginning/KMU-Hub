  - id: feat-auth-invite-mail-and-accept-page
    phase: 4
    service: auth
    model: opus
    deps: []
    status: done
    decided: '2026-10-29'
    decision: >
      ENTSCHEIDUNG LUKE, 2026-10-29: Die Einladung kommt per Mail über den vorhandenen System-Mailer, der Link führt
      auf eine schlichte Annahmeseite im Gateway (Muster `/reset-password`). Kein Electron-Deep-Link, kein neues Env.
    target: ein eingeladener Mitarbeiter bekommt eine Mail, setzt auf app.zentria.tech/invite Name und Passwort und kann sich anmelden
    coverage_start: n.a.
    scope: >
      PILOT-BLOCKER. Heute erzeugen `InviteAdminUser`, `ResendAdminUserInvite` (`internal/auth/admin_users.go:58,97`) und
      `CreateInvitation` (`internal/auth/service.go:525`) ein Token, alle drei über `createInvitation` und dieselbe
      Tabelle, `AcceptInvitation` (`service.go:581`) nimmt es an. Es geht aber KEINE Mail raus, und es gibt keine Seite,
      die das Token annimmt. Der Desktop (`modules/admin/users/InviteUserDialog.tsx:65`) meldet trotzdem "gesendet".
      Ein https-Link aus einer Mail öffnet die Electron-App nicht, deshalb gehört die Annahme ins Gateway.
      (1) Mail: `Mailer`-Interface (`internal/auth/mailer.go`) um `SendInvitationEmail(ctx, toEmail, toName,
      inviteLink string) error` erweitern, `systemMailer` in `cmd/auth/main.go:64` implementiert es (deutscher Text,
      Ablaufdauer `invitationExpiry` nennen). Aufruf in allen drei Wegen nach dem erfolgreichen Speichern. Der Link ist
      `<Basis>/invite?token=<token>`; die Basis wird aus `PasswordResetBaseURL` abgeleitet (Schema + Host, Pfad
      ersetzt), KEIN neues Env, KEINE neue `config.RequireX`. Versandfehler sind nie still: `slog.Error` mit
      `invitation_id`, die Einladung bleibt bestehen und `ResendAdminUserInvite` versendet neu. Das Token selbst nie
      loggen. (2) Seite: `backend/internal/gateway/invite_page.go` nach dem Muster von `reset_password_page.go`
      (GET/HEAD/POST `/invite`, hinter dem Public-Limiter in `RegisterPublicRoutes`, kein JavaScript, strikte CSP,
      `Cache-Control: no-store`, `X-Robots-Tag: noindex`, `Referrer-Policy: no-referrer`, Token im Hidden-Field statt in
      der POST-URL). Felder: Vorname, Nachname (vorbelegt, falls die Einladung sie trägt), Passwort, Wiederholung. POST
      ruft `AcceptInvitation` über gRPC. Zustände: Formular, abgelaufen/ungültig, Passwort-Regel verletzt (Meldung der
      Passwort-Policy), Erfolg mit "Konto angelegt, melde dich in der Cosmi-App an". Die Seite setzt keine Session
      und gibt das zurückgelieferte TokenPair nicht aus. (3) Die Seite liegt nicht unter `/api/v1`, braucht also
      keinen openapi-Eintrag; prüfen, dass `TestOpenAPIRouteDrift` das genauso sieht.
    sources:
      - backend/internal/auth/admin_users.go
      - backend/internal/auth/service.go
      - backend/internal/auth/mailer.go
      - backend/cmd/auth/main.go
      - backend/internal/gateway/reset_password_page.go
      - backend/internal/gateway/route_auth.go
      - desktop/src/renderer/src/modules/admin/users/InviteUserDialog.tsx
    notes: >
      Der Desktop-Dialog wird tagsüber am 2026-10-29 auf diesen Vertrag gezogen (Fehlerfälle, Erneut senden). Der
      Toast "gesendet" wird mit dieser Unit wahr. Prüfe beim Desktop-Aufrufer nur, dass der Response-Vertrag
      (`AdminUserResponse`, `invite_token`) unverändert bleibt.
    done_when:
      - 'Service-Test mit Fake-Mailer: Invite, Resend und CreateInvitation versenden je genau eine Mail mit Link auf /invite?token=, Versandfehler lässt die Einladung bestehen und wird geloggt'
      - 'Gateway-Test: GET /invite mit gültigem Token zeigt das Formular, ohne/mit abgelaufenem Token den Fehlerzustand; POST legt das Konto an; Header (CSP, no-store, noindex) geprüft; HEAD antwortet 200'
      - 'Test: ein angenommenes Token ist danach ungültig (zweiter POST zeigt den Fehlerzustand)'
      - go test -count=1 für internal/auth, internal/gateway und internal/server grün, DATABASE_URL als kmuhub_app, 0 Skips

  - id: e2e-invite-onboarding-flow
    phase: 4
    service: auth
    model: sonnet
    deps: [feat-auth-invite-mail-and-accept-page]
    status: done
    target: der Erstkunden-Onboarding-Weg läuft Ende-zu-Ende gegen den echten Stack
    coverage_start: n.a. (E2E)
    scope: >
      Neuer Flow `backend/test/e2e/invite_onboarding_test.go`: admin lädt per `POST /api/v1/admin/users/invite` einen
      Nutzer mit der Rolle member ein; das Token kommt aus `invite_token` der Antwort (CI und lokaler Stack haben kein
      SMTP, die Mail selbst prüft die Bau-Unit mit dem Fake-Mailer). Dann `GET /invite?token=` (200, Formular), `POST
      /invite` mit Name und Passwort (Erfolgszustand), Login als neuer Nutzer, `GET /api/v1/auth/me` zeigt Tenant,
      Rolle member und Namen; ein zweiter POST mit demselben Token zeigt den Fehlerzustand; `POST
