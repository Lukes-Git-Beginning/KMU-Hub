      Zusaetzlich hier: eine oeffentliche Schreib-Route ist ein Spam-Ziel. Rate-Limit ueber den
      strengen publicRateLimiter ist Pflicht, Groessenbegrenzung des Bodys ebenfalls.
      Datei-Upload in dieser Unit NICHT mitbauen. Wenn das Formular Dateifelder hat, sauber
      ablehnen statt halb zu unterstuetzen, und die Luecke ins Journal schreiben.
