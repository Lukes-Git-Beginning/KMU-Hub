      NACH WORTSTÄMMEN suchen, nicht nach einem einzelnen Feldnamen — ein zu enger Grep erzeugt
      einen falschen Negativbefund. Für IBAN also auch `iban`, `Iban`, `account_number`,
      `bank_account`; für Beträge die Kombination aus Betragsfeld und Kundenfeld im selben
      Logaufruf.
      Zwei verschiedene Fehlerklassen sauber trennen: (a) ein Wert steht im LOG (interne
      Leckage, DSGVO-relevant bei Logexport), (b) ein Wert oder eine Fremdmeldung steht in der
      HTTP-ANTWORT (externe Leckage, schwerer). Je Fund die Klasse angeben.
      Eine Fehlermeldung eines Fremdsystems in der Antwort ist immer ein Fund, auch ohne
      Personendaten — sie verrät interne Struktur und hilft dem Nutzer nicht.
      Strukturierte Logfelder (slog-Attribute) sind genauso betroffen wie Formatstrings.
    done_when:
