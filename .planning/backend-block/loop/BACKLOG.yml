  - id: fix-gateway-quote-lifecycle-routes-missing-error-responses
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. — Bugfix, kein Coverage-Ziel"
    scope: >
      Gefunden 2026-08-22 waehrend scan-gateway-openapi-response-code-drift (Iteration 46), als
      Nachtrag zu cov-gateway-biz-quotes (Iteration ~19). Die vier Statusuebergangs-Routen fuer
      Angebote —
        POST /api/v1/finance/quotes/{id}/send    (openapi.yaml:8817)
        POST /api/v1/finance/quotes/{id}/accept  (openapi.yaml:8834)
        POST /api/v1/finance/quotes/{id}/reject  (openapi.yaml:8849)
        POST /api/v1/finance/quotes/{id}/convert (openapi.yaml:8864)
      dokumentieren fast keine ihrer tatsaechlichen Fehlerantworten. Alle vier Handler
      (`route_biz_quotes.go`) gehen ueber den gemeinsamen `respondGRPCError`-Pfad, der
      `quote.ErrQuoteNotDraft`/`ErrQuoteNotSent` (`codes.FailedPrecondition`) auf 409 und
      `quote.ErrQuoteNotFound` (`codes.NotFound`) auf 404 abbildet
      (`backend/internal/server/biz_grpc_errormap_settings_quotes_test.go:36-38` belegt die
      Zuordnung) — und jede Route haengt hinter `RequirePermission`/`RequireRole`, liefert also
      auch 401/403. In der Spec steht:
        send:    nur 200, 404 (401/403/409 fehlen)
        accept:  nur 200        (401/403/404/409 fehlen komplett)
        reject:  nur 200        (401/403/404/409 fehlen komplett)
        convert: nur 200        (401/403/404/409 fehlen komplett)
      Zum Vergleich dokumentiert die strukturell aehnliche Route PATCH /api/v1/admin/license
      (openapi.yaml:31402-31436) 400/401/403/404/409 vollstaendig — sie ist die Vorlage, wie es
      aussehen sollte. Das ist genau der Fall, den done_when von cov-gateway-biz-quotes verlangt
      hatte ("Jeder unerlaubte Statusuebergang ... liefert 409, nicht 500") — der Code haelt das
      Versprechen ein, die Spec zeigt es nur nicht an.
    sources:
      - backend/api/openapi.yaml
      - backend/internal/gateway/route_biz_quotes.go
      - backend/internal/server/biz_grpc_errormap_settings_quotes_test.go
      - backend/internal/biz/quote/
    notes: >
      Reine Spec-Korrektur, kein Code-Verhalten aendert sich. Fuer jede der vier Routen
      "401": Unauthorized, "403": Forbidden, "404": NotFound (send hat es schon) und "409" mit
      einer Beschreibung ergaenzen, die den konkreten Uebergangsfehler nennt (z. B. bei accept:
      "Angebot ist nicht im Status 'sent'"). Nicht pauschal denselben Text fuer alle vier
      kopieren — `ErrQuoteNotDraft` (send) und `ErrQuoteNotSent` (accept/reject) sind
      unterschiedliche Vorbedingungen und sollten das auch in der Beschreibung sagen.
      `convert` hat zusaetzlich `invoice.ErrQuoteNotAccepted` (FailedPrecondition, 409) aus dem
      Invoice-Paket — im Response-Text erwaehnen, nicht nur den Quote-eigenen Fall.
    done_when:
