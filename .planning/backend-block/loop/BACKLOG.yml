      - Frisch erzeugter Tenant sieht keine Fremddaten (RLS-Smoke explizit)
      - go build/vet/lint/test gruen

# ===========================================================================
# BLOCK 2 - Write-Path-Tests (Nachtlauf 2, angelegt 2026-07-27)
# ===========================================================================
#
# Befund, der diesen Block ausloest: 64 von 68 DB-gestuetzten Tests im Repo
# seeden ueber `testutil.SeedRow` und setzen `tenant_id` dabei von Hand. Sie
# beweisen damit die RLS-Policy - und rufen die Repository-Schreibmethode nie
# auf. Ein INSERT, der `tenant_id` nicht mitschreibt, ist unter FORCE RLS aber
# kein falscher Write, sondern ein TOTER: er scheitert bei jedem Aufruf an der
# NOT-NULL-Constraint. Genau so lagen in Nacht 1 drei Module monatelang kaputt
# (auth/invitations `41bf1080`, hr-Pausen `d78f9176`, notification `f4be722e`)
# - Service-Tests laufen gegen Mocks, das FE gegen MSW, und der DB-Test seedete
# daran vorbei.
#
# ACHTUNG, nicht per Grep suchen: ein `grep "INSERT INTO" | grep -v tenant_id`
# ist wertlos, weil die Spaltenliste meist in der Folgezeile steht. In
# `produktion` melden so 9 von 9 INSERTs "ohne tenant_id" - alle neun setzen
# ihn korrekt. Der Test ist der Beweis, nicht das Lesen.
#
# GEMEINSAMES MUSTER fuer jede wp-*-Unit (Vorlage:
# `internal/notification/integration/tenant_write_test.go`, Commits `f4be722e`
# + `73b47650`):
#
#   1. Datei `<paket>/tenant_write_test.go`, `testutil.SkipIfNoDB` + `t.Parallel()`.
#   2. EIGENE Tenants via `uuid.New()` + `testutil.EnsureTenant` - NIEMALS
#      `testutil.TenantA/TenantB` teilen. Tabellen mit einer per-Tenant-eindeutigen
#      Spalte (z.B. `integration_configs` UNIQUE(platform,tenant_id)) kollidieren
#      sonst mit dem parallel laufenden Isolationstest des gleichen Pakets.
#   3. Jede Schreibmethode des Repositories EINMAL ECHT AUFRUFEN - `repo.Create...`,
#      nicht `testutil.SeedRow`. Das ist der ganze Punkt der Unit.
#   4. Zurueckschreiben pruefen: eigener Tenant-Kontext findet die Zeile,
#      Fremd-Tenant findet sie nicht (`testutil.AssertRowCount` 1 bzw. 0).
#   5. Findet sich ein toter Write: IM SELBEN COMMIT reparieren (tenant_id in
#      INSERT + Modell-Feld + jede WHERE-Klausel der Lese- und Update-Pfade), plus
#      Journal-Eintrag. Ist die Reparatur groesser als das Modul (Proto-Aenderung,
#      Migration), dann Test committen + eigene `fix-`Unit vorne anlegen.
#   6. Gate zwingend MIT Datenbank, sonst beweist die Unit nichts:
#        export DATABASE_URL="postgres://kmuhub_app:app_dev@localhost:5432/kmuhub?sslmode=disable"
#        go test -count=1 ./internal/<paket>/...
#      Rolle `kmuhub_app`, nicht `kmuhub` - der Superuser hat BYPASSRLS.
#      Im Journal unter `gate:` die Zahl der real gelaufenen (nicht
#      uebersprungenen) DB-Tests nennen.
#
# Reihenfolge = Risiko: erst was Nacht 1 neu gebaut hat und was gar keinen
# DB-Test besitzt, dann die Flaeche.

