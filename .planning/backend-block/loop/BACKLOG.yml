units:

  # ==========================================================================
  # BLOCK A — RBAC Phase 1 Welle 1b (seriell verkettet)
  # Quelle: .planning/backend-block/PHASE-1-RBAC-PLAN.md §4
  # Ergebnis: Custom-Rollen tenant-scoped verwaltbar, der RBAC-Builder im FE
  # laeuft gegen echtes Backend statt gegen MSW.
  #
  # Fundament aus Welle 1a steht und ist am 2026-08-02 empirisch verifiziert:
  #   - `roles` hat `tenant_id` (NULL = System-Preset), `preset_id`, `color`
  #   - `role_permissions` hat `scope` (Default 'all')
  #   - RLS-Paar auf beiden: Lesen sieht `tenant_id IS NULL OR = current_tenant_id()`,
  #     Schreiben nur den eigenen Tenant -> Presets sind fuer Tenants NICHT
  #     schreib- oder loeschbar (DELETE wertet nur USING aus)
  #   - Arbiter-Index `idx_roles_tenant_name` auf
  #     `(COALESCE(tenant_id,'00000000-0000-0000-0000-000000000000'::uuid), name)`
  #   - Als `kmuhub_app` sichtbar: 8 Preset-Rollen, 1179 Grants, admin = 454 Capabilities
  #
  # Verifiziert: `/admin/roles` hat aktuell NULL Treffer im Gateway
  # (`grep -rn "admin/roles" backend/internal/gateway/`), das FE ruft die Routen
  # aber bereits auf (`desktop/src/renderer/src/api/rbac-client.ts`).
  # ==========================================================================

  - id: p1b-proto
    phase: 1b
    service: auth
    model: opus
    deps: []
    status: done
    scope: >
      Rollen-Admin-RPCs am auth-Service in `backend/proto/auth/v1/auth.proto`, plus Messages.
      RPCs: `ListRoles`, `CreateRole`, `UpdateRole`, `DeleteRole`, `GetRolePermissions`,
      `SetRolePermissions`, `AssignUserRole`, `RevokeUserRole`.
      Messages mindestens: `Role{id,name,description,color,is_system,preset_id,member_count,
      capability_count}`, `RoleGrant{key,scope}`, dazu die Request/Response-Paare.
      Regenerierung im SELBEN Commit.
    sources:
      - .planning/backend-block/PHASE-1-RBAC-PLAN.md
      - backend/proto/auth/v1/auth.proto
      - desktop/src/renderer/src/api/rbac-client.ts
      - desktop/src/renderer/src/mocks/handlers/rbac.ts
    notes: >
      Nur Proto + Regen, keine Implementierung — die kommt in den Folge-Units. Der Auftritt im
      generierten `UnimplementedAuthServiceServer` ist erwartete Boilerplate und KEIN Stub-Fund
      im Sinne des Verify-Vorspanns.
      Die Feldnamen exakt aus dem FE-Vertrag ziehen (`mocks/handlers/rbac.ts` ist die SSOT, gegen
      die das FE heute laeuft) — sonst entsteht genau der Nested-Proto-vs-flacher-FE-Typ-Bruch,
      der dieses Repo schon mehrfach gekostet hat.
      Regen: `export PATH="$PATH:/c/Program Files/Go/bin:$HOME/go/bin"; cd backend && make proto-auth`
      (exaktes Target im Makefile nachsehen). `.proto` ohne passende `.pb.go` im selben Commit
      ist Fehlerklasse 3.
    done_when:
      - auth.proto enthaelt die 8 RPCs + Messages
      - passende .pb.go/.grpc.pb.go im selben Commit regeneriert
      - go build -p 2 ./proto/auth/... ./internal/auth/... gruen

  - id: p1b-roles-list
    phase: 1b
    service: auth
    model: sonnet
    deps: [p1b-proto]
    status: done
    scope: >
      `GET /admin/roles` -> `{roles:[Role]}`. Liefert die System-Presets (tenant_id IS NULL) UND
      die Custom-Rollen des aufrufenden Tenants — genau das, was die Lese-Policy ohnehin
      durchlaesst. Pro Rolle die Aggregate `memberCount` (COUNT ueber `user_roles`) und
      `capabilityCount` (COUNT ueber `role_permissions`).
    sources:
      - backend/internal/auth/
      - backend/internal/server/auth_grpc.go
      - backend/internal/gateway/
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
    notes: >
      Die Aggregate in EINER Query mit LEFT JOIN + GROUP BY holen, nicht per N+1 pro Rolle.
      `user_roles` hat KEINE RLS (siehe Unit `g-user-roles-rls` in Block B) — der COUNT muss
      deshalb hier ueber einen Join auf `users` tenant-gescopt werden, sonst zaehlt er
      tenant-uebergreifend. Das ist kein Grund, die Unit zu blockieren, aber es MUSS im Code
      stehen und im Journal vermerkt sein.
      Route-Guard: bestehendes Muster `RequirePermissionAny` nutzen, damit kein Nutzer mit
      gueltigem Token ausgesperrt wird.
    done_when:
      - GET /admin/roles liefert Presets + eigene Custom-Rollen
      - memberCount/capabilityCount stimmen gegen die DB
      - Route in api/openapi.yaml eingetragen (TestOpenAPIRouteDrift gruen)
      - go test ./internal/gateway/ gruen

  - id: p1b-roles-create
    phase: 1b
    service: auth
    model: opus
    deps: [p1b-roles-list]
    status: done
    scope: >
      `POST /admin/roles` Body `{name,description,color,basedOn}` -> 201 `{role}`.
      Semantik ist **Klon**: die `role_permissions` von `basedOn` werden 1:1 inklusive `scope`
      kopiert, die neue Rolle bekommt `tenant_id = current_tenant_id()`.
      Fehler: `role_limit_reached` (409, ab 20 Custom-Rollen je Tenant), `role_name_exists` (409),
      `not_found` (404, basedOn existiert nicht/nicht sichtbar), 422 bei fehlenden Pflichtfeldern.
    sources:
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
      - desktop/src/renderer/src/mocks/handlers/rbac.ts
    notes: >
      Der Unique-Index ist ein AUSDRUCKS-Index:
      `(COALESCE(tenant_id,'00000000-0000-0000-0000-000000000000'::uuid), name)`. Ein
      `ON CONFLICT (tenant_id, name)` findet dafuer KEINEN Arbiter und wirft zur Laufzeit.
      Entweder byte-identisch denselben Ausdruck nutzen oder die Kollision explizit vorher pruefen.
      Das 20er-Limit zaehlt NUR Custom-Rollen (`tenant_id IS NOT NULL`); die Presets duerfen es
      nicht auffressen.
      `basedOn` darf ein Preset sein (das ist der Normalfall im Builder) — Presets sind lesbar,
      nur nicht schreibbar. Das Kopieren der Grants schreibt in `role_permissions` der NEUEN
      Rolle, die dem Tenant gehoert, verletzt also die Schreib-Policy nicht.
    done_when:
      - Klon uebernimmt alle Grants inkl. scope
      - alle vier Fehlerfaelle liefern den spezifizierten Code
      - Test gegen den echten Service (nicht nur den Handler), Limit-Fall inklusive
      - openapi.yaml + go test ./internal/gateway/ gruen

  - id: p1b-roles-update-delete
    phase: 1b
    service: auth
    model: sonnet
    deps: [p1b-roles-create]
    status: done
    scope: >
      `PATCH /admin/roles/{id}` `{name?,description?,color?}` -> `{role}` und
      `DELETE /admin/roles/{id}` -> 204.
      Fehler: `preset_immutable` (403, `tenant_id IS NULL`), `role_name_exists` (409),
      `role_has_members` (409, Rolle hat noch Traeger in `user_roles`).
    sources:
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
    notes: >
      Die Schreib-Policy blockt Presets bereits auf DB-Ebene — ein UPDATE/DELETE auf ein Preset
      trifft schlicht null Zeilen. Genau DESHALB braucht es den expliziten 403: sonst ist die
      Antwort ein 404 oder ein stilles 204, und der Builder zeigt "geloescht" fuer eine Rolle,
      die noch da ist. Erst pruefen (`tenant_id IS NULL` -> 403), dann schreiben.
      `role_has_members` vor dem DELETE pruefen, nicht auf einen FK-Fehler warten — die Meldung
      muss fachlich sein.
    done_when:
      - Preset -> 403 preset_immutable bei PATCH UND DELETE
      - Rolle mit Traegern -> 409 role_has_members
      - Namenskollision -> 409
      - Tests fuer alle drei Faelle gegen den echten Service
      - openapi.yaml + go test ./internal/gateway/ gruen

  - id: p1b-role-permissions
    phase: 1b
    service: auth
    model: sonnet
    deps: [p1b-roles-update-delete]
    status: done
    scope: >
      `GET /admin/roles/{id}/permissions` -> `{roleId, grants:{key:{scope}}}` und
      `PUT /admin/roles/{id}/permissions` (Vollersatz derselben Struktur).
      PUT ersetzt die Grant-Menge der Rolle komplett: fehlende Keys werden entzogen, neue
      angelegt, geaenderte `scope`-Werte aktualisiert — in EINER Transaktion.
    sources:
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
      - desktop/src/renderer/src/config/capability-catalog.ts
    notes: >
      Unbekannte Capability-Keys muessen 422 geben, nicht still verschluckt werden — sonst
      speichert der Builder Rechte, die nirgends greifen. Gegen die `permissions`-Tabelle
      validieren (456 Zeilen lokal), nicht gegen eine Konstante im Code.
      Auf Presets ist PUT verboten (`preset_immutable`, 403) — dieselbe Begruendung wie in der
      Vorgaenger-Unit.
      Vollersatz heisst DELETE+INSERT in einer Transaktion ODER ein sauberes Diff; wichtig ist
      nur, dass ein Fehler mittendrin nichts Halbes hinterlaesst.
    done_when:
      - PUT ersetzt vollstaendig (Entzug funktioniert nachweislich)
      - unbekannter Key -> 422
      - Preset -> 403
      - Transaktionalitaet getestet (Fehler mittendrin laesst die Alt-Grants stehen)
      - openapi.yaml + go test ./internal/gateway/ gruen

  - id: p1b-user-roles
    phase: 1b
    service: auth
    model: opus
    deps: [p1b-role-permissions]
    status: done
    scope: >
      `POST /users/{id}/roles` `{roleId}` und `DELETE /users/{id}/roles/{roleId}`, beide ->
      `{roles:[...]}` (die neue Rollenliste des Users).
      Dazu die **Validator-Entkopplung**: das `oneof` in `assignRoleRequest` fliegt raus, die
      Rollen-ID wird dynamisch gegen die `roles`-Tabelle validiert (tenant-gescopt) — sonst sind
      Custom-Rollen strukturell nicht zuweisbar.
    sources:
      - backend/internal/auth/
      - backend/internal/validation/
      - .planning/backend-block/PHASE-1-RBAC-PLAN.md
    notes: >
      Das `oneof` zu finden ist Teil der Arbeit: nach `assignRole` bzw. der Rollen-Enum im
      Validator suchen. Solange es steht, akzeptiert der Endpoint nur die Preset-Namen und die
      ganze Welle 1b bleibt praktisch wirkungslos.
      `user_roles` hat weder `tenant_id` noch RLS (Block B, `g-user-roles-rls`). Diese Unit MUSS
      deshalb selbst tenant-scopen: der Ziel-User wird ueber `users` (RLS-geschuetzt) aufgeloest,
      die Rolle ueber `roles`. Ein Zuweisen ueber Tenant-Grenzen hinweg darf nicht moeglich sein,
      auch nicht, solange die Tabelle ungeschuetzt ist.
      `last_admin` (409) gehoert fachlich hierher, wird aber zusammen mit den uebrigen Guardrails
      in `p1b-guardrails` gebaut — hier nur die Stelle vorsehen, nicht doppelt implementieren.
    done_when:
      - Custom-Rolle ist zuweisbar (Validator entkoppelt)
      - Zuweisung ueber Tenant-Grenzen scheitert nachweislich
      - beide Endpoints liefern die neue Rollenliste
      - openapi.yaml + go test ./internal/gateway/ ./internal/auth/... gruen

  - id: p1b-guardrails
    phase: 1b
    service: auth
    model: opus
    deps: [p1b-user-roles]
    status: done
    scope: >
      Die vier serverseitigen Guardrails aus PHASE-1-RBAC-PLAN §4, zentral im Service:
      (a) **Mindestens-1-Admin** — der letzte Traeger einer Admin-Rolle im Tenant kann sie nicht
      verlieren (`last_admin`, 409).
      (b) **Selbst-Aussperr-Schutz** — niemand entzieht sich selbst die Rechte, ueber die er
      gerade die Rechteverwaltung bedient.
      (c) **Privilege-Escalation-Schutz** — niemand vergibt Rechte, die er selbst nicht hat
      (Grant-Menge des Aufrufers ist die Obergrenze, inklusive `scope`: `own` darf nicht zu
      `all` aufgewertet werden).
      (d) **Preset-Immutability** — durchgaengig, auch auf den Permissions-Routen.
    sources:
      - backend/internal/auth/
      - backend/internal/middleware/rbac.go
    notes: >
      (c) ist der schwierige Teil und der sicherheitsrelevante: die effektive Grant-Menge des
      Aufrufers muss serverseitig aufgeloest werden (dieselbe Logik wie
      `GetEffectivePermissions` aus Welle 1a — WIEDERVERWENDEN, nicht neu schreiben). Das JWT
      taugt dafuer nicht: es traegt die groben Alt-Keys, nicht die feinen Capabilities.
      (b) ist kein Ersatz fuer (a): ein Admin kann sich auch dann aussperren, wenn noch andere
      Admins existieren — beide Regeln braucht es.
      Die Guardrails gehoeren in den SERVICE, nicht in die Handler (Thick Services, Thin
      Handlers) — sonst umgeht der naechste Aufrufer sie.
    done_when:
      - alle vier Regeln greifen im Service, nicht im Handler
      - last_admin liefert 409 mit fachlicher Meldung
      - Escalation-Versuch (Recht vergeben, das der Aufrufer nicht hat) wird abgelehnt
      - scope-Aufwertung own -> all wird abgelehnt
      - go build/vet/lint/test gruen

  - id: p1b-audit-events
    phase: 1b
    service: auth
    model: sonnet
    deps: [p1b-guardrails]
    status: done
    scope: >
      Audit-Events fuer jede Rechteaenderung, append-only auf dem bestehenden `audit_log`
      (Migration 000222). Taxonomie: `permission.role_created`, `permission.role_updated`,
      `permission.role_deleted`, `permission.assigned`, `permission.revoked`.
      (`permission.override_*` ist fuer R-6 reserviert und wird hier NICHT belegt.)
    sources:
      - backend/migrations/000222*.up.sql
      - backend/internal/auth/
    notes: >
      Zuerst das bestehende `audit_log`-Schema und seinen Schreibpfad lesen und WIEDERVERWENDEN —
      es gibt bereits Audit-Schreiber im Repo. Keine zweite Audit-Infrastruktur bauen.
      Braucht die Taxonomie eine Migration (Enum/CHECK/Index), ist die naechste freie Nummer zur
      Laufzeit zu ermitteln, nicht zu raten.
      Das Event muss den Akteur tragen (`middleware.GetUserID(ctx)` funktioniert im internen
      Server, weil `x-user-id` ueber den gRPC-Hop propagiert — `x-tenant-id` ebenfalls, Rollen
      NICHT).
    done_when:
      - jede der fuenf Aenderungsarten schreibt genau ein Event
      - Akteur, Tenant und Ziel-Ressource stehen im Event
      - Events sind append-only (kein Update-Pfad)
      - go test gruen

  - id: p1b-guardrail-tests
    phase: 1b
    service: auth
    model: sonnet
    deps: [p1b-audit-events]
    status: done
    scope: >
      Testabdeckung fuer Welle 1b gegen die echte DB: last-admin, Selbst-Aussperrung,
      Privilege-Escalation (inkl. scope-Aufwertung), Preset-Immutability auf allen vier
      schreibenden Routen, Custom-Limit 20, Tenant-Isolation der Rollenzuweisung.
    sources:
      - backend/internal/auth/
      - backend/internal/testutil/
    notes: >
      Pflicht: `DATABASE_URL` gesetzt, Rolle `kmuhub_app` (NICHT `kmuhub` — der Superuser hat
      BYPASSRLS, unter ihm beweist ein Isolationstest nichts).
      Jeder Test seedet EIGENE Tenants, nicht die geteilten Konstanten `TenantA`/`TenantB`: in
      Lauf 1 ist genau daran ein Test in CI gestorben (Duplicate Key auf einem per-Tenant-
      eindeutigen Index), waehrend er lokal gruen aussah, weil er ohne DB uebersprungen wurde.
      Am Ende `go test -count=1 ./internal/auth/... ./internal/gateway/` — und die Zahl der
      tatsaechlich gelaufenen (nicht uebersprungenen) Tests ins Journal.
    done_when:
      - alle sieben Faelle sind abgedeckt und laufen wirklich (0 Skips)
      - Tests nutzen eigene Tenants
      - go test -count=1 ./internal/auth/... ./internal/gateway/ gruen

  # ==========================================================================
  # BLOCK B — Sicherheit / RLS-Reste
  #
  # Grundlage: vollstaendiger Scan der lokalen DB am 2026-08-02 (Kopf 268).
  # 318 Tabellen, 249 mit aktivem RLS. Die Allowlist in `docs/ARCHITECTURE.md`
  # ("System-Global Tables (No RLS)") kennt genau VIER Ausnahmen:
  # `schema_migrations`, `caldav_settings`, `industry_templates`, `permissions`.
  # Alles andere ohne RLS ist entweder eine Luecke oder ein fehlender
  # Allowlist-Eintrag — beides wird in diesem Block geschlossen.
  #
  # ENTWARNUNG, damit niemand hinterherjagt: die Partitionen von
  # `automation_executions` und `dialer_call_events` zeigen `relrowsecurity=false`,
  # ihre partitionierten ELTERN haben aber RLS + Policy. Zugriffe laufen ueber den
  # Elternteil, also sind sie geschuetzt. KEINE Unit noetig.
  #
  # Helper im Schema (beide vorhanden, nutzen statt Policies von Hand schreiben):
  #   CALL enable_tenant_rls('<tabelle>')
  #   CALL enable_tenant_rls_via_join(...)   -- fuer Tabellen ohne eigene tenant_id
  # Policy-Form: `tenant_id = current_tenant_id() OR is_system_context()`,
  # Setting ist `app.tenant_id` (NICHT `app.current_tenant`).
  # ==========================================================================

  - id: g-rls-tenant-id-ohne-policy
    phase: sec
    service: db
    model: opus
    deps: []
    status: done
    scope: >
      Drei Tabellen tragen `tenant_id`, haben aber weder RLS noch eine Policy — verifiziert am
      2026-08-02 ueber `pg_class.relrowsecurity` + `pg_policies`:
      `email_contact_links`, `validation_rules`, `workflow_rules`.
      Migration, die auf allen dreien `CALL enable_tenant_rls('<tabelle>')` ausfuehrt, plus
      Isolationstest.
    sources:
      - backend/migrations/000118_rls_foundation.up.sql
      - backend/internal/email/
      - backend/internal/plugin/
    notes: >
      `validation_rules` und `workflow_rules` gehoeren zum Plugin-/Regel-System und werden vom FE
      ueber `desktop/src/renderer/src/api/plugin-client.ts` angesprochen
      (`/plugins/validation-rules`, `/plugins/workflow-rules` — beide Routen existieren im
      Gateway). `email_contact_links` verknuepft Mails mit Kontakten.
      ZUERST pruefen, ob `tenant_id` in allen drei Tabellen wirklich NOT NULL ist und ob die
      Schreibpfade sie ueberhaupt fuellen — eine RLS-Policy auf einer Spalte, die NULL bleibt,
      macht die Tabelle fuer die App unsichtbar (Phantom-404 statt Sicherheit). Ist ein
      Schreibpfad nicht verdrahtet, gehoert er in DERSELBEN Unit korrigiert.
      Alle drei Tabellen sind lokal LEER (0 Zeilen) — ein Leak-Test mit echten Daten ist also
      nicht moeglich. Der Isolationstest muss deshalb selbst seeden (eigene Tenants, nicht
      TenantA/B).
    done_when:
      - alle drei Tabellen haben RLS + Policy
      - tenant_id ist NOT NULL und wird von jedem Schreibpfad gesetzt
      - Isolationstest als kmuhub_app: eigener Tenant > 0, fremder Tenant = 0
      - migrate up/down/up gruen
      - go build/vet/lint/test gruen

  - id: g-rls-custom-field-values
    phase: sec
    service: db
    model: opus
    deps: [g-rls-tenant-id-ohne-policy]
    status: done
    scope: >
      Vier Tabellen halten echte Nutzdaten (die Werte benutzerdefinierter Felder), haben aber
      weder `tenant_id` noch RLS — verifiziert am 2026-08-02:
      `contact_custom_field_values`, `company_custom_field_values`, `deal_custom_field_values`,
      `activity_custom_field_values`.
      Absicherung ueber `enable_tenant_rls_via_join()` entlang der jeweiligen Eltern-Tabelle
      (`contacts`/`companies`/`deals`/`activities` — alle vier RLS-geschuetzt).
    sources:
      - backend/migrations/000118_rls_foundation.up.sql
      - backend/internal/crm/
    notes: >
      Schema ist jeweils `(<parent>_id, field_id, value, created_at, updated_at)` — es gibt also
      einen sauberen Join-Pfad, deshalb `enable_tenant_rls_via_join()` und NICHT eine
      nachtraegliche `tenant_id`-Spalte. Zuerst die Signatur des Helpers in
      `000118_rls_foundation.up.sql` lesen; er wird im Repo bereits verwendet, das Muster gibt es
      also schon.
      `task_custom_field_values` ist bewusst NICHT in dieser Liste — die Tabelle tauchte im Scan
      nicht als ungeschuetzt auf. Vor dem Bauen trotzdem gegenpruefen, statt es zu glauben.
      Alle vier sind lokal leer, der Isolationstest muss selbst seeden.
      Ein Join-basierter Policy-Check kostet pro Query einen zusaetzlichen Lookup — die
      Eltern-Tabellen sind auf `id` indiziert, das ist tragbar; falls ein Query-Plan kippt, im
      Journal vermerken statt still zu lassen.
    done_when:
      - alle vier Tabellen sind ueber den Join RLS-geschuetzt
      - Isolationstest je Tabelle: eigener Tenant > 0, fremder = 0
      - migrate up/down/up gruen
      - go build/vet/lint/test gruen

  - id: g-rls-events-partition
    phase: sec
    service: db
    model: opus
    deps: [g-rls-custom-field-values]
    status: done
    scope: >
      `events` ist eine partitionierte Tabelle (`relkind='p'`) mit `relrowsecurity=false` und
      NULL Policies — im Gegensatz zu den beiden anderen partitionierten Eltern
      (`automation_executions`, `dialer_call_events`), die beide RLS + Policy haben.
      Spalten: `id, event_type_key, module_id, priority, actor_id, resource_id, payload,
      processed, created_at` — also **kein `tenant_id`**, aber ein `payload` (JSONB), das
      Tenant-Daten transportiert.
    sources:
      - backend/migrations/
      - backend/internal/models/
    notes: >
      Das ist die architektonisch schwerste Unit des Blocks, deshalb opus. Zwei Wege, und die
      Entscheidung gehoert begruendet ins Journal:
      (A) `tenant_id` an `events` ergaenzen (+ Backfill ueber `actor_id` -> `users.tenant_id`,
      soweit aufloesbar) und `enable_tenant_rls()`. Sauber, aber Backfill auf einer
      partitionierten Tabelle ueber alle Partitionen.
      (B) `events` als bewusst system-global in die ADR-006-Allowlist eintragen, WENN der
      Nachweis gelingt, dass die Tabelle rein technischer Event-Bus ohne fachliche Nutzdaten ist
      und jeder Lesepfad ohnehin filtert.
      Der Nachweis fuer (B) ist Arbeit, nicht Behauptung: alle Schreiber von `events` suchen und
      pruefen, was real in `payload` landet. Steht dort Fachliches (Kontaktnamen, Betraege), ist
      (A) die einzige ehrliche Antwort.
      Lokal 0 Zeilen — die Frage ist also nur ueber den Code zu beantworten, nicht ueber Daten.
      Ist der Aufwand groesser als eine Iteration, LIEBER `blocked` mit dem Rechercheergebnis als
      eine halbe Migration.
    done_when:
      - Entscheidung (A) oder (B) mit Begruendung im Journal
      - bei (A) — RLS aktiv + Backfill + Isolationstest
      - bei (B) — Eintrag in docs/ARCHITECTURE.md mit Begruendung + Beleg der Lesepfade
      - migrate up/down/up gruen (falls Migration)

  - id: g-rls-allowlist-audit
    phase: sec
    service: db
    model: sonnet
    deps: [g-rls-events-partition]
    status: done
    scope: >
      Die Allowlist in `docs/ARCHITECTURE.md` nennt vier Tabellen, ungeschuetzt sind aber deutlich
      mehr. Jede der folgenden entweder absichern ODER mit Begruendung in die Allowlist eintragen —
      Stand 2026-08-02, ohne `tenant_id` und ohne RLS:
      `automation_templates`, `dashboard_defaults`, `event_types`, `industry_templates`(gelistet),
      `plugin_manifests`, `plugin_permissions`, `presence_config`, `public_holidays`,
      `refresh_tokens`, `storage_quotas`, `two_factor_policy`.
      Ergebnis ist eine vollstaendige, gegen die DB gepruefte Liste.
    sources:
      - docs/ARCHITECTURE.md
      - backend/migrations/
    notes: >
      ERGEBNIS (2026-08-02, Iteration 13): die elf Tabellen zerfallen in drei echte Gruppen, nicht
      zwei. (1) RLS jetzt geschlossen, Migration 000272: `refresh_tokens` (tenant_id + Backfill ueber
      user_id, enable_tenant_rls) und `plugin_permissions` (enable_tenant_rls_via_join ueber
      plugin_installations). (2) Allowlist ergaenzt, verifiziert schreibfrei bzw. tenant-invariant:
      `automation_templates`, `event_types`, `public_holidays` (industry_templates stand schon
      drin). (3) NEUER FUND, nicht in dieser Unit geloest: `dashboard_defaults`, `presence_config`,
      `two_factor_policy`, `storage_quotas`, `plugin_manifests` sind eine dritte Kategorie, die die
      urspruengliche Zwei-Wege-Frage (RLS oder Allowlist) nicht beantwortet — eine einzige globale
      Zeile/ein globaler Katalog, aendbar ueber eine `RequireRole("admin")`/`RequirePermission`-Route,
      die nur "ist Admin" prueft, nicht "in welchem Tenant". Jeder Tenant-Admin kann damit die
      2FA-Pflicht, das Dashboard-Preset, den Presence-Timeout, das Storage-Kontingent oder den
      Plugin-Katalog fuer ALLE Tenants gleichzeitig aendern. Weder RLS (kein tenant_id zum Filtern)
      noch Allowlist (der Inhalt ist echt admin-mutable, keine Seed-Daten) beantwortet das ehrlich —
      es braucht tenant_id + Backfill + ein Provisioning-Schritt fuer neue Tenants (die Reads sind
      aktuell `LIMIT 1`/`UNIQUE(role)`-Lookups ohne Tenant-Fallback). Groesser als eine Iteration,
      deshalb NICHT in 000272 mit hineingezogen, sondern als eigene Unit `g-rls-tenant-scoped-admin-
      writes` (direkt nach dieser eingefuegt) auesgelagert. Vollstaendige Herleitung pro Tabelle im
      Journal, Eintrag docs/ARCHITECTURE.md "Offener Befund — tenant-uebergreifende Schreibpfade".
      Die urspruengliche Vermutung im scope-Text, `dashboard_defaults` sei ein "starker Allowlist-
      Kandidat", hat sich beim Nachpruefen NICHT bestaetigt (siehe Fund oben) — Bewertungsmassstab
      war richtig, die Vorab-Einschaetzung dieser einen Tabelle war es nicht.
      `refresh_tokens`-Risiko wie vermutet klein: jeder Lesezugriff ist ein Hash-Lookup auf eine
      Zeile, und die beiden Schreib-/Lese-Einstiegspunkte (RefreshToken, Logout) liefen schon vor
      dieser Migration unter `sysctx.With()` — dieselbe Absicherung wie beim Schwester-Feld
      `password_reset_tokens.TenantID`, das als Vorlage diente.
    done_when:
      - jede Tabelle der Liste ist entweder RLS-geschuetzt oder in ADR-006 begruendet gelistet
      - docs/ARCHITECTURE.md aktualisiert
      - kein Widerspruch mehr zwischen DB-Zustand und Allowlist
      - migrate up/down/up gruen (falls Migration)

  - id: g-rls-tenant-scoped-admin-writes
    phase: sec
    service: db
    model: opus
    deps: [g-rls-allowlist-audit]
    status: done
    scope: >
      Fuenf Tabellen ohne `tenant_id`, deren einzige Zeile (bzw. bei `plugin_manifests` deren
      Katalog) ueber eine tenant-gescopte Admin-Route geschrieben wird, ohne dass die Route oder
      die Tabelle je pruefen, WELCHER Tenant schreibt: `dashboard_defaults` (PUT
      /admin/dashboard/defaults/{role}, UNIQUE(role)), `presence_config` (PUT /presence/config,
      UPDATE ohne WHERE auf der einzigen Zeile), `two_factor_policy` (PUT /2fa/policy,
      UNIQUE(role_name)), `storage_quotas` (IncrementUsedBytes/DecrementUsedBytes ohne WHERE),
      `plugin_manifests` (POST /api/v1/plugins/manifests fuer plugin_type=config, GET /manifests
      ohne Tenant-Filter). Jede Tabelle bekommt `tenant_id NOT NULL` + `enable_tenant_rls()`, die
      Unique-Constraints werden auf `(tenant_id, role)` bzw. `(tenant_id, role_name)` erweitert, und
      neue Tenants brauchen einen Provisioning-Schritt, der eine Default-Zeile anlegt (sonst liefert
      der `LIMIT 1`/`UNIQUE`-Read nach RLS ein leeres Ergebnis statt eines Fallbacks).
    sources:
      - docs/ARCHITECTURE.md
      - backend/internal/gateway/dashboard_repository.go
      - backend/internal/gateway/dashboard_service.go
      - backend/internal/work/presence/postgres_config_repository.go
      - backend/internal/auth/postgres_repository.go
      - backend/internal/chat/file/postgres_repository.go
      - backend/internal/plugin/repository/manifest.go
    notes: >
      Herleitung je Tabelle steht in docs/ARCHITECTURE.md unter "Offener Befund" und im Journal von
      Iteration 13 (Lauf 4) — dort auch die genauen Datei:Zeile-Fundstellen fuer jede Route.
      Kernfrage vor dem Bauen: wo entsteht die Tenant-Provisionierung? Aktuell scheint es keinen
      zentralen "Tenant angelegt"-Hook zu geben, der Default-Zeilen fuer neue Tenants seedet — falls
      der fehlt, ist DAS der eigentliche fehlende Baustein, nicht fuenf Einzelmigrationen. Erst
      klaeren, ob ein solcher Hook schon existiert (Tenant-Erstellung im Onboarding/Provisioning-Code
      suchen), bevor an den einzelnen Tabellen gebaut wird.
      `two_factor_policy` ist der sicherheitskritischste Fall (2FA-Erzwingung abschaltbar durch einen
      fremden Tenant-Admin) — falls die Unit in mehrere Iterationen zerfaellt, diese zuerst.
      `plugin_manifests` unterscheidet sich von den anderen vier: dort ist die Frage nicht nur
      Tenant-Trennung, sondern ob "ein Manifest anlegen" ueberhaupt eine Tenant-Admin-Operation sein
      soll oder ob es (wie ein App-Store-Katalog) eine Plattform-Operation ist, fuer die es aktuell
      keine eigene Rolle gibt — das ist eine Produktentscheidung, keine reine Migration; im Zweifel
      `blocked` mit der offenen Frage statt geraten.
      Ist der Gesamtaufwand groesser als eine Iteration (sehr wahrscheinlich, fuenf Tabellen +
      Provisioning-Design): in Teil-Units aufteilen oder mit dem Rechercheergebnis `blocked` markieren
      statt eine halbe Migration zu commiten.
    done_when:
      - alle fuenf Tabellen haben tenant_id + RLS, Unique-Constraints sind tenant-gescopt
      - Provisioning-Weg fuer neue Tenants existiert und ist getestet (kein leerer Read nach RLS)
      - bestehende Admin-Routen bleiben funktional fuer den eigenen Tenant
      - migrate up/down/up gruen
      - go build/vet/lint/test gruen
    ergebnis: >
      ERLEDIGT NUR FUER `two_factor_policy` (Migration 000273, Iteration 14) — der von den notes
      benannte "falls die Unit zerfaellt, diese zuerst"-Fall. Die uebrigen vier Tabellen stehen als
      eigene Units direkt darunter: `g-rls-presence-and-dashboard-defaults`, `g-rls-storage-quotas`,
      `g-rls-plugin-manifests`.
      Die zwei Kernfragen der Unit sind damit beantwortet und muessen nicht erneut recherchiert
      werden:
      (1) **Der Provisioning-Hook EXISTIERT** — `Service.ProvisionTenant` (auth/provisioning.go:76)
      und `PostgresRepository.ProvisionTenant` (auth/postgres_repository.go:849) legen Tenant,
      Modul-Aktivierungen und Erst-Einladung in EINER Transaktion unter `sysctx.With()` an. Das ist
      der Ort fuer Default-Zeilen. Die Sorge der notes ("falls der fehlt, ist DAS der eigentliche
      fehlende Baustein") hat sich nicht bestaetigt.
      (2) **Der Tenant muss explizit als Parameter durch Repository und Service laufen**, nicht nur
      ueber RLS. `Login` fuehrt `Check2FAEnforcement` innerhalb `sysctx.With()` aus — im
      System-Kontext laesst die Policy JEDE Zeile durch, und `QueryRow` haette die Policy eines
      beliebigen fremden Tenants geliefert. Dieselbe Frage ist fuer jede der vier Rest-Tabellen zu
      stellen: laeuft irgendein Lesepfad unter System-Kontext?
      (3) Ein Provisioning-Default war fuer `two_factor_policy` NICHT noetig (fehlende Zeile ==
      Spalten-Defaults fuer den Lesepfad, fail-open). Fuer die vier `LIMIT 1`-Leser gilt das nicht.

  - id: g-rls-presence-and-dashboard-defaults
    phase: sec
    service: db
    model: opus
    deps: [g-rls-tenant-scoped-admin-writes]
    status: todo
    scope: >
      `presence_config` (`PUT /presence/config`, `settings:write`, UPDATE ohne WHERE auf der einzigen
      Zeile) und `dashboard_defaults` (`PUT /admin/dashboard/defaults/{role}`, `UNIQUE(role)`).
      Beide bekommen `tenant_id NOT NULL` + `enable_tenant_rls()`, `dashboard_defaults` zusaetzlich
      `UNIQUE(tenant_id, role)` statt `UNIQUE(role)`. Beide lesen mit `LIMIT 1` bzw. per
      Rollen-Lookup — ohne Default-Zeile liefert der Read nach RLS `ErrNoRows` statt eines
      Fallbacks, also braucht es hier wirklich den Provisioning-Schritt.
    sources:
      - backend/internal/work/presence/postgres_config_repository.go
      - backend/internal/gateway/dashboard_repository.go
      - backend/internal/gateway/dashboard_service.go
      - backend/internal/auth/postgres_repository.go
      - backend/migrations/000273_tenant_scope_two_factor_policy.up.sql
    notes: >
      000273 ist die Vorlage: Spalte, Backfill per CROSS JOIN auf `tenants` (die alte globale Zeile
      galt fuer alle, also ist die Replikation die einzige verlustfreie Lesart), Unique-Index
      umhaengen, `enable_tenant_rls()`.
      Zwei Wege fuer den fehlenden Read, und der gewaehlte gehoert begruendet ins Journal:
      (a) Default-Zeile im Provisioning (`PostgresRepository.ProvisionTenant`, dieselbe Transaktion)
      plus Backfill fuer die 1653 bestehenden Tenants der lokalen DB, oder
      (b) der Repository-Read faellt bei `ErrNoRows` auf einen Code-Default zurueck.
      (b) ist deutlich leaner und braucht keinen Backfill ueber alle Tenants — aber nur, wenn der
      Default wirklich im Code steht und nicht bloss eine Null-Struktur ist. Vor der Entscheidung
      pruefen, was die beiden `GetConfig`/`GetDefaults`-Aufrufer mit einem leeren Ergebnis tun.
      Pflicht wie in 000273: pruefen, ob ein Lesepfad unter `sysctx.With()` laeuft — dort filtert
      RLS nicht und es braucht einen expliziten `WHERE tenant_id = $1`.
    done_when:
      - beide Tabellen haben tenant_id NOT NULL + RLS, dashboard_defaults ist auf (tenant_id, role) eindeutig
      - fehlender Read ist geloest (Provisioning-Zeile oder Code-Default), Entscheidung begruendet
      - Isolationstest je Tabelle mit eigenen Tenants, eigener Tenant > 0, fremder = 0
      - migrate up/down/up gruen
      - go build/vet/lint/test gruen

  - id: g-rls-storage-quotas
    phase: sec
    service: db
    model: sonnet
    deps: [g-rls-presence-and-dashboard-defaults]
    status: todo
    scope: >
      `storage_quotas` hat kein `tenant_id`; `IncrementUsedBytes`/`DecrementUsedBytes`
      (chat/file/postgres_repository.go:186ff) schreiben ohne WHERE auf die einzige Zeile. Jeder
      Tenant zaehlt damit gegen dasselbe globale `max_bytes`-Kontingent — der Upload eines Tenants
      verbraucht das Kontingent aller anderen. `tenant_id NOT NULL` + `enable_tenant_rls()`, beide
      Zaehler tenant-gescopt.
    sources:
      - backend/internal/chat/file/postgres_repository.go
      - backend/migrations/000273_tenant_scope_two_factor_policy.up.sql
    notes: >
      Anders als bei den vier uebrigen ist hier kein Admin-Guard das Problem, sondern ein Zaehler
      ohne WHERE — der Effekt (fremde Tenants beeinflussen die eigene Grenze) ist derselbe.
      Der Backfill kann den bestehenden `used_bytes` NICHT sinnvoll auf Tenants aufteilen: die Zahl
      ist eine Summe ueber alle. Ehrlichste Loesung ist, `used_bytes` je Tenant aus den real
      vorhandenen Dateien neu zu berechnen, statt zu raten — vorher pruefen, ob die Datei-Tabelle
      eine tenant-gescopte Groessensumme hergibt. Geht das nicht, im Journal begruenden, was
      stattdessen gewaehlt wurde.
      Ein Zaehler-Update ohne WHERE ist auch nach der Migration falsch, wenn nur die Policy filtert:
      der WHERE gehoert explizit in beide Statements.
    done_when:
      - tenant_id NOT NULL + RLS, beide Zaehler-Statements tenant-gescopt
      - used_bytes-Backfill begruendet (Neuberechnung oder dokumentierte Alternative)
      - Isolationstest mit eigenen Tenants
      - migrate up/down/up gruen
      - go build/vet/lint/test gruen

  - id: g-rls-plugin-manifests
    phase: sec
    service: plugin
    model: opus
    deps: [g-rls-storage-quotas]
    status: todo
    scope: >
      `plugin_manifests` — `POST /api/v1/plugins/manifests` (`RequireRole("admin")`, route_plugin.go:53)
      legt Manifeste ohne `tenant_id` an, `GET /manifests` liefert sie ohne Filter. Ein
      `plugin_type=config`-Manifest eines Tenants ist damit fuer alle sichtbar (WASM-Manifeste sind
      durch den `plugins.wasm`-Flag-Check gesondert blockiert, Config-Manifeste nicht).
    sources:
      - backend/internal/plugin/repository/manifest.go
      - backend/internal/gateway/route_plugin.go
      - docs/ARCHITECTURE.md
    notes: >
      DIESE UNIT IST ZUERST EINE PRODUKTFRAGE, DANN EINE MIGRATION. "Ein Manifest anlegen" kann
      zweierlei sein: eine Tenant-Operation (dann `tenant_id` + RLS wie bei den anderen) oder eine
      Plattform-Operation wie ein App-Store-Katalog (dann braucht es eine Plattform-Rolle, die es
      heute nicht gibt — `platform_admin` existiert laut Welle-1b-Recherche als Rolle fuer
      `tenants:write`, ob sie hier passt, ist zu pruefen).
      Ein dritter Weg ist plausibel und waere zu pruefen, bevor einer der ersten beiden gebaut wird:
      `tenant_id` NULLable mit NULL = "von Zentria ausgeliefertes Manifest, fuer alle sichtbar",
      genau das Policy-Paar, das `roles`/`role_permissions` seit 000256 nutzt (Lesen sieht
      `tenant_id IS NULL OR = current_tenant_id()`, Schreiben nur den eigenen Tenant). Das loest
      Katalog UND Tenant-Manifeste in einem Schema.
      Im Zweifel `blocked` mit der ausformulierten Frage statt geraten — eine falsche Antwort hier
      ist teurer als eine Iteration Wartezeit.
    done_when:
      - entweder Migration + RLS mit begruendetem Schema-Entscheid
      - oder blocked mit der ausformulierten Produktfrage
      - falls gebaut: Isolationstest, migrate up/down/up gruen, go build/vet/lint/test gruen

  - id: g-rls-regression-guard
    phase: sec
    service: db
    model: sonnet
    deps: [g-rls-plugin-manifests]
    status: todo
    scope: >
      Automatischer Test, der genau den Scan faehrt, der diesen Block ausgeloest hat: jede Tabelle
      in `public` muss entweder RLS aktiv haben oder namentlich in der Allowlist stehen. Schlaegt
      fehl, sobald eine neue Migration eine ungeschuetzte Tabelle anlegt.
    sources:
      - backend/internal/testutil/
      - docs/ARCHITECTURE.md
    notes: >
      Die Allowlist gehoert als Konstante in den Testcode (mit Kommentar-Verweis auf ADR-006),
      damit sie beim Erweitern bewusst angefasst werden muss. Partitionen (`relkind='r'` mit
      Eltern) ausnehmen — die sind ueber den Elternteil geschuetzt, sonst schlaegt der Test
      dauerhaft fuer 32 Partitionen fehl.
      `SkipIfNoDB` respektieren, aber im Fehlertext klar sagen, WELCHE Tabelle fehlt — ein
      "irgendwas ist ungeschuetzt" hilft um 03:00 niemandem.
      Das ist die Unit, die verhindert, dass Block B in drei Monaten wieder noetig wird.
    done_when:
