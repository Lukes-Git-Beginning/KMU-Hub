  - id: scan-erasure-retention-idempotency-double-run
    phase: 4
    service: security
    model: sonnet
    deps: [feat-retention-worker-handler-contacts]
    status: todo
    coverage_start: "internal/security/gdpr 61,2 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      Ein Loesch- oder Anonymisierungslauf, der zweimal hintereinander laeuft, muss beim
      zweiten Mal nichts mehr tun. Faellt der erste Lauf in der Mitte aus und wird neu
      gestartet, entscheidet genau das darueber, ob der Datenbestand konsistent bleibt. Dieser
      Scan prueft jeden Erasure-Handler und jeden Retention-Handler auf Doppellauf-Festigkeit.
    sources:
      - backend/internal/security/gdpr/erasure.go
      - backend/internal/security/gdpr/
    notes: >
      Je Handler ein Doppellauf-Test: einmal ausfuehren, Zustand festhalten, ein zweites Mal
      ausfuehren, Zustand vergleichen. Unterschiedlich heisst nicht idempotent.
      Der haeufigste Fehler ist die Anonymisierung: beim zweiten Lauf wird das bereits
      anonymisierte Label erneut anonymisiert und ergibt "anonym_anonym_..." oder es wird ein
      neuer Zaehler vergeben. Danach ausdruecklich suchen.
      Der zweite haeufige Fehler ist die Zaehlung: der Handler meldet beim zweiten Lauf erneut
      "42 Datensaetze geloescht", obwohl er nichts getan hat. Das ist eine falsche Aussage in
      einem Compliance-Protokoll.
      Diese Unit DARF Tests anlegen — sie ist der einzige Scan mit dieser Erlaubnis, weil der
