      erlaubt — Frage in `offen:`, ob `final` schon `publish` verlangt (das Desktop zeigt die Knöpfe laut
      `ReportDocumentEditor.tsx` per `useScopedCapability('berichte:reports:edit', doc.created_by)`). Guards bleiben
      additiv. Delete ist für member ohnehin zu (403).
