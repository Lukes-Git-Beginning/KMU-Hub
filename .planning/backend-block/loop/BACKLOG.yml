  - id: scan-tenant-filter-on-read-paths
    phase: 4
    service: server
    model: opus
    deps: []
    status: todo
    coverage_start: "n.a. (Scan, kein Coverage-Ziel)"
    scope: >
      Der wichtigste Scan des Laufs. Block B prueft das Tenant-Scoping modulweise; dieser
      Scan prueft es systematisch ueber alle Repositories hinweg.
      Hypothese: RLS deckt den Normalfall ab (`kmuhub_app` ist NOSUPERUSER NOBYPASSRLS,
      336 Tabellen tragen Policies), aber es gibt drei Wege daran vorbei — (1) Code, der als
      `kmuhub` laeuft (Migrationen, Wartungsjobs); (2) Abfragen, die `app.tenant_id` nicht
      gesetzt bekommen, weil der Kontext fehlt (dasselbe Loch, das
      `fix-event-payload-missing-tenant-id` in Block A auf der Event-Seite schliesst);
      (3) Speicher ausserhalb von Postgres — Redis (Presence, Rate-Limits, Cache) und
      MinIO/Objektspeicher kennen keine RLS.
      Zu tun: alle drei Wege systematisch absuchen. Fuer Redis: jeden Schluesselaufbau finden
      und pruefen, ob der Tenant darin vorkommt. Fuer den Objektspeicher: jeden Pfadaufbau
      finden und dieselbe Frage stellen. Fuer Postgres: jede Stelle finden, die eine
      Verbindung OHNE gesetzten Tenant-Kontext benutzt.
    sources:
      - backend/internal/
      - backend/internal/middleware/tenant.go
      - backend/internal/work/presence/redis_store.go
      - backend/internal/document/file/
    notes: >
      `model: opus`, weil die Frage "wo umgeht der Code RLS" nicht durch Grep zu beantworten
      ist, sondern durch das Verfolgen von Verbindungen und Kontexten.
      Ein ausbleibender Treffer ist KEIN Befund. Wer nach `SetTenantContext` grept und nichts
      findet, hat nicht bewiesen, dass es fehlt — er hat den falschen Namen gesucht. Nach
      Wortstaemmen suchen, nicht nach Importmustern.
      Zwei Nullen sind kein bestandener Smoke. Wo der Scan eine Stelle als "sicher" einordnet,
      gehoert der Grund dazu, nicht nur die Feststellung.
      Jeder Fund ausserhalb von Postgres (Redis, Objektspeicher) ist eine opus-Unit — dort
      gibt es kein Netz darunter.
    done_when:
      - >-
        Alle Redis-Schluesselaufbauten sind gefunden und daraufhin geprueft, ob der Tenant
        darin vorkommt; die Liste steht im Journal
      - >-
        Alle Objektspeicher-Pfadaufbauten sind gefunden und ebenso geprueft
      - >-
        Alle Stellen, die eine DB-Verbindung ohne gesetzten Tenant-Kontext benutzen, sind
        gefunden und je als beabsichtigt (mit Grund) oder als Befund eingeordnet
      - Fuer jeden Befund ausserhalb von Postgres ist eine opus-Unit angelegt
      - >-
        Die offen:-Zeile nennt, was tief geprueft, was nur gegrept und was gar nicht angesehen
        wurde
      - Kein Verhalten geaendert

