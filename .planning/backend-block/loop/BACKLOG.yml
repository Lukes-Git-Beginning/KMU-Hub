  - id: fix-email-send-missing-tenant-id
    phase: 3
    service: email
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (internal/email/send ist kein Tracked-Coverage-Paket)"
    scope: >
      `send.Service.Send` und `send.Service.SaveDraft` (internal/email/send/service.go, im
      Send-Fall um Zeile 203-215, im SaveDraft-Fall um Zeile 305-318) konstruieren das
      gespeicherte `models.EmailMessage` OHNE `TenantID` zu setzen, obwohl
      `SendInput.TenantID`/`DraftInput.TenantID` beide vorhanden sind und an keiner Stelle
      verwendet werden. `message.PostgresRepository.Create`
      (internal/email/message/postgres_repository.go:41) schreibt `msg.TenantID` direkt in die
      INSERT-Query. Jede gesendete oder als Entwurf gespeicherte E-Mail landet damit mit
      `tenant_id = 00000000-0000-0000-0000-000000000000` in der DB statt mit dem echten Tenant.
    sources:
      - backend/internal/email/send/service.go
      - backend/internal/email/message/postgres_repository.go
      - backend/internal/server/email_grpc_messages_send_test.go
    notes: >
      Gefunden beim Bau der Coverage-Unit b-cov-server-email-messages-send-attachments
      (Lauf 8, Iteration 21) — TestSendEmail dort speichert bewusst NICHT gegen die
      tenant-gescopte GetByID, weil genau das an dieser Lücke scheitern würde.
      Bei scharfer RLS (`COSMI_ENV=production`, produktiv seit 2026-06-05) prüft die
      INSERT-Policy vermutlich `tenant_id = current_setting(...)`WITH CHECK` — dann schlägt
      das Senden schlicht fehl. Ist die Policy lockerer, landet die Mail unter dem
      Nulltenant und ist für den Absender über keinen tenant-gescopten Read mehr erreichbar
      (Phantom-Verlust der eigenen gesendeten Mail).
      Root-Cause-Regel: EIN Fix an der gemeinsamen Stelle in `Send`/`SaveDraft`, nicht an
      jedem Aufrufer im Gateway.
    done_when:
      - Send und SaveDraft setzen TenantID auf dem konstruierten models.EmailMessage aus
        input.TenantID, bevor messageCreator.Create aufgerufen wird
      - Ein Test beweist, dass eine gesendete/entworfene Nachricht über einen
        tenant-gescopten GetByID mit dem Tenant des Senders auffindbar ist
      - RLS-Smoke erneut geprüft, falls INSERT-Policy betroffen ist
      - go test -count=1 ./internal/email/... ./internal/server/ grün

