    scope: >
      MUSTER D — dieselbe Bugklasse, drei Fundstellen in derselben Datei.
      `guest.PostgresRepository.GetSessionByTokenHash`,
      `.GetSessionByID` und `.ListSessionsByChannel`
      (backend/internal/chat/guest/postgres_repository.go, Zeilen ~44/67/87) selektieren
      `ip_address` (Spaltentyp INET, nullable, Migration
