      - backend/internal/chat/guest/postgres_repository_reads_test.go
    notes: >
      Sauberster Fix: alle drei SELECT-Listen von `ip_address` auf
      `CASE WHEN ip_address IS NOT NULL THEN host(ip_address) ELSE NULL END` umstellen -- exakt
      das Muster, das `internal/security/gdpr/export.go:172` fuer dieselbe Spaltenkombination
