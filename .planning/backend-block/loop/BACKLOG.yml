  - id: fix-berichte-definition-module-allowlist-vs-builder-sources
    phase: 4
    service: berichte
    model: opus
    deps: []
    status: done
    target: 'berichte: der Report Builder kann Berichte aller elf Quellen speichern'
    coverage_start: n.a.
    scope: >
      VERIFIZIERT im E2E `TestBerichteMemberFlow` (Iteration 41, Subtest „member creates a definition with the desktop
      body"): `POST /berichte/definitions` antwortet 400 `berichte module is invalid` für jedes Modul außer
      finanzen|crm|helpdesk|inventar|produktion|cross. Der Report Builder speichert aber das Modul seiner QUELLE
      (`ReportBuilderShell.tsx:146` `module: source.module`; Quellen in `modules/berichte/report-sources/`: work, hr,
      rapporte, fuhrpark, einkauf, vertraege, kommunikation, zeiterfassung, dazu crm/finanzen/helpdesk). „Bericht
      speichern" scheitert damit für acht von elf Quellen und für JEDEN Nutzer, auch admin. Ursache an drei Stellen:
      `validModules` in `internal/berichte/service.go:93`, die DB-Constraints `report_definitions_module_check`
      (000079) und `report_documents_module_check` (000245) und die `oneof=` der Gateway-Requests
      (`createReportDocumentRequest`/`updateReportDocumentRequest` in route_berichte.go). Fix: neue Migration (forward-only,
      Constraint droppen und mit der erweiterten Liste neu anlegen; Nummer zur Laufzeit), `validModules`, die beiden
      `oneof`-Listen und die OpenAPI-Enums nachziehen; `kpiModuleVisibility` NICHT erweitern (KPIs bleiben auf die sechs
      Executor-Module beschränkt). Erst die Liste des Desktops (`ReportModule` in `berichte-types.ts`, Quellen-Registry)
      gegen den Code lesen und genau diese Werte aufnehmen. Ein gespeicherter Builder-Bericht trägt `query_config.kind =
      builder`, den der Server-Executor nicht kennt (`runKind` → `ErrInvalidQueryConfig`): prüfen, was `POST
      /definitions/{id}/run` darauf antwortet (muss 4xx mit Meldung sein, kein 500), und das Ergebnis im Test festhalten.
    sources:
      - backend/internal/berichte/service.go
      - backend/internal/gateway/route_berichte.go
      - backend/migrations/000079_create_berichte.up.sql
      - backend/migrations/000245_create_report_documents.up.sql
      - desktop/src/renderer/src/api/berichte-types.ts
      - desktop/src/renderer/src/modules/berichte/components/builder/ReportBuilderShell.tsx
      - backend/test/e2e/berichte_test.go
    done_when:
      - 'Service-Test: jedes Modul der Desktop-Liste wird angelegt, ein unbekanntes (`bogus`) bleibt 400; Migration auf der lokalen DB angewandt, `.down.sql` gefüllt'
      - >
        `bash .planning/backend-block/loop/hooks/e2e-local.sh 'TestBerichteMemberFlow'` grün, die Schleife über die acht Module im
        Subtest „member creates a definition" von 400 auf 201 umgestellt
      - 'desktop-aufrufer: ReportBuilderShell.tsx / MyReportsLibrary.tsx / ChartBlockPicker.tsx gegen die neue Form geprüft; `swagger-cli validate` grün'

