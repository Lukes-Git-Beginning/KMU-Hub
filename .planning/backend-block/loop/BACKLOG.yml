  - id: fe-finance-bank-transactions-matching
    phase: 3
    service: finance
    model: opus
    deps: [fe-finance-bank-accounts]
    status: done
    scope: >
      Banktransaktionen und Zuordnung: `GET /api/v1/finance/bank-transactions`,
      `POST /finance/bank-transactions/{id}/match`, `.../reject-match`.
    sources:
      - desktop/src/renderer/src/mocks/handlers/finance.ts
    notes: >
      Die Zuordnung verknuepft eine Transaktion mit einer Rechnung. Idempotent halten: dieselbe
      Transaktion darf nicht zweimal derselben Rechnung zugeordnet werden, und eine bereits
      zugeordnete Transaktion muss erst geloest werden (409 statt stiller Zweitzuordnung).
      Die Zuordnung veraendert den Zahlungsstatus einer Rechnung — beides in EINER Transaktion
      schreiben, sonst driftet der Rechnungsstatus bei einem Fehler in der Mitte.
      Bestehende Zahlungs-/Rechnungslogik im finance-Service wiederverwenden, keine zweite
      Statusmaschine danebenbauen.

      SCOPE-KORREKTUR (Fund aus `fe-finance-bank-accounts`, 2026-08-01): **Das meiste existiert
      schon.** Migration 000247 hat `finance_bank_transactions` inkl. RLS, `internal/biz/banking`
      hat Import + Matcher + `ReconcileTransaction`/`IgnoreTransaction`, und im Gateway sind
      `GET /api/v1/finance/bank-transactions`, `POST .../{id}/reconcile` und `POST .../{id}/ignore`
      bereits registriert (`route_biz.go`, Guards `finance:read`/`finance:write`). Diese Unit ist
      deshalb **KEINE neue Migration und kein neuer Service** — sie ist:
      (a) die zwei Routennamen, die das FE wirklich ruft (`financeBankingApi.matchTransaction` ->
          `POST .../{id}/match` mit optionalem `{invoice_number}`, `rejectMatch` ->
          `POST .../{id}/reject-match`) auf die vorhandenen RPCs legen — oder begruenden, warum
          stattdessen das FE auf `reconcile`/`ignore` gezogen wird. Nicht beide Namenspaare
          nebeneinander stehen lassen.
      (b) die Wire-Shape: der FE-Typ `BankTransaction` (`types/finance-types.ts:397`) ist flach und
          camelCase (`matchStatus`, `matchedInvoice`, `counterpart`, `type: 'credit'|'debit'`,
          `amount` als Zahl), das Repo-Modell dagegen signed `amount` + `counterparty_name` +
          `matched_invoice_id`. Muster: `bankAccountWire`/`toBankAccountWire` in
          `route_biz_bank_accounts.go` plus Test. Antwortform `{transactions: [...]}` (nicht
          `{items,total}`), Einzelentitaet `{transaction}`.
      (c) `matchedInvoice` ist die Rechnungs**nummer**, nicht die ID — der Join gehoert ins Repo,
          nicht in einen zweiten Roundtrip im Handler.
      Die Doppelzuordnung ist bereits abgedeckt (`ErrAlreadyReconciled` -> FailedPrecondition ->
      409). Atomizitaet der Zahlungsbuchung laeuft schon ueber `payment.Service`.

      ERGEBNIS (2026-08-01, Iteration 26): Routen auf die FE-Namen gezogen, Detail im Journal.
      Kurzfassung fuer Folge-Units in Block D:
      (a) `reconcile` ist WEG (umbenannt zu `match`), `ignore` BLEIBT: `reject-match` und `ignore`
          sind zwei verschiedene Entscheidungen ("nicht diese Rechnung" vs. "gar keine
          Kundenzahlung"), kein Namenspaar. `RejectMatch` war im Service nicht vorhanden und ist
          neu — der Bestand konnte einen Vorschlag nur buchen oder aus der Queue nehmen.
      (b) `?status=` ersetzt `?match_status=`. Ohne Angabe (und bei `all`) liefert die Liste die
          QUEUE, also ohne `ignored` — der FE-Typ `BankMatchStatus` kennt den Wert nicht, ein
          durchgereichtes `ignored` liefe im DetailPanel in `t(undefined)`. Dafuer gibt es
          `BankTransactionFilter.ExcludeMatchStatus` + Proto-Feld `exclude_match_status`.
      (c) `matchedInvoice` kommt aus einem LEFT JOIN auf `finance_invoices` im Repo
          (`transactionColumns`/`transactionFrom` sind jetzt auf `t` aliasiert — wer dort eine
          Bedingung ergaenzt, muss praefixen). `Reconcile` liest nach dem Update einmal nach, sonst
          traegt die Antwort nach einem Override die Nummer der ERSETZTEN Rechnung.
      (d) Zwei Wire-Schemas fuer dieselbe Tabelle sind Absicht: `BankTransaction` (proto,
          snake_case) fuer die Statement-Routen, `BankTransactionQueueEntry` (flach, camelCase)
          fuer die Queue. Die Statement-Routen haben keinen FE-Konsumenten mit anderem Vertrag.
    done_when:
      - Zuordnen und Loesen funktionieren, Doppelzuordnung 409
      - Rechnungsstatus und Zuordnung atomar
      - Wire-Shape gegen den FE-Typ geprueft (Test darauf)
      - openapi.yaml im selben Commit

