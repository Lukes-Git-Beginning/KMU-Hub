  - id: p3-route-path-drift-triage
    phase: 3
    service: querschnitt
    model: sonnet
    deps: []
    status: done   # Iteration 24 — 128 Rohtreffer triagiert, drei tote Verdrahtungen gefunden
    scope: >
      Ein Abgleich aller `/api/v1/*`-Literale in desktop/src/renderer (ohne
      mocks/) gegen die Pfade in backend/api/openapi.yaml ergibt 145 Treffer,
      die serverseitig keine Entsprechung haben. Der Rohbefund ist NICHT die
      Befundliste — er enthaelt viel Rauschen: BASE-Prefix-Konstanten
      (`/api/v1/finance`, `/api/v1/berichte`), abgeschnittene Template-Literale
      (`/api/v1/email/messages/${qs`), Testfixtures (`/api/v1/contacts/ct-001`).
      Erster Schritt ist Triage: Rauschen aussortieren, den Rest in
      "Tippfehler im FE-Pfad" und "Route fehlt serverseitig komplett" trennen.
      Nur die zweite Gruppe ist Backend-Arbeit und gehoert dann als je eigene
      Unit in dieses Backlog.
    sources:
      - backend/api/openapi.yaml
      - desktop/src/renderer/src/api/
    notes: >
      Aufgefallen Iteration 23 (Queue war leer, darum ein Suchlauf statt einer
      Unit). Ein belegter Einzelfall aus der ersten Gruppe: finance-client.ts
      ruft `POST /api/v1/finance/invoices/{id}/mark-paid`, die Route heisst
      `/pay` (route_biz.go:82, so auch in openapi.yaml) — "Als bezahlt
      markieren" ist gegen echtes BE ein 404. Der Backend-Pfad passt zum Stil
      der Nachbarn (`/send`, `/cancel`), der schlanke Fix ist die FE-Zeile.
      Ganze Bereiche der zweiten Gruppe: admin/roles, admin/users,
      customization/fields, email/rules, email/labels, caldav — vor dem Bauen
      pruefen, ob das ueberhaupt gewollter Scope ist oder totes FE.
      TestOpenAPIRouteDrift garantiert, dass openapi.yaml die Gateway-Routen
      vollstaendig spiegelt; die Spec ist als Referenz also belastbar.
    done_when:
      - Rauschen aussortiert, Restliste nach Ursache getrennt
      - Fehlende Backend-Routen als je eigene Unit im Backlog
      - Reine FE-Pfad-Tippfehler als Liste im Journal (FE ist nicht Loop-Scope)
    result: >
      Iteration 24. Referenz war nicht openapi.yaml, sondern die tatsaechlich
      registrierten Routen (Router aus dem Drift-Test gebaut und gewalkt, 678
      Pfade) — TestOpenAPIRouteDrift prueft nur "registriert ⊆ dokumentiert",
      die Spec darf also Routen beschreiben, die es nicht gibt. Genau das war
      der Hauptbefund. Rauschen: 6 Testfixtures, 18 Prosa/Glob aus
      Doc-Kommentaren, 15 BASE-Prefix-Konstanten, 36 Pfade aus der generierten
      api/types.ts (kein Call), 8 CalDAV (via cmd/gateway/setup.go registriert,
      nur im Test-Router nicht sichtbar), 6 plugins.api (Flag OFF), /api/v1/ws.
      Uebrig drei echte Ursachen -> drei Verdrahtungs-Units unten, eine
      HR-Route-Unit, eine Scope-Frage an Luke. FE-Tippfehler-Liste im Journal.

