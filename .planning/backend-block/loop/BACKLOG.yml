units:

# ==========================================================================================
# BLOCK A — Fix- und Feature-Units (9)
#
# Sechs verifizierte Bugs plus zwei Feature-Units aus der Entscheidungsrunde vom 2026-08-10.
# Fünf der Bugs hat Lauf 7 selbst gefunden und im Journal notiert, aber bewusst nicht
# gefixt (Coverage-Units bauen keine Verhaltensänderungen); sie sind nie eine Unit geworden
# und wären sonst verlorengegangen. Alle sechs wurden am 2026-08-10 gegen den heutigen Code
# nachgeprüft — die Fundstellen unten sind belegt, nicht übernommen.
#
# Das Muster aus Lauf 7 gilt weiter: eine Fix-Unit ändert Verhalten UND stellt den
# dokumentierenden Test auf das korrekte Verhalten um. Test löschen ist keine Option.
# ==========================================================================================

  - id: fix-work-tasks-listtasks-no-own-scope
    phase: 3
    service: gateway
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/gateway 34,9 %"
    scope: >
      `HandleListTasks` (internal/gateway/route_work_tasks.go:127) ruft `ownerFilterForScope`
      an keiner Stelle auf. Der Guard der Route ist
      `taskRead = middleware.RequirePermissionAny([2]string{"tasks","read"},
      [2]string{"work:task","read"})` (route_work.go:115, registriert :128). Hat eine Rolle
      eine dieser beiden Berechtigungen auf Scope `own`, sieht der Aufrufer trotzdem ALLE
      Tasks des Tenants — die Einschränkung ist dann eine Anzeige, keine Grenze. Der Doc-
      Kommentar von `ownerFilterForScope` (helpers.go:123-142) sagt genau das: "Assigning the
      result unconditionally is the point: at scope 'own' it must override whatever owner
      filter the client asked for, or the narrowing is a suggestion rather than a boundary."
      Fünf andere Handler machen es richtig (route_rapporte.go:218 und :794,
      route_schichten.go:842, route_helpdesk.go:416, route_biz_expenses.go:127).
    sources:
      - backend/internal/gateway/route_work_tasks.go
      - backend/internal/gateway/route_work.go
      - backend/internal/gateway/helpers.go
      - backend/internal/gateway/own_scope_filter_test.go
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
    notes: >
      ZWEI Dinge vorab prüfen, sonst wird der Fix halb:
      (1) Der Guard ist `RequirePermissionAny` über ZWEI Schlüssel, `ownerFilterForScope`
          nimmt aber nur EINEN `resource, action`. Beide Schlüssel müssen berücksichtigt
          werden — die engere der beiden Zuweisungen gewinnt. Prüf, was
          `middleware.PermissionScope` für einen nicht vergebenen Schlüssel liefert, bevor
          du zwei Aufrufe verodest.
      (2) Der Bug ist heute LATENT, nicht aktiv: im Default-Preset (Migration 000256) haben
          member/manager/hr_admin/extern `work:task:read` auf Scope `all`; auf `own` steht
          dort nur `work:task:edit` (Z. 465). Ein Tenant kann die Rolle aber über die
          RBAC-Rollen-CRUD aus Lauf 4 auf `own` stellen — dann greift die Lücke sofort.
          Das gehört in den Test-Kommentar, damit später niemand den Test für
          übervorsichtig hält und wieder entfernt.
      Der Filter gehört in `grpcReq.AssigneeId` (das Feld existiert bereits, route_work_
      tasks.go setzt es aus `?assignee_id=`) und muss den Client-Wunsch ÜBERSCHREIBEN, nicht
      ergänzen. Nie als Nachfilter über die Antwort — sonst beschreiben `total` und die
      Seitengrenzen Zeilen, die der Aufrufer nicht sehen darf.
    done_when:
      - Aufrufer mit Scope `own` auf tasks:read bzw. work:task:read bekommt nur Tasks, die
        ihm zugewiesen sind — auch wenn er ein fremdes `?assignee_id=` mitschickt
      - Aufrufer mit Scope `all` sieht unverändert alles, `?assignee_id=` wirkt wie bisher
      - Fehlende User-ID im Token bei Scope `own` liefert 401, nicht die volle Liste
      - Test deckt beide Permission-Schlüssel des RequirePermissionAny ab
      - Mutations-Probe durchgeführt und im Journal belegt
      - go test -count=1 ./internal/gateway/ grün

  - id: fix-crm-reports-invalid-date-not-rejected
    phase: 3
    service: gateway
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/gateway 34,9 %"
    scope: >
      `HandleGetPipelineReport` (:505), `HandleGetConversionReport` (:538) und
      `HandleGetActivityReport` (:565) in internal/gateway/route_crm_activities.go prüfen
      `start_date`/`end_date` nur auf Nicht-Leerheit (`:517`, `:549`, `:577` liefern
      "start_date and end_date are required"). Ein syntaktisch unbrauchbares Datum wie
      `?start_date=gestern` fällt durch und erreicht ungeprüft die RPC. Lauf 7 hat den Fall
      in Iteration 7 gefunden: das `done_when` der damaligen Coverage-Unit unterstellte eine
      400-Antwort, die es nicht gibt.
    sources:
      - backend/internal/gateway/route_crm_activities.go
      - backend/internal/gateway/helpers.go
      - backend/internal/gateway/testutil_test.go
    notes: >
      Root-Cause-Regel: drei Handler mit demselben Muster gehören an EINE gemeinsame Stelle,
      nicht dreimal derselbe Guard. Prüf zuerst, ob `helpers.go` bereits einen Datums-Parser
      hat (dort liegen `validateUUIDParam` und `parsePagination`), und leg nur dann einen
      neuen an. Erwartetes Format aus den bestehenden Aufrufern ableiten, nicht raten — und
      im Fehlerfall den erwarteten Aufbau in die Meldung schreiben, damit ein FE-Entwickler
      nicht raten muss. Danach greppen, ob weitere Handler dasselbe Paar ungeprüft
      durchreichen; die gehören in denselben Commit.
    done_when:
      - Ungültiges start_date oder end_date liefert 400 mit einer Meldung, die das erwartete
        Format nennt — statt die RPC zu erreichen
      - Gültige Datumsangaben funktionieren unverändert, leere weiterhin 400
      - Die Prüfung steht an einer gemeinsamen Stelle, nicht dreimal kopiert
      - Weitere Handler mit demselben ungeprüften Paar gesucht und im Journal genannt
      - Mutations-Probe durchgeführt und im Journal belegt
      - go test -count=1 ./internal/gateway/ grün

  - id: fix-einkauf-contract-call-cap
    phase: 3
    service: einkauf
    model: opus
    deps: []
    status: done
    coverage_start: "internal/einkauf 63,3 %"
    scope: >
      `Service.CreateContractCall` (internal/einkauf/service_extended.go:611-614) validiert
      nur, dass der Abrufbetrag nicht-negativ ist (`err != nil || v < 0`). Der Rahmenvertrag
      wird bei :618-620 ausschließlich geladen, um seine Existenz zu prüfen — `TotalValue`
      und `UsedValue` werden nicht verwendet. Auch der Gateway-Handler validiert nur
      `decimal_gte0` (route_einkauf_extended.go:140-145), und Migration 000207 kennt keinen
      Betrags-CHECK, nur `status IN ('draft','active','expired')` (Z. 17). Ein Rahmenvertrag
      über 5.000 EUR ist damit beliebig oft und beliebig hoch abrufbar, und der Status wird
      beim Abruf gar nicht geprüft.
    sources:
      - backend/internal/einkauf/service_extended.go
      - backend/internal/einkauf/postgres_repository_extended.go
      - backend/internal/einkauf/models_extended.go
      - backend/internal/gateway/route_einkauf_extended.go
      - backend/internal/einkauf/service_extended_test.go
      - backend/internal/einkauf/tenant_write_test.go
    notes: >
      ENTSCHIEDEN von Luke am 2026-08-10, strikte Variante: Abruf nur bei `status = active`;
      ein Betrag über `total_value - used_value` wird abgelehnt; `draft` und `expired`
      liefern FailedPrecondition.
      KRITISCH — gegen die gespeicherte `used_value`-Spalte zu prüfen reicht NICHT.
      `UpdateContractUsedValue` (postgres_repository_extended.go:403-411) rechnet
      `COALESCE(SUM(amount),0)` erst NACH dem Insert neu, und der Aufruf ist in
      service_extended.go:648-655 ausdrücklich als non-fatal behandelt: schlägt er fehl,
      driftet die Spalte nach unten und die Schranke geht stillschweigend auf. Prüfung und
      Insert müssen deshalb in EINER Transaktion gegen ein frisch gelesenes `SUM(amount)`
      laufen. Ob der non-fatale Update danach noch non-fatal bleiben darf, gehört mit
      entschieden und im Journal begründet.
      Der Fehlerfall trägt den Restwert in der Meldung — sonst kann der Einkäufer nicht
      sehen, welcher Betrag noch ginge.
      Bestehender Test `TestExtended_CreateContractCall_UpdatesUsedValue`
      (service_extended_test.go:535-562) prüft nur, dass `used_value` danach ungleich "0"
      ist; er bleibt gültig und wird ergänzt, nicht ersetzt.
    done_when:
      - Abruf über `total_value - used_value` hinaus wird abgelehnt statt angenommen, mit
        dem Restwert in der Fehlermeldung
      - Abruf auf einem Vertrag mit status draft oder expired liefert FailedPrecondition
      - Prüfung und Insert laufen in einer Transaktion gegen ein frisch gelesenes SUM(amount),
        nicht gegen die gespeicherte used_value-Spalte
      - Ein Abruf exakt in Höhe des Restwerts wird noch angenommen (Grenzfall getestet)
      - Gateway bildet den neuen Fehler auf einen sinnvollen HTTP-Status ab, in openapi.yaml
        dokumentiert falls dort noch nicht vorhanden
      - Mutations-Probe durchgeführt und im Journal belegt
      - go test -count=1 ./internal/einkauf/... ./internal/gateway/ grün

  - id: fix-plugin-createmanifest-missing-tenant-wrong-code
    phase: 3
    service: server
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/server 47,7 %"
    scope: >
      `CreateManifest` (internal/server/plugin_grpc.go) liefert bei fehlendem Tenant-Kontext
      `codes.Internal`, während jeder andere tenant-lose Request derselben Testdatei
      `codes.InvalidArgument` bekommt. Ursache laut Journal (Lauf 7, Iteration 33): der
      Middleware-Sentinel für den fehlenden Tenant ist kein `plugin.Err*`-Typ und wird
      deshalb von der `errors.Is`-Korrektur aus derselben Iteration nicht erfasst.
    sources:
      - backend/internal/server/plugin_grpc.go
      - backend/internal/server/plugin_grpc_test.go
      - backend/internal/middleware
    notes: >
      VERIFY-FIRST: der Befund stammt aus dem Lauf-7-Journal (Z. 2249-2268) und ist gegen den
      heutigen Code nur teilweise nachgeprüft. Reproduzier ihn zuerst mit einem Test, bevor
      du etwas änderst — wenn er nicht reproduzierbar ist, ist die Unit erledigt und das
      gehört so ins Journal.
      Root-Cause-Regel: greppen, welche anderen RPCs denselben Sentinel durchreichen. Der Fix
      gehört an die gemeinsame Fehlerabbildung, nicht als Guard in CreateManifest.
      `codes.Internal` für einen Aufruferfehler ist nicht kosmetisch: das Gateway bildet ihn
      auf 500 ab, der Client sieht einen Serverfehler statt seines eigenen.
    done_when:
      - CreateManifest ohne Tenant-Kontext liefert InvalidArgument statt Internal
