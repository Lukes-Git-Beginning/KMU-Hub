    sources:
      - backend/api/openapi.yaml
      - backend/cmd/gateway/main.go
      - backend/internal/middleware/idempotency.go
      - backend/internal/gateway/openapi_drift_test.go
    notes: >
      GLEICHE MECHANIK WIE DIE FINANCE- UND WIKI-TEIL-UNITS, NICHT NEU ERFINDEN: pro Operation
      der gewaehlten Registrar-Gruppe (nur POST/PUT/PATCH/DELETE, GET nie) pruefen, ob bereits
      ein `"409":` existiert. Existiert keins: eine Zeile
      `"409": { $ref: "#/components/responses/IdempotencyInFlight" }` ans Ende des
      `responses:`-Blocks anhaengen. Existiert eins fuer einen anderen Grund (Geschaeftszustand):
      NICHT ueberschreiben, sondern die Beschreibung um einen zweiten Satz zur In-Flight-
      Bedeutung erweitern und einen `headers.Retry-After` ergaenzen, der vermerkt, dass er fuer
      den urspruenglichen Konfliktfall nicht gesetzt ist (Vorlage: `git show f6d4a3ad` oder
      `git show <sha-dieser-wiki-unit>` -- `git log --oneline --grep=idempotency -i`).
      Um die Operationen einer Gruppe zu finden: im passenden `route_*.go` nach
      `.Post(`/`.Put(`/`.Patch(`/`.Delete(` greppen (Achtung, Registrierung laeuft ueber
      `r.With(guard).Post(...)`, ein reiner `r\.Post\(` -Grep uebersieht die meisten Treffer),
      dann die vollen `/api/v1/...`-Pfade im `RegisterRoutes`-Codeblock nachvollziehen und im
      YAML suchen. Routen ausserhalb des per `r.Use(authMiddleware)` geschuetzten `r.Route(...)`-
      Blocks (z. B. `/api/v1/public/*`-Redemption-Endpunkte) NICHT anfassen — sie laufen nicht
      durch die Idempotency-Middleware.
      NICHT den ganzen Rest in einem Commit — wieder je Registrar-Gruppe schneiden (oder wenige
      benachbarte kleine Gruppen zusammen, wenn eine Gruppe sehr wenige Operationen hat), jede
      Iteration eine neue Teil-Unit ans Backlog-Ende haengen fuer das, was noch offen bleibt, bis
      die Liste oben leer ist. Ausschlussliste (nicht durch die Middleware geschuetzt)
      unveraendert: `/api/v1/public/*`, `/api/v1/guest/*`, `/api/v1/caldav/*`,
      `/api/v1/admin/caldav/*` (eigene nackte `authMiddleware` in `route_caldav.go:146,161`),
      WOPI/CalDAV/CardDAV-Protokollrouten, `/reset-password`, sowie Pfade mit `/auth/login`,
      `/auth/refresh`, `/auth/2fa` als Teilstring (`idempotencyWhitelist` in `idempotency.go:36`).
      Nach jedem Lauf: `git diff --stat` pruefen, dass nur der bearbeitete Pfad-Bereich waechst,
      `npx swagger-cli validate backend/api/openapi.yaml` UND
      `go test ./internal/gateway/ -run TestOpenAPIRouteDrift`.
    done_when:
      - Mindestens eine weitere Registrar-Gruppe aus der obigen Liste ist vollstaendig auf 409
        umgestellt, mit demselben Beleg wie die Finance- und Wiki-Teil-Units
      - Bestehende 409-Eintraege mit anderer Bedeutung sind nicht kommentarlos ueberschrieben
      - Was noch offen bleibt, steht als neue Teil-Unit mit aktualisierter Liste am Backlog-Ende
      - swagger-cli validate gruen
      - go test -count=1 ./internal/gateway/ -run TestOpenAPIRouteDrift gruen

  - id: test-openapi-documented-status-codes-vs-handlers
    phase: 4
    service: gateway
    model: opus
    deps: []
    status: done
    coverage_start: "internal/gateway 56,6 % (gemessen Iteration 89)"
    scope: >
      Belegter Befund aus der Mutations-Probe in Iteration 89: es gibt im Repo KEINEN
      Test, der die in `api/openapi.yaml` dokumentierten Response-Codes gegen die vom
      Handler real geschriebenen abgleicht. `TestOpenAPIRouteDrift` vergleicht
      ausschliesslich registrierte Pfade gegen Spec-Pfade, keine Status-Codes;
      `swagger-cli validate` prueft rein strukturell und ist fuer einen FEHLENDEN Code
      blind. Folge: die Luecke wird immer nur dort gefunden, wo gerade jemand von Hand
      liest — allein dieser Lauf hat daraus vier Fix-Units erzeugt (Iteration 76, 78, 87,
      89), und jede deckte nur die Routen ab, die in ihrem Scope standen. Der Rest der
      838 Pfade ist ungeprueft.
      Umfang: ein Test in `internal/gateway`, der die literalen Status-Codes aus den
      Handler-Quelldateien (`response.Error(w, http.StatusX, ...)`,
      `response.JSON(w, http.StatusX, ...)`, `response.Proto(w, http.StatusX, ...)`)
      der jeweils registrierten Route zuordnet und gegen den `responses:`-Block des
      passenden Spec-Pfads haelt. KEIN neuer Endpunkt, keine Verhaltensaenderung.
    sources:
      - backend/internal/gateway/openapi_drift_test.go
      - backend/internal/gateway/route_biz_billing.go
      - backend/internal/gateway/helpers.go
      - backend/api/openapi.yaml
    notes: >
      `openapi_drift_test.go` hat die halbe Mechanik schon: es baut den Chi-Router und
      laeuft ihn ab. Wiederverwenden, nicht neu bauen (lean).
      Die harte Stelle ist NICHT das Parsen, sondern die indirekten Schreiber: die
      meisten 400er kommen gar nicht literal im Handler vor, sondern aus Helfern —
      `validateUUIDParam` (helpers.go:120, 400), `decodeAndValidate` (helpers.go:225,
      400), `validateDateParam` (400), `respondServiceUnavailable` (503),
      `respondGRPCError` (variabel, aus dem gRPC-Code gemappt), `getTenantID`-Fehler
      (401). Ein reiner AST-Scan auf `http.Status*` im Handler-Body findet die nicht und
      wuerde massenhaft falsche "undokumentiert"-Treffer und falsche "unerreichbar
      dokumentiert"-Treffer liefern. Also erst die Helfer-Tabelle Helper -> Codes
      aufbauen und den Aufruf des Helfers im Handler als Beleg fuer dessen Codes zaehlen.
      `respondGRPCError` ist NICHT statisch aufloesbar (Code haengt am gRPC-Status des
      Service). Diese Codes (404/409/422/500) duerfen NICHT als "undokumentiert"
      gemeldet werden — sonst rauscht der Test und wird abgeschaltet.
      DESHALB: der Test faengt in eine ALLOWLIST-Form. Erst die heutige Ist-Menge der
      Abweichungen als akzeptierte Baseline im Test festschreiben (mit Kommentar, dass
      jeder Eintrag eine offene Doku-Luecke ist), dann faellt jede NEUE Abweichung sofort
      auf. Ohne diese Baseline ist der Test am Tag eins rot und damit wertlos.
      Beim Bauen die Baseline-Liste ins Journal schreiben — sie ist die Arbeitsliste fuer
      alle weiteren Spec-Fix-Units und ersetzt das bisherige Von-Hand-Suchen.
      Beachten: `respondServiceUnavailable` ist im Repo als "Finance service unavailable"
      o.ae. dokumentiert, der Code ist immer 503 — statisch also gut aufloesbar.
    done_when:
      - Ein Test in internal/gateway vergleicht pro registrierter Route die statisch
        aufloesbaren geschriebenen Status-Codes gegen den responses:-Block der Spec
      - Helfer-vermittelte Codes (validateUUIDParam, decodeAndValidate, validateDateParam,
        respondServiceUnavailable, getTenantID) werden korrekt zugerechnet, nicht
        uebersehen
      - respondGRPCError-Codes erzeugen keine Falschmeldung
      - Die heutige Abweichungsmenge liegt als kommentierte Baseline im Test und steht
        vollstaendig im Journal
      - "Ein Gegenbeweis ist gefahren: ein dokumentierter Code wird testweise aus
        openapi.yaml entfernt, der Test wird rot, Aenderung zurueckgedreht"
      - go test -count=1 ./internal/gateway/ gruen

