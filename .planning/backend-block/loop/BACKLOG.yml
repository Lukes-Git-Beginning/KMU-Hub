  - id: fix-idempotency-real-sql-coverage-core
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/idempotency (Paketwert im CI-Log nachschlagen, Run 32508843776)"
    scope: >
      `internal/idempotency` traegt die Doppelausfuehrungssperre fuer alle POST-Routen mit
      Idempotency-Key — Dialer-Outcomes, Finance-Buchungen, Webhooks. `Reserve`
      (postgres_repository.go:79), `Complete` (159) und `Get` sind der Kern. Was hier
      danebengeht, erzeugt doppelte Buchungen, und zwar lautlos.
    sources:
      - backend/internal/idempotency/postgres_repository.go
      - backend/internal/idempotency/repository_test.go
      - backend/internal/idempotency/rls_test.go
    notes: >
      GEGEN ECHTES SQL, nicht gegen ein Mock. Der Wert dieser Mechanik liegt genau in dem, was
      die Datenbank tut: Eindeutigkeitsverletzung bei gleichzeitiger Reservierung desselben
      Schluessels. Ein Mock beantwortet die Frage nicht, die zaehlt.
      Der eigentliche Test: zwei Reservierungen desselben Schluessels, eine gewinnt, die andere
      bekommt den bereits gespeicherten Zustand statt eines Fehlers.
      Abgelaufene Reservierungen und der Fall "reserviert, aber nie abgeschlossen" (Prozess
      gestorben) gehoeren dazu — sonst blockiert ein Absturz den Schluessel fuer immer.
    done_when:
      - Reserve, Get und Complete sind gegen echtes SQL getestet, DATABASE_URL Pflicht
      - Gleichzeitige Reservierung desselben Schluessels ist als Fall abgedeckt
      - Reserviert-aber-nie-abgeschlossen ist abgedeckt
      - go test -count=1 ./internal/idempotency/... gruen

  - id: fix-idempotency-real-sql-coverage-cleanup-concurrency
    phase: 4
    service: gateway
    model: sonnet
    deps: [fix-idempotency-real-sql-coverage-core]
    status: done
    coverage_start: "internal/idempotency (Paketwert im CI-Log nachschlagen, Run 32508843776)"
    scope: >
      Zweite Haelfte: `Cleanup` (postgres_repository.go:179) und `CleanupWithLock` (188). Der
      Advisory Lock ist die Antwort darauf, dass mehrere Gateway-Instanzen dieselbe
      Aufraeumarbeit gleichzeitig starten. Ob er das wirklich leistet, ist nie gegen zwei
      echte Verbindungen geprueft worden.
    sources:
      - backend/internal/idempotency/postgres_repository.go
      - backend/internal/idempotency/repository_test.go
    notes: >
      Mit `-race` laufen lassen, nicht nur `go test`.
      Zwei Verbindungen, beide rufen CleanupWithLock mit demselben Lock-Key: eine arbeitet, die
      andere kehrt sofort zurueck, ohne zu blockieren und ohne zu doppeln. Genau das ist die
      Zusage der Funktion.
      Dieselbe Mechanik ist die Vorlage fuer das Scheduling in A14 — was hier bewiesen wird,
      traegt dort.
      Cleanup darf keine Reservierung entfernen, die noch laeuft. Ein Test mit einer frischen
      und einer abgelaufenen Reservierung belegt die Grenze.
    done_when:
      - Cleanup und CleanupWithLock sind gegen echtes SQL getestet
      - Zwei gleichzeitige Verbindungen belegen, dass nur eine arbeitet und keine blockiert
      - Eine laufende Reservierung ueberlebt den Cleanup, eine abgelaufene nicht
      - go test -count=1 -race ./internal/idempotency/... gruen

  - id: verify-datev-extf-encoding-requirement
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: blocked
    blocked_reason: >
      Keine belastbare, direkt zitierbare Quelle mit Versionsangabe gefunden. Die offiziellen
      developer.datev.de-Seiten fuer Format 700/Kategorie 21 (Buchungsstapel-Feldliste und
      Header-Feldliste, direkt abgerufen) sagen NICHTS zur Zeichenkodierung. Eine dedizierte
      "Zeichensatz"-Unterseite existiert auf dem Portal, liefert ohne Login aber 404. Deren
      indexierter Inhalt (nur ueber Suchmaschinen-Snippet, nicht selbst gelesen) behauptet:
      Standard-Importzeichensatz ISO-8859-1/CP1252, Unicode inkl. UTF-8 aber ausdruecklich
      akzeptiert WENN eine BOM mitgeliefert wird — beschraenkt auf manuellen Import in DATEV
      Rechnungswesen oder die Online-API "accounting:extf-files". Das waere exakt das, was dieser
      Exporter heute produziert. Gegenlaeufiges Signal: die unabhaengige Open-Source-Bibliothek
      ledermann/datev (Ruby-Gem, kein DATEV-Bezug) kodiert ihren EXTF-Buchungsstapel-Export hart
      auf CP1252 — reales Indiz, dass automatisierte Importpfade abseits der Online-API CP1252
      erwarten koennten. Befund bleibt damit gemischt und unterschreitet die selbst gesetzte
      Beweisschwelle. Naechster Schritt liegt bei Luke: entweder kostenpflichtiger/registrierter
      Zugang zu developer.datev.de fuer die Primaerquelle, oder ein empirischer Test gegen einen
      echten DATEV-Import.
    coverage_start: "internal/biz/datev 79,7 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      VERIFY-UNIT, KEINE FIX-UNIT. Zu klaeren ist eine einzige Frage: verlangt der
      DATEV-Import fuer EXTF-Dateien mit Format-Version 700 eine cp1252-Kodierung, oder
      akzeptiert er UTF-8 mit BOM? Der Code schreibt heute UTF-8 mit BOM. Diese Unit darf am
      Kodierungsverhalten NICHTS aendern.
    sources:
      - backend/internal/biz/datev/exporter.go
      - backend/internal/biz/datev/exporter_test.go
    notes: >
      `exporter_test.go:409-422` widerlegt die Praemisse bereits ausfuehrlich: NewStreamWriter
      schreibt eine UTF-8-BOM, encoding/csv emittiert nur UTF-8, und im ganzen Paket gibt es
      keinen cp1252-Transcoding-Schritt (kein charmap-Import). Dieser Kommentar ist der
      Ausgangspunkt, nicht der Endpunkt.
      OHNE BELASTBARE QUELLE (DATEV-Formatbeschreibung mit Versionsangabe, nicht ein Forenpost)
      WIRD DIESE UNIT `blocked` MIT BEGRUENDUNG. Das ist ein gueltiges, sogar erwuenschtes
      Ergebnis. Eine Umkodierung auf Verdacht waere eine Regression an einer Schnittstelle, die
      beim Steuerberater landet — und der Fehler faellt erst dort auf.
      Ergibt die Recherche, dass cp1252 Pflicht ist, wird das NICHT hier gebaut, sondern als
      eigene Fix-Unit mit Migrationspfad fuer bestehende Exporte angelegt.
    done_when:
      - Die Frage ist mit Quelle beantwortet, oder die Unit steht auf blocked mit Begruendung
      - Das Kodierungsverhalten des Exporters ist unveraendert, per Diff belegt
      - Das Ergebnis steht als Kommentar am Test, damit die Frage nicht ein drittes Mal gestellt wird
      - go test -count=1 ./internal/biz/datev/ gruen

