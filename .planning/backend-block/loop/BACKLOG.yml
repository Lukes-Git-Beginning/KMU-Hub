  - id: scan-hardcoded-eur-vs-currency-column
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/biz 63,7 % (CI-Stand 32570176303)"
    scope: >
      Das Produkt ist auf de-DE und EUR ausgelegt, trägt aber an mehreren Stellen eine
      Währungsspalte — `TestGenerateZUGFeRDXML_CurrencyFromInvoice` und
      `_CurrencyDefaultsToEUR` (`pdf/zugferd_test.go`) belegen das für die E-Rechnung, und
      `SummarizeOpenItems_AggregatesByCurrencyAndBucket` aggregiert offene Posten NACH Währung.
      Eine Währungsspalte, die an einer Stelle gelesen und an der nächsten ignoriert wird, ist
      gefährlicher als gar keine: sie summiert Fremdwährungsbeträge als wären es Euro.
      Dieser Scan klärt, wie weit die Währungsfähigkeit tatsächlich reicht.
    sources:
      - backend/internal/biz/
      - backend/internal/models/finance.go
      - backend/migrations/
      - backend/internal/gateway/route_biz_open_items.go
    notes: >
      Mechanisch anfangen: alle Spalten mit `currency` im Namen aus den Migrationen ziehen, dazu
      alle Vorkommen von "EUR" als Literal im Go-Code. Das sind die beiden Enden der Frage.
      Je Aggregat (Summen, Dashboards, Exporte, offene Posten) entscheiden: gruppiert es nach
      Währung, oder summiert es blind? Blindes Summieren über Währungen hinweg ist der Fund,
      auf den dieser Scan zielt.
      Der DATEV- und der GoBD-Export sind die kritischsten Stellen — dort landet die Zahl beim
      Steuerberater.
      Ein hart kodiertes "EUR" ist NICHT automatisch ein Fund. Wenn das Produkt bewusst nur
      Euro kann, ist die schlanke Antwort ein `lean:`-Marker mit Upgrade-Trigger plus eine
      Prüfung, die eine Nicht-Euro-Eingabe ablehnt — nicht eine halbe Mehrwährungsfähigkeit.
      Die Frage, OB das Produkt Fremdwährung können soll, ist eine Produktentscheidung und
      gehört Luke; dieser Scan liefert nur den Ist-Zustand.
    done_when:
      - Vollständige Liste der Währungsspalten aus den Migrationen und der EUR-Literale im Code
      - Je Aggregat entschieden, ob es nach Währung gruppiert oder blind summiert
      - DATEV- und GoBD-Export sind ausdrücklich bewertet
      - Jedes blinde Summieren ist als eigene Unit angelegt; die Produktfrage steht in
        BACKLOG-NEXT.yml
      - neue-units im Journal nennt die IDs, die wirklich in BACKLOG.yml stehen

  - id: scan-gobd-immutability-beyond-belegarchiv
    phase: 4
    service: biz
    model: sonnet
    deps: [cov-invoice-service-gobd-lock-real-sql]
    status: done
    coverage_start: "internal/biz 63,7 % (CI-Stand 32570176303)"
    scope: >
      Lauf 10 hat dem Belegarchiv die Unveränderbarkeit auf Datenbankebene gegeben (Migration
      315, REVOKE UPDATE/DELETE für `kmuhub_app` auf den `gobd_*`-Tabellen). Für alle anderen
      Geldtabellen gilt das nicht: `000121_create_app_role.up.sql:49` erteilt ein schemaweites
      GRANT, und die Festschreibung einer Rechnung existiert nur als Prüfung im Go-Code
      (siehe B13).
      Dieser Scan listet alle Tabellen mit steuerlich relevanten Daten auf und ordnet je
      Tabelle ein: Gibt es eine Festschreibung? Wird sie von der Datenbank oder nur vom Code
      erzwungen? Und gibt es einen Schreibweg, der an ihr vorbeiführt?
    sources:
      - backend/migrations/000121_create_app_role.up.sql
      - backend/migrations/
      - backend/internal/biz/
      - backend/internal/biz/gobdarchive/
    notes: >
      Grundgesamtheit: alle Tabellen, die Rechnungen, Gutschriften, Zahlungen, Mahnungen,
      Buchungen, Belege oder Exporte tragen. Aus den Migrationen ziehen, nicht raten.
      Je Tabelle: Wer darf schreiben (GRANT), wer schreibt tatsächlich (Grep über `internal/`),
      und greift eine Festschreibungsprüfung auf jedem dieser Wege?
      Der interessante Fund ist nicht die fehlende Datenbanksperre — die ist an vielen Stellen
      bewusst, weil laufende Vorgänge änderbar bleiben müssen. Der Fund ist ein Schreibweg, der
      die vorhandene Prüfung UMGEHT: ein direktes UPDATE im Repository, das der Service nie
      sieht.
      ACHTUNG bei jedem REVOKE-Vorschlag: `ALTER DEFAULT PRIVILEGES` aus 000121 Abschnitt 4
      gibt jeder künftigen Tabelle die Rechte automatisch zurück. Ein REVOKE ohne
      Katalog-Prüfung ist beim nächsten `CREATE TABLE` still wieder weg. Migration 315 aus
      Lauf 10 hat dafür einen `pg_tables`-Scan als Test — das ist die Vorlage.
      Kein REVOKE gegen die Rolle `kmuhub` vorschlagen; Migrationen laufen unter ihr.
    done_when:
      - Vollständige Liste der steuerlich relevanten Tabellen mit ihren Schreibrechten
      - Je Tabelle: existiert eine Festschreibung, und wird sie von DB oder Code erzwungen
      - Jeder Schreibweg, der eine vorhandene Prüfung umgeht, ist als eigene Unit angelegt
      - Jeder REVOKE-Vorschlag trägt die Auflage eines Katalog-Scans gegen ALTER DEFAULT
        PRIVILEGES
      - neue-units im Journal nennt die IDs, die wirklich in BACKLOG.yml stehen

