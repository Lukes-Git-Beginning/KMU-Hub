#        obwohl Coverage das erklärte Laufziel war. Der Endstand musste nachträglich aus
#        dem CI-Artefakt rekonstruiert werden.
#
#   BUILD-TAGS PRÜFEN, BEVOR DU SCHREIBST:
#     `grep -rl "^//go:build" backend/internal/<zielpaket> --include=*_test.go`
#     Liegen im Zielpaket Tests hinter einem Build-Tag, laufen sie weder im PR-Gate noch
