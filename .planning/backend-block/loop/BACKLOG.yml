      `validate:"required"` bleibt (leeres Objekt `{}` ist ein Sonderfall: der Service lehnt `len(answers)==0` ab,
      `{}` hat zwei Byte; entscheiden und festhalten, ob ein leeres Objekt 400 sein soll). OpenAPI-Spec der
      Route auf das Objekt umstellen (`backend/api/openapi.yaml`, `swagger-cli validate`).
