      `cov-carddav-backend-real-protocol-paths`, siehe
      `TestListAddressObjects_PersonalBook_SilentlyTruncatesPast20`,
      `internal/caldav/carddav_backend_grpc_db_test.go`). `CardDAVBackend.ListAddressObjects`
      (`carddav_backend.go:165`) fragt mit `PageSize: 1000` ab (Kommentar im Code: "Reasonable
      limit for CalDAV sync"). `contact.Service.ListWithVisibility` (`service.go:722-724`)
      klemmt aber JEDE `PageSize` ausserhalb `[1,100]` auf den Default 20 herunter — 1000 landet
      also bei 20. `ListAddressObjects` liest `resp.Contacts` und wirft `resp.Total` weg, es
      paginiert nie nach. Ein Adressbuch (personal ODER company) mit mehr als 20 Kontakten
      synchronisiert deshalb STILL nur die ersten 20 zu jedem CardDAV-Client — kein Fehler, keine
      Warnung, der Client haelt die Synchronisation fuer vollstaendig.
      Unabhaengig von `fix-carddav-missing-tenant-context-blocks-all-operations` — dieser Bug
      sitzt in der Listing-Logik selbst, nicht im fehlenden Tenant-Context. Er laesst sich aber
      erst end-to-end gegen einen echten CardDAV-Client beobachten, NACHDEM der Tenant-Fix
      gelandet ist (vorher 401en alle Listings ohnehin) — sinnvolle Bau-Reihenfolge: nach der
      Root-Cause-Unit.
      Fix vermutlich: entweder `ListAddressObjects` paginiert bis `Total` erreicht ist (mehrere
      `ListContacts`-Aufrufe mit wachsendem `Page`), oder der Server erlaubt fuer diesen
      spezifischen Aufrufpfad eine hoehere Grenze. Vor dem Bauen pruefen, ob die 100er-Grenze in
      `service.go` bewusst als Schutz vor unbeschraenkten Abfragen gedacht ist (dann ist
      Paginierung im CardDAV-Client der richtige Fix) oder ob sie nur fuer die interaktive
      UI-Pagination gedacht war und fuer Sync-Zwecke ein Ausnahmepfad fehlt.
