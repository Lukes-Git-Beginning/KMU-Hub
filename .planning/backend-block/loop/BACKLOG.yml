      Test `internal/server/email_grpc_import_test.go` (neu, DB-backed wie
      `rbac_audit_events_db_test.go`): CSV- und vCard-Import je einmal End-to-End gegen echten
      `contact.Service`/`company.Service` (Kontakt + Firmenzuordnung landen tatsaechlich in der DB,
