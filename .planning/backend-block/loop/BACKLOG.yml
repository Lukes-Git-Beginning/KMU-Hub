      oder den Besitzer. Den Teilenden per `callerID(ctx)` bestimmen, nicht aus dem Client-Feld
      `ShareEntityRequest.shared_by` (kein Proto-Bruch: Feld ignorieren oder gegen den Aufrufer
      prüfen). Admin-Erkennung im gRPC-Server: Regel 5 im Kopf (Key in die Whitelist), oder
      ohne Admin-Waiver bauen und in `offen:` vermerken. `decide-document-share-access-effect`
      in BACKLOG-NEXT.yml im selben Commit auf "Teil (4) erledigt" setzen und in
      `decide-document-access-baseline` umbenennen (Inhalt: der Grundbefund, dass Datei-/
      Ordner-RPCs nur den Mandanten prüfen, und der 4-Unit-Schnitt aus der Vorbereitung).
