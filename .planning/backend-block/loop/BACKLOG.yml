#
# "ERST DIE VERIFIZIERTEN LECKS SCHLIESSEN, DANN DEN REST — SCANS ZULETZT."
#
# Lauf 14 startet mit denselben 58 Units, mit denen Lauf 13 aufgehört hat: er kam nur bis 21
# und hat keine einzige neue Unit erzeugt, die nicht schon hier stünde. Geändert hat sich
# ausschließlich die REIHENFOLGE — und zwar aus einem Befund der Nachbereitung.
#
#   WARUM ÜBERHAUPT UMSORTIERT WURDE. Lauf 13s `scan-tenant-filter-on-read-paths` hat die
#     komplette Fläche an RLS vorbei inventarisiert (21 Redis-Kommandostellen, sechs
#     Objektspeicher-Pfadfamilien, 39 `WithSystemContext`-Stellen) und drei Befunde gefunden,
#     zwei davon über REST erreichbare Cross-Tenant-Lecks. Sie landeten regelkonform AM
#     DATEIENDE — Position 44 und 45 von 58, hinter zehn `scan-`-Units ohne Codeanteil. Bei
#     Dateireihenfolge als einziger Priorität heißt das: nie. Gefunden und trotzdem ungefixt
#     ist fast so schlecht wie nicht gefunden. ITERATION.md trägt die Regel jetzt: ein
#     verifizierter Tenant- oder Auth-Befund gehört VOR die erste `todo`-Unit.
#
#   DER KOPF (13 Units) — DIE VERIFIZIERTEN LECKS. Alle dreizehn beschreiben einen belegten
#     Cross-Tenant-Zugriff, ein Auth-Loch oder eine gebrochene Beweiskette. Begründung für die
#     Reihenfolge INNERHALB des Kopfs steht im Kommentarblock direkt über den Units.
#
#   DANN (25 Units) `fix-` — Korrektheitsfehler ohne Tenant-Bezug, in der Reihenfolge der
#     Lauf-12-Blöcke B/C/D: je Unit EINE DOMÄNE durch alle Schichten, als Bug-Suche
#     geschnitten, nicht als Coverage-Übung.
#
#   DANN (8) `feat-`/`doc-`/`harden-`, DANN (2) `cov-`.
#
#   ZULETZT (10) `scan-`. Sie stehen bewusst hinten: ein Scan erzeugt Arbeit, statt welche zu
#     erledigen, und seine Funde kommen nach der neuen Regel ohnehin an den Kopf. Kommt der
#     Lauf nicht bis zu ihnen, ist nichts verloren — kommt er nicht bis zu den Lecks, schon.
#
#   ZUSAMMENSETZUNG: 58 Units, davon fix 36 · scan 10 · feat 7 · cov 2 · harden 2 · doc 1;
#     47 sonnet, 11 opus. Vier der elf opus-Units liegen in den ersten sechs Iterationen —
#     das ist Absicht (es sind die schwersten Lecks), macht die erste Laufstunde aber teuer.
#
#   DIE SCAN-UNITS LEGEN ZUR LAUFZEIT NACH. Jeder Fund wird als neue Unit angelegt — nach der
#     neuen Regel am KOPF, wenn er ein Leck ist, sonst am Ende. Der Backlog wächst also
#     während des Laufs; mit `OPEN=0` ist in einem 10-h-Fenster nicht zu rechnen. In Lauf 10
#     haben 9 Scans 45 Zusatz-Units erzeugt.
