      - backend/internal/gateway/route_produktion_ext.go
      - backend/internal/gateway/route_rapporte.go
      - backend/internal/gateway/route_vermietung.go
      - backend/internal/gateway/route_fuhrpark.go
      - backend/internal/gateway/helpers.go
    done_when:
      - "Je Punkt: Router-Test oder begründet verworfen (Journal)"
      - "Spec; Mutations-Probe; desktop-aufrufer-Zeile"

  - id: fix-hr-leave-list-ignores-user-filter
    phase: 4
    service: gateway
    model: sonnet
    deps: [fix-hr-employee-settings-calendar-documents-wire]
    status: todo
    coverage_start: "internal/gateway 74,8 %"
    scope: >
      VERDACHT (nicht reproduziert): `GET /hr/leave/requests` liest nur `employee_id`, `status`,
      `start_date`, `end_date` (`route_hr.go:288-310`); `SelfServiceView.tsx:188` sendet `user_id`, das
      Gateway ignoriert es, `limit`/`offset` ebenso. Hat ein Nutzer mit nur `hr:read` die Route, sieht die
      Self-Service-Ansicht alle Urlaubsanträge des Tenants als eigene. Zuerst klären, ob Service oder
      Gateway ohne `hr:manage` auf den eigenen Mitarbeiter einschränkt (Own-Scope-Muster aus
      `own_scope_filter_test.go`). Ist das so, `user_id` nur noch als Filter für Berechtigte annehmen und
      die Unit mit Beleg schließen; ist es nicht so, ist es ein Datenabfluss innerhalb des Tenants ->
      Test, der als einfacher Nutzer fremde Anträge anfordert und leer bleibt (dann an den Dateikopf
      verschieben). Außerdem `hrTimeApi.getAnalytics`: `range`, `billable_minutes`, `worked_days` fehlen,
      `by_project` liefert `project_name` statt `name`; `createSwapRequest` ignoriert den
      Idempotency-Key aus dem Body (Client setzt den Header zufällig).
