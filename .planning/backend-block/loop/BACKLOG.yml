    notes: >
      Der Bump mit der groessten Streubreite, grpc haengt unter allen 23 Services.
      Nach dem Bump zwingend `go test ./internal/gateway/` UND mindestens zwei Service-Pakete,
      nicht nur ein Build. Deprecation-Warnungen im Build ernst nehmen und im Journal notieren,
      auch wenn sie nichts brechen.
      Bricht die Interceptor-Kette (der Tenant-Inbound-Interceptor haengt an jedem Service):
      sofort blocked, nicht umbauen. Das ist Sicherheits-Infrastruktur und gehoert nicht
      nachts nebenbei angefasst.
    done_when:
      - go.mod aktualisiert, go mod tidy gelaufen
      - go test ./internal/gateway/ gruen
      - mindestens zwei Service-Pakete getestet und gruen
      - Deprecation-Warnungen im Journal notiert

