  - id: fix-caldav-write-and-exceptions-blocked-by-missing-tenant-ctx
    phase: 4
    service: calendar
    model: sonnet
    deps: []
    status: done
    coverage_start: n.a. (Bugfix, kein Coverage-Ziel)
    scope: >
      VERIFIZIERTER PRODUKTIONSFEHLER (2026-08-26, gefunden beim Bauen von
      `cov-caldav-backend-real-protocol-paths`, empirisch gegen die lokale Postgres bestaetigt —
      siehe `internal/caldav/caldav_backend_db_test.go`,
      `TestCheckCalendarWritePermission_RealCalDAVContext_OwnerBlocked` und
      `TestListEventExceptions_RealCalDAVContext_SilentlyEmpty`).
      `checkCalendarWritePermission` (`caldav_backend.go:622`) und `listEventExceptions`
      (`caldav_backend.go:651`) fragen `calendars`/`calendar_members`/`event_exceptions` direkt
      ueber `b.pool` ab, OHNE den Context mit `sysctx.With` zu markieren oder einen Tenant zu
      setzen — anders als `resolveTenantID` in derselben Datei (Zeile 50-60), das genau dafuer
      einen eigenen Kommentar traegt. CalDAV/CardDAV-Requests laufen ueber HTTP Basic Auth
      (App-Passwoerter), nie ueber JWT: `basicAuthMiddleware` (`internal/gateway/route_caldav.go:216`)
      stempelt den Context nur ueber `CtxWithUser` (User-ID), niemals einen Tenant. Unter RLS
      (`kmuhub_app`, FORCE ROW LEVEL SECURITY, Policy `tenant_id = current_tenant_id() OR
      is_system_context()`) heisst ein fehlendes `app.tenant_id`-GUC: JEDE Zeile wird gefiltert,
      unabhaengig vom echten Tenant (`internal/database/postgres.go:39-43`, dort ausdruecklich
      als "safe default" dokumentiert).
      Konkrete Folgen in Produktion:
      1. JEDES CalDAV-Schreiben (PUT/DELETE, also jedes Anlegen/Aendern/Loeschen eines Termins
         ueber Apple Kalender, Thunderbird/Lightning, DAVx5) schlaegt mit 404 "calendar not
         found" fehl — auch fuer den tatsaechlichen Besitzer des Kalenders. Das deckt sich mit
         dem in der urspruenglichen Unit beschriebenen Symptom "mein Kalender synchronisiert
         nicht".
      2. `listEventExceptions` liefert unter dem echten CalDAV-Context immer eine leere Liste,
         auch wenn Ausnahmen (abgesagte oder verschobene Vorkommen einer Serie) existieren —
         OHNE Fehler. Das ist der gefaehrlichere Teil: kein Client bekommt je einen Fehlschlag
         zum Wiederholen, die Abweichung verschwindet einfach lautlos aus dem exportierten iCal.
      Das exakt gleiche Bug-Muster (RLS blockt eine Basic-Auth-Abfrage ohne Tenant-Context) wurde
      im selben Package fuer `FindActiveByUser`/`UpdateLastUsed` (Login-Pruefung) UND fuer die
      `SyncTokenService`-Writes bereits gefunden und behoben — siehe
      `internal/caldav/tenant_write_test.go:10-22`. Fix dort: `sysctx.With(ctx)` fuer die
      Login-taugliche Bypass-Abfrage, bzw. `resolveTenantID` + expliziter Tenant fuer Writes.
      Dieselbe Loesungsfamilie passt hier vermutlich nicht 1:1: `checkCalendarWritePermission`
      und `listEventExceptions` sind LESE-Zugriffe im Kontext eines bereits bekannten,
      authentifizierten Users (`CtxWithUser` hat die User-ID) — der richtige Fix ist wahrscheinlich,
      den Tenant analog zu `resolveTenantID` aus der `users`-Tabelle aufzuloesen (per
      `sysctx.With`-Bypass, wie dort) und ihn dann als echten `middleware.WithTenantID`-Context
      an die eigentliche Abfrage zu haengen — NICHT die Abfrage selbst pauschal mit
      `sysctx.With` zu bypassen, das wuerde die Tenant-Grenze fuer diese beiden Funktionen ganz
      aufheben statt sie korrekt zu setzen.
    sources:
      - backend/internal/caldav/caldav_backend.go
      - backend/internal/caldav/caldav_backend_db_test.go
      - backend/internal/caldav/tenant_write_test.go
      - backend/internal/database/postgres.go
      - backend/internal/gateway/route_caldav.go
      - backend/internal/sysctx/sysctx.go
    notes: >
      Die *_WithTenantCtx-Tests in `caldav_backend_db_test.go` beweisen bereits, dass die
      Berechtigungs-Verzweigung selbst (owner/edit/admin/view/keine Mitgliedschaft/Kalender
      nicht gefunden) korrekt ist, SOBALD ein Tenant im Context steht — sie dienen als
      Regressionsschutz fuer diesen Fix, nicht als Ersatz fuer ihn. Nach dem Fix muessen die
      beiden `_RealCalDAVContext_`-Tests (die den Bug dokumentieren) ihre Erwartung umdrehen:
      der Owner darf schreiben, die Exception muss sichtbar sein.
      NACHTRAG (Lauf 13, Iteration 4): Der ROOT CAUSE ist bereits behoben —
      `fix-carddav-missing-tenant-context-blocks-all-operations` hat `basicAuthMiddleware` ueber
      den neuen `caldavpkg.NewCtxInjector(pool)` auf einen echten Tenant-Context umgestellt.
