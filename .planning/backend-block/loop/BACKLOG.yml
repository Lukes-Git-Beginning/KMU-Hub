    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Scan-Unit, kein Coverage-Ziel)"
    scope: >
      MUSTER A — `ON CONFLICT`-Ziel passt nicht zum tatsaechlich existierenden Index.
      Vorlage: `fix-notification-quiet-hours-conflict-index`. Dort zielt
      `ON CONFLICT (tenant_id, user_id)` auf einen Index, der nur `UNIQUE(user_id)` ist:
      Postgres validiert das Konflikt-Ziel beim PLANEN, also schlaegt JEDER Aufruf mit
      SQLSTATE 42P10 fehl -- unabhaengig davon, ob ueberhaupt ein Konflikt auftritt. Das
      Feature ist damit zu 100 % unbenutzbar und faellt trotzdem in Unit-Tests ohne DB nicht auf.

      TEIL A dieses Scans deckt die Haelfte der Flaeche ab (98 `ON CONFLICT`-Stellen gesamt):
      alle Repositories unter `internal/{auth,security,notification,chat,calendar,document,
      email,inbox,work,crm}`.

      Pro Fundstelle: die Konfliktspalten aus der Query lesen, dann in den Migrationen den
      UNIQUE-Constraint/Index auf dieser Tabelle suchen und die Spaltenliste EXAKT vergleichen
      (Reihenfolge egal, Menge nicht). Besondere Vorsicht bei partiellen Indizes
      (`WHERE deleted_at IS NULL`): ein `ON CONFLICT` ohne passende `WHERE`-Klausel trifft
      einen partiellen Index NICHT und schlaegt ebenso fehl.
    sources:
