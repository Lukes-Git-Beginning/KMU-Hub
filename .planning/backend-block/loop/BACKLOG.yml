      IMAP-Server nicht antwortet, und laeuft er danach je wieder an? Genau dieses Muster
      (ein Worker, der einmal laeuft und dann nie wieder, lautlos) war der
      Advisory-Lock-Leak aus Lauf 10. (2) Teilweise abgerufene Nachrichten: bleibt der
      Sync-Zeiger korrekt, wenn der Abruf mitten in einem Batch abbricht? (3) Kodierung:
      was macht der Client mit einer Nachricht in einer exotischen Kodierung oder mit
      kaputtem MIME? (4) Tenant-Zuordnung: eine abgerufene Nachricht muss dem richtigen
      Tenant zugeordnet werden — pruefen, woher diese Zuordnung kommt.
