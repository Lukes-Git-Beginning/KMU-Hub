  - id: fix-fuhrpark-trip-logs-private-flag-not-filtered
    phase: 4
    service: fuhrpark
    model: opus
    deps: []
    status: done
    decided: '2026-10-25'
    decision: >
      ENTSCHEIDUNG LUKE, 2026-10-25 (Entscheidungsrunde zur Vorbereitung von Lauf 17): MASKIEREN. Für alle
      außer dem Fahrer selbst (`driver_user_id`, seit Migration 340) erscheint eine Privatfahrt nur mit
      Datum, km-Ständen, Strecke und dem Label „Privatfahrt“, ohne Ziel, Zweck, Route und GPS. Das gilt
      für Liste, Fahrzeugliste UND Export. Der Export bleibt lückenlos, weil ein Fahrtenbuch auch Privatfahrten
      mit km führen muss. Kein `include_private`-Parameter, kein Ausblenden.
    target: Privatfahrten im Arbeitgeberbericht maskiert, Fahrtenbuch lückenlos
    coverage_start: n.a. (Bugfix, kein Coverage-Ziel)
    scope: >
      Fund aus `cov-gateway-fuhrpark-triplogs-gps-exports` (Iteration 18, Lauf 12). `trip_logs` traegt `is_private
      BOOLEAN` (`backend/migrations/000193_create_trip_logs.up.sql`) zur Unterscheidung privater von geschaeftlichen
      Fahrten. Sowohl `PostgresRepository.ListTripLogs` als auch `PostgresRepository.ListTripLogsForExport`
      (`internal/fuhrpark/postgres_repository.go:639` und `:1191`) selektieren `is_private` als Spalte,
      filtern aber in keiner ihrer WHERE-Klauseln danach — jede Route ueber `HandleListTripLogs`, `HandleListVehicleTripLogs`
      und `HandleExportTripLogs` (`internal/gateway/route_fuhrpark.go`) liefert private Fahrten ununterscheidbar
      neben geschaeftlichen zurueck. Das steuerlich relevante Fahrtenbuch-Export-PDF/CSV (`Service.ExportTripLogs`,
      `internal/fuhrpark/service.go:754`) enthaelt damit private Fahrten des Fahrers im arbeitgeberseitigen
      Bericht. Fix: entweder einen expliziten `include_private`-Query-Parameter einfuehren, der standardmaessig
      `false` ist (private Fahrten nur auf Wunsch/mit gesonderter Berechtigung sichtbar), oder `is_private=true`-Zeilen
      grundsaetzlich aus Liste UND Export ausschliessen. Die Entscheidung zwischen beiden Wegen (opt-in
      sichtbar vs. immer ausgeblendet) gehoert Luke — `IsPrivate` wird beim Anlegen vom Fahrer selbst gesetzt
      (`createTripLogRequest.IsPrivate`, `route_fuhrpark.go`), es ist also keine Admin-only-Angabe.
    sources:
      - backend/internal/fuhrpark/postgres_repository.go
      - backend/internal/fuhrpark/service.go
      - backend/internal/gateway/route_fuhrpark.go
      - backend/internal/gateway/route_fuhrpark_triplogs_gps_test.go
      - backend/migrations/000193_create_trip_logs.up.sql
    notes: >
      `is_private` NICHT stillschweigend rausfiltern, ohne die Wahl (opt-in vs. immer ausgeblendet) vorher
      mit Luke zu klaeren — eine Verhaltensaenderung an einem bestehenden Bericht ohne Ankuendigung waere
      selbst ein Befund.
    done_when:
      - >
        DB-Test: admin/manager sehen bei is_private nur Datum, km, Strecke und Label, der Fahrer selbst
        sieht alles
      - Export (CSV/PDF) enthält die Privatfahrt maskiert, nicht ausgelassen
      - go test -count=1 ./internal/fuhrpark/ ./internal/gateway/ grün

