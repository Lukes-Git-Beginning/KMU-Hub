  - id: p2-own-scope-list-filter
    phase: 2
    service: querschnitt
    model: opus
    deps: [p2-owner-fk-crm, p1a-resolver]
    status: done
    scope: >
      Bei aufgeloestem Scope `own` die LISTE serverseitig auf die eigenen Datensaetze filtern,
      statt nur den Fremd-Detail-Zugriff mit 403 abzuweisen. Exemplarisch an zwei bis drei
      Listen-Endpoints umsetzen und das Muster dokumentieren.
    sources:
      - backend/internal/auth/service.go
    notes: >
      Das ist der eigentliche Zweck der `scope`-Spalte. Ohne Listenfilter sieht ein `member` mit
      `scope: own` weiterhin alle Titel und Namen in der Uebersicht und bekommt erst beim Klick 403 —
      das ist ein Datenleck, kein Komfortproblem.
      Filter gehoert in die Repository-Query (`WHERE created_by = $user`), nicht in einen
      Nachfilter im Handler — sonst stimmen Pagination und Gesamtzahl nicht.
      `team`-Scope braucht einen Reporting-Line-Resolver und ist NICHT Teil dieser Unit; wenn der
      Scope `team` ist, verhaelt sich der Endpoint wie bisher.

      ERGEBNIS (2026-08-01, Commit 78985af4): Der Scope war bis hierher **nirgends zur Laufzeit
      lesbar** — der JWT trug nur `perms []string` (Keys ohne Scope), `role_permissions.scope` lag
      allein in der DB. Diese Unit hat deshalb zuerst den Transportweg gebaut:
      `Service.NarrowedScopes` (nutzt den vorhandenen Union-Resolver aus `p1a-resolver`) ->
      JWT-Claim `scopes` (nur Keys mit Scope < `all`) -> `middleware.PermissionScope(ctx, resource,
      action)`. Abwesenheit = `all`, damit Alt-Tokens unveraendert weiterlaufen.
      SCOPE-KORREKTUR gegen den urspruenglichen Plan: **CRM war der falsche Ort.** Kein einziger
      CRM-Key traegt im Seed (000256) Scope `own` — ein Filter auf `contacts`/`deals` waere toter
      Code gewesen. Die einzigen READ-Keys mit `own` sind `rapporte:report:read` und
      `helpdesk:ticket:read` (beide Rolle `member`); dort sitzt der Filter jetzt (drei Endpoints:
      `/rapporte/reports`, `/rapporte/pending`, `/helpdesk/tickets`).
      Gemeinsamer Helper `ownerFilterForScope(w, r, resource, action)` in `internal/gateway/
      helpers.go` — jeder weitere Listen-Endpoint haengt sich mit vier Zeilen daran; die Doku des
      Musters steht als Godoc dort und an `middleware.PermissionScope`.
    done_when:
      - Zwei bis drei Listen-Endpoints filtern bei scope=own serverseitig
      - total/Pagination stimmen mit dem gefilterten Ergebnis ueberein
      - DB-Test: User sieht fremde Zeilen nicht in der Liste
      - Muster im Journal dokumentiert

