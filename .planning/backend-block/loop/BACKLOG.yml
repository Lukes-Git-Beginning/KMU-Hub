# Backend-Nachtloop — Arbeitsqueue
#
# Eine Unit = eine Iteration = ein Commit. Reihenfolge ist Absicht: klein und
# konkret zuerst, damit fruehe Iterationen den Zyklus vollstaendig durchspielen.
#
# status: todo | in_progress | done | blocked
# model:  sonnet (Default) | opus (architektonisch schwer)
#
# Quelle: .planning/backend-block/WELLEN-BRIEFING.md §4 Phase 3
#         + .planning/backend-gaps.md (Zeilennummern in `sources`)
#
# Phase 1 (RBAC-Fundament) und Phase 4 (Branchen-BE) stehen bewusst NICHT hier.
# Phase 2 (RBAC-Enforcement pro Modul) wird nachgetragen, sobald Phase 1 steht.

units:

  # --- einkauf: drei kleine, exakt umrissene Defekte ------------------------

  - id: p3-einkauf-total-amount
    phase: 3
    service: einkauf
    model: sonnet
    deps: []
    status: done
    scope: >
      PurchaseOrder.total_amount wird nie berechnet: CreatePO setzt "0",
      Add/Update/DeletePOLine rechnen den Kopfbetrag nicht nach. Gegen echtes BE
      zeigen darum alle Bestellungen 0,00 EUR. Kopfbetrag als Netto-Zeilensumme
      nach jeder Zeilenmutation neu berechnen — gleiche Semantik wie der
      MSW-Handler sie vormacht.
    sources:
      - .planning/backend-gaps.md:404
      - backend/internal/einkauf/service.go
      - desktop/src/renderer/src/mocks/handlers/einkauf.ts
    done_when:
      - CreatePO, AddPOLine, UpdatePOLine, DeletePOLine halten total_amount konsistent
      - Recompute liegt im Service, nicht im Handler
      - Unit-Test deckt Zeile hinzufuegen / aendern / loeschen ab
      - go build/vet/lint/test gruen

  - id: p3-einkauf-cancel
    phase: 3
    service: einkauf
    model: sonnet
    deps: [p3-einkauf-total-amount]
    status: done
    scope: >
      POST /pos/{id}/cancel fehlt komplett — UpdatePOInput traegt kein
      Status-Feld, es gibt keinen Cancel-Uebergang. Endpoint mit Status-Guard
      bauen: nur offene Bestellungen sind stornierbar, alles andere 409.
      FE laeuft dafuer heute mock-first (einkauf-client.ts cancelPO).
    sources:
      - .planning/backend-gaps.md:403
      - backend/internal/einkauf/service.go
      - desktop/src/renderer/src/modules/einkauf/einkauf-client.ts
    notes: >
      Neue gRPC-RPC noetig -> .proto aendern UND im selben Commit regenerieren
      (make proto-* Target). Route-Datei anlegen; die Registrierung in
      cmd/gateway/main.go gehoert mit in denselben Commit, weil du hier die
      Hauptsession bist.
    done_when:
      - POST /pos/{id}/cancel storniert eine offene Bestellung
      - Nicht-offene Bestellung liefert 409 mit sprechendem Fehlercode
      - .proto und .pb.go im selben Commit
      - go build/vet/lint/test gruen

  - id: p3-einkauf-exportpo-remove
    phase: 3
    service: einkauf
    model: sonnet
    deps: [p3-einkauf-cancel]
    status: done
    scope: >
      ExportPO (service.go:716) ist ein Stub. Das FE erzeugt Bestell-PDF/CSV
      seit 2026-07-16 clientseitig (modules/einkauf/einkauf-export.ts), exportPO
      wurde aus dem FE-Client entfernt. Toten Pfad entfernen statt ihn zu
      pflegen — inklusive RPC, Route und Proto-Eintrag.
    sources:
      - .planning/backend-gaps.md:405
      - backend/internal/einkauf/service.go
    notes: >
      Vor dem Loeschen verifizieren, dass wirklich kein Aufrufer mehr existiert
      (grep ueber desktop/ und backend/). Findest du einen, markier blocked
      statt zu loeschen.
    done_when:
      - Kein Aufrufer mehr im Repo
      - RPC, Route, Proto-Eintrag und Service-Methode entfernt
      - go build/vet/lint gruen

  # --- document: Wire-Shape-Drift ------------------------------------------

  - id: p3-document-wire-shape
    phase: 3
    service: document
    model: sonnet
    deps: []
    status: done
    scope: >
      Gateway-Responses driften vom FE-Typ ab; das FE faengt es heute mit einem
      Normalizer in document-client.ts ab. Kanonisch gehoert der Fix ins
      Gateway (route_document.go), danach kann der FE-Normalizer weg.
      Konkret: POST /documents/shares, /documents/tags und
      /documents/files/{id}/links antworten nackt (resp.Share/Tag/Link) statt
      gewrappt {share}/{tag}/{link}. Ausserdem Listen konsistent {items,total},
      leere Slices [] statt null, Single-Entity gewrappt.
    sources:
      - .planning/backend-gaps.md:143
      - .planning/backend-gaps.md:203
      - backend/internal/gateway/route_document.go
      - desktop/src/renderer/src/modules/dokumente/document-client.ts
    notes: >
      Zwei Punkte sind Klaerung, keine reine Mechanik: (b) POST
      .../versions/revert gibt {file}, der FE-Typ sagt {version}; (c) GET
      /documents/shares/shared-with-me gibt {files,folders,total}, das FE
      erwartet {shares}. Entscheide dich fuer die Form, die der FE-Typ
      beschreibt, und notier die Entscheidung im Journal — der FE-Normalizer
      wird spaeter danach zurueckgebaut.
    done_when:
      - Alle Create-Responses gewrappt
      - Leere Liste ist [] nicht null
      - Abweichung revert/shared-with-me im Journal begruendet
      - go build/vet/lint/test gruen

  # --- helpdesk -------------------------------------------------------------

  - id: p3-helpdesk-wire-ticket
    phase: 3
    service: helpdesk
    model: sonnet
    deps: []
    status: done
    scope: >
      WireTicket liefert nur assignee_id/requester_id als UUID, keine Namen —
      die Ticket-Liste rendert rohe UUIDs in "Zugewiesen an", und ein
      FE-Lookup ist unmoeglich (kein tenant-weites User-Verzeichnis).
      assignee_name und requester_name denormalisiert mitliefern. Ausserdem
      fehlen description (Detail-Body immer leer) und category (Spalte immer
      leer) komplett im WireTicket.
    sources:
      - .planning/backend-gaps.md:142
      - backend/internal/helpdesk/
      - backend/internal/gateway/route_helpdesk.go
    notes: >
      War bei Backlog-Erstellung bereits erledigt (Commit d2473afb,
      2026-06-28, vor backend-gaps.md-Audit) — siehe Iteration 5 im Journal.
    done_when:
      - WireTicket traegt assignee_name, requester_name, description, category
      - Join laeuft tenant-gescoped
      - Nicht aufloesbare Referenz liefert leeren Namen statt Fehler
      - .proto und .pb.go im selben Commit
      - go build/vet/lint/test gruen

  - id: p3-helpdesk-ticket-number
    phase: 3
    service: helpdesk
    model: sonnet
    deps: [p3-helpdesk-wire-ticket]
    status: done
    scope: >
      Es gibt kein ticket_number-Feld. Das FE bastelt eine Pseudo-Nummer aus
      den ersten vier Hex-Zeichen der UUID (HD-YYYY-NNNN) — kollisionsanfaellig.
      Fortlaufende ticket_number pro Tenant serverseitig vergeben und im
      WireTicket ausliefern.
    sources:
      - .planning/backend-gaps.md:142
      - backend/internal/helpdesk/
    notes: >
      War bei Backlog-Erstellung bereits erledigt (Commit d2473afb,
      2026-06-28, vor backend-gaps.md-Audit) — siehe Iteration 5 im Journal.
    done_when:
      - Neue Tickets bekommen eine fortlaufende Nummer pro Tenant
      - Bestandstickets sind nummeriert
      - ticket_number im WireTicket
      - Migration hat tenant-gescopte Semantik, up und down gefuellt
      - RLS-Smoke gruen
      - go build/vet/lint/test gruen

