  # ========================================================================================
  # BLOCK D — SCANS
  #
  # Gemeinsam für alle acht: Lese- und Klassifikationsarbeit, KEIN Fix in der Scan-Iteration
  # (Ausnahme: ein Ein-Zeilen-Fix, den die Unit ausdrücklich erlaubt). Jeder Fund wird eine
  # vollständige Unit (scope, sources, notes, done_when, status: todo):
  #   - Totalausfall (scheitert für jeden echten Nutzer, auch im FE) -> VOR die erste
  #     `todo`-Unit der Datei (Regel 1 im Kopf).
  #   - Teilfehler/Randfall -> ans Dateiende.
  #   - Reines FE-Thema oder Entscheidung -> BACKLOG-NEXT.yml mit `blocked_reason`.
  # Das Ergebnis jedes Scans ist eine Tabelle im Journal (Stelle, Befund, Klasse, Unit-ID).
  # "Keine Funde" ist ein vollwertiges Ergebnis — mit der Liste, was geprüft wurde.
  #
  # Die fünf Shape-Scans prüfen je Domäne JEDE Methode der Desktop-Clients
  # (`desktop/src/renderer/src/api/<domäne>-client.ts`, Typen in `<domäne>-types.ts`) UND
  # jeden Hook der Domäne in `api/hooks/`, der den Gateway direkt aufruft. Für jede Methode:
  # Route -> Gateway-Handler -> was wird WIRKLICH geschrieben (`response.Proto(w, …, resp)`
  # mit Wrapper-Message, `response.ProtoList`, `resp.GetX()`, handgebauter Struct; leere
  # Liste `[]` oder `null`; snake_case; verschachteltes Proto-JSON gegen flachen FE-Typ). Das
  # Muster des Fehlers ist `3c13fd66` (GET /inbox/rules). MSW-Mocks (`desktop/src/renderer/src/mocks/`)
  # sind KEIN Beleg. Der Fix sitzt am Gateway (Backend-Territorium); bricht die Abweichung die
  # UI für jeden, ist das ein Totalausfall.
  # ========================================================================================

  - id: fix-biz-gobd-archive-invoice-startup-pdf-settings
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: todo
    coverage_start: "internal/server 75,0 %"
    scope: >
      TOTALAUSFALL, im Scan `scan-grpc-hardcoded-actor-and-admin-remaining` verifiziert
      (2026-10-23): `POST /api/v1/finance/gobd-archive/from-invoice/{invoiceId}` liefert für
      JEDEN Mandanten 500 "failed to generate invoice PDF". Ursache:
      `ArchiveInvoiceDocument` (`internal/server/biz_grpc_gobd_archive.go:94`) rendert über
      `s.pdfGenerator`, den `cmd/biz/main.go:185-193` einmal beim Start baut — mit
      `companySettingsRepo.GetByTenantID(ctx, uuid.Nil)`. Es gibt keinen Mandanten mit der
      Nil-UUID, die Abfrage liefert nil, der Fallback ist ein Settings-Objekt nur mit
      AccentColor und Zahlungsfristen. `GenerateInvoicePDF` ruft
      `ValidateCompanySettingsForPDF(g.settings)` (`pdf/generator.go:162`) -> Fehler "missing
      name, street, plz, city, steuernummer or ust_id_nr" (per Wegwerf-Test reproduziert). Selbst
      wenn die Prüfung durchginge, trüge das PDF nie die Stammdaten des richtigen Mandanten.
      Alle anderen PDF-Pfade in `biz_grpc.go` bauen den Generator pro Anfrage aus
      `s.requireCompanySettings(ctx, tenantID)` (Z. 1290/1320/1350/1389/1429/1501) — nur dieser
      eine nicht. `s.pdfGenerator` hat außer dieser Stelle keinen Nutzer.
      Fix: im Archiv-Handler wie die Geschwister `requireCompanySettings` + `pdf.NewGenerator`
      verwenden; dann das tote Feld `pdfGenerator` samt Konstruktor-Parameter und die
      Startup-Abfrage mit `uuid.Nil` in `cmd/biz/main.go` entfernen.
    sources:
      - backend/internal/server/biz_grpc_gobd_archive.go
      - backend/internal/server/biz_grpc.go
      - backend/cmd/biz/main.go
      - backend/internal/biz/pdf/generator.go
    notes: >
      Es gibt ein `internal/server`-Testfeld für BizGRPCServer; der Test muss mit Firmen-
      stammdaten des Mandanten laufen (Zeile in `company_settings`) und die archivierten
      Bytes als PDF erkennen — kein Mock des Generators. Kein `.proto`, keine Route.
    done_when:
      - "DB-Test als kmuhub_app: Rechnung + company_settings des Mandanten -> ArchiveInvoiceDocument liefert ein Dokument mit PDF-Inhalt (%PDF)"
      - "DB-Test: Mandant ohne vollständige Stammdaten -> klarer Fehler statt Internal"
      - "Mutations-Probe: wieder auf einen Generator ohne Mandanten-Settings, der Test wird rot"
      - "desktop-aufrufer: POST .../gobd-archive/from-invoice/{id} im Desktop-Client geprüft, Journal-Zeile"

