  - id: fix-websocket-hard-disconnect-cleanup-delay
    phase: 4
    service: gateway
    model: opus
    deps: []
    status: todo
    scope: >
      Verifizierter Produktionsbug, in Iteration 19 durch einen Test reproduziert
      (`TestHandleWebSocket_HardDisconnect_CleanupWaitsForTokenRevalidation`, Phase 1).
      Bricht ein Client die Verbindung hart ab, endet zwar `wsjson.Read` mit Fehler, aber
      `handleConnection` blockiert danach auf `<-done` und wartet auf die
      Revalidierungs-Goroutine. Die kehrt nur bei `ctx.Done()` oder ungueltigem Token zurueck
      -- und `r.Context()` einer gehijackten Verbindung wird nicht gecancelt, wenn der Socket
      stirbt. Ergebnis: Verbindung, gecachter Tenant, Rate-Limiter-Bucket, Channel-
      Mitgliedschaften und BEIDE Goroutinen ueberleben den Abbruch bis zu
      `wsTokenRevalidateInterval` = 5 Minuten. Mit `maxConnsPerUser = 5` heisst das: fuenf
      Verbindungsabbrueche in Folge (instabiles WLAN, Tunnel, Schlafmodus) sperren den Nutzer
      fuer bis zu 5 Minuten mit HTTP 429 aus. Zusaetzlich bleibt er in `presenceSubscribers`
      und `channelMembers` und gilt fuer Broadcasts weiter als anwesend.
    sources:
      - backend/internal/server/websocket.go
      - backend/internal/server/websocket_connection_test.go
    notes: >
      `opus`, weil es um Goroutine-Lebenszyklus geht und ein falscher Fix leicht eine Race
      oder einen doppelten Close erzeugt. Naheliegender Weg: in `handleConnection` einen
      eigenen abgeleiteten Context (`connCtx, cancel := context.WithCancel(ctx)`) fuer die
      Revalidierungs-Goroutine, und `cancel()` aufrufen, sobald der Read-Loop endet -- dann
      raeumt der Abbruch sofort auf, ohne das Warten auf `<-done` aufzugeben (das bleibt
      richtig, damit `unregisterConnection` zuletzt laeuft). Das Testfeld
      `h.revalidateInterval` existiert seit Iteration 19 und macht die Probe in
      Millisekunden moeglich. Phase 1 des bestehenden Tests muss dann in ihr Gegenteil
      umgeschrieben werden (sofortige Freigabe) -- das ist der Beleg des Fixes, nicht ein
      Regressionsschaden. Ein Goroutine-Zaehler vor/nach gehoert dazu.
    done_when:
      - >-
        Ein harter Verbindungsabbruch gibt Verbindung, Tenant-Cache, Rate-Limiter,
