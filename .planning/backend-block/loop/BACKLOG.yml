      unbegrenztes Datenwachstum ohne Gegenmassnahme — genau die Art Fund, die laut
      Unverhandelbare-Grenzen nicht in einer Coverage-Unit gefixt werden darf, weil sie
      Verhalten aendert (ein neuer periodischer Sweep).
