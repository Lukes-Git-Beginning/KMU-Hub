        eine begründete Whitelist geprüft
      - Jede Verletzung trägt Regel-ID und Business-Term wie die bestehenden
      - Was bewusst nicht vollständig geprüft wird, trägt einen lean-Marker mit Upgrade-Trigger
      - Eine vollständige Rechnung besteht beide Profile weiterhin (Bestandstest bleibt grün)
      - go test -count=1 ./internal/biz/einvoice/ grün

