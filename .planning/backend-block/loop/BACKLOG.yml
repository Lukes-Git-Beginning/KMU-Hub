        gespeichert oder summiert wird
      - Ein Test je Paket mit Bruchmenge belegt, dass gespeichertes Netto und XRechnung-Netto
        identisch sind (nicht nur beide "plausibel")
      - Die Toleranzfrage in einvoice.totalsTolerance ist entschieden und begruendet
      - go test -count=1 ./internal/biz/... gruen

