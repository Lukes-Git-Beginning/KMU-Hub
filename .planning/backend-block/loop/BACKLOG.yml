      - Unit-Test auf den Listen-Pfad
      - go build/vet/lint/test gruen

  - id: p3-finance-recurring
    phase: 3
    service: finance
    model: opus
    deps: [p3-finance-list-amounts]
    status: done
    scope: >
      Wiederkehrende Rechnungen: Definition, Zeitplan, Erzeugung.
    sources:
      - .planning/backend-gaps.md
      - backend/internal/biz/
    notes: >
      Idempotenz ist hier Pflicht, keine Kuer — eine doppelt erzeugte Rechnung
      ist ein echter Geschaeftsvorfall. Idempotency-Key-Muster aus dem Repo
      wiederverwenden (Dialer-Outcomes, Finance-Postings).
      ERLEDIGT Iteration 14 (Migration 000246). Serverseitig existierte gar
      nichts — das FE (RecurringInvoicesTab/-DetailPanel/-Dialog,
      financeRecurringApi) lief komplett gegen MSW. Entscheidungen:
      (a) Idempotenz ueber eine Ledger-Tabelle `finance_recurring_runs` mit
      UNIQUE (tenant_id, recurring_id, period_date) statt eines
      Idempotency-Key-Headers: der Schluessel ist hier fachlich die Periode,
      nicht der Request — auch ein Scheduler-Lauf ohne Client-Header darf nicht
      doppelt fakturieren. Ein Replay liefert die bereits erzeugte Rechnung
      zurueck statt einer zweiten. (b) `next_run` wird immer aus
      start_date + n Perioden berechnet (Anker), nie schrittweise
      fortgeschrieben — sonst rutscht ein Monatsabo vom 31. dauerhaft auf den
      28. (c) invoice_date der erzeugten Rechnung ist die Periode, nicht heute:
      Nachholen alter Perioden bleibt so nachvollziehbar. (d) Emission laeuft
      ueber invoice.Service.Create — Nummernkreis/GoBD/Steuer bleiben an einer
      Stelle; dafuer haben CreateInput zwei neue Felder (Currency, RecurringID).
      NICHT enthalten: automatischer Scheduler (nur manuelles /generate; die
      Faelligkeits-Query liegt als Index bereit) und PDF-Versand der erzeugten
      Rechnung.
    done_when:
      - Wiederkehrende Definitionen persistiert, tenant-gescoped
      - Erzeugung idempotent, doppelter Lauf erzeugt keine zweite Rechnung
      - RLS-Smoke gruen
      - go build/vet/lint/test gruen

  - id: p3-finance-op-mahnwesen
    phase: 3
    service: finance
    model: opus
    deps: [p3-finance-recurring]
    status: done
    scope: >
      Offene-Posten-Liste und mehrstufiges Mahnwesen (Stufen, Fristen,
      Gebuehren). PDF ueber den vorhandenen maroto-Generator in
      internal/biz/pdf, der Mahnungen bereits kann.
    sources:
      - .planning/backend-gaps.md
      - backend/internal/biz/pdf/
    notes: >
      ERLEDIGT Iteration 15. Die Mahnwesen-Haelfte war bereits komplett und ist
      verifiziert, nicht neu gebaut: `internal/biz/dunning` hat Config
      (Stufen/Fristen/Gebuehren), DetectAndCreateDunnings mit Stufen-Guard
      (`highestSentLevel >= MaxDunningLevel || hasDraft` → keine vierte Stufe,
      kein zweiter Draft), Verzugszinsen nach BGB §288, Send + Notice-Mail und
      GenerateDunningPDF ueber den maroto-Generator in `internal/biz/pdf`
      (Route `GET /finance/dunning/{id}/pdf`). Offen war allein die
      Offene-Posten-Liste: die gab es serverseitig NICHT, das FE
      (`OpenItemsTab.tsx`) rechnete sie aus `useInvoices()` selbst — also aus
      EINER Seite der Rechnungsliste (Default 50) mit dem Bruttobetrag statt dem
      Restbetrag. Beide Fehler sind gegen echtes BE fachlich falsch, nicht
      kosmetisch. Neu: `GET /api/v1/finance/open-items`. Entscheidungen:
      (a) KEINE neue Tabelle, keine Migration — offene Posten sind eine
      Read-Model-Sicht auf finance_invoices + finance_payments +
      finance_dunning_records. (b) open_amount = gross_total minus Summe der
      Zahlungen, Filter `> 0`: eine voll bezahlte Rechnung mit noch nicht
      geflipptem Status verschwindet damit von selbst. (c) Summary ist
      IMMER tenant-weit (eigene Aggregat-Query), nie seiten-basiert — genau der
      Fehler der FE-Variante. (d) Summen PRO WAEHRUNG: es gibt keinen
      gespeicherten Umrechnungskurs (das FE liest `inv.exchange_rate`, das Feld
      existiert im Backend gar nicht → Faktor immer 1, CHF-Spiegel wurden als
      EUR mitsummiert). (e) Aging-Grenzen (0/30/60) stehen EINMAL in
      `models.AgingBucketUpperDays()` und wandern als Query-Parameter in die
      SQL-CASE — die SQL-Klassifikation kann nicht von der Go-Variante
      abdriften; ein Test pinnt die Grenzen. (f) `status` im Proto als String,
      nicht als InvoiceStatus-Enum: der Gateway marshalt Enums als Zahlen
      (UseEnumNumbers), das FE typt Status als String-Union. NICHT enthalten:
      der FE-Umbau von OpenItemsTab auf die neue Route (FE-Aufgabe, Wire-Shape
      steht in openapi.yaml) und ein Scheduler fuer die automatische
      Mahnlauf-Erkennung.
    done_when:
      - OP-Liste tenant-gescoped und korrekt sortiert
      - Mahnstufen serverseitig durchgesetzt
      - Mahnungs-PDF ueber den vorhandenen Generator
      - go build/vet/lint/test gruen

