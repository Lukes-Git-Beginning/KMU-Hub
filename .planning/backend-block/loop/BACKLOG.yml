  - id: fix-409-double-meaning-on-grpc-conflict-routes
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: blocked
    blocked_reason: >-
      SCOPE-FEHLEINSCHAETZUNG in der Unit-Vorbereitung, in Iteration 12 am Code verifiziert:
      die 58 `codes.AlreadyExists`-Fundstellen sind NICHT 58 einzelne RPC-Handler, sondern
      liegen fast durchgehend in 38 GETEILTEN Error-Mapper-Funktionen (`mapCalendarError`,
      `mapCRMError`, `mapBizError`, ...), die jeweils von vielen verschiedenen RPC-Methoden
      aufgerufen werden. Gemessen: `mapCalendarError(err)` wird 41x in `calendar_grpc.go`
      aufgerufen, `mapCRMError(err)` 60x in `crm_grpc.go`, `mapBizError(err)` 57x in
      `biz_grpc.go`. Die tatsaechlich betroffene Operationenliste laesst sich deshalb nicht
      aus den Fundstellen ablesen (der in `scope` beschriebene Weg "von der Fundstelle ueber
      die RPC zum Handler" geht von einem 1:1-Verhaeltnis aus, das nicht existiert) - sie
      erfordert je AlreadyExists-Sentinel-Error (z.B. `calendar.ErrMemberAlreadyExists`,
      `event.ErrAlreadyAttendee`, `resource.ErrBookingConflict`) eine Rueckverfolgung durch
      die Service-Schicht bis zu den konkreten RPC-Einstiegspunkten, die diesen Error
      tatsaechlich ausloesen koennen. Das ist eine Groessenordnung ueber eine Iteration
      hinaus, und `done_when` verlangt ausdruecklich eine belegte, nicht geschaetzte Liste.
      Eine vorherige Iteration hat die Unit vermutlich bereits als zu gross erkannt und ohne
      Journal-Eintrag abgebrochen (Iterationsluecke zwischen den Journal-Eintraegen 8 und 10;
      Status stand seit Iterationsbeginn auf `in_progress` ohne jede Code-Aenderung, `git
      status` war beim Start dieser Iteration clean).
      EMPFEHLUNG: die Unit in eine Scan-Unit (Block D) umwandeln, die je Sentinel-Error die
      aufrufenden RPCs ermittelt und die tatsaechliche Operationenliste als Grundlage fuer
      eine oder mehrere kleinere Fix-Units anlegt, statt Recherche und Spec-Fix in einer
      Unit zu buendeln.
    decided: 2026-08-24
    decision: >-
      BEFUND aus dem 409-Skriptlauf vom 2026-08-24, nicht aus einem Scan. Beim Umstellen der
      Doku-Kette auf `hooks/openapi-status-fill.py` ist eine Luecke aufgefallen, die alle
      zwoelf bereits gemergten Iterationen dieser Arbeit teilen - sie wird hier zum ersten
      Mal festgehalten statt weiter mitgeschleppt.
    coverage_start: "n.a. (Doku-Unit, kein Coverage-Ziel)"
    scope: >
      `grpcStatusToHTTP` (`internal/gateway/helpers.go:51`) bildet `codes.AlreadyExists` auf
      `409 Conflict` ab. Rund 58 Stellen in `internal/server/` geben diesen Code zurueck
      (`grep -rn "codes.AlreadyExists" backend/internal --include=*.go | grep -v _test`).
      Der Drift-Test kann das nicht sehen: `respondGRPCError` steht in `dynamicStatusFuncs`
      (`openapi_status_code_drift_test.go:206-209`), der AST-Walk stoppt dort bewusst, weil
      der Code laufzeitabhaengig ist.
      Folge: der 409-Skriptlauf hat auf diesen Routen `409 -> IdempotencyInFlight`
      dokumentiert. Das ist WAHR (die Middleware kann den Code liefern), aber
      UNVOLLSTAENDIG - dieselbe Route kann auch einen fachlichen Conflict liefern, und in
      OpenAPI gibt es je Operation nur EIN Response-Objekt pro Status-Code.
      Zu tun: die betroffenen Operationen ermitteln (Weg: von den
      `codes.AlreadyExists`-Stellen ueber die RPC zum Gateway-Handler zur Route) und ihren
      409-Eintrag so fassen, dass er beide Faelle nennt. Vermutlich sauberste Loesung: eine
      neue Komponente unter `components/responses`, deren `description` beide Ursachen
      benennt und die auf `ErrorResponse` zeigt wie `IdempotencyInFlight` und `Conflict`
      auch - dann wechseln nur die betroffenen Operationen auf diese Komponente. Vorher
      pruefen, ob das FE den Unterschied ueberhaupt auswertet; tut es das nicht, reicht die
      Beschreibung.
    sources:
      - backend/internal/gateway/helpers.go
      - backend/internal/gateway/openapi_status_code_drift_test.go
      - backend/internal/server/
      - backend/api/openapi.yaml
      - .planning/backend-block/loop/hooks/openapi-status-fill.py
    notes: >
      NICHT die 503 Eintraege aus dem Skriptlauf zurueckdrehen - der
      IdempotencyInFlight-Fall gilt auf jeder dieser Routen weiterhin. Es geht nur um die
      Teilmenge, die ZUSAETZLICH einen fachlichen Conflict kennt.
      Wer das baut, sollte die Zuordnung im Skript hinterlegen (Ausschluss- bzw.
      Sonderliste neben der bestehenden `lean:`-Ausschlussliste), damit ein spaeterer Lauf
      sie nicht wieder ueberschreibt.
    done_when:
      - >-
        Die Liste der Operationen, die sowohl IdempotencyInFlight als auch einen fachlichen
        Conflict liefern koennen, ist ermittelt und im Journal belegt (nicht geschaetzt)
      - Ihr 409-Eintrag nennt beide Ursachen
      - Das Skript kennt die Sonderfaelle, sodass ein spaeterer Lauf sie nicht ueberschreibt
      - "swagger-cli validate gruen"
      - go test -count=1 ./internal/gateway/ gruen
# ==========================================================================================
# BLOCK A2 — der eine loop-fähige G1-Rest und die Funde aus den `offen:`-Zeilen von Lauf 11,
# die nirgends als Unit standen. Jede Prämisse dieses Blocks ist am 2026-08-24 am Code
# gegengeprüft worden. ZWEI GEPLANTE UNITS SIND DABEI ERSATZLOS ENTFALLEN:
#   - "Vendor-Access-Revoke ohne Enforcement-Wirkung" (Lauf 11 Iteration 42) ist KEIN Bug.
#     `internal/security/vendoraccess/service.go:180-186` dokumentiert es als bewusste
#     Entscheidung: "The record is a consent/audit trail for the 'ein Server pro Kunde'
#     delivery model, not an access-control mechanism." Ein Revoke heißt "wir haben die
