      `SUM(CASE WHEN status IN ('sent','paid','overdue') THEN gross_total ELSE 0 END)` über
      ALLE `finance_invoices` eines Tenants im Zeitraum — ohne Currency-Filter oder
      `GROUP BY currency`. Ebenso `:86`, `AVG(...)` über `finance_quotes`. Fremdwährungs-
      Rechnungen entstehen im Produkt heute ausschließlich über wiederkehrende Rechnungen
      (`CreateRecurringInvoiceRequest.currency`, proto `biz.proto:1378` — der einzige
      user-eingebbare Currency-Weg; die Ad-hoc-Erstellung `CreateInvoiceRequest` hat kein
      Currency-Feld). Sobald eine einzige CHF- oder USD-Recurring-Rechnung läuft, verfälscht
      sie die Dashboard-Umsatzkennzahl, ohne dass irgendwo eine Fehlermeldung entsteht.
    sources:
      - backend/internal/biz/dashboard/postgres_repository.go
      - backend/internal/models/finance.go
      - backend/internal/biz/recurring/service.go
    notes: >
      Kein Multi-Currency-Dashboard bauen — das ist die Produktfrage aus Befund 6 unten, nicht
      diese Unit. Der schlanke Fix: entweder nach `currency = 'EUR'` (bzw. Tenant-Default)
      filtern und Fremdwährungsbeträge explizit aus der Kennzahl ausschließen (mit
      `lean:`-Marker "Multi-Currency-Dashboard, wenn Kunde außerhalb EUR bucht"), oder nach
      `currency` gruppieren und die Kennzahl als Map ausgeben. Erst prüfen, was der
      Gateway-Handler/Frontend-Vertrag für `GetDashboardMetrics` heute an Form erwartet
      (`internal/gateway/route_*dashboard*.go`) — ein Wire-Shape-Wechsel von Zahl auf Map wäre
      ein Vertragsbruch und gehört nicht heimlich in diese Unit.
      Test mit einer EUR- und einer CHF-Rechnung im selben Zeitraum, der belegt, dass die
      Kennzahl die CHF-Zeile nicht mehr blind mitaddiert.
    done_when:
