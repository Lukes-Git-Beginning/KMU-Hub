# Backend-Nachtloop — Arbeitsqueue (Lauf 3, 2026-08-01)
#
# Eine Unit = eine Iteration = ein Commit. Reihenfolge ist Absicht: Launch-Kritisches
# und deps-Ketten zuerst, Kleines am Ende als Puffer.
#
# status: todo | in_progress | done | blocked
# model:  sonnet (Default) | opus (architektonisch schwer, Proto, Security, Migration+RLS)
#
# ACHTUNG Treiber-Parsing: `model:` muss VOR `status:` stehen, und hinter `status: todo`
# darf kein Kommentar stehen (der Treiber zaehlt offene Units per Zeilen-Regex).
#
# Laeufe 1+2 (58 Units, alle done): archive/lauf-1-2/BACKLOG.yml
#
# Freigegeben in diesem Lauf: RBAC Phase 1 **Welle 1a**.
# Weiterhin gesperrt: Welle 1b (Rollen-CRUD /admin/roles + Guardrails), Phase 4 (Branchen-BE),
# neue config.RequireX-Assertionen, Scharfschalten neuer modules.*-Flags.

units:

  # ==========================================================================
  # BLOCK A — RBAC Phase 1 Welle 1a (seriell verkettet)
  # Quelle: .planning/backend-block/PHASE-1-RBAC-PLAN.md §3
  # Ergebnis: GET /auth/me/permissions liefert die feinen Capability-Keys mit Scope,
  # das komplette RBAC-Frontend laeuft gegen echtes BE statt Client-Fallback.
  # ==========================================================================

  - id: p1a-proto
    phase: 1a
    service: auth
    model: opus
    deps: []
    status: done
    scope: >
      Neuer RPC `GetEffectivePermissions` am auth-Service in
      `backend/proto/auth/v1/auth.proto`, plus die drei Messages:
      `GetEffectivePermissionsRequest{string user_id = 1}` (leer = aus dem Context, also "me"),
      `EffectiveRole{id, name, is_system, color}`,
      `EffectiveCapability{key, scope, repeated sources}`,
      `GetEffectivePermissionsResponse{repeated EffectiveRole roles, repeated EffectiveCapability capabilities}`.
      Regenerierung im SELBEN Commit.
    sources:
      - .planning/backend-block/PHASE-1-RBAC-PLAN.md
      - backend/proto/auth/v1/auth.proto
    notes: >
      Nur Proto + Regen, keine Implementierung — die kommt in `p1a-grpc`. Der RPC muss im
      generierten `UnimplementedAuthServiceServer` auftauchen; das ist erwartete Boilerplate und
      KEIN Stub-Fund im Sinne des Verify-Vorspanns.
      Regen: `export PATH="$PATH:/c/Program Files/Go/bin:$HOME/go/bin"; cd backend && make proto-auth`
      (exaktes Target im Makefile nachsehen). `.proto` ohne passende `.pb.go`-Aenderung im selben
      Commit ist Fehlerklasse 3.
    done_when:
      - auth.proto enthaelt RPC + 4 Messages
      - passende .pb.go/.grpc.pb.go im selben Commit regeneriert
      - go build -p 2 ./proto/auth/... ./internal/auth/... gruen

  - id: p1a-seed-generator
    phase: 1a
    service: auth
    model: sonnet
    deps: [p1a-proto]
    status: done
    scope: >
      Generator-Script `desktop/scripts/gen-rbac-seed.mjs`. Liest die beiden Frontend-SSOT-Dateien
      und emittiert die SQL-INSERT-Bloecke fuer die Migration in `p1a-migration` nach stdout:
      (a) die fehlenden `permissions`-Zeilen (~279 feine Keys),
      (b) die 4 fehlenden Preset-Rollen,
      (c) die `role_permissions`-Zeilen mit `scope` fuer alle 7 Presets (~828 Grants).
    sources:
      - desktop/src/renderer/src/mocks/data/rbac.ts
      - desktop/src/renderer/src/config/capability-catalog.ts
    notes: >
      SSOT verifiziert vorhanden: `ROLE_DEFS` in `mocks/data/rbac.ts:141`, `CAPABILITY_CATALOG` in
      `config/capability-catalog.ts:72`, `CUSTOM_ROLE_LIMIT = 20` in `rbac.ts:389`.
      Key-Form `modul:subject:action` (z.B. `work:task:edit`) wird auf
      `permissions.name = 'work:task:edit'`, `resource = 'work:task'`, `action = 'edit'` abgebildet —
      Unique `(resource, action)` haelt damit.
      Die ~30 L1-View-Keys (`<modul>:module:view`) stehen NICHT im Katalog, sondern werden per
      `moduleViewKey()` erzeugt — die muss der Generator mit emittieren, sonst fehlt jedem Modul das
      Sichtbarkeits-Recht.
      Abtippen ist keine Option (~1100 Zeilen); der Generator verhindert Drift gegen die SSOT.
      Alle INSERTs mit `ON CONFLICT DO NOTHING`, damit ein Re-Run in Produktion nicht bricht.
      `lean: einmaliger Snapshot; Codegen-in-CI (FE-Katalog -> Seed) wenn der Katalog haeufig driftet.`
    done_when:
      - Script laeuft mit node und gibt valides SQL aus
      - Grant-Zahlen plausibel (admin ~279, manager ~190, member ~105, it_admin ~103, hr_admin ~70, readonly ~70, extern ~11)
      - L1-View-Keys sind enthalten

  - id: p1a-migration
    phase: 1a
    service: auth
    model: opus
    deps: [p1a-seed-generator]
    status: done
    scope: >
      Migration (Nummer zur Laufzeit ermitteln, Repo-Kopf war 000255):
      (a) `roles`: `tenant_id UUID NULL`, `based_on UUID NULL REFERENCES roles(id) ON DELETE SET NULL`,
          `color VARCHAR(40) NOT NULL DEFAULT ''`.
      (b) `DROP INDEX idx_roles_name` und stattdessen
          `CREATE UNIQUE INDEX idx_roles_tenant_name ON roles (COALESCE(tenant_id,'00000000-0000-0000-0000-000000000000'), name)`.
      (c) `role_permissions`: `scope VARCHAR(8) NOT NULL DEFAULT 'all' CHECK (scope IN ('own','team','all'))`.
      (d) RLS auf `roles` und `role_permissions` — siehe notes, das ist der heikle Teil.
      (e) Seed-Output aus `p1a-seed-generator` eingebettet.
      `.up.sql` UND `.down.sql` fuellen.
    sources:
      - .planning/backend-block/PHASE-1-RBAC-PLAN.md
      - backend/migrations/000118_rls_foundation.up.sql
      - backend/migrations/000002_seed_roles_permissions.up.sql
    notes: >
      ZWEI KORREKTUREN AM PLAN — der Plan-Text ist an diesen Stellen falsch, verifiziert gegen
      `migrations/000118_rls_foundation.up.sql:42-79`:

      1. Der Plan schreibt `current_setting('app.current_tenant', true)`. Diesen Namen gibt es in
         KEINER Migration. Das Setting heisst **`app.tenant_id`**, die Helper heissen
         **`current_tenant_id()`** und **`is_system_context()`**.

      2. `roles` darf NICHT ueber `CALL enable_tenant_rls('roles')` laufen. Das Standardmuster ist
         `tenant_id = current_tenant_id() OR is_system_context()` und blendet damit genau die
         System-Presets mit `tenant_id IS NULL` aus — Ergebnis waere 403 fuer ALLE, inklusive Admin.
         Die Policy muss lauten:

             USING (tenant_id IS NULL OR tenant_id = current_tenant_id() OR is_system_context())

         Fuer `role_permissions` analog ueber den `roles`-Join (Muster
         `enable_tenant_rls_via_join` als Vorlage lesen, aber die NULL-Bedingung ergaenzen).

      Preset-Rollen: `admin`/`manager`/`member` existieren seit 000002 und BLEIBEN (ihre IDs sind in
      `user_roles` referenziert) — nur `color` nachtragen. Neu einzufuegen sind die vier
      `it_admin`/`hr_admin`/`readonly`/`extern`. Alle Presets `tenant_id = NULL`; `isSystem` wird
      daraus abgeleitet, keine eigene Spalte.
      Die groben Alt-Permissions bleiben unangetastet und koexistieren — die 812 bestehenden
      `RequirePermission`-Gates duerfen sich durch diese Migration nicht veraendern.
      RLS-Smoke ist Pflicht (siehe `p1a-rls-verify`), aber schon hier einmal fahren.
    done_when:
      - Migration up und down laufen lokal sauber durch
      - kmuhub_app kann die tenant_id-IS-NULL-Presets lesen (nicht null Zeilen)
      - 7 Rollen vorhanden, role_permissions.scope gefuellt
      - bestehende admin/manager/member-Zuordnungen unveraendert

  - id: p1a-resolver
    phase: 1a
    service: auth
    model: opus
    deps: [p1a-migration]
    status: done
    scope: >
      Repository-Methode `GetEffectivePermissions(ctx, userID)` in `internal/auth/postgres_repository.go`
      (JOIN ueber permissions/role_permissions/roles/user_roles, liefert je Zeile
      name, scope, role_id, role_name, color, is_system) plus die Union-Aufloesung im
      **Service** (`internal/auth/service.go`), nicht im Handler.
    sources:
      - .planning/backend-block/PHASE-1-RBAC-PLAN.md
      - backend/internal/auth/postgres_repository.go
    notes: >
      Union-Regel: hat ein User denselben Capability-Key ueber mehrere Rollen, gewinnt der
      **breiteste** Scope (`own` < `team` < `all`). `sources` kumuliert die Namen ALLER beitragenden
      Rollen, nicht nur der gewinnenden. `roles[]` ist die distinct-Liste der Rollen des Users.
      Filter: nur Keys zurueckgeben, die im Katalog stehen — die groben Alt-Permissions
      (`files:write` etc.) gehoeren nicht in die Antwort. Vorab entschieden, nicht neu abwaegen.
      Thick service, thin handler: die gesamte Aufloesung liegt hier, der Handler mappt nur.
      Bestehende `GetUserRoles`/`GetUserPermissions` bleiben unveraendert — Login haengt daran.
    done_when:
      - Unit-Test fuer die Union (Mehrfachrolle, breitester Scope gewinnt, sources kumuliert)
      - DB-Test gegen echte Seeds (admin bekommt ~279 Keys, extern ~11)
      - go build/vet/lint/test gruen

  - id: p1a-grpc
    phase: 1a
    service: auth
    model: sonnet
    deps: [p1a-resolver]
    status: done
    scope: >
      `GetEffectivePermissions` im auth-gRPC-Server implementieren (`internal/server/grpc.go`):
      user_id aus dem Request, bei leerem Feld aus `middleware.GetUserID(ctx)`, Service aufrufen,
      Ergebnis in die Proto-Messages mappen.
    sources:
      - backend/internal/server/grpc.go
    notes: >
      Muster von den Nachbar-RPCs in derselben Datei abschauen. Der bereits existierende
      `CheckPermission`-RPC (`server/grpc.go:203`) ist die naechste Verwandtschaft.
      Kein eigener DB-Zugriff im Handler — nur Service-Aufruf und Mapping.
      Fertig aus `p1a-resolver` (nichts davon neu bauen):
      `svc.GetEffectivePermissions(ctx, uuid.UUID) (*auth.EffectivePermissions, error)` mit
      `EffectivePermissions{Roles []EffectiveRole, Capabilities []EffectiveCapability}`,
      `EffectiveRole{ID uuid.UUID, Name, Color string, IsSystem bool}`,
      `EffectiveCapability{Key, Scope string, Sources []string}` — Reihenfolge ist bereits
      deterministisch (Rollen nach Name, Capabilities nach Key, Sources sortiert), also im Handler
      nicht nachsortieren. Beide Slices sind nie nil.
      Leeres `user_id` im Request -> `middleware.GetUserID(ctx)`; ein nicht parsebares `user_id` ist
      `InvalidArgument`, NICHT stillschweigend uuid.Nil (das laeuft sonst als leere Rechte-Antwort
      durch und ist von "User hat keine Rollen" nicht zu unterscheiden).
    done_when:
      - RPC implementiert, kein Unimplemented mehr
      - Test gegen den Service
      - go build/vet/lint/test gruen

  - id: p1a-gateway
    phase: 1a
    service: gateway
    model: opus
    deps: [p1a-grpc]
    status: done
    scope: >
      Zwei Gateway-Routen in `internal/gateway/route_auth.go`:
      `GET /api/v1/auth/me/permissions` (User aus dem Context) und
      `GET /api/v1/admin/users/{id}/permissions` (Pfad-Parameter, admin-gated).
      Beide ueber den auth-gRPC-Client, plus Eintrag in `backend/api/openapi.yaml` im SELBEN Commit.
    sources:
      - backend/internal/gateway/route_auth.go
      - desktop/src/renderer/src/api/rbac-types.ts
      - desktop/src/renderer/src/mocks/handlers/rbac.ts
    notes: >
      WIRE-SHAPE-FALLE — der haeufigste Fehler an dieser Stelle: die interne Seed-Struktur ist
      `{key: scope}` (nackt), die API-Response aber `{key: {scope, sources}}` (Objekt-Wrapper).
      Zu liefern ist exakt:

          {"permissions": {
            "roles": [{"id": "...", "name": "...", "isSystem": true, "color": "hsl(217 91% 60%)"}],
            "capabilities": {"work:task:edit": {"scope": "team", "sources": ["<role-uuid>","<role-uuid>"]}}
          }}

      KORREKTUR (Fund beim Bau, 2026-08-01): `sources` traegt Rollen-**IDs**, nicht Rollennamen. Die
      urspruengliche Note hier war falsch. Der FE-Typ sagt es explizit (`rbac-types.ts`,
      CapabilityGrant: "Role ids (Role.id)"), der MSW-Mock emittiert `[roleId]`, und
      `EffectivePermissionsView.tsx` loest per `roles.find(r => r.id === src)` auf — mit Namen faellt
      der Provenance-Chip auf den Rohstring zurueck (keine Farbe, kein i18n-Label). Der Resolver aus
      `p1a-resolver` lieferte Namen und wurde in diesem Commit umgestellt.

      Fehlender Key heisst verboten (Default-Deny) — kein Key mit leerem Scope ausliefern.
      Achtung: `roles[]` nutzt hier camelCase (`isSystem`), weil der FE-Typ in `rbac-types.ts` das so
      definiert — gegen die Datei pruefen, nicht raten, und nicht auf snake_case "korrigieren".
      Handler geht ueber `getAuthClient()`, niemals ueber eine direkt injizierte Service-Instanz
      (Fehlerklasse 1, RLS-Bypass).
      Kein neuer `RequirePermission`-Guard fuer `/auth/me/permissions` — jeder eingeloggte User darf
      seine eigenen Rechte lesen. Fuer die admin-Route einen BESTEHENDEN Guard verwenden
      (`RequireRole("admin")` wie bei den Nachbar-Routen), damit kein Seed noetig wird.
      TENANT-PRUEFUNG AUF DER ADMIN-ROUTE ist Pflicht (Fund aus `p1a-resolver`): `user_roles` hat
      weder `tenant_id` noch RLS, der Resolver filtert also nur die Rollen, nicht die Zugehoerigkeit
      des Ziel-Users. Mit fremder `{id}` liefert er die Preset-Rollen eines fremden Tenant-Users
      aus. Der Handler muss den Ziel-User zuerst ueber `GetUserByID` holen — die users-RLS wirft
      einen fremden Tenant dort raus, das ergibt sauber 404. Ohne diesen Schritt ist die Route ein
      tenant-uebergreifendes Leseleck.
      `go test ./internal/gateway/` ist Pflicht (TestOpenAPIRouteDrift).
    done_when:
      - Beide Routen liefern die Shape oben
      - openapi.yaml-Eintraege im selben Commit, TestOpenAPIRouteDrift gruen
      - go build/vet/lint/test gruen

  - id: p1a-rls-verify
    phase: 1a
    service: auth
    model: sonnet
    deps: [p1a-gateway]
    status: done
    scope: >
      Abschluss-Verifikation der Welle: RLS-Smoke gegen `roles`/`role_permissions` als `kmuhub_app`
      plus ein DB-Test, der beweist, dass ein normaler Tenant-User eine NICHT-LEERE Capability-Menge
      bekommt.
    sources:
      - .planning/backend-block/loop/GATE-COMMANDS.md
    notes: >
      Das ist die wichtigste Verifikation der ganzen Welle. Wenn die Policy die `tenant_id IS NULL`-
      Presets ausblendet, bekommt in Produktion JEDER User 403 — und der Fehler ist von aussen nicht
      von "keine Rechte vergeben" zu unterscheiden.
      `kmuhub_app` ist NOSUPERUSER NOBYPASSRLS; unter `kmuhub` (Superuser mit BYPASSRLS) beweist der
      Test nichts.
      Bestanden heisst: Presets unter fremdem Tenant sichtbar (weil `tenant_id IS NULL`), Custom-Rollen
      eines fremden Tenants NICHT sichtbar, und die aufgeloeste Capability-Menge eines Users mit
      Rolle `member` ist nicht leer. Zwei Nullen sind ein kaputter Test, kein Beweis.
    done_when:
      - RLS-Smoke dokumentiert im Journal mit den konkreten Zeilenzahlen
      - DB-Test "member bekommt nicht-leere Capabilities" gruen
      - go test ./internal/auth/... ./internal/gateway/... gruen

  # ==========================================================================
  # BLOCK C — E-Rechnung Ausgang (Welle 5 des BACKEND-LAUNCH-PLAN)
  # Gesetzlich launch-kritisch. Heute existiert NUR der Eingangs-Parser.
  # Prereq erfuellt: finance_invoice_lines seit Migration 000132/000133.
  # ==========================================================================

  - id: w5-ubl-generator
    phase: 5
    service: einvoice
    model: opus
    deps: []
    status: done
    scope: >
      XRechnung-UBL-2.1-Generator: aus einer Rechnung (`finance_invoices` + `finance_invoice_lines`)
      ein valides UBL-`Invoice`-XML nach EN 16931 erzeugen. Neue Datei
      `internal/biz/einvoice/generator_ubl.go`.
    sources:
      - backend/internal/biz/einvoice/parser.go
      - docs/BACKEND-LAUNCH-PLAN.md
    notes: >
      LEAN: die UBL-Structs existieren bereits in `parser.go:315ff` fuer die Leserichtung. Dieselben
      Typen fuer die Schreibrichtung wiederverwenden (`encoding/xml` marshalt sie in beide
      Richtungen), NICHT neu definieren. Wo ein Feld fuers Schreiben fehlt, das bestehende Struct
      erweitern — der Parser darf davon nicht brechen.
      Keine neue Dependency. `encoding/xml` aus der Stdlib reicht.
      Pflichtfelder EN 16931 (BT-Nummern): Rechnungsnummer, Ausstellungsdatum, Waehrung, Verkaeufer
      inkl. USt-ID, Kaeufer, Leitweg-ID (BT-10, fuer XRechnung an oeffentliche Auftraggeber),
      Positionen mit Menge/Einzelpreis/Steuersatz, Steueraufschluesselung, Gesamtsummen.
      Betraege als Dezimalzeichenkette mit zwei Nachkommastellen, nie als Float formatiert.
      Diese Unit erzeugt nur das XML. Validierung ist `w5-en16931-validation`, die Route `w5-route`.
    done_when:
      - Generator erzeugt UBL-XML aus einer Testrechnung mit mehreren Positionen und Steuersaetzen
      - Test: erzeugtes XML durch den bestehenden ParseUBL wieder einlesbar, Summen identisch
      - go build/vet/lint/test gruen

  - id: w5-cii-generator
    phase: 5
    service: einvoice
    model: opus
    deps: [w5-ubl-generator]
    status: done
    scope: >
      ZUGFeRD-/Factur-X-Generator (CII, `CrossIndustryInvoice`, EN 16931 Profil EN16931/Comfort)
      in `internal/biz/einvoice/generator_cii.go`, analog zum UBL-Generator.
    sources:
      - backend/internal/biz/einvoice/parser.go
    notes: >
      SCOPE-KORREKTUR (Fund aus `w5-ubl-generator`, 2026-08-01): **Ein CII-Generator existiert
      bereits** — `internal/biz/pdf/zugferd.go:27 GenerateZUGFeRDXML(models.Invoice,
      models.CompanySettings)`, vollstaendig mit EN16931-Profil-URN, BG-23-Steueraufschluesselung
      und den drei Tax-Modi. Diese Unit ist deshalb **Zusammenfuehrung, kein Neubau**: den
      Generator auf `buildInvoiceDoc` aus `internal/biz/einvoice/generator_doc.go` umstellen, damit
      die Betragslogik nur einmal existiert. Nicht daneben einen zweiten CII-Writer bauen.

      Der Bestand schreibt CII per `fmt.Sprintf`-Template mit manuellem `xmlEscape`, der neue
      UBL-Writer per `encoding/xml` mit Praefix-Tags (`xml:"cbc:ID"` -> `<cbc:ID>`, verifiziert).
      Der encoding/xml-Weg ist der bessere (Escaping automatisch, typsicher) — Umstellung ist
      moeglich, aber optional; die Vereinheitlichung der Betragslogik ist der Pflichtteil.

      ZWEI ABWEICHUNGEN, die beim Zusammenfuehren zu klaeren sind (UBL-Seite ist die korrektere):
      (a) Der Bestand nimmt fuer die Steuerbasis `Quantity*UnitPrice`, schreibt als Zeilenbetrag
          aber `item.LineTotal` — divergieren die, verletzt das erzeugte Dokument BR-S-08.
          `buildInvoiceDoc` leitet beides aus derselben Zahl ab.
      (b) Der Bestand nutzt im Standardmodus immer CategoryCode `S`, auch bei 0 % (formal
          ungueltig); `buildInvoiceDoc` vergibt dort `Z`.
      Ausserdem prueft `assertTotalsMatch` bereits, dass die gespeicherten Summen zu den Zeilen
      passen — bei der Umstellung faellt dieser Schutz dem PDF-Pfad mit zu, also
      `pdf.GenerateZUGFeRDInvoicePDF`-Tests mitlaufen lassen.

      Alt (weiterhin gueltig): die CII-Structs aus `parser.go:102ff` fuer die Leserichtung
      nicht duplizieren.
    done_when:
      - CII-Generator nutzt buildInvoiceDoc, Betragslogik existiert genau einmal
      - Generator erzeugt CII-XML, durch ParseCII wieder einlesbar, Summen identisch
      - ./internal/biz/pdf/... und ./internal/biz/einvoice/... gruen
      - go build/vet/lint/test gruen

  - id: w5-en16931-validation
    phase: 5
    service: einvoice
    model: opus
    deps: [w5-cii-generator]
    status: done
    scope: >
      Pflichtfeld-Validierung vor der Ausgabe: pruefen, ob eine Rechnung die EN-16931-Pflichtfelder
      traegt, und bei Verstoss eine vollstaendige Fehlerliste zurueckgeben statt still ein
      unvollstaendiges Dokument zu erzeugen.
    sources:
      - backend/internal/biz/einvoice/errors.go
    notes: >
      ANSATZPUNKT (Fund aus `w5-cii-generator`, 2026-08-01): Die Validierung gehoert auf
      `invoiceDoc` aus `internal/biz/einvoice/generator_doc.go`, NICHT auf `models.Invoice`. Das
      neutrale Modell traegt bereits Steuerkategorien, die BG-23-Gruppen und die neu berechneten
      Summen, und beide Ausgabeformate durchlaufen es — eine Pruefung dort gilt automatisch fuer
      XRechnung UND ZUGFeRD. Auf `models.Invoice` geprueft muesste man die Ableitungen ein zweites
      Mal nachbauen, und genau das war der Fehler, den `w5-cii-generator` gerade beseitigt hat.
      `buildInvoiceDoc` lehnt heute schon ab: leere Rechnungsnummer (BT-1), fehlendes
      Ausstellungsdatum (BT-2), keine Positionen (BG-25), unparsebare Positionen, Summen-Drift.
      Diese Faelle NICHT doppeln — die Validierung ergaenzt die Felder, die ein Dokument formal
      erzeugbar, aber beim Empfaenger unzustellbar machen.

      Der Fehlerfall ist der wichtige: eine E-Rechnung, die beim Empfaenger abgelehnt wird, faellt
      dem Kunden erst Wochen spaeter auf. Deshalb ALLE fehlenden Felder auf einmal melden (Liste),
      nicht beim ersten abbrechen — sonst klickt sich der Nutzer einzeln durch.
      Typische Luecken im Bestand: fehlende USt-ID des Verkaeufers, fehlende Leitweg-ID,
      Position ohne Steuersatz, Rechnung ohne Faelligkeitsdatum.
      Keine externe Validator-Dependency (KoSIT ist Java). Pflichtfeld-Pruefung in Go, mit
      `lean:`-Marker und Upgrade-Trigger "wenn Kunden formale Schema-Validierung fordern".
    done_when:
      - Validierung liefert alle Verstoesse einer unvollstaendigen Rechnung auf einmal
      - vollstaendige Rechnung passiert ohne Fehler
      - go build/vet/lint/test gruen

  - id: w5-pdfa3-embed
    phase: 5
    service: einvoice
    model: opus
    deps: [w5-en16931-validation]
    status: done
    scope: >
      ZUGFeRD-Auslieferung als PDF/A-3 mit eingebettetem CII-XML — ABER zuerst pruefen, ob das mit
      der vorhandenen Toolchain ohne neue Dependency geht.
    sources:
      - backend/internal/biz/pdf/generator.go
    notes: >
      VORBEFUND (aus `w5-ubl-generator`, 2026-08-01): Eine Einbettung existiert bereits —
      `pdf.EmbedZUGFeRDXML` (`internal/biz/pdf/zugferd.go:261`) haengt das XML per
      **pdfcpu v0.6.0 `api.AddAttachments`** an; pdfcpu ist also schon im Modulgraph, eine neue
      Dependency ist fuer den Anhang-Teil nicht noetig. Offen bleibt nur die PDF/A-3b-Konformitaet
      (Relationship `/Alternative`, XMP-Metadaten) — pdfcpu haengt die Datei an, deklariert sie aber
      nicht als Factur-X-Alternative.
      ZWEITER FUND, wichtiger: `EmbedZUGFeRDXML` **verschluckt jeden Fehler** und gibt bei
      Misserfolg das PDF OHNE Anhang zurueck (drei `slog.Warn`-Pfade) — der Aufrufer kann eine
      ZUGFeRD-Rechnung ohne XML nicht von einer mit unterscheiden. Und der einzige Test dafuer
      (`TestExtractXMLFromPDF_HappyPath`) **skippt still**, weil das Stub-PDF fuer pdfcpu unlesbar
      ist; die Einbettung ist damit faktisch ungetestet. Beides in dieser Unit adressieren:
      Fehler nach oben geben statt still zu degradieren, und den Test gegen ein echtes
      maroto-erzeugtes PDF fahren statt gegen den Stub.
      NACHTRAG (aus `w5-cii-generator`, 2026-08-01), drei Randbedingungen:
      (a) Die Import-Richtung ist jetzt fest `pdf` -> `einvoice` (GenerateZUGFeRDXML delegiert an
          `einvoice.GenerateCII`). Ein Test in `package einvoice`, der `pdf` importiert, schliesst
          einen Zyklus — `pdf_extract_test.go` liegt deshalb bereits in `package einvoice_test`.
          Der geforderte Test gegen ein echtes maroto-PDF gehoert am besten nach `internal/biz/pdf`.
      (b) `GenerateZUGFeRDInvoicePDF` (`pdf/generator.go:281`) hat **keinen einzigen Test** —
          der komplette PDF-plus-XML-Pfad ist unabgedeckt, nicht nur die Einbettung.
      (c) `server/biz_grpc.go:1365` faengt heute JEDEN Generierungsfehler ab und liefert
          stillschweigend das PDF ohne XML aus. Wird `EmbedZUGFeRDXML` hart gemacht, muss dieser
          Aufrufer mit — sonst ist der neue Fehlerpfad von aussen weiterhin unsichtbar.
      NACHTRAG (aus `w5-en16931-validation`, 2026-08-01): durch diesen Aufrufer laeuft jetzt ein
      DRITTER Fehlertyp — `*einvoice.ValidationError` mit der vollstaendigen Verstossliste. Genau
      die ist fuer den Nutzer die brauchbare Information ("USt-ID fehlt", "Position 2 ohne
      Bezeichnung") und verschwindet heute in einem `slog.Error`. Beim Hartmachen die Liste
      hochreichen, nicht nur den Fehler durchreichen.

      ENTSCHEIDUNGSPUNKT, nicht blind bauen. `internal/biz/pdf/generator.go` nutzt maroto/v2. Pruef
      zuerst, ob maroto/v2 (bzw. das darunterliegende gofpdf/pdfcpu, falls schon im Modulgraph)
      PDF/A-3-Konformitaet und Datei-Anhaenge kann.
      - Geht es: PDF/A-3b mit eingebettetem `factur-x.xml`, Relationship `/Alternative`.
      - Geht es NICHT: KEINE neue Dependency aufnehmen. Stattdessen reines XML ausliefern, die Route
        akzeptiert dann `format=zugferd` als XML-Antwort, und ein `lean:`-Kommentar haelt den
        Upgrade-Trigger fest ("PDF/A-3-Einbettung, sobald ein Kunde ZUGFeRD als PDF verlangt").
        Das ist ein vollstaendiges Ergebnis, kein Teilausfall — XRechnung ist ohnehin reines XML.
      Was auch immer du entscheidest: die Begruendung gehoert ins Journal.
    done_when:
      - Entscheidung getroffen und im Journal begruendet
      - Bei PDF/A-3: Anhang aus dem erzeugten PDF wieder extrahierbar (Test)
      - Bei Fallback: lean:-Marker mit Upgrade-Trigger im Code
      - keine neue Dependency in go.mod

  - id: w5-route
    phase: 5
    service: gateway
    model: sonnet
    deps: [w5-pdfa3-embed]
    status: done
    scope: >
      `POST /api/v1/finance/invoices/{id}/erechnung` mit Format-Parameter
      (`xrechnung` | `zugferd`), Route im Gateway ueber den zustaendigen gRPC-Client,
      openapi.yaml-Eintrag im selben Commit.
    sources:
      - backend/internal/gateway/route_finance.go
      - backend/api/openapi.yaml
    notes: >
      EINSTIEGSPUNKTE (aus `w5-cii-generator`, 2026-08-01): `einvoice.GenerateUBL(invoice,
      settings, buyerReference)` fuer `xrechnung`, `einvoice.GenerateCII(...)` fuer `zugferd` —
      beide mit derselben Signatur. Der dritte Parameter ist die Leitweg-ID (BT-10), die kein Feld
      in `finance_invoices` hat; sie muss als Request-Parameter durchgereicht oder am Kontakt
      hinterlegt werden (offene Entscheidung, siehe Journal-Eintrag zu `w5-ubl-generator`).
      Beide geben `ErrGenerateFailed` bzw. `ErrTotalsMismatch` zurueck — beides ist 422 mit
      lesbarer Meldung, NICHT 500 und keinesfalls ein stiller Fallback: `server/biz_grpc.go:1365`
      macht genau das im PDF-Pfad und verdeckt damit, dass gar kein XML entstanden ist.
      VALIDIERUNG (fertig aus `w5-en16931-validation`, 2026-08-01, nichts davon neu bauen):
      `GenerateUBL`/`GenerateCII` pruefen intern gegen `einvoice.ProfileEN16931` und geben bei
      Verstoss `*einvoice.ValidationError` zurueck (`errors.Is(err, einvoice.ErrValidationFailed)`,
      Details per `errors.As`: `ve.Violations[]{Rule, Term, Message}`). Das ist der 422-Fall — die
      GANZE Liste ausliefern, nicht nur den ersten Eintrag, sonst klickt sich der Nutzer einzeln
      durch. `ErrGenerateFailed`/`ErrTotalsMismatch` sind ebenfalls 422, aber ein anderer Fall.
      Die strengeren deutschen CIUS-Regeln liegen bewusst NICHT im Generator: ob der Empfaenger ein
      oeffentlicher Auftraggeber ist, weiss nur die Route. Kommt eine Leitweg-ID im Request mit,
      vorher `einvoice.Validate(inv, settings, buyerReference, einvoice.ProfileXRechnung)` fahren —
      das prueft zusaetzlich BT-10, die Zahlungsangaben (BG-16) und die zerlegten Postanschriften.
      Ohne Leitweg-ID bleibt es bei EN 16931, sonst waere B2B-XRechnung nicht mehr erzeugbar.
      Bestehenden Permission-Guard des Rechnungs-Moduls wiederverwenden, keinen neuen einfuehren
      (sonst Seed-Pflicht). Format-Parameter serverseitig validieren, unbekanntes Format 422.
      404 wenn die Rechnung dem Tenant nicht gehoert — tenant-gescopter Read, nicht nur RLS.
      Alle Status-Codes dokumentieren, die der Handler wirklich liefert (auch 422 fuer
      unvollstaendige Rechnungen aus `w5-en16931-validation`).
      `go test ./internal/gateway/` ist Pflicht (TestOpenAPIRouteDrift).
      NACHTRAG (aus `w5-pdfa3-embed`, 2026-08-01), vier Punkte, die dir Arbeit sparen:
      (a) FORM DES ZUGFERD-ERGEBNISSES ist entschieden: PDF mit eingebettetem, korrekt deklariertem
          `factur-x.xml` (kein PDF/A-3b — Begruendung im Journal). `pdf.NewGenerator(settings).
          GenerateZUGFeRDInvoicePDF(inv)` liefert das fertige PDF; nichts davon neu bauen.
          Content-Type `application/pdf` fuer zugferd, `application/xml` fuer xrechnung.
      (b) `mapBizError` (internal/server/biz_grpc.go) kennt jetzt `ErrValidationFailed`,
          `ErrGenerateFailed` und `ErrTotalsMismatch` und macht daraus `FailedPrecondition` mit der
          vollstaendigen Verstossliste im Text. Der Gateway-Mapper uebersetzt das nach **409**,
          nicht 422 — `grpcStatusToHTTP` hat kein 422. Entweder 409 uebernehmen (dann in openapi.yaml
          409 dokumentieren, so wie es die `/pdf`-Route jetzt tut) oder bewusst einen eigenen
          422-Pfad im Handler bauen. NICHT raten, eins von beiden begruenden.
      (c) Der stille Fallback in `GenerateZUGFeRDInvoicePDF` (RPC) ist weg — ein Fehler kommt jetzt
          als Fehler an. Kein `slog.Error` + Ersatz-PDF mehr nachbauen.
      (d) `models.Invoice` hat weiterhin kein Leitweg-ID-Feld; die offene Entscheidung bleibt.
    done_when:
      - Route liefert XRechnung-XML und ZUGFeRD in der in w5-pdfa3-embed entschiedenen Form
      - Content-Type und Dateiname korrekt gesetzt
      - openapi.yaml im selben Commit, TestOpenAPIRouteDrift gruen

  - id: w5-roundtrip-test
    phase: 5
    service: einvoice
    model: sonnet
    deps: [w5-route]
    status: done
    scope: >
      Ende-zu-Ende-Test: Rechnung anlegen, ueber die neue Route exportieren, das Ergebnis durch den
      bestehenden Eingangs-Import (`Service.Import`) zurueckspielen und Betraege, Positionen und
      Steueraufschluesselung vergleichen.
    sources:
