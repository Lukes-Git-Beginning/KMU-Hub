    service: biz
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/biz/datev 79,3 % (CI-Stand 8c224eba, Run 31471247645)"
    scope: >
      `PostgresUploadRepository.UpsertUploadConfig` und `.CreateUploadLog`
      (internal/biz/datev/postgres_upload_repo.go:42 bzw. :63) INSERTen in `datev_upload_configs`
      bzw. `datev_upload_log`, OHNE die Spalte `tenant_id` zu setzen -- weder in der Spaltenliste
      noch im `VALUES`-Teil. Beide Tabellen tragen seit Migration 000115 `tenant_id UUID NOT NULL`
      OHNE Spalten-Default (verifiziert per `\d` gegen die lokale DB, Kopf 309: `Default` bei
      `tenant_id` ist leer) und seit Migration 000122 RLS mit `FORCE ROW LEVEL SECURITY`. Kein
      Trigger setzt `tenant_id` automatisch nach -- beide Modelle (`models.DatevUploadConfig`,
      `models.DatevUploadLog`) haben nicht einmal ein `TenantID`-Feld. Jeder Aufruf schlaegt
      unveraendert mit `ERROR: null value in column "tenant_id" ... violates not-null constraint`
