    notes: >
      Der Roundtrip ist der einzige Test, der beweist, dass Ausgang und Eingang dieselbe Semantik
      haben. Beide Formate abdecken.
      Eigene Tenants seeden, nicht die geteilten Konstanten TenantA/TenantB verwenden — sonst
      kollidiert der Test unter `t.Parallel()` mit Bestandstests an Unique-Constraints (real
      passiert in Nachtlauf 1, siehe GATE-COMMANDS.md).
      NACHTRAG (aus `w5-route`, 2026-08-01): der einzige Weg, das erzeugte Dokument in dieser Unit
      zu bekommen, ist der neue RPC `BizGRPCServer.GenerateEInvoice(ctx,
      &bizv1.GenerateEInvoiceRequest{Id, TenantId, Format, BuyerReference})` — kein
      Gateway-Test hat das Erzeugnis bisher inhaltlich geprueft (nur ServiceUnavailable/400 vor dem
      gRPC-Call, siehe `route_biz_test.go`). `Format` ist `"xrechnung"` oder `"zugferd"`,
      `BuyerReference` ist BT-10 und wirkt nur bei xrechnung (bei zugferd immer ignoriert, siehe
