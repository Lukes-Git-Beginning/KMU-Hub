  - id: fix-gdpr-deletion-request-audit-trail-cascade-loss
    phase: 3
    service: security
    model: sonnet
    deps: []
    status: todo
    coverage_start: "internal/crm/consent (zur Laufzeit messen)"
    scope: >
      `gdpr_deletion_requests.contact_id` traegt `ON DELETE CASCADE` (Befund 2 im Laufkopf, keine
      Korrektur noetig, aber der Kopf klaerte nicht die Erreichbarkeit — das leistet diese Unit).
      `consent.Service.ProcessDeletion` (der einzige Weg, wie eine `gdpr_deletion_requests`-Zeile
      auf "completed" gesetzt wird) LOESCHT den Kontakt nie, sondern anonymisiert ihn nur
      (`AnonymizeContact`) — der Kontakt bleibt als Zeile bestehen. Der Primary-Kontakt kann
      danach trotzdem ueber einen ZWEITEN, unabhaengigen Pfad hart geloescht werden:
      `contact.Service.Delete` (manuell) oder — automatisiert und damit der wahrscheinlichere
      Ausloeser — `ContactRetentionHandler.Apply` mit `action=delete`
      (`retention_contacts.go:110-116`), die keine Pruefung auf existierende
      `gdpr_deletion_requests`-Zeilen kennt. Der CASCADE loescht dann die abgeschlossene
      Auskunfts-/Loeschanfrage MIT — genau der Nachweis, dass eine Art.-17-Anfrage bearbeitet
      wurde, verschwindet zusammen mit dem Datensatz, den sie betraf. Das ist ein
      Compliance-Nachweis-Verlust (Art. 5 Abs. 2 Rechenschaftspflicht), kein UI-Sackgassen-Fall,
      und deshalb explizit ausserhalb des RESTRICT/NO-ACTION-Rahmens dieses Scans, aber vom
      Backlog-Kopf ausdruecklich hierher verwiesen.
