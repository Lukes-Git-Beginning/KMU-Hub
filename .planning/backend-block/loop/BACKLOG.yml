  - id: fix-inventar-inventur-counted-and-movement-type
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/gateway 74,3 %"
    scope: >
      Inventur und Bewegungen sind für jeden Nutzer fehlerhaft. (1) `InventurCount.counted` ist
      `optional int64` (`inventar.proto:383`); "noch nicht gezählt" ist im protojson ein FEHLENDES
      Feld. Das FE prüft `counted === null` / `!== null` (`InventarPage.tsx:569/575/610-615/692/714`);
      `undefined !== null` -> jede ungezählte Position gilt als gezählt, Differenzsumme NaN, Zelle
      leer. Fix am Gateway: Sessions und Counts handgebaut schreiben, `counted` als `null` wenn
      nicht gesetzt, `expected` und `counts` immer ausgeben (`counts: []`). (2) Bestand 0 fehlt im
      JSON (`quantity`, `min_quantity` bei Artikeln): `Number(undefined)` = NaN, Artikel mit
      Bestand 0 sind nie "kritisch" (`InventarPage.tsx:917`). Zahlenfelder immer ausgeben (gegen
      `inventar-types.ts` prüfen, ob Zahl oder Zahl-String). (3) Der Bewegungs-Dialog bietet
      `transfer` (`InventarPage.tsx:433/445-450`), der Validator erlaubt `in out adjustment`
      (`route_inventar.go:203`) -> 400. Prüfen, ob der Service `transfer` kann (es gibt
      `POST /transfer`); wenn ja `transfer` annehmen und auf den Transfer-Pfad leiten, sonst als
      FE-Thema nach BACKLOG-NEXT.yml.
