  - id: fix-banking-import-race-returns-raw-pg-error
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: done
    coverage_start: "n.a. (Verhaltensfund aus cov-banking-repository-real-sql, Lauf 11 Iteration 34)"
    scope: >
      Befund aus der Coverage-Arbeit an `banking/postgres_repository.go`. `Service.Import`
      (`service.go:71-89`) macht den Re-Import derselben Datei nur im SEQUENZIELLEN Fall
      elegant: `GetStatementByHash` findet die vorhandene Zeile, und die Funktion gibt
      `AlreadyImported: true` zurueck. Der Kommentar direkt darueber sagt es selbst: "two
      uploads arriving at once would both pass a check-then-write" — der eigentliche
      Schutz ist die UNIQUE-Constraint `finance_bank_statements_hash_unique
      (tenant_id, content_hash)`, nicht der Lookup davor.
      Trifft die Constraint zu (zwei nahezu gleichzeitige Uploads derselben Datei, oder
      ein doppelt gefeuerter Frontend-Request), scheitert `CreateStatement`
      (`postgres_repository.go:100`) mit einem rohen, nur gewrappten
      Unique-Violation-Fehler ("insert statement: ERROR: duplicate key ... 23505") — anders
      als `CreateAccount`/`UpdateAccount` in `postgres_repository_accounts.go`, die den
      Konflikt ueber `isAccountIBANConflict` (Constraint-Name-Check) auf `ErrAccountExists`
      abbilden. `Service.Import` faengt diesen Fall nicht ab und gibt ihn als
      `fmt.Errorf("create statement: %w", err)` weiter — der Nutzer sieht einen 500 statt
      der erwarteten "bereits importiert"-Antwort. Kein Datenverlust und keine doppelte
      Buchung (die Constraint haelt, per
      TestPostgresRepository_CreateStatement_DuplicateContentHashIsRejectedNotDuplicated
      belegt) — nur eine haessliche Fehlerantwort in einem seltenen Race-Fenster.
    sources:
      - backend/internal/biz/banking/service.go
      - backend/internal/biz/banking/postgres_repository.go
      - backend/internal/biz/banking/postgres_repository_accounts.go
      - backend/internal/biz/banking/postgres_repository_statements_and_matches_real_sql_test.go
    notes: >
      Vorlage ist `isAccountIBANConflict` (Constraint-Name statt bloßer SQLSTATE, damit ein
      spaeterer zweiter Unique-Index nicht faelschlich hierher faellt): eine
      `isStatementHashConflict(err) bool` pruefend auf `pgErr.ConstraintName ==
      "finance_bank_statements_hash_unique"`, in `CreateStatement` gegen einen neuen
      Sentinel `ErrStatementHashConflict` (Analog zu `ErrAccountExists`) gemappt.
      `Service.Import` faengt `ErrStatementHashConflict` danach genauso wie den
      `ErrStatementNotFound`-Nichttreffer: bei Konflikt `GetStatementByHash` erneut lesen
      und `AlreadyImported: true` zurueckgeben statt den Fehler durchzureichen.
      Mutations-Probe: den Constraint-Namen-Check testweise auf einen falschen String
      setzen, ein Test muss rot werden.
    done_when:
      - CreateStatement mappt die Unique-Violation auf (tenant_id, content_hash) ueber den
        Constraint-Namen auf einen Sentinel, analog zu isAccountIBANConflict
      - Service.Import faengt diesen Sentinel ab und liefert AlreadyImported: true statt
        den Fehler durchzureichen
      - Ein Test treibt zwei nahezu gleichzeitige CreateStatement-Aufrufe (oder ruft
        Service.Import zweimal ueber goroutines) mit identischem Hash und belegt, dass
        beide Aufrufer eine gueltige ImportResult-Antwort bekommen, keiner einen 500
      - go test -count=1 ./internal/biz/banking/ gruen, DATABASE_URL gegen kmuhub_app

  - id: fix-invoice-number-unique-index-blocks-second-draft
    phase: 4
    service: biz
    model: opus
    deps: []
    status: done
    coverage_start: "n.a. (Verhaltensfund aus cov-recurring-generation-run-real-sql, Lauf 11 Iteration 38)"
    scope: >
      Verifizierter Produktionsbug, gefunden beim Bau von echten SQL-Tests fuer
      `recurring.Service.Generate`. `finance_invoices.invoice_number` ist
      `VARCHAR(30) NOT NULL DEFAULT ''` (`migrations/000045_create_finance_tables.up.sql:75`)
      — ein Entwurf traegt also immer den leeren String, nicht NULL, bis `Send` eine echte
      Nummer vergibt. Der Unique-Index `idx_finance_invoices_number ON
      finance_invoices(tenant_id, invoice_number)` (Zeile 184) ist NICHT partiell (kein
      `WHERE invoice_number <> ''`). Folge: EIN Tenant kann zu jedem Zeitpunkt hoechstens
      EINEN unversendeten Entwurf haben — ein zweiter `Create`-Aufruf (egal ob manuell,
      aus einem zweiten wiederkehrenden Zeitplan, aus einer Quote-Konversion oder aus
      einem zweiten `recurring.Generate`-Lauf fuer eine andere, noch offene Periode
      derselben Rechnung) schlaegt mit einem rohen Postgres-Fehler fehl:
      `insert finance_invoices: ERROR: duplicate key value violates unique constraint
      "idx_finance_invoices_number" (SQLSTATE 23505)` — kein sprechender Anwendungsfehler,
      ein 500 in der API.
      Live reproduziert (nicht nur gelesen): ein Test, der fuer denselben Tenant zwei
      unabhaengige `recurring.Service.Generate`-Perioden nacheinander erzeugte (ohne die
      erste zwischendurch zu versenden), scheiterte genau an diesem Constraint —
      `internal/biz/recurring/service_db_test.go` (Iteration 38) musste dafuer die erste
      Rechnung testweise ueber `invSvc.Send` versenden, um den echten Bug zu umgehen; siehe
      Kommentar dort und in `newRealService`.
      `finance_quotes.quote_number` und `finance_credit_notes.credit_note_number` tragen
      denselben Default-Musterfehler (`NOT NULL DEFAULT ''`), haben aber KEINEN Unique-Index
      auf die Nummer — geprueft per `pg_indexes` gegen die lokale DB, 2026-08-23. Nur
      `finance_invoices` hat den Index und ist damit betroffen.
    sources:
      - backend/migrations/000045_create_finance_tables.up.sql
      - backend/internal/biz/invoice/service.go
      - backend/internal/biz/invoice/postgres_repository.go
      - backend/internal/biz/recurring/service_db_test.go
    notes: >
      ROOT CAUSE ist die Migration, nicht der Go-Code — `Create` setzt `InvoiceNumber: ""`
      ganz bewusst (`service.go:213`, Kommentar "Assigned when sent"), das ist korrekt so.
      Der schlanke Fix ist eine neue Forward-Migration, die den bestehenden Index durch
      einen partiellen ersetzt: `DROP INDEX idx_finance_invoices_number;
      CREATE UNIQUE INDEX idx_finance_invoices_number ON finance_invoices(tenant_id,
      invoice_number) WHERE invoice_number <> '';` — leere Strings sind dann beliebig oft
      erlaubt, echte Nummern bleiben pro Tenant eindeutig. `.down.sql` muss den Original-
      Index (ohne WHERE) wiederherstellen; VORHER pruefen, ob in Produktion inzwischen
      bereits mehrere Zeilen mit leerem `invoice_number` pro Tenant existieren (sollte laut
      Bug unmoeglich sein, ist aber vor einer produktiven Migration zu verifizieren, nicht
      anzunehmen).
      Migrationskopf zur Laufzeit ermitteln (`ls backend/migrations | grep -E
      "^[0-9]{6}" | sort | tail -1`), NICHT die hier genannte Nummer 000045 uebernehmen.
      Nach der Migration: `internal/biz/recurring/service_db_test.go` kann den
      `invSvc.Send`-Workaround in `TestGenerate_RealSQL_MonthEndScheduleStaysAnchored`
      wieder entfernen (mit Kommentar-Verweis auf diese Unit) — das ist ein optionales
      Aufraeumen, kein Muss.
    done_when:
      - Der Unique-Index auf finance_invoices(tenant_id, invoice_number) ist partiell
        (WHERE invoice_number <> ''), per neuer Forward-Migration mit gefuellter .down.sql
      - Ein Test belegt: zwei Create()-Aufrufe fuer denselben Tenant, beide Entwuerfe ohne
        Nummer, gelingen beide (kein Unique-Violation-Fehler mehr)
      - Ein Test belegt: zwei ECHTE Nummern fuer denselben Tenant bleiben weiterhin
        eindeutig (der Schutzzweck des Index ist nicht verloren gegangen)
      - Produktionsdaten sind vor der Migration auf bereits vorhandene Mehrfach-Leerstrings
        pro Tenant geprueft, Ergebnis im Journal
      - go test -count=1 ./internal/biz/invoice/ ./internal/biz/recurring/ gruen,
        DATABASE_URL gegen kmuhub_app

  - id: feat-vendor-access-audit-trail
    phase: 4
    service: security
    model: sonnet
    deps: []
    status: done
    coverage_start: "n.a. (kein Coverage-Ziel, Verhaltensaenderung)"
    scope: >
      Gefunden in cov-gateway-security-vendor-access-routes (Lauf 11, Iteration 42): keine
      der fuenf Vendor-Access-Aktionen (List/Approve/Decline/CounterPropose/Revoke,
      `internal/security/vendoraccess/service.go`) schreibt einen `audit_log`-Eintrag. Jede
      Methode ruft nur `slog.Info` (Server-Log, nicht die manipulationssichere Audit-Kette
      unter `internal/security/audit`). Im Auslieferungsmodell "ein Server pro Kunde" ist
      dieser Mechanismus der einzige legitime Fernzugriffskanal von Zentria auf Kundendaten
      und damit der Beleg fuer Auftragsverarbeitung — ohne Audit-Eintrag ist "wer hat wann
      welchen Zugriff genehmigt/widerrufen" nur aus Server-Logs rekonstruierbar, die keine
      Kette, keine Integritaetspruefung (`VerifyChainIntegrity`) und keine Export-Funktion
      haben.
    sources:
      - backend/internal/security/vendoraccess/service.go
      - backend/internal/security/audit/service.go
      - backend/cmd/auth/main.go
      - backend/internal/server/security_grpc.go
      - backend/internal/server/grpc.go
    notes: >
      `cmd/auth/main.go:147` konstruiert `vendoraccess.NewService(vendorAccessRepo)` bereits
      im selben Scope wie `auditService` (Zeile 166 uebergibt beide an
      `NewSecurityGRPCServer`) — die Verdrahtung ist ein Konstruktor-Parameter, keine neue
      Systemgrenze.
      Vorlage ist `AuthGRPCServer.logPermissionEvent`
      (`internal/server/grpc.go:48-54`): ein schmaler Wrapper um
      `auditService.LogEvent(ctx, tenantID, &actorID, action, target, targetType, details,
      "", "", "success")`, der NACH dem erfolgreichen Schreiben aufgerufen wird — ein
      abgelehnter Versuch (ErrInvalidStatus, ErrSensitiveAckRequired) erzeugt keinen
      Eintrag.
      Jede der fuenf Methoden braucht einen eigenen `action`-String (z. B.
      "vendor_access.approve") und `target`/`targetType` = die Request-ID / "vendor_access_request".
      `List` ist ein Lesezugriff auf eine Liste, kein Statuswechsel — ob ein Lesezugriff auf
      diesen Mechanismus selbst protokollierungswuerdig ist, im Journal begruenden statt
      anzunehmen.
      `Create` hat laut Kommentar in `service.go:51` keine HTTP-Route ("Not wired to an HTTP
      route") — trotzdem mitziehen, falls ein anderer Aufrufer sie erreicht.
    done_when:
      - Approve, Decline, CounterPropose und Revoke schreiben je einen audit_log-Eintrag nach
        erfolgreichem Statuswechsel, mit aussagekraeftigem action-String
      - Ein abgelehnter Versuch (ErrInvalidStatus, ErrSensitiveAckRequired) erzeugt KEINEN
        Eintrag, per Test belegt
      - Die Entscheidung zu List (protokollieren oder nicht) ist im Journal begruendet
      - go test -count=1 ./internal/security/vendoraccess/ ./internal/server/ gruen,
        DATABASE_URL gegen kmuhub_app fuer jeden DB-Test

  - id: fix-datev-upload-log-stuck-uploading-no-reconciliation
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: done
    coverage_start: "n.a. (kein Coverage-Ziel, Verhaltensaenderung)"
    scope: >
      Gefunden in cov-datev-upload-service-error-paths (Lauf 11, Iteration 50). Sowohl
      `UploadBuchungsstapel` als auch `UploadBeleg`
      (`internal/biz/datev/upload_service.go:146-216` und `:263-300`) schreiben synchron in
      derselben Funktion: `CreateUploadLog` (Status "uploading") -> `uploader.UploadX(...)`
      -> `completeUploadLog`/`failUploadLog`. Stirbt der Prozess zwischen der ersten und der
      letzten Zeile (Pod-Restart waehrend eines Deploys, OOM, Panik in einer tieferen
      Schicht), bleibt die `datev_upload_log`-Zeile fuer immer im Status "uploading" —
      niemand markiert sie als abgebrochen, kein Scheduler prueft auf Alter. Ein Grep nach
      "cron|scheduler|worker|retention|cleanup" ueber alle `datev`-Referenzen in `internal/`
      und `cmd/` ergab null Treffer; es existiert kein Reconciliation-Mechanismus fuer diesen
      Zustand. `ListUploadLogs` (`postgres_upload_repo.go:133`) zeigt die Zeile unveraendert
      als "uploading" an, ohne Hinweis, dass sie verwaist sein koennte.
      Das Risikofenster ist klein (die eigentliche Uebertragung inklusive Retry-Backoff
      dauert Sekunden, siehe `uploader.go`), aber nicht null — und ein verwaister Eintrag ist
      fuer den Kunden nicht von einer echten haengenden Uebertragung zu unterscheiden.
    sources:
      - backend/internal/biz/datev/upload_service.go
      - backend/internal/biz/datev/postgres_upload_repo.go
      - backend/internal/biz/datev/upload_service_test.go
      - backend/internal/biz/datev/postgres_upload_repo_test.go
    notes: >
      KEINEN neuen Cron/Scheduler-Prozess bauen — das ist eine `cmd/`-Wiring-Entscheidung
      (welcher Service faehrt den Reconciliation-Lauf, welches Intervall) und gehoert Luke
      zur Freigabe, nicht stillschweigend in eine Coverage-Unit.
      Der schlanke erste Schritt ist wahrscheinlich lesend: `ListUploadLogs` oder ein neuer
      Repository-Query markiert/kennzeichnet Zeilen im Status "uploading", deren
      `started_at` laenger als ein plausibles Timeout (z. B. 10 Minuten — die tatsaechliche
      Obergrenze aus Retry-Konstanten in `uploader.go` ableiten, nicht raten) zurueckliegt,
      als "stale" statt sie unveraendert als laufend anzuzeigen. Ob das serverseitig als
      eigener Status ("failed_orphaned") in einer neuen Migration landet oder nur eine
      abgeleitete Kennzeichnung in der Leseschicht ist, ist eine Entscheidung dieser Unit.
      Falls eine Migration noetig wird: `datev_upload_log.status` traegt eine CHECK-Constraint
      (siehe `TestUpdateUploadLog_RejectsInvalidStatus`) — der neue Wert muss dort aufgenommen
      werden.
    done_when:
      - Ein Eintrag im Status "uploading", dessen started_at das Timeout ueberschreitet, ist
        von einem echten laufenden Auftrag unterscheidbar (Lesepfad oder Statuswert), per Test
        belegt
      - Die Entscheidung Migration vs. reine Leseschicht-Kennzeichnung ist im Journal
        begruendet
      - Kein neuer Cron-Prozess/Scheduler wurde verdrahtet, falls das die gewaehlte Loesung
        nahelegt — das bleibt eine Folge-Unit mit blocked_reason an Luke
      - go test -count=1 ./internal/biz/datev/ gruen, DATABASE_URL gegen kmuhub_app fuer
        DB-Tests

