    scope: >
      Fund aus `cov-gateway-hr-analytics-and-settings` (Iteration 21, Lauf 12). Der
      `HandleUpdateHRSettings`/`HandleGetHRSettings`-Pfad (`internal/gateway/route_hr.go:1451`,
