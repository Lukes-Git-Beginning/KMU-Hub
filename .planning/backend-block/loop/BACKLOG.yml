  - id: harden-shift-assignment-capacity-race
    phase: 4
    service: schichten
    model: sonnet
    deps: []
    status: done
    coverage_start: "n.a. (Haertung, kein Coverage-Ziel)"
    scope: >
      Nebenbefund aus `scan-resource-double-booking-race` (Iteration 49). `Service.AssignEmployee` (`schichten/service.go`)
      prueft Kapazitaet (`CountAssignments` >= `shift.Capacity`) und die Ruhezeit (`validateRestPeriod`,
      `validateMinorProtection`) und ruft erst danach `CreateAssignment` auf - alles ohne Transaktion und Lock. Zwei
      gleichzeitige Zuweisungen auf eine Schicht mit Kapazitaet 1 lesen beide count=0 und fuegen beide ein
      (Ueberbelegung, `ErrShiftFull` umgangen); dieselbe Luecke trifft die ArbZG-/JArbSchG-Pruefung bei zwei parallelen
      Zuweisungen desselben Mitarbeiters auf aneinandergrenzende Schichten. Der Unique-Constraint
      `uq_shift_assignments_tenant` (tenant, shift, employee) faengt nur die doppelte Zuweisung derselben Person.
      Loesung ohne Migration: Zuweisung in eine Transaktion, die zuerst die Schichtzeile `FOR UPDATE` sperrt (Kapazitaet)
      bzw. einen Advisory-Lock je (tenant, employee) nimmt (Ruhezeit), Pruefungen und Insert darin.
    sources:
      - backend/internal/schichten/service.go
      - backend/internal/schichten/postgres_repository.go
      - backend/internal/schichten/repository.go
    notes: >
      Kapazitaet ist eine Zaehl-Invariante, kein Zeitraum - EXCLUDE passt nicht, ein Zeilen-Lock auf `shifts` ist die
      schlanke Loesung. Nicht anfassen: `SwapAssignmentsForRequest` (hat eigene Transaktion, 000311). Test: N parallele
      Zuweisungen auf Kapazitaet K, genau K gelingen (Goroutinen -> `-race` nur in CI, in `offen:` vermerken).
      Keine Produktionsabfrage noetig (kein neuer Constraint); optional zum Messen:
      SELECT s.id, s.capacity, count(*) FROM shifts s JOIN shift_assignments a ON a.shift_id = s.id
      WHERE s.capacity IS NOT NULL GROUP BY s.id HAVING count(*) > s.capacity;
    done_when:
      - Kapazitaetspruefung und Insert laufen unter einem gemeinsamen Lock in einer Transaktion
      - Test mit echter DB - parallele Zuweisungen ueberschreiten die Kapazitaet nicht
      - Mutations-Probe - Lock entfernt, Test rot, zurueckgedreht

  - id: harden-password-reset-token-single-use
    phase: 4
    service: auth
    model: sonnet
    deps: []
    status: done
    coverage_start: "n.a. (Haertung, kein Coverage-Ziel)"
    scope: >
      Nebenbefund aus `scan-signed-url-and-token-lifetimes` (Iteration 50). `Service.ResetPassword`
      (`auth/service.go:757`) liest den Token, prueft `UsedAt`/`ExpiresAt` in Go, setzt das Passwort
      und markiert den Token erst danach als benutzt - und `MarkPasswordResetTokenUsed`
      (`postgres_repository.go:1487`) ist ein blankes `UPDATE ... SET used_at = NOW() WHERE id = $1`
      ohne `used_at IS NULL`, sein Fehler wird nur geloggt. Zwei gleichzeitige Requests mit demselben
      Token bestehen beide die Pruefung und setzen beide ein Passwort; schlaegt das Markieren fehl,
      bleibt der Token bis zum Ablauf (1 h) wiederverwendbar. Einmalverwendung ist damit
      Pruef-dann-Handeln, nicht atomar. Schaden gering (wer den Token hat, hat den Account ohnehin),
      aber der Token ist das einzige Einmal-Geheimnis in dieser Familie, das es nicht atomar
      durchsetzt - CSAT (`RedeemCsatSurveyTx`) und Invitation-Accept tun es.
    sources:
      - backend/internal/auth/service.go
      - backend/internal/auth/postgres_repository.go
      - backend/internal/auth/repository.go
    notes: >
      Den Token ZUERST atomar verbrauchen: `UPDATE password_reset_tokens SET used_at = NOW()
      WHERE token_hash = $1 AND used_at IS NULL AND expires_at > NOW() RETURNING id, user_id`,
      0 Zeilen = ErrResetTokenInvalid/Used/Expired (zur Unterscheidung der Fehler danach einmal lesen).
      Passwort setzen und Refresh-Tokens widerrufen danach, idealerweise in derselben Transaktion;
      scheitert das Passwort-Update, darf der Token nicht verbrannt bleiben (Tx-Rollback).
      Fehlercodes nach aussen unveraendert lassen. Bestehende Tests in `auth` pruefen, die
      `MarkPasswordResetTokenUsed` mocken.
    done_when:
      - Zwei parallele ResetPassword mit demselben Token - genau eines gelingt (Test mit echter DB)
      - Scheitert das Passwort-Update, ist der Token danach weiter einloesbar
      - Mutations-Probe - `used_at IS NULL` entfernt, Test rot, zurueckgedreht
      - Fehlercodes und Statuscodes der Route unveraendert

