  - id: scan-product-naming-inventory-cosmi-zentria
    phase: 4
    service: gateway
    model: opus
    deps: []
    status: todo
    decided: 2026-08-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-08-24 (aus Dariens Anstoss): die Konsolidierung der
      Namensgebung auf Cosmi (Software) und Zentria (Firma) ist gewollt — aber sie ist EIN
      zusammenhaengender Schnitt und keine Nachtlauf-Iteration. Der Modulpfad
      `github.com/kmuhub/kmuhub` steht in 1.223 Dateien und 2.615 Zeilen; ein zur Haelfte
      umbenannter Modulpfad kompiliert nicht, und ein Lauf, der mittendrin abbricht, laesst
      den Branch unbrauchbar zurueck. Die DB-Rollen `kmuhub`/`kmuhub_app`, der Volume-Name
      und die Container-Namen sind zusaetzlich produktionsgebunden und damit ein
      Deploy-Hazard.
      In diesem Lauf wird deshalb NUR INVENTARISIERT. Das Ergebnis ist die Grundlage fuer
      eine bewusste, eigene Aktion — nicht fuer eine Nacht.
    coverage_start: "n.a. (Scan, kein Coverage-Ziel)"
    scope: >
      Vollstaendige Inventur aller Namensvorkommen, KLASSIFIZIERT NACH RISIKO UND
      ZUSTAENDIGKEIT. Vier Klassen, und die Klassifikation ist der eigentliche Wert:
        (A) USER-SICHTBAR — was ein Kunde oder ein fremdes System zu sehen bekommt. Bekannt
            sind bereits: `totpIssuer = "KMU Hub"` (`internal/auth/totp.go:22`) erscheint in
            der Authenticator-App des Nutzers; `deviceName = "KMU Hub Desktop"`
            (`internal/auth/session.go:155`) in der Geraeteliste; der Basic-Auth-Realm
            `"KMU Hub CalDAV"` (`internal/gateway/route_caldav.go`) im Anmeldedialog des
            Browsers. Dazu kommen vermutlich: E-Mail-Vorlagen, PDF-Kopf- und -Fusszeilen,
            der OpenAPI-`info.title`, `User-Agent`-Header ausgehender Anfragen,
            Fehlermeldungen. DIESE KLASSE IST DIE EINZIGE, DIE FUER DAS BRANDING ZAEHLT.
        (B) MODULPFAD — `github.com/kmuhub/kmuhub` in 1.223 Go-Dateien. Mechanisch
            (`go mod edit -module` plus ein Ersetzungslauf ueber alle Imports), aber
            unteilbar: ein Commit, alles oder nichts.
        (C) INFRASTRUKTUR — DB-Rollen `kmuhub`/`kmuhub_app`, Datenbankname, Volume
            `docker_pgdata`, Container-Namen `docker-postgres-1` und Geschwister, Pfad
            `/opt/kmuhub/` auf dem Server, `.env.production`-Variablen. Jede Aenderung hier
            ist ein Deploy-Hazard mit Datenbezug. GESPERRT, auch fuer die spaetere Aktion,
            bis es dafuer einen eigenen Plan mit Backup und Rollback gibt.
        (D) KOSMETIK — Kommentare, Testnamen, interne Bezeichner, Dokumentation. Kein
            Risiko, kein Nutzen ausser Ordnung.
      Zu tun: fuer jede Klasse die vollstaendige Fundstellenliste, mit Datei und Zeile, und
      je Klasse eine Abschaetzung, was die Aenderung kostet und was sie bricht.
      ZUSAETZLICH die Frage klaeren, die Luke gestellt hat: welche Stellen nennen das Produkt
      "CRM", obwohl Cosmi mehr als ein CRM ist? Kandidaten sind der OpenAPI-Titel, die
      README, Modulbeschreibungen und die Beschreibungstexte, die im Produkt angezeigt
      werden. `internal/crm/` als SERVICE-Name ist davon NICHT betroffen — dort ist "CRM"
      korrekt, es ist einer von 23 Diensten.
    sources:
      - backend/
      - deploy/
      - docs/
      - backend/api/openapi.yaml
    notes: >
      DIESE UNIT AENDERT KEINE EINZIGE ZEILE CODE. Sie erzeugt eine Liste und Units.
      `model: opus`, weil die Klassifikation die Arbeit ist — eine unsortierte Liste mit
      2.615 Treffern ist wertlos, eine sortierte mit Risikoeinschaetzung ist die
      Entscheidungsgrundlage.
      Fuer Klasse (A) EINE Unit je zusammenhaengender Flaeche (Auth-Strings, E-Mail-Vorlagen,
      PDF, OpenAPI-Metadaten), die in einem spaeteren Lauf gebaut werden kann.
      ACHTUNG bei `totpIssuer`: ein Wechsel aendert nur den ANGEZEIGTEN Namen bei
      NEUeinrichtung. Bestehende TOTP-Geheimnisse bleiben gueltig, aber die App zeigt
      weiterhin den alten Namen. Das ist kein Fehler, muss aber in der angelegten Unit stehen,
      damit niemand eine Migration dafuer baut.
      Fuer Klasse (B) und (C) KEINE todo-Units in dieser Datei anlegen — sie gehoeren nach
      BACKLOG-NEXT.yml mit `status: blocked` und einem `blocked_reason`, der sagt, was
      entschieden werden muss. Eine todo-Unit "Modulpfad umbenennen" wuerde der Treiber
      ziehen und der Lauf waere zu Ende.
      Fuer Klasse (D) KEINE Units. Nur die Zahl ins Journal.
    done_when:
      - >-
        Die vollstaendige Fundstellenliste steht im Journal, nach den vier Klassen sortiert,
        mit Anzahl je Klasse
      - >-
        Fuer Klasse A ist je zusammenhaengender Flaeche eine Unit in dieser Datei angelegt,
        jeweils mit der Angabe, was der Nutzer davon sieht
      - >-
        Fuer Klasse B und C stehen Eintraege in BACKLOG-NEXT.yml mit blocked_reason, nicht in
        BACKLOG.yml
      - >-
        Die Liste der Stellen, die das Produkt als "CRM" bezeichnen, steht gesondert im
        Journal, ohne internal/crm/ als Service-Namen mitzuzaehlen
      - Kein Verhalten geaendert, keine Zeile Code veraendert (git diff belegt das)

  - id: fix-fuhrpark-vehicle-routes-daily-km-always-zero
    phase: 4
    service: fuhrpark
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Bugfix, kein Coverage-Ziel)"
    scope: >
      Fund aus `cov-fuhrpark-postgres-repository-real-sql` (Iteration 16, Lauf 12):
      `PostgresRepository.GetVehicleRoutes` (`internal/fuhrpark/postgres_repository.go:1007`)
      baut `VehicleRouteAggregation` je Fahrzeug/Tag aus echten `gps_positions`-Zeilen (Lat/Lng
      pro Fix liegen vor), setzt `DailyKm` dabei aber hart auf `0` (Zeile ~1073:
      `DailyKm: 0, // calculated from positions if needed`). Das ist kein totes Feld: die
      Route liegt bis zum Frontend durch — `vehicleRouteToProto`
      (`internal/server/fuhrpark_grpc.go:1561`) mapt `r.DailyKm` unveraendert in
      `fuhrparkv1.VehicleRoute.DailyKm`, der Gateway-Handler `HandleGetVehicleRoutes`
      (`internal/gateway/route_fuhrpark.go:1637`, Route `GET
      /api/v1/fuhrpark/vehicles/{id}/routes`, Permission `fuhrpark:gps:read`) liefert das
      Feld aus, und `desktop/src/renderer/src/api/types.ts` +
      `desktop/src/renderer/src/api/fuhrpark-client.ts` fuehren `dailyKm` als eigenes
      Frontend-Feld. Jede Route zeigt also 0 km, unabhaengig davon, wie weit das Fahrzeug an
      dem Tag tatsaechlich gefahren ist.
      Fix: `DailyKm` aus der Positionsfolge des Tages berechnen (Haversine-Distanz zwischen
      aufeinanderfolgenden, nach `recorded_at` sortierten Punkten, aufsummiert). Die Positionen
      liegen in `GetVehicleRoutes` bereits sortiert vor (`ORDER BY recorded_at ASC`,
      Zeile ~1063), die Aggregation kann also direkt auf `positions` in der bestehenden
      Schleife (Zeile ~1053-1077) aufsetzen, ohne eine weitere Query.
    sources:
      - backend/internal/fuhrpark/postgres_repository.go
      - backend/internal/fuhrpark/models.go
      - backend/internal/server/fuhrpark_grpc.go
      - backend/internal/gateway/route_fuhrpark.go
      - backend/internal/fuhrpark/postgres_repository_gap_test.go
    notes: >
      `TestGpsPositions_IngestGetAndRouteAggregation` in
      `postgres_repository_gap_test.go` deckt `GetVehicleRoutes` bereits ab (Status
      driving/parked, Tenant-Scoping, Positionsanzahl) — nur `DailyKm` ist dort bewusst nicht
      geprueft, weil die Unit, die den Test geschrieben hat, keine Coverage-Unit ist und daher
      kein Verhalten aendern durfte. Nach dem Fix dort einen Assert auf einen plausiblen
      `DailyKm > 0`-Wert ergaenzen (z. B. zwei Positionen mit bekanntem Lat/Lng-Abstand seeden
      und die erwartete Distanz mit einer Toleranz pruefen).
      Kein `.proto`-Feld faellt neu an (`DailyKm` existiert im Proto bereits), also keine
      Regenerierung noetig — reine Repository-Aenderung.
    done_when:
      - >-
        GetVehicleRoutes berechnet DailyKm aus den echten gps_positions-Koordinaten des
        jeweiligen Tages statt sie hart auf 0 zu setzen
      - >-
        Ein DB-Test belegt einen DailyKm-Wert grösser 0 fuer zwei oder mehr Positionen mit
        bekanntem Abstand

  - id: fix-fuhrpark-delete-driver-license-no-last-check-guard
    phase: 4
    service: fuhrpark
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Bugfix, kein Coverage-Ziel)"
    scope: >
      Fund aus `cov-gateway-fuhrpark-licenses-and-documents` (Iteration 17, Lauf 12).
      `driver_licenses` fuehrt eine Zeile je durchgefuehrter Fuehrerscheinkontrolle; die
      JEWEILS LETZTE Zeile je `driver_id` ist der aktuelle Kontrollstand und der Nachweis
      der Halterpflicht (siehe `internal/gateway/route_fuhrpark.go` HandleDeleteDriverLicense
      Doc-Kommentar). `Service.DeleteDriverLicense` (`internal/fuhrpark/service.go:849`)
      delegiert ungeprueft an `PostgresRepository.DeleteDriverLicense`
      (`internal/fuhrpark/postgres_repository.go:948`), die jede Zeile per `id` loescht — ohne
      zu pruefen, ob es die einzige oder juengste Kontrollzeile fuer ihren `driver_id` ist. Der
      Gateway-Handler `HandleDeleteDriverLicense` (Route `DELETE
      /api/v1/fuhrpark/driver-licenses/{id}`, Permission `fuhrpark:license:write`) reicht das
      unveraendert durch. Ein Loeschen der letzten Kontrollzeile eines Fahrers macht die
      Halterhaftungs-Pruefung fuer diesen Fahrer spurlos verschwinden.
      Fix: vor dem Loeschen pruefen, ob die Zeile die neueste (`checked_at` bzw. `created_at`
      MAX) fuer ihren `driver_id` innerhalb des Tenants ist, und in diesem Fall mit einem
      fachlichen Fehler (z. B. `codes.FailedPrecondition`, HTTP 409) ablehnen. Alternativ, falls
      Luke das Feature stattdessen fuer nachtraegliche Korrekturen (Tippfehler-Zeile loeschen)
      offen halten will, wenigstens ein Audit-Event schreiben, das den Verlust nachvollziehbar
      macht — die Entscheidung zwischen beiden Wegen gehoert Luke, nicht der Unit.
    sources:
      - backend/internal/fuhrpark/service.go
      - backend/internal/fuhrpark/postgres_repository.go
      - backend/internal/fuhrpark/repository.go
      - backend/internal/server/fuhrpark_grpc.go
      - backend/internal/gateway/route_fuhrpark.go
      - backend/internal/fuhrpark/driver_license_test.go
    notes: >
      `driver_license_test.go` deckt DeleteDriverLicense bereits fuer Not-Found und
      Cross-Tenant ab, aber nicht fuer den Fall "letzte/einzige Kontrollzeile eines Fahrers".
      Vor dem Bauen mit Luke klaeren, ob ein harter Block (409) oder ein Audit-Trail die
      richtige Antwort ist — das ist eine Produktentscheidung, kein reiner Bugfix.
    done_when:
      - >-
        DeleteDriverLicense blockiert das Loeschen der neuesten Kontrollzeile eines
        driver_id (409/FailedPrecondition) ODER schreibt beim Loeschen ein Audit-Event, das
        den Verlust nachvollziehbar macht — Wahl zwischen beiden Wegen mit Luke vorab klaeren,
        bevor gebaut wird
      - Die gewaehlte Absicherung ist implementiert und durch einen Test belegt
      - >-
        Ein bestehender Kontrollstand kann nicht mehr spurlos verschwinden, ohne dass es
        nachvollziehbar ist

  - id: fix-fuhrpark-update-damage-missing-enum-validation
    phase: 4
    service: fuhrpark
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Bugfix, kein Coverage-Ziel)"
    scope: >
      Fund aus `cov-gateway-fuhrpark-licenses-and-documents` (Iteration 17, Lauf 12).
      `reportDamageRequest.Severity` traegt `validate:"omitempty,oneof=minor moderate major
      totalled"` (`internal/gateway/route_fuhrpark.go`, Zeile ~239), aber das Schwester-Struct
      `updateDamageRequest` traegt auf `Severity` UND `Status` gar kein `validate`-Tag (Zeile
      ~246-253). `Service.UpdateDamage` (`internal/fuhrpark/service.go:583`) schreibt beide
      Felder unveraendert in den Datensatz (`d.Severity = *input.Severity`,
      `d.Status = *input.Status`), ohne den Wertebereich zu pruefen — weder im Handler noch im
      Service noch im Repository. Ein `PATCH /api/v1/fuhrpark/damages/{id}` mit z. B.
      `{"severity":"kaputt"}` wird anstandslos gespeichert, obwohl `severity` an anderer
      Stelle (Reporting, Frontend-Badges) als eines von vier festen Werten behandelt wird.
      Belegt durch `TestHandleUpdateDamage_ArbitrarySeverityReachesRPCUnvalidated`
      in `route_fuhrpark_licenses_documents_test.go`: die Anfrage erreicht den RPC-Call statt
      mit 400 abgelehnt zu werden.
      Fix: `updateDamageRequest.Severity` und `.Status` mit denselben `oneof`-Wertemengen wie
      beim Erzeugen (Severity: minor/moderate/major/totalled; Status: an
      `internal/fuhrpark/models.go` DamageStatus-Konstanten orientieren) validieren.
    sources:
      - backend/internal/gateway/route_fuhrpark.go
      - backend/internal/gateway/route_fuhrpark_licenses_documents_test.go
      - backend/internal/fuhrpark/service.go
      - backend/internal/fuhrpark/models.go
    notes: >
      Kleiner, klar umrissener Fix — ein `validate`-Tag je Feld reicht, kein Service- oder
      Repository-Umbau. Nach dem Fix
      `TestHandleUpdateDamage_ArbitrarySeverityReachesRPCUnvalidated` auf 400 + die neuen
      `assertValidationError`-Checks umstellen (Testname entsprechend anpassen).
    done_when:
      - >-
        updateDamageRequest.Severity validiert gegen dieselbe oneof-Menge wie
        reportDamageRequest.Severity
      - updateDamageRequest.Status validiert gegen die gueltigen DamageStatus-Werte
      - >-
        Ein Request mit einem Severity- oder Status-Wert ausserhalb der erlaubten Menge liefert
        400 statt den RPC zu erreichen
      - go test -count=1 ./internal/fuhrpark/ gruen
