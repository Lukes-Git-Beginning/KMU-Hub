#     Nicht-Fund, keine Zahl. "12 Dateien geprueft, 0 Funde" ist wertlos; "diese 12, und bei
#     jeder warum nicht" ist ein Ergebnis.
#   - Jede neu angelegte Unit braucht dieselben Felder wie die vorab geschriebenen, inklusive
#     `scope` und `done_when`. Eine Unit mit nur einer Zeile ist in der naechsten Iteration
#     nicht bearbeitbar.
