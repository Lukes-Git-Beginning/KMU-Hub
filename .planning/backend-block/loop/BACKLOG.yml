    phase: 4
    service: crm
    model: opus
    deps: []
    status: blocked
    blocked_reason: >
      Entscheidungsvorlage - der scope verbietet den Start ohne Lukes Freigabe ("nicht ohne
      Freigabe starten"), und done_when[0] lautet woertlich "Luke hat einen der beiden Wege
      freigegeben". Weg A legt vier neue gRPC-RPCs an, Weg B loescht vier spezifizierte,
      fachlich fertig implementierte Endpunkte - beides Produktentscheidung, nicht Loop-Arbeit.
      Iteration 100 hat die Unit deshalb nicht angefasst und die naechste Unit gezogen.
    coverage_start: "internal/gateway 56,6 % (gemessen Iteration 93)"
    scope: >
      ENTSCHEIDUNGSVORLAGE FUER LUKE, nicht ohne Freigabe starten — sie enthaelt vier neue
      gRPC-RPCs, und genau das hat `fix-crm-tag-endpoints-are-501-stubs` als Lukes
      Entscheidung markiert. Ausgangslage (Iteration 97 verifiziert): Tagging von Activities
      und Deals ist end-to-end gebaut ausser einer Schicht. Vorhanden sind Join-Tabellen
      `activity_tags`/`deal_tags` (Migration 000006, `tenant_id` seit 000111),
      Repository-Methoden `AddTags`/`RemoveTags`/`GetTags`, die Service-Methoden
      `activity.Service.AddTags/RemoveTags` (activity/service.go:441/466) und
      `deal.Service.AddTags/RemoveTags` (deal/service.go:458/483) inkl. Tag-Existenzpruefung,
      die Router-Registrierung mit `RequirePermission("activities","write")` bzw.
      `("deals","write")` (route_crm.go:165/166/178/179) und die vollstaendigen
      openapi-Eintraege (openapi.yaml:2731 fuer deals, :2964 fuer activities, je `200` mit
      `DealResponse`/`ActivityResponse`). Es fehlt allein der gRPC-Hop, weshalb die vier
      Handler dauerhaft `501` antworten und die Service-Methoden null Nicht-Test-Aufrufer haben.
      Umfang bei Freigabe: `AddActivityTags`/`RemoveActivityTags`/`AddDealTags`/`RemoveDealTags`
      in `proto/crm/v1/crm.proto` nach dem exakten Vorbild von `AddContactTags` (Request mit
      `activity_id`/`deal_id` + `repeated string tag_ids`, Response mit dem jeweiligen
      Info-Message), `make proto-crm` im selben Commit, vier Server-Methoden in
      `internal/server/crm_grpc.go` nach dem Muster von `AddContactTags` (crm_grpc.go:673) mit
      `middleware.GetTenantID`, uuid-Parsing und `mapCRMError`, und die vier Gateway-Handler
      von `response.Error(501, ...)` auf `crmClient.<RPC>` + `response.Proto` umstellen.
      Keine neue Route, keine neue Permission, keine Migration.
    sources:
      - backend/proto/crm/v1/crm.proto
      - backend/internal/server/crm_grpc.go
      - backend/internal/crm/activity/service.go
      - backend/internal/crm/deal/service.go
      - backend/internal/gateway/route_crm_activities.go
      - backend/internal/gateway/route_crm_pipeline.go
      - backend/api/openapi.yaml
    notes: >
      Alternative, falls Luke das Feature nicht will: die vier Routen aus route_crm.go, die
      vier Handler und die zwei Pfad-Eintraege aus `api/openapi.yaml` entfernen, dazu die
      toten Service- und Repository-Methoden. Dann faellt auch `TagIdsRequest` fuer diese
      beiden Pfade weg — pruefen, ob das Schema noch von den Contact-Tag-Routen gebraucht wird
      (ja, `/api/v1/contacts/{id}/tags`), also stehen lassen.
      In beiden Faellen muessen die Tests mitgezogen werden, die den 501er heute festschreiben:
      `TestHandleAddActivityTags_NotImplemented`, `TestHandleRemoveActivityTags_NotImplemented`
      (route_crm_activities_test.go:354/375),
      `TestHandleAddDealTags_ValidReturnsNotImplemented`,
      `TestHandleRemoveDealTags_ValidReturnsNotImplemented`
      (route_crm_pipeline_test.go:573/602), dazu die erklaerenden Kommentare in
      route_capability_guard_test.go:313 und den Kopfkommentaren beider Testdateien.
      Kein FE-Aufrufer existiert (verifiziert: `desktop/src/renderer/src` nutzt Tag-Routen nur
      unter `/api/v1/contacts/{id}/tags`), der Umbau ist also FE-seitig risikofrei.
    done_when:
      - Luke hat einen der beiden Wege freigegeben und er ist umgesetzt
      - Kein Handler in route_crm_activities.go oder route_crm_pipeline.go antwortet mehr 501
      - Die vier 501-Eintraege sind aus statusDriftBaseline entfernt
      - Bei Weg A - .proto und generierte .pb.go liegen im selben Commit
