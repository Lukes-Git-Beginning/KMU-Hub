    phase: 4
    service: calendar
    model: sonnet
    # deps erfuellt: fix-generatejointoken-missing-event-tenant-check ist in Lauf 13 done (`c448273f`), Unit liegt in archive/lauf-13/BACKLOG.yml
    deps: []
    status: todo
    coverage_start: "n.a. (Haertung, kein Coverage-Ziel)"
    scope: >
      Restrisiko aus fix-generatejointoken-missing-event-tenant-check (Iteration 6):
      `livekit.Service.GenerateRoomName` (internal/work/livekit/service.go:73-76) bildet den
      Raumnamen als `"cal-" + eventID.String()[:8]` — also aus den ersten 32 Bit der Event-UUID
      und OHNE Tenant-Anteil. Der Tenant-Check in `GenerateJoinToken` sorgt seit Iteration 6
      dafuer, dass ein Aufrufer nur noch fuer EIGENE Events ein Token bekommt; der Raumname,
      auf den das Token lautet, kann aber weiterhin mit dem eines Events in einem ANDEREN
      Tenant zusammenfallen. Zwei Teilnehmer verschiedener Tenants landen dann im selben
      LiveKit-Raum. Bei 32 Bit ist das kein theoretischer Fall: nach dem Geburtstagsproblem
      liegt die Kollisionswahrscheinlichkeit ueber alle Events aller Kunden hinweg schon bei
      rund 100.000 Events im Prozentbereich.
      Zu tun: Raumname so bilden, dass er tenant- und event-eindeutig ist (naheliegend ein
      Hash ueber `tenant_id` UND `event_id`, gekuerzt auf die von LiveKit erlaubte Laenge),
      und dabei den bereits persistierten Namen beachten.
