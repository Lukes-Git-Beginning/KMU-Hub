units:

  # ==========================================================================
  # BLOCK A — RBAC Phase 1 Welle 1b (seriell verkettet)
  # Quelle: .planning/backend-block/PHASE-1-RBAC-PLAN.md §4
  # Ergebnis: Custom-Rollen tenant-scoped verwaltbar, der RBAC-Builder im FE
  # laeuft gegen echtes Backend statt gegen MSW.
  #
  # Fundament aus Welle 1a steht und ist am 2026-08-02 empirisch verifiziert:
  #   - `roles` hat `tenant_id` (NULL = System-Preset), `preset_id`, `color`
  #   - `role_permissions` hat `scope` (Default 'all')
  #   - RLS-Paar auf beiden: Lesen sieht `tenant_id IS NULL OR = current_tenant_id()`,
  #     Schreiben nur den eigenen Tenant -> Presets sind fuer Tenants NICHT
  #     schreib- oder loeschbar (DELETE wertet nur USING aus)
  #   - Arbiter-Index `idx_roles_tenant_name` auf
  #     `(COALESCE(tenant_id,'00000000-0000-0000-0000-000000000000'::uuid), name)`
  #   - Als `kmuhub_app` sichtbar: 8 Preset-Rollen, 1179 Grants, admin = 454 Capabilities
  #
  # Verifiziert: `/admin/roles` hat aktuell NULL Treffer im Gateway
  # (`grep -rn "admin/roles" backend/internal/gateway/`), das FE ruft die Routen
  # aber bereits auf (`desktop/src/renderer/src/api/rbac-client.ts`).
  # ==========================================================================

  - id: p1b-proto
    phase: 1b
    service: auth
    model: opus
    deps: []
    status: done
    scope: >
      Rollen-Admin-RPCs am auth-Service in `backend/proto/auth/v1/auth.proto`, plus Messages.
      RPCs: `ListRoles`, `CreateRole`, `UpdateRole`, `DeleteRole`, `GetRolePermissions`,
      `SetRolePermissions`, `AssignUserRole`, `RevokeUserRole`.
      Messages mindestens: `Role{id,name,description,color,is_system,preset_id,member_count,
      capability_count}`, `RoleGrant{key,scope}`, dazu die Request/Response-Paare.
      Regenerierung im SELBEN Commit.
    sources:
      - .planning/backend-block/PHASE-1-RBAC-PLAN.md
      - backend/proto/auth/v1/auth.proto
      - desktop/src/renderer/src/api/rbac-client.ts
      - desktop/src/renderer/src/mocks/handlers/rbac.ts
    notes: >
      Nur Proto + Regen, keine Implementierung — die kommt in den Folge-Units. Der Auftritt im
      generierten `UnimplementedAuthServiceServer` ist erwartete Boilerplate und KEIN Stub-Fund
      im Sinne des Verify-Vorspanns.
      Die Feldnamen exakt aus dem FE-Vertrag ziehen (`mocks/handlers/rbac.ts` ist die SSOT, gegen
      die das FE heute laeuft) — sonst entsteht genau der Nested-Proto-vs-flacher-FE-Typ-Bruch,
      der dieses Repo schon mehrfach gekostet hat.
      Regen: `export PATH="$PATH:/c/Program Files/Go/bin:$HOME/go/bin"; cd backend && make proto-auth`
      (exaktes Target im Makefile nachsehen). `.proto` ohne passende `.pb.go` im selben Commit
      ist Fehlerklasse 3.
    done_when:
      - auth.proto enthaelt die 8 RPCs + Messages
      - passende .pb.go/.grpc.pb.go im selben Commit regeneriert
      - go build -p 2 ./proto/auth/... ./internal/auth/... gruen

  - id: p1b-roles-list
    phase: 1b
    service: auth
    model: sonnet
    deps: [p1b-proto]
    status: done
    scope: >
      `GET /admin/roles` -> `{roles:[Role]}`. Liefert die System-Presets (tenant_id IS NULL) UND
      die Custom-Rollen des aufrufenden Tenants — genau das, was die Lese-Policy ohnehin
      durchlaesst. Pro Rolle die Aggregate `memberCount` (COUNT ueber `user_roles`) und
      `capabilityCount` (COUNT ueber `role_permissions`).
    sources:
      - backend/internal/auth/
      - backend/internal/server/auth_grpc.go
      - backend/internal/gateway/
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
    notes: >
      Die Aggregate in EINER Query mit LEFT JOIN + GROUP BY holen, nicht per N+1 pro Rolle.
      `user_roles` hat KEINE RLS (siehe Unit `g-user-roles-rls` in Block B) — der COUNT muss
      deshalb hier ueber einen Join auf `users` tenant-gescopt werden, sonst zaehlt er
      tenant-uebergreifend. Das ist kein Grund, die Unit zu blockieren, aber es MUSS im Code
      stehen und im Journal vermerkt sein.
      Route-Guard: bestehendes Muster `RequirePermissionAny` nutzen, damit kein Nutzer mit
      gueltigem Token ausgesperrt wird.
    done_when:
      - GET /admin/roles liefert Presets + eigene Custom-Rollen
      - memberCount/capabilityCount stimmen gegen die DB
      - Route in api/openapi.yaml eingetragen (TestOpenAPIRouteDrift gruen)
      - go test ./internal/gateway/ gruen

  - id: p1b-roles-create
    phase: 1b
    service: auth
    model: opus
    deps: [p1b-roles-list]
    status: done
    scope: >
      `POST /admin/roles` Body `{name,description,color,basedOn}` -> 201 `{role}`.
      Semantik ist **Klon**: die `role_permissions` von `basedOn` werden 1:1 inklusive `scope`
      kopiert, die neue Rolle bekommt `tenant_id = current_tenant_id()`.
      Fehler: `role_limit_reached` (409, ab 20 Custom-Rollen je Tenant), `role_name_exists` (409),
      `not_found` (404, basedOn existiert nicht/nicht sichtbar), 422 bei fehlenden Pflichtfeldern.
    sources:
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
      - desktop/src/renderer/src/mocks/handlers/rbac.ts
    notes: >
      Der Unique-Index ist ein AUSDRUCKS-Index:
      `(COALESCE(tenant_id,'00000000-0000-0000-0000-000000000000'::uuid), name)`. Ein
      `ON CONFLICT (tenant_id, name)` findet dafuer KEINEN Arbiter und wirft zur Laufzeit.
      Entweder byte-identisch denselben Ausdruck nutzen oder die Kollision explizit vorher pruefen.
      Das 20er-Limit zaehlt NUR Custom-Rollen (`tenant_id IS NOT NULL`); die Presets duerfen es
      nicht auffressen.
      `basedOn` darf ein Preset sein (das ist der Normalfall im Builder) — Presets sind lesbar,
      nur nicht schreibbar. Das Kopieren der Grants schreibt in `role_permissions` der NEUEN
      Rolle, die dem Tenant gehoert, verletzt also die Schreib-Policy nicht.
    done_when:
      - Klon uebernimmt alle Grants inkl. scope
      - alle vier Fehlerfaelle liefern den spezifizierten Code
      - Test gegen den echten Service (nicht nur den Handler), Limit-Fall inklusive
      - openapi.yaml + go test ./internal/gateway/ gruen

  - id: p1b-roles-update-delete
    phase: 1b
    service: auth
    model: sonnet
    deps: [p1b-roles-create]
    status: done
    scope: >
      `PATCH /admin/roles/{id}` `{name?,description?,color?}` -> `{role}` und
      `DELETE /admin/roles/{id}` -> 204.
      Fehler: `preset_immutable` (403, `tenant_id IS NULL`), `role_name_exists` (409),
      `role_has_members` (409, Rolle hat noch Traeger in `user_roles`).
    sources:
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
    notes: >
      Die Schreib-Policy blockt Presets bereits auf DB-Ebene — ein UPDATE/DELETE auf ein Preset
      trifft schlicht null Zeilen. Genau DESHALB braucht es den expliziten 403: sonst ist die
      Antwort ein 404 oder ein stilles 204, und der Builder zeigt "geloescht" fuer eine Rolle,
      die noch da ist. Erst pruefen (`tenant_id IS NULL` -> 403), dann schreiben.
      `role_has_members` vor dem DELETE pruefen, nicht auf einen FK-Fehler warten — die Meldung
      muss fachlich sein.
    done_when:
      - Preset -> 403 preset_immutable bei PATCH UND DELETE
      - Rolle mit Traegern -> 409 role_has_members
      - Namenskollision -> 409
      - Tests fuer alle drei Faelle gegen den echten Service
      - openapi.yaml + go test ./internal/gateway/ gruen

  - id: p1b-role-permissions
    phase: 1b
    service: auth
    model: sonnet
    deps: [p1b-roles-update-delete]
    status: done
    scope: >
      `GET /admin/roles/{id}/permissions` -> `{roleId, grants:{key:{scope}}}` und
      `PUT /admin/roles/{id}/permissions` (Vollersatz derselben Struktur).
      PUT ersetzt die Grant-Menge der Rolle komplett: fehlende Keys werden entzogen, neue
      angelegt, geaenderte `scope`-Werte aktualisiert — in EINER Transaktion.
    sources:
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
      - desktop/src/renderer/src/config/capability-catalog.ts
    notes: >
      Unbekannte Capability-Keys muessen 422 geben, nicht still verschluckt werden — sonst
      speichert der Builder Rechte, die nirgends greifen. Gegen die `permissions`-Tabelle
      validieren (456 Zeilen lokal), nicht gegen eine Konstante im Code.
      Auf Presets ist PUT verboten (`preset_immutable`, 403) — dieselbe Begruendung wie in der
      Vorgaenger-Unit.
      Vollersatz heisst DELETE+INSERT in einer Transaktion ODER ein sauberes Diff; wichtig ist
      nur, dass ein Fehler mittendrin nichts Halbes hinterlaesst.
    done_when:
      - PUT ersetzt vollstaendig (Entzug funktioniert nachweislich)
      - unbekannter Key -> 422
      - Preset -> 403
      - Transaktionalitaet getestet (Fehler mittendrin laesst die Alt-Grants stehen)
      - openapi.yaml + go test ./internal/gateway/ gruen

  - id: p1b-user-roles
    phase: 1b
    service: auth
    model: opus
    deps: [p1b-role-permissions]
    status: done
    scope: >
      `POST /users/{id}/roles` `{roleId}` und `DELETE /users/{id}/roles/{roleId}`, beide ->
      `{roles:[...]}` (die neue Rollenliste des Users).
      Dazu die **Validator-Entkopplung**: das `oneof` in `assignRoleRequest` fliegt raus, die
      Rollen-ID wird dynamisch gegen die `roles`-Tabelle validiert (tenant-gescopt) — sonst sind
      Custom-Rollen strukturell nicht zuweisbar.
    sources:
      - backend/internal/auth/
      - backend/internal/validation/
      - .planning/backend-block/PHASE-1-RBAC-PLAN.md
    notes: >
      Das `oneof` zu finden ist Teil der Arbeit: nach `assignRole` bzw. der Rollen-Enum im
      Validator suchen. Solange es steht, akzeptiert der Endpoint nur die Preset-Namen und die
      ganze Welle 1b bleibt praktisch wirkungslos.
      `user_roles` hat weder `tenant_id` noch RLS (Block B, `g-user-roles-rls`). Diese Unit MUSS
      deshalb selbst tenant-scopen: der Ziel-User wird ueber `users` (RLS-geschuetzt) aufgeloest,
      die Rolle ueber `roles`. Ein Zuweisen ueber Tenant-Grenzen hinweg darf nicht moeglich sein,
      auch nicht, solange die Tabelle ungeschuetzt ist.
      `last_admin` (409) gehoert fachlich hierher, wird aber zusammen mit den uebrigen Guardrails
      in `p1b-guardrails` gebaut — hier nur die Stelle vorsehen, nicht doppelt implementieren.
    done_when:
      - Custom-Rolle ist zuweisbar (Validator entkoppelt)
      - Zuweisung ueber Tenant-Grenzen scheitert nachweislich
      - beide Endpoints liefern die neue Rollenliste
      - openapi.yaml + go test ./internal/gateway/ ./internal/auth/... gruen

  - id: p1b-guardrails
    phase: 1b
    service: auth
    model: opus
    deps: [p1b-user-roles]
    status: done
    scope: >
      Die vier serverseitigen Guardrails aus PHASE-1-RBAC-PLAN §4, zentral im Service:
      (a) **Mindestens-1-Admin** — der letzte Traeger einer Admin-Rolle im Tenant kann sie nicht
      verlieren (`last_admin`, 409).
      (b) **Selbst-Aussperr-Schutz** — niemand entzieht sich selbst die Rechte, ueber die er
      gerade die Rechteverwaltung bedient.
      (c) **Privilege-Escalation-Schutz** — niemand vergibt Rechte, die er selbst nicht hat
      (Grant-Menge des Aufrufers ist die Obergrenze, inklusive `scope`: `own` darf nicht zu
      `all` aufgewertet werden).
      (d) **Preset-Immutability** — durchgaengig, auch auf den Permissions-Routen.
    sources:
      - backend/internal/auth/
      - backend/internal/middleware/rbac.go
    notes: >
      (c) ist der schwierige Teil und der sicherheitsrelevante: die effektive Grant-Menge des
      Aufrufers muss serverseitig aufgeloest werden (dieselbe Logik wie
      `GetEffectivePermissions` aus Welle 1a — WIEDERVERWENDEN, nicht neu schreiben). Das JWT
      taugt dafuer nicht: es traegt die groben Alt-Keys, nicht die feinen Capabilities.
      (b) ist kein Ersatz fuer (a): ein Admin kann sich auch dann aussperren, wenn noch andere
      Admins existieren — beide Regeln braucht es.
      Die Guardrails gehoeren in den SERVICE, nicht in die Handler (Thick Services, Thin
      Handlers) — sonst umgeht der naechste Aufrufer sie.
    done_when:
      - alle vier Regeln greifen im Service, nicht im Handler
      - last_admin liefert 409 mit fachlicher Meldung
      - Escalation-Versuch (Recht vergeben, das der Aufrufer nicht hat) wird abgelehnt
      - scope-Aufwertung own -> all wird abgelehnt
      - go build/vet/lint/test gruen

  - id: p1b-audit-events
    phase: 1b
    service: auth
    model: sonnet
    deps: [p1b-guardrails]
    status: done
    scope: >
      Audit-Events fuer jede Rechteaenderung, append-only auf dem bestehenden `audit_log`
      (Migration 000222). Taxonomie: `permission.role_created`, `permission.role_updated`,
      `permission.role_deleted`, `permission.assigned`, `permission.revoked`.
      (`permission.override_*` ist fuer R-6 reserviert und wird hier NICHT belegt.)
    sources:
      - backend/migrations/000222*.up.sql
      - backend/internal/auth/
    notes: >
      Zuerst das bestehende `audit_log`-Schema und seinen Schreibpfad lesen und WIEDERVERWENDEN —
      es gibt bereits Audit-Schreiber im Repo. Keine zweite Audit-Infrastruktur bauen.
      Braucht die Taxonomie eine Migration (Enum/CHECK/Index), ist die naechste freie Nummer zur
      Laufzeit zu ermitteln, nicht zu raten.
      Das Event muss den Akteur tragen (`middleware.GetUserID(ctx)` funktioniert im internen
      Server, weil `x-user-id` ueber den gRPC-Hop propagiert — `x-tenant-id` ebenfalls, Rollen
      NICHT).
    done_when:
      - jede der fuenf Aenderungsarten schreibt genau ein Event
      - Akteur, Tenant und Ziel-Ressource stehen im Event
      - Events sind append-only (kein Update-Pfad)
      - go test gruen

  - id: p1b-guardrail-tests
    phase: 1b
    service: auth
    model: sonnet
    deps: [p1b-audit-events]
    status: done
    scope: >
      Testabdeckung fuer Welle 1b gegen die echte DB: last-admin, Selbst-Aussperrung,
      Privilege-Escalation (inkl. scope-Aufwertung), Preset-Immutability auf allen vier
      schreibenden Routen, Custom-Limit 20, Tenant-Isolation der Rollenzuweisung.
    sources:
      - backend/internal/auth/
      - backend/internal/testutil/
    notes: >
      Pflicht: `DATABASE_URL` gesetzt, Rolle `kmuhub_app` (NICHT `kmuhub` — der Superuser hat
      BYPASSRLS, unter ihm beweist ein Isolationstest nichts).
      Jeder Test seedet EIGENE Tenants, nicht die geteilten Konstanten `TenantA`/`TenantB`: in
      Lauf 1 ist genau daran ein Test in CI gestorben (Duplicate Key auf einem per-Tenant-
      eindeutigen Index), waehrend er lokal gruen aussah, weil er ohne DB uebersprungen wurde.
      Am Ende `go test -count=1 ./internal/auth/... ./internal/gateway/` — und die Zahl der
      tatsaechlich gelaufenen (nicht uebersprungenen) Tests ins Journal.
    done_when:
      - alle sieben Faelle sind abgedeckt und laufen wirklich (0 Skips)
      - Tests nutzen eigene Tenants
      - go test -count=1 ./internal/auth/... ./internal/gateway/ gruen

  # ==========================================================================
  # BLOCK B — Sicherheit / RLS-Reste
  #
  # Grundlage: vollstaendiger Scan der lokalen DB am 2026-08-02 (Kopf 268).
  # 318 Tabellen, 249 mit aktivem RLS. Die Allowlist in `docs/ARCHITECTURE.md`
  # ("System-Global Tables (No RLS)") kennt genau VIER Ausnahmen:
  # `schema_migrations`, `caldav_settings`, `industry_templates`, `permissions`.
  # Alles andere ohne RLS ist entweder eine Luecke oder ein fehlender
  # Allowlist-Eintrag — beides wird in diesem Block geschlossen.
  #
  # ENTWARNUNG, damit niemand hinterherjagt: die Partitionen von
  # `automation_executions` und `dialer_call_events` zeigen `relrowsecurity=false`,
  # ihre partitionierten ELTERN haben aber RLS + Policy. Zugriffe laufen ueber den
  # Elternteil, also sind sie geschuetzt. KEINE Unit noetig.
  #
  # Helper im Schema (beide vorhanden, nutzen statt Policies von Hand schreiben):
  #   CALL enable_tenant_rls('<tabelle>')
  #   CALL enable_tenant_rls_via_join(...)   -- fuer Tabellen ohne eigene tenant_id
  # Policy-Form: `tenant_id = current_tenant_id() OR is_system_context()`,
  # Setting ist `app.tenant_id` (NICHT `app.current_tenant`).
  # ==========================================================================

  - id: g-rls-tenant-id-ohne-policy
    phase: sec
    service: db
    model: opus
    deps: []
    status: done
    scope: >
      Drei Tabellen tragen `tenant_id`, haben aber weder RLS noch eine Policy — verifiziert am
      2026-08-02 ueber `pg_class.relrowsecurity` + `pg_policies`:
      `email_contact_links`, `validation_rules`, `workflow_rules`.
      Migration, die auf allen dreien `CALL enable_tenant_rls('<tabelle>')` ausfuehrt, plus
