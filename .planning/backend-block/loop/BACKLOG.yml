      vermutlich der Grund war, warum die spaetere Implementierung (`ZustandsprotokollDialog`) den
      RPC gar nicht erst benutzt hat.
      Zwei ehrliche Wege, keiner spontan zu entscheiden: (A) `UploadInspectionPhoto` als
      totes/superseded RPC vollstaendig entfernen (Proto-RPC+Messages, Service-Methode,
      gRPC-Handler, ungenutzter FE-Hook) und die Praesenz im Feature-Set (`docs/MODULES_SCOPE_MATRIX.md`
      Zeile 178) auf den tatsaechlichen Pfad umstellen. (B) Den RPC fuer einen echten, bislang nicht
      existierenden Anwendungsfall bauen: ein externer Mieter (kein CRM-Login, kein `files:write`
      auf der presign-Route) laedt ein Inspektionsfoto hoch — dafuer gibt es aber NIRGENDS im Repo
      ein Mieter-Portal, einen Magic-Link-Mechanismus oder ein Auth-Modell fuer Nicht-CRM-Nutzer
      (verifiziert, keine Treffer fuer "mieter-portal"/"tenant-portal"/"renter-portal"). Weg B ist
      damit kein Upload-Fix, sondern ein neues Feature samt Auth-Entscheidung. Beides ist eine
      Produkt-/Architekturentscheidung, die Luke gehoert — nicht spontan im Loop zu treffen.
    scope: >
      `UploadInspectionPhoto` akzeptiert nur eine `pending://`-Platzhalter-URL und verweist auf das
      Gateway — dort existiert aber kein Handler. Die Gegenstelle bauen.
    sources:
      - backend/internal/server/vermietung_grpc.go
      - backend/internal/chat/file/minio_store.go
    notes: >
      Befund: `server/vermietung_grpc.go:496-514` mit dem Kommentar "the actual MinIO upload is a
      TODO — gateway is responsible"; in `internal/gateway/route_vermietung.go` gibt es keinen
      Treffer fuer InspectionPhoto oder MinIO. Das Feature ist Ende-zu-Ende nicht angeschlossen.
      Upload ueber das bestehende Presign-Muster (`internal/chat/file/minio_store.go`) bzw.
      `internal/document/file`. Keine neue Upload-Infrastruktur.
      Dateityp und Groesse serverseitig begrenzen — der Endpoint nimmt Uploads von Mietern entgegen.
    done_when:
      - Gateway-Route laedt real nach MinIO, Service speichert die echte URL
      - kein pending:// mehr im Erfolgspfad
      - Typ- und Groessenbegrenzung serverseitig
      - openapi.yaml im selben Commit
  - id: g-automation-http-action
    phase: 3
    service: automation
    model: opus
    deps: []
    status: todo
    scope: >
      `http_request`-Action fuer die Automatisierung.
    sources:
      - backend/internal/automation/action
    notes: >
      SICHERHEITSKRITISCH: Eine vom Nutzer konfigurierbare ausgehende HTTP-Anfrage aus dem
      Servernetz ist eine SSRF-Falle. Pflicht: private und link-lokale Adressbereiche blocken
      (127.0.0.0/8, 10/8, 172.16/12, 192.168/16, 169.254/16, ::1, fc00::/7), Redirects nicht blind
      folgen und nach jedem Redirect erneut pruefen, Timeout und Antwortgroesse begrenzen,
      nur http und https.
      Insbesondere darf die Action die internen Service-Adressen und den Metadaten-Endpunkt des
      Hosters nicht erreichen.
      Keine Credentials in Logs, auch nicht in Header-Dumps.
    done_when:
      - Action funktioniert gegen eine externe URL
      - Tests belegen: private Bereiche geblockt, Redirect auf privaten Bereich geblockt, Timeout greift
      - go build/vet/lint/test gruen
