      (postgres_repository_payment_stats_db_test.go,
      TestPostgresRepository_AggregatePaymentStats_PartialPaymentNotNettedFromOutstanding und
      _PaidAmountIgnoresOverpayment). `AggregatePaymentStats` (postgres_repository.go:530-570)
      speist `GetPaymentStats` — die Dashboard-Kennzahl, nach der ein Geschaeftsfuehrer
      entscheidet, wen er mahnt. Die Abfrage joint NIE gegen `finance_payments`, sondern
      summiert `gross_total` nach `status` allein:
      - eine teilweise bezahlte Rechnung (Status bleibt 'sent'/'overdue', bis die volle Summe
        erreicht ist) zaehlt mit ihrem VOLLEN `gross_total` in `total_outstanding_amount` —
        eine bereits verbuchte Teilzahlung senkt den ausgewiesenen offenen Betrag nicht
      - eine ueberbezahlte, als 'paid' markierte Rechnung zaehlt nur mit ihrem `gross_total`
        in `total_paid_amount` — der tatsaechlich vereinnahmte hoehere Betrag taucht nirgends
        auf
      Genau diese Klasse Fehler wurde fuer die Offene-Posten-Liste bereits einmal behoben:
      `postgres_open_items.go` (Kopfkommentar) beschreibt ausdruecklich, dass die fruehere
      Client-seitige Berechnung denselben Fehler hatte ("used the invoice gross amount, so an
      invoice with a partial payment was reported as fully outstanding") und `openItemsBase`
      joint seither korrekt gegen `finance_payments`. `AggregatePaymentStats` ist eine zweite,
      unabhaengige Implementierung derselben Kennzahl-Familie und hat den Fix nicht bekommen.
