      - Kein Handler in route_crm_activities.go oder route_crm_pipeline.go antwortet mehr 501
      - >-
        Ein Test belegt je einmal fuer Deal und Activity, dass ein Tag wirklich in der
        Join-Tabelle landet und nach RemoveTags wieder weg ist - tenant-gescoped, ueber den
        gRPC-Weg, nicht ueber eine direkt injizierte Service-Instanz
