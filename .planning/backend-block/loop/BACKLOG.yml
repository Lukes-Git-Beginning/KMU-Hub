      Video, Security, Email, Document, Biz (non-finance), Bexio, DATEV-Upload, Lexware,
      Integration, HR, Inbox, Automation, Dialer, Helpdesk, Berichte, Inventar, Einkauf,
      Produktion, Vertraege, Rapporte, Schichten, Vermietung, Fuhrpark, File, GlobalSearch,
      Dashboard, FeatureFlag, Health, Booking, Settings, Customization.
