  - id: fix-schichten-swaprequests-no-own-scope
    phase: 3
    service: schichten
    model: sonnet
    deps: []
    status: todo
    scope: >
      Es gibt keine own-Scope-Filterung fuer Tauschantraege - an keiner Stelle im Stack.
      `schichten.SwapRequestFilter` (repository.go:18) traegt nur `ShiftID`/`Status`,
      `ListSwapRequestsInput` (service.go:599) hat kein Mitarbeiterfeld, und die Gateway-Route
      `GET /schichten/swap-requests` (route_schichten.go:105) guardet nur mit der einzelnen
      flachen Permission `schichten:swap read` - keine own-Variante wie sie
      `rapporte`/`helpdesk` fuer denselben Zweck haben. Jeder Nutzer mit Lese-Recht auf
      `schichten:swap` sieht damit JEDEN Tauschantrag des Tenants, unabhaengig davon, ob er
      Antragsteller oder Tauschpartner ist. Verifiziert per Grep ueber
      `internal/schichten/**` und `internal/gateway/route_schichten.go` (0 Treffer fuer
      "own"/"Own"). `internal/rapporte/own_scope_list_test.go` und
      `internal/helpdesk/own_scope_list_test.go` zeigen das etablierte Muster: der Scope
      erreicht die Datenbank als Praedikat auf dem Autoren-/Zustaendigen-Feld, angewendet auf
      Service-Ebene (vor dem Offset/Limit-Split), sodass Zeilen UND `total` konsistent
      bleiben.
    sources:
      - backend/internal/schichten/repository.go
      - backend/internal/schichten/service.go
      - backend/internal/gateway/route_schichten.go
      - backend/internal/rapporte/own_scope_list_test.go
      - backend/internal/helpdesk/own_scope_list_test.go
    notes: >
      Gefunden waehrend b-cov-server-schichten (Lauf 7) - der Backlog-Scope dieser Unit
      forderte selbst "own-Scope ueber beide Mitarbeiterfelder geprueft" als done_when-
      Kriterium; beim Nachlesen von repository.go/service.go/route_schichten.go bestaetigt,
      dass die Filterung schlicht nicht existiert, statt nur falsch verdrahtet zu sein.
      Dokumentiert in `TestSchichten_ListSwapRequests_NoOwnScopeFiltering`
      (internal/server/schichten_grpc_test.go). Nicht inline gebaut - echte neue Filterlogik
      quer durch Repository/Service/Gateway, keine Coverage-Aenderung, nach Backlog-Regel
      eine eigene Unit. Anders als bei `a-inbox-sla` gibt es hier KEINE offene
      Produktentscheidung ueber Datenmodell oder Zustaendigkeit - beide Mitarbeiterfelder
      (`RequestedByEmployeeID`, `SwapWithEmployeeID`) existieren bereits auf `SwapRequest`,
      es fehlt nur die Filterung selbst. Einzige offene Frage: ob "own" bei Tauschantraegen
      ueberhaupt der richtige Default ist (Schichtleitung braucht ggf. tenant-weite Sicht
      fuer Genehmigen/Ablehnen) - falls ja, gehoert die own-Filterung nur an
      `ListSwapRequests` fuer die lesende Rolle, waehrend `ApproveSwapRequest`/
      `RejectSwapRequest` unveraendert bleiben. Fix-Vorschlag: `ListSwapRequestsInput` um
      ein optionales `OwnEmployeeID *uuid.UUID` erweitern, `SwapRequestFilter` um dasselbe
      Feld (matched gegen `requested_by_employee_id OR swap_with_employee_id`), und die
      Gateway-Route mit `RequirePermissionAny` auf eine "read"/"read:own"-Unterscheidung
      umstellen (Muster: `route_rapporte.go`/`route_helpdesk.go` abschauen).
    done_when:
