        bleiben tenant-weit oder bekommen ihre eigene Regel
      - SwapRequestFilter/ListSwapRequestsInput tragen ein own-Scope-Feld, matched gegen
        BEIDE Mitarbeiterfelder
      - Zeilen UND total bleiben konsistent (Filterung auf Service-Ebene, nicht nach dem
        Offset/Limit-Split)
      - TestSchichten_ListSwapRequests_NoOwnScopeFiltering in schichten_grpc_test.go auf
