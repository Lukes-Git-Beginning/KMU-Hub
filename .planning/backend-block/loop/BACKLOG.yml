# Backend-Nachtloop — Arbeitsqueue (Lauf 10, gestaged 2026-08-22)
#
# Eine Unit = eine Iteration = ein Commit.
#
# status: todo | in_progress | done | blocked
# model:  sonnet (Default) | opus (architektonisch schwer, Proto, Security, Migration+RLS)
#
# ACHTUNG Treiber-Parsing: `model:` muss VOR `status:` stehen, und hinter `status: todo`
# darf kein Kommentar stehen (der Treiber zaehlt offene Units per Zeilen-Regex).
#
# Laeufe 1+2 (58 Units): archive/lauf-1-2/ — Lauf 3 (61): archive/lauf-3/
# Lauf 4 (54): archive/lauf-4/ — Lauf 5 (41): archive/lauf-5/ — Lauf 6 (46): archive/lauf-6/
# Lauf 7 (71): archive/lauf-7/ — Lauf 8 (94): archive/lauf-8/ — Lauf 9 (37): archive/lauf-9/
# (jeweils inkl. logs/).
#
# Was der Loop NICHT zieht — geparkt oder gestrichen, mit Entscheidung und Zielort:
# BACKLOG-PARKED.yml. In DIESER Datei steht keine `blocked`-Unit. Wird eine Unit im Lauf
# blockiert, gehoert ein `blocked_reason` dazu, der sagt, WORAUF sie wartet und WER das
# entscheidet.
#
# ------------------------------------------------------------------------------------------
# STAND DER VORBEREITUNG (2026-08-22, alles gegen den laufenden Code und die lokale DB gemessen)
#
#   - Lauf 9 ist gemergt und deployt. `main` steht auf `fb9ea6cb`, CI gruen auf `1b49a1f3`
#     (Run 32508843776, CI Desktop 32508843728), CD gruen auf `390a75f5`.
#   - MIGRATIONSKOPF = 314 (Repo und lokale DB, `schema_migrations` clean). Naechste freie
#     Nummer waere 315, aber IMMER zur Laufzeit ermitteln:
#     `ls backend/migrations | grep -E '^[0-9]{6}' | sort | tail -1`
#   - `backend-loop` ist auf `origin/main` GEMERGT (nicht rebased).
#   - Das DB-Gate ist ab diesem Lauf im Treiber erzwungen: `run-loop.ps1` prueft vor der ersten
#     Iteration Port, Anmeldung als `kmuhub_app` und Migrationskopf und BRICHT AB, wenn eins
#     davon fehlt. Grund: `testutil.SkipIfNoDB` fragt nur, OB `DATABASE_URL` gesetzt ist. Am
#     2026-08-22 an `internal/security/audit` gemessen — mit DB 33 PASS / 0 SKIP, ohne die
#     Variable 19 PASS / 14 SKIP, beide Male "ok" und Exit 0.
#
# COVERAGE-AUSGANGSLAGE (CI-Run 32508843776 auf `1b49a1f3`, gesamt 60,2 % bei Gate 15 %):
#     gateway 46,1 (schwaechstes Kernpaket) · security/gdpr 61,2 · security/audit 80,1
#     crm/contact 80,4 · crm/advisoryprotocol 65,5 · crm/company 79,7 · settings 60,3
#     helpdesk 81,5 · biz/gobdarchive 89,9 · biz/quote 33,3 · biz/einvoice 81,9
#     biz/recurring 88,1 · biz/banking 77,0 · biz/lexware 74,4 · biz/datev 79,7
#     email/message 79,7 · email/signature 43,0 · email/contactlink 35,0 · work/label 15,2
#
# ------------------------------------------------------------------------------------------
# DER ROTE FADEN DIESES LAUFS
#
# Lauf 10 hat zwei Haelften und einen Nachfueller.
#
#   BLOCK A (14 Units) — DATENSCHUTZ-MECHANIK. Zahlt direkt auf Gate 3 ein: "eine Auskunfts-
#     anfrage und eine Loeschanfrage sind vollstaendig ueber die Oberflaeche bedienbar"
#     (`.planning/launch-lagebild-2026-08-12.md` §6). Das ist die Etappe, die VOR dem ersten
#     echten personenbezogenen Datensatz fertig sein muss — also bevor ein Kunde etwas
#     eingibt, nicht danach.
#
#   BLOCK B (25 Units) — GATEWAY-HAERTUNG. `internal/gateway` ist mit 46,1 % das schwaechste
#     Kernpaket und traegt jede oeffentliche Flaeche. Von 75 `route_*.go` haben 23 keine eigene
#     Testdatei; die groessten davon sind route_email.go (1.612 Zeilen) und route_settings.go
#     (1.029). Reihenfolge: Geld- und Compliance-Pfade zuerst, dann datenschutznahe Flaechen,
#     dann der Rest.
#
#   BLOCK C (9 Units) — MUSTER-SCANS, am Schluss. Sie referenzieren die in A und B gebauten
#     Faelle als Vorlage und LEGEN JEDEN FUND ALS NEUE UNIT AM BACKLOG-ENDE AN
#     (`neue-units:` ist Pflichtzeile). Eine Scan-Unit ohne Funde ist ein gueltiges Ergebnis —
#     aber nur mit Beleg, WAS geprueft wurde. Scan-Units aendern selbst KEIN Verhalten ausser
#     dem Anlegen von Units. In Lauf 9 haben 11 Scans 16 Zusatz-Units erzeugt.
#
# ------------------------------------------------------------------------------------------
# BEFUNDE DER VORBEREITUNG — vor dem Bauen lesen. Zwei davon korrigieren den Entwurf.
#
#  1. `contact_tags.contact_id` HAT einen Foreign Key. Der Entwurf behauptete das Gegenteil und
#     plante dafuer eine eigene Migration. Gegengeprueft an zwei Stellen:
#     `migrations/000007_create_contacts_companies.up.sql:81` legt `fk_contact_tags_contact`
#     mit `ON DELETE CASCADE` an, und `\d contact_tags` gegen die lokale DB zeigt ihn als
#     bestehenden Constraint. Die geplante Unit `fix-contact-tags-missing-foreign-key` ist
#     ERSATZLOS GESTRICHEN — sie haette eine Migration gegen ein Problem gebaut, das es nicht
#     gibt. An ihre Stelle tritt C9 (Rest-Personendaten auf den SET-NULL-Tabellen).
#
#  2. Die Loeschkaskade an `contacts` ist vollstaendig vermessen (pg_constraint, lokale DB):
#       CASCADE  (4): contact_custom_field_values, contact_tags, email_contact_links,
#                     gdpr_deletion_requests
#       SET NULL (8): activities, consent_records, contacts (Selbstbezug), contract_parties,
#                     deals, finance_invoices, meetings, tickets
#       RESTRICT (2): advisory_protocols, dialer_campaign_contacts
#     Die Zahl 8 aus dem Entwurf stimmt also. `IsInUse`
#     (`internal/crm/contact/postgres_repository.go:549`) prueft genau die zwei RESTRICT-FKs —
#     der 409-Pfad und die Anonymisierung vom 19.08. sind gebaut, das ist kein offener Punkt
#     mehr. Offen ist, was der Benutzer VOR dem Klick sieht (A2) und was auf den acht
#     SET-NULL-Tabellen an Personendaten liegen bleibt (C9).
#
#  3. Die DSAR-Luecke auf der Benutzerseite ist so gross wie beschrieben. `matchUsers`
#     (`internal/security/gdpr/dsar_search.go:213`) haengt GENAU EIN Modul an: "Benutzerkonto"
#     mit vier Feldern. Kein Chat, kein Work, kein Kalender, keine Notification — obwohl sieben
#     Erasure-Handler (audit, auth, calendar, chat, crm, notifications, work) die Tabellen
#     dafuer kennen. Die Kontaktseite ist deutlich weiter: `SearchByQuery` haengt zehn Module
#     an (CRM Kontakte, Einwilligungen, Anrufe, Rechnungen, Meetings, Helpdesk-Tickets,
#     Vertraege, E-Mails, Deals, Aktivitaeten).
#
#  4. DATEV/Windows-1252 ist KEIN bestaetigter Bug. `exporter_test.go:409-422` traegt bereits
#     einen ausfuehrlichen Kommentar, der die Praemisse zurueckweist: `NewStreamWriter` schreibt
#     eine UTF-8-BOM, `encoding/csv` emittiert nur UTF-8, und im ganzen Paket gibt es keinen
#     cp1252-Transcoding-Schritt. Deshalb steht hier eine VERIFY-Unit mit hartem Nicht-Fix-
#     Kriterium (B25), keine Fix-Unit. Blind umkodieren waere eine Regression.
#
#  5. Route-Dateien: 75 Quelldateien `route_*.go`, davon 23 ohne eigene Testdatei — nicht 87/29
#     wie im Statusdokument. Die groessten UNGETESTETEN sind route_email.go (1.612) und
#     route_settings.go (1.029), nicht die groessten insgesamt (route_video.go 2.379,
#     route_hr.go 2.300, route_auth.go 1.923 haben Tests).
#
#  6. `retention_policies` existiert als Tabelle (tenant_id, resource_type varchar(64),
#     retention_days, action, enabled, ...) und wird ausschliesslich von
#     `internal/server/security_grpc.go` bedient — reines CRUD. Es gibt KEINEN Worker, kein
#     Scheduling und keine Zuordnung resource_type -> Tabelle. `resource_type` ist ein freier
#     String ohne Enum/Whitelist (`route_security.go:143-147`, nur `validate:"required"`).
#     Eine Policy anlegen zu koennen, ohne dass irgendetwas sie ausfuehrt, ist die gefaehrlichste
#     Variante: sie sieht in der Oberflaeche aus wie eine erfuellte Loeschpflicht.
#
#  7. GoBD-Grant bestaetigt: `000121_create_app_role.up.sql:49` erteilt kmuhub_app ein
#     schema-weites `GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES` — inklusive der
#     Belegarchiv-Tabellen aus `000139_gobd_belegarchiv.up.sql`. Ein Grep ueber `internal/`
#     findet kein einziges `UPDATE gobd`/`DELETE FROM gobd` im Go-Code, ein REVOKE ist also
#     gefahrlos.
#
# ------------------------------------------------------------------------------------------
# HARTE REGELN FUER DIESEN LAUF
#
#   1. Root Cause, nicht Symptom. Vor jedem Fix alle Caller der angefassten Funktion greppen.
#      Sitzt derselbe Bug in einer Schwesterfunktion, gehoert er in dieselbe Unit.
#   2. Mutations-Probe ist Pflicht: eine Zeile der Fix-Logik brechen, pruefen dass ein Test
#      rot wird, zurueckdrehen, Diff sauber. Ohne Probe ist der Test nicht bewiesen.
#   3. `go test` ohne `DATABASE_URL` ist KEIN Gate. Die Rolle muss `kmuhub_app` sein —
#      `kmuhub` hat BYPASSRLS und wuerde jede RLS-Luecke durchwinken. Der Treiber erzwingt das
#      jetzt beim Start; wer es innerhalb einer Iteration umgeht, betruegt sich selbst.
#   4. Scan-Units: ein Fund ohne angelegte Unit ist kein Fund. `neue-units:` im Journal muss
#      die IDs nennen, die wirklich in dieser Datei stehen.
#   5. Jede neue Tabelle braucht `tenant_id UUID NOT NULL` + RLS-Policy — oder einen Eintrag in
#      der System-Global-Liste (ADR-006). Kein stiller dritter Weg.
#   6. Eine Praemisse aus dem Backlog, die sich am Code als falsch erweist, wird NICHT
#      trotzdem gebaut. Sie wird im Journal widerlegt und die Unit auf `blocked` gesetzt —
#      siehe Befund 1, der genau so entstanden ist.
#
# GESPERRT IN DIESEM LAUF (nicht anfassen, auch nicht "nur schnell"):
#   - Frontend/Desktop jeder Art. Der Loop hat kein Playwright-Gate.
#   - CSAT und die uebrigen Public-Token-Routen — stillgelegt, siehe BACKLOG-PARKED.yml
#     (Projekt "Public Web Surface"). Die Passwort-Reset-Seite ist die EINE Ausnahme und ist
#     fertig; beim Anfassen von `cmd/gateway/main.go` nicht versehentlich ausbauen.
#   - Electron-Upgrade / Dependency-Bumps.
#   - `deploy/` und Migrations-Umnummerierungen.
#   - Preise, Modul-Zuschnitt, `lib/pricing.ts` — offene Produktentscheidungen.
# ==========================================================================================

units:

# ==========================================================================================
# BLOCK A — Datenschutz-Mechanik. Reihenfolge ist Absicht:
# GoBD-WORM zuerst (unabhaengig, risikoarm, blockiert nichts), dann die Kaskaden-Vorschau,
# dann die DSAR-Luecken (erst Kontakt-, dann Benutzerseite), Retention-Worker zuletzt —
# groesstes Stueck und einziger echter deps-Zaun im Backlog.
# ==========================================================================================

  - id: fix-gobd-belegarchiv-worm-enforcement
    phase: 3
    service: biz
    model: opus
    deps: []
    status: done
    coverage_start: "internal/biz/gobdarchive 89,9 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      Das GoBD-Belegarchiv ist als unveraenderliches Archiv gedacht (Unveraenderbarkeit nach
      GoBD), aber die Datenbank erzwingt davon nichts.
      `000121_create_app_role.up.sql:49` erteilt `kmuhub_app` ein schema-weites
      `GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public` — die Tabellen aus
      `000139_gobd_belegarchiv.up.sql` sind darin enthalten. Jeder Handler, jede kuenftige
      Query und jede SQL-Injection-Luecke kann damit ein archiviertes Dokument aendern oder
      loeschen. Die Unveraenderbarkeit existiert heute nur als Absicht im Go-Code.
    sources:
      - backend/migrations/000121_create_app_role.up.sql
      - backend/migrations/000139_gobd_belegarchiv.up.sql
      - backend/internal/biz/gobdarchive/postgres_repository.go
      - backend/internal/biz/gobdarchive/service.go
      - backend/internal/models/gobd.go
    notes: >
      REVOKE-only, keine Datenaenderung, kein Verhalten im Go-Code betroffen: ein Grep ueber
      `internal/` nach "UPDATE gobd" und "DELETE FROM gobd" liefert NULL Treffer (geprueft
      2026-08-22). Das ist die Begruendung, warum das gefahrlos ist — sie gehoert in den
      Migrationskopf, nicht nur ins Journal.
      ZUERST die tatsaechliche Tabellenliste aus 000139 ziehen, nicht raten; das Archiv besteht
      aus mehreren Tabellen und mindestens eine davon kann eine Verknuepfungstabelle sein, bei
      der DELETE legitim ist. Pro Tabelle entscheiden und begruenden.
      Die default privileges aus 000121 Abschnitt 4 muessen mitbedacht werden, sonst holt sich
      eine kuenftige Migration das Recht still zurueck.
      Kein REVOKE gegen die Rolle `kmuhub` — Migrationen laufen unter ihr und muessen das
      Archiv weiterhin strukturell aendern koennen.
    done_when:
      - Migration entzieht kmuhub_app UPDATE und DELETE auf den Belegarchiv-Tabellen, mit
        Begruendung je Tabelle im Migrationskopf
      - Ein Test schreibt als kmuhub_app in eine Archivtabelle und erwartet den Rechtefehler;
        SELECT und INSERT bleiben nachweislich moeglich
      - Der bestehende Archivierungspfad (Service + Repository) laeuft unveraendert gruen
      - down-Migration stellt die Rechte wieder her
      - go test -count=1 ./internal/biz/gobdarchive/... gruen, DATABASE_URL gegen kmuhub_app

  - id: feat-contact-deletion-cascade-impact-preview
    phase: 3
    service: crm
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/crm/contact 80,4 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      Wer heute einen Kontakt loescht, erfaehrt vorher nur, OB die Loeschung blockiert ist
      (`IsInUse` prueft die zwei RESTRICT-FKs und fuehrt zu 409 mit Anonymisierungsangebot).
      Was die Loeschung ANRICHTET, wenn sie durchgeht, sagt ihm niemand: vier Tabellen
      kaskadieren mit, acht setzen ihre Referenz auf NULL. Konkret verliert eine Rechnung ihren
      Kontaktbezug, ein Ticket seinen Melder, ein Deal seinen Ansprechpartner — lautlos und
      unwiderruflich. Diese Unit liefert die Zahlen VOR dem Klick.
    sources:
      - backend/internal/crm/contact/postgres_repository.go
      - backend/internal/crm/contact/service.go
      - backend/internal/crm/contact/repository.go
      - backend/internal/gateway/route_crm_ext.go
      - backend/api/openapi.yaml
    notes: >
      Die Kaskadenlage ist vollstaendig vermessen (2026-08-22, pg_constraint gegen die lokale
      DB) und steht in Befund 2 des Kopfes: 4 CASCADE, 8 SET NULL, 2 RESTRICT. Diese Liste ist
      die Vorlage — aber NICHT hartcodieren. Sie zur Laufzeit aus `pg_constraint` zu lesen ist
      dieselbe Menge Code und bleibt korrekt, wenn eine spaetere Migration einen FK hinzufuegt;
      eine hartcodierte Liste ist ab dem naechsten ALTER TABLE eine Luege in der Oberflaeche.
      `IsInUse` ist die Vorlage fuer die Query-Form und liegt in derselben Datei
      (postgres_repository.go:549). Nicht duplizieren, sondern die gemeinsame Mechanik ziehen.
      Reine Lesefunktion — sie darf unter keinen Umstaenden etwas veraendern.
      Das Frontend dazu ist in diesem Lauf GESPERRT (kein Playwright-Gate). Diese Unit liefert
      Repository, Service und Route inklusive OpenAPI-Eintrag, nicht mehr.
    done_when:
      - Repository liefert je referenzierender Tabelle Regel (cascade/set null/restrict) und
        betroffene Zeilenzahl fuer einen Kontakt, aus pg_constraint ermittelt
      - Service verdichtet das zu einer Vorschau; RESTRICT-Treffer bleiben mit IsInUse konsistent
      - GET-Route unter der bestehenden Kontakt-Berechtigung, in openapi.yaml dokumentiert
      - Tenant-Isolation getestet, die Vorschau eines fremden Kontakts liefert 404 statt 200 mit 0
      - go test -count=1 ./internal/crm/... ./internal/gateway/ gruen, DATABASE_URL gesetzt

  - id: feat-dsar-search-contact-custom-fields-and-tags
    phase: 3
    service: security
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/security/gdpr 61,2 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      Die Art.-15-Auskunft fuer einen Kontakt haengt zehn Module an (`SearchByQuery`,
      dsar_search.go:59). Zwei Datentoepfe fehlen, die genau dort liegen, wo ein Kunde seine
      eigenen Felder anlegt: `contact_custom_field_values` und `contact_tags`. Beide
      kaskadieren beim Loeschen mit — die Auskunft weiss also von Daten nichts, die die
      Loeschung sehr wohl entfernt. Das ist die schlechteste Kombination: Auskunft
      unvollstaendig, Loeschung vollstaendig.
    sources:
      - backend/internal/security/gdpr/dsar_search.go
      - backend/internal/crm/customfield/postgres_repository.go
      - backend/internal/crm/tag/postgres_repository.go
      - backend/internal/security/gdpr/dsar_search_test.go
    notes: >
      Vorlage ist `consentModule` (dsar_search.go:264) — dieselbe Form: Query, nil bei leerem
      Ergebnis, `DSARModule` mit `Columns` und `Records`. Nicht neu erfinden, kopieren und
      anpassen. Wer nil zurueckgibt, erzeugt in der Oberflaeche kein leeres Modul; das ist
      Absicht und muss so bleiben.
      Custom Fields brauchen den Feld-NAMEN, nicht die Feld-ID — sonst steht in der Auskunft
      eine UUID, wo der Kunde "Kundennummer" erwartet. Das heisst Join auf die Definitionstabelle.
      Tenant-Filter nicht vergessen: `consentModule` bekommt nur die contactID, die anderen
      Module bekommen zusaetzlich die tenantID. Fuer beide neuen Module gilt die strengere
      Variante, auch wenn RLS ohnehin greift.
    done_when:
      - Zwei neue Module haengen an einem gematchten Kontakt, Custom Fields mit Klarnamen
      - Leere Ergebnisse erzeugen kein leeres Modul (nil), wie bei den bestehenden neun
      - DB-Test mit geseedetem Kontakt inkl. Feldwert und Tag belegt beide Module
      - Ein Kontakt eines fremden Tenants taucht in keinem der beiden Module auf
      - go test -count=1 ./internal/security/gdpr/... gruen, DATABASE_URL gesetzt

  - id: feat-dsar-search-contact-form-submissions
    phase: 3
    service: security
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/security/gdpr 61,2 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      Formulareinreichungen sind der einzige Weg, auf dem eine Person Daten ueber sich selbst
      ins System schreibt, ohne dass ein Mitarbeiter sie eintippt — Kontaktformular,
      Selfservice-Ticket, Intake. Genau diese Daten fehlen in der Auskunft vollstaendig. Die
      Verknuepfung laeuft nicht ueber `contact_id`, sondern ueber die eingetragene E-Mail;
      deshalb ist das eine eigene Unit und kein Anhaengsel an A3.
    sources:
      - backend/internal/formulare/postgres_repository.go
      - backend/internal/security/gdpr/dsar_search.go
      - backend/internal/models/formulare.go
    notes: >
      ZUERST das Schema pruefen, nicht die Annahme uebernehmen: der Entwurf ging von einer
      Spalte `submitted_by` mit der Kontakt-E-Mail aus. Ob die Einreichung die E-Mail in einer
      eigenen Spalte oder im JSON-Payload traegt, entscheidet die Query-Form komplett. Steht
      sie nur im Payload, ist ein Match ueber JSON-Feldwerte noetig — dann in den notes
      dokumentieren, dass die Zuordnung heuristisch ist, statt sie als sicher auszugeben.
      Der Payload kann beliebige Felder enthalten, auch Freitext mit weiteren Personendaten.
      In der Auskunft gehoert er vollstaendig hinein — eine Auskunft, die den eingegebenen
      Text weglaesst, ist keine.
      Achtung Tenant: Formulare koennen oeffentlich erreichbar sein. Der Tenant-Filter ist hier
      Pflicht und muss getestet werden, nicht mitgedacht.
    done_when:
      - Modul "Formulareinreichungen" haengt an einem gematchten Kontakt, mit Datum, Formularname
        und den eingereichten Feldwerten
      - Die Zuordnungsregel (Spalte oder Payload-Feld) ist im Code kommentiert und im Journal
        benannt, inklusive ihrer Unschaerfe
      - DB-Test mit geseedeter Einreichung belegt den Treffer und den Nicht-Treffer bei fremder
        E-Mail
      - Tenant-Isolation getestet
      - go test -count=1 ./internal/security/gdpr/... gruen, DATABASE_URL gesetzt

  - id: feat-dsar-search-contact-documents
    phase: 3
    service: security
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/security/gdpr 61,2 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      Zu einem Kontakt hochgeladene Dokumente (Vertragskopien, Ausweise, Korrespondenz) tauchen
      in der Auskunft nicht auf. Die Verknuepfung existiert bereits als Tabelle
      (`document_entity_links`), sie wird von der DSAR-Suche nur nicht gelesen.
    sources:
      - backend/internal/document/file/postgres_repository.go
      - backend/internal/security/gdpr/dsar_search.go
      - backend/internal/gateway/route_crm_contact_files.go
    notes: >
      NUR METADATEN: Dateiname, Typ, Groesse, Hochladedatum. Kein Inhalt, kein Download-Link,
      keine Signed URL. Eine Auskunftsantwort ist ein Export, der per Definition das Haus
      verlaesst — ein Link darin waere ein Zugriffsweg auf den Dokumentenspeicher, der die
      Berechtigungspruefung umgeht.
      Struktur von `document_entity_links` zuerst lesen: entity_type/entity_id-Muster heisst,
      dass der Filter auf den richtigen entity_type-Wert fuer Kontakte gehen muss. Den Wert aus
      dem Code ziehen, nicht raten.
      Geloeschte oder in den Papierkorb verschobene Dokumente gehoeren NICHT in die Auskunft,
      wenn sie fuer den Kunden nicht mehr existieren — aber die Entscheidung begruenden, nicht
      stillschweigend filtern.
    done_when:
      - Modul "Dokumente" haengt an einem gematchten Kontakt, ausschliesslich mit Metadaten
      - Kein Pfad, keine URL und kein Inhalt im Export, per Test belegt
      - Der entity_type-Wert stammt aus dem Code, nicht aus einer Annahme
      - DB-Test mit geseedeter Verknuepfung, inklusive Tenant-Isolation
      - go test -count=1 ./internal/security/gdpr/... gruen, DATABASE_URL gesetzt

  - id: feat-dsar-search-contact-helpdesk-messages
    phase: 3
    service: security
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/security/gdpr 61,2 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      `helpdeskModule` (dsar_search.go:419) liefert die TICKETS eines Kontakts — Betreff,
      Status, Prioritaet, Datum. Die Nachrichten darin fehlen, und die sind der eigentliche
      personenbezogene Inhalt: was die Person geschrieben hat und was ihr geantwortet wurde.
    sources:
      - backend/internal/helpdesk/repository.go
      - backend/internal/security/gdpr/dsar_search.go
      - backend/internal/models/helpdesk.go
    notes: >
      INTERNE NOTIZEN AUSSCHLIESSEN. Interne Kommentare am Ticket sind Arbeitsmaterial des
