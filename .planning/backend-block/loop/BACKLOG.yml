      `SkipIfNoDB` respektieren, aber im Fehlertext klar sagen, WELCHE Tabelle fehlt — ein
      "irgendwas ist ungeschuetzt" hilft um 03:00 niemandem.
      Das ist die Unit, die verhindert, dass Block B in drei Monaten wieder noetig wird.
    done_when:
