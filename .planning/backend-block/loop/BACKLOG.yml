  - id: harden-caldav-rest-routes-missing-idempotency
    phase: 4
    service: gateway
    model: opus
    deps: []
    status: done
    coverage_start: "internal/caldav 54,9 % (CI-Stand 32735558575)"
    scope: >
      VERIFIZIERT 2026-08-24. In Lauf 11 zweimal beobachtet (Iteration 15 und 60) und in zwölf
      weiteren Iterationen nur als AUSSCHLUSSKRITERIUM der 409-Rollout-Kette gefuehrt — nie
      als Unit angelegt, nie gefixt.
      `route_caldav.go:146` registriert `/api/v1/caldav` mit `sub.Use(c.authMiddleware)` —
      der BARE authMiddleware, nicht dem `authWithIdempotency` aus `cmd/gateway/main.go:205`
      (`authMiddleware(idempotencyMW(next))`), das jede andere mutierende Flaeche bekommt.
      Betroffen sind fuenf mutierende Routen: `POST /passwords` (erzeugt ein
      App-spezifisches Passwort — ein Doppelklick erzeugt ZWEI gueltige Passwoerter, von denen
      der Nutzer nur eines zu sehen bekommt), `DELETE /passwords/{id}`, `PUT /enable`,
      `PUT /disable`, `POST /test`. Der Admin-Block (`:161`) hat dasselbe Problem bei
      `PUT /settings` und `DELETE /users/{userId}/passwords`.
      Zu bauen: beide Bloecke auf dieselbe Middleware-Kette umstellen, die die uebrigen
      `/api/v1`-Routen benutzen. Der Weg dorthin ist NICHT "idempotencyMW hier auch
      einhaengen", sondern zuerst greppen, WIE die Kette anderswo gebaut wird und ob
      `CalDAVRoutes` ueberhaupt Zugriff darauf hat — `c.authMiddleware` ist ein Feld der
      Struktur, die Kette wird also beim Konstruieren uebergeben. Root Cause ist
      moeglicherweise, dass der Konstruktor nur die halbe Kette bekommt.
    sources:
      - backend/internal/gateway/route_caldav.go
      - backend/cmd/gateway/main.go
      - backend/internal/middleware/idempotency.go
      - backend/internal/gateway/route_hr.go
    notes: >
      Die Middleware laeuft produktiv im WarnMode (`IDEMPOTENCY_MODE` steht nicht auf "hard").
      Das heisst: bei FEHLENDEM Key passiert nichts, bei VORHANDENEM Key wird immer
      dedupliziert (`middleware/idempotency.go:78-152`). Diese Unit schafft also die
      Moeglichkeit zur Deduplizierung, sie erzwingt sie nicht — genau wie ueberall sonst.
      Der Modus wird NICHT geaendert.
      NEBENFUND, in derselben Datei, NICHT in dieser Unit fixen, aber im Journal nennen:
      `basicAuthMiddleware` sendet `WWW-Authenticate: Basic realm="KMU Hub CalDAV"` — ein
      user-sichtbarer String mit dem alten Produktnamen, den der Browser im Anmeldedialog
      anzeigt. Er gehoert in die Inventur von Scan D10, nicht in diesen Fix.
      Die CalDAV-Protokollrouten (`/caldav`, `/carddav`) bleiben unangetastet: sie sprechen
      HTTP Basic Auth und WebDAV-Verben, kein Client dort kennt einen Idempotency-Key.
    done_when:
      - >-
        Die mutierenden Routen unter /api/v1/caldav und /api/v1/admin/caldav laufen durch
        dieselbe Middleware-Kette wie die uebrigen mutierenden /api/v1-Routen
      - >-
        Ein Test belegt, dass zwei POST /api/v1/caldav/passwords mit demselben
        Idempotency-Key genau EIN App-Passwort erzeugen und die zweite Antwort
