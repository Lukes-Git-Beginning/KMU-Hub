  - id: fix-gateway-bexio-error-message-leakage
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    coverage_start: "internal/gateway 46,1 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      Fund aus scan-gateway-sql-error-leakage (Iteration 44). `HandleBexioOAuthCallback`,
      `PushInvoiceToBexio` und `PushQuoteToBexio` (`internal/server/bexio_grpc.go:43,266,287`)
      geben bei einem Fehler NICHT `status.Error(...)` zurueck, sondern eine Erfolgsantwort mit
      `Success: false, ErrorMessage: err.Error()` — das umgeht `respondGRPCError`
      (`internal/gateway/helpers.go:28`) vollstaendig, die genau dafuer da ist, interne
      Fehlertexte bei Internal-Fehlern zu maskieren. `err` stammt u. a. aus
      `bexioService.HandleOAuthCallback`/`PushInvoice`/`PushQuote`, die Vault- und
      Datenbank-Aufrufe (Config-Upsert, Token-Speicherung) machen koennen.
      Der Gateway-Code reicht das dann an drei Stellen unveraendert weiter:
      `route_bexio.go:123` schreibt `resp.GetErrorMessage()` UNESCAPED in eine
      Redirect-Location (`http.Redirect(w, r, "/settings/integrations?bexio_error="+..., 302)`)
      — ein interner Fehlertext (moeglicherweise mit Zeilenumbruechen oder Sonderzeichen aus
      einer SQL-Fehlermeldung) landet damit in einem HTTP-Location-Header ohne
      `url.QueryEscape`. `route_bexio.go:411-412` und `524-525`/`561-562` betten dieselbe
      Rohmeldung in JSON-Statusantworten (`error_message`) ein.
      Separater, aber verwandter Fund in derselben Handler-Umgebung: `route_bexio.go:92`
      reflektiert den externen Query-Parameter `error` (von Bexio selbst gesendet, also
      grundsaetzlich auch von einem Angreifer faelschbar, da der Endpunkt oeffentlich ist) ohne
      Escaping in dieselbe Redirect-Location. Beide Stellen gehoeren in denselben Fix, weil sie
      denselben Handler und denselben ungesicherten String-Concat-Pfad betreffen.
    sources:
      - backend/internal/server/bexio_grpc.go
      - backend/internal/gateway/route_bexio.go
      - backend/internal/gateway/helpers.go
      - backend/internal/biz/bexio/
    notes: >
      Zwei getrennte Probleme, ein Fix-Umfang: (1) interne Fehlertexte (Vault/DB) duerfen nicht
      im Klartext beim Client landen — entweder `mapBexioError`-Stil-Codes verwenden (bereits
      vorhanden fuer `DisconnectBexio`, als Vorlage nehmen) oder im Gateway vor der Ausgabe auf
      eine feste, sichere Meldung abbilden und den Rohtext nur ins `slog` loggen. (2) JEDER
      String, der in eine Redirect-Location eingebettet wird, muss durch `url.QueryEscape`
      (oder `url.Values.Encode()`), sonst ist das ein Header-/Query-Injection-Risiko —
      unabhaengig davon, ob die Quelle intern (ErrorMessage) oder extern (Query-Param) ist.
      Root Cause zuerst pruefen: `mapBexioError` existiert bereits fuer den
      `status.Error`-Rueckgabepfad — der naheliegende Fix ist, `HandleOAuthCallback`,
      `PushInvoice` und `PushQuote` auf denselben Pfad umzustellen (echten gRPC-Status-Fehler
      zurueckgeben statt Success:false+Klartext), statt im Gateway einen zweiten
      Maskierungsmechanismus danebenzubauen.
    done_when:
      - Kein Vault-/DB-/interner Fehlertext erreicht mehr die HTTP-Antwort (Redirect-Query oder
        JSON), weder bei der OAuth-Callback- noch bei der Push-Route
      - Jeder String, der in eine Redirect-Location eingebettet wird (intern oder extern),
        ist ge-escaped
      - Ein Test provoziert einen Fehler mit einem Sonderzeichen (z. B. Zeilenumbruch oder `&`)
        im simulierten Fehlertext und belegt, dass er weder im Location-Header noch im
        JSON-Body im Klartext auftaucht
      - go test -count=1 ./internal/gateway/ ./internal/server/... gruen, DATABASE_URL gesetzt

