      `GET/PATCH /api/v1/admin/license` (route_settings.go:788/823) liefert/setzt
      `tenant_module_activations` (Migration 000250). `GET /api/v1/tenant/module-grants`
      (route_settings.go:74-80) liefert `user_module_grants` (Migration 000220) — die Datenbasis
