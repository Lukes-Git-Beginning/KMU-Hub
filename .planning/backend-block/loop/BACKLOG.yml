  - id: harden-email-dial-guard-for-account-hosts
    phase: 4
    service: email
    model: opus
    deps: []
    status: todo
    decided: '2026-10-25'
    decision: >
      ENTSCHEIDUNG LUKE, 2026-10-25 (Entscheidungsrunde zur Vorbereitung von Lauf 17): member richtet sein
      Postfach selbst ein; Voraussetzung ist ein Dial-Filter mit Ausnahmeliste per Env.
    target: kein E-Mail-Dial auf interne Adressen ausser per Allowlist
    coverage_start: n.a.
    scope: >
      `account.Service.TestConnection` und der IMAP-/SMTP-Sync wählen jeden Host:Port an, den der Body nennt
      (`imapclient.DialTLS`, kein Filter). Für Nicht-Admins geöffnet wäre das ein Portscan-Orakel ins Docker-Netz
      (Postgres, Redis, MinIO). Dial-Filter nach dem Muster von `security/safehttp` (IP-Klassifikation wiederverwenden,
      nicht kopieren): Den Host auflösen und loopback, private, link-local sowie unspecified ablehnen, und
      zwar beim Dial selbst, nicht nur bei der Validierung (DNS-Rebinding). Optionales Env `EMAIL_DIAL_ALLOWLIST`
      (Host/CIDR, komma-getrennt, Default leer, KEIN `config.RequireX`) für Self-Hosted-Kunden mit internem
      Mailserver. Compose und deploy/ sind gesperrt: Den nötigen Passthrough in `offen:` vermerken.
    sources:
      - backend/internal/email/account/
      - backend/internal/email/sync/
      - backend/internal/security/safehttp/
      - backend/internal/config/config.go
    done_when:
      - >
        Tests: 127.0.0.1, 10.0.0.0/8, 172.16/12, ::1 und ein Docker-Hostname werden abgelehnt; öffentliche
        Adresse und Allowlist-Eintrag gehen (Resolver-Stub)
      - Der Filter greift in TestConnection, Create/Update und im Sync-Dial
      - go test -count=1 ./internal/email/... ./internal/server/ grün

