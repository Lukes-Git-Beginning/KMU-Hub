      derselben Migration**. `hr_admin` haelt `role:assign`, aber bewusst NICHT dieses Recht.
      Audit: jede Aenderung schreibt `permission.override_set` bzw. `permission.override_removed`
      pro geaendertem Key ueber denselben Interceptor wie `p1b-audit-events` — kein zweiter Pfad.
    done_when:
      - Tabelle mit tenant_id + RLS, Migration up/down/up gruen
      - drei Routen registriert, PUT ersetzt vollstaendig, leere Map loescht
      - unbekannter permission_key -> 422
      - Eskalation, Selbst-Aussperrung, Last-Admin geblockt (Tests)
      - Seed fuer admin:user_override:manage in derselben Migration
      - openapi.yaml + go test -count=1 ./internal/gateway/ ./internal/auth/... gruen

  - id: g-rbac-user-overrides-resolver
    phase: 3
    service: auth
    model: opus
    deps: [g-rbac-user-overrides-model]
    status: todo
    scope: >
      Die Overrides in die Rechte-Aufloesung einhaengen. `GET /auth/me/permissions` und
      `GET /admin/users/{id}/permissions` liefern danach die aufgeloesten Capabilities INKLUSIVE
      Overrides, plus die zwei Zusatzfelder `hasOverrides: boolean` und
      `deniedByOverride: [{key, roleScope, sources}]`. Der Parameter `?base=1` liefert weiterhin
      die reine Rollen-Union ohne Overrides (Editor-Baseline).
      Verifiziert am 2026-08-02: alle drei Bestandteile sind im FE-Vertrag
      (`desktop/src/renderer/src/api/rbac-types.ts`, `rbac-client.ts:48`) spezifiziert,
      serverseitig existiert keiner davon.
    sources:
      - desktop/src/renderer/src/api/rbac-types.ts
      - desktop/src/renderer/src/mocks/data/rbac.ts
      - backend/internal/auth/
    notes: >
      Referenz ist `applyUserOverrides()` in `mocks/data/rbac.ts`: **eine** Naht, nicht mehrere.
      Erst die Rollen-Union wie bisher, danach die Overrides — `deny` entfernt den Key komplett,
      `allow` setzt oder hebt den Scope. Der Override gewinnt pro Key ueber ALLE Rollen.
      Ein allow-Override taggt den Grant mit dem Sentinel `sources: ['override', ...]`, sonst
      zeigt die Effektive-Rechte-Ansicht eine falsche Herkunft. deny-Keys wandern nach
      `deniedByOverride` und verschwinden aus `capabilities`.
      `<modul>:module:view` ist ein ganz normaler Key — kein Sonderfall im Resolver.
      **Der Resolver liegt im Login-Pfad.** Die Capabilities werden ins JWT gebacken; eine
      zusaetzliche Abfrage pro Login ist vertretbar, eine pro Request nicht. Wo die Aufloesung
      genau haengt, zuerst lesen — und darauf achten, dass ein Nutzer OHNE Overrides keine
      zusaetzliche Last erzeugt.
      Bestandsverhalten darf sich fuer Nutzer ohne Overrides um kein Bit aendern. Das ist der
      wichtigste Test dieser Unit.
    done_when:
      - deny entfernt, allow setzt/hebt Scope — Test gegen die MSW-Referenz
      - hasOverrides + deniedByOverride in beiden Endpoints, ?base=1 liefert die reine Union
      - Provenance-Sentinel gesetzt
      - Nutzer ohne Overrides: unveraenderte Antwort (Regressionstest)
      - go test -count=1 ./internal/gateway/ ./internal/auth/... gruen

