# HARTE REGELN FÜR DIESEN LAUF
#
#   1. Root Cause, nicht Symptom. Vor jedem Fix alle Caller der angefassten Funktion greppen.
#      Sitzt derselbe Bug in einer Schwesterfunktion, gehört er in dieselbe Unit.
#   2. Mutations-Probe ist Pflicht: eine Zeile der Fix-Logik brechen, prüfen dass ein Test rot
#      wird, zurückdrehen, Diff sauber. Ohne Probe ist der Test nicht bewiesen. Zum
#      Zurückdrehen eine `cp`-Sicherungskopie verwenden, NICHT `git checkout --` — das löscht
#      uncommittete Arbeit mit (Lehre aus Lauf 11 Iteration 3).
#   3. `go test` ohne `DATABASE_URL` ist KEIN Gate. Die Rolle muss `kmuhub_app` sein —
#      `kmuhub` hat BYPASSRLS und würde jede RLS-Lücke durchwinken.
#   4. NEUE DB-TESTS UNGETAGT. Kein `//go:build integration` — getaggte Tests laufen weder im
#      lokalen Gate noch im Coverage-Job und bewegen `coverage_start` nicht.
#   5. Ein DB-Test, der lokal grün ist, weil der Pool nur EINE warme Verbindung hatte, beweist
#      nichts. Wer eine Ressource PRO VERBINDUNG prüft (Advisory Locks, Session-GUCs, temporäre
#      Tabellen), hält vorher eine zweite Verbindung fest.
#   6. Wer ein bestehendes Muster als Vorlage kopiert, kopiert seine Fehler mit. Die Vorlage
#      vorher prüfen, nicht nur nachbauen.
#   7. `-race` läuft auf dieser Maschine nicht (kein `gcc` im PATH). Wo eine Unit `-race`
#      verlangt, gehört das in die `offen:`-Zeile; CI ist der Beweis.
#   8. `go test` über mehrere DB-Pakete mit vollem Parallelismus reißt mit
#      "53300 remaining connection slots are reserved" ab. `-p 1` verwenden. Kein Code-Fehler.
#   9. Scan-Units: ein Fund ohne angelegte Unit ist kein Fund. `neue-units:` im Journal muss
#      die IDs nennen, die wirklich in dieser Datei stehen.
#  10. Jede neue Tabelle braucht `tenant_id UUID NOT NULL` + RLS-Policy — oder einen Eintrag in
#      der System-Global-Liste (ADR-006). Kein stiller dritter Weg. Jeder neue
#      `RequirePermission`-Guard braucht seine Seed-Migration, sonst 403 für alle.
#  11. Eine Prämisse aus dem Backlog, die sich am Code als falsch erweist, wird NICHT trotzdem
#      gebaut. Sie wird im Journal widerlegt, auf `blocked` mit `blocked_reason` gesetzt UND
#      IM SELBEN COMMIT nach BACKLOG-NEXT.yml VERSCHOBEN. Das Verschieben ist kein Beiwerk:
#      `backlog-check.py --preflight` bricht bei jeder `blocked`-Unit in DIESER Datei ab und
#      verhindert damit den START DES NÄCHSTEN LAUFS, nicht nur eine Iteration. Genau das
#      ist mit `fix-409-double-meaning-on-grpc-conflict-routes` passiert: ab Iteration 12
#      stand der Vorflug rot, 31 Iterationen lang, und niemand hat sie weggezogen.
#      Kommentarlos überspringen ist ein Fehlschlag der Iteration.
#  12. Keine neue `config.RequireX`-Assertion, kein Scharfschalten neuer `modules.*`-Flags.
#
# GESPERRT IN DIESEM LAUF (nicht anfassen, auch nicht "nur schnell"):
#   - Frontend/Desktop jeder Art. Der Loop hat kein Playwright-Gate.
#   - CSAT und die übrigen Public-Token-Routen — stillgelegt, siehe BACKLOG-PARKED.yml
#     (Projekt "Public Web Surface").
#   - `internal/biz/bexio` — G3, produktiv aus, Schweizer Software außerhalb der DE-Fokussierung.
#   - Electron-Upgrade / Dependency-Bumps.
#   - Migrations-Umnummerierungen. Neue Migrationen sind forward-only, Nummer zur Laufzeit.
#   - Preise, Modul-Zuschnitt, `lib/pricing.ts` — offene Produktentscheidungen.
#   - UMBENENNUNGEN (Go-Modulpfad `github.com/kmuhub/kmuhub`, DB-Rollen, Container-, Volume-
#     und Verzeichnisnamen). Die Konsolidierung auf Cosmi/Zentria ist gewollt, aber sie ist
#     EIN zusammenhängender Schnitt und keine Iteration — ein halb umbenannter Modulpfad
#     kompiliert nicht. In diesem Lauf wird sie nur INVENTARISIERT (Scan D10), nicht ausgeführt.
#   - `RETENTION_MODE` bleibt `dry_run`. Kein Scharfstellen im Loop, auch nicht für die neuen
#     Retention-Handler.
#   - `deploy/` — GESPERRT BIS AUF ZWEI NAMENTLICH FREIGEGEBENE AUSNAHMEN (Entscheidung Luke,
#     2026-08-24), beide als eigene Unit in Block C:
#       (a) eine Prometheus-Regel für "kein erfolgreicher Backup-Lauf seit 26 h" in
#           `deploy/docker/prometheus/rules/alerts.yml`
#       (b) die Angleichung der SMTP-Anbieter-Empfehlung in
#           `deploy/docker/PRODUCTION_TEMPLATE` an `deploy/ansible/.../env.production.j2`
#     Beide OHNE Compose-Änderung, OHNE neues Env, OHNE `config.RequireX`. Jede weitere
#     Berührung von `deploy/` bleibt verboten — auch `docker-compose.yml`, auch "nur ein Wert".
# ==========================================================================================

units:

    # ==========================================================================================
    # KOPF LAUF 14 — DIE VERIFIZIERTEN LECKS ZUERST. Diese dreizehn Units sind am 2026-08-27
    # nach vorn gezogen worden; alles darunter behält die Reihenfolge nach Präfix.
    #
    # Der Grund steht oben im roten Faden: der Treiber zieht die erste baubare Unit in
    # DATEIREIHENFOLGE, und Lauf 13 hat vorgeführt, was das für Funde am Dateiende bedeutet.
    # Zwei über REST erreichbare Cross-Tenant-Lecks standen auf Position 44 und 45 von 58.
    #
    # Die Reihenfolge INNERHALB des Kopfs ist ebenfalls Absicht:
    #   1. `fix-caldav-test-revoke-runs-without-tenant-context` — eine billige sonnet-Unit zum
    #      Warmlaufen. Sie belegt, dass DB-Gate und Mutations-Probe laufen, bevor eine
    #      opus-Unit Zeit kostet (Muster aus Lauf 13, dort hat es funktioniert). Sie ist
    #      trotzdem ein echter Befund: der Widerruf des Test-App-Passworts läuft mit
    #      `context.Background()` gegen eine RLS-Tabelle, trifft null Zeilen, und das Passwort
    #      bleibt gültig — die Tabelle hat keine Ablaufspalte.
    #   2.+3. die zwei Redis-Lecks aus `scan-tenant-filter-on-read-paths`, beide opus, beide
    #      ohne Netz darunter: Redis kennt keine RLS. `GetPresence`/`GetBulkPresence` und
    #      `GET /api/v1/dialer/agents` reichen fremde UUIDs ungeprüft durch, die
    #      Kampagnen-Variante gleich als Liste.
    #   4.–8. die Websocket-, Kalender-, Rapporte- und Chat-Fälle derselben Klasse.
    #   9.–10. LiveKit-Raumnamen-Kollision und der CalDAV-Schreibpfad — beide hängen an den
    #      Fixes aus Lauf 13 und referenzieren sie als Vorlage.
    #   11.+12. die zwei Auth-Oberflächen (Enumerations-Orakel beim Login, Passwort-Reset ohne
    #      Invalidierung der Vorgänger-Tokens).
    #   13. `fix-gobd-archive-hash-never-verified` zuletzt im Kopf: kein Leck, aber eine
    #      gebrochene Beweiskette mit GoBD-Gewicht, und mit opus die teuerste der dreizehn.
    #
    # Zwei Dinge, die dieser Kopf NICHT enthält und die trotzdem hierher gehören würden:
    # `fix-video-get-meeting-notes-returns-empty-stub` ist ein Stub, kein Leck, und
    # `fix-inventur-delete-completed-session-unprotected` ist eine Integritätslücke ohne
    # Tenant-Bezug. Beide stehen direkt hinter dem Kopf im `fix-`-Block.
    # ==========================================================================================

  - id: fix-caldav-test-revoke-runs-without-tenant-context
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Bugfix)"
    scope: >
      Postgres-Befund aus `scan-tenant-filter-on-read-paths` (Iteration 7), gegen die lokale
      DB verifiziert. Der CalDAV-Verbindungstest legt ein kurzlebiges App-Passwort an und
      widerruft es im `defer` — mit `context.Background()`.
      `route_caldav.go:453` ruft `c.pwService.Revoke(context.Background(), pw.ID, userID)`.
      Dieser Kontext traegt weder Tenant noch System-Flag. `app_specific_passwords` steht
      seit Migration 000122 unter RLS (`CALL enable_tenant_rls('app_specific_passwords')`),
      der Pool-Hook stempelt bei fehlendem Tenant leere GUCs (database/postgres.go:60-62),
      und die Policy laesst dann nichts zu.
      Empirisch belegt als `kmuhub_app` mit leerem `app.tenant_id` gegen die lokale DB
      (Migrationskopf 325, 6 Zeilen in der Tabelle) -- sichtbare Zeilen 0, vom UPDATE
      betroffene Zeilen 0.
      Folge -- `PostgresAppPasswordRepository.Revoke` (postgres_app_password.go:70-84) sieht
      `RowsAffected() == 0`, gibt `ErrPasswordNotFound` zurueck, der Handler loggt eine
      Warnung, und das Passwort bleibt aktiv. Die Tabelle hat KEINE Ablaufspalte
      (Migration 000049 -- nur `revoked_at`), das Passwort gilt also unbegrenzt weiter und
      taucht in `List` beim Nutzer auf. Jeder Klick auf "Verbindung testen" laesst ein
      weiteres dauerhaft gueltiges CalDAV/CardDAV-Credential zurueck.
      Zu tun -- den Widerruf mit einem Kontext ausfuehren, der den Tenant traegt. Der
      Handler hat ihn ein paar Zeilen darueber bereits (`middleware.GetTenantID(r.Context())`
      in Zeile 437).
    sources:
      - backend/internal/gateway/route_caldav.go
      - backend/internal/caldav/app_password.go
      - backend/internal/caldav/postgres_app_password.go
      - backend/internal/database/postgres.go
      - backend/migrations/000122_rls_phase2_long_tail.up.sql
    notes: >
      Die Begruendung im Kommentar ueber dem `defer` ist RICHTIG und muss erhalten bleiben --
      der Request-Kontext kann abgebrochen sein (Client weggeklickt), waehrend der Widerruf
      trotzdem laufen muss. Es geht also NICHT darum, `r.Context()` einzusetzen, sondern
      einen von der Absage entkoppelten Kontext zu bauen, der die Tenant-/User-Werte
      MITNIMMT. `context.WithoutCancel(r.Context())` ist der naheliegende Weg, das Muster
      gibt es schon in `route_video.go:381`. Alternativ `database.WithSystemContext`, aber
      das ist der schlechtere Weg -- er hebelt RLS ganz aus, wo ein Tenant vorliegt.
      Ein Timeout gehoert dazu, sonst haengt der `defer` an einem toten Pool.
      NICHT nebenbei mitmachen -- eine Ablaufspalte fuer `app_specific_passwords`. Das waere
      die eigentliche Haertung, ist aber eine Migration plus Schreibpfad plus
      Validierungspfad und gehoert in eine eigene Unit; wenn sie jemand will, ans
      Backlog-Ende, nicht hier hinein.
    done_when:
      - >-
        Der Widerruf im Verbindungstest laeuft mit einem Kontext, der den Tenant traegt und
        von der Absage des Requests entkoppelt ist
      - >-
        Ein Test belegt, dass nach einem Verbindungstest KEIN aktives App-Passwort
        zurueckbleibt (`revoked_at IS NOT NULL` bzw. `FindActiveByUser` liefert das
        Testpasswort nicht mehr)
      - >-
        Im Journal steht, wie viele Alt-Zeilen aus fehlgeschlagenen Widerrufen in der
        lokalen DB stehen — Produktion muss Luke selbst nachsehen
      - go test -count=1 ./internal/gateway/ ./internal/caldav/ gruen

  - id: fix-getpresence-rpc-missing-tenant-check
    phase: 4
    service: work
    model: opus
    deps: []
    status: todo
    coverage_start: "n.a. (Sicherheits-Fix)"
    scope: >
      Befund aus `scan-tenant-filter-on-read-paths` (Iteration 7), am Code verifiziert.
      Praesenz liegt in Redis unter `presence:<userID>` — OHNE Tenant-Anteil, und Redis hat
      kein RLS darunter. Der WebSocket-Weg ist seit
      `fix-websocket-presence-subscribe-missing-tenant-check` abgesichert
      (`WebSocketHub.tenantAllowsPresenceTarget`, websocket.go:1185-1207); der HTTP/gRPC-Weg
      ist es NICHT: `VideoGRPCServer.GetPresence` (video_grpc.go:1361-1368) und
      `GetBulkPresence` (1370-1383) reichen `req.UserId` bzw. `req.UserIds` unveraendert an
      `presenceService` durch, und der Service liest damit direkt den Redis-Schluessel. Weder
      Handler noch Service rufen auf diesem Pfad `middleware.GetTenantID` auf.
      Konkret erreichbar ueber `GET /api/v1/presence/{userId}` und
      `POST /api/v1/presence/bulk` (route_video.go:145-146, HandleGetPresence 1302,
      HandleGetBulkPresence 1322 — beide reichen den Parameter/Body roh weiter). Wer eine
      User-UUID aus einem fremden Tenant kennt, bekommt deren Praesenzstatus, Manual-Status
      und Last-Activity. Die Bulk-Variante nimmt eine Liste und ist damit auch das
      Aufzaehlungs-Werkzeug.
      Zu tun -- dieselbe Grenze wie im WS-Pfad ziehen: die Praesenz eines fremden Users nur
      herausgeben, wenn der Ziel-User im Tenant des Aufrufers aufloesbar ist. Der eigene
      User immer erlaubt.
    sources:
      - backend/internal/server/video_grpc.go
      - backend/internal/server/websocket.go
      - backend/internal/work/presence/service.go
      - backend/internal/work/presence/redis_store.go
      - backend/internal/gateway/route_video.go
    notes: >
      Der WS-Pfad loest den Ziel-User ueber `userInfoFunc -> authClient.GetUser` in einem auf
      den Aufrufer-Tenant gescopten Kontext auf und wertet "not found" als "nicht erlaubt"
      (fail-closed). Auf der gRPC-Seite gibt es diese Funktion nicht — hier ist die Frage,
      ob der Video-Service ueberhaupt einen Auth-Client hat oder ob die Aufloesung besser
      ueber die bereits tenant-gescopte `users`-Tabelle im selben Service laeuft. Das gehoert
      geprueft, BEVOR eine Abhaengigkeit neu verdrahtet wird.
      NICHT den Redis-Schluessel umbauen -- `presence:<userID>` um einen Tenant zu erweitern
      wuerde alle laufenden Eintraege entwerten und den Schreibpfad
      (`SetPresence`/Heartbeat/WS-Disconnect) mitziehen. Die Isolation gehoert an die
      Autorisierungsgrenze, genau wie im WS-Pfad — das steht so im Kommentar ueber
      `tenantAllowsPresenceTarget` und ist die bereits getroffene Entscheidung.
      `SetPresenceStatus` ist NICHT betroffen -- der Gateway-Handler setzt dort
      `middleware.GetUserID` und ignoriert einen Body-Wert (route_video.go:1352/1374).
    done_when:
      - >-
        `GetPresence` und `GetBulkPresence` geben Praesenz eines fremden Users nur noch
        heraus, wenn dieser im Tenant des Aufrufers sichtbar ist; der eigene User bleibt
        immer erlaubt
      - >-
        Fehlender Tenant-Kontext fuehrt zur Ablehnung, nicht zur Freigabe (fail-closed) —
        ein Test belegt das
      - >-
        Ein Test belegt, dass `GetBulkPresence` fremde IDs aus der Liste ENTFERNT, statt die
        ganze Anfrage abzulehnen oder sie durchzureichen
      - go test -count=1 ./internal/server/ ./internal/work/presence/ ./internal/gateway/ gruen

  - id: fix-dialer-agent-status-missing-tenant-check
    phase: 4
    service: dialer
    model: opus
    deps: []
    status: todo
    coverage_start: "n.a. (Sicherheits-Fix)"
    scope: >
      Zweiter Redis-Befund aus `scan-tenant-filter-on-read-paths` (Iteration 7), am Code
      verifiziert. `RedisAgentStore` legt den Live-Status eines Dialer-Agenten unter
      `dialer:agent:status:<userID>` und die Kampagnen-Mitgliedschaft unter
      `dialer:campaign:agents:<campaignID>` ab (redis_agent_store.go:14-15, 50-55) — beides
      OHNE Tenant-Anteil, und Redis hat kein RLS darunter.
      Der gespeicherte Eintrag TRAEGT den Tenant (`AgentStatusEntry.TenantID`,
      redis_agent_store.go:37, gesetzt in Zeile 104) — gelesen wird er nirgends.
      `Service.GetAgentStatus` (dialer/service.go:890-896) und `Service.GetCampaignAgents`
      (899-906) reichen das Ergebnis ungefiltert durch, und
      `DialerGRPCServer.GetAgentStatus`/`GetCampaignAgents` (dialer_grpc.go:494-519) parsen
      nur die UUID.
      Erreichbar ueber `GET /api/v1/dialer/agents?user_id=<fremde-uuid>` und
      `GET /api/v1/dialer/agents/campaign/{campaignId}` (route_dialer.go:91/93, Handler 706
      und 767). Beide haengen an `RequirePermission("dialer:agent","manage")` — das begrenzt
      auf Dialer-Supervisoren, aber nicht ueber Tenant-Grenzen hinweg. Die Kampagnen-Variante
      liefert eine LISTE fremder Agenten samt Status und Tenant-ID.
      Zu tun -- den mitgespeicherten Tenant gegen den Tenant des Aufrufers pruefen und
      Nicht-Treffer wie "nicht vorhanden" behandeln.
    sources:
      - backend/internal/dialer/redis_agent_store.go
      - backend/internal/dialer/service.go
      - backend/internal/server/dialer_grpc.go
      - backend/internal/gateway/route_dialer.go
    notes: >
      Der Tenant steht bereits IM Eintrag — die Pruefung braucht keinen zusaetzlichen
      DB-Weg und keinen neuen Redis-Schluessel. Das ist der billigere und der robustere Weg
      als ein Schluessel-Umbau, der alle laufenden Eintraege entwerten wuerde.
      `GetCampaignAgents` liest eine Redis-SET-Mitgliedschaft und danach die Eintraege
      einzeln (Zeile 152 + 198) -- der Filter gehoert auf die EINZELEINTRAEGE, sonst haengt
      das Ergebnis an der Kampagnen-ID, deren Tenant-Zugehoerigkeit in Redis gar nicht
      steht. Alternativ die Kampagne vorher tenant-gescopt aus Postgres laden — dann aber
      BEIDES, weil ein Eintrag im SET aus einer frueheren Zuordnung stammen kann.
      Fail-closed -- ein Eintrag ohne parsebaren `tenant_id`-Wert (Altbestand aus der Zeit
      vor dem Feld) ist NICHT sichtbar, sondern wird wie ein Nicht-Treffer behandelt. Das
      gehoert in die `offen:`-Zeile, weil es laufende TTL-Eintraege beim Deploy unsichtbar
      macht, bis der Agent das naechste Mal seinen Status setzt (TTL siehe
      `agentStatusTTL`).
    done_when:
      - >-
        `GetAgentStatus` liefert fuer eine User-UUID aus einem fremden Tenant denselben
        Fehler wie fuer eine unbekannte UUID (kein Unterschied, an dem sich Existenz
        ablesen laesst)
      - >-
        `GetCampaignAgents` filtert fremde Eintraege aus der Liste, statt sie
        auszuliefern; ein Test mit zwei Tenants in einem SET belegt das
      - Ein Eintrag ohne verwertbaren Tenant ist nicht sichtbar (fail-closed, per Test)
      - go test -count=1 ./internal/dialer/ ./internal/server/ ./internal/gateway/ gruen

  - id: fix-websocket-chat-send-message-missing-tenant-id
    phase: 4
    service: server
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Bugfix, kein Coverage-Ziel)"
    scope: >
      Fund aus `fix-websocket-presence-subscribe-missing-tenant-check` (Iteration 2, Lauf 13):
      JEDE Chat-Nachricht, die ueber die WebSocket-Verbindung gesendet wird — sowohl fuer
      authentifizierte User als auch fuer Gaeste, sowohl ueber WS als auch ueber die
      REST-Gast-Route — schlaegt aktuell garantiert fehl.
      `chatv1.SendMessageRequest.tenant_id` (Feld 8, `backend/proto/chat/v1/chat.proto:242`)
      ist ein normaler (nicht `optional`) String. `ChatGRPCServer.SendMessage`
      (`backend/internal/server/chat_grpc.go:369`) parst ihn UNBEDINGT als erstes:
      `chatTenantID, err := uuid.Parse(req.TenantId)` — bei leerem String schlaegt
      `uuid.Parse` fehl und die RPC gibt sofort `codes.InvalidArgument, "invalid tenant_id"`
      zurueck, bevor ueberhaupt zwischen authentifiziertem und Gast-Pfad unterschieden wird.
      Drei Aufrufstellen bauen den Request OHNE `TenantId`:
      `WebSocketHub.handleSendMessage` (`backend/internal/server/websocket.go:601-609`,
      authentifizierte User ueber WS), `WebSocketHub.handleGuestSendMessage`
      (`backend/internal/server/websocket.go:823-829`, Gaeste ueber WS) und die
      REST-Gast-Route `internal/gateway/route_guest.go:237-241`. Nur EINE Aufrufstelle setzt
      es korrekt: die authentifizierte REST-Route `internal/gateway/route_chat.go:471-477`
      liest `tenantID, err := middleware.GetTenantID(r.Context())` (funktioniert, weil diese
      Route hinter `authMiddleware` haengt) und setzt `TenantId: tenantID.String()`.
      Damit ist Echtzeit-Chat ueber WebSocket UND jeder Gast-Chat (WS wie REST) aktuell
      funktionsunfaehig — nicht nur ein Tenant-Scoping-Detail, sondern ein kompletter Ausfall
      dieser Pfade. Root Cause fuer die beiden WS-Faelle ist dieselbe Luecke, die auch die
      Presence-Subscribe-Unit betraf: `HandleWebSocket` (`backend/internal/server/websocket.go`,
      um Zeile 297-364) validiert den JWT selbst und haelt `claims.TenantID`, propagiert es aber
      nie in den `ctx`, den `handleConnection`/`handleMessage` weiterreichen — die Route laeuft
      nicht durch `middleware.Auth`, weil sie den Token selbst aus
      Sec-WebSocket-Protocol/Query-Param liest statt aus dem Authorization-Header.
      Fuer den Gast-Fall (WS UND REST) gibt es KEINEN Tenant im JWT-Sinn — `GuestSessionInfo`
      (`backend/internal/server/websocket.go:55-60`) haelt aktuell nur `ID`, `ChannelID`,
      `DisplayName`, `IsActive`, kein `TenantID`-Feld; das muesste aus der Guest-Session
      selbst oder ueber den Channel aufgeloest werden (ein Channel gehoert zu genau einem
      Tenant).
    sources:
      - backend/internal/server/websocket.go
      - backend/internal/server/chat_grpc.go
      - backend/internal/gateway/route_chat.go
      - backend/internal/gateway/route_guest.go
      - backend/proto/chat/v1/chat.proto
      - backend/internal/server/websocket_presence_subscribe_test.go
    notes: >
      Fuer den authentifizierten WS-Fall bietet sich derselbe `userTenants`-Cache an, der in
      `fix-websocket-presence-subscribe-missing-tenant-check` fuer die Presence-Autorisierung
      eingefuehrt wurde (`WebSocketHub.registerUserTenant`/`h.userTenants[userID]`) —
      `handleSendMessage` kann den bereits gecachten Tenant direkt in `grpcReq.TenantId`
      schreiben, ohne einen weiteren gRPC-Roundtrip. Fuer den Gast-Fall muss zuerst geklaert
      werden, WOHER der Tenant kommt (Channel-Lookup vs. Erweiterung von `GuestSessionInfo`
      beim Erstellen der Session) — das ist eine kleine Architektur-Entscheidung, kein reiner
      Verkabelungsfehler, und gehoert in den `scope:`-Teil der Bauarbeit, nicht vorher geraten.
      Vor dem Fix pruefen, ob es einen Grund gibt, warum das bisher niemandem aufgefallen ist
      (z. B. Feature-Flag, das den WS-Chat-Sendepfad aktuell abschaltet, oder ein Frontend, das
      ausschliesslich die REST-Route benutzt und WS nur zum Lesen/Broadcasten verwendet) — falls
      ja, gehoert das in die `blocked_reason`, falls die Killer-Antwort ist "wird produktiv gar
      nicht genutzt".
    done_when:
      - >-
        `handleSendMessage`, `handleGuestSendMessage` und `route_guest.go`s Send-Handler setzen
        `TenantId` korrekt, bevor sie `chatClient.SendMessage` rufen
      - >-
        Ein Test belegt: eine ueber WS gesendete Chat-Nachricht (authentifiziert) kommt beim
        Empfaenger an, statt mit `codes.InvalidArgument` abzubrechen — ebenso fuer den
        Gast-Sendepfad (WS und REST)
      - go test -count=1 ./internal/server/... ./internal/gateway/... gruen, DATABASE_URL
        gesetzt, 0 Skips

  - id: fix-websocket-chat-rpcs-missing-tenant-context
    phase: 4
    service: gateway
    model: opus
    deps: []
    status: todo
    scope: >
      Verifizierter Produktionsbug, in Iteration 19 durch einen Test reproduziert
      (`TestHandleSubscribeChannel_SendsContextWithoutTenantToChatService`). `/api/v1/ws` ist
      in `cmd/gateway/main.go:453` OHNE `authMiddleware` registriert -- der Handler validiert
      das JWT selbst, schreibt die Tenant-ID aber nie in den Context. Aus der WS-Message-Loop
      geht deshalb ein nackter `r.Context()` an den Chat-Client, `TenantOutboundUnaryInterceptor`
      haengt mangels `TenantIDKey` kein `x-tenant-id` an, und serverseitig lehnt
      `ChatGRPCServer.GetChannel` (`internal/server/chat_grpc.go:103-106`) mit
      `codes.Unauthenticated` ab. Betrifft `handleSubscribeChannel` (GetChannel) und
      `handleMarkRead` (MarkChannelRead). `handleSendMessage` scheitert aus einem zweiten
      Grund: `SendMessage` liest die Tenant-ID nicht aus dem Context, sondern aus
      `req.TenantId` (`chat_grpc.go:369`), und der WS-Handler setzt das Feld nie ->
      `codes.InvalidArgument`. Wirkung: Chat ueber WebSocket ist praktisch funktionslos --
      kein Subscribe, also auch keine Live-Zustellung. Kein RLS-Bypass, es faellt
      fail-closed aus. Das Muster fuer den Fix existiert bereits im selben File:
      `tenantAllowsPresenceTarget` (`websocket.go:1203`) baut sich seinen `scopedCtx` per
      `context.WithValue(ctx, middleware.TenantIDKey, callerTenantID)` -- jemand hat das fuer
      Presence nachgezogen und Chat vergessen.
    sources:
      - backend/internal/server/websocket.go
      - backend/internal/server/chat_grpc.go
      - backend/internal/middleware/grpc_tenant.go
      - backend/cmd/gateway/main.go
      - backend/internal/server/websocket_connection_test.go
    notes: >
      `opus`, weil zwei Wege offenstehen und die Wahl Folgen hat: (a) den Context EINMAL beim
      Verbindungsaufbau anreichern (`ctx = context.WithValue(ctx, middleware.TenantIDKey,
      claims.TenantID)` vor `h.handleConnection`, dazu `UserIDKey`) -- das repariert alle
      RPCs der Schleife auf einen Schlag; oder (b) je Handler scopen wie bei Presence.
      (a) ist der schlanke Fix und passt zu `registerUserTenant`, das die Tenant-ID ohnehin
      schon aus den Claims zieht. Bei `SendMessage` muss zusaetzlich `TenantId` im Request
      gesetzt werden -- ODER `chat_grpc.go` liest die Tenant-ID dort kuenftig aus dem Context
      wie alle anderen RPCs; das waere die konsistente Variante, aendert aber das Verhalten
      fuer alle anderen Aufrufer von `SendMessage` und muss geprueft werden.
      KEINE neue Route, KEIN neues Flag, KEINE Migration. `TenantInboundUnaryInterceptor`
      traegt uebrigens einen falschen Docstring (behauptet `codes.Unauthenticated` bei
      fehlendem Tenant, tut es nicht) -- den im selben Commit korrigieren.
    done_when:
      - >-
        Die gRPC-Aufrufe aus der WebSocket-Message-Loop tragen die Tenant-ID des
        authentifizierten Nutzers im Context
      - >-
