  - id: fix-datev-oauth-callback-503-breaks-redirect-contract
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/gateway 54,1 % (CI-Stand 32570176303)"
    scope: >
      `DatevUploadRoutes.HandleOAuthCallback` (`route_datev_upload.go:135-188`) ist laut
      `openapi.yaml:29437` eine Route mit einer einzigen dokumentierten Garantie: "Always
      responds with a 302 redirect... there is no JSON error body on failure" — jeder
      Fehlerfall haengt seinen Grund als `?datev_error=<code>` an den Redirect an
      (`missing_authorization_code|state_not_configured|invalid_state|connection_failed|
      {service error message}`), ueber den gemeinsamen Helper `redirectDatevError`
      (Zeile 21-23). Genau EINE Fehlerstelle im Handler haelt sich nicht daran: Zeile 168
      ruft bei nicht erreichbarem biz-gRPC-Client `respondServiceUnavailable(w,
      dr.ServiceName())` auf — das schreibt einen rohen 503-JSON-Body statt eines Redirects.
      Diese Route ist public (DATEV leitet den Browser direkt hierher, keine Auth-Middleware,
      kein Frontend-Fetch-Handler dazwischen); der Nutzer sieht im Browser einen nackten
      JSON-Fehler statt zurueck auf `/settings/integrations?datev_error=...` geleitet zu
      werden, genau in dem Moment, in dem der Service-Client aus welchem Grund auch immer
      nicht verfuegbar ist.
    sources:
      - backend/internal/gateway/route_datev_upload.go
      - backend/internal/gateway/route_datev_upload_test.go
      - backend/api/openapi.yaml
    notes: >
      ROOT CAUSE, nicht Symptom: an ALLEN anderen fuenf Fehlerstellen dieses Handlers
      (Zeilen 140, 151, 162, 183) wird bereits konsequent `redirectDatevError` verwendet —
      Zeile 168 ist die einzige Ausnahme im selben Handler, kein systemisches Muster in
      anderen Dateien (`respondServiceUnavailable` ist in den zehn uebrigen geprueften
      Dateien korrekt, weil deren Routen normale JSON-APIs sind, keine Browser-Redirects).
      Der Fix ist eine Zeile: `redirectDatevError(w, r, "service_unavailable")` oder
      `"connection_failed"` (der bereits dokumentierte Catch-all-Code fuer denselben
      Fehlermodus an anderer Stelle im selben Handler, Zeile 183) — welcher Code-String
      gewaehlt wird, im Journal kurz begruenden. Kein Spec-Edit noetig, `openapi.yaml`
      beschreibt bereits korrekt "no JSON error body on failure".
      Test: `getDatevUploadClient` faelschen/faelen lassen und pruefen, dass die Response
      ein 302 mit `datev_error`-Query-Parameter ist, kein 503-JSON — Vorlage sind die
      bestehenden Tests fuer die anderen Fehlerzweige in `route_datev_upload_test.go`.
    done_when:
      - Zeile 168 antwortet mit einem 302-Redirect inklusive datev_error-Query-Parameter,
        nicht mehr mit 503-JSON
      - Ein Test belegt den Redirect fuer den Fall "biz-Service nicht erreichbar", analog zu
        den bestehenden Tests der anderen Fehlerzweige
      - go test -count=1 ./internal/gateway/ gruen (inkl. TestOpenAPIRouteDrift)

  - id: fix-invoice-recurring-grpc-status-mapping-doc-mismatch
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: done
    coverage_start: "n.a. (reine OpenAPI-Spec-Korrektur, keine Coverage-relevante Codeänderung)"
    scope: >
      Zwei Routen dokumentieren in `openapi.yaml` einen HTTP-Statuscode, den der Handler
      strukturell nie erzeugen kann: PUT `/finance/invoices/{id}` dokumentiert `410`
      "Invoice is immutable" (`openapi.yaml:9085`), POST
      `/finance/recurring/{id}/generate` dokumentiert `412`
      "Schedule is paused, ended or past its end date" (`openapi.yaml:9450`). Beide Handler
      geben gRPC-Fehler ausschliesslich ueber `respondGRPCError` an `grpcStatusToHTTP`
      weiter (`helpers.go:47-80`), und dort mappt `FailedPrecondition` fest auf `409` — kein
      Codepfad in diesem Repo kann 410 oder 412 erzeugen. Ein Client, der sich beim
      Fehlerhandling auf die Spec verlaesst (generierter SDK-Code, Frontend-Switch auf
      response.status), behandelt den tatsaechlich eintreffenden 409 nie, weil er nur 410
      bzw. 412 erwartet.
    sources:
      - backend/internal/gateway/route_biz_invoices.go
      - backend/internal/gateway/route_biz_recurring.go
      - backend/internal/gateway/helpers.go
      - backend/api/openapi.yaml
    notes: >
      ENTSCHEIDUNG NOETIG, nicht mechanisch: entweder die Spec auf den tatsaechlichen Code
      409 korrigieren, oder `grpcStatusToHTTP` bzw. eine lokale Sonderbehandlung so erweitern,
      dass diese beiden FailedPrecondition-Faelle wirklich 410/412 zurueckgeben.
      Der lean Weg ist vermutlich die Spec-Korrektur: `grpcStatusToHTTP` ist ein zentraler,
      von sehr vielen Routen geteilter Mapper (siehe alle elf in diesem Scan gepruefte
      Dateien) — ihn um zwei routenspezifische Sonderfaelle zu erweitern erhoeht die
      Kopplung zwischen einer generischen Fehlerbehandlung und zwei einzelnen Endpunkten.
      Wird die Spec korrigiert, muss geprueft werden, ob das Frontend (gesperrt fuer diesen
      Lauf, nur LESEN erlaubt) bereits auf 410/412 pruefte — falls ja, gehoert das als
      blocked_reason an Luke, nicht in diese Unit.
      Die Entscheidung inklusive Begruendung gehoert ins Journal, nicht stillschweigend
      gewaehlt.
    done_when:
      - Entweder die Spec dokumentiert fuer beide Routen den tatsaechlichen 409-Code, oder
        der Handler erzeugt nachweislich den dokumentierten 410/412-Code — Entscheidung im
        Journal begruendet
      - swagger-cli validate gegen backend/api/openapi.yaml laeuft fehlerfrei
      - go test -count=1 ./internal/gateway/ gruen (inkl. TestOpenAPIRouteDrift)

