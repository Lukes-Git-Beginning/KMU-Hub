  - id: scan-inet-cidr-scanned-into-go-string
    phase: 4
    service: security
    model: sonnet
    deps: []
    status: done
    coverage_start: "n.a. (Scan-Unit, kein Coverage-Ziel)"
    scope: >
      MUSTER D — Typ-Scan-Mismatch. Vorlage: `fix-audit-list-verifychain-ip-address-scan`.
      Eine Postgres-Spalte vom Typ INET/CIDR wird per `rows.Scan(&someString)` in einen
      Go-`string` gelesen. pgx kann das nicht und liefert bei JEDER Zeile einen Scanfehler --
      die Query ist damit fuer jeden Tenant mit Daten tot, faellt aber in Tests mit leerer
      Tabelle nicht auf.

      Die Flaeche ist klein und vollstaendig aufzaehlbar: 6 Spalten in 4 Migrationen.
        - 000039_create_security_tables.up.sql: `ip_address INET` (2x), `ip_cidr CIDR NOT NULL`
        - 000054_add_guest_chat_support.up.sql: `ip_address INET`
        - 000060_create_consent_management.up.sql: `ip_address INET`
        - 000081_create_formulare.up.sql: `ip_address INET NULL`

      Fuer JEDE dieser Spalten: alle SELECTs finden, die sie lesen, und pruefen, in welchen
      Go-Typ gescannt wird. Korrekt sind `netip.Addr`/`netip.Prefix`, ein pgtype-Typ, oder ein
      Cast in der Query (`host(ip_address)`, `ip_address::text`) -- drei korrekte Vorlagen
      liegen bereits im Repo. Falsch ist ein roher `string` oder `*string` ohne Cast.
    sources:
      - backend/migrations/000039_create_security_tables.up.sql
      - backend/migrations/000054_add_guest_chat_support.up.sql
      - backend/migrations/000060_create_consent_management.up.sql
      - backend/migrations/000081_create_formulare.up.sql
      - backend/internal/security/audit/postgres_repository.go
    notes: >
      Vorgehen: erst die Tabellennamen aus den Migrationen ziehen, dann repo-weit nach
      SELECTs auf diese Tabellen greppen, dann pro Fundstelle den Scan-Zieltyp pruefen.
      Nicht nur nach `ip_address` als Bezeichner suchen -- `SELECT *` und
      `RETURNING`-Klauseln treffen die Spalte ebenfalls.

      Jeder Fund braucht einen DB-gestuetzten Pin-Test, der mit MINDESTENS EINER Zeile in der
      Tabelle laeuft (mit leerer Tabelle ist der Bug unsichtbar -- genau deshalb ist er so
      lange durchgerutscht).
    done_when:
      - Alle 6 Spalten abgearbeitet, pro Spalte im Journal notiert welche Queries sie lesen
      - Jeder Fund ist eine neue Fix-Unit am Ende dieser Datei, mit reproduziertem Bug und
        Pin-Test-Vorschlag; die IDs stehen in der `neue-units:`-Zeile des Journals
      - Sind keine weiteren Fundstellen da, ist das im Journal mit der Liste der geprueften
        Queries belegt -- "nichts gefunden" ohne Liste zaehlt nicht
      - Kein Verhalten geaendert ausser dem Anlegen von Units

