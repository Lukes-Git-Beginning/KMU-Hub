      statt Panik). `go test -count=1 -v ./internal/server/... ./cmd/email/...` gruen, 0 Skips, 0
      Fails (mit `DATABASE_URL` auf `kmuhub_app`).
      gate: build ok (`go build -p 2 ./...`) | vet ok (`go vet -p 2 ./...`) | lint ok
      (golangci-lint auf `internal/server`, `cmd/email`, 0 issues) | test ok wie oben. Keine
      Migration, keine neue Route (kein openapi.yaml-Eintrag noetig, RPC-Signaturen unveraendert),
      kein neuer `RequirePermission`-Guard.

