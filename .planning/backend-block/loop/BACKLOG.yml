      Grundausstattung ist Tenant-Zeile + Modul-Aktivierungen + Admin-EINLADUNG
      (kein serverseitig erzeugter User mit generiertem Passwort); Rollen sind
      global (keine tenant_id) und brauchen deshalb nichts pro Tenant, und
      tenant_settings bleiben leer, weil die Resolve-Reihenfolge
      user > tenant > not-set sauber auf die Code-Defaults faellt. (c) Alles in
      EINER Transaktion, deshalb liegt der Code in `internal/auth` und nicht im
      settings-Service: zwei Services waeren zwei Transaktionen, und ein
      halb provisionierter Tenant ist schlimmer als gar keiner. (d) Der ganze
      Aufruf laeuft unter `sysctx.With` — der zu erzeugende Tenant ist per
