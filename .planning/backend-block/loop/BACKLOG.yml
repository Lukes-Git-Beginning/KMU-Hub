      - "Mutations-Probe: eine Methode aus dem Service-Desc genommen, der Wire-Test wird rot"

  - id: fix-rapporte-rejected-report-cannot-be-resubmitted
    phase: 4
    service: rapporte
    model: sonnet
    deps: []
    status: todo
    coverage_start: "internal/rapporte 82,5 %"
    scope: >
      Gefunden in fix-rapporte-member-can-fill-and-submit (Lauf 16, Iteration 15), per Code-Lesung
      verifiziert: ein abgelehnter Rapport ist eine Sackgasse. `Service.SubmitReport`
      (`service.go:358`) lässt nur `draft` -> `submitted` zu; `StatusDraft` wird nirgends sonst
      gesetzt (nur `CreateReport`), `UpdateReport` ändert den Status nicht, und es gibt keine
      Route "wieder öffnen". Nach `RejectReport` kann der Autor den Rapport zwar korrigieren
      (Felder, Positionen — `requireEditable` erlaubt `rejected`), ihn aber nie erneut einreichen:
      `POST /submit` antwortet 412. Das Desktop zeigt den Ablehnungsgrund
      (`ReportDetailModal.tsx:455`), bietet aber nur dann "Einreichen" an, wenn der Backend-Status
      es zulässt — Entscheidung nötig, ob `rejected` -> `submitted` direkt geht (Empfehlung:
      ja, `SubmitReport` akzeptiert `draft` und `rejected`, Review-Notiz bleibt als Verlauf) oder
      über ein Zurücksetzen auf `draft`. Keine neue Route nötig. Atomares UPDATE ... WHERE
      status IN (...) wie bei Approve/Reject, damit zwei Submits nicht doppelt zählen.
    sources:
      - backend/internal/rapporte/service.go
      - backend/internal/rapporte/postgres_repository.go
      - desktop/src/renderer/src/modules/rapporte/ReportDetailModal.tsx
    done_when:
      - "DB-Test: draft -> submitted -> rejected -> submitted läuft durch, approved -> submit bleibt 412"
      - "Test: zweites paralleles Submit eines abgelehnten Rapports zählt nur einmal"
      - "Mutations-Probe: StatusRejected aus der Zulassung genommen, der Test wird rot"

