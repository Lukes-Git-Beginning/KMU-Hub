  - id: fix-audit-verifychain-timestamp-precision-mismatch
    phase: 3
    service: security
    model: sonnet
    deps: []
    status: todo
    coverage_start: "internal/security/audit 80,0 % (lokal gemessen nach fix-audit-list-verifychain-ip-address-scan, Lauf 9 Iteration 1)"
    scope: >
      `PostgresRepository.Create` (internal/security/audit/postgres_repository.go:31) berechnet
      `entry.EntryHash` per `computeEntryHash`, die `entry.Timestamp` mit
      `time.RFC3339Nano` formatiert -- also inklusive aller neun Nachkommastellen, falls
      vorhanden. `entry.Timestamp` wird beim Erzeugen ueblicherweise NICHT vom Aufrufer
      gesetzt und faellt daher auf `time.Now().UTC()` zurueck (Zeile 60-62) -- ein Go-`time.Time`
      mit, je nach Betriebssystem-Taktaufloesung, tatsaechlicher Sub-Mikrosekunden-Praezision.
      Die Spalte `audit_log.timestamp` ist `TIMESTAMPTZ` (Migration 000039), die nur
      Mikrosekunden speichert -- Postgres rundet/kappt die letzten drei Nachkommastellen beim
      INSERT kommentarlos weg.

      `VerifyChain` (Zeile 222) liest denselben Eintrag anschliessend per SELECT zurueck und
      ruft `computeEntryHash` ein zweites Mal auf dem GELESENEN (also bereits gekappten)
      Timestamp auf, um den gespeicherten `entry_hash` zu reproduzieren. Trug der urspruengliche
      Timestamp beim `Create()`-Aufruf auch nur eine einzige von Null verschiedene
      Sub-Mikrosekunden-Ziffer, unterscheidet sich der beim Insert berechnete Hash vom beim
      Verify neu berechneten Hash -- `VerifyChain` meldet dann eine INTAKTE Kette als
      manipuliert (`recomputed != entry.EntryHash`), obwohl kein Byte veraendert wurde.

      Reproduziert beim Bau von fix-audit-list-verifychain-ip-address-scan (Lauf 9,
      Iteration 1): `TestPostgresRepository_VerifyChain_ValidSingleEntryRange` schlug mit
      genau diesem Symptom fehl, bis der Test seinen eigenen Timestamp explizit auf
      Mikrosekunden kappte (`time.Now().UTC().Truncate(time.Microsecond)`), um die
      Produktionslogik zu umgehen. Ein Stichproben-Lauf von zehn `time.Now().UTC()`-Aufrufen
      auf der Loop-Maschine (Windows) zeigte in vier von fuenf Faellen eine von Null
      verschiedene Sub-Mikrosekunden-Restziffer -- der Bug ist also nicht der Ausnahmefall,
      sondern der Normalfall.
    sources:
      - backend/internal/security/audit/postgres_repository.go
      - backend/migrations/000039_create_security_tables.up.sql
      - backend/internal/security/audit/postgres_repository_test.go
    notes: >
      Sauberster Fix vermutlich: `entry.Timestamp` in `Create()` VOR der Hash-Berechnung
      auf Mikrosekunden kappen (`entry.Timestamp = entry.Timestamp.Truncate(time.Microsecond)`,
      direkt nach der `IsZero()`-Faellback-Zeile 60-62, vor `computeEntryHash` in Zeile 55) --
      dann stimmt der Wert, der gehasht wird, exakt mit dem Wert ueberein, den Postgres
      tatsaechlich speichert und beim naechsten Lesen zurueckgibt. Alternative waere, im
      Modell selbst auf eine explizite `pgtype.Timestamptz`-Roundtrip-Pruefung zu verzichten
      und stattdessen `entry.Timestamp` direkt nach dem INSERT per RETURNING zurueckzulesen --
      unnoetig teurer als die Truncate-Loesung.
      ACHTUNG: `computeEntryHash` wird auch beim ERSTEN Insert der Kette benutzt (chain-of-custody
      ab Tag 1) -- die Aenderung betrifft nur NEUE Eintraege ab dem Fix-Commit, alle vorher
      geschriebenen Eintraege bleiben mit ihrem ungekappten Original-Hash bestehen und sind
      NICHT rueckwirkend reparierbar (append-only, kein UPDATE moeglich). Das ist hinnehmbar:
      `VerifyChain` wuerde fuer Alt-Eintraege weiterhin spurious brechen -- gehoert in die
      Journal-`offen:`-Zeile dieser Unit als bekannte Grenze, ist aber kein Grund, den Fix fuer
      neue Eintraege zurueckzuhalten.
      Ein DB-gestuetzter Pin-Test dafuer existiert noch nicht (die beiden VerifyChain-Tests aus
      fix-audit-list-verifychain-ip-address-scan umgehen das Problem bewusst durch Truncate im
      Test). Diese Unit sollte einen echten Regressionstest ergaenzen, der einen Timestamp MIT
      Sub-Mikrosekunden-Anteil erzwingt (z. B. `time.Now().UTC().Add(123 * time.Nanosecond)`)
      und beweist, dass `VerifyChain` danach trotzdem `valid=true` liefert.
    done_when:
      - Create() kappt den Timestamp vor der Hash-Berechnung auf Mikrosekunden-Praezision,
        sodass der gehashte Wert mit dem tatsaechlich persistierten Wert uebereinstimmt
      - Ein neuer DB-gestuetzter Test beweist mit einem Timestamp, der nachweislich eine
        Sub-Mikrosekunden-Ziffer traegt, dass VerifyChain danach valid=true liefert
      - Die bestehenden Truncate-Workarounds in
        TestPostgresRepository_VerifyChain_ValidSingleEntryRange koennen entfernt werden,
        sobald Create() selbst kappt (pruefen, nicht blind loeschen -- der Kommentar dort
        verweist auf diese Unit)
      - Die Nicht-rueckwirkende-Grenze (Alt-Eintraege bleiben spurious-broken) ist im Journal
        dokumentiert
      - go test -count=1 ./internal/security/audit/ gruen

  - id: fix-notification-mutes-unique-missing-tenant
    phase: 4
    service: notification
    model: opus
    deps: []
    status: todo
    coverage_start: "internal/notification/preference 87,4 % (lokal gemessen, Iteration 4 nach Migration 000312)"
    scope: >
      `notification_mutes` traegt seit Migration 000022 den inline-Constraint
      `UNIQUE(user_id, module_id, resource_id)` (`notification_mutes_user_id_module_id_
      resource_id_key`, gegen die lokale DB auf Kopf 312 per `\d` verifiziert). Migration 000110
      hat `tenant_id` ergaenzt, 000124 hat es NOT NULL gemacht und RLS aktiviert -- der
      Unique-Constraint wurde nie verbreitert. Das ist EXAKT dieselbe Index-Drift, die
      Migration 000305 fuer `idx_notification_preferences_event_type` und Migration 000312
      (diese Iteration) fuer `notification_quiet_hours` und
      `idx_notification_preferences_module_default` behoben hat -- `notification_mutes` ist die
      letzte verbliebene Tabelle des Notification-Schemas mit dieser Luecke.

      Wirkung anders als bei den drei Vorgaengern: `CreateMute`
      (internal/notification/preference/postgres_repository.go:118) nutzt KEIN `ON CONFLICT`,
      es gibt also keinen 42P10-Planungsfehler. Stattdessen prueft
      `Service.MuteResource` (service.go:240) vorab per `IsResourceMuted` TENANT-GESCOPT, sieht
      die Zeile eines fremden Tenants also nicht, und laesst `CreateMute` laufen -- das dann am
      tenant-losen Unique-Constraint mit SQLSTATE 23505 scheitert. Der Nutzer bekommt einen
      rohen 500er statt `ErrMuteAlreadyExists` oder eines erfolgreichen Mutes. Betroffen ist
      nur der Cross-Tenant-Fall (dieselbe user_id in zwei Tenants), heute also der
      Vendor-Access-/Multi-Tenant-User-Pfad, nicht der Alltagsfall -- deshalb niedriger
      priorisiert als die drei bereits gefixten Stellen, aber dieselbe Ursache und dieselbe
      Zwei-Zeilen-Loesung.
    sources:
      - backend/migrations/000022_create_notification_preferences.up.sql
      - backend/migrations/000312_notification_quiet_hours_and_module_default_tenant_index.up.sql
      - backend/internal/notification/preference/postgres_repository.go
      - backend/internal/notification/preference/service.go
      - backend/internal/notification/preference/mutes_quiethours_test.go
    notes: >
      Gefunden beim Bau von fix-notification-quiet-hours-conflict-index (Lauf 9, Iteration 4)
      beim Abgleich ALLER Unique-Indexe des Notification-Schemas gegen die laufende DB. NICHT
      dort mitgefixt, weil er ausserhalb des `done_when` der Unit lag und eine eigene
      Migration braucht.
      Migrationskoerper (Nummer zur Laufzeit ermitteln, NICHT 313 annehmen), Vorlage ist
      000312 in dieser Datei:
      `ALTER TABLE notification_mutes DROP CONSTRAINT
       notification_mutes_user_id_module_id_resource_id_key;`
      `CREATE UNIQUE INDEX idx_notification_mutes_resource
       ON notification_mutes(tenant_id, user_id, module_id, resource_id);`
      Der neue Index ist ein Superset des alten und kann mit keiner bestehenden Zeile
      kollidieren. `postgres_repository.go` braucht voraussichtlich keine Aenderung (CreateMute
      nennt keinen Constraint) -- pruefen, nicht annehmen.
      Migration + RLS => `model: opus`, RLS-Smoke aus GATE-COMMANDS.md ist Pflicht.
    done_when:
      - Neue Migration verbreitert den Unique-Constraint auf
        (tenant_id, user_id, module_id, resource_id), down-Migration stellt den alten Zustand her
      - Ein DB-gestuetzter Test beweist, dass zwei Tenants dieselbe (user_id, module_id,
        resource_id) unabhaengig muten koennen (Muster:
        TestPostgresRepository_QuietHoursPerTenant aus Iteration 4)
      - Der bestehende Duplikat-Pfad innerhalb EINES Tenants liefert weiterhin
        ErrMuteAlreadyExists, nicht 23505
      - rls-smoke gruen, go test -count=1 ./internal/notification/... gruen

  - id: fix-work-erasure-task-double-count
    phase: 3
    service: security
    model: sonnet
    deps: []
    status: todo
    coverage_start: "internal/security/gdpr 60,5 % (selbst gemessen, Lauf 9 Iteration 6, nach fix-crm-erasure-double-count)"
    scope: >
      `WorkErasureHandler.ExecuteErasure` (backend/internal/security/gdpr/erasure.go, um Zeile
      377) hat exakt dieselbe Doppelzaehl-Bugklasse wie `fix-crm-erasure-double-count` (Lauf 9,
      Iteration 6), nur in einer Schwesterfunktion desselben Files: das erste UPDATE setzt
      `assignee_id = NULL WHERE assignee_id = $1`. Die anschliessende Zaehl-Query
      `SELECT COUNT(*) FROM tasks WHERE created_by = $1 AND (assignee_id IS NULL OR
      assignee_id != $1)` laeuft in DERSELBEN Transaktion und sieht das gerade committete
      (aber noch nicht transaktions-committete, wohl aber sichtbare) NULL bereits -- ein Task,
      der sowohl `assignee_id = $1` als auch `created_by = $1` war, wird also zuerst vom UPDATE
      gezaehlt (RowsAffected) UND danach nochmal von `taskCreatedCount` erfasst, weil sein
      `assignee_id` jetzt NULL ist. Die Daten sind am Ende korrekt (Task ist unassigned,
      created_by unveraendert -- kein Feld wird beim zweiten Treffer nochmal geschrieben,
      es ist eine reine Zaehl-Query), nur der zurueckgegebene `affected`-Wert ist zu hoch.
      Anders als bei der CRM-Variante wird hier keine Compliance-Beleg-Zahl (SHA-256-Hash)
      beeinflusst, sondern nur die im Loeschprotokoll angezeigte Zahl -- trotzdem dieselbe
      Bugklasse, dieselbe Ursache, derselbe Fix.
    sources:
      - backend/internal/security/gdpr/erasure.go
      - backend/internal/security/gdpr/handlers_test.go
    notes: >
      Gefunden beim Bau von fix-crm-erasure-double-count (Lauf 9, Iteration 6) beim
      Root-Cause-Grep nach Schwesterfunktionen mit demselben Muster (zwei sequenzielle
      UPDATE/COUNT-Schritte auf derselben Tabelle in einer Transaktion). NICHT dort mitgefixt,
      weil ausserhalb des `done_when` dieser Unit und WorkErasureHandler.ExecuteErasure bisher
      GAR KEINEN Test hat (nur PreviewErasure ist in handlers_test.go abgedeckt) -- die Unit
      braucht also zusaetzlich einen neuen Integrationstest, nicht nur eine Zahlen-Korrektur
      an einem bestehenden.
      Fix nach dem Muster der CRM-Unit: die zwei Schritte (UPDATE tasks assignee_id=NULL,
      danach SELECT COUNT fuer created_by-only) zu einem einzigen UPDATE zusammenziehen:
      `UPDATE tasks SET assignee_id = CASE WHEN assignee_id = $1 THEN NULL ELSE assignee_id END,
       updated_at = NOW() WHERE assignee_id = $1 OR created_by = $1` -- RowsAffected ist dann
      die korrekte, einmalige Zaehlung. time_entries (DELETE) und task_comments (UPDATE) sind
      von diesem Muster nicht betroffen (eigene, nicht ueberlappende WHERE-Bedingungen) und
      brauchen keine Aenderung.
    done_when:
      - Ein Task, der sowohl assignee_id = user als auch created_by = user ist, wird in
        ExecuteErasure genau einmal gezaehlt
      - Ein Task, der nur created_by = user ist (anderer assignee), behaelt seinen assignee
        und wird weiterhin gezaehlt
      - Ein neuer Integrationstest fuer WorkErasureHandler.ExecuteErasure deckt beide Faelle
        plus time_entries-Delete und task_comments-Anonymisierung ab (bisher ungetestet)
      - go test -count=1 ./internal/security/gdpr/ gruen

