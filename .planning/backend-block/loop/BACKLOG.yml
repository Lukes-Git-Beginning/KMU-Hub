  - id: a-dunning-send-non-fatal
    phase: 3
    service: biz
    model: opus
    deps: []
    status: done
    scope: >
      Den Mahnungsversand gegen fehlende Firmen-Einstellungen haerten.
      `internal/biz/dunning/service.go:314-317` bricht heute hart ab, sobald ein Mailer
      konfiguriert ist und `emailNotice` scheitert: `return nil, fmt.Errorf("send dunning
      notice: %w", sendErr)`. `emailNotice` (ab :361) laedt Rechnung UND Firmen-Einstellungen
      und gibt einen Fehler zurueck, wenn `settings == nil`. In Produktion ist
      `SYSTEM_SMTP_*` seit dem Merge von PR #16 gesetzt — ein Tenant ohne Firmen-Einstellungen
      bekommt beim Mahnungs-Versand damit einen 500er, und der Datensatz bleibt `draft`.
      Der Nil-Mailer-Zweig daneben (:318-322) macht es bereits richtig: warnen und
      weiterlaufen. Diese Semantik auf den Fehlerfall des konfigurierten Mailers ausdehnen —
      `sent_at` setzen, Status auf `sent`, den Zustellfehler per `slog.Error` mit
      `dunning_id`/`tenant_id`/Fehlertext protokollieren.
    sources:
      - backend/internal/biz/dunning/service.go
      - backend/internal/biz/dunning/service_test.go
    notes: >
      Der GoBD-Einwand aus `backend-gaps.md` (Fail-closed sei Absicht, weil "sent" echte
      Zustellung bedeuten muss) gilt fuer die ZUSTELLUNG, nicht fuer fehlende Stammdaten. Die
      Unterscheidung sauber ziehen: ein echter SMTP-Fehler darf gerne weiterhin laut sein,
      aber `settings == nil` ist ein Konfigurationsmangel und kein Zustellungsbeweis. Wenn
      sich beim Lesen zeigt, dass die beiden Faelle nicht unterscheidbar sind, dann NUR den
      Settings-Fall entschaerfen und den Rest lassen. Bestehende Tests in
      `dunning/service_test.go` mitziehen. Kein Aufweichen des Draft-Guards (:310).
    done_when:
      - Ein Send ohne Firmen-Einstellungen liefert 200, setzt sent_at und Status sent
      - Der Zustellfehler steht als slog.Error mit dunning_id und tenant_id im Log
      - Neuer Test deckt genau diesen Pfad ab und wird rot, wenn der Fehler wieder fatal wird
      - go test ./internal/biz/dunning/ gruen, DATABASE_URL gesetzt, keine Skips

