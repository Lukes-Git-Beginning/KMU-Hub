    decided: 2026-10-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-10-24 (`decide-credit-note-over-credit-limit`): Obergrenze =
      Rechnungsbrutto minus bereits erteilte Gutschriften, Prüfung in einer Transaktion mit
      gesperrter Rechnungszeile, Überschreitung -> InvalidArgument/400, Test ohne Build-Tag.
    scope: >
      `creditnote.Service.Create` (`service.go:~75-163`) lädt die Rechnung nur für den
      Status-Check. Beträge sind `decimal.Decimal` (shopspring), Gutschrift erbt die Währung,
      jede Gutschrift hat eine Rechnung (`original_invoice_id NOT NULL`, Migration 000045).
      Bau: eine Tx, darin `SELECT ... FOR UPDATE` auf die Rechnungszeile (neue Methode am
      `InvoiceReader`, Muster `invoice/postgres_repository.go:~506`), Summe der bestehenden
      Gutschriften dieser Rechnung (neue Repo-Methode in der Tx), Prüfung, Insert in DERSELBEN
      Tx (`repo.Create` hat heute eine eigene Tx — `CreateInTx`-Variante). FESTLEGUNG: Entwürfe
      zählen mit (sonst überziehen zwei Entwürfe erst beim Send); `cancelled`/stornierte
      Gutschriften zählen nicht. `StornoInvoice` (`:~243-322`) geht durch Create und spiegelt die
      Rechnung 1:1 — muss genau an der Grenze durchgehen. Neuer Sentinel
      `ErrCreditExceedsInvoice` -> `codes.InvalidArgument` in der Error-Map (`biz_grpc.go:~2800-2811`),
      Meldung auf Deutsch lesbar (das FE zeigt `err.message` im Toast, `CreditNoteDialog.tsx:139-162`).
      Den Integrationstest `repository_coverage_integration_test.go:236-270` (pinnt das alte
      Verhalten) auf `require.ErrorIs` umstellen. 400 an der Create-Route in `openapi.yaml`.
    sources:
      - backend/internal/biz/creditnote/service.go
      - backend/internal/biz/creditnote/postgres_repository.go
      - backend/internal/biz/creditnote/repository.go
      - backend/internal/biz/creditnote/repository_coverage_integration_test.go
      - backend/internal/server/biz_grpc.go
      - backend/api/openapi.yaml
    done_when:
      - "Test ohne Build-Tag: Grenze genau erreicht ok, ein Cent darüber -> ErrCreditExceedsInvoice"
      - "Test: zwei Entwürfe, deren Summe die Rechnung übersteigt -> der zweite wird abgelehnt"
      - "Test: StornoInvoice einer Rechnung ohne Gutschriften geht durch"
      - "DB-Test (integration-Tag erlaubt) mit FOR UPDATE: zwei parallele Gutschriften können die Grenze nicht gemeinsam überschreiten; in offen: abgenommen erst in CI"
      - "Mutations-Probe: Vergleich > auf >= bzw. Lock entfernt, mindestens ein Test wird rot"

