      slog.Default())` — der `nil`-`ContactProvider` ist per Kommentar in `cmd/crm/main.go` nur
      dafuer gedacht, "configured"-Checks + `PreviewCSV` zu bedienen; echte Import-RPCs sollen einen
      Tenant-scoped Adapter PRO REQUEST bauen. Der CRM-Pfad (`crm_grpc.go:2092-2144`) macht das
      auch so. Der Email-Pfad tut es NICHT — jeder Aufruf ueber `POST
      /api/v1/email/.../import/csv` bzw. `/import/vcard` (`route_email.go:198-199`) trifft im
      Import-Service auf `s.contactProvider.GetByEmail`/`CreateForImport` mit `contactProvider ==
      nil` und paniked mit einer Nil-Pointer-Dereferenzierung.
    sources:
      - backend/internal/server/email_grpc.go
      - backend/internal/server/crm_grpc.go
      - backend/cmd/email/main.go
      - backend/internal/email/contact/adapter.go
      - backend/internal/gateway/route_email.go
    notes: >
      Vorlage ist `CRMGRPCServer.ImportContactsCSV`/`ImportContactsVCard`
      (`crm_grpc.go:2092-2144`): Tenant-ID per `middleware.GetTenantID(ctx)` ziehen, User-ID
      parsen, `emailcontact.NewTenantScopedAdapter(contactSvc, companySvc, tenantID)` PRO REQUEST
      bauen, `emailcontact.NewImportService(provider, nil)` lokal instanzieren und darauf
      `ImportCSV`/`ImportVCard` aufrufen — NICHT `s.importService` (das Singleton bleibt fuer
      `PreviewCSV`, falls der Email-Service das ueberhaupt anbietet).
      `EmailGRPCServer` braucht dafuer Zugriff auf einen `TenantedContactService` UND einen
      `TenantedCompanyService` (aus RBAC/CRM-Wiring, `internal/crm/contact`, `internal/crm/company`)
      — pruefen, ob der Email-Service diese Abhaengigkeit ueberhaupt schon injiziert bekommt oder ob
      das eine neue Verdrahtung in `cmd/email/main.go` braucht (separater Prozess vom CRM-Service,
      moeglicherweise ohne DB-Pool-Zugriff auf `contacts`/`companies` — das zuerst klaeren, bevor
      Code geschrieben wird; falls der Email-Prozess strukturell keinen Zugriff auf die CRM-Services
      hat, ist die ehrlichere Antwort ggf., diese beiden RPCs im Email-Service ganz zu entfernen und
      auf den CRM-Pfad zu verweisen, statt Zugriff kuenstlich zu verdrahten).
      `ownerID` kam bisher als `uuid.Nil` mit dem Kommentar "Owner determined by auth context" —
      pruefen, ob das stimmt oder ob auch hier `middleware.GetUserID(ctx)` fehlt.
    done_when:
      - Import-RPCs im Email-Service bauen einen Tenant-scoped Adapter pro Request wie im CRM-Pfad
      - kein Aufruf mehr auf dem nil-Provider-Singleton
      - Test belegt einen erfolgreichen Import ueber den Email-Pfad (nicht nur CRM)
      - go test -count=1 ./internal/server/... gruen
    ergebnis: >
      ERLEDIGT (Iteration 29). Der Email-Prozess haengt am selben Postgres-Pool wie CRM (kein
      separater RPC-Hop noetig) — `cmd/email/main.go` konstruiert jetzt `contact.Service` +
      `company.Service` direkt aus `internal/crm/contact`/`internal/crm/company` und reicht sie in
      `EmailGRPCServer` durch. `ImportContactsCSV`/`ImportContactsVCard` bauen pro Request
      `emailcontact.NewTenantScopedAdapter(contactService, companyService, tenantID)` +
      `NewImportService(provider, nil)`, exakt das Muster aus `crm_grpc.go:2092-2144`. `ownerID` kam
      wie vermutet nie aus dem Request — jetzt `uuid.Parse(middleware.GetUserID(ctx))`, mit
      Unauthenticated bei fehlendem Tenant/User statt der alten Nil-Pointer-Panik.
      Der `importService`-Singleton (nil-Provider) wurde komplett entfernt statt nur umgangen — er
      hatte ausser den beiden jetzt gefixten RPCs keinen Aufrufer (kein `PreviewContactsCSV` im
