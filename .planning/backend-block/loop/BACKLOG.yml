      - backend/internal/gateway/route_biz_gobd_archive.go
      - backend/internal/gateway/route_biz_einvoice.go
      - backend/internal/gateway/route_biz_banking.go
    notes: >
      Reine Spec-Korrektur, kein Code-Verhalten aendert sich. Fuer den GoBD-Pfad die
      "400"-Beschreibung außerdem so umschreiben, dass sie das Groessenproblem nicht mehr
      mitbehauptet (z. B. "Validation error (empty file, unknown doc_type)"), und ein eigenes
