    status: done
    scope: >
      Echte Zeitreihe je Dashboard-KPI. Der KPI-Endpunkt liefert heute nur den aktuellen Wert
      plus `change_percent`; das FE synthetisiert die Trendlinie daraus deterministisch
      (`buildSparklineSeries` in `DashboardGrid.tsx`) - die Kurve zeigt also keine Daten,
      sondern eine Funktion der Kennzahl. `GET /api/v1/berichte/kpis` um `series` je KPI
      erweitern (die letzten acht Perioden, je Punkt Periodenanfang und Wert).
    sources:
      - backend/internal/gateway/route_berichte.go
      - backend/internal/berichte/service.go
      - desktop/src/renderer/src/modules/berichte/DashboardGrid.tsx
    notes: >
      Die Modul-Sichtbarkeitspruefung im KPI-Handler (`route_berichte.go:1072-1081`,
      Modul-zu-RBAC-Key-Map, fail-closed) MUSS auch fuer die Reihe gelten - eine Zeitreihe zu
      einem Modul, das der Nutzer nicht sehen darf, ist derselbe Leck wie der Einzelwert. Die
      Aggregation gehoert in eine SQL-Abfrage pro KPI, nicht in acht Einzelabfragen in einer
      Go-Schleife. Feld additiv ergaenzen, bestehende Antwortform nicht umbauen - das FE
      liest heute schon `change_percent`.
    done_when:
