  - id: fix-calendar-events-holidays-recurring-wire
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/gateway 73,6 %"
    scope: >
      TOTALAUSFALL Kalender, vier Befunde, alle am Code belegt.
      (1) `GET /calendar/events` (`route_calendar.go:561-603`) schreibt `ListEventsInRangeResponse`
      per `response.Proto`: jedes Element ist `{event:{id,start_time,…},calendar_name,display_color,…}`
      (`ExpandedEventProto.event`, calendar.proto:154). Das FE (`adapters.ts:142 expandedEventToUI`,
      `KalenderPage.tsx:445`) liest `event.id`/`event.start_time` FLACH -> `start_time` undefined,
      kein Termin erscheint in Woche/Tag/Monat, Widgets zeigen `NaN:NaN`. Antwort so schreiben, dass
      die Event-Felder auf Elementebene liegen (flach gemerged), ohne die Zusatzfelder zu verlieren.
      (2) Dieselbe Route: das FE sendet `start`/`end` als `YYYY-MM-DD` mit dem LETZTEN SICHTBAREN TAG
      als Ende (`KalenderPage.tsx:421`); Filter ist `start_time < $3` (postgres_repository.go:110) ->
      Tagesansicht leer, Sonntag der Woche fehlt. Reines Datum als `end` inklusiv behandeln (+24 h).
      (3) `GET /calendar/holidays` (`:1311-1326`): das FE sendet `year`, `country_code`,
      `subdivision_code` (`useHolidays.ts:31`), der Handler liest nur `start`/`end`; ohne beide wird
      `nil.AsTime()` = 1970 gefiltert -> immer leer. `year` auswerten (1.1.–31.12.), wenn start/end fehlen.
      (4) `PUT /calendar/events/{id}/recurring` (`:176-180`) erwartet `{scope,original_date,changes:{…}}`,
      das FE sendet die Änderungen FLACH (`KalenderPage.tsx:553`) -> 200 ohne Wirkung. Flache Felder
      akzeptieren (zusätzlich zu `changes`). Mitnehmen: `createEventRequest` verwirft `reminder_minutes`
      (obwohl `calv1.CreateEventRequest.ReminderMinutes` existiert), `updateEventRequest` kennt `rrule`
      nicht -> beide durchreichen.
    sources:
