    scope: >
      `SchichtenGRPCServer.CreateTemplate` (internal/server/schichten_grpc.go:268) parses
      `tenant_id` and then builds `schichten.CreateTemplateInput` from `req.GetName()`,
      `GetDescription()`, `GetDayOfWeek()`, `GetStartHour()`, `GetStartMinute()`,
      `GetDurationMinutes()` - it never calls `req.GetLocation()` and never sets
      `CreateTemplateInput.Location`. Every shift template created via the API therefore has
      `Location: nil` regardless of what the client sent, even though `CreateTemplateInput`
      (service.go:97-106) fully supports the field and `Service.CreateTemplate` writes it
      through unchanged. `UpdateTemplate` (schichten_grpc.go:289, same file) wires the
      identical field correctly (`if l := req.GetLocation(); l != "" { input.Location = &l }`),
      so this is a one-RPC omission, not a missing feature. `ApplyTemplate` then copies
      `tmpl.Location` onto every generated shift (service.go:526), so the loss also silently
      propagates into every shift a template with a location produces.
