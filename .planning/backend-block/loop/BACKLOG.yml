      (Vorbild `mapLexwareError`, bereits vorhanden fuer `DisconnectLexware`), damit
      `respondGRPCError` die Maskierung uebernimmt. Die historischen Sync-Log-Meldungen
      (`error_message` in den Status-/History-Endpunkten) sind ein separates, kleineres Risiko
