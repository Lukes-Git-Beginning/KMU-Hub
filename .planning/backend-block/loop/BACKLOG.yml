      `GetByIdempotencyKey` (174). Die Summe entscheidet, ob eine Rechnung als bezahlt gilt;
      der Idempotency-Key entscheidet, ob eine Zahlung doppelt gebucht wird. Beides ist reine
      SQL-Semantik und mit einem Mock nicht prüfbar.
