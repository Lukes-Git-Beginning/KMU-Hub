  - id: g-rls-plugin-manifests
    phase: sec
    service: plugin
    model: opus
    deps: [g-rls-storage-quotas]
    status: done
    scope: >
      `plugin_manifests` — `POST /api/v1/plugins/manifests` (`RequireRole("admin")`, route_plugin.go:53)
      legt Manifeste ohne `tenant_id` an, `GET /manifests` liefert sie ohne Filter. Ein
      `plugin_type=config`-Manifest eines Tenants ist damit fuer alle sichtbar (WASM-Manifeste sind
      durch den `plugins.wasm`-Flag-Check gesondert blockiert, Config-Manifeste nicht).
    sources:
      - backend/internal/plugin/repository/manifest.go
      - backend/internal/gateway/route_plugin.go
      - docs/ARCHITECTURE.md
    notes: >
      DIESE UNIT IST ZUERST EINE PRODUKTFRAGE, DANN EINE MIGRATION. "Ein Manifest anlegen" kann
      zweierlei sein: eine Tenant-Operation (dann `tenant_id` + RLS wie bei den anderen) oder eine
      Plattform-Operation wie ein App-Store-Katalog (dann braucht es eine Plattform-Rolle, die es
      heute nicht gibt — `platform_admin` existiert laut Welle-1b-Recherche als Rolle fuer
      `tenants:write`, ob sie hier passt, ist zu pruefen).
      Ein dritter Weg ist plausibel und waere zu pruefen, bevor einer der ersten beiden gebaut wird:
      `tenant_id` NULLable mit NULL = "von Zentria ausgeliefertes Manifest, fuer alle sichtbar",
      genau das Policy-Paar, das `roles`/`role_permissions` seit 000256 nutzt (Lesen sieht
      `tenant_id IS NULL OR = current_tenant_id()`, Schreiben nur den eigenen Tenant). Das loest
      Katalog UND Tenant-Manifeste in einem Schema.
      Im Zweifel `blocked` mit der ausformulierten Frage statt geraten — eine falsche Antwort hier
      ist teurer als eine Iteration Wartezeit.
    done_when:
      - entweder Migration + RLS mit begruendetem Schema-Entscheid
      - oder blocked mit der ausformulierten Produktfrage
      - falls gebaut: Isolationstest, migrate up/down/up gruen, go build/vet/lint/test gruen
    ergebnis: >
      ERLEDIGT (Migration 000276, Iteration 17) — GEBAUT, nicht blockiert. Die Produktfrage ist mit
      dem in den notes als "dritter Weg" vermuteten Schema beantwortet: **nullable `tenant_id`, das
      Policy-Paar von `roles`/`role_permissions` aus 000256** (Lesen sieht
      `tenant_id IS NULL OR = current_tenant_id()`, Schreiben nur den eigenen Tenant). NULL heisst
      "mit dem Produkt ausgeliefert, fuer alle lesbar, fuer keinen schreibbar", ein gesetzter Tenant
      heisst "eigenes Manifest". Damit braucht es weder die `platform_admin`-Rolle (die keine Route
      heute vergibt) noch den Entzug der Faehigkeit, eigene Config-Plugins zu definieren. Katalog-
      Zeilen entstehen per Migration wie die Rollen-Presets, nicht ueber eine Route — der WITH-CHECK
      weist einen `tenant_id IS NULL`-Insert ueber die API ab (im Test belegt).
      KEIN Backfill: bestehende Zeilen bleiben NULL. Das ist die verlustfreie Lesart — sie WAREN fuer
      alle sichtbar und bleiben es; was sich aendert, ist nur, dass ein Tenant-Admin sie nicht mehr
      loeschen kann.
      ZWEITER BEFUND, in derselben Unit geschlossen: `DELETE /manifests/{id}` war tenant-uebergreifend
      destruktiv. `DeleteManifest` verweigert das Loeschen bei aktiven Installationen, zaehlt sie aber
      ueber `plugin_installations` — das seit 000122 RLS hat. Die Installationen fremder Tenants waren
      fuer die Zaehlung unsichtbar, der Count kam als 0 zurueck, und `manifest_id ON DELETE CASCADE`
      riss sie mit. Nach 000276 sind Katalog-Zeilen fuer Tenants nicht mehr loeschbar.
      DRITTER BEFUND (Bestand, ausserhalb des Unit-Scopes gefunden, hier gefixt): `wasm_binary_hash`
      ist NULLable ohne Default, `models.PluginManifest` haelt es als `string`. Eine Zeile ohne diesen
      Wert — genau das, was eine Katalog-Seed-Migration schreiben wuerde — liess jeden Read fuer ALLE
      Tenants am Scan scheitern (`cannot scan NULL into *string`). Die drei Lesequeries nutzen jetzt
      `COALESCE(wasm_binary_hash, '')`. Der Fehler fiel nur auf, weil der Isolationstest eine
      Katalog-Zeile per SeedRow anlegt.
      Weitere Entscheidungen: `Service.DeleteManifest` prueft `TenantID == nil` VOR dem Schreiben und
      liefert `ErrManifestImmutable` (403, gemappt ueber `codes.PermissionDenied`) — die Write-Policy
      allein haette null Zeilen getroffen und 200 gemeldet (dieselbe Falle wie `UpdateConfig` in
      Iteration 15). `CreateManifest` loest den Tenant NACH den Eingabepruefungen auf, damit ein
      fehlerhaftes Manifest weiterhin 400 statt 500 liefert. `GetBySlug` bekam
      `ORDER BY (tenant_id IS NULL), id LIMIT 1`: die Kollisionspruefung in `CreateManifest` liest
      unter RLS und weist eine Kollision mit dem Katalog ebenfalls ab, aber falls Zentria spaeter
      einen Slug nachschiebt, den ein Tenant schon nutzt, gewinnt deterministisch die eigene Zeile.
      Kein Cache im Plugin-Modul (die Suche nach der Lehre aus Iteration 15 war negativ), kein
      `sysctx.With()`-Lesepfad (die Lehre aus Iteration 14 greift hier nicht).

