  - id: fix-datev-token-refresh-thundering-herd
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/biz/datev 79,7 % (CI-Stand 32570176303, Paket vorher selbst messen)"
    scope: >
      VERIFIZIERT 2026-08-24, Beobachtung aus Lauf 11 Iteration 51, nie als Unit angelegt.
      `OAuthManager.GetAccessToken` (`internal/biz/datev/oauth.go:70`) liest den Cache unter
      `om.mu.RLock()`, gibt das Lock wieder frei und ruft bei Ablauf `RefreshAccessToken`
      OHNE jedes Lock. Zwei gleichzeitige Aufrufer fuer denselben Tenant laufen damit beide
      in einen vollen OAuth-Roundtrip gegen ein rate-limitiertes Fremdsystem.
      Der Schaden ist auch OHNE die ungeklaerte Rotationsfrage real: doppelte Roundtrips
      gegen ein Kontingent, und der zweite Schreiber ueberschreibt den Cache-Eintrag des
      ersten. Setzt DATEV zusaetzlich Refresh-Token-Rotation ein — was in Iteration 51 als
      unbelegt notiert wurde und es bleibt —, invalidiert der zweite Refresh den Token des
      ersten, und der Kunde sieht sporadische 401er.
      Zu bauen: ein Per-Tenant-Lock um den Refresh-Pfad, nach dem singleflight-Muster —
      der erste Aufrufer refresht, die uebrigen warten und bekommen sein Ergebnis. NICHT ein
      globales Lock ueber alle Tenants: das serialisiert Tenants gegeneinander, die nichts
      miteinander zu tun haben. Nach dem Erwerb des Locks den Cache ERNEUT pruefen (double
      checked), sonst refresht der Wartende gleich hinterher noch einmal.
    sources:
      - backend/internal/biz/datev/oauth.go
      - backend/internal/biz/lexware/service.go
      - backend/internal/idempotency/postgres_repository.go
    notes: >
      Root Cause statt Symptom: vor dem Fix alle Caller von `GetAccessToken` UND von
      `RefreshAccessToken` greppen. Ruft jemand `RefreshAccessToken` direkt (etwa ein
      Reconnect-Pfad), umgeht er das Lock und der Fix waere wirkungslos.
      Pruefen, ob dasselbe Muster in `internal/biz/lexware` oder einer anderen
      Integration steht — sitzt derselbe Bug in einer Schwesterfunktion, gehoert er in
      dieselbe Unit (harte Regel 1).
      `-race` laeuft auf dieser Maschine nicht. Der Nebenlaeufigkeitstest gehoert trotzdem
      geschrieben (er faellt ohne Lock auch ohne -race durch, wenn er die Zahl der
      HTTP-Roundtrips zaehlt statt auf eine Datenrace zu warten); dass die -race-Bestaetigung
      CI vorbehalten bleibt, gehoert in die offen:-Zeile.
      Die Rotationsfrage selbst wird NICHT beantwortet — sie braucht DATEV-Portalzugang.
      Der Fix ist von ihr unabhaengig richtig.
    done_when:
      - >-
        Zwei gleichzeitige GetAccessToken-Aufrufe fuer denselben Tenant loesen nachweislich
        genau EINEN HTTP-Roundtrip aus; ein Test zaehlt die Roundtrips gegen einen Fake
      - >-
        Zwei gleichzeitige Aufrufe fuer VERSCHIEDENE Tenants blockieren sich nicht gegenseitig
        (Test belegt beide Roundtrips)
      - Nach dem Lock wird der Cache erneut geprueft, ein Test belegt den zweiten Treffer
      - >-
        Alle Caller von GetAccessToken und RefreshAccessToken sind gegrept und im Journal
        genannt; ein direkter Refresh-Caller ist entweder mitgezogen oder als bewusst
        ausgenommen begruendet
      - go test -count=1 ./internal/biz/datev/ gruen

