# Backend-Nachtloop — Arbeitsqueue (Lauf 17, gestaged 2026-10-25)
#
# Eine Unit = eine Iteration = ein Commit.
#
# status: todo | in_progress | done | blocked
# model:  sonnet (Default) | opus (architektonisch schwer, Proto, Security, Migration+RLS)
#
# Treiber-Parsing: `hooks/backlog-check.py` lädt diese Datei mit yaml.safe_load. Der Vorflug
# (`--preflight`) bricht ab bei: nicht ladbarem YAML in EINER der drei Dateien, einer Unit ohne
# `id`/`status`, einer Dubletten-ID über die drei Dateien hinweg, `status: blocked` oder einem
# `blocked_reason`-Feld IN DIESER DATEI, einem `done_when[0]`, das eine Entscheidung von Luke
# verlangt, einer `deps`-ID die nirgends existiert, und bei Zyklen in `deps`.
#
# `--state` liefert dem Treiber OPEN=, NEXT= und MODEL=. MODEL kommt von der ERSTEN BAUBAREN
# Unit — `status: todo` UND alle `deps` auf `done`, in DATEIREIHENFOLGE. Wo eine `opus`-Unit
# steht, entscheidet also mit, wie viele Iterationen auf opus laufen.
#
# Läufe 1+2 (58 Units): archive/lauf-1-2/ — Lauf 3 (61): archive/lauf-3/
# Lauf 4 (54): archive/lauf-4/ — Lauf 5 (41): archive/lauf-5/ — Lauf 6 (46): archive/lauf-6/
# Lauf 7 (71): archive/lauf-7/ — Lauf 8 (94): archive/lauf-8/ — Lauf 9 (37): archive/lauf-9/
# Lauf 10 (93, davon 91 done + 2 blocked): archive/lauf-10/
# Lauf 11 (131 Einträge, davon 121 done in 120 Iterationen): archive/lauf-11/ (inkl. Bilanz).
# Lauf 12 (99 Einträge, davon 41 done in 43 Iterationen): archive/lauf-12/ (inkl. Bilanz).
# Lauf 13 (120 Einträge, davon 21 done in 21 Iterationen): archive/lauf-13/ (inkl. Bilanz).
#   Lauf 13 brach nach 21 von 130 Iterationen ab — Ursache und Abhilfe: archive/lauf-13/BACKLOG.yml.
# Lauf 14 (108 Einträge, alle done in 110 Iterationen, Backlog leergelaufen): archive/lauf-14/
#   (inkl. Bilanz). Gemergt als `cadf4bf4` (PR #26), dazu vier Review-Fixes.
# Lauf 15 (26 gestaged, durch Scans auf 74 gewachsen, alle done in 74 Iterationen, Backlog
#   leergelaufen): archive/lauf-15/ (inkl. Bilanz). PR #27 gemergt als `da9fc602`, dazu fünf
#   Review- und CI-Fixes, deployt 2026-10-24.
# Lauf 16 (52 gestaged, durch Scans auf 82 gewachsen, alle done in 82 Iterationen, Backlog
#   leergelaufen um 02:20): archive/lauf-16/ (inkl. Bilanz). PR #28 gemergt als `b88d7eac`,
#   dazu fünf Fixes aus den ersten member-E2E-Flows, deployt 2026-10-25.
#
# Was der Loop NICHT zieht — geparkt oder gestrichen, mit Entscheidung und Zielort:
# BACKLOG-PARKED.yml. Was auf eine Entscheidung wartet: BACKLOG-NEXT.yml. In DIESER Datei steht
# keine `blocked`-Unit. Wird eine Unit im Lauf blockiert, gehört ein `blocked_reason` dazu, der
# sagt, WORAUF sie wartet und WER das entscheidet — und sie wandert IM SELBEN COMMIT nach
# BACKLOG-NEXT.yml. Nicht "vor dem nächsten Lauf": eine blocked-Unit, die hier liegen bleibt,
# lässt den Vorflug des nächsten Laufs abbrechen, bevor die erste Iteration startet (Regel 11).
#
# ==========================================================================================
# STAND DER VORBEREITUNG (2026-10-25, gegen Code, CI, lokale DB und Produktion geprüft)
#
#   - `main` = `6001c1a9` (Merge PR #28 `b88d7eac` plus zwei Docs-Commits), Produktion auf
#     demselben Code (CD 2026-10-25 13:27, Kopf 345 clean, 32 Container healthy).
#     `backend-loop` = `main` plus Staging-Commits (Archiv Lauf 16, Entscheidungsrunde,
#     Treiber-Pflege, lokaler E2E-Stack plus CI-Erweiterung, dieser Backlog).
#   - MIGRATIONSKOPF = 345 (Repo, lokale DB, Produktion). Nummer IMMER zur Laufzeit ermitteln:
#     ls backend/migrations | grep -E "^[0-9]{6}" | sort | tail -1
#   - CI grün auf `b88d7eac` (Run 40196109073, Attempt 2). Attempt 1 fiel an zwei Flakes in nicht
#     angefassten Paketen (produktion 40P01, recurring), beide sind Units in Block B.
#   - TREIBER (Staging-Commit): setzt `GOFLAGS=-p=2` und `GOMAXPROCS=2` für jede Iteration, misst
#     per Stoppuhr und prüft die Journal-Kopfzeile auf den VOLLEN Startstempel (siehe ITERATION.md
#     Schritt 6: woertlich abschreiben).
#   - E2E-STACK NEU: lokal per `bash .planning/backend-block/loop/hooks/e2e-local.sh ['<Regex>']`
#     (Wegwerf-Postgres/Redis/MinIO in Docker, 21 Services nativ auf 127.0.0.1, CI-Env). In der
#     Staging-Session lief die volle Suite damit grün: volle Suite ~35 s, Stack ~20 s, Build mit Cache
#     ~50 s; alle neun neuen Module per Probe gemountet (Admin-GET je Modul 200). Der CI-Job `e2e` startet seit
#     dem Staging zusätzlich produktion, vertraege, rapporte, fuhrpark, vermietung, wiki,
#     berichte, formulare und helpdesk mit ihren Flags. Abgenommen wird das im Morgen-PR.
#
# COVERAGE-AUSGANGSLAGE: 74,5 % gesamt bei Gate 15 % (Run 40196109073). Paketwerte stehen je
# Unit in `coverage_start`.
#
# ------------------------------------------------------------------------------------------
# DER ROTE FADEN DIESES LAUFS
#
# "RECHTE GEGEN DEN ECHTEN SEED — UND JEDES MODUL EINMAL ENDE-ZU-ENDE."
#
# Lauf 16 hat gezeigt, dass Unit-Tests mit handgebauten Tokens Seed- und Token-Fehler nicht
# sehen: Der erste member-E2E fand ein hr:self-Leck, einen Altgrant aus 000068 und eine
# Prod-Altlast (Urlaubsarten). Die Rollenmatrix bildet den Ist-Seed ab, nicht die Absicht. Lauf 17
# scannt deshalb die alten Grants, baut die in der Entscheidungsrunde 2026-10-25 freigegebenen
# Rechte, nimmt die Rechte-Commits in Review-Units gegen den echten Seed ab und bringt neun
# Module zum ersten Mal in den E2E-Stack.
#
#   BLOCK S (2)   — RECHTE-SCANS (opus): Altgrants member/manager, grobe Keys mit Scope != all.
#                   Funde, die fremde Daten öffnen, werden Fix-Units VOR der ersten todo-Unit.
#   BLOCK A (15)  — LECKS UND GRENZEN (überwiegend opus): Inbox-Sichtbarkeit und Team-Inbox,
#                   E-Mail (Dial-Filter, Self-Setup, Regeln/Vorlagen/Labels/Verlauf pro
#                   Nutzer), Privatfahrten maskieren, Share-Token als Hash plus Ablauf,
#                   Join-Token nur für Teilnehmer, CalDAV-Widerruf, Egress erst nach Stempel.
#   REVIEW r1
#   BLOCK B (5)   — BAUBARE RESTE: Urlaubsarten beim Provisioning, produktion 40P01 -> 409,
#                   tax_rate 0..1, Seitengröße 200 in den Branchenlisten, recurring-Flake.
#   BLOCK E (12)  — E2E: zuerst `e2e-local-gate-check`, dann member-Flows für produktion,
#                   rapporte, fuhrpark (2), vermietung (2), vertraege, formulare, helpdesk,
#                   wiki, berichte. Review r2 steht nach der Gate-Prüfung.
#   BLOCK D (34)  — ENTSCHIEDENE FEATURES aus der Runde 2026-10-25, jede Unit trägt ihre
#                   `decision`: Rechte für member/manager (13), Datenschutz (7),
#                   Schichten/Fuhrpark/Work/HR (5), Finanzen/Einkauf (6), Chat-Gruppen-DM und
#                   Alarmregel (3). Reviews r3–r5 dazwischen.
#   BLOCK C (17)  — COVERAGE-SCHUB auf die Pakete unter 60 %. Review r6 danach.
#   BLOCK F (16)  — COVERAGE-FÜLLUNG (60–70 %), nur wenn alles davor durch ist.
#
#   ZUSAMMENSETZUNG: 107 Units gestaged, davon 41 opus. Scans und Reviews legen Fix-Units nach.
#   Reihenfolge = Dateireihenfolge = Priorität. Was ein Scan, ein Review oder ein E2E-Flow als
#   Totalausfall oder Leck findet, gehört VOR die erste `todo`-Unit.
#
# ------------------------------------------------------------------------------------------
# REGELN, DIE IN DIESEM LAUF NEU SIND
#
#   1. LOKALES E2E-GATE. Für E2E-Units und für jede Unit, die einen Flow in `backend/test/e2e/`
#      ändert oder deren Verhalten ein bestehender Flow prüft (die Unit nennt ihn), gilt:
#      `bash .planning/backend-block/loop/hooks/e2e-local.sh '<Regex>'` ist grün. Gate-Zeile
#      `e2e ok (lokal, <Laufzeit>)`. Das Skript baut nur, wenn sich `backend/` geändert hat. Nicht
#      bei jeder Unit laufen lassen, nur wo diese Regel es verlangt. Scheitert der STACK (nicht
#      der Test), steht die Ursache in `offen:` und es gilt der alte Fallback (`go vet -tags=e2e`
#      plus "E2E erst in CI abgenommen"). Ist `e2e-local-gate-check` blocked, gilt der Fallback
#      für den ganzen Lauf. Stack-Fixes im Skript darf der Loop machen, `.github/` nicht.
#   2. RECHTE NUR MIT ECHTEM TOKEN PRÜFEN. Ein Test, der einen Grant, Guard oder Scope belegt,
#      holt das Token über die DB (`ResolveTokenPermissions`/`GetUserGrants` nach der Migration)
#      oder per Login im E2E, nie von Hand gebaut. Lehre hr:self (Lauf 16): `resource = 'hr'`
#      ohne Doppelpunkt fiel durch `resource LIKE '%:%'`, der handgebaute Token sah das nicht.
#      Neue Keys deshalb dreiteilig (`modul:objekt`, Aktion separat).
#   3. REVIEW-UNITS (`review-run17-r*`, opus) prüfen die Rechte-Commits seit dem vorigen Review
#      gegen den echten Seed (Scope siehe Unit). Ihr End-SHA steht im Journal, die nächste
#      Review-Unit beginnt dort.
#   4. ENTSCHEIDUNGEN STEHEN IN DER UNIT. `decision` ist Lukes Entscheidung vom 2026-10-25,
#      nicht neu verhandeln. Passt der Code nicht zur Annahme der Entscheidung (Spalte fehlt,
#      Route anders), `blocked` mit präziser Frage, nicht eigenmächtig umdeuten.
#   5. JOURNAL-STEMPEL = Startzeit aus dem Laufkontext, wörtlich (ITERATION.md Schritt 6).
#
#   WEITER GÜLTIG AUS LAUF 16 (Volltext: archive/lauf-16/BACKLOG.yml):
#   a. ERST DIE DATENGRENZE, DANN DER GRANT. Ein Grant, der fremde Daten freigibt, ist schlimmer
#      als der 403: erst die Begrenzung bauen oder die Unit nach NEXT mit der fehlenden Regel.
#   b. GUARDS NUR ADDITIV: `RequirePermission(grob)` -> `RequirePermissionAny(grob, fein)`, nie
#      ersetzen. Bei Any-Guards mit Own-Scope `ownerFilterForScopeAny` (`gateway/helpers.go`).
#   c. SEED-FORM: `INSERT INTO permissions (name, resource, action) ... ON CONFLICT DO NOTHING`.
#      Grants: `INSERT INTO role_permissions (role_id, permission_id, scope) SELECT r.id, p.id,
#      '<own|team|all>' FROM roles r, permissions p WHERE r.name = '<rolle>' AND r.tenant_id IS
#      NULL AND p.name IN (...) ON CONFLICT (role_id, permission_id) DO NOTHING` (Vorlage 000256).
#      Down entfernt genau diese Zeilen. Admin bekommt jeden neuen Key mit. Zweimal anwendbar.
#   d. NEUE KEYS WIRKEN ERST NACH RE-LOGIN. In `offen:` vermerken, wenn Produktion einen braucht.
#   e. ROLLE IM gRPC-SERVER: Rollen reisen nicht über den Hop, nur `x-user-id`, `x-tenant-id` und
#      die Whitelist `forwardedPermissions` (`middleware/grpc_tenant.go`). Whitelist-Test mitziehen.
#   f. E2E ALS MEMBER. `registerAndLoginAdmin` nur, wo die Funktion admin-only ist.
#   g. Aus Lauf 15: kein "nur dokumentiert" für Totalausfälle (Fix-Unit VOR die erste todo-Unit),
#      Desktop-Aufrufer greppen und die Pflichtzeile `desktop-aufrufer:` füllen.
#
# SPERREN
#
#   - Kein Push, kein PR, kein Produktionszugriff (Guard). Keine neue `config.RequireX`.
#   - `.github/` gesperrt. `deploy/` gesperrt bis auf GENAU `deploy/docker/prometheus/rules/
#     alerts.yml` für `feat-alert-rule-audit-events-dropped`. Ein neues optionales Env (z. B.
#     `EMAIL_DIAL_ALLOWLIST`) darf in `internal/config`, der Compose-Passthrough nicht. Ihn in
#     `offen:` vermerken.
#   - Desktop-Code (`desktop/`) ist tabu: lesen ja, ändern nein. FE-Funde als Unit nach NEXT.
#   - Customization Draft/Deploy-Overlay, Code in `internal/biz/bexio` (G3), WASM: gesperrt. CSAT
#     bleibt aus; nur die Token-Ablage (`harden-share-tokens-hashed-berichte-csat`) ist erlaubt.
#   - Dokumente: KEIN Zugriffsmodell bauen (`decide-document-access-baseline` hängt am Pilot).
#   - Neue Tabelle: `tenant_id NOT NULL` + RLS + tenant-gescopte INSERTs UND SELECTs.
# ==========================================================================================

units:
  - id: scan-legacy-seed-grants-for-member-and-manager
    phase: 4
    service: auth
    model: opus
    deps: []
    status: done
    target: jeder Grant der Presets member/manager vor 000256 ist gegen die Rollenmatrix geprüft
    coverage_start: n.a. (Scan)
    scope: >
      000068 hatte member `dialer:agent:manage` gegeben ("agent self-manage"), unbemerkt bis zum ersten
      E2E mit echtem Seed. Die Rollenmatrix aus Lauf 16 (`role-matrix-lauf16.tsv`) hat das als "ja/ok" gelistet,
      weil sie den Ist-Seed abbildet, nicht die Absicht. Scan: alle `role_permissions` von member/manager
      (Preset, tenant_id IS NULL) mit Schlüsseln `*:manage`, `*:delete`, `*:approve`, `admin:*` auflisten,
      je Grant die Herkunfts-Migration und ob ein Handler den Key als Supervisor-/Fremdzugriff liest. Ergebnis:
      Fix-Units je Fund, keine Code-Änderung im Scan. Vorarbeit der Staging-Session (2026-10-25): 36 Migrationen
      fassen `role_permissions` mit member/manager an, 19 davon enthalten `*:manage|*:delete|*:approve|admin:*`
      (000002, 005-010, 012, 014, 015, 018, 024, 068, 147, 256, 335, 336, 337, 344), dateigenau, nicht grant-genau.
      Die Gegenfrage zu groben Keys steht in `scan-coarse-keys-with-non-all-scope`.
    sources:
      - backend/migrations/000068_dialer_permissions.up.sql
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
      - .planning/backend-block/loop/role-matrix-lauf16.tsv
    done_when:
      - Liste mit Herkunft je Grant im Journal
      - >
        Je Fund, der fremde Daten oder Supervisor-Rechte öffnet, eine Fix-Unit VOR der ersten todo-Unit
        in BACKLOG.yml (wird in diesem Lauf gebaut); reine Produktfragen nach NEXT

  - id: fix-work-member-own-comment-and-time-entry-delete
    phase: 4
    service: work
    model: sonnet
    deps: []
    status: done
    target: member löscht eigene Aufgaben-Kommentare und eigene Zeiteinträge, fremde weiterhin nicht
    coverage_start: n.a.
    scope: >
      TOTALAUSFALL für die Rolle member (Fund aus `scan-legacy-seed-grants-for-member-and-manager`, Lauf 17
      Iteration 1). `DELETE /api/v1/task-comments/{id}` und `DELETE /api/v1/time-entries/{id}`
      (`gateway/route_work.go`, Blöcke "Task comments" und "Time entries") verlangen hart
      `RequirePermission("tasks","delete")`. Den Key hält im Preset nur manager (000024, scope all), member
      hält `tasks:write` (all), aber nicht `tasks:delete`. `RequirePermission` vergleicht exakt
      (`middleware/rbac.go:38`), also bekommt JEDER member beim Löschen eines eigenen Kommentars oder
      eigenen Zeiteintrags 403. Das Bearbeiten derselben Objekte (`PUT`, `tasks:write`) geht. Das FE zeigt
      den Löschknopf nur über `isOwn`/`isOwner` ohne Capability-Prüfung (`useTaskComments.ts:121`,
      `useTimeEntries.ts:196`), der Nutzer sieht also einen Knopf, der immer scheitert. Die Datengrenze
      existiert schon im Service: `DeleteTaskComment` gibt den Akteur an `commentService.Delete` (mit
      `IsAdmin` aus dem Request), `DeleteTimeEntry` ruft `timeEntryService.DeleteEntry(..., actorID, ...,
      false)`. Fix: Guard additiv erweitern, z. B. `RequirePermissionAny({"tasks","delete"},
      {"tasks","write"})` (kein neuer Key, kein Seed nötig) — vorher prüfen, dass beide Services den
      Akteur wirklich gegen Autor/Eigentümer vergleichen und `IsAdmin` nicht aus Client-Eingabe stammt.
    sources:
      - backend/internal/gateway/route_work.go
      - backend/internal/server/work_grpc.go
      - backend/internal/work/
      - desktop/src/renderer/src/api/hooks/useTaskComments.ts
      - desktop/src/renderer/src/api/hooks/useTimeEntries.ts
    notes: >
      Regel 2: Router-Test mit Token aus `GetUserGrants`/`ResolveTokenPermissions` des member-Presets, nicht
      von Hand gebaut. Guard nur additiv (Regel b).
    done_when:
      - 'Router-Test mit echtem member-Token: eigenen Kommentar und eigenen Zeiteintrag löschen 200/204'
      - 'Fremden Kommentar bzw. fremden Zeiteintrag löschen als member 403/404'
      - manager-Pfad unverändert (Test)

  - id: fix-rapporte-measurement-read-follows-report-scope
    phase: 4
    service: rapporte
    model: opus
    deps: []
    status: done
    target: member liest Aufmaße nur zu Rapporten, die er selbst lesen darf
    coverage_start: n.a.
    scope: >
      LECK INNERHALB DES TENANTS (Fund aus `scan-legacy-seed-grants-for-member-and-manager`, Lauf 17
      Iteration 1). member hält `rapporte:report:read` mit Scope `own`, aber `rapporte:measurement:read`
      mit Scope `all` (beides 000256). `GET /api/v1/rapporte/measurements` und
      `GET /api/v1/rapporte/measurements/{id}` (`gateway/route_rapporte.go`, `HandleListMeasurements`,
      `HandleGetMeasurement`) reichen keinerlei Autor-Einschränkung durch — `ListMeasurementsRequest` und
      `GetMeasurementRequest` haben gar kein `restrict_to_author`-Feld. Ein member liest damit alle Aufmaße
      des Tenants inklusive Titel, Ort, `measured_by`, Notizen und Positionen zu Rapporten anderer, die
      er selbst nicht öffnen darf. Die Schreibwege sind dagegen schon begrenzt
      (`rapporteMeasurementScopeKeys` mit `rapporte:report:edit`, narrower wins). Kein Desktop-Aufrufer
      heute (Aufmaß-Tab läuft auf einem lokalen Mock-Store), erreichbar per REST. Fix: `restrict_to_author`
      in beide Requests (Proto + Regen), Gateway setzt es per `restrictToAuthor` über
      `rapporte:measurement:read` + `rapporte:report:read`, Service filtert über den Autor des
      zugehörigen Rapports (gleiche Logik wie die Schreibwege).
    sources:
      - backend/internal/gateway/route_rapporte.go
      - backend/proto/rapporte/v1/
      - backend/internal/rapporte/
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
    notes: >
      Erst reproduzieren (Router- oder Service-Test mit echtem member-Token, Regel 2), dann fixen. Proto-Regen
      im selben Commit. manager/admin (report:read all) sehen weiter alles.
    done_when:
      - 'Test mit echtem member-Token: Aufmaß zum eigenen Rapport 200, zu fremdem Rapport 404 (Liste ohne Eintrag)'
      - 'manager sieht weiter alle Aufmaße (Test)'
      - Proto regeneriert, `.pb.go` im Commit

  - id: scan-coarse-keys-with-non-all-scope
    phase: 4
    service: auth
    model: opus
    deps: []
    status: done
    target: jeder grobe Key mit Scope ungleich all ist auf seine neue Wirkung geprüft
    coverage_start: n.a. (Scan)
    scope: >
      Seit `b00ed131` baut `ResolveTokenPermissions` die Scopes aus `GetUserGrants`. Ein grober Key (`resource`
      ohne Doppelpunkt) mit Scope `own`/`team` wirkt seitdem. Vorher fiel er durch `resource LIKE '%:%'`
      und galt als `all`. Damit sind zwei Klassen von Pfaden neu scharf: (a) Handler, die einen solchen
      Key per `ownerFilterForScope*` lesen, deren Begrenzung bisher nie griff und deshalb nie getestet wurde,
      und (b) Handler, die bisher unbeabsichtigt `all` lieferten und jetzt plötzlich leer oder 403 antworten
      (Totalausfall). Scan: alle Preset-Grants (`tenant_id IS NULL`) mit grobem Key und Scope ungleich `all`
      auflisten, je Key die lesenden Handler, und prüfen, was ein member heute bekommt (Router-Probe mit
      Token aus `GetUserGrants`).
    sources:
      - backend/internal/auth/
      - backend/internal/gateway/helpers.go
      - .planning/backend-block/loop/role-matrix-lauf16.tsv
    done_when:
      - Liste Key -> Scope -> Handler -> Verhalten vorher/nachher im Journal
      - Je Fund eine Fix-Unit vor der ersten todo-Unit (Totalausfall vor Leck vor Kosmetik)

  - id: fix-hr-correction-list-for-approvers
    phase: 4
    service: gateway
    model: opus
    deps: []
    status: done
    target: Manager und hr_admin sehen im Tab "Korrekturen" die offenen Korrekturen ihres Bereichs, nicht nur die eigenen
    coverage_start: n.a. (Fix)
    scope: >
      TOTALAUSFALL seit `b00ed131` (deployt 2026-10-25), reproduziert in Iteration 4 von Lauf 17 per Router-Probe
      mit echtem Seed-Token. Der Tab "Korrekturen" auf der Team-Seite (`modules/team/TimeCorrectionPanel.tsx`)
      liest `GET /api/v1/hr/time/entries?status=correction_pending` ohne `employee_id`. Der Handler
      (`HandleListWorkTimeEntries`) pinnt über `restrictToOwnEmployee` jeden Aufrufer mit `hr:self` scope own
      auf sich selbst. Manager hält `hr:self` own, kein `hr:read`, aber `zeiterfassung:corrections:approve` (all)
      und `zeiterfassung:team:view` (team) → bekommt nur die eigenen offenen Korrekturen, kann die seines Teams
      nicht sehen und also nicht freigeben (Probe: EmployeeId = eigene User-ID). Vor `b00ed131` galt `hr:self` als
      `all` und JEDER member sah die Korrekturen des ganzen Tenants (das Leck ist zu Recht zu). hr_admin hält
      weder `hr:read` noch `hr:self` → 403 auf derselben Route, obwohl er `zeiterfassung:corrections:approve` all
      hält. Fix nach Muster von `HandleListLeaveRequests`/`callerMayDecideLeave` (`gateway/helpers.go`): Guard
      additiv um `zeiterfassung:team:view` (und/oder `zeiterfassung:corrections:approve`) erweitern; wer
      `zeiterfassung:team:view` über own hält und keine fremde/eigene `employee_id` verlangt, wird nicht auf
      sich gepinnt, sondern auf seine Reichweite: `team` → Berichtslinie (`hr_employee_profiles.manager_user_id`,
      wie `GetTeamTime` per `narrowestScopeAny(hr:read, zeiterfassung:team:view)`), `all` → Tenant. Erst die
      Datengrenze (Regel a): kann `ListWorkTimeEntries` heute nicht auf die Berichtslinie filtern, gehört der
      Filter in Repository/Service, nicht als Post-Filter. member bleibt auf sich gepinnt.
    sources:
      - backend/internal/gateway/route_hr.go (HandleListWorkTimeEntries, Guards Zeile ~110-140, HandleGetTeamTime)
      - backend/internal/gateway/helpers.go (restrictToOwnEmployee, narrowestScopeAny, callerMayDecideLeave)
      - backend/internal/server/hr_grpc.go (ListWorkTimeEntries, GetTeamTime)
      - backend/internal/biz/hr/timetracking/service.go (ListWorkTimeEntries, GetTeamTime)
      - backend/internal/gateway/route_work_own_delete_db_test.go (Vorlage Router-Probe mit echtem Seed-Token)
      - desktop/src/renderer/src/modules/team/TimeCorrectionPanel.tsx (nur lesen)
    notes: >
      Keine neue Permission, kein Seed — alle Keys existieren. Wirkt ohne Re-Login (Keys stehen im Alt-Token).
      Test nach Regel 2: Token über ResolveTokenPermissions, Rollen member/manager/hr_admin/admin, echter
      timetracking-Repo oder Fake-gRPC, der den Filter mitschreibt. Ein Mitarbeiter außerhalb der Berichtslinie
      des Managers darf in der Liste NICHT auftauchen.
    done_when:
