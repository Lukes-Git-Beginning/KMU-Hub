#     einen Build-Tag.
#
#   Getestet wird das, was in einem Thin Handler wirklich Logik ist, in dieser Rangfolge:
#     a) die `map<X>Error`-Tabelle — jedes Sentinel gegen den erwarteten gRPC-/HTTP-Code.
