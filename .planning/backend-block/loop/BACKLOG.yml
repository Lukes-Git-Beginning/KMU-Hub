    phase: 4
    service: calendar
    model: sonnet
    # deps erfuellt: fix-generatejointoken-missing-event-tenant-check ist in Lauf 13 done (`c448273f`), Unit liegt in archive/lauf-13/BACKLOG.yml
    deps: []
    status: done
