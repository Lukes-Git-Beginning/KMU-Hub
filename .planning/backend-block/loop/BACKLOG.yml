  - id: fix-caldav-basic-auth-ignores-user-state
    phase: 4
    service: caldav
    model: sonnet
    deps: []
    status: done
    coverage_start: "n.a. (Fix, Coverage nur als Beleg)"
    scope: >
      VERIFIZIERTER AUTH-BEFUND aus `scan-signed-url-and-token-lifetimes` (Iteration 50), mit einem
      temporaeren DB-Test als kmuhub_app reproduziert und wieder geloescht: ein DEAKTIVIERTER Nutzer
      (`users.is_active = false`) besteht die CalDAV/CardDAV-Basic-Auth weiter. `Validate`
      (`caldav/app_password.go:92`) prueft nur den Org-Schalter und die bcrypt-Passwoerter;
      `FindActiveByUser` (`postgres_app_password.go:86`) filtert nur `revoked_at IS NULL` und
      joint `users` nicht; `resolveTenantID` (`caldav_backend.go:70`) liest den Tenant ohne
      `is_active`. Test-Ausgabe: `users.is_active = false`, `Validate after deactivation:
      user=<id> err=<nil>`, `ctxInjector after deactivation: err=<nil>`.
      Das Offboarding (`hr/employee/postgres_repository.go:270`) setzt `is_active = false` und
      loescht `user_roles`, widerruft aber keine App-Passwoerter. Die DAV-Routen haben keinen
      `RequirePermission` (nur Basic Auth, `route_caldav.go:138-153`), das Loeschen der Rollen
      greift dort also nicht. App-Passwoerter haben keinen Ablauf (keine `expires_at`-Spalte,
      Migration 000049). Folge: ein ausgeschiedener Mitarbeiter behaelt unbegrenzt Lese- UND
      Schreibzugriff auf Kalender und Kontakte, bis jemand `DELETE /admin/caldav/users/{id}/passwords`
      von Hand aufruft - der einzige Aufrufer von `RevokeAllUserPasswords`.
      Login und Refresh pruefen `is_active` (`auth/service.go:150,213`), CalDAV ist der Pfad,
      der es vergessen hat.
    sources:
      - backend/internal/caldav/app_password.go
      - backend/internal/caldav/postgres_app_password.go
      - backend/internal/caldav/caldav_backend.go
      - backend/internal/gateway/route_caldav.go
      - backend/internal/caldav/app_password_db_test.go
    notes: >
      Root Cause an der gemeinsamen Stelle: `Validate` hat genau einen Aufrufer
      (`basicAuthMiddleware`), `FindActiveByUser` genau einen (`Validate`). Fix in der Abfrage:
      `JOIN users u ON u.id = asp.user_id AND u.is_active` (System-Kontext ist dort schon gesetzt,
      der Join braucht keinen Tenant). `resolveTenantID` zusaetzlich mit `AND is_active`
      absichern - es ist der zweite Weg ins DAV-Backend. Keine Migration, keine Route.
      Antwort fuer den Client bleibt 401 (`ErrInvalidCredentials`), nicht 403 und nicht anders
      als bei falschem Passwort. Nicht Teil dieser Unit: das Offboarding soll die Passwoerter
      zusaetzlich widerrufen (dann leben sie bei Reaktivierung nicht wieder auf) - Entscheidung
      Luke, steht als Frage in `decide-token-lifetime-and-storage-policy` (BACKLOG-NEXT.yml).
      ACHTUNG User-Flag: `users.caldav_enabled` (Pro-Nutzer-Schalter, `handleDisableCalDAV`)
      wird in `Validate` ebenfalls nie gelesen - "CalDAV ausschalten" sperrt die Basic Auth also
      nicht. Das NICHT in dieser Unit durchsetzen, ohne vorher zu pruefen, ob
      `handleCreatePassword` den Schalter setzt; sonst fallen bestehende Einrichtungen aus.
      Im Zweifel nur `is_active` und die Frage ins Journal.
    done_when:
      - Deaktivierter Nutzer mit gueltigem App-Passwort bekommt von `Validate` ErrInvalidCredentials
      - Reaktivierter Nutzer besteht die Pruefung mit demselben Passwort wieder
      - Test mit echter DB als kmuhub_app, 0 Skips, beide Faelle (Validate und NewCtxInjector)
      - Mutations-Probe - Join/Filter entfernt, Test rot, zurueckgedreht
      - Kein neuer Produktionspfad, keine Migration

