      aus dem Bestands-Token stammt. Das Token wird nur einmal in der Create-Antwort zurückgegeben. Prüfen,
      ob das Desktop das Token später erneut liest: `decide-formulare-share-link-url-channel-toggle` blendet
      „Link kopieren“ bereits aus. Für Wiki in `desktop-aufrufer:` belegen.
