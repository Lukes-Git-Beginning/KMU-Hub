    model: sonnet
    deps: []
    status: done
    scope: >
      `github.com/xuri/excelize/v2` von v2.8.1 auf v2.11.0. CVE-2026-54063 (Unbounded Row Index
      Allocation, OOM-DoS). Sprung ueber drei Minors, deshalb eigene Unit.
    sources:
      - backend/go.mod
    notes: >
      Alle Aufrufstellen suchen bevor gebumpt wird (grep excelize) — die Export-Pfade sind der
      Risikobereich. Kompiliert der Code nach dem Bump nicht, ist das der einfache Fall.
      Der gefaehrliche Fall ist: kompiliert, aber Zellformate oder Streaming-Writer verhalten
      sich anders. Deshalb ist die naechste Unit eine eigene und keine Fussnote.
      Bricht etwas das nicht in zwei ernsthaften Versuchen sauber zu fixen ist:
      `git checkout -- . && git clean -fd`, Unit auf blocked mit praezisem Grund. Nicht raten,
      nicht halb migrieren.
    done_when:
