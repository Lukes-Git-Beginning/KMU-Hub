  - id: fix-idempotency-real-sql-coverage-core
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/idempotency (Paketwert im CI-Log nachschlagen, Run 32508843776)"
    scope: >
      `internal/idempotency` traegt die Doppelausfuehrungssperre fuer alle POST-Routen mit
      Idempotency-Key — Dialer-Outcomes, Finance-Buchungen, Webhooks. `Reserve`
      (postgres_repository.go:79), `Complete` (159) und `Get` sind der Kern. Was hier
      danebengeht, erzeugt doppelte Buchungen, und zwar lautlos.
    sources:
      - backend/internal/idempotency/postgres_repository.go
      - backend/internal/idempotency/repository_test.go
      - backend/internal/idempotency/rls_test.go
    notes: >
      GEGEN ECHTES SQL, nicht gegen ein Mock. Der Wert dieser Mechanik liegt genau in dem, was
      die Datenbank tut: Eindeutigkeitsverletzung bei gleichzeitiger Reservierung desselben
      Schluessels. Ein Mock beantwortet die Frage nicht, die zaehlt.
      Der eigentliche Test: zwei Reservierungen desselben Schluessels, eine gewinnt, die andere
      bekommt den bereits gespeicherten Zustand statt eines Fehlers.
      Abgelaufene Reservierungen und der Fall "reserviert, aber nie abgeschlossen" (Prozess
      gestorben) gehoeren dazu — sonst blockiert ein Absturz den Schluessel fuer immer.
    done_when:
      - Reserve, Get und Complete sind gegen echtes SQL getestet, DATABASE_URL Pflicht
      - Gleichzeitige Reservierung desselben Schluessels ist als Fall abgedeckt
      - Reserviert-aber-nie-abgeschlossen ist abgedeckt
      - go test -count=1 ./internal/idempotency/... gruen

  - id: fix-idempotency-real-sql-coverage-cleanup-concurrency
    phase: 4
    service: gateway
    model: sonnet
    deps: [fix-idempotency-real-sql-coverage-core]
    status: done
    coverage_start: "internal/idempotency (Paketwert im CI-Log nachschlagen, Run 32508843776)"
    scope: >
      Zweite Haelfte: `Cleanup` (postgres_repository.go:179) und `CleanupWithLock` (188). Der
      Advisory Lock ist die Antwort darauf, dass mehrere Gateway-Instanzen dieselbe
      Aufraeumarbeit gleichzeitig starten. Ob er das wirklich leistet, ist nie gegen zwei
      echte Verbindungen geprueft worden.
    sources:
      - backend/internal/idempotency/postgres_repository.go
      - backend/internal/idempotency/repository_test.go
    notes: >
      Mit `-race` laufen lassen, nicht nur `go test`.
      Zwei Verbindungen, beide rufen CleanupWithLock mit demselben Lock-Key: eine arbeitet, die
      andere kehrt sofort zurueck, ohne zu blockieren und ohne zu doppeln. Genau das ist die
      Zusage der Funktion.
      Dieselbe Mechanik ist die Vorlage fuer das Scheduling in A14 — was hier bewiesen wird,
      traegt dort.
      Cleanup darf keine Reservierung entfernen, die noch laeuft. Ein Test mit einer frischen
      und einer abgelaufenen Reservierung belegt die Grenze.
    done_when:
      - Cleanup und CleanupWithLock sind gegen echtes SQL getestet
      - Zwei gleichzeitige Verbindungen belegen, dass nur eine arbeitet und keine blockiert
      - Eine laufende Reservierung ueberlebt den Cleanup, eine abgelaufene nicht
      - go test -count=1 -race ./internal/idempotency/... gruen

