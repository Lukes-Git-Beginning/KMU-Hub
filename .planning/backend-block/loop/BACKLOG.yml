    done_when:
      - Migration legt contract_events an, up und down beide gefuellt, tenant_id NOT NULL + RLS
      - Schreibpfad an mindestens Create, Update und Terminate verdrahtet
      - GET liefert {items,total}, leere Liste als [] nicht null, tenant-gescopt
