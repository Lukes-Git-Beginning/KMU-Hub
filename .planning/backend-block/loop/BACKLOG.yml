  - id: harden-machine-booking-exclusion-constraint
    phase: 4
    service: produktion
    model: opus
    deps: []
    status: done
    coverage_start: "n.a. (Haertung, kein Coverage-Ziel)"
    scope: >
      Nebenbefund aus `scan-resource-double-booking-race` (Iteration 49). `machine_bookings` hat KEINE DB-seitige
      Sperre. `CreateBookingWithLock` serialisiert Anlagen per `pg_advisory_xact_lock`, aber `UpdateMachineBooking`
      (`service.go`, ruft `FindConflictingBooking` ohne Transaktion/Lock, danach `UpdateBooking`) ist ein offenes
      Read-vor-Write: zwei gleichzeitige Verschiebungen (oder Verschiebung gegen Neuanlage, die den Lock haelt, den die
      Verschiebung nicht nimmt) koennen dieselbe Maschine doppelt belegen. Loesung wie bei `rentals` (000101):
      `ALTER TABLE machine_bookings ADD CONSTRAINT ... EXCLUDE USING GIST (tenant_id WITH =, machine_id WITH =,
      tstzrange(starts_at, ends_at, '[)') WITH &&) WHERE (status IN ('booked','in_use'))`; die Extension `btree_gist`
      existiert seit 000034/000101. `23P01` im Repo auf `ErrBookingConflict` abbilden (Vorlage: `asRentalConflict`,
      `vermietung/postgres_repository.go`) fuer `CreateBookingWithLock` UND `UpdateBooking`. Die bestehende
      Vorab-Pruefung bleibt (liefert die ID der kollidierenden Buchung fuer die Fehlermeldung).
    sources:
      - backend/internal/produktion/postgres_repository.go
      - backend/internal/produktion/service.go
      - backend/migrations/000087_create_produktion.up.sql
      - backend/migrations/000101_vermietung_gist_overlap_unique_inspection.up.sql
    notes: >
      PRODUKTIONSABFRAGE vor dem Ausrollen (Luke): die Migration scheitert, wenn schon Ueberschneidungen existieren.
      SELECT a.tenant_id, a.machine_id, a.id, b.id FROM machine_bookings a JOIN machine_bookings b
      ON a.tenant_id = b.tenant_id AND a.machine_id = b.machine_id AND a.id < b.id
      AND a.status IN ('booked','in_use') AND b.status IN ('booked','in_use')
      AND a.starts_at < b.ends_at AND a.ends_at > b.starts_at;
      Nicht leer -> erst bereinigen (eine der Buchungen stornieren), dann migrieren. machine_id ist TEXT (kein Maschinen-
      Stamm); GiST mit Text ueber btree_gist ist moeglich. Forward-only, .up und .down. Test: zwei Goroutinen verschieben
      parallel auf dasselbe Fenster, genau eine gewinnt (Goroutinen -> `-race` nur in CI, in `offen:` vermerken).
    done_when:
      - Migration mit EXCLUDE-Constraint auf machine_bookings, up und down, lokal gegen kmuhub_app angewandt
      - 23P01 wird in Create und Update auf ErrBookingConflict abgebildet, Test mit echter DB belegt es
      - Mutations-Probe - Mapping entfernt, Test rot, zurueckgedreht
      - Produktionsabfrage steht im Journal

