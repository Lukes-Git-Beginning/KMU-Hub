      mehr gesehen (vorher: die unkorrigierte). (c) Genehmigung und Supersede
      laufen in EINER Transaktion (`WorkTimeRepository.ApproveCorrection`) —
      getrennt geschrieben liesse ein Fehler dazwischen den Tag entweder doppelt
      oder gar nicht gezaehlt. (d) Proto-Enum `WORK_TIME_SUPERSEDED = 5`
      ergaenzt und regeneriert, sonst waere der neue Status als UNSPECIFIED ueber
