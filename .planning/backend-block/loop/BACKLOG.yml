  - id: scan-money-reads-without-tenant-scope
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/biz 63,7 % (CI-Stand 32570176303)"
    scope: >
      RLS liegt lückenlos über 336 Tabellen — aber RLS schützt nur, wenn `app.tenant_id`
      gesetzt ist. Ein Lesepfad, der über `sysctx` läuft (Systemkontext, RLS umgangen) und
      danach nicht selbst nach `tenant_id` filtert, sieht alles. Genau das ist bei den
      Hintergrundläufen der Fall: Retention-Scheduler, wiederkehrende Rechnungen,
      Lexware-Scheduler, Bexio-Poller, Zahlungsabgleich und der Aufräumlauf der
      Idempotenz-Schlüssel laufen alle ohne Benutzerkontext.
      Dieser Scan listet alle Stellen auf, an denen ein Geldpfad im Systemkontext liest oder
      schreibt, und prüft je Stelle die explizite Tenant-Filterung.
    sources:
      - backend/internal/biz/
      - backend/internal/security/gdpr/retention.go
      - backend/internal/sysctx/
      - backend/internal/testutil/rls.go
    notes: >
      Grundgesamtheit mechanisch: über `internal/` nach `sysctx.With` und nach
      `is_system_context()` in den Policies greppen, dazu alle Scheduler und Worker aus
      `cmd/*/main.go`. Jede Stelle, die beides mit Geld verbindet, ist ein Kandidat.
      Je Stelle die Frage: filtert die Query selbst nach `tenant_id`, oder verlässt sie sich
      auf einen Kontext, den der Systemkontext gerade ausgeschaltet hat? Der zweite Fall ist der
      Fund.
      Ein Systemkontext ist NICHT per se falsch — ein Worker, der über alle Mandanten iterieren
      SOLL, braucht ihn. Der Fund ist der Fall, in dem das Ergebnis anschliessend EINEM
      Mandanten zugeordnet wird, ohne dass die Query das sicherstellt.
      ACHTUNG bei Beweisen: ein RLS-Smoke, bei dem beide Zählungen 0 sind, beweist nichts
      (Lauf 10, Iteration 51). Wer eine Lücke behauptet, muss sie mit befüllten Daten zeigen —
      und wer keine findet, muss zeigen, dass die Daten da waren.
      Die lokale Dev-Postgres trägt 13,8k Müll-Tenants; nicht über `tenants` iterieren.
    done_when:
      - Vollständige Liste der Geld-Lese- und Schreibpfade im Systemkontext, inklusive aller
        Scheduler und Worker
      - Je Stelle belegt, ob die Query selbst nach tenant_id filtert
      - Jede behauptete Lücke ist mit befüllten Daten gezeigt, nicht mit zwei Nullen
      - Jeder Fund ist als eigene Unit angelegt
      - neue-units im Journal nennt die IDs, die wirklich in BACKLOG.yml stehen

  - id: fix-write-path-line-total-unrounded-everywhere
    phase: 4
    service: biz
    model: opus
    deps: [fix-tax-rounding-divergence-across-implementations]
    status: done
    coverage_start: "internal/biz/invoice 43,1 % · internal/biz/quote · internal/biz/creditnote · internal/biz/recurring · internal/biz/pdf (je eigene Messung)"
    scope: >
      Befund aus A2 (Iteration 2, Lauf 11). Der E-Rechnungs-Generator rundet den Zeilenbetrag
      jetzt auf Cent, bevor er summiert — BR-CO-10 vergleicht BT-106 exakt gegen die Summe der
      geschriebenen Zeilenbetraege und kennt keine Toleranz. Die SCHREIBSEITE tut das nicht:
      an sieben Stellen steht `LineTotal = Quantity.Mul(UnitPrice)` ohne `.Round(2)`, und
      `tax.Calculate` summiert diese ungerundeten Betraege zum Subtotal.
      Folge: bei Bruchmengen weicht das gespeicherte Netto (und damit PDF und UI) um Cent vom
      Netto der XRechnung ab. Vier Zeilen zu 1,5 x 33,33 EUR ergeben gespeichert 199,98 und im
      XML 200,00. Ueberbrueckt wird das derzeit durch die mit der Zeilenzahl skalierende
      Toleranz in `einvoice.totalsTolerance` — die haelt den Export am Leben, macht die
      Differenz aber nicht weg.
      Die Stellen (alle ohne `.Round(2)`):
      `invoice/service.go:151` und `:473`, `quote/service.go:121` und `:305`,
      `creditnote/service.go:100`, `recurring/service.go:482`, `pdf/templates.go:154`,
      dazu `tax/calculator.go:70` (dort ist es A3/A4-Gebiet — abstimmen, nicht doppelt fixen).
    sources:
      - backend/internal/biz/invoice/service.go
      - backend/internal/biz/quote/service.go
      - backend/internal/biz/creditnote/service.go
      - backend/internal/biz/recurring/service.go
      - backend/internal/biz/pdf/templates.go
      - backend/internal/biz/tax/calculator.go
      - backend/internal/biz/einvoice/generator_doc.go
    notes: >
      Reihenfolge beachten: erst `fix-tax-calculator-line-total-unrounded` (A4), sonst rundet
      die Schreibseite die Zeile und `tax.Calculate` summiert weiter ungerundet — dann stimmt
      gar nichts mehr. Beide muessen im selben Zustand landen.
      `pdf/templates.go:154` ist dieselbe Fehlerklasse in sichtbarer Form: die gedruckten
      Zeilen koennen sich nicht zur gedruckten Summe addieren. Mitziehen.
      Sind alle Stellen gerundet, sollte die Toleranz in `einvoice.totalsTolerance` wieder auf
      einen festen Wert zurueck koennen — das ist der Beweis, dass die Vereinheitlichung
      wirklich durch ist. Erst pruefen, ob Alt-Rechnungen aus der Datenbank dann noch
      exportieren; deren gespeicherte Summen bleiben ungerundet.
      Kein Migrations-Backfill bestehender Rechnungen ohne Luke — das aendert gebuchte Betraege.
    done_when:
