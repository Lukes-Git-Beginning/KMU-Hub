# Backend-Nachtloop — Arbeitsqueue (Lauf 9, gestaged 2026-08-11)
#
# Eine Unit = eine Iteration = ein Commit.
#
# status: todo | in_progress | done | blocked
# model:  sonnet (Default) | opus (architektonisch schwer, Proto, Security, Migration+RLS)
#
# ACHTUNG Treiber-Parsing: `model:` muss VOR `status:` stehen, und hinter `status: todo`
# darf kein Kommentar stehen (der Treiber zaehlt offene Units per Zeilen-Regex).
#
# Laeufe 1+2 (58 Units): archive/lauf-1-2/ — Lauf 3 (61): archive/lauf-3/
# Lauf 4 (54): archive/lauf-4/ — Lauf 5 (41): archive/lauf-5/ — Lauf 6 (46): archive/lauf-6/
# Lauf 7 (71): archive/lauf-7/ — Lauf 8 (94): archive/lauf-8/ (jeweils inkl. logs/)
#
# Was der Loop NICHT zieht — geparkt oder gestrichen, mit Entscheidung und Zielort:
# BACKLOG-PARKED.yml. In DIESER Datei steht keine `blocked`-Unit. Wird eine Unit im Lauf
# blockiert, gehoert ein `blocked_reason` dazu, der sagt, WORAUF sie wartet und WER das
# entscheidet.
#
# ------------------------------------------------------------------------------------------
# STAND DER VORBEREITUNG (2026-08-11, alles gegen den laufenden Code gemessen)
#
#   - Lauf 8 ist gemergt und deployt. PR #21 -> `main` `8c224eba`, Produktion auf
#     Migrationskopf 310 clean, 36 Container laufend / 30 healthy / 0 unhealthy,
#     `/health` meldet 23 Services. NAECHSTE FREIE MIGRATION = 311, aber IMMER zur
#     Laufzeit ermitteln:
#     `ls backend/migrations | grep -E '^[0-9]{6}' | sort | tail -1`
#   - `backend-loop` steht auf `origin/main` `10a1a26e` (Merge, kein Rebase).
#   - Auf `main` liegen seit Lauf 8 drei Commits aus der Vorbereitung dieses Laufs:
#     `3353a402` (Mock-Seeds in vier Zustand-Stores hinter DEMO_MODE),
#     `a72a987a` (react-router 7.18.2 + dompurify 3.4.13),
#     `10a1a26e` (Passwort-Reset-Seite im Gateway, `GET/POST /reset-password`).
#     Die Reset-Seite ist eine NEUE oeffentliche Route — beim Anfassen von
#     `cmd/gateway/main.go` nicht versehentlich ausbauen.
#
# COVERAGE-AUSGANGSLAGE (CI-Run 31471247645 auf `8c224eba`, gesamt 60,0 % bei Gate 15 %):
#     server 70,0 · auth 67,9 · security/audit 66,1 · security/gdpr 60,6 · email/send 57,6
#     schichten 79,7 · biz/datev 79,3 · document/virtual 83,1 · notification/preference 87,2
#     rapporte 76,0 · crm/contact 80,6 · gateway 46,0 (schwaechstes Kernpaket)
#
# ------------------------------------------------------------------------------------------
# DER ROTE FADEN DIESES LAUFS
#
# Lauf 9 ist ein reiner FIX- und SCAN-Lauf. KEINE Coverage-Units.
#
# Begruendung, direkt aus den Zahlen von Lauf 8: die vier Pakete mit den schlimmsten Bugs
# haben die HOECHSTE Coverage — notification/preference 87,2 % (UpsertQuietHours schlaegt bei
# jedem Aufruf fehl), document/virtual 83,1 % (vier Queries auf eine geloeschte Spalte),
# schichten 79,7 % (Schichttausch hat keinen funktionierenden Pfad), biz/datev 79,3 %
# (Upload seit zwei Monaten totalausgefallen). Coverage misst keine Korrektheit. Mehr
# Prozente auf `gateway` wuerden dieselbe Bug-Klasse ERZEUGEN, nicht finden.
#
#   BLOCK A (10 Units) — die verifizierten Produktionsbugs aus Lauf 8, nach Schwere sortiert.
#     Alle gegen die lokale DB reproduziert, alle im Code mit einem Regression-Pin-Test
#     festgenagelt, der das KAPUTTE Ist-Verhalten assertiert. Diese Tests werden beim Fix
#     UMGEDREHT, nicht geloescht.
#
#   BLOCK B (11 Units) — Muster-Scans. Die zehn Bugs aus Block A teilen vier mechanisch
#     auffindbare Muster. Jede Scan-Unit sucht ihr Muster repo-weit ab und LEGT JEDEN FUND
#     ALS NEUE FIX-UNIT AM BACKLOG-ENDE AN (`neue-units:` ist Pflichtzeile). Eine Scan-Unit
#     ohne Funde ist ein gueltiges Ergebnis — aber nur mit Beleg, WAS geprueft wurde.
#     Scan-Units aendern selbst KEIN Verhalten ausser dem Anlegen von Units.
#
#   BLOCK C — entsteht zur Laufzeit aus den Funden von Block B und fuellt den Rest des
#     Fensters. Nicht vorab schreiben.
#
# ------------------------------------------------------------------------------------------
# HARTE REGELN FUER DIESEN LAUF
#
#   1. Pin-Tests UMDREHEN, nicht loeschen. Jeder Test, der heute das kaputte Verhalten
#      assertiert, muss nach dem Fix das KORREKTE Verhalten assertieren. Ein geloeschter
#      Pin-Test ist eine verlorene Regression.
#   2. Root Cause, nicht Symptom. Vor jedem Fix alle Caller der angefassten Funktion greppen.
#      Sitzt derselbe Bug in einer Schwesterfunktion, gehoert er in dieselbe Unit.
#   3. Mutations-Probe ist Pflicht: eine Zeile der Fix-Logik brechen, pruefen dass ein Test
#      rot wird, zurueckdrehen, Diff sauber. Ohne Probe ist der Test nicht bewiesen.
#   4. `go test` ohne `DATABASE_URL` ist KEIN Gate. Die Rolle muss `kmuhub_app` sein —
#      `kmuhub` hat BYPASSRLS und wuerde jede RLS-Luecke durchwinken.
#   5. Scan-Units: ein Fund ohne angelegte Unit ist kein Fund. `neue-units:` im Journal muss
#      die IDs nennen, die wirklich in dieser Datei stehen.
#
# GESPERRT IN DIESEM LAUF (nicht anfassen, auch nicht "nur schnell"):
#   - Frontend/Desktop jeder Art. Der Loop hat kein Playwright-Gate.
#   - CSAT und die uebrigen Public-Token-Routen — stillgelegt, siehe BACKLOG-PARKED.yml
#     (Projekt "Public Web Surface"). Die neue Reset-Seite ist die EINE Ausnahme und ist
#     bereits gebaut.
#   - Coverage-Units jeder Art.
#   - Electron-Upgrade / Dependency-Bumps.
#   - `deploy/` und Migrations-Umnummerierungen.
# ==========================================================================================

units:

# ==========================================================================================
# BLOCK A — verifizierte Produktionsbugs aus Lauf 8, nach Schwere sortiert.
# Reihenfolge ist Absicht: Compliance-Flaechen und Totalausfaelle zuerst.
# ==========================================================================================

  - id: fix-audit-list-verifychain-ip-address-scan
    phase: 3
    service: security
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/security/audit 66,1 % (CI-Stand 8c224eba, Run 31471247645)"
    scope: >
      `audit.PostgresRepository.List` (backend/internal/security/audit/postgres_repository.go,
      SELECT um Zeile 170) und `.VerifyChain` (SELECT um Zeile 224) selektieren die Spalte
      `ip_address` roh und scannen sie in `models.AuditEntry.IPAddress` (Typ `string`, kein
      Pointer). `ip_address` ist eine nullable INET-Spalte; pgx v5 kann weder ein NULL-INET
      noch ein gesetztes INET in einen Go-`string` scannen. Damit schlaegt JEDER Aufruf von
      `List()` oder `VerifyChain()` fehl, der mindestens eine Zeile liefert -- unabhaengig
      davon, ob die Zeile eine echte IP traegt oder nicht.
    sources:
      - backend/internal/security/audit/postgres_repository.go
      - backend/internal/security/audit/service.go
      - backend/internal/auth/postgres_repository.go
      - backend/internal/security/audit/postgres_repository_test.go
    notes: >
      Gefunden UND gegen die lokale Postgres reproduziert beim Bau der Coverage-Unit
      c-cov-gdpr-dsar-search (Lauf 8, Iteration 40): "cannot scan NULL into *string" bzw.
      "cannot scan inet (OID 869) in binary format into *string".
      WIRKUNG: der Audit-Log-Viewer, der CSV/JSON-Export (`Service.ExportEntries`,
      service.go:125, ruft intern `repo.List`) und die `VerifyAuditChain`-RPC sind damit fuer
      JEDEN Tenant mit realer Aktivitaet funktionsunfaehig. Das ist eine Compliance-Flaeche.
      Der Fix ist eine Ein-Zeilen-Aenderung pro Query (SELECT-Spalte casten). DREI Stellen im
      selben Repo loesen exakt dasselbe Problem bereits korrekt und sind die Vorlage:
      `internal/auth/postgres_repository.go` (Zeilen 1574/1586/1614) mit
      `COALESCE(host(ip_address), '')`, `internal/crm/consent/postgres_repository.go` und
      `internal/formulare/postgres_repository.go` mit `ip_address::text`.
      Der Pin-Test `TestPostgresRepository_List_IPAddressScanBug`
      (postgres_repository_test.go:102) erwartet den Scan-Fehler AKTUELL explizit und
      dokumentiert im Kommentar, dass er beim Fixen ersetzt wird -- umstellen, nicht loeschen.
      Iteration 40 musste die eigentlich geplante Filter-/Pagination-/Chain-Abdeckung wegen
      dieses Bugs weglassen; sie gehoert mit in diese Unit, sobald der Scan funktioniert.
    done_when:
      - List und VerifyChain casten ip_address in der SELECT-Liste nach dem Muster der drei
        bestehenden korrekten Stellen (COALESCE(host(...), '') oder ::text)
      - TestPostgresRepository_List_IPAddressScanBug ist auf das KORREKTE Verhalten umgestellt
        statt geloescht, inkl. der beiden Faelle NULL-IP und gesetzte IP
      - Die in Iteration 40 zurueckgestellten Assertions (Filter, Pagination, Chain-Verifikation)
        sind nachgezogen
      - go test -count=1 ./internal/security/... gruen, DATABASE_URL gegen kmuhub_app gesetzt

  - id: fix-datev-upload-repo-missing-tenant-id
