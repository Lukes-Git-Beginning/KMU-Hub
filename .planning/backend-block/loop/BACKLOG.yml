      `invitations` traegt `first_name`/`last_name`/`email` der eingeladenen Person direkt als
      Spalten (nicht per FK) — auch nach Annahme der Einladung bleibt die Zeile bestehen und wird
      von `matchUsers`/`matchContacts` nicht mitgelesen. Wird die eingeladene Person spaeter als
      Benutzer gematcht, fehlt ihre Einladungshistorie (wer hat sie wann mit welcher Rolle
      eingeladen, angenommen wann) in der Auskunft. Fuer eine NIE angenommene Einladung ist die
      Person aktuell ueberhaupt nicht auffindbar — das ist der kleinere, aber echte Nebenbefund
      dieser Unit und gehoert im Journal benannt, auch wenn er nicht im selben Umfang geloest
      werden kann wie der Haupt-Fund.
    sources:
      - backend/internal/security/gdpr/dsar_search.go
      - backend/internal/auth (Invitations-Repository suchen, Name pruefen statt raten)
    notes: >
      Zwei Faelle trennen: (1) die eingeladene Person ist inzwischen ein `users`-Eintrag —
      dafuer per E-Mail-Abgleich (Vorlage: `formSubmissionsModule`, matched ueber `contactEmail`)
      ein Modul "Einladungshistorie" an den gematchten Benutzer haengen. (2) die Einladung wurde
      nie angenommen (`accepted_at IS NULL`) — hier existiert noch kein Benutzer- oder
      Kontakt-Datensatz, den `SearchByQuery` matchen koennte. Fall 2 NICHT in dieser Unit loesen
      (das waere eine dritte Subjekt-Matching-Quelle neben Kontakten und Benutzern, ein
      groesserer Eingriff) — stattdessen im Journal als eigener, ungeloester Befund benennen.
      `token_hash` gehoert NICHT in die Auskunft (Zugangsgeheimnis, kein Personendatum).
    done_when:
      - Modul "Einladungshistorie" haengt an einem gematchten Benutzer, der ueber eine
        angenommene Einladung ins System kam
      - token_hash erscheint nicht im Export, per Test belegt
      - Der ungeloeste Fall "nie angenommene Einladung" ist im Journal dieser Unit als offener
        Befund benannt (nicht als neue Unit — das ist eine Architekturfrage fuer Luke)
      - DB-Test inkl. Tenant-Isolation
      - go test -count=1 ./internal/security/gdpr/... gruen, DATABASE_URL gesetzt

# ==========================================================================================
# FUNDE AUS scan-erasure-handlers-missing-personal-data-tables (Iteration 41, 2026-08-22).
# Grundgesamtheit: alle 139 FKs auf users(id) aus pg_constraint (lokale DB, 2026-08-22).
# Zentraler Befund vorweg, gilt fuer ALLE sieben Units unten: `AuthErasureHandler.ExecuteErasure`
# fuehrt NIEMALS ein `DELETE FROM users` aus (grep ueber internal/ bestaetigt: kein Treffer,
# 2026-08-22) — die users-Zeile wird nur anonymisiert (UPDATE), nie geloescht. Damit feuert JEDE
# CASCADE-FK (`ON DELETE CASCADE`) auf users(id) NIE als Aufraeummechanismus. Tabellen mit
# `delete_rule = 'c'`, die von keinem der sieben Handler bedient werden, behalten ihre
# Personendaten also fuer immer — nicht "bis zum naechsten Cascade", sondern dauerhaft.
# ==========================================================================================

  - id: fix-work-erasure-time-entries-retention-conflict
    phase: 4
    service: security
    model: sonnet
    deps: []
    status: todo
    coverage_start: "internal/security/gdpr (zur Laufzeit messen)"
    scope: >
      `WorkErasureHandler.ExecuteErasure` (erasure.go:393-399) loescht `time_entries` per
      hartem `DELETE FROM time_entries WHERE user_id = $1`, mit dem Codekommentar "personal
      data, no business retention need". Das widerspricht der eigenen Feststellung aus
      Iteration 40 (Unit `feat-dsar-search-user-work-module`, Journal-Eintrag vom 2026-08-22):
      Zeiteintraege sind arbeitsrechtlich relevant und koennen einer Aufbewahrungspflicht
      unterliegen (ArbZG-nahe Fristen). Ein unbedingtes, sofortiges DELETE vor jeder
      Fristpruefung ist eine irreversible Compliance-Luecke — genau die Ueberreichweite, nach
      der dieser Scan laut seinen eigenen `notes` explizit sucht ("fasst ein Handler eine
      Tabelle an, die er gar nicht anfassen duerfte").
    sources:
      - backend/internal/security/gdpr/erasure.go
      - backend/internal/work/timeentry/postgres_repository.go
      - backend/internal/models (Aufbewahrungsfrist-Konstanten suchen, falls vorhanden)
    notes: >
      Nicht blind auf "nie loeschen" umstellen — pruefen, ob eine Aufbewahrungsfrist im Code
      oder in einer Migration bereits definiert ist (z. B. im Zusammenhang mit
      `retention_policies` aus A10/A11-A13, falls diese Units zum Zeitpunkt der Bearbeitung
      bereits existieren). Ist keine Frist vorhanden, ist der sicherste Fix: nur Zeiteintraege
      aelter als eine konservative Mindestfrist hart loeschen, juengere anonymisieren (Bezug
      zum Nutzer entfernen, Dauer/Projekt behalten) statt sie sofort zu vernichten.
      Diese Unit AENDERT Verhalten (kein Scan) — Mutations-Probe ist Pflicht.
    done_when:
      - Die Frist-Herkunft ist im Code kommentiert und im Journal begruendet (woher die Zahl
        stammt, nicht geraten)
      - Zeiteintraege innerhalb der Frist werden nicht mehr hart geloescht
      - Ein Test belegt den neuen Pfad UND den Altfall (Eintrag jenseits der Frist wird weiterhin
        entfernt)
      - go test -count=1 ./internal/security/gdpr/... ./internal/work/... gruen, DATABASE_URL gesetzt

