  - id: scan-409-conflict-error-mapping
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: done
    decided: 2026-08-24
    decision: >-
      BEFUND aus dem 409-Skriptlauf vom 2026-08-24, nicht aus einem Scan. Beim Umstellen der
      Doku-Kette auf `hooks/openapi-status-fill.py` ist eine Luecke aufgefallen, die alle
      zwoelf bereits gemergten Iterationen dieser Arbeit teilen - sie wird hier zum ersten
      Mal festgehalten statt weiter mitgeschleppt.
      NEUZUSCHNITT 2026-08-26 (Vorbereitung Lauf 13): Iteration 12 von Lauf 12 hat am Code
      belegt, dass die urspruengliche Buendel-Unit falsch geschnitten war - die 58
      `codes.AlreadyExists`-Fundstellen liegen NICHT 1:1 in RPC-Handlern, sondern in 38
      GETEILTEN Error-Mapper-Funktionen (`mapCalendarError` 41x in `calendar_grpc.go`,
      `mapCRMError` 60x in `crm_grpc.go`, `mapBizError` 57x in `biz_grpc.go`). Der Weg
      "von der Fundstelle ueber die RPC zum Handler" setzt ein 1:1-Verhaeltnis voraus, das
      es nicht gibt, und sprengt eine Iteration. Die Unit ist deshalb - der eigenen
      Empfehlung dieser Iteration folgend - in eine SCAN-Unit umgewandelt: sie
      inventarisiert die Mapper und legt jeden echten Doppeldeutigkeits-Fall als eigene
      Fix-Unit an, statt Recherche und Spec-Fix zu buendeln.
    coverage_start: "n.a. (Scan-Unit, kein Coverage-Ziel)"
    scope: >
      `grpcStatusToHTTP` (`internal/gateway/helpers.go:51`) bildet `codes.AlreadyExists` auf
      `409 Conflict` ab. Der Drift-Test kann das nicht sehen: `respondGRPCError` steht in
      `dynamicStatusFuncs` (`openapi_status_code_drift_test.go:206-209`), der AST-Walk stoppt
      dort bewusst, weil der Code laufzeitabhaengig ist. Folge: der 409-Skriptlauf hat auf
      diesen Routen `409 -> IdempotencyInFlight` dokumentiert. Das ist WAHR (die Middleware
      kann den Code liefern), aber UNVOLLSTAENDIG - dieselbe Route kann auch einen fachlichen
      Conflict liefern, und in OpenAPI gibt es je Operation nur EIN Response-Objekt pro
      Status-Code.
      ARBEITSWEISE DIESER SCAN-UNIT - inventarisieren, nicht fixen. Einstieg ist die
      MAPPER-EBENE, nicht die Fundstelle:
      (1) Die Error-Mapper-Funktionen in `internal/server/` ermitteln, die `codes.AlreadyExists`
      zurueckgeben (`grep -rn "codes.AlreadyExists" backend/internal/server --include=*.go |
      grep -v _test`, dann je Treffer die umschliessende Funktion bestimmen). Erwartet werden
      rund 38 Funktionen - die Zahl selbst nachmessen und im Journal nennen.
      (2) Je Mapper festhalten, WELCHE Bedeutung 409 dort traegt: "Dublette" (eine Ressource
      mit diesem Schluessel existiert bereits) oder "Zustandskonflikt" (die Operation passt
      nicht zum aktuellen Zustand). Der Sentinel-Error-Name ist dafuer meist aussagekraeftig
      genug (`ErrMemberAlreadyExists` = Dublette, `ErrBookingConflict` = Zustandskonflikt) -
      wo er es nicht ist, die Fundstelle im Service lesen.
      (3) NUR wo ein Mapper BEIDE Bedeutungen tragen kann UND von mindestens einer Route
      erreichbar ist, die auch die Idempotency-Middleware passiert, entsteht ein echter
      Doppeldeutigkeits-Fall. Jeder solche Fall wird als EIGENE Fix-Unit ans Ende von
      `BACKLOG.yml` gehaengt (`scope`/`sources`/`notes`/`done_when`, `status: todo`), mit dem
      Mapper-Namen im Titel und der Liste der betroffenen Operationen im `scope`.
      (4) Diese Unit aendert selbst KEINE `openapi.yaml` und KEINEN Produktionscode. Der
      Vorschlag fuer die Fix-Units - eine neue Komponente unter `components/responses`, deren
      `description` beide Ursachen benennt und die wie `IdempotencyInFlight` und `Conflict`
      auf `ErrorResponse` zeigt - gehoert in die `notes` der angelegten Fix-Units, nicht in
      diese hier. Ebenso der Hinweis, dass `hooks/openapi-status-fill.py` die Sonderfaelle
      kennen muss (Ausschluss- bzw. Sonderliste neben der bestehenden `lean:`-Liste), damit
      ein spaeterer Skriptlauf sie nicht wieder ueberschreibt.
      Eine Scan-Unit ohne Funde ist ein gueltiges Ergebnis - aber nur mit Beleg, WAS geprueft
      wurde: die Mapper-Liste gehoert dann vollstaendig ins Journal.
    sources:
      - backend/internal/gateway/helpers.go
      - backend/internal/gateway/openapi_status_code_drift_test.go
      - backend/internal/server/
      - backend/api/openapi.yaml
      - .planning/backend-block/loop/hooks/openapi-status-fill.py
    notes: >
      NICHT die 503 Eintraege aus dem Skriptlauf zurueckdrehen - der
      IdempotencyInFlight-Fall gilt auf jeder dieser Routen weiterhin. Es geht nur um die
      Teilmenge, die ZUSAETZLICH einen fachlichen Conflict kennt.
      Vorgeschichte: Diese Unit stand seit der Lauf-12-Vorbereitung als `blocked` in
      BACKLOG.yml und hat dort ab Iteration 12 in JEDEM Vorflug-Lauf den
      `backlog-check.py --preflight` rot gemeldet, ohne dass jemand sie wegzog. Der
      Neuzuschnitt ist die Lehre daraus: eine Unit, die zweimal an derselben Stelle
      abbricht, ist falsch geschnitten und nicht zu klein bearbeitet.
    done_when:
      - >-
        Die Liste der Error-Mapper-Funktionen mit `codes.AlreadyExists` ist vollstaendig im
        Journal belegt (gemessene Zahl, nicht geschaetzt), je Mapper mit der Bedeutung, die
        409 dort traegt
      - >-
        Jeder Mapper, der beide Bedeutungen tragen kann, ist als eigene Fix-Unit am Ende von
        BACKLOG.yml angelegt und ihre ID steht in der `neue-units:`-Zeile des Journals
      - >-
        Kein Fund ist ein gueltiges Ergebnis, aber nur mit der vollstaendigen Mapper-Liste
        als Beleg
      - Weder openapi.yaml noch Produktionscode sind in dieser Unit veraendert
      - go test -count=1 ./internal/gateway/ gruen

