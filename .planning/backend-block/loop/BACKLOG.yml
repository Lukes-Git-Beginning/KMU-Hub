    scope: >
      Der Motor aus A10 braucht einen Ausloeser und eine Sicht. Ohne Scheduling laeuft er nie,
      ohne Sichtbarkeit weiss niemand, ob er lief, was er tat und was er uebersprang. Beides
      zusammen ist der Unterschied zwischen einer Loeschmechanik und einem Skript, das
      irgendwo liegt.
    sources:
      - backend/internal/gateway/route_security.go
      - backend/internal/server/security_grpc.go
      - backend/api/openapi.yaml
      - backend/cmd/gateway/main.go
    notes: >
      Fuer das Scheduling zuerst pruefen, was es schon gibt: die Datenbank hat `pg_cron`
      (Compose-Kommando `shared_preload_libraries=pg_cron`, `cron.database_name=kmuhub`), und
      im Go-Code laufen bereits periodische Aufgaben — etwa das Idempotency-Cleanup mit
      Advisory Lock. Eine dieser beiden Mechaniken uebernehmen. Kein dritter Scheduler.
      Bei mehreren Gateway-Instanzen darf der Lauf nicht mehrfach starten. `CleanupWithLock`
      (`internal/idempotency/postgres_repository.go:188`) ist die vorhandene Antwort auf genau
      diese Frage und die Vorlage.
      Sichtbarkeit heisst: letzter Lauf, Ergebnis je Policy, uebersprungene Datensaetze mit
      Grund. Eine Zahl ohne Gruende beantwortet die einzige Frage nicht, die im Ernstfall
      gestellt wird.
      Route in `openapi.yaml` eintragen, sonst ist `TestOpenAPIRouteDrift` rot.
    done_when:
      - Der Lauf wird periodisch ausgeloest, ueber pg_cron oder die vorhandene Go-Mechanik,
        mit Sperre gegen Mehrfachstart
      - Admin-Route liefert letzten Lauf, Ergebnis je Policy und uebersprungene Datensaetze mit
        Grund; in openapi.yaml dokumentiert und unter der bestehenden Security-Berechtigung
      - Ein Test belegt, dass zwei gleichzeitige Laeufe nicht doppelt arbeiten
      - go test -count=1 ./internal/gateway/ ./internal/security/... gruen, DATABASE_URL gesetzt

