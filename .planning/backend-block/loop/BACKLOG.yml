    coverage_start: n.a.
    scope: >
      REVIEW-UNIT (Regel 3 dieses Laufs). Prüft die Commits seit dem End-SHA der vorigen `review-run17-*`-Iteration
      (Journal; für r1 seit dem Staging-Commit). Für jeden Commit, der einen Grant, Guard, Scope, eine Seed-Migration
      oder eine Sichtbarkeitsgrenze ändert: (1) Token per ECHTEM Login gegen den Seed holen, nie von Hand
      gebaut, entweder über den lokalen E2E-Stack (`bash .planning/backend-block/loop/hooks/e2e-local.sh
      <Regex>`, Testfall unter `backend/test/e2e/`) oder per DB-Test über `ResolveTokenPermissions`/`GetUserGrants`.
      (2) Prüfen, dass der Scope im Token ankommt (dreiteilige `resource`-Keys, Lehre hr:self aus Lauf 16),
      dass ein zweiter member im selben Tenant keine fremden Daten liest oder schreibt und ein manager nur
      seine Berichtslinie sieht. (3) Seed-Migrationen: Up zweimal fehlerfrei, Down entfernt genau die eigenen
      Zeilen. Prüfbereich etwa: Abschluss: alle Rechte-Commits seit r5 und Stichprobe über den ganzen Lauf.
    sources:
      - backend/internal/auth/
      - backend/test/e2e/helpers_test.go
      - .planning/backend-block/loop/hooks/e2e-local.sh
    done_when:
