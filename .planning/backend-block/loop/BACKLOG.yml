  - id: fix-schichten-swap-assignments-unique-violation
    phase: 3
    service: schichten
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/schichten 79,7 % (CI-Stand 8c224eba, Run 31471247645)"
    scope: >
      `PostgresRepository.SwapAssignmentsForRequest` (internal/schichten/postgres_repository.go:625)
      fuehrt zwei sequenzielle UPDATEs in EINER Transaktion aus, um die employee_id zweier
      shift_assignments-Zeilen zu tauschen. Beide sind falsch verdrahtet und decken zusammen
      JEDEN realen Aufruf ab -- verifiziert per echtem SQL gegen die lokale DB (Kopf 309):

      (1) Sind BEIDE Mitarbeiter (Antragsteller und Tauschpartner) bereits derselben Schicht
      zugeordnet -- der Normalfall eines Schichttauschs zwischen zwei Kollegen -- verletzt das
      erste UPDATE sofort den UNIQUE(tenant_id, shift_id, employee_id)-Index
      `uq_shift_assignments_tenant` (migrations/000102_schichten_shift_assignments_tenant_
      unique.up.sql), weil es die Zeile des Antragstellers auf employee_id=Partner setzt, waehrend
      die Zeile des Partners noch denselben Wert traegt. Die Transaktion bricht mit
      `ERROR: duplicate key value violates unique constraint "uq_shift_assignments_tenant"` ab,
      `ApproveSwapRequest` (service.go:679) gibt den Fehler nach oben durch -- der Tausch
      schlaegt jedes Mal fehl.

      (2) Ist der Tauschpartner NOCH NICHT dieser Schicht zugeordnet, laeuft das erste UPDATE
      durch und setzt die Zeile des Antragstellers auf employee_id=Partner. Das ZWEITE UPDATE
      ist aber nicht auf eine andere Zeilen-ID gescoped, sondern nur auf
      `WHERE shift_id = $2 AND employee_id = $3 (=Partner) AND tenant_id = $4` -- und trifft damit
      dieselbe, gerade erst geaenderte Zeile innerhalb derselben Transaktion (Postgres sieht
      eigene, noch nicht committete Schreibvorgaenge). Es dreht sie sofort wieder auf
      employee_id=Antragsteller zurueck. Netto-Ergebnis: KEINE Datenaenderung, KEIN Fehler --
      `ApproveSwapRequest` markiert den Antrag trotzdem als `approved`, obwohl am
      Schicht-Assignment nichts passiert ist.

      Beide Faelle decken zusammen 100% der moeglichen Aufrufe ab (Partner entweder schon
      zugeordnet oder nicht) -- die Funktion hat KEINEN funktionierenden Pfad. Jeder
      Schichttausch in Produktion schlaegt entweder sichtbar fehl oder tut unsichtbar nichts.
    sources:
      - backend/internal/schichten/postgres_repository.go
      - backend/internal/schichten/service.go
      - backend/migrations/000094_create_schichten.up.sql
      - backend/migrations/000102_schichten_shift_assignments_tenant_unique.up.sql
      - backend/internal/schichten/postgres_repository_test.go
    notes: >
      Gefunden beim Bau der Coverage-Unit f-cov-schichten-repository (Lauf 8, Iteration 91),
      durch zwei DB-gestuetzte Tests dokumentiert:
      `TestSwapAssignmentsForRequest_FailsWhenBothEmployeesAlreadyAssignedToShift` (Fall 1, erwartet
      aktuell einen Unique-Violation-Fehler) und
      `TestSwapAssignmentsForRequest_SilentlyNoOpsWhenTargetNotYetOnShift` (Fall 2, erwartet aktuell
      keine Aenderung). Beide Tests sind bewusst auf das HEUTIGE, kaputte Verhalten geschrieben --
      der Kommentar in jedem Test sagt explizit, dass er nach dem Fix umgeschrieben werden muss,
      nicht geloescht.
      Sauberster Fix: beide UPDATEs auf die Zeilen-ID statt auf (shift_id, employee_id) scopen.
      Die zweite UPDATE braucht dazu die ID der komplementaeren Zeile -- die ist heute nicht Teil
      von `SwapRequest`, muss also entweder vor dem Swap per
      `GetAssignment(ctx, tenantID, req.ShiftID, req.SwapWithEmployeeID)` aufgeloest werden (0
      Treffer -> Fall 2 wird zu einer reinen Verschiebung ohne Ruecktausch, was dann auch so
      benannt/dokumentiert werden sollte statt weiter "Swap" zu heissen) oder die Tabelle bekommt
      eine temporaere Zwischenzuweisung (z. B. ein Dritt-Wert wie NULL/Tombstone), damit die beiden
      UPDATEs sich nicht gegenseitig treffen koennen. ENTSCHIEDEN (Luke, 2026-08-11, vor dem Lauf): Ein Tausch ist NUR
      zwischen zwei bereits der Schicht zugeordneten Mitarbeitern gueltig. Damit ist Fall 1 der
      einzige zu reparierende Pfad -- beide UPDATEs auf die Zeilen-ID scopen, die ID der
      komplementaeren Zeile vorher per GetAssignment aufloesen. Fall 2 ist KEIN gueltiger
      Zustand mehr: CreateSwapRequest bzw. ApproveSwapRequest muessen einen Validierungsfehler
      liefern statt eines stillen No-Op mit approved. Diese Frage ist damit beantwortet und
      blockiert die Unit nicht -- nicht erneut aufmachen.
    done_when:
      - Ein Schichttausch zwischen zwei bereits zugeordneten Mitarbeitern tauscht tatsaechlich
        beide employee_id-Werte, ohne die UNIQUE-Constraint zu verletzen
      - Ein Tausch mit noch nicht zugeordnetem Partner wird abgelehnt -- CreateSwapRequest bzw.
        ApproveSwapRequest liefern einen Validierungsfehler, kein stiller No-Op mit approved
        (die Semantik-Frage ist vorab entschieden, siehe notes)
      - Beide oben genannten Tests sind auf das korrekte Verhalten umgestellt statt geloescht
      - go test -count=1 ./internal/schichten/ gruen

  - id: fix-notification-quiet-hours-conflict-index
    phase: 3
    service: notification
    model: opus
    deps: []
    status: done
    coverage_start: "internal/notification/preference 87,2 % (CI-Stand 8c224eba, Run 31471247645)"
    scope: >
      `PostgresRepository.UpsertQuietHours`
      (backend/internal/notification/preference/postgres_repository.go, ON CONFLICT um Zeile
      213) zielt auf `ON CONFLICT (tenant_id, user_id)`, aber `notification_quiet_hours` traegt
      seit Migration 000022 nur ein inline `UNIQUE(user_id)` (Constraint
      `notification_quiet_hours_user_id_key`). Migration 000124 hat `tenant_id` ueberall NOT
      NULL gemacht, diesen Constraint aber nie verbreitert -- verifiziert gegen die lokale DB
      (Kopf 309) und gegen alle Migrationen, die die Tabelle anfassen (000022, 000110, 000124).
      Postgres validiert den ON-CONFLICT-Zielindex beim PLANEN der Query, nicht erst bei einem
      tatsaechlichen Konflikt: deshalb schlaegt JEDER Aufruf fehl, nicht nur der zweite, mit
      SQLSTATE 42P10. Quiet Hours lassen sich ueber dieses Repository derzeit ueberhaupt nicht
      anlegen.
    sources:
      - backend/internal/notification/preference/postgres_repository.go
      - backend/migrations/000305_notification_preferences_conflict_index_tenant_fix.up.sql
      - backend/migrations/000022_create_notification_preferences.up.sql
    notes: >
      EXAKT dieselbe Bugklasse wurde fuer `notification_preferences` schon EINMAL gefixt:
      Migration 000305 verbreitert dort den analogen Event-Type-Index von
      `(user_id, event_type_key)` auf `(tenant_id, user_id, event_type_key)` mit derselben
      Begruendung im Kommentar. `notification_quiet_hours` wurde dabei uebersehen -- 000305 ist
      damit Vorlage UND Beleg, dass der Fix so funktioniert.
      Fertiger Migrationskoerper (neue Nummer zur Laufzeit ermitteln, NICHT 310 annehmen):
      `DROP INDEX notification_quiet_hours_user_id_key;`
      `CREATE UNIQUE INDEX notification_quiet_hours_user_id_tenant_id_key
       ON notification_quiet_hours(tenant_id, user_id);`
      Der neue Index ist ein Superset des alten und kann mit keiner bestehenden Zeile
      kollidieren. `postgres_repository.go` braucht voraussichtlich keine Aenderung (ON CONFLICT
      nennt nur Spalten, keinen Constraint-Namen) -- pruefen, nicht annehmen.
      ZWEITER, NICHT VERIFIZIERTER VERDACHT am selben Code, in dieser Unit mitpruefen:
      `UpsertPreference` (Zeile 99) zielt auf
      `ON CONFLICT (tenant_id, user_id, event_type_key) WHERE event_type_key IS NOT NULL`.
      Fuer Modul-Defaults mit `event_type_key IS NULL` kann dieser partielle Index gar nicht
      als Arbiter greifen -- ein zweiter Upsert desselben Modul-Defaults wuerde dann eine
      Dublette schreiben statt zu aktualisieren. Erst reproduzieren, dann entscheiden.
      Migration + RLS => `model: opus`, und die neue Tabelle/der neue Index braucht den
      RLS-Smoke aus GATE-COMMANDS.md.
    done_when:
      - Neue Migration verbreitert den Unique-Index auf (tenant_id, user_id), down-Migration
        stellt den alten Zustand her
      - Ein DB-gestuetzter Test beweist, dass UpsertQuietHours zweimal hintereinander fuer
        denselben (tenant_id, user_id) durchlaeuft und beim zweiten Mal aktualisiert statt
        einzufuegen
      - Ein zweiter Test beweist, dass zwei Tenants dieselbe user_id unabhaengig konfigurieren
        koennen (der eigentliche Grund fuer die Verbreiterung)
      - Der UpsertPreference-Verdacht (event_type_key IS NULL) ist reproduziert und entweder
        gefixt oder mit Begruendung als Nicht-Bug im Journal abgeraeumt
      - rls-smoke gruen, go test -count=1 ./internal/notification/... gruen

  - id: fix-document-virtual-users-display-name
    phase: 3
    service: document
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/document/virtual 83,1 % (CI-Stand 8c224eba, Run 31471247645)"
    scope: >
      `internal/document/virtual/postgres_repository.go` selektiert an vier Stellen
      `COALESCE(u.display_name, u.email) AS uploaded_by_name` gegen die `users`-Tabelle, aliasiert
      als `u` (ListChatFiles Zeile ~61, ListTaskFiles Zeile ~142, sowie beide entsprechenden
      Zweige der UNION-Query in ListAll, Zeilen ~221 und ~248). `users` hat aber kein
      `display_name`-Feld -- nur `first_name`/`last_name` seit Migration 000001. Jede dieser vier
      Query-Varianten schlaegt daher mit `ERROR: column u.display_name does not exist`
      (SQLSTATE 42703) fehl, sobald mindestens eine zugreifbare Zeile existiert -- verifiziert
      per `psql` direkt gegen die lokale DB (Kopf 309) und per vier neuen roten/dokumentierenden
      Tests. Nur `ListEmailAttachments` funktioniert, weil sie stattdessen
      `eacc.display_name` (email_accounts, hat die Spalte wirklich) liest.
      Besonders schwerwiegend: die kombinierte `ListAll`-Sicht (sourceType `""`, die "Alle
      Dateien"-Ansicht im Dokumenten-Browser) bricht fuer JEDEN Nutzer mit mindestens einer
