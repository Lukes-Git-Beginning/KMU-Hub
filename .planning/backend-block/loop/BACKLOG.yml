      Erste von vier EN-16931-Regelfamilien. `validation.go` prüft heute Anwesenheit von
      Feldern, aber nie deren zulässige WERTE. Ein Empfänger-Validator lehnt eine Rechnung mit
      Währung "EURO" statt "EUR", Land "Deutschland" statt "DE" oder Einheit "Stück" statt
      "H87" ab — der Fehler fällt erst in der Buchhaltung des Kunden auf, Wochen später.
      Zu prüfen: Währung gegen ISO 4217, Länder gegen ISO 3166-1 alpha-2, Mengeneinheiten gegen
      UN/ECE Recommendation 20, Belegart 380 (Rechnung) und 381 (Gutschrift), Zahlungsmittel
      gegen UNCL4461, USt-Kategorie gegen UNCL5305.
