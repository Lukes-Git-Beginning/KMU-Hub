      (`internal/biz/hr/timetracking/service_test.go`).
      `Service.ApproveTimeCorrection` (`internal/biz/hr/timetracking/service.go:441`) prueft
      Status (`WorkTimeStatusCorrectionPending`) und Wochensperre, vergleicht aber
