      - Unit-Test auf den Listen-Pfad
      - go build/vet/lint/test gruen

  - id: p3-finance-recurring
    phase: 3
    service: finance
    model: opus
    deps: [p3-finance-list-amounts]
    status: done
    scope: >
      Wiederkehrende Rechnungen: Definition, Zeitplan, Erzeugung.
    sources:
      - .planning/backend-gaps.md
      - backend/internal/biz/
    notes: >
      Idempotenz ist hier Pflicht, keine Kuer — eine doppelt erzeugte Rechnung
      ist ein echter Geschaeftsvorfall. Idempotency-Key-Muster aus dem Repo
      wiederverwenden (Dialer-Outcomes, Finance-Postings).
      ERLEDIGT Iteration 14 (Migration 000246). Serverseitig existierte gar
      nichts — das FE (RecurringInvoicesTab/-DetailPanel/-Dialog,
      financeRecurringApi) lief komplett gegen MSW. Entscheidungen:
      (a) Idempotenz ueber eine Ledger-Tabelle `finance_recurring_runs` mit
      UNIQUE (tenant_id, recurring_id, period_date) statt eines
      Idempotency-Key-Headers: der Schluessel ist hier fachlich die Periode,
      nicht der Request — auch ein Scheduler-Lauf ohne Client-Header darf nicht
      doppelt fakturieren. Ein Replay liefert die bereits erzeugte Rechnung
      zurueck statt einer zweiten. (b) `next_run` wird immer aus
      start_date + n Perioden berechnet (Anker), nie schrittweise
      fortgeschrieben — sonst rutscht ein Monatsabo vom 31. dauerhaft auf den
      28. (c) invoice_date der erzeugten Rechnung ist die Periode, nicht heute:
