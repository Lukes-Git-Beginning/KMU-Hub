      - backend/internal/biz/einvoice/generator_doc.go
      - backend/internal/biz/einvoice/generator_cii.go
      - backend/internal/biz/einvoice/generator_ubl.go
    notes: >
      KEINE vollständigen Codelisten einbauen. ISO 3166 hat 249 Einträge, UN/ECE Rec 20 über
      1.500 — davon nutzt dieses Produkt eine Handvoll. Die schlanke Lösung ist eine Whitelist
      der tatsächlich erzeugbaren Werte plus die Regel, dass alles andere abgelehnt wird, mit
      `lean:`-Marker und Upgrade-Trigger ("vollständige Liste, wenn ein Kunde außerhalb
      DE/AT/CH fakturiert").
      Erst greppen, was der Code überhaupt erzeugen KANN: `isoCountryCode`
      (`generator_doc.go:363`) bildet bereits ab, die Mengeneinheit kommt aus dem Line-Item.
      Wo der Generator schon normalisiert, ist eine Prüfung überflüssig — das gehört in die
      Notes des Journals, nicht in Code.
