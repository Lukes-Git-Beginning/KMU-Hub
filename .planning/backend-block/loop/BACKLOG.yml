# ==========================================================================================
# BLOCK A — die zehn entschiedenen Units. Reihenfolge ist Absicht und steuert die Modellkosten:
# A1 ist billig und sonnet (Warmlauf, belegt dass DB-Gate und Mutations-Probe laufen), A2 ist
# der einzige echte Produktionsfehler des Blocks und deshalb früh, A3 hängt an A2, dann die
# beiden schweren opus (Migration, Proto-Regen), dann der Rest.
# ==========================================================================================

  - id: fix-hr-manual-entry-idempotency-key-not-enforced
    phase: 4
    service: hr
    model: sonnet
    deps: []
    status: done
    decided: 2026-08-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-08-24: Regressionstest, dann schliessen. Die Vorabpruefung am
      Code hat die Praemisse dieser Unit WIDERLEGT - es gibt keine doppelten
      Arbeitszeiteintraege. `POST /api/v1/hr/time/entries` wird in `route_hr.go:110` innerhalb
      von `r.Route("/api/v1/hr/time", ...)` mit `r.Use(authMiddleware)` registriert, und der
      Registrar bekommt aus `cmd/gateway/main.go:329` `authWithIdempotency` (dort Zeile 205:
      `authMiddleware(idempotencyMW(next))`). Die Route laeuft also sehr wohl durch
      `middleware.Idempotency` - die alte notes-Annahme "aktuell laeuft sie NICHT darueber
      (Grep bestaetigt)" war ein zu enger Grep auf `route_hr.go` statt auf die
      Registrar-Kette. Die Middleware dedupliziert bei VORHANDENEM Key unabhaengig vom Modus
      (`middleware/idempotency.go:78-152`): WarnMode und HardMode entscheiden nur ueber den
      Fall FEHLENDER Key; ist einer da, laeuft immer `Reserve` und daraus Replay (gespeicherte
      Antwort) oder 409 (in flight). Deshalb weder Middleware-Umbau (Weg a) noch eigene Spalte
      (Weg b), sondern der Beleg, der bisher fehlt.
    coverage_start: "internal/biz/hr/timetracking 61,9 % (CI-Stand 32735558575)"
    scope: >
      Diese Unit BAUT KEIN SCHEMA. Sie belegt die vorhandene Absicherung mit einem Test, weil
      der urspruengliche Befund aus Iteration 67 auf einem zu engen Grep beruhte (siehe
      `decision`). Zu bauen ist ein DB-gestuetzter Test auf Gateway-Ebene, der zweimal
      denselben `Idempotency-Key` gegen `POST /api/v1/hr/time/entries` schickt und belegt:
      genau ein `hr_work_time_entries`-Satz entsteht, und die zweite Antwort traegt den Header
      `Idempotency-Replayed: true` (`middleware/idempotency.go:145`). Dazu der Negativtest mit
      einem anderen Key bei identischem Body - der MUSS einen zweiten, unabhaengigen Eintrag
      erzeugen, sonst waere es ein Inhalts-Duplikatfilter und keine Idempotency-Pruefung.
      Vorbild fuer den Testaufbau: `internal/idempotency/postgres_repository_db_test.go`
      (echtes SQL, Nebenlaeufigkeit). Zusaetzlich ein `lean:`-Marker an
      `timetracking.ManualEntryInput.IdempotencyKey` (`repository.go:184`): das Feld wird
      durchgereicht und nie gelesen, weil die Deduplizierung eine Ebene hoeher passiert - ohne
      Marker liest der naechste Scan es wieder als Bug. Der route-eigene 400-Check in
      `route_hr.go:1621-1625` BLEIBT: die Middleware laeuft produktiv in WarnMode
      (`IDEMPOTENCY_MODE` ist nicht auf "hard" gesetzt), der Handler ist dort also die einzige
      Stelle, die den Header wirklich erzwingt.
    sources:
      - backend/internal/gateway/route_hr.go
      - backend/internal/biz/hr/timetracking/service.go
      - backend/internal/biz/hr/timetracking/repository.go
      - backend/internal/biz/hr/timetracking/postgres_repository.go
      - backend/internal/idempotency/postgres_repository.go
      - backend/internal/idempotency/postgres_repository_db_test.go
    notes: >
      Zwei Restrisiken, die der Test NICHT abdeckt und die bewusst offen bleiben (keine eigene
      Unit, aber im Journal erwaehnen): (1) `Reserve` faellt bei einem unerwarteten Repo-Fehler
      fail-open durch (`middleware/idempotency.go:131-135`) - dann greift keine Deduplizierung.
      (2) `Complete` laeuft in einer Goroutine (Zeile 165); stirbt der Prozess dazwischen,
      bleibt der Key reserviert und ein spaeterer Retry bekommt 409, bis der Cleanup-Worker
      ihn raeumt. Beides ist bestehendes Middleware-Design und gilt fuer alle Routen gleich,
      nicht nur fuer HR.
    done_when:
      - >-
        Ein DB-gestuetzter Test belegt, dass ein zweiter POST mit demselben Idempotency-Key
        keinen zweiten hr_work_time_entries-Satz erzeugt und die Antwort Idempotency-Replayed
        traegt
      - Der Negativtest mit einem anderen Key erzeugt nachweislich einen zweiten Eintrag
      - >-
        Der Test laeuft wirklich gegen die DB (DATABASE_URL gesetzt, Rolle kmuhub_app, null
        Skips) und die Zahl der gelaufenen DB-Tests steht im Journal
      - >-
        Ein lean:-Marker an ManualEntryInput.IdempotencyKey erklaert, warum das Feld ungelesen
        bleibt
      - go test -count=1 ./internal/biz/hr/timetracking/... ./internal/gateway/ gruen

  - id: fix-event-payload-missing-tenant-id
    phase: 4
    service: notification
    model: opus
    deps: []
    status: done
    decided: 2026-08-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-08-24 (A5): die TenantID-Luecke wird ZUERST geschlossen, erst
      danach werden die biz-Emitter verdrahtet
      (`wire-biz-event-emitters-for-finance-triggers`, deps darauf gesetzt). Grund: die
      Vorlage ging davon aus, `SetEventEmitter` in `cmd/biz/main.go` sei "wenige Zeilen". Die
      Gegenpruefung am 2026-08-24 zeigt, dass das nicht reicht - und dass es auf den HEUTE
      verdrahteten Pfaden ein Produktionsfehler ist, kein Vorarbeits-Thema.
    coverage_start: "internal/notification/event 61,7 % (CI-Stand 32735558575)"
    scope: >
      VERIFIZIERTER FUND (2026-08-24, Merge-Gegenpruefung Lauf 11).
      `models.EventPayload` hat ein Feld `TenantID uuid.UUID` (`internal/models/event.go:47`).
      `EventBus.dispatch` (`internal/notification/event/bus.go:133`) stempelt den Tenant NUR
      dann in den Handler-Context, wenn `event.TenantID != uuid.Nil` - und der Kommentar direkt
      darueber (Zeilen 123-131) sagt selbst, was sonst passiert: "every table they touch
      (events since 000271, notifications since 000122, inbox_messages) is under RLS, whose
      policy admits nothing when app.tenant_id is empty. Without this the notification insert
      fails with 'new row violates row-level security policy', ProcessEvent logs it and moves
      on, and the event disappears."
      Gezaehlt ueber `internal/` ohne Testdateien: 25 `models.EventPayload{...}`-Literale,
      davon setzen nur 5 `TenantID` - und zwar ausschliesslich die zeitgesteuerten Pfade, die
      den Tenant ohnehin aus einer Zeile haben (`automation/trigger/poller.go:203`,
      `automation/workflow/webhook.go:222`, `fuhrpark/worker.go:211`, `vertraege/worker.go:126`,
      `notification/event/bus.go:181` im Backlog-Replay). Die 20 request-getriebenen Emitter
      setzen ihn nicht, darunter `biz/invoice/service.go:92`, `biz/quote/service.go:72`,
      `crm/deal/service.go:355` und die Helfer in `work/task`, `chat/message`, `email/message`,
      `document/file`. `event.EmitEvent` (`internal/notification/event/emit.go`) reichert
      nichts an - es marshalled und ruft `pg_notify('events', ...)`.
      Zu bauen: die `emitEvent`-Helfer (bzw. die Literale, wo es keinen Helfer gibt) ziehen den
      Tenant aus dem Request-Context (`middleware.GetTenantID(ctx)`) und setzen ihn. Ist kein
      Tenant im Context, wird der Emit mit `slog.Warn` uebersprungen statt tenant-los abgesetzt
      - ein Event ohne Tenant kann von keinem Handler korrekt verarbeitet werden, und ein
      stiller Fehlschlag eine Ebene tiefer ist genau das Muster, das hier behoben wird.
    sources:
      - backend/internal/models/event.go
      - backend/internal/notification/event/bus.go
      - backend/internal/notification/event/emit.go
      - backend/internal/notification/notification/service.go
      - backend/internal/biz/invoice/service.go
      - backend/internal/biz/quote/service.go
      - backend/internal/crm/deal/service.go
      - backend/internal/work/task/service.go
      - backend/internal/chat/message/service.go
    notes: >
      REIHENFOLGE: erst alle Emitter auf den Tenant umstellen, dann
      `wire-biz-event-emitters-for-finance-triggers`. Andersherum wuerden die neu verdrahteten
      biz-Events sofort tenant-los auf dem Bus landen.
      Der Umfang ist groesser als eine Datei - such die Stellen zur Laufzeit selbst mit
      `grep -rn "models.EventPayload{" backend/internal --include=*.go | grep -v _test`, statt
      der Liste oben blind zu vertrauen; sie ist der Stand vom 2026-08-24.
      Kein Notification-Spam-Risiko: `notification/service.go:94` iteriert ueber
      `payload.TargetUserIDs`, und die betroffenen Finanz-Events tragen dort nichts - der Fix
      macht also keine Benachrichtigungen sichtbar, die vorher unterdrueckt waren, sondern
      repariert den Weg fuer die, die schon heute feuern sollen.
      Falls sich beim Bauen zeigt, dass ein Emitter gar keinen Request-Context hat (Worker,
      Scheduler), gehoert dort der Tenant aus der verarbeiteten Zeile - so machen es die fuenf
      Stellen, die es heute schon richtig machen.
    done_when:
      - >-
        Jedes nicht-Test-Literal von models.EventPayload setzt TenantID, oder der Emit wird
        nachweislich uebersprungen, wenn kein Tenant ermittelbar ist
      - >-
        Ein Test belegt end-to-end, dass ein Event mit gesetztem Tenant beim Handler ankommt
        und der RLS-geschuetzte notifications-INSERT durchgeht - gegen echte DB, als
        kmuhub_app, nicht als kmuhub
      - >-
        Ein Negativtest belegt, dass ein Emit ohne ermittelbaren Tenant nicht still auf dem Bus
        landet
      - Der Zaehler im Journal: wie viele Literale vorher/nachher TenantID setzen
      - go test -count=1 ./internal/notification/... ./internal/biz/... ./internal/crm/... gruen

  - id: harden-quote-conversion-unique-index
    phase: 4
    service: biz
    model: opus
    deps: []
    status: done
    unblocked: >
      ENTBLOCKT 2026-08-24 durch Luke. Der Produktionsbefund, auf den diese Unit gewartet
      hat, liegt vor: die Abfrage
      SELECT tenant_id, source_quote_id, count(*) FROM finance_invoices
      WHERE source_quote_id IS NOT NULL AND status <> 'cancelled'
      GROUP BY 1,2 HAVING count(*) > 1;
      liefert auf Produktion (178.104.38.195, docker-postgres-1, -U kmuhub -d kmuhub)
      NULL ZEILEN. Es existieren keine mehrfach nicht-stornierten Rechnungen zum selben
      Angebot, der partielle Unique-Index kann bei der Migration also nicht an
      Altdaten scheitern. Kein Deploy-Hazard, keine Datenentscheidung noetig.
      ZWEITER GRUND, sie zu bauen (Befund der Merge-Gegenpruefung Lauf 11): auf
      finance_invoices existiert HEUTE gar kein Index auf source_quote_id -- nur die
      Spalte (000045:61) und ein FK auf finance_quotes(id). Der in Iteration 51
      eingefuegte LEFT JOIN LATERAL fuer converted_invoice_number sitzt in DREI
      Quote-Lesepfaden (GetByID, List, GetByDealID, quote/postgres_repository.go) und
      scannt dort ohne Index. Der Unique-Index dieser Unit deckt beides ab: die
      Race-Haertung und die fehlende Zugriffsstruktur. Beim Bauen die Selektivitaet
      des partiellen Index gegen den Join pruefen -- deckt WHERE source_quote_id IS
      NOT NULL AND status <> 'cancelled' die Join-Bedingung ab, braucht es keinen
      zweiten Index.
    coverage_start: "n.a. (Race-Haertung zu fix-quote-to-invoice-duplicate-creation, Lauf 11 Iteration 70)"
    scope: >
      VORGAENGER: `fix-quote-to-invoice-duplicate-creation` ist in Lauf 11 gebaut und gemergt
      (in `archive/lauf-11/BACKLOG.yml`, Iteration 70). Die `deps` dieser Unit ist deshalb
      leer — die Abhaengigkeit ist erfuellt, die Vorgaenger-Unit steht nur nicht mehr in
      dieser Datei.
      Restrisiko aus Iteration 70: die Doppelkonversions-Sperre in
      `Service.CreateFromQuote` ist ein Service-seitiger Read-vor-Write-Check
      (`lean:`-Marker im Code). Zwei wirklich gleichzeitige Requests lesen beide
      "keine Rechnung" und schreiben beide. Die robuste Grenze waere ein partieller
      Unique-Index auf `finance_invoices (tenant_id, source_quote_id)
      WHERE source_quote_id IS NOT NULL AND status <> 'cancelled'`.
    sources:
      - backend/internal/biz/invoice/service.go
      - backend/internal/biz/invoice/postgres_repository.go
      - backend/internal/biz/invoice/postgres_repository_quote_link_time_tracking_db_test.go
      - backend/migrations
    notes: >
      VORAB ZU KLAEREN, nicht anzunehmen: existieren in Produktion bereits mehrere
      nicht-stornierte Rechnungen zum selben `source_quote_id`? Dann schlaegt die
      Migration beim Anlegen des Index fehl. Luke hat Prod-Zugriff, der Loop nicht —
      ohne diesen Befund ist die Unit `blocked`.
      Der Index ist partiell ueber die MUTABLE Spalte `status`: ein UPDATE auf
      'cancelled' entfernt die Zeile aus dem Index, ein UPDATE zurueck fuegt sie wieder
      ein und kann dann kollidieren. Das ist gewollt (zwei lebende Rechnungen zu einem
      Angebot bleiben verboten), muss aber im Storno-Pfad getestet werden.
      `TestPostgresRepository_GetByQuoteID_MultipleInvoices` legt heute ZWEI nicht
      stornierte Rechnungen zum selben Quote an und wuerde am Index scheitern — der
      Test ist dann anzupassen (eine der beiden auf 'cancelled'), nicht zu loeschen:
      seine Aussage (GetByQuoteID muss mit mehreren Treffern deterministisch umgehen)
      bleibt gueltig.
      Die Unique-Violation ist im Repository auf einen Sentinel zu mappen — Vorlage
      `isAccountIBANConflict` in `internal/biz/banking` (Constraint-NAME pruefen, nicht
      blossen SQLSTATE) — und im Service auf `ErrQuoteAlreadyConverted` zu falten,
      damit beide Wege denselben 409 liefern.
      Migrationsnummer zur Laufzeit ermitteln, forward-only, `.up.sql` UND `.down.sql`.
    done_when:
      - Der Produktionsbefund zu vorhandenen Mehrfach-Rechnungen pro Quote steht im
        Journal (oder die Unit ist genau deswegen blocked)
      - Partieller Unique-Index per neuer Forward-Migration, .down.sql gefuellt
      - >-
        Ein Test belegt: nach Storno der ersten Rechnung gelingt eine zweite Konversion
        weiterhin (der Index blockiert den legitimen Weg nicht)
      - Die Unique-Violation kommt als ErrQuoteAlreadyConverted (409) beim Aufrufer an,
        nicht als roher pg-Fehler (500)
      - go test -count=1 ./internal/biz/invoice/ ./internal/server/ gruen, DATABASE_URL
        gegen kmuhub_app

  - id: feat-crm-activity-deal-tag-rpcs
    phase: 4
    service: crm
    model: opus
    deps: []
    status: done
    decided: 2026-08-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-08-24: WEG A - die vier RPCs werden gebaut. Die Vorabpruefung
      hat ergeben, dass das Desktop-Frontend die vier Endpunkte HEUTE NICHT ruft:
      `desktop/src/renderer/src/api/types.ts:974` und `:1046` tragen nur die aus der Spec
      generierten Typen, es gibt weder einen Hook noch UI. Tag-Bedienung existiert im FE fuer
      Kontakte (`api/hooks/useContactTags.ts`, `modules/kontakte/TagManager.tsx`) und Firmen,
      fuer Deals und Aktivitaeten nicht. Trotzdem Weg A statt Loeschen: die Fachlogik ist
      vollstaendig, tenant-gescoped und mit Permissions gebaut, und ein dauerhaftes 501 im
      ausgelieferten Produkt kostet mehr als vier Durchreich-RPCs. Die Schwester-Unit
      `fix-crm-tag-endpoints-are-501-stubs` ist als Dublette nach BACKLOG-PARKED.yml gegangen;
      diese Unit hier ist die einzige zum Thema.
    coverage_start: "internal/gateway 56,6 % (CI-Stand 32735558575)"
    scope: >
      Vier gRPC-RPCs anlegen und durchreichen. Ausgangslage (Iteration 97 verifiziert, am
      2026-08-24 erneut geprueft): Tagging von Activities und Deals ist end-to-end gebaut
      ausser einer Schicht. Vorhanden sind Join-Tabellen `activity_tags`/`deal_tags`
      (Migration 000006, `tenant_id` seit 000111), Repository-Methoden
      `AddTags`/`RemoveTags`/`GetTags`, die Service-Methoden
      `activity.Service.AddTags/RemoveTags` (activity/service.go:441/466) und
      `deal.Service.AddTags/RemoveTags` (deal/service.go:458/483) inkl. Tag-Existenzpruefung,
      die Router-Registrierung mit `RequirePermission("activities","write")` bzw.
      `("deals","write")` (route_crm.go:165/166/178/179) und die vollstaendigen
      openapi-Eintraege (openapi.yaml:2731 fuer deals, :2964 fuer activities, je `200` mit
      `DealResponse`/`ActivityResponse`). Es fehlt allein der gRPC-Hop, weshalb die vier
      Handler dauerhaft `501` antworten und die Service-Methoden null Nicht-Test-Aufrufer haben.
      Umfang: `AddActivityTags`/`RemoveActivityTags`/`AddDealTags`/`RemoveDealTags`
      in `proto/crm/v1/crm.proto` nach dem exakten Vorbild von `AddContactTags` (Zeilen 28/29,
      Messages 396-411: Request mit `activity_id`/`deal_id` und `repeated string tag_ids`,
      Response mit dem jeweiligen Info-Message), `make proto-crm` im selben Commit, vier
      Server-Methoden in `internal/server/crm_grpc.go` nach dem Muster von `AddContactTags`
      (crm_grpc.go:673) mit `middleware.GetTenantID`, uuid-Parsing und `mapCRMError`, und die
      vier Gateway-Handler von `response.Error(501, ...)` auf `crmClient.<RPC>` und
      `response.Proto` umstellen. Keine neue Route, keine neue Permission, keine Migration.
    sources:
      - backend/proto/crm/v1/crm.proto
      - backend/internal/server/crm_grpc.go
      - backend/internal/crm/activity/service.go
      - backend/internal/crm/deal/service.go
      - backend/internal/gateway/route_crm_activities.go
      - backend/internal/gateway/route_crm_pipeline.go
      - backend/api/openapi.yaml
    notes: >
      Die Tests, die den 501er heute festschreiben, muessen im selben Commit mitgezogen werden:
      `TestHandleAddActivityTags_NotImplemented`, `TestHandleRemoveActivityTags_NotImplemented`
      (route_crm_activities_test.go:354/375),
      `TestHandleAddDealTags_ValidReturnsNotImplemented`,
      `TestHandleRemoveDealTags_ValidReturnsNotImplemented`
      (route_crm_pipeline_test.go:573/602), dazu die erklaerenden Kommentare in
      route_capability_guard_test.go:313 und in den Kopfkommentaren beider Testdateien.
      `TagIdsRequest` bleibt stehen - es wird weiter von `/api/v1/contacts/{id}/tags` gebraucht.
      Kein FE-Aufrufer existiert (verifiziert 2026-08-24), der Umbau ist FE-seitig risikofrei;
      die generierten Typen in `desktop/src/renderer/src/api/types.ts` aendern sich nicht, weil
      der OpenAPI-Vertrag unveraendert bleibt - nur die Antwort wechselt von 501 auf 200.
    done_when:
