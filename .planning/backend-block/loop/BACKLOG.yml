      `cmd/automation/`). Einen Poller bauen, der in festem Intervall faellige Automationen
      laedt, ausfuehrt und den naechsten Faelligkeitszeitpunkt fortschreibt.
    sources:
      - backend/internal/automation/trigger/registry.go
      - backend/internal/berichte/scheduler/
      - backend/cmd/automation/main.go
