  - id: fix-formulare-schemas-submissions-wire
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/gateway 75,1 %"
    scope: >
      TOTALAUSFALL Formulare (Scan Iteration 34, Wire gemessen). `FormularePage.tsx:449-451` liest
      `schemasData?.items`, `formulare-client.ts` typisiert `FormSchema`/`FormSubmission`
      (`formulare-types.ts:98/140`) camelCase und flach. Das Gateway schreibt rohes protojson:
      `GET /formulare/schemas` -> `{schemas:[…],total}` (leer: `{}`), `GET/POST/PUT .../schemas[/id]`
      und `.../duplicate` -> `{schema:{…}}`, `GET .../submissions` -> `{submissions,total}`,
      `GET/POST/PATCH submission` -> `{submission:{…}}`. Folge: die Formularliste ist für JEDEN leer,
      jedes Detail liest eine Wrapper-Hülle, ein neues Formular trägt kein `id`. Außerdem: `fields`
      und `answers` kommen als base64 statt als Objekt/Array, `status` als Zahl (`2`) statt
      `'draft'|'active'|'closed'|'archived'` bzw. `'new'|'read'|'archived'`, Mehrwort-Felder
      snake_case (`is_template`, `page_count`, `submission_count`, `created_at`, `form_schema_id`),
      der FE liest `isTemplate`/`pageCount`/`submissionCount`/`createdAt`/`formSchemaId`.
      Request-Seite derselbe Bruch: `createFormSchema` schickt `fields` als JSON-Array und
      `isTemplate`/`isPublic`/`pageCount`/`intakeTargetId` camelCase; `createFormSchemaRequest`
      (`route_formulare.go:~165`) liest `Fields []byte` (ein JSON-Array lässt sich nicht in `[]byte`
      decodieren -> vermutlich 400, am echten Router belegen) und nur snake_case. Fix: ein
      schmaler Wire-Typ je Entität am Gateway (FormSchema, FormSubmission), der den FE-Typ schreibt
      (Wrapper `{items,total}` für Listen, flache Entität für Einzelantworten, `fields`/`answers`
