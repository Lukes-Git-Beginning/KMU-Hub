      Nebenbefund aus `scan-resource-double-booking-race` (Iteration 49). `vehicle_bookings` (000300) sperrt Anlagen per
      Advisory-Lock (`CreateBookingWithLock`), aber `UpdateVehicleBooking` (`service.go`) prueft Konflikte per
      `FindConflictingBooking` ausserhalb jeder Transaktion und ohne den Lock - betroffen sind Verschiebung UND
      Reaktivierung (cancelled/completed -> booked). Die Begruendung im Kopf von 000300 ("btree_gist is not guaranteed
      available in every deployment target") ist widerlegt: `CREATE EXTENSION IF NOT EXISTS btree_gist` steht bereits in
      000034 und 000101, laeuft also in jedem Zielsystem. Loesung: `EXCLUDE USING GIST (tenant_id WITH =, vehicle_id WITH =,
      tstzrange(starts_at, ends_at, '[)') WITH &&) WHERE (status IN ('booked','in_use'))` in neuer Migration, `23P01` auf
      `ErrBookingConflict` abbilden (Vorlage `asRentalConflict`) in `CreateBookingWithLock` und `UpdateBooking`.
    sources:
      - backend/internal/fuhrpark/postgres_repository.go
      - backend/internal/fuhrpark/service.go
      - backend/migrations/000300_vehicle_bookings.up.sql
      - backend/internal/vermietung/postgres_repository.go
    notes: >
      PRODUKTIONSABFRAGE (Luke): SELECT a.tenant_id, a.vehicle_id, a.id, b.id FROM vehicle_bookings a
      JOIN vehicle_bookings b ON a.tenant_id = b.tenant_id AND a.vehicle_id = b.vehicle_id AND a.id < b.id
      AND a.status IN ('booked','in_use') AND b.status IN ('booked','in_use')
      AND a.starts_at < b.ends_at AND a.ends_at > b.starts_at;
      Nicht leer -> vor der Migration bereinigen. Die Migration 000300 ist neu - vermutlich leer, trotzdem fragen.
      Der Kommentar in 000300 bleibt unveraendert (ausgerollte Migration); die Korrektur gehoert in den Kopf der neuen.
      Gleiche Test-Anforderung wie bei der Maschinen-Unit (parallele Verschiebung, genau ein Gewinner, `-race` nur CI).
    done_when:
