    scope: >
      Jeder Eingangspfad, den ein Fremdsystem auslöst, kann doppelt ankommen — Netzwerkfehler,
      Timeout mit Wiederholung, manueller Neuanstoss. Dieser Scan listet ALLE solchen Pfade auf
      und prüft je Pfad, was eine Doppelzustellung anrichtet.
      Bekannte Anker (2026-08-22 am Code geprüft, als Vorlage für die Bewertung):
        - Lexware-Webhook (`route_lexware.go:57`): HMAC-validiert, KEINE Event-ID im Payload
          (`models.go:186` trägt nur eventType/resourceId/organizationId). Schaden bei
          Doppelzustellung ist klein — der Kontakt-Upsert ist idempotent, der Event-Emitter ist
          ein noop und nicht gewired (Befund 1). Übrig: ein Call gegen ein rate-limitiertes
          Fremdsystem und ein redundantes CRM-Update. NICHT-FUND mit Begründung, es sei denn
          der Scan findet mehr.
        - Automations-Webhook (`route_automation.go:123`): reicht `Idempotency-Key` durch und
          antwortet mit einem `duplicate`-Flag — der beste Fall. Verhalten bei FEHLENDEM Key
          ist die offene Frage.
        - LiveKit-Webhook (`route_video.go:216`): JWT-validiert, Handler loggt überwiegend nur.
        - Formulare-Webhooks (`route_formulare.go:108`).
        - Bexio-Poller und der Lexware-Scheduler (kein HTTP-Eingang, aber derselbe Fehlermodus
          bei überlappenden Läufen).
        - Kontoauszugsimport (`route_biz_bank_transactions.go`) — derselbe Auszug zweimal.
        - DATEV-Upload (`route_datev_upload.go`) — derselbe Stapel zweimal.
    sources:
      - backend/internal/gateway/
      - backend/internal/idempotency/postgres_repository.go
      - backend/internal/middleware/idempotency.go
      - backend/internal/biz/lexware/webhook_handler.go
    notes: >
      Mechanisch anfangen: alle Routen ohne Auth-Middleware und alle Routen, die eine
      Fremdsystem-Signatur prüfen, aus der Routenregistrierung ziehen. Dazu alle Scheduler und
      Poller aus `cmd/*/main.go`. Das ist die Grundgesamtheit.
      Je Pfad drei Fragen, in dieser Reihenfolge: Was ändert sich bei der zweiten Zustellung
      dauerhaft (Zeile, Buchung, Versand)? Gibt es einen natürlichen Schlüssel, an dem man das
      erkennen könnte? Und ist der Schaden gross genug, um einen Schutz zu rechtfertigen?
      Ein Pfad ohne dauerhafte Änderung ist ein legitimer Nicht-Fund — das muss aber
      dastehen, nicht weggelassen werden.
      WIEDERVERWENDUNG PRÜFEN, bevor eine neue Mechanik vorgeschlagen wird:
      `internal/idempotency` existiert, ist seit Lauf 10 auf 87 % getestet und kann einen
      synthetischen Schlüssel aufnehmen. ABER: `idempotency_keys.user_id` ist `NOT NULL`
      (Migration 000105) und `Reserve` nimmt kein eigenes Ablaufdatum — die Vorgabe sind
      24 Stunden. Für einen Webhook ohne Benutzer und mit kurzem Dedup-Fenster passt das
      möglicherweise nicht. Diese Einschränkung gehört in JEDE Unit, die eine Wiederverwendung
      vorschlägt, sonst baut die Iteration gegen eine Wand.
      Ein Dedup-Fenster von 24 h auf `contact.changed` würde legitime Folgeänderungen
      verschlucken, weil zwei Änderungen desselben Kontakts denselben Payload erzeugen. Wer
      Dedup vorschlägt, muss das Fenster begründen.
    done_when:
      - Vollständige Liste aller Eingangspfade aus Routenregistrierung, Schedulern und Pollern
      - Je Pfad die drei Fragen beantwortet, Nicht-Funde ausdrücklich begründet
      - Jede Lücke mit rechtfertigendem Schaden ist als eigene Unit angelegt, inklusive
        begründetem Dedup-Fenster und der user_id/TTL-Einschränkung von idempotency_keys
      - neue-units im Journal nennt die IDs, die wirklich in BACKLOG.yml stehen

