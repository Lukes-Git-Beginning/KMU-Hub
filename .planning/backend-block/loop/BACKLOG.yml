  - id: fix-recording-participant-consent-on-pending
    phase: 4
    service: work
    model: opus
    deps: []
    status: done
    decided: '2026-10-29'
    decision: >
      ENTSCHEIDUNG LUKE, 2026-10-29 (aus `decide-recording-participant-consent-before-egress`, Variante a): Die
      Teilnehmer willigen in die `pending`-Aufnahme ein. Das Teilnehmer-Gate wandert aus `StartRecording` in
      `ConfirmInitiatorConsent`, der Egress startet erst, wenn alle zugestimmt haben. Der Status geht als String über
      den Wire (Muster TaxMode in `response.go`), damit der vorhandene Desktop-Vergleich `status === 'active'` greift.
    target: eine Aufnahme lässt sich mit echten Teilnehmern starten, und niemand wird ohne Einwilligung aufgenommen
    coverage_start: n.a.
    scope: >
      Gegen Code belegt in Lauf 17 Iteration 20: (1) `recording.Service.StartRecording` legt die Zeile mit NEUER ID an
      und ruft sofort `CountPendingConsents(rec.ID, participantIDs)`. Einwilligungen hängen per FK an `recording_id`,
      für eine gerade erzeugte ID kann es keine geben, der Zähler ist immer >= 1, Ergebnis immer `ErrConsentPending`
      (FailedPrecondition), Zeile wird gelöscht. Alle Erfolgs-Tests umgehen das mit `pendingOverride = 0`;
      `TestStartRecording_ConsentPendingByDefault` (internal/server) belegt das Dauer-Pending. (2) Der Desktop
      (`api/hooks/useVideo.ts:277`) sucht `r.status === 'active'`, der Wire liefert eine Enum-ZAHL (`response.ProtoList`,
      `UseEnumNumbers`; ACTIVE = 1, PENDING = 6), deshalb öffnet der Einwilligungsdialog (`VideoCallView.tsx:968`) nie.
      Bau: `StartRecording` legt die Aufnahme `pending` an und startet keinen Egress; Teilnehmer willigen auf diese ID
      ein; `ConfirmInitiatorConsent` prüft `CountPendingConsents == 0` und startet erst dann den Egress (sonst
      FailedPrecondition, die Aufnahme bleibt pending). Response-Rewrite des Recording-Status auf den String, den der
      Desktop erwartet (`active`, `pending` usw., vorher alle Desktop-Vergleiche auf `status` greppen). Prod ist
      unberührt, solange `LIVEKIT_EGRESS_TEMPLATE_URL` leer ist (503 vorher).
    sources:
      - backend/internal/work/recording/service.go
      - backend/internal/server/video_grpc.go
      - backend/internal/server/response/response.go
      - desktop/src/renderer/src/api/hooks/useVideo.ts
      - desktop/src/renderer/src/features/video/VideoCallView.tsx
    notes: >
      Desktop-Anteil (Dialog auch für `pending` zeigen) als FE-Unit nach BACKLOG-NEXT.yml, mit dem neuen Ablauf.
    done_when:
      - 'Service-Test mit echtem Repo: Start -> alle Teilnehmer willigen ein -> Initiator bestätigt -> genau ein Egress; ein fehlendes Ja -> kein Egress, Aufnahme bleibt pending'
      - '`pendingOverride` ist aus den Erfolgs-Tests verschwunden oder begründet'
      - 'Gateway-Test: der Recording-Status kommt als String, den der Desktop vergleicht'
      - FE-Unit für den pending-Dialog steht in BACKLOG-NEXT.yml

