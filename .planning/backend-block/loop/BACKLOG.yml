    notes: >
      Vorlage fuer die Modulform ist `hrProfileModule`/`hrEmployeeDocumentsModule`/
      `hrProfileChangeRequestsModule` (alle drei neu in Iteration 59, direkt oberhalb von
      `consentModule` in dsar_search.go) — gleiches fieldValueRecord-/DSARRecord-Muster, gleiche
      Testform (`seedDSARUser`, `testutil.SeedRow`, `fieldValueMap`/`recordMaps`,
      Tenant-Isolation).
      RLS-Falle zuerst pruefen, nicht annehmen: `hr_employee_documents` hatte in Iteration 59 eine
      rollenbasierte Policy (`hr_document_access`) statt reiner `tenant_isolation`, die die neue
      DSAR-Query lautlos leerlaufen liess, weil `DSARSearch` (`security_grpc.go:579`) im normalen
      Anfrage-Kontext ohne HR-Rolle laeuft. `\d hr_leave_requests`, `\d hr_leave_balances` und
