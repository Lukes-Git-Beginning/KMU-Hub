      - backend/internal/biz/hr/employee/postgres_repository.go
      - backend/internal/biz/hr/changerequest/postgres_repository.go
    notes: >
      SPLIT durchgefuehrt wie in der urspruenglichen Notiz vorgeschlagen: "Stammdaten+Dokumente
      vs. Zeit+Urlaub". Aenderungsantraege sind bei Stammdaten gelandet (dieselbe Tabellenform,
