      schneiden (`<modul>:module:view`), und zwar fail-closed: unbekannter oder nicht
      freigeschalteter Modulname faellt still raus, statt durchzurutschen. Leere Anfrage heisst
      danach "alle Module, die dieser Nutzer sehen darf" — nicht mehr "alle".
