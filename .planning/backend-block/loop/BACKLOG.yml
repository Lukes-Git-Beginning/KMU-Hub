      `GetDashboardKPIs` durch; leer bedeutet ALLE Module. Einziger Guard ist
      `berichte:reports:read` (Zeile 127). Ein `member` ohne `finanzen:module:view` bekommt damit
      ueber `GET /api/v1/berichte/kpis?modules=finanzen` die Umsatzzahlen des Unternehmens.
