      (verifiziert, keine Treffer fuer "mieter-portal"/"tenant-portal"/"renter-portal"). Weg B ist
      damit kein Upload-Fix, sondern ein neues Feature samt Auth-Entscheidung. Beides ist eine
      Produkt-/Architekturentscheidung, die Luke gehoert — nicht spontan im Loop zu treffen.
    scope: >
      `UploadInspectionPhoto` akzeptiert nur eine `pending://`-Platzhalter-URL und verweist auf das
      Gateway — dort existiert aber kein Handler. Die Gegenstelle bauen.
    sources:
