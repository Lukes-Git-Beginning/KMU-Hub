  - id: fix-openapi-409-business-conflict-description-remaining-mappers
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    decided: 2026-10-21
    decision: >-
      Rest aus `fix-openapi-409-business-conflict-description` (Iteration 66): dort sind die neun
      Mapper mit Dublette UND Zustandskonflikt umgestellt (33 Operationen, Komponente
      `ConflictOrIdempotencyInFlight`, Liste `hooks/openapi-409-business-ops.txt`). Offen sind die
      uebrigen Mapper und die zwei Inline-Faelle.
    coverage_start: "n.a. (OpenAPI-/Skript-Unit, kein Coverage-Ziel)"
    scope: >
      Dieselbe Umstellung fuer die Mapper, die in Iteration 66 nicht dran waren: mapBizError
      (QuoteAlreadyConverted), bankAccountError, mapEInvoiceError, mapChatError, mapDialerError,
      mapEinkaufError, mapError/auth, mapHelpdeskError, mapInventarError, mapPluginError,
      mapProduktionError, mapProduktionExtError, mapVertraegeError, mapWikiError, mapWorkError,
      mapSchichtenError, mapBexioError/mapLexwareError (SyncAlreadyRunning), security
      (ExportAlreadyPending, CreateRetentionPolicy inline). Verfahren wie in Iteration 66: pro
      Sentinel die Funktionen im Sentinel-Paket finden, die ihn zurueckgeben (plus Aufrufer im
      selben Paket), dann die Server-Methoden, die ueber ein Feld des richtigen Pakets
      (`s.<feld>.<Methode>(`) dorthin kommen, dann die Gateway-Handler, die diesen RPC rufen
      (temporaerer Test mit `chi.Walk` + `endpointFuncKey` wie in
      `openapi_status_code_drift_test.go`, danach loeschen). Namensgleiche Methoden
      (`Create`, `Update`) liefern Fehlalarme - jeden Treffer am Quellcode gegenpruefen.
      Neue Operationen in `hooks/openapi-409-business-ops.txt` eintragen.
    sources:
      - backend/api/openapi.yaml
      - backend/internal/server/
      - .planning/backend-block/loop/hooks/openapi-409-business-ops.txt
      - .planning/backend-block/loop/hooks/openapi-status-fill.py
    notes: >
      Nur Ops umstellen, deren Handler den RPC-Fehler tatsaechlich durchreicht
      (`respondGRPCError`) und bei denen der Sentinel nicht verschluckt wird (in Iteration 66
      war `event.ErrAlreadyAttendee` in `Create` nur ein `slog.Warn` - kein 409 am Draht, und
      `POST /customization/fields` laeuft ueber einen anderen RPC als `POST /custom-fields`).
      Operationen mit eigener 409-description (email/labels, hr/employees, hr/change-requests)
      bleiben unveraendert. Danach `swagger-cli validate backend/api/openapi.yaml`
      (`npx --yes @apidevtools/swagger-cli validate ...`) und `go test -count=1 ./internal/gateway/`.
    done_when:
      - Operationen der genannten Mapper mit fachlichem 409 zeigen auf `ConflictOrIdempotencyInFlight`, Liste in `openapi-409-business-ops.txt` nachgezogen
      - swagger-cli validate gruen, go test -count=1 ./internal/gateway/ gruen

  - id: harden-idempotency-skip-response-body-for-one-time-secrets
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    decided: 2026-10-21
    decision: >-
      Fix-Unit aus `scan-idempotency-response-body-persists-one-time-secrets` (Iteration 70). Kein
      Cross-Tenant-Zugriff (die Tabelle ist RLS-geschuetzt, Zeilen laufen nach 24 h ab), daher ans Ende.
    coverage_start: "n.a. (Haertung, kein Coverage-Ziel)"
    scope: >
      Fuenf mutierende, per `authWithIdempotency` geschuetzte Routen liefern ein Einmal-Geheimnis, das
      sonst NIRGENDS im Klartext liegt (Einladungs-Token sind gehasht, CalDAV-App-Passwoerter ebenso), und
      `middleware.Idempotency` kopiert die Antwort 24 h lang in `idempotency_keys.response_body`, sobald der
      Client einen `Idempotency-Key` sendet: (1) `POST /api/v1/caldav/passwords` (`route_caldav.go`
      `handleCreatePassword`, Feld `password`), (2) `POST /api/v1/invitations` (`HandleCreateInvitation`,
      Feld `token`), (3) `POST /api/v1/tenants` (`HandleProvisionTenant`, `invitation_token`),
      (4) `POST /api/v1/admin/users/invite` und (5) `POST /api/v1/admin/users/{id}/resend-invite`
      (`respondAdminUser`, `inviteToken`). Zu tun: die Speicherung des Bodys fuer genau diese Routen
      unterdruecken, ohne die Deduplizierung zu verlieren.
    sources:
      - backend/internal/middleware/idempotency.go
      - backend/internal/idempotency/postgres_repository.go
      - backend/internal/gateway/route_caldav.go
      - backend/internal/gateway/route_auth.go
    notes: >
      Vorschlag: der Handler setzt einen internen Response-Header (z. B. `X-Idempotency-Redact`), den
      `capturingResponseWriter`/`completeAsync` ausliest, nicht an den Client weitergibt und dann statt des
      Bodys `Complete(..., status, nil)` ruft. Ein Replay liefert dann Status + leeren Body (oder einen
      kurzen Hinweis-Body) mit `Idempotency-Replayed: true` und KEIN zweites Geheimnis. NICHT einfach
      nicht-completen: der Key bliebe 24 h "in Bearbeitung" und jeder Retry bekaeme 409. Pfad-Whitelist ist
      die schlechtere Option (`strings.Contains`, und die Routen sollen weiter dedupliziert werden).
      Bewusst NICHT betroffen (im Scan geprueft): 2FA-Routen (Whitelist `/auth/2fa`), Login/Register/
      Refresh/Reset/Accept-Invitation (oeffentlich, ohne Middleware), Formular-Webhook-Secret
      (`maskWebhookSecret`), Share-Tokens document/wiki/berichte/formulare und GDPR-`download_token`
      (jederzeit per Listing wieder lesbar). Zurueckgestellt, weil befristet: Join-/WOPI-Tokens (LiveKit-Token `SetValidFor(24h)` in `work/livekit/service.go:130` - genauso lang wie die Aufbewahrung, WOPI-TTL `wopiTokenTTL`, nicht nachgemessen). Die Kategorie der
      befristeten Tokens (`/calendar/events/{id}/join-token`, `/documents/token`, Video-Join) ist
      eine eigene Entscheidung, falls Luke sie auch redigiert haben will.
    done_when:
      - Eine Antwort mit gesetztem Redact-Header erreicht den Client unveraendert, wird aber nicht im Body von `idempotency_keys` gespeichert (Test gegen echtes Postgres als kmuhub_app)
      - Replay mit gleichem Key liefert Status und Replayed-Header, aber kein Geheimnis; gleicher Key mit anderem Body bleibt 422
      - Die fuenf genannten Handler setzen den Header, je ein Test pro Handler
      - Mutations-Probe - Header-Auswertung entfernt, der Test wird rot
      - go test -count=1 ./internal/middleware/ ./internal/gateway/ gruen, DATABASE_URL gesetzt, 0 Skips

