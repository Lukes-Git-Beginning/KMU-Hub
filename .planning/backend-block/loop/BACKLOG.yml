      transaktionale Operation. Verifiziert am 2026-08-02: das FE ruft die Route bereits
      (`desktop/src/renderer/src/api/hr-client.ts:945`), im Gateway existiert sie nicht.
      Body laut R-4-Vertrag: `{lastWorkDay, exitDate, exitType(resignation|termination|
      mutual_termination|retirement), reason?, backfill, successorUserId?}`.
      Kaskade: HR-Status auf inactive, Auth-Konto deaktivieren (Login sperren), Platz freigeben,
      Rollenzuweisungen entfernen, und die `managerUserId` aller unterstellten Mitarbeiter auf den
      Nachfolger umhaengen.
    sources:
      - desktop/src/renderer/src/api/hr-client.ts
      - backend/internal/hr/
      - backend/internal/auth/
      - backend/internal/gateway/route_hr.go
    notes: >
      **Alles oder nichts.** Die Kaskade beruehrt HR-Profil, Auth-Konto und Rollen. Reisst ein
      Schritt, darf kein halb offboardeter Zustand zurueckbleiben — ein Konto, das noch einloggen
      kann, waehrend die Personalakte auf inactive steht, ist der schlechteste Ausgang.
      Liegt HR-Profil und Auth-Konto in verschiedenen Services, ist eine verteilte Transaktion
      nicht baubar: dann Reihenfolge so waehlen, dass der sicherheitsrelevante Schritt
      (Login sperren) zuerst und idempotent passiert, und den Rest bei Fehlschlag nachvollziehbar
