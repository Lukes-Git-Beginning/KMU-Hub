      ob das noch stimmt, und falls eine der drei ebenfalls ein Rollen-Gate traegt, dasselbe
      `sysctx.With(ctx)`-Muster anwenden wie in `hrEmployeeDocumentsModule`, mit Mutations-Probe
      als Beleg.
      Korrigierte Zeiteintraege (`hr_work_time_entries.correction_reason`,
      `correction_approved_by`, `correction_approved_at`, `original_entry_id`, `status`
      correction_pending/correction_approved/superseded) gehoeren mit Korrekturhistorie rein,
      nicht nur der finale Wert — sonst ist die Auskunft irrefuehrend. Bei grosser Menge
      aggregieren (Vorbild `timeEntriesModule`, pro Monat) UND die Korrekturen einzeln sichtbar
      lassen, nicht wegaggregieren.
      Urlaubskonto (`hr_leave_balances`) ist ein Snapshot pro Jahr, keine Liste — eigenes
