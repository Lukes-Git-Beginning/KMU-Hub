      (`hr_settings.timezone`, `leave/postgres_repository.go:383`), sie wird nirgends fuer
      diese Grenzen gelesen. Folge: ein Eintrag von 00:30 bis 06:30 Ortszeit (Nachtschicht) faellt
      in den Vortag, ein Eintrag am Montag 00:30 Ortszeit in die Vorwoche; das betrifft
      Tagessumme, Pausenpflicht, Wochensaldo und die Wochenfreigabe (`SubmitWeek`).
      Gleiche Klasse bei Produktion: `isoWeekBounds` (`produktion/postgres_repository.go:493`)
      rechnet in `time.UTC`, die Maschinenbuchungen (`timestamptz`) werden gegen UTC-Wochen
      summiert.
