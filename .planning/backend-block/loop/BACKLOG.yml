  - id: fix-http-audit-logger-failures-invisible-and-close-race
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    coverage_start: "internal/middleware (zur Laufzeit messen)"
    scope: >
      `middleware.AuditLogger` (`internal/middleware/audit.go`) schreibt den HTTP-Audit-Eintrag
      ueber einen Puffer-Kanal (1000) und einen Worker-Pool. Zwei Luecken:
      (a) schlaegt `CreateAuditEntry` fehl oder ist der security-Dienst nicht erreichbar
      (`processEvent`), steht das auf `slog.Debug` - in Produktion unsichtbar. Ein Ausfall
      des security-Dienstes verwirft den Audit-Strom still, ohne dass ein Alarm oder auch nur
      eine Zeile auf `Warn`/`Error` entsteht. Ein voller Puffer meldet immerhin `Warn`.
      (b) `Close()` schliesst den Kanal, waehrend die Middleware weiter `a.events <- ...`
      sendet; ein Request, der nach `Close` noch `shouldAudit` besteht, panikt mit "send on
      closed channel" (das `select ... default` faengt das nicht ab). Die HTTP-Panik wird vom
      Recovery-Handler gefangen, kostet aber den Request.
    sources:
      - backend/internal/middleware/audit.go
      - backend/cmd/gateway/main.go
    notes: >
      (a) `Debug` -> `Warn`, dazu ein Zaehler (Prometheus ist im Repo, `internal/metrics`
      pruefen) fuer verworfene Eintraege, damit der Ausfall messbar ist. Nicht pro Event loggen,
      wenn der Dienst weg ist: gedrosselt (z. B. hoechstens eine Zeile je 30 s).
      (b) Nicht den Kanal schliessen, sondern ein `done`-Kanal/`sync.Once` und die Worker
      beenden lassen, nachdem sie den Rest geleert haben.
      Ob der Kern des Audit-Pfads (service-seitig `audit_log`) davon betroffen ist, ist NICHT
      Teil dieser Unit - sie betrifft nur den HTTP-Middleware-Strom.
    done_when:
      - >-
        Fehlgeschlagener Audit-Eintrag erscheint auf `Warn` (gedrosselt) und in einer Metrik
      - >-
        Senden nach `Close` panikt nicht (Test)
      - >-
        Mutations-Probe: Log-Level wieder auf Debug, der Test mit Log-Handler wird rot

