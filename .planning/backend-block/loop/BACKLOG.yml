    done_when:
      - Token-Erzeugung, Widerruf und Ablauf laufen serverseitig
      - Unauth-Route liefert ausschliesslich den freigegebenen Bericht
      - Abgelaufener oder widerrufener Token liefert 404, nicht 403
      - Rate-Limit auf der Unauth-Route
      - RLS-Smoke gruen
      - go build/vet/lint/test gruen

  # --- finance --------------------------------------------------------------

  - id: p3-finance-list-amounts
    phase: 3
    service: finance
    model: sonnet
    deps: []
    status: done
    scope: >
      Rechnungsliste zeigt durchgehend 0,00 EUR (Gaps-Punkt 17). Betragsfeld im
      Listen-Pfad korrekt befuellen — verwandt mit dem einkauf-Defekt, aber
      eigener Service und eigener Pfad.
    sources:
      - .planning/backend-gaps.md
      - backend/internal/biz/
    notes: >
      Die 0,00-EUR-Ursache selbst war bereits erledigt (Commit 4c197d79,
      2026-06-24, Darien — `protoTaxBreakdown` faellt auf die
      subtotal/total_tax/gross_total-Spalten zurueck, wenn die
      tax_breakdown-JSONB fehlt; das ist der Zustand von Seed-Zeilen UND
      Bexio-Spiegeln). Gegen die done_when-Liste fehlten aber der Unit-Test
