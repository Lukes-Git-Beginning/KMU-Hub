      GLEICHE MECHANIK, NICHT NEU ERFINDEN — Vorlage `git show 5499043b` (Wiki, reiner
      Anhaeng-Fall), `git show f6d4a3ad` (Finance, enthaelt auch den Merge-Fall) und
      `git show <iteration-94-sha>` (Notification, reiner Anhaeng-Fall, lokaler Multi-Line-Stil
      `"409":\n  $ref: ...` statt Inline-Klammern — Stil der jeweiligen Datei-Umgebung
