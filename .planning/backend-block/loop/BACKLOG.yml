      `HandleApproveCorrection` (`internal/gateway/route_hr.go:935`) reicht `approverID`
      ungeprueft aus `middleware.GetUserID(ctx)` durch. Der Permission-Guard
      (`hr:write` ODER `zeiterfassung:corrections:approve`, additiv seit RBAC Phase 1) regelt
      NUR, wer ueberhaupt Korrekturen genehmigen darf — nicht, ob der Genehmiger mit dem
      Antragsteller identisch sein darf. Wer die Approve-Permission haelt (z. B. die Rolle
      `manager`, siehe `migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql`), kann
      also eine eigene `SubmitTimeCorrection` selbst genehmigen und damit die Vier-Augen-Regel
      der Korrektur-Workflow komplett umgehen — inklusive Auswirkung auf Saldo/Lohnabrechnung
      (Korrektur zaehlt danach in die Wochensumme, siehe `aggregateDailyBuckets`).
