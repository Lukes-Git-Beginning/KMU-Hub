    coverage_start: "n.a. (Doku-Unit, kein Coverage-Ziel)"
    scope: >
      Rest von `fix-idempotency-409-rollout-non-finance-routes` (Iteration 87, Lauf 12): dort ist
      die Wiki-Registrar-Gruppe fertig (11 Operationen — Articles CRUD, Versionen-Restore,
      Attachments, Categories CRUD, Share-Tokens; die public Redemption-Route bleibt
      ausgeschlossen, sie laeuft ausserhalb von authWithIdempotency). Alle uebrigen knapp 39
