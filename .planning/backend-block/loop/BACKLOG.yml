# Backend-Nachtloop — Arbeitsqueue (Lauf 17, noch nicht gestaged)
#
# Eine Unit = eine Iteration = ein Commit.
#
# status: todo | in_progress | done | blocked
# model:  sonnet (Default) | opus (architektonisch schwer, Proto, Security, Migration+RLS)
#
# Treiber-Parsing: `hooks/backlog-check.py` lädt diese Datei mit yaml.safe_load. Der Vorflug
# (`--preflight`) bricht ab bei: nicht ladbarem YAML in EINER der drei Dateien, einer Unit ohne
# `id`/`status`, einer Dubletten-ID über die drei Dateien hinweg, `status: blocked` oder einem
# `blocked_reason`-Feld IN DIESER DATEI, einem `done_when[0]`, das eine Entscheidung von Luke
# verlangt, einer `deps`-ID die nirgends existiert, und bei Zyklen in `deps`.
#
# `--state` liefert dem Treiber OPEN=, NEXT= und MODEL=. MODEL kommt von der ERSTEN BAUBAREN
# Unit — `status: todo` UND alle `deps` auf `done`, in DATEIREIHENFOLGE. Wo eine `opus`-Unit
# steht, entscheidet also mit, wie viele Iterationen auf opus laufen.
#
# Läufe 1+2 (58 Units): archive/lauf-1-2/ — Lauf 3 (61): archive/lauf-3/
# Lauf 4 (54): archive/lauf-4/ — Lauf 5 (41): archive/lauf-5/ — Lauf 6 (46): archive/lauf-6/
# Lauf 7 (71): archive/lauf-7/ — Lauf 8 (94): archive/lauf-8/ — Lauf 9 (37): archive/lauf-9/
# Lauf 10 (93, davon 91 done + 2 blocked): archive/lauf-10/
# Lauf 11 (131 Einträge, davon 121 done in 120 Iterationen): archive/lauf-11/ (inkl. Bilanz).
# Lauf 12 (99 Einträge, davon 41 done in 43 Iterationen): archive/lauf-12/ (inkl. Bilanz).
# Lauf 13 (120 Einträge, davon 21 done in 21 Iterationen): archive/lauf-13/ (inkl. Bilanz).
#   Lauf 13 brach nach 21 von 130 Iterationen ab — Ursache und Abhilfe: archive/lauf-13/BACKLOG.yml.
# Lauf 14 (108 Einträge, alle done in 110 Iterationen, Backlog leergelaufen): archive/lauf-14/
#   (inkl. Bilanz). Gemergt als `cadf4bf4` (PR #26), dazu vier Review-Fixes.
# Lauf 15 (26 gestaged, durch Scans auf 74 gewachsen, alle done in 74 Iterationen, Backlog
#   leergelaufen): archive/lauf-15/ (inkl. Bilanz). PR #27 gemergt als `da9fc602`, dazu fünf
#   Review- und CI-Fixes, deployt 2026-10-24.
# Lauf 16 (52 gestaged, durch Scans auf 82 gewachsen, alle done in 82 Iterationen, Backlog
#   leergelaufen um 02:20): archive/lauf-16/ (inkl. Bilanz). PR #28 gemergt als `b88d7eac`,
#   dazu fünf Fixes aus den ersten member-E2E-Flows, deployt 2026-10-25.
#
# Was der Loop NICHT zieht — geparkt oder gestrichen, mit Entscheidung und Zielort:
# BACKLOG-PARKED.yml. Was auf eine Entscheidung wartet: BACKLOG-NEXT.yml. In DIESER Datei steht
# keine `blocked`-Unit. Wird eine Unit im Lauf blockiert, gehört ein `blocked_reason` dazu, der
# sagt, WORAUF sie wartet und WER das entscheidet — und sie wandert IM SELBEN COMMIT nach
# BACKLOG-NEXT.yml. Nicht "vor dem nächsten Lauf": eine blocked-Unit, die hier liegen bleibt,
# lässt den Vorflug des nächsten Laufs abbrechen, bevor die erste Iteration startet (Regel 11).
#
# ==========================================================================================
# STAND 2026-10-25: LEER. Lauf 16 hat die Queue vollständig abgearbeitet. Lauf 17 wird in
# dieser Session gestaged (Entscheidungsrunde, lokaler E2E-Stack, Treiber-Pflege).
# ==========================================================================================

units:
  - id: scan-legacy-seed-grants-for-member-and-manager
    phase: 4
    service: auth
    model: opus
    deps: []
    status: todo
    target: jeder Grant der Presets member/manager vor 000256 ist gegen die Rollenmatrix geprüft
    coverage_start: n.a. (Scan)
    scope: >
      000068 hatte member `dialer:agent:manage` gegeben ("agent self-manage"), unbemerkt bis zum ersten
      E2E mit echtem Seed. Die Rollenmatrix aus Lauf 16 (`role-matrix-lauf16.tsv`) hat das als "ja/ok" gelistet,
      weil sie den Ist-Seed abbildet, nicht die Absicht. Scan: alle `role_permissions` von member/manager
      (Preset, tenant_id IS NULL) mit Schlüsseln `*:manage`, `*:delete`, `*:approve`, `admin:*` auflisten,
      je Grant die Herkunfts-Migration und ob ein Handler den Key als Supervisor-/Fremdzugriff liest. Ergebnis:
      Fix-Units je Fund, keine Code-Änderung im Scan. Vorarbeit der Staging-Session (2026-10-25): 36 Migrationen
      fassen `role_permissions` mit member/manager an, 19 davon enthalten `*:manage|*:delete|*:approve|admin:*`
      (000002, 005-010, 012, 014, 015, 018, 024, 068, 147, 256, 335, 336, 337, 344), dateigenau, nicht grant-genau.
      Die Gegenfrage zu groben Keys steht in `scan-coarse-keys-with-non-all-scope`.
    sources:
      - backend/migrations/000068_dialer_permissions.up.sql
      - backend/migrations/000256_rbac_phase1a_role_scope_and_presets.up.sql
      - .planning/backend-block/loop/role-matrix-lauf16.tsv
    done_when:
      - Liste mit Herkunft je Grant im Journal
      - >
        Je Fund, der fremde Daten oder Supervisor-Rechte öffnet, eine Fix-Unit VOR der ersten todo-Unit
        in BACKLOG.yml (wird in diesem Lauf gebaut); reine Produktfragen nach NEXT

  - id: scan-coarse-keys-with-non-all-scope
    phase: 4
    service: auth
    model: opus
    deps: []
    status: todo
    target: jeder grobe Key mit Scope ungleich all ist auf seine neue Wirkung geprüft
    coverage_start: n.a. (Scan)
    scope: >
      Seit `b00ed131` baut `ResolveTokenPermissions` die Scopes aus `GetUserGrants`. Ein grober Key (`resource`
      ohne Doppelpunkt) mit Scope `own`/`team` wirkt seitdem. Vorher fiel er durch `resource LIKE '%:%'`
      und galt als `all`. Damit sind zwei Klassen von Pfaden neu scharf: (a) Handler, die einen solchen
      Key per `ownerFilterForScope*` lesen, deren Begrenzung bisher nie griff und deshalb nie getestet wurde,
      und (b) Handler, die bisher unbeabsichtigt `all` lieferten und jetzt plötzlich leer oder 403 antworten
      (Totalausfall). Scan: alle Preset-Grants (`tenant_id IS NULL`) mit grobem Key und Scope ungleich `all`
      auflisten, je Key die lesenden Handler, und prüfen, was ein member heute bekommt (Router-Probe mit
      Token aus `GetUserGrants`).
    sources:
      - backend/internal/auth/
      - backend/internal/gateway/helpers.go
      - .planning/backend-block/loop/role-matrix-lauf16.tsv
    done_when:
      - Liste Key -> Scope -> Handler -> Verhalten vorher/nachher im Journal
      - Je Fund eine Fix-Unit vor der ersten todo-Unit (Totalausfall vor Leck vor Kosmetik)

  - id: harden-inbox-message-user-scoping
    phase: 3
    service: server
    model: opus
    deps: []
    status: todo
    decided: '2026-10-25'
    decision: >
      ENTSCHEIDUNG LUKE, 2026-10-25 (Entscheidungsrunde zur Vorbereitung von Lauf 17): Sichtbar = Eigentümer
      ODER zugewiesen ODER Mitglied der Team-Inbox der Nachricht. Gilt für alle Einzelnachrichten-RPCs;
      danach bekommt member die Team-Inbox (`feat-team-inbox-for-members`).
    target: BACKLOG.yml nach Entscheidung Luke
    coverage_start: n.a.
    scope: >
      Gefunden in Iteration 43 (cov-server-inbox-and-grpc-core). `ListMessages` und `GetUnreadCount` filtern
      auf `user_id`; alle Einzelnachrichten-RPCs (`GetMessage`, `MarkRead`/`MarkUnread`, `ToggleStar`, `SetMessageStatus`,
      `Add/RemoveMessageTag`, `Archive`/`Unarchive`, `Snooze`/`Unsnooze`, `ReplyToMessage`, `ForwardMessage`,
      `ListThreadMessages`, Bulk*) scopen dagegen NUR auf `tenant_id` (`message.Service.GetByID` nimmt keine
      user_id). Der Gateway reicht `user_id` mit, der Server ignoriert ihn (`GetMessageRequest.user_id`
      existiert im Proto). Wer die UUID einer Nachricht eines Kollegen kennt, kann sie lesen (Vorschau,
      Absender, Thread-Text), archivieren, taggen oder als sich selbst beantworten. UUIDs sind nicht ratbar
      -- das ist Defense-in-Depth, kein offener Cross-Tenant-Zugriff; Cross-Tenant ist durch Tests belegt
      dicht (`TestInboxMessageRPCs_ForeignTenantSeesNotFound`). Team-Inbox-Nachrichten gehoeren fachlich
      mehreren Nutzern (Mitglieder, Zugewiesene) -- die Sichtbarkeitsregel ist eine Produktentscheidung.
    sources:
      - backend/internal/server/inbox_grpc.go
      - backend/internal/inbox/message/service.go
      - backend/internal/inbox/message/postgres_repository.go
    notes: >
      Vor dem Bauen die Regel festlegen: sichtbar = Eigentuemer ODER zugewiesen ODER Mitglied der Team-Inbox
      der Nachricht. Wenn Luke das nicht vorgibt: `blocked` mit dieser Frage. Wegen `RequirePermissionAny`-Kompatibilitaet
      keine Guards anfassen.
    done_when:
      - >
        Ein Test belegt: Nutzer B (gleicher Tenant, nicht Eigentuemer, nicht Mitglied) bekommt NotFound
        auf GetMessage/Reply/Archive einer Nachricht von Nutzer A
      - Team-Mitglied und Zugewiesener behalten Zugriff (Test)
      - >
        go test -count=1 ./internal/server/ ./internal/inbox/... ./internal/gateway/ gruen, DATABASE_URL
        gesetzt, 0 Skips

