  - id: feat-lexware-store-organization-id-on-connect
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: done
    decided: 2026-08-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-08-24 (A3): die billige Vorbereitung wird mitgenommen, der teure
      Webhook-Fix bleibt geparkt. `harden-lexware-webhook-organization-id-scoping` liegt mit
      Begruendung in BACKLOG-PARKED.yml, Upgrade-Trigger "zweiter aktiver Lexware-Tenant".
      Der Grund fuer die Aufteilung: ohne gespeicherte `organization_id` ist der spaetere Fix
      GAR NICHT moeglich, und der zweite Lexware-Kunde kommt ohne Vorwarnung. Die Vorbereitung
      kostet aber fast nichts, weil `Client.GetProfile` (`internal/biz/lexware/profile.go`)
      den Wert bereits liefert und `TestConnection` (`service.go:177`) den Aufruf schon fuehrt
      - kein Proto-Feld, keine FE-Aenderung, keine Migration.
    coverage_start: "internal/biz/lexware 74,5 % (CI-Stand 32735558575)"
    scope: >
      `Service.Connect` (`internal/biz/lexware/service.go:78-95`) legt die IntegrationConfig
      heute mit `Metadata: map[string]any{"auth_type": "api_key"}` an (Zeile 91) und speichert
      die Lexware-`organizationId` nirgends - obwohl der Webhook sie optional mitbringt
      (`route_lexware.go`, `parseLexwareWebhookBody` liest `organizationId` und die
      snake_case-Variante). Zu bauen:
      (1) In `Connect`, NACH `vault.SetSecret` und VOR `configRepo.Upsert`, `s.client.GetProfile
      (ctx, tenantID)` aufrufen und ein nicht-leeres `OrganizationID` als
      `metadata["organization_id"]` mitschreiben. Der Aufruf ist BEST EFFORT: schlaegt er fehl,
      wird das mit `slog.Warn` protokolliert und `Connect` laeuft normal weiter. Metadata ist
      hier Vorbereitung, kein Vertrag - ein Profil-Timeout darf keine Lexware-Verbindung
      verhindern.
      (2) In `TestConnection` (`service.go:152-185`) den bereits vorhandenen
      `GetProfile`-Aufruf nutzen: traegt die Config noch keine `organization_id`, wird sie
      nachgetragen (Upsert der Metadata). Ohne diesen Schritt bekaeme der EINZIGE heute
      produktiv verbundene Tenant den Wert nie, weil er sich nicht neu verbindet - die
      Vorbereitung waere dann wirkungslos.
      (3) Ein `lean:`-Marker am Metadata-Schreiben, der sagt, wofuer der Wert da ist
      (Tenant-Aufloesung im Webhook-Pfad) und wann er scharf wird (zweiter aktiver Tenant).
    sources:
      - backend/internal/biz/lexware/service.go
      - backend/internal/biz/lexware/profile.go
      - backend/internal/biz/lexware/postgres_config_repo.go
      - backend/internal/gateway/route_lexware.go
      - backend/internal/biz/lexware/service_test.go
    notes: >
      NICHT in dieser Unit: den Webhook-Pfad auf die `organization_id` umstellen. Das ist die
      geparkte Unit. Diese hier legt nur den Wert an, damit der Fix spaeter ueberhaupt gebaut
      werden kann.
      Achtung beim Test: `GetProfile` geht ueber HTTP an die Lexware-API. Der Test muss den
      Client mocken (Muster: `service_test.go`, dort gibt es bereits Faelle mit gemocktem
      Client) - kein echter Netzaufruf im Gate.
      Metadata ist eine JSONB-Spalte auf `integration_configs`; ein zusaetzlicher Schluessel
      ist additiv und braucht keine Migration. Pruefen, dass `Upsert` die Metadata wirklich
      schreibt und nicht nur beim INSERT setzt.
    done_when:
      - >-
        Nach einem Connect traegt die IntegrationConfig eines Lexware-Tenants
        metadata.organization_id, sofern die API sie liefert
      - >-
        Schlaegt GetProfile fehl, laeuft Connect trotzdem erfolgreich durch und protokolliert
        den Fehlschlag (Test)
      - >-
        TestConnection traegt eine fehlende organization_id nach - ein Test mit einer Config
        ohne den Schluessel belegt das
      - Ein lean:-Marker nennt Zweck und Upgrade-Trigger des Werts
      - go test -count=1 ./internal/biz/lexware/ gruen

  - id: feat-retention-handler-fuhrpark-operational
    phase: 4
    service: security
    model: sonnet
    deps: []
    status: done
    decided: 2026-08-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-08-24 (A6, Teilentscheidung). Die Sammel-Unit
      `decide-retention-policy-for-unmapped-personal-data-domains` ist aufgeteilt: Domaenen
      OHNE gesetzliche Aufbewahrungsfrist werden jetzt entschieden, alles mit AO/HGB-Bezug
      geht an Etappe 4 (Legal). Fuer den Fuhrpark heisst das eine WEITERE Teilung, die beim
      Entscheiden aufgefallen ist: `trip_logs` ist ein Fahrtenbuch mit `is_private`-Flag
      (`000193_create_trip_logs.up.sql`) und damit ein steuerlicher Beleg, sobald es als
      Alternative zur 1-Prozent-Regel gefuehrt wird - das faellt unter Paragraph 147 AO
      (10 Jahre) und gehoert deshalb NICHT hierher, sondern in
      `decide-retention-policy-hgb-ao-domains`.
      Entschieden ist damit nur der betriebliche Rest: `vehicle_bookings` und die HISTORISCHEN
      Zeilen von `driver_licenses`. Frist: 3 Jahre, orientiert an der regelmaessigen
      zivilrechtlichen Verjaehrung (Paragraph 195 BGB), innerhalb derer aus einer
      Fahrzeugueberlassung noch Ansprueche entstehen koennen.
    coverage_start: "internal/security/gdpr 72,2 % (CI-Stand 32735558575)"
    scope: >
      Zwei Retention-Handler nach dem Muster von `retention_invitations.go` (Lauf 11,
      neuntes Handler-Beispiel) und der Registrierung in `retention.go`:
      (1) `resource_type: "vehicle_bookings"` - Tabelle `vehicle_bookings`
      (`000300_vehicle_bookings.up.sql`), Clock auf dem Ende der Buchung. Loeschen, nicht
      anonymisieren: eine abgelaufene Fahrzeugbuchung hat ohne den zugeordneten Fahrer keinen
      Rest-Nutzen. `SupportsAction` sagt das explizit, wie `NotificationRetentionHandler`.
      (2) `resource_type: "driver_licenses"` - Tabelle `driver_licenses`
      (`000279_create_driver_licenses.up.sql`, eine Zeile je durchgefuehrter Kontrolle,
      Historie), Clock `checked_at`. WICHTIG: die JEWEILS LETZTE Zeile je `driver_id` ist der
      aktuelle Kontrollstand und darf NIE geloescht werden, egal wie alt sie ist - sonst
      verschwindet der Nachweis der Halterpflicht. Der Handler muss sie in `Plan` als
