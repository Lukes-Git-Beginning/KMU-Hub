  - id: fix-security-gdpr-paths
    phase: fix
    service: auth
    model: sonnet
    deps: []
    status: done
    scope: >
      Vier von sieben DSGVO-Aufrufen des Frontends laufen ins Leere. Verifiziert am 2026-08-02,
      `desktop/src/renderer/src/api/security-client.ts:186-200` gegen
      `backend/internal/gateway/route_security.go:54-58`:
      FE `POST /security/gdpr/export/request` -> BE `POST /security/gdpr/export`;
      FE `POST /security/gdpr/export/{id}/approve|deny` -> BE `/security/gdpr/exports/{id}/...`;
      FE `GET /security/gdpr/export/{token}/download` -> BE `GET /security/gdpr/download/{token}`.
      Dazu ein fuenfter, noch weiter abweichender Aufruf im Modul-Baum:
      `desktop/src/renderer/src/modules/settings/PrivacySettingsTab.tsx:139` haengt einen
      `<a href>` auf `/api/v1/gdpr/exports/{id}/download?token=...` — ganz ohne `/security`-Praefix.
      Das Gateway zieht auf die FE-Pfade um.
    sources:
      - desktop/src/renderer/src/api/security-client.ts
      - desktop/src/renderer/src/modules/settings/PrivacySettingsTab.tsx
      - backend/internal/gateway/route_security.go
      - backend/api/openapi.yaml
    notes: >
      Das ist kein Schoenheitsfehler: der komplette DSGVO-Auskunfts- und Freigabe-Pfad ist ueber
      die UI heute nicht bedienbar. Auskunftsersuchen sind fristgebunden — deshalb steht diese
      Unit vorn.
      `GET /gdpr/exports` (Liste) und die beiden `erasure`-Routen stimmen bereits ueberein, die
      NICHT anfassen.
      Der Download-Handler nimmt heute ein `{token}` im Pfad, das FE schickt eine `{id}` im Pfad
      UND den Token als Query-Parameter. Das ist eine echte Vertragsfrage, keine Umbenennung:
      Erst lesen, was `HandleGetExportDownload` wirklich aufloest. Wenn der Handler ohne den Token
      nicht arbeiten kann, ist die saubere Form `GET /security/gdpr/export/{id}/download?token=...`
      mit Token-Pruefung gegen genau diesen Export. Entscheidung mit Begruendung ins Journal.
      Der Praefix-lose Aufruf im PrivacySettingsTab ist mit hoher Wahrscheinlichkeit schlicht
      falsch — er wird von KEINER Route bedient, auch nicht von einer umbenannten. Als offenen
      FE-Punkt ins Journal schreiben, nicht selbst im Frontend fixen.
      Guards bleiben wie sie sind (`RequireRole("admin")` an approve/deny) — hier wird nur der
      Pfad bewegt, nicht die Berechtigung.
    done_when:
      - alle vier Client-Pfade aus security-client.ts treffen eine registrierte Route
      - openapi.yaml angeglichen, TestOpenAPIRouteDrift gruen
      - bestehende Tests in route_security_test.go auf die neuen Pfade gezogen
      - Download-Vertrag (id vs. token) entschieden und im Journal begruendet
      - go test -count=1 ./internal/gateway/ gruen
    ergebnis: >
      ERLEDIGT. Alle vier Client-Pfade aus `security-client.ts` treffen jetzt eine registrierte
      Route: `POST /gdpr/export/request` (war `/gdpr/export`), `POST /gdpr/export/{id}/approve|deny`
      (war `/gdpr/exports/{id}/...`), `GET /gdpr/export/{id}/download` (war `/gdpr/download/{token}`).
      `GET /gdpr/exports` (Liste) unveraendert, wie in den notes vorgegeben.
      Download-Vertrag: `HandleGetExportDownload` loest ausschliesslich ueber `DownloadToken` auf,
      keinen `{id}` — die "id vs. token"-Frage aus den notes beantwortet sich damit von selbst: es
      gibt keinen Export-Bezug im Handler, nur den Token. Die Wildcard im neuen Pfad heisst trotzdem
      `{id}`, nicht `{token}`: chi verbietet zwei verschieden benannte Wildcards an derselben
      Tree-Position (empirisch verifiziert mit einem Wegwerf-Reproduktionsprogramm — chi.Mux.Route
      wirft "attempting to Mount() a handler on an existing path"), und `/export/{id}/approve` belegt
      die Position bereits. `HandleGetExportDownload` liest deshalb `chi.URLParam(r, "id")` und
      behandelt den Wert als Token — Kommentar im Code, damit das nicht als Bug aussieht.
      Der fuenfte, praefixlose Aufruf in `PrivacySettingsTab.tsx:139`
      (`/api/v1/gdpr/exports/${exp.id}/download?token=...`, direkter `<a href>` ohne API-Client,
      auch kein `/security`-Praefix) ist wie in den notes vermutet echt tot — trifft keine der vier
      neuen Routen. NICHT gefixt (Frontend, Backend-Loop fasst `desktop/` nicht an), bleibt offener
      FE-Befund.
      Tests: zwei neue Router-Level-Tests in `route_security_test.go`
