# Backend-Nachtloop — Arbeitsqueue (Lauf 15, gestaged 2026-10-23)
#
# Eine Unit = eine Iteration = ein Commit.
#
# status: todo | in_progress | done | blocked
# model:  sonnet (Default) | opus (architektonisch schwer, Proto, Security, Migration+RLS)
#
# Treiber-Parsing: `hooks/backlog-check.py` lädt diese Datei mit yaml.safe_load. Der Vorflug
# (`--preflight`) bricht ab bei: nicht ladbarem YAML in EINER der drei Dateien, einer Unit ohne
# `id`/`status`, einer Dubletten-ID über die drei Dateien hinweg, `status: blocked` oder einem
# `blocked_reason`-Feld IN DIESER DATEI, einem `done_when[0]`, das eine Entscheidung von Luke
# verlangt, einer `deps`-ID die nirgends existiert, und bei Zyklen in `deps`.
#
# `--state` liefert dem Treiber OPEN=, NEXT= und MODEL=. MODEL kommt von der ERSTEN BAUBAREN
# Unit — `status: todo` UND alle `deps` auf `done`, in DATEIREIHENFOLGE. Wo eine `opus`-Unit
# steht, entscheidet also mit, wie viele Iterationen auf opus laufen.
#
# Läufe 1+2 (58 Units): archive/lauf-1-2/ — Lauf 3 (61): archive/lauf-3/
# Lauf 4 (54): archive/lauf-4/ — Lauf 5 (41): archive/lauf-5/ — Lauf 6 (46): archive/lauf-6/
# Lauf 7 (71): archive/lauf-7/ — Lauf 8 (94): archive/lauf-8/ — Lauf 9 (37): archive/lauf-9/
# Lauf 10 (93, davon 91 done + 2 blocked): archive/lauf-10/
# Lauf 11 (131 Einträge, davon 121 done in 120 Iterationen): archive/lauf-11/ (inkl. Bilanz).
# Lauf 12 (99 Einträge, davon 41 done in 43 Iterationen): archive/lauf-12/ (inkl. Bilanz).
# Lauf 13 (120 Einträge, davon 21 done in 21 Iterationen): archive/lauf-13/ (inkl. Bilanz).
#   Lauf 13 brach nach 21 von 130 Iterationen ab — Ursache und Abhilfe: archive/lauf-13/BACKLOG.yml.
# Lauf 14 (108 Einträge, alle done in 110 Iterationen, Backlog leergelaufen): archive/lauf-14/
#   (inkl. Bilanz). Gemergt als `cadf4bf4` (PR #26), dazu vier Review-Fixes.
#
# Was der Loop NICHT zieht — geparkt oder gestrichen, mit Entscheidung und Zielort:
# BACKLOG-PARKED.yml. Was auf eine Entscheidung wartet: BACKLOG-NEXT.yml. In DIESER Datei steht
# keine `blocked`-Unit. Wird eine Unit im Lauf blockiert, gehört ein `blocked_reason` dazu, der
# sagt, WORAUF sie wartet und WER das entscheidet — und sie wandert IM SELBEN COMMIT nach
# BACKLOG-NEXT.yml. Nicht "vor dem nächsten Lauf": eine blocked-Unit, die hier liegen bleibt,
# lässt den Vorflug des nächsten Laufs abbrechen, bevor die erste Iteration startet (Regel 11).
#
# ==========================================================================================
# STAND DER VORBEREITUNG (2026-10-23, gegen Code, CI und Produktion gemessen)
#
#   - `main` = `backend-loop` = `ea5a39a9` (Kalender-Akteur-Fix), Produktion auf demselben
#     Code. Lauf 14 ist gemergt (`cadf4bf4`) und deployt.
#   - MIGRATIONSKOPF = 332 (Repo, lokale DB, Produktion, `dirty = f`). IMMER zur Laufzeit
#     ermitteln: ls backend/migrations | grep -E "^[0-9]{6}" | sort | tail -1
#   - CI grün auf `ea5a39a9` (Run 39957283803, alle fünf Jobs inkl. E2E).
#   - Das DB-Gate ist im Treiber erzwungen (Port, `kmuhub_app`, Migrationskopf).
#   - `go test -race` läuft hier nicht (kein C-Compiler). Tests mit Goroutinen oder
#     nebenläufigem Zustand in `offen:` vermerken, abgenommen erst in CI.
#
# COVERAGE-AUSGANGSLAGE (CI-Run 39957283803 auf `ea5a39a9`, gesamt 72,6 % bei Gate 15 %;
# Lauf 14 hat 71,6 -> 72,6 gehoben). Bezugswerte der Pakete, die dieser Lauf anfasst:
#     internal/gateway            73,6 %      internal/server             74,8 %
#     internal/security/gdpr      76,1 %      internal/document/virtual   81,7 %
#     internal/inbox/team         66,5 %      internal/biz/gobdarchive    90,1 %
#     internal/biz/invoice        61,3 %      internal/biz/quote          49,6 %
#     internal/biz/creditnote     49,5 %      internal/biz/dunning        92,2 %
#     internal/produktion         79,0 %      internal/work/project       78,2 %
#     internal/email/attachment   22,1 %      internal/inbox/adapter      23,9 %
#     internal/document/share     33,3 %
# biz/quote und biz/creditnote liegen nur scheinbar unter der 60-%-Linie kritischer Pfade:
# ihre Integrationstests tragen `//go:build integration` und zählen nicht (Entscheidung zur
# Teststrategie offen in BACKLOG-NEXT.yml). Nicht nachbauen, was dort schon existiert.
#
# ------------------------------------------------------------------------------------------
# DER ROTE FADEN DIESES LAUFS
#
# "FUNKTIONIERT ES FÜR EINEN ECHTEN NUTZER?" — TOTALAUSFÄLLE STATT HÄRTUNG.
#
# 14 Läufe haben das Backend weit über den Bedarf ohne Nutzer hinaus gehärtet. Was die
# Nachbearbeitung von Lauf 14 fand, war keine Härtungslücke, sondern FUNKTIONEN, DIE FÜR
# JEDEN SCHEITERN: `calendar_grpc.go` reichte an acht Stellen `uuid.Nil` als Akteur durch
# ("Gateway handles auth") — Kalender ändern/löschen, Mitglieder, Termin löschen,
# Erinnerungen, Kategorie löschen gaben JEDEM Nutzer 403 (behoben `ea5a39a9`). Und
# `GET /inbox/rules` lieferte eine Form, an der der Regel-Editor mit TypeError abstürzte
# (`3c13fd66`). Genau diese Klasse trifft der erste Pilotkunde in der ersten Stunde.
#
#   BLOCK A (9) — BEKANNTE TOTALAUSFÄLLE UND ENTSCHIEDENE FIXES. A1 ist ein heute
#     verifizierter Totalausfall (virtuelle Dateiansicht ist für jeden leer), A2-A4, A6, A9
#     sind in der Entscheidungsrunde 2026-10-23 entschieden, A5/A7/A8 bei der Vorbereitung.
#     Einzige opus-Unit ist A6, bewusst nicht an Position 1.
#
#   BLOCK D (8) — SCANS. Stehen VOR den E2E-Units, weil sie neue Totalausfälle finden und
#     ihre Funde nach der Regel unten ohnehin an den Kopf wandern. Kommt der Lauf nicht weit,
#     sind die Scans wertvoller als die Regressionstests.
#
#   BLOCK B (4) — E2E AUF DEM VORHANDENEN CI-STACK (auth, crm, chat, work, document, dialer,
#     gateway). Die Flows laufen als echter Nutzer über den Gateway, dieselbe Klasse wie der
#     Kalender-Bug, nur dauerhaft. Heute gibt es 13 E2E-Flows, keinen für den Kalender.
#
#   BLOCK C (2) — E2E AUF DEM ERWEITERTEN STACK. Der E2E-Job in `.github/workflows/ci.yml`
#     startet seit dem Staging-Commit auf `backend-loop` zusätzlich `biz` (Health :9098) und
#     `notification` (Health :9094). Abgenommen wird das im Morgen-PR.
#
#   BLOCK E (3) — COVERAGE-FÜLLUNG. Die drei schwächsten Pakete mit echtem Datenpfad. Nur,
#     wenn alles davor durch ist.
#
#   ZUSAMMENSETZUNG: 26 Units — fix 5, chore 2, wire 1, feat 1, scan 8, e2e 6, cov 3;
#     25 sonnet, 1 opus. Die Scans legen zur Laufzeit nach; mit OPEN=0 ist nicht zu rechnen.
#
# ------------------------------------------------------------------------------------------
# REGELN, DIE IN DIESEM LAUF NEU SIND (auch in ITERATION.md verankert)
#
#   1. KEIN "NUR DOKUMENTIERT" FÜR TOTALAUSFÄLLE. Findest du einen Pfad, der für jeden echten
#      Nutzer scheitert (403/500/leere Liste/Absturz im FE für alle, nicht nur im Randfall),
#      legst du im selben Commit eine Fix-Unit VOR die erste `todo`-Unit an. Ein Test darf
#      so einen Fehler NIE mit Workaround-Daten grün machen (`OwnerID: uuid.Nil`, Admin-Bypass
#      im Test, Mock, der die richtige Form liefert). Anlass: ein früherer Lauf hat den
#      Kalender-403 gefunden, als `FUND (nicht Teil dieser Unit, nur dokumentiert)` in einen
#      Testkommentar geschrieben und die Happy Paths mit `uuid.Nil`-Ownern grün gemacht.
#   2. DESKTOP-AUFRUFER GREPPEN. Jede Validierungs- oder Antwortform-Änderung am Gateway
#      greppt `desktop/src/renderer/src/api/` (Clients UND Hooks) und schreibt das Ergebnis in
#      die Pflichtzeile `desktop-aufrufer:` im Journal. Der Loop hat bisher nur gegen
#      Backend-Aufrufer geprüft, nie gegen das FE (Wiki-Marker `public`, `GET /inbox/rules`).
#      MSW-Mocks sind KEIN Beleg — sie zeigen, was das FE erwartet, nicht was das Backend
#      liefert.
#   3. E2E-GATE. `go test -tags=e2e` braucht den vollen Stack und läuft lokal NICHT. Lokales
#      Gate einer E2E-Unit: `go vet -tags=e2e ./test/e2e/` (kompiliert und prüft die Tests)
#      plus die Unit-/DB-Tests der Fixes, an denen der Flow hängt. In `offen:` steht immer
#      "E2E erst in CI abgenommen". Details: GATE-COMMANDS.md, Abschnitt "E2E".
#
# SPERREN (unverändert)
#
#   - Kein Push, kein PR, kein Produktionszugriff (Guard). Keine neue `config.RequireX`.
#   - `deploy/` ist gesperrt — EINZIGE Ausnahme in diesem Lauf: die eine Compose-Zeile von
#     `chore-dialer-stale-contact-default-240`.
#   - `.github/` ist gesperrt. Die E2E-Erweiterung um biz/notification ist beim Staging
#     gebaut, nicht vom Loop. Braucht ein E2E-Flow einen weiteren Service, wird das eine
#     Unit in BACKLOG-NEXT.yml, kein CI-Edit.
#   - Desktop-Code (`desktop/`) ist tabu — lesen ja, ändern nein. FE-Funde gehen als Unit
#     nach BACKLOG-NEXT.yml (Muster `fe-handle-run14-behaviour-changes`).
#   - CSAT, Customization Draft/Deploy-Overlay, `internal/biz/bexio` (G3), WASM: gesperrt.
#   - Neue Tabelle: `tenant_id NOT NULL` + RLS + tenant-gescopte INSERTs UND SELECTs; jeder
#     neue `RequirePermission`-Guard braucht seine Seed-Migration. Guards nur additiv
#     erweitern (`RequirePermissionAny`), nie ersetzen.
# ==========================================================================================

units:
  # ========================================================================================
  # BLOCK A — BEKANNTE TOTALAUSFÄLLE UND ENTSCHIEDENE FIXES
  # ========================================================================================

  - id: fix-document-virtual-files-nil-user
    phase: 4
    service: document
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/server 74,8 % · internal/document/virtual 81,7 %"
    scope: >
      VERIFIZIERTER TOTALAUSFALL (Vorbereitung 2026-10-23). `DocumentGRPCServer.ListVirtualFiles`
      (`internal/server/document_grpc.go:1352-1375`) ruft
      `s.virtualService.ListVirtualFiles(ctx, uuid.Nil, sourceType, limit, offset)` mit dem
      Kommentar "Use Nil for userID since gateway handles auth context". Die Repository-
      Abfragen filtern aber auf den Nutzer (`internal/document/virtual/postgres_repository.go:162ff`,
      `ListChatFiles` mit `INNER JOIN channel_memberships cm ... AND cm.user_id = $1`, analog
      `ListEmailAttachments` und `ListTaskFiles`). Mit `uuid.Nil` trifft der Join nie: die
      virtuelle Dateiansicht (Chat-Dateien, Mail-Anhänge, Task-Dateien) ist für JEDEN Nutzer
      leer. Erreichbar über `GET /api/v1/documents/virtual` (`internal/gateway/route_document.go:181`,
      Handler Z. 1515), Permission `documents:read`.
      Fix wie `ea5a39a9`: den Aufrufer mit `callerID(ctx)` auflösen (Helper existiert im
      Paket `internal/server`, siehe calendar_grpc.go), den Kommentar entfernen. Fehlt der
      Aufrufer im Kontext, `codes.Unauthenticated` statt einer leeren Liste.
      Danach die Antwortform gegen den Desktop prüfen: `desktop/src/renderer/src/api/clients/document-client.ts`
      und `api/hooks/useDocuments.ts` (Typ in `api/types.ts`) — erwartet das FE `files`/`total`
      so, wie `ListVirtualFilesResponse` serialisiert wird? Weicht es ab, Fix am Gateway im
      selben Commit.
    sources:
      - backend/internal/server/document_grpc.go
      - backend/internal/document/virtual/service.go
      - backend/internal/document/virtual/postgres_repository.go
      - backend/internal/document/virtual/postgres_repository_test.go
      - backend/internal/gateway/route_document.go
      - backend/internal/server/calendar_grpc.go
      - desktop/src/renderer/src/api/clients/document-client.ts
      - desktop/src/renderer/src/api/hooks/useDocuments.ts
    notes: >
      Die Repository-Tests (`postgres_repository_test.go`) rufen `ListAll` mit einem echten
      Nutzer und sind deshalb grün — der Fehler sitzt eine Schicht höher. Der neue Test gehört
      an den gRPC-Server (internal/server), mit echtem Aufrufer im Kontext.
    done_when:
      - "DB-Test als kmuhub_app: Kanal-Mitglied ruft ListVirtualFiles und sieht die Chat-Datei seines Kanals"
      - "DB-Test: ein Nutzer, der nicht Mitglied des Kanals ist, sieht sie nicht"
      - "Kein Aufrufer im Kontext ergibt Unauthenticated, keine leere Liste"
      - "Mutations-Probe: uuid.Nil zurück, der erste Test wird rot"
      - "desktop-aufrufer: document-client.ts und useDocuments.ts gegen die Antwortform geprüft, Ergebnis im Journal"
      - "go test -count=1 ./internal/server/ ./internal/document/... grün, DATABASE_URL gesetzt, 0 Skips"

  - id: fix-team-inbox-manage-permission-bypass
    phase: 4
    service: inbox
    model: sonnet
    deps: []
    status: done
    target: BACKLOG.yml
    coverage_start: "internal/inbox/team 66,5 %"
    decided: 2026-10-23
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-10-23: wer `kommunikation:team_inbox:manage` hat, darf Mitglieder
      jeder Team-Inbox des Tenants verwalten, auch ohne Team-Admin zu sein.
    scope: >
      Aus Lauf 14 Iterationen 44 und 65: der Team-Admin-Check lässt einen Tenant-Admin mit der
      Manage-Permission nicht durch. Permission-Bypass im Service ergänzen (Permission kommt
      über den gRPC-Kontext, Muster der übrigen Permission-Checks im Service übernehmen).
      Tenant-Grenze bleibt: kein Zugriff auf Team-Inboxen fremder Tenants.
      Stand 2026-10-23: `ErrNotTeamAdmin` wird in `internal/inbox/team/service.go:74`, `:87`
      und `:215` zurückgegeben, ohne Permission-Ausnahme. Der Gateway lässt die Permission
      schon durch (`route_inbox.go:77`, `RequirePermissionAny(inbox:write,
      kommunikation:team_inbox:manage)`), der Service lehnt dann ab.
    sources:
      - backend/internal/inbox/team/service.go
      - backend/internal/inbox/team/errors.go
      - backend/internal/server/inbox_grpc.go
      - backend/internal/gateway/route_inbox.go
    done_when:
      - "Test: Nutzer mit Manage-Permission ohne Team-Admin-Rolle fügt ein Mitglied hinzu"
      - "Test: Nutzer ohne beides bekommt weiter PermissionDenied"
      - "Test: Manage-Permission eines fremden Tenants erreicht die Team-Inbox nicht"
      - "Mutations-Probe: Bypass entfernt, der erste Test wird rot"

  - id: wire-biz-event-emitters-for-finance-triggers
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: done
    decided: 2026-08-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-08-24 (A5): verdrahten. Die dep
      `fix-event-payload-missing-tenant-id` ist seit Lauf 12 Iteration 2 (`4e1ad006`) erledigt.
      Die Prod-Prüfung, an der die Unit seit Lauf 12 hing, ist bei der Vorbereitung von
      Lauf 15 gemacht (2026-10-23, lesender SELECT): `automations` 0 Zeilen,
      `automation_executions` 0 Zeilen. Mit dem Deploy fängt also kein bestehender Workflow
      überraschend an zu feuern. NICHT wiederholen — kein Produktionszugriff im Loop.
      Zur Sorge "Benachrichtigungen ohne Vorwarnung": `notification/service.go:94` iteriert über
      `payload.TargetUserIDs`, invoice/quote geben dort nichts mit. `biz.invoice.created`
      (`invoice/service.go:252`) feuert künftig ebenfalls, hat aber keinen Trigger in der
      Registry und damit keine Außenwirkung.
    coverage_start: "internal/biz/invoice 61,3 % · internal/biz/quote 49,6 %"
    scope: >
      VERIFIZIERT in Lauf 11 (`verify-biz-event-emitters-never-wired`) und erneut 2026-10-23
      (0 Treffer für `SetEventEmitter` in `cmd/biz/main.go`): das Automations-Modul bietet in
      der UI zwei Finanz-Trigger an, die niemals feuern. `GET /triggers`
      (`internal/gateway/route_automation.go:96` -> `TriggerRegistry.All()`,
      `internal/automation/trigger/registry.go:182-218`) liefert "Rechnung versendet"
      (`biz.invoice.sent`) und "Angebot erstellt" (`biz.quote.created`). Beide hängen an
      `EmitBizEvent`, das der Service nur aufruft, wenn `SetEventEmitter` gesetzt wurde
      (`internal/biz/invoice/service.go:80-107`, analog `internal/biz/quote/service.go`).
      `cmd/biz/main.go` ruft `SetEventEmitter` für `invoiceSvc` und `quoteSvc` nie auf — der
      Konstruktor-Default ist `nil`, `emitEvent` damit ein No-op.
      `biz.invoice.overdue` ist NICHT betroffen (TimeBased, 5-Minuten-Poller,
      `internal/automation/trigger/due_postgres.go:41`).
    sources:
      - backend/cmd/biz/main.go
      - backend/internal/biz/invoice/service.go
      - backend/internal/biz/invoice/event_emitter.go
      - backend/internal/biz/quote/service.go
      - backend/internal/biz/quote/event_emitter.go
      - backend/internal/biz/lexware/service.go
      - backend/internal/automation/trigger/registry.go
      - backend/cmd/crm/main.go
    notes: >
      Vorlage: `cmd/crm/main.go:88`, `cmd/work/main.go:82`, `cmd/chat/main.go:99` setzen
      `svc.SetEventEmitter(<pkg>.NewPGEventEmitter(pool))` direkt nach der Konstruktion.
      Der Lexware-Emitter bleibt auf `noopEmitter{}` — kein Trigger hört auf `lexware.*`, der
      `lean:`-Marker aus Lauf 11 (`webhook_handler.go:176`) bleibt stehen.
    done_when:
      - >-
        invoiceSvc und quoteSvc erhalten SetEventEmitter(<pkg>.NewPGEventEmitter(pool)) in
        cmd/biz/main.go, nach dem Muster von cmd/crm/main.go:88
      - >-
        Ein Test belegt, dass ein versendetes Invoice ein biz.invoice.sent und ein erzeugtes
        Quote ein biz.quote.created Event MIT gesetztem tenant_id auf dem Bus erzeugt
      - >-
        Der Lexware-Emitter bleibt bewusst auf noopEmitter, der lean:-Marker aus Lauf 11 bleibt
        stehen
      - "Mutations-Probe: SetEventEmitter-Zeile für invoiceSvc entfernt, der Event-Test wird rot"
      - go test -count=1 ./internal/biz/invoice/ ./internal/biz/quote/ ./internal/automation/... grün

