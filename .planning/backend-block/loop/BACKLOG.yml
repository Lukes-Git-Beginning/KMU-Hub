      TCP-Fake-Server-Muster in `smtp_timeout_test.go`, nur auf HTTP-Ebene). Ein
      Subscriber, dessen Endpunkt einen Fehler oder Timeout liefert, darf
      `NotifyCollectionChanged` nicht insgesamt scheitern lassen - das ist Fire-and-Forget je
      Subscriber, ein kaputter Client darf die anderen nicht blockieren. `CleanupExpired` mit
      Mischung aus abgelaufenen und aktiven Subscriptions.
