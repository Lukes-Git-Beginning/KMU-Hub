  # ==========================================================================================
  # BLOCK B — COVERAGE BREITE: internal/server UND internal/gateway (30 Units)
  #
  # Gemessen am 2026-08-07 lokal: `internal/server` 6,2 % bei 1.687 Funktionen,
  # `internal/gateway` 24,1 % bei 1.538. Zusammen der groesste Hebel im Repo. Per
  # Architekturregel "thin handlers" steckt dort wenig Geschaeftslogik — aber die drei
  # Dinge, die drinstecken, sind genau die, die in diesem Repo schon produktiv gebrochen
  # sind: Fehler-Abbildung, Wire-Shape und Eingabevalidierung.
  #
  # Diese Units brauchen KEINE Datenbank. Sie sind der Puffer der Nacht: was hier ueberlaeuft,
  # startet Lauf 7. Reihenfolge grob nach Groesse der ungetesteten Flaeche.
  #
  # Vorgehen je Unit — identisch, deshalb hier einmal und in den Units nicht wiederholt:
  #   1. Die Datei lesen und ihre `map<X>Error`-Funktion, ihre `toProto*`-Helfer und ihre
  #      Validierungszweige auflisten.
  #   2. `formulare_grpc_test.go` bzw. `testutil_test.go` als Vorlage nehmen.
  #   3. Fehler-Abbildung als Tabellentest ueber ALLE Sentinels des Moduls — jedes Sentinel
  #      einmal, plus nil und ein unbekannter Fehler (der auf Internal fallen muss).
  #   4. Konvertierungen mit nil-Eingabe, leerer Liste (Ergebnis `[]`, nicht `null`) und
  #      einem vollstaendig befuellten Objekt.
  #   5. Validierungspfade je Methode — mindestens ungueltige UUID und fehlender Tenant.
  #   6. Mutations-Probe, dann Commit.
  # ==========================================================================================

