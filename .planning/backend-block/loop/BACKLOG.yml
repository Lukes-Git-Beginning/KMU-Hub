      `t.Skip` mit Begründung, die auf einen Fehler verweist, und Happy Paths, die mit
      `uuid.Nil`-Owner/-Akteur oder Admin-Bypass grün werden. Bekannt (beide schon als
      decide-Units in BACKLOG-NEXT.yml, nur referenzieren): `schichten/service_test.go`
      `TestService_AssignEmployee_BUG_OverlappingShiftsNotRejected`,
      `einkauf/service_extended_test.go` `…_DoesNotRecordCallOff`.
      Je Fund: welcher Nutzerpfad ist betroffen, scheitert er für jeden? Steht er schon in
      einer der drei Backlog-Dateien?
    sources:
      - backend/internal/
      - .planning/backend-block/loop/BACKLOG-NEXT.yml
      - .planning/backend-block/loop/BACKLOG-PARKED.yml
    done_when:
      - "Tabelle im Journal: je Test Datei:Testname, festgeschriebener Fehler, betroffener Pfad, Backlog-Fundstelle oder neue Unit-ID"
      - "Jeder Totalausfall ohne bestehende Unit steht als Fix-Unit vor der ersten todo-Unit"
      - "Die Such-Muster stehen im Journal"

