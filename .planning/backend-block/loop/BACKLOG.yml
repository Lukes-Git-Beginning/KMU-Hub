  - id: g-admin-users-invite
    phase: 3
    service: auth
    model: opus
    deps: [g-admin-users-list]
    status: todo
    scope: >
      Die drei schreibenden Routen der Benutzerverwaltung, alle drei vom FE bereits aufgerufen
      (`api/hooks/useAdminUsers.ts:35/52/68`) und im Gateway nicht vorhanden:
      `POST /api/v1/admin/users/invite` (Body `{email, firstName?, lastName?, roles[]}`),
      `PATCH /api/v1/admin/users/{id}` (Rolle und/oder Status) und
      `POST /api/v1/admin/users/{id}/resend-invite`.
      Fundament steht: die Tabelle `invitations` (email, role, token_hash, expires_at,
      accepted_at, created_by, tenant_id) sowie `HandleCreateInvitation`, `HandleListInvitations`,
      `HandleCancelInvitation` unter `/api/v1/invitations` (`route_auth.go:132-143`).
    sources:
      - desktop/src/renderer/src/api/hooks/useAdminUsers.ts
      - desktop/src/renderer/src/api/admin-types.ts
      - backend/internal/gateway/route_auth.go
      - backend/internal/auth/
    notes: >
      **`invitations.role` ist SINGULAR, der FE-Vertrag (`InviteUserInput.roles`) ist ein Array.**
      Das ist die zentrale Entscheidung dieser Unit: entweder Mehrfachrollen sauber modellieren
      (Migration) oder bewusst die erste Rolle nehmen und die Einschraenkung dokumentieren. Beides
      ist vertretbar, stilles Verschlucken der uebrigen Rollen ist es nicht.
      **Seat-Limit serverseitig erzwingen**: aktive Nutzer PLUS offene Einladungen verbrauchen
      Plaetze. Das FE warnt nur inline — ohne serverseitige Pruefung ist das Limit keins. Woher
      die Platzzahl kommt, zuerst pruefen (`tenants`, `tenant_module_activations`, Settings);
      gibt es keine belastbare Quelle, ist das ein Journal-Eintrag und kein erfundener Default.
      **`resend-invite`** erzeugt einen neuen Token mit neuem `expires_at` und macht den alten
      ungueltig — sonst existieren zwei gueltige Zugaenge zu einem Konto. Rate-Limit mitdenken.
      **Eskalations-Guard**: niemand darf per Invite oder PATCH eine Rolle vergeben, die er selbst
      nicht haelt. `HandleAssignRole` hat heute ein `oneof`-Validator-Problem (siehe
      `p1b-user-roles`) — wenn diese Unit nach 1b laeuft, dieselbe dynamische Validierung nutzen,
      keine zweite bauen.
      **Selbst-Deaktivierung** blocken; den letzten Admin nicht deaktivierbar machen (der
      Guardrail-Code aus `p1b-guardrails` ist die Quelle, nicht eine Kopie davon).
      Die E-Mail-Zustellung laeuft ueber den vorhandenen Weg des invitations-Handlers — nicht neu
      verdrahten.
    done_when:
