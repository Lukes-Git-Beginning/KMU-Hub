  - id: wp-testutil-guard
    phase: 3
    service: testutil
    model: sonnet
    deps: [wp-settings, wp-chat]
    status: todo
    scope: >
      Nach zwei bis drei wp-Units ist das Muster erprobt. Diese Unit macht es
      dauerhaft: ein Helper `testutil.AssertWriteCarriesTenant(t, pool, write,
      table, id)`, der den Dreischritt (echter Repo-Write, eigener Tenant sieht
      die Zeile, fremder nicht) buendelt, damit die restlichen Module ihn nur
      noch aufrufen.
    sources:
      - backend/internal/testutil/rls.go
      - backend/internal/notification/integration/tenant_write_test.go
    notes: >
      Erst bauen, wenn mindestens zwei wp-Units fertig sind - sonst abstrahierst
      du aus einem einzigen Beispiel und der Helper passt auf nichts. Bereits
      geschriebene wp-Tests auf den Helper umstellen ist NICHT Teil dieser Unit;
      neue Tests nutzen ihn, alte bleiben, bis sie ohnehin angefasst werden.
    done_when:
      - Helper existiert, ist dokumentiert und in mindestens einem Modul benutzt
      - go build/vet/lint/test gruen
