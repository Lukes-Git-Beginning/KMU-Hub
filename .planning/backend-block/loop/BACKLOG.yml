      `(SELECT invoice_id, SUM(amount) AS paid FROM finance_payments WHERE tenant_id = $1
      GROUP BY invoice_id)` wie `openItemsBase` (postgres_open_items.go) und muss
      `gross_total - COALESCE(paid, 0)` statt `gross_total` fuer `total_outstanding_amount`
      summieren. Fuer `total_paid_amount` ist die fachliche Frage vorher zu klaeren: soll die
      Kennzahl weiterhin den Rechnungswert (Umsatz) oder die tatsaechlich vereinnahmte Summe
      (Cashflow) zeigen? Beides ist eine legitime Kennzahl, aber nur eine passt zum Namen
      "TotalPaidAmount" und zur heutigen UI-Beschriftung im Dashboard — das FE ist gesperrt,
      aber die Beschriftung LESEN ist erlaubt, um die Erwartung zu pruefen.
      Die beiden neuen Tests aus Iteration 27
