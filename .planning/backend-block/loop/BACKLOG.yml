# ------------------------------------------------------------------------------------------
# DER ROTE FADEN DIESES LAUFS
#
# "GELD- UND COMPLIANCE-PFADE VOR DEM ERSTEN ZAHLENDEN KUNDEN" (G2). Entscheidung Luke,
# 2026-08-22. Blockstruktur wie Lauf 10, weil sie funktioniert hat: Substanz zuerst, dann die
# schwache Fläche, Scans am Schluss.
#
#   BLOCK A (16 Units) — G2-SUBSTANZ. Fixes und Features mit belegtem Schaden: die
#     Steuerarithmetik (vier unabhängige Implementierungen, eine davon mit einem verifizierten
#     Gruppierungsfehler im GoBD-Export), die EN-16931-Regelfamilien, die Rechnungs-PDF ohne
#     einen einzigen Test, die entblockte Buchungsseiten-Unit.
#
#   BLOCK B (22 Units) — GELD-REPOSITORIES GEGEN ECHTES SQL. NICHT als Coverage-Übung
#     schneiden, sondern als Bug-Suche — Coverage ist das Nebenprodukt. Vorbild sind die beiden
#     `idempotency`-Units aus Lauf 10 (`6507e475`, `254120eb`): echtes SQL, Nebenläufigkeit,
#     Grenzfälle. Die erste davon hat sofort einen Produktionsfehler gefunden.
#
#   BLOCK C (16 Units) — GATEWAY- UND SERVER-GELDFLÄCHEN. `internal/gateway` ist mit 54,1 %
#     weiter das schwächste Kernpaket. Die Routendateien haben inzwischen fast alle einen Test
#     (nur noch drei ohne), aber das Verhältnis Quelle zu Test verrät, wo er dünn ist.
#
#   BLOCK D (10 Units) — MUSTER-SCANS, am Schluss. Sie referenzieren die in A bis C gebauten
#     Fälle als Vorlage und LEGEN JEDEN FUND ALS NEUE UNIT AM BACKLOG-ENDE AN
#     (`neue-units:` ist Pflichtzeile). Eine Scan-Unit ohne Funde ist ein gültiges Ergebnis —
#     aber nur mit Beleg, WAS geprüft wurde. Scan-Units ändern selbst KEIN Verhalten außer dem
#     Anlegen von Units. In Lauf 10 haben 9 Scans 45 Zusatz-Units erzeugt.
#
# ------------------------------------------------------------------------------------------
# BEFUNDE DER VORBEREITUNG — vor dem Bauen lesen. Vier davon korrigieren den Entwurf.
#
#  1. DER LEXWARE-SCHADEN EXISTIERT NICHT. Der Entwurf plante eine Doppelzustellungs-Sperre für
#     den Lexware-Webhook mit der Begründung, `lexware.webhook.received` triggere einen
#     Inbound-Automations-Workflow doppelt. Gegengeprüft: `NewService` setzt `noopEmitter{}`
#     (`internal/biz/lexware/service.go:59-60`), und `SetEventEmitter` wird in `cmd/biz/main.go`
#     NIE aufgerufen (die einzigen `lexwareSvc`-Zeilen sind 368/400/406/409/502/503). Das Event
#     erreicht den Bus also nie. `SyncContactByLexwareID` schreibt zudem KEINEN Sync-Log-Eintrag
#     — nur `syncContacts` ruft `CreateSyncLog`. Ein Kontakt-Upsert per Resource-ID ist ohnehin
#     idempotent. Übrig bleibt bei Doppelzustellung: ein `GetContact` gegen ein
#     rate-limitiertes Fremdsystem und ein redundantes `UpdateContact`.
#     Die geplante Unit ist ERSATZLOS GESTRICHEN. An ihre Stelle tritt A10 — der eigentliche
#     Fund ist, dass in `cmd/biz/main.go` GAR KEIN Event-Emitter gewired ist, auch nicht für
#     invoice und quote, während `automationConsumer` (`cmd/automation/main.go:169`) auf "*"
#     hört. Der Doppelzustellungs-Fall selbst wandert in den Scan D1.
#
#  2. BLOCK B TRIFFT ANDERE PAKETE ALS GEDACHT. "2.800 Zeilen SQL auf Geldpfaden ohne eine
#     einzige Testdatei" ist falsch: `invoice`, `creditnote` und `quote` HABEN
#     Repository-Tests. Sie tragen nur `//go:build integration` und laufen im separaten,
#     PR-blockierenden CI-Job "Finance & HR Integration Tests" (`ci.yml:139-178`, testcontainers,
#     eigener pgvector-Container). Dieser Job sammelt KEINE Coverage — genau deshalb steht
#     creditnote bei 28,2 % und invoice bei 34,8 %, obwohl echte SQL-Tests existieren.
#     WIRKLICH ohne jeden DB-Test UND ohne den Integrations-Job: `internal/biz/dunning`
#     (327 + 180 Zeilen) und `internal/biz/payment` (220). Bei `invoice` sind die ungetesteten
#     Methoden benennbar: `List`/`ListFilter` (112 Zeilen SQL), `ListForDATEVExport`
#     (Keyset-Paging), `ListForGoBDExport`, `AggregatePaymentStats`, `CountByFiscalYear`,
#     `InvoiceNumberExists`, `UpdateStatus`/`UpdateStatusInTx`, `SetLock`, `GetByQuoteID`,
#     `LinkTimeTracking`.
#     KONSEQUENZ FÜR JEDE UNIT IN BLOCK B: neue DB-Tests UNGETAGT schreiben, mit
#     `testutil.SkipIfNoDB` + `PoolFromEnv` + `EnsureTenant` + `SeedRow`/`CleanupRow`
#     (`backend/internal/testutil/rls.go`). Getaggte Tests laufen weder im lokalen Gate noch im
#     Coverage-Job und bewegen `coverage_start` nicht. Vorlage:
#     `backend/internal/idempotency/postgres_repository_db_test.go`.
#
#  3. SCHEMATRON IST NICHT MACHBAR. Der Entwurf sah eine Schematron-Validierung für EN 16931
#     vor. `go.mod` führt keine XML-, XPath- oder XSLT-Dependency, und eine reife
#     Go-Schematron-Bibliothek existiert nicht; ein Grep nach "schematron" über `internal/`
#     liefert 0 Treffer. Die Rechenregeln (BR-CO-10/13/14/15) deckt `assertTotalsMatch`
#     (`internal/biz/einvoice/generator_doc.go:339`) bereits mit Toleranz ab, und
#     `validation.go` prüft schon eine Teilmenge mit echten Regel-IDs (BR-06/07/09/11/25/27,
#     BR-S-02, BR-AE-03, BR-CO-25, BR-DE-1/15).
#     ENTSCHEIDUNG Luke: eine Go-Regelmenge in VIER Regelfamilien — A5 bis A8. Keine neue
#     schwere Dependency, kein externer Validator.
#
#  4. ZWEI VERIFIZIERTE BUGS, DIE NIRGENDS STANDEN — beide auf dem Weg zum Steuerberater:
#     (a) `GenerateGoBDExport` (`internal/server/biz_grpc.go:2451`, Gruppierung ab 2560) baut
#         die USt-Gruppierung INLINE IM gRPC-HANDLER nach und schlüsselt mit
#         `item.TaxRate.IntPart()`. Ein Satz von 7,5 % fällt damit in dieselbe Gruppe wie 7 %,
#         und dieser Schlüssel wählt über `datev.RevenueAccountForRateAndMode` und
#         `datev.BUSchluesselForRate` das Erlöskonto und den BU-Schlüssel. Das Netto wird je
#         Zeile nicht gerundet. Zusätzlich verletzt der Block "Thick Services, Thin Handlers" —
#         `internal/server/biz_grpc.go` importiert `biz/tax` bereits.
#     (b) `dunning.CalculateInterest` (`internal/biz/dunning/service.go:415-458`) hat NULL
#         Aufrufer im Produktionscode (ein Grep nach "CalculateInterest" findet nur die
#         Definition), und `models.DunningConfig` (`internal/models/finance.go:318`) trägt
#         keinen Basiszinssatz — nur drei Gebühren. Verzugszinsen nach § 288 BGB werden also
#         nie berechnet. Der Divisor ist fest 365.
#
#  5. VIER UNABHÄNGIGE STEUERARITHMETIKEN. Neben `biz/tax/calculator.go:64` rechnen
#     `einvoice/generator_doc.go:309` (rundet je Gruppe), `einvoice/parser.go:567+576`
#     (summiert UNGERUNDET und rundet erst die Summe — andere Reihenfolge) und
#     `datev/exporter.go:260` (rundet nur den Bruttobetrag) dieselbe Sache nach. Ein Roundtrip
#     generate -> parse kann damit um Cent abweichen. Das ist A2.
#
#  6. GATEWAY-ROUTENCOVERAGE: NACH DATEINAMEN GEMESSEN IST SIE ERLEDIGT, NACH HANDLERN NICHT.
#     Von 75 `route_*.go` haben nur noch drei keine gleichnamige Testdatei — der Lagebild-Satz
#     "22 Route-Dateien ohne Test" ist damit überholt. Diese Messung ist aber irreführend:
#     `route_biz_time_entries.go` sieht ohne Testdatei aus, sein einziger Handler wird jedoch
#     in `route_biz_open_items_time_entries_test.go` viermal geprüft. Umgekehrt haben Dateien
#     MIT Testdatei reihenweise ungeprüfte Handler.
#     Richtig gemessen wird auf HANDLER-Ebene (jeder `Handle*`-Name gegen den Text aller
#     `internal/gateway/*_test.go`). Stand 2026-08-22 auf den Geld- und Compliance-Routen:
#       route_integration          0/18 Handler (618 Z.) — Integrationskonfiguration + Slack/Teams
#       route_biz_expenses         0/7  (325 Z.)
#       route_biz_bank_accounts    0/5  (227 Z.)
#       route_biz_bank_transactions 0/4 (235 Z.)
#       route_biz_transactions     0/2  (106 Z.)
#       route_datev_upload         4/9  (446 Z.)
#       route_security            10/31 (1016 Z.)
#       route_work_time            2/10 (395 Z.)
#     Block C folgt dieser Messung. Achtung bei der Bewertung: "Name kommt in einem Test vor"
#     ist die schwächste Form von getestet — `route_biz_billing` erreicht so 24/24, hat aber
#     nur 463 Testzeilen auf 899 Quellzeilen. Fehlerpfade sind dort weitgehend offen.
#
#  7. ACHT RETENTION-HANDLER SIND REGISTRIERT (`cmd/auth/main.go:123`): contacts, dialer_calls,
#     chat_messages, helpdesk_tickets, form_submissions, tasks, calendar_events, notifications.
#     Die Ausweitung auf die übrigen Services ist offen; `advisory_protocols` steht unter
#     Verdacht auf Dokumentationspflicht, NICHT belegt. Das ist D3, kein Fix.
#
# ------------------------------------------------------------------------------------------
# HARTE REGELN FÜR DIESEN LAUF
#
#   1. Root Cause, nicht Symptom. Vor jedem Fix alle Caller der angefassten Funktion greppen.
#      Sitzt derselbe Bug in einer Schwesterfunktion, gehört er in dieselbe Unit.
#   2. Mutations-Probe ist Pflicht: eine Zeile der Fix-Logik brechen, prüfen dass ein Test rot
#      wird, zurückdrehen, Diff sauber. Ohne Probe ist der Test nicht bewiesen.
#   3. `go test` ohne `DATABASE_URL` ist KEIN Gate. Die Rolle muss `kmuhub_app` sein —
#      `kmuhub` hat BYPASSRLS und würde jede RLS-Lücke durchwinken.
#   4. NEUE DB-TESTS UNGETAGT. Kein `//go:build integration` — siehe Befund 2.
#   5. Ein DB-Test, der lokal grün ist, weil der Pool nur EINE warme Verbindung hatte, beweist
#      nichts. Wer eine Ressource PRO VERBINDUNG prüft (Advisory Locks, Session-GUCs, temporäre
#      Tabellen), hält vorher eine zweite Verbindung fest.
#   6. Wer ein bestehendes Muster als Vorlage kopiert, kopiert seine Fehler mit. Die Vorlage
#      vorher prüfen, nicht nur nachbauen (so kam der Advisory-Lock-Leak aus `idempotency` in
#      den Retention-Scheduler).
#   7. `-race` läuft auf dieser Maschine nicht (kein `gcc` im PATH). Wo eine Unit `-race`
#      verlangt, gehört das in die `offen:`-Zeile; CI ist der Beweis.
#   8. `go test` über mehrere DB-Pakete mit vollem Parallelismus reißt mit
#      "53300 remaining connection slots are reserved" ab. `-p 1` verwenden. Kein Code-Fehler.
#   9. Scan-Units: ein Fund ohne angelegte Unit ist kein Fund. `neue-units:` im Journal muss
#      die IDs nennen, die wirklich in dieser Datei stehen.
#  10. Jede neue Tabelle braucht `tenant_id UUID NOT NULL` + RLS-Policy — oder einen Eintrag in
#      der System-Global-Liste (ADR-006). Kein stiller dritter Weg.
#  11. Eine Prämisse aus dem Backlog, die sich am Code als falsch erweist, wird NICHT trotzdem
#      gebaut. Sie wird im Journal widerlegt und die Unit auf `blocked` gesetzt — siehe
#      Befund 1, der genau so entstanden ist.
#
# GESPERRT IN DIESEM LAUF (nicht anfassen, auch nicht "nur schnell"):
#   - Frontend/Desktop jeder Art. Der Loop hat kein Playwright-Gate.
#   - CSAT und die übrigen Public-Token-Routen — stillgelegt, siehe BACKLOG-PARKED.yml
#     (Projekt "Public Web Surface").
#   - `internal/biz/bexio` — G3, produktiv aus, Schweizer Software außerhalb der DE-Fokussierung.
#   - Electron-Upgrade / Dependency-Bumps.
#   - `deploy/` und Migrations-Umnummerierungen.
#   - Preise, Modul-Zuschnitt, `lib/pricing.ts` — offene Produktentscheidungen.
#   - `RETENTION_MODE` bleibt `dry_run`. Kein Scharfstellen im Loop.
# ==========================================================================================

units:

# ==========================================================================================
# BLOCK A — G2-Substanz. Reihenfolge ist Absicht: erst die Steuerarithmetik (A1 bis A4, weil
# alles Weitere darauf rechnet), dann die EN-16931-Regelfamilien (A5 bis A8), dann die
# Einzelbefunde. A2 hängt an A1, weil A1 die vierte Implementierung entfernt und A2 danach nur
# noch drei zu vergleichen hat.
# ==========================================================================================

  - id: fix-gobd-export-tax-grouping-rate-key-collision
    phase: 4
    service: server
    model: opus
    deps: []
    status: done
    coverage_start: "internal/server 70,5 % (CI-Stand 32570176303)"
    scope: >
      `GenerateGoBDExport` (`internal/server/biz_grpc.go:2451`) baut ab Zeile 2560 eine eigene
      USt-Gruppierung im gRPC-Handler nach und bildet den Gruppenschlüssel mit
      `fmt.Sprintf("%d", item.TaxRate.IntPart())`. Damit fällt ein Satz von 7,5 % in dieselbe
      Gruppe wie 7 %, und genau dieser Schlüssel wählt über
      `datev.RevenueAccountForRateAndMode(key, taxMode)` und `datev.BUSchluesselForRate(key)`
      das DATEV-Erlöskonto und den BU-Schlüssel. Der Fehler landet also in der Buchhaltung des
      Kunden und fällt erst beim Steuerberater auf. Zweitens wird `lineTotal` (Menge mal
      Einzelpreis) je Zeile NICHT gerundet, bevor es in `g.net` summiert wird — das Netto der
      Gruppe kann mehr als zwei Nachkommastellen tragen und wird erst mit `StringFixed(2)`
      abgeschnitten.
    sources:
      - backend/internal/server/biz_grpc.go
      - backend/internal/biz/tax/calculator.go
      - backend/internal/biz/datev/mapping.go
      - backend/internal/biz/dunning/service_gobd.go
      - backend/internal/server/biz_grpc_dunning_dashboard_exports_test.go
    notes: >
      ROOT CAUSE, nicht Symptom: der Block gehört nicht in den Handler. `internal/server`
      importiert `internal/biz/tax` bereits (`biz_grpc.go`), und `tax.Calculate` liefert genau
      diese Gruppierung — nur mit demselben Schlüsselfehler (siehe A3, das ist die
      Schwesterfunktion und gehört NICHT in diese Unit, sondern in ihre eigene).
      Der saubere Schnitt: die Gruppierung wandert als exportierte Funktion in
      `internal/biz/dunning` (dort liegt `GoBDExportRow` bereits) oder in `biz/tax`, der
      Handler ruft sie nur noch auf. Vor der Verlagerung greppen, ob eine Schwesterfunktion im
      selben File dieselbe Gruppierung nochmal hat.
      Der Schlüssel muss den vollen Satz tragen, nicht die abgeschnittene Ganzzahl. Achtung
      beim Umbau: `RevenueAccountForRateAndMode` und `BUSchluesselForRate` erwarten heute den
      abgeschnittenen String — beide Signaturen und alle ihre Caller mitziehen, sonst
      verschiebt sich das Erlöskonto für 19 % und 7 %.
      Der Nullsatz-Sonderfall oberhalb (Zeile 2545 ff., `TaxRate "0"`) bleibt unverändert.
    done_when:
      - Der Gruppenschlüssel unterscheidet 7 % und 7,5 %; ein Test belegt zwei getrennte Zeilen
        mit den korrekten Erlöskonten
      - Netto wird je Zeile gerundet, bevor es in die Gruppe summiert wird; ein Test mit einer
        Bruchmenge belegt das
      - Die Gruppierung liegt nicht mehr im gRPC-Handler; der Handler ist Parse/Call/Respond
      - Alle Caller von RevenueAccountForRateAndMode und BUSchluesselForRate sind mitgezogen
      - go test -count=1 ./internal/server/ ./internal/biz/datev/ ./internal/biz/dunning/ grün

  - id: fix-tax-rounding-divergence-across-implementations
    phase: 4
    service: biz
    model: opus
    deps: [fix-gobd-export-tax-grouping-rate-key-collision]
    status: done
    coverage_start: "internal/biz/einvoice 81,9 % · internal/biz/tax 100 % (CI-Stand 32570176303)"
    scope: >
      Dieselbe Steuerarithmetik existiert nach A1 noch dreimal unabhängig voneinander, und die
      drei runden in unterschiedlicher REIHENFOLGE:
      `biz/tax/calculator.go:64` rundet je Zeile, `einvoice/generator_doc.go:309` rundet je
      USt-Gruppe, `einvoice/parser.go:567+576` summiert UNGERUNDET und rundet erst die Summe.
      `datev/exporter.go:260` rundet nur den Bruttobetrag. Ein Dokument, das erzeugt und wieder
      eingelesen wird, kann damit um Cent abweichen — und die Abweichung landet in der
      Buchhaltung, nicht in einer Fehlermeldung.
    sources:
      - backend/internal/biz/tax/calculator.go
      - backend/internal/biz/einvoice/generator_doc.go
      - backend/internal/biz/einvoice/parser.go
      - backend/internal/biz/datev/exporter.go
      - backend/internal/biz/einvoice/roundtrip_outbound_test.go
    notes: >
      NICHT blind vereinheitlichen. Erst die Frage beantworten, welche Reihenfolge richtig ist —
      EN 16931 verlangt die Rundung auf Ebene der USt-Gruppe (BT-117 je BG-23), nicht je Zeile.
      `biz/tax` rundet je Zeile und begründet das im Kommentar. Beide können richtig sein, für
      verschiedene Zwecke; falsch ist nur, dass niemand die Differenz kennt.
      Der Beweis ist ein Property-Test über den Roundtrip: Rechnung erzeugen, mit dem eigenen
      Parser wieder einlesen, Summen vergleichen. Mit Bruchmengen und mehreren Sätzen, damit
      die Differenz überhaupt entstehen kann (glatte Beträge zeigen nichts).
      `roundtrip_outbound_test.go` existiert bereits — dort ansetzen, nicht daneben.
      Ergibt der Test eine Differenz, ist das der Fund; die Vereinheitlichung gehört dann
      entweder in dieselbe Unit (wenn sie eine Zeile ist) oder als eigene Unit ans Backlog-Ende.
    done_when:
      - Ein Roundtrip-Test mit Bruchmengen und mindestens zwei Steuersätzen läuft über
        generate -> parse und vergleicht Netto, Steuer und Brutto
      - Die zulässige Rundungsreihenfolge je Implementierung ist am Code als Kommentar
        festgehalten, mit Bezug auf die Regel, die sie fordert
      - Eine gefundene Differenz ist entweder behoben oder als eigene Unit angelegt
      - go test -count=1 ./internal/biz/einvoice/ ./internal/biz/tax/ ./internal/biz/datev/ grün

  - id: fix-tax-calculator-rate-key-collision
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/biz/tax 100 % (CI-Stand 32570176303)"
    scope: >
      `tax.Calculate` (`calculator.go:69`) bildet den Aggregationsschlüssel mit
      `item.TaxRate.Truncate(0).StringFixed(0)`. Zwei Fehler in einer Zeile: ein Satz von 7,5 %
      landet unter demselben Schlüssel "7" wie 7 % (relevant, sobald ein Kunde außerhalb
      Deutschlands fakturiert oder ein reduzierter Satz sich ändert), und eine Zeile mit 0 %
      erzeugt im Standardmodus eine Gruppe "0" mit 0,00 Steuer. Diese Nullgruppe wandert in die
      USt-Aufschlüsselung der Rechnung und in die E-Rechnung, wo sie als Kategorie S mit Satz 0
      auftaucht — eine Konstellation, die ein EN-16931-Validator zurückweist.
      Das Paket steht bei 100 % Coverage. Coverage sagt hier nichts über Korrektheit.
    sources:
      - backend/internal/biz/tax/calculator.go
      - backend/internal/biz/tax/calculator_test.go
      - backend/internal/biz/invoice/service.go
      - backend/internal/biz/creditnote/service.go
      - backend/internal/biz/quote/service.go
      - backend/internal/biz/recurring/service.go
    notes: >
      Fünf Aufrufer, alle auf Geldpfaden — vor der Änderung jeden einzeln ansehen, was er mit
      `Breakdown.TaxByRate` macht. Wer über die Map iteriert und den Schlüssel als Zahl
      weiterreicht, bricht bei einem Schlüssel "7.5".
      Die Map ist unsortiert; wer daraus eine Reihenfolge ableitet, hat schon jetzt ein Problem.
      Falls beim Greppen auffällt, dass ein Aufrufer die Reihenfolge braucht, gehört das als
      eigene Unit ans Backlog-Ende, nicht heimlich hierher.
      Ob die Nullgruppe entfallen soll oder als Kategorie Z geführt werden muss, entscheidet
      A6 (USt-Kategorie-Regeln) — hier reicht es, sie nicht mehr als Kategorie S zu erzeugen.
    done_when:
      - Ein Satz von 7,5 % und einer von 7 % erzeugen zwei getrennte Gruppen, per Test belegt
      - Eine 0-%-Zeile im Standardmodus erzeugt keine Steuergruppe der Kategorie S
      - Alle fünf Aufrufer sind geprüft und, wo nötig, mitgezogen
      - go test -count=1 ./internal/biz/tax/ und die vier aufrufenden Pakete grün

  - id: fix-tax-calculator-line-total-unrounded
    phase: 4
    service: biz
    model: sonnet
    deps: [fix-tax-calculator-rate-key-collision]
    status: done
    coverage_start: "internal/biz/tax 100 % (CI-Stand 32570176303)"
    scope: >
      `tax.Calculate` rundet die Zeilensteuer auf zwei Stellen, aber nicht den Zeilenbetrag
      selbst: `lineTotal := item.Quantity.Mul(item.UnitPrice)` geht ungerundet in `subtotal`
      und damit in `GrossTotal`. Bei Bruchmengen (1,5 Stunden mal 33,333 EUR) trägt das
      Nettosumme mehr als zwei Nachkommastellen. Der Kommentar über der Funktion behauptet
      ausdrücklich das Gegenteil ("rounded to 2 decimal places at the line level ... prevents
      cent discrepancies"). Die Zusage ist für die Steuer erfüllt, für das Netto nicht.
    sources:
      - backend/internal/biz/tax/calculator.go
      - backend/internal/biz/tax/calculator_test.go
      - backend/internal/biz/einvoice/generator_doc.go
    notes: >
      Vor dem Fix prüfen, was flussabwärts passiert: `assertTotalsMatch`
      (`generator_doc.go:339`) vergleicht gespeicherte gegen berechnete Summen mit einer
      Toleranz. Rundet `tax.Calculate` künftig anders, verschiebt sich diese Differenz — und
      möglicherweise fallen bestehende Rechnungen aus der Toleranz. Die Toleranz mitlesen und
      im Journal nennen, bevor gerundet wird.
      Der Test braucht eine Menge mit Nachkommastellen und einen Preis mit drei Stellen, sonst
      beweist er nichts. Glatte Beträge sind hier ein wertloser Test.
      Nachtrag aus A2 (Lauf 11, Iteration 2): die Toleranz ist seit A2 keine Konstante mehr,
      sondern skaliert mit der Zeilenzahl (`einvoice.totalsTolerance`, 0,005 je Zeile, Boden
      0,01) — genau weil die Schreibseite ungerundet summiert und der Generator seit A2
      gerundet summiert. Wer hier rundet, verkleinert diese Differenz und muss zusammen mit
      `fix-write-path-line-total-unrounded-everywhere` entscheiden, ob die Toleranz zurueck
      auf einen festen Wert kann.
    done_when:
      - Der Zeilenbetrag wird auf zwei Stellen gerundet, bevor er summiert wird
      - Ein Test mit Bruchmenge und dreistelligem Einzelpreis belegt Netto, Steuer und Brutto
        auf exakt zwei Stellen
      - Die Auswirkung auf assertTotalsMatch ist im Journal genannt, mit der Toleranz als Zahl
      - go test -count=1 ./internal/biz/tax/ ./internal/biz/einvoice/ grün

