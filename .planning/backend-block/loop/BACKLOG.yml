      demselben Muster absuchen. Kennzeichen: Schleifen ueber Ergebnismengen, Arithmetik,
      `map[...]`-Aggregation, Sortierung mit fachlicher Bedeutung, Statusuebergaenge, alles
      was mit `decimal.` oder `time.` rechnet.
      Fuer jeden Fund die Frage: ist das nur haesslich, oder ist es ein Ort, an dem ein Fehler
      unbemerkt bliebe, weil ihn kein Service-Test erreicht? Nur Letzteres wird eine Unit.
