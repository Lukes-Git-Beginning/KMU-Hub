      Ablauf)? Was genau darf er sehen? Wie wird tenant-gescopt, wenn kein JWT existiert?
      Es gibt ein verwandtes, bereits gebautes Muster im Repo: die Dokument-Share-Links aus Lauf 3
      (`document_share_links`, Passwort + Ablauf) und die Wiki-Share-Tokens. Beide zuerst lesen —
      wenn eines davon passt, ist das die Antwort, nicht eine dritte Mechanik.
      Traegt die Praemisse nicht oder ist der Sicherheitsentwurf groesser als eine Iteration:
      `blocked` mit den offenen Fragen. Ein halb gebauter unauthentifizierter Endpoint ist das
      schlechteste moegliche Ergebnis.
