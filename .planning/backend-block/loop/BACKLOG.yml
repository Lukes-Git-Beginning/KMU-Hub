      `lead_source = dialer` heben und die Bewertung neu rechnen.
    sources:
      - backend/internal/dialer/service.go
      - backend/internal/crm/contact/lead.go
      - backend/internal/crm/contact/service.go
    notes: >
      Der Schreibpfad ist idempotent auszulegen - Anruf-Ergebnisse laufen ueber
      Idempotenz-Schluessel, und ein zweimal zugestelltes Ergebnis darf den Lebenszyklus nicht
      zweimal umstellen oder die Bewertung verdoppeln. Ein Kontakt, der schon `customer` ist,
      wird NICHT auf `lead` zurueckgestuft - das ist der Fehler, der beim Nachbauen am
      haeufigsten passiert. Der dialer-Dienst ruft crm ueber den gRPC-Client, nie direkt.
