      - desktop/src/renderer/src/api/hooks/useEvents.ts
      - desktop/src/renderer/src/api/hooks/useHolidays.ts
      - backend/api/openapi.yaml
    notes: >
      Beim Flachziehen auch `GET /calendar/events/{id}` (`{event:{event:…}}`, ungenutzt) angleichen,
