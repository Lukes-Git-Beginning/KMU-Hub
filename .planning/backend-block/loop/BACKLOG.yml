    deps: []
    status: todo
    decided: 2026-08-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-08-24: eine der ZWEI namentlich freigegebenen Ausnahmen von der
      `deploy/`-Sperre. Begruendung: `backup.sh` alarmiert seit Lauf 11 per Webhook
      (`trap on_exit EXIT` plus `send_alert()`), aber NUR wenn das Skript selbst laeuft.
      Genau das Szenario, das den zweimonatigen MinIO-Ausfall unbemerkt liess — der Cron-Job
      laeuft gar nicht mehr an, also feuert kein `on_exit` und kein Alarm — bleibt strukturell
      moeglich. `docs/operations/BACKUP.md:52-54` sagt das selbst.
      Freigegeben ist AUSSCHLIESSLICH eine neue Regel in
      `deploy/docker/prometheus/rules/alerts.yml`. KEINE Compose-Aenderung, KEIN neues Env,
      KEINE config.RequireX-Assertion, KEIN Anfassen von backup.sh.
    coverage_start: "n.a. (Ops-Regel, kein Coverage-Ziel)"
    scope: >
      `deploy/docker/prometheus/rules/alerts.yml` fuehrt heute neun Regeln (`ServiceDown`,
      `HighErrorRate`, `HighLatencyP99`, `DBConnectionsHigh`, `HighMemoryUsage`,
      `HighGoroutineCount`, `GRPCHighErrorRate`, `HighWSConnectionCount`, `WSAuthFailures`) —
      keine davon betrifft das Backup.
      Zu bauen ist ein Dead-Man's-Switch: eine Regel, die feuert, wenn seit mehr als
      26 Stunden kein erfolgreicher Backup-Lauf gemeldet wurde. 26 statt 24, damit eine
      normale Laufzeitschwankung des taeglichen Jobs keinen Fehlalarm ausloest.
      ZUERST ERMITTELN, NICHT ANNEHMEN: gibt es ueberhaupt eine Metrik, an der die Regel
      haengen kann? Prometheus sieht nur, was ihm jemand liefert. Wenn `backup.sh` keine
      Metrik schreibt (Pushgateway, Textfile-Collector, node_exporter), dann ist die Regel
      ohne Datenquelle wertlos — und die ehrliche Antwort ist, die Unit auf `blocked` zu
      setzen mit `blocked_reason`, der genau das sagt, statt eine Regel zu schreiben, die
      niemals feuern kann. Das waere schlimmer als keine Regel: eine stille Zusage.
    sources:
      - deploy/docker/prometheus/rules/alerts.yml
      - deploy/scripts/backup.sh
      - docs/operations/BACKUP.md
      - deploy/docker/
    notes: >
      Das ist eine der wenigen Stellen dieses Laufs, an denen die richtige Antwort
      "geht nicht, hier ist der Grund" sein kann. Sie ist dann ein vollwertiges Ergebnis.
      Die uebrigen `deploy/`-Dateien bleiben gesperrt. Auch wenn beim Lesen von `backup.sh`
      etwas auffaellt: als Feststellung ins Journal, nicht als Aenderung.
      Kein Test moeglich (Prometheus laeuft nicht im Gate). Der Beleg ist stattdessen:
      `promtool check rules` auf die Datei, falls verfuegbar — sonst eine sorgfaeltige
      Syntaxpruefung gegen die neun bestehenden Regeln als Vorlage.
    done_when:
      - >-
        Ob eine Metrik existiert, an der eine Backup-Regel haengen kann, ist ermittelt und im
        Journal belegt (mit Fundstelle oder mit der Feststellung, dass keine existiert)
      - >-
        Existiert eine Datenquelle: die Regel steht in alerts.yml, ist syntaktisch geprueft und
        ihr Schwellwert ist begruendet
      - >-
        Existiert keine: die Unit ist blocked mit einem blocked_reason, der sagt, was gebaut
        werden muesste, damit sie moeglich wird
      - Ausser alerts.yml ist keine Datei unter deploy/ veraendert (git diff belegt das)

  - id: doc-align-smtp-provider-templates-eu
    phase: 4
    service: deploy
    model: sonnet
    deps: []
    status: todo
    decided: 2026-08-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-08-24: zweite der beiden namentlich freigegebenen Ausnahmen von
      der `deploy/`-Sperre. Begruendung: die beiden Betriebsvorlagen widersprechen sich in
      einer Frage, die fuer das Versprechen der EU-Datensouveraenitaet zentral ist.
      `deploy/docker/PRODUCTION_TEMPLATE:41` empfiehlt woertlich "Postmark/SES/Mailgun" —
      drei US-Anbieter. `deploy/ansible/roles/secrets/templates/env.production.j2:36` nennt
      "External Brevo (or other)" — Frankreich. Wer nach der einen Vorlage provisioniert,
      baut etwas anderes als wer nach der anderen geht.
      Freigegeben ist AUSSCHLIESSLICH die Angleichung der KOMMENTARE/EMPFEHLUNGEN in diesen
      beiden Dateien. KEINE Aenderung eines gesetzten Werts, KEIN neues Env, KEINE
      Compose-Aenderung. Der Go-Default bleibt leer (`config.go:205`) — das ist korrekt.
    coverage_start: "n.a. (Doku-Unit, kein Coverage-Ziel)"
    scope: >
      Beide Vorlagen auf dieselbe Empfehlung bringen: EU-ansaessige Versanddienste, mit
      einem kurzen Satz, WARUM (Auftragsverarbeitung im EU-Raum, keine
      Drittlandsuebermittlung nach Kapitel V DSGVO ohne zusaetzliche Grundlage).
      Vorher pruefen, ob es noch weitere Stellen gibt, die einen SMTP-Anbieter empfehlen —
      `deploy/`, `docs/`, `.env.example` und die Ansible-Rollen mit einem breiten Grep nach
      Anbieternamen absuchen (postmark, sendgrid, mailgun, ses, brevo, sendinblue,
      mailjet). Root Cause statt Symptom: wenn eine dritte Vorlage existiert, gehoert sie in
      dieselbe Unit.
      Keine Empfehlung fuer einen KONKRETEN Anbieter aussprechen, die ueber das hinausgeht,
      was schon dasteht — die Anbieterwahl ist eine Geschaeftsentscheidung. Es geht darum,
      dass die Vorlagen einander nicht widersprechen und dass das EU-Kriterium benannt ist.
    sources:
      - deploy/docker/PRODUCTION_TEMPLATE
      - deploy/ansible/roles/secrets/templates/env.production.j2
      - backend/internal/config/config.go
      - docs/
    notes: >
      Der Go-Default fuer den SMTP-Host ist leer und soll leer bleiben. Diese Unit setzt
      keinen Wert, sie raeumt die Empfehlung auf.
      Falls beim Grep auffaellt, dass eine Vorlage einen Anbieter nicht nur empfiehlt,
      sondern als Default SETZT: das ist ein Befund und gehoert ins Journal — geaendert wird
      er in dieser Unit NICHT, weil ein gesetzter Wert in einer Provisionierungsvorlage ein
      Deploy-Hazard ist.
      Kein Test moeglich. Der Beleg ist der Diff und die Grep-Liste im Journal.
    done_when:
      - >-
        Beide Vorlagen empfehlen dasselbe Kriterium (EU-Ansaessigkeit) mit derselben kurzen
        Begruendung
      - >-
        Die Grep-Liste aller Fundstellen, die einen SMTP-Anbieter nennen, steht im Journal;
        jede weitere Fundstelle ist mitgezogen oder als bewusst ausgelassen begruendet
      - Kein gesetzter Wert wurde geaendert, nur Kommentare und Empfehlungen (git diff belegt das)
      - >-
        Ausser den beiden genannten Dateien ist keine Datei unter deploy/ veraendert, ausser
        einer dritten Vorlage, die der Grep gefunden hat und die im Journal benannt ist

# ==========================================================================================
# BLOCK D — MUSTER-SCANS, am Schluss. Sie referenzieren die in A bis C gebauten Fälle als
# Vorlage und LEGEN JEDEN FUND ALS NEUE UNIT AM BACKLOG-ENDE AN. `neue-units:` ist Pflichtzeile
# und muss IDs nennen, die wirklich in dieser Datei stehen — ein Fund ohne Unit ist kein Fund.
#
# Scan-Units ändern KEIN Verhalten außer dem Anlegen von Units. Kein Fix, kein Test, kein
# Refactor. Eine Scan-Unit ohne Funde ist ein gültiges Ergebnis — aber die `offen:`-Zeile muss
# dann sagen, WAS tief geprüft, WAS nur gegrept und WAS gar nicht angesehen wurde.
# In Lauf 10 haben 9 Scans 45 Zusatz-Units erzeugt.
# ==========================================================================================

  - id: scan-idempotency-on-stock-and-money-mutating-routes
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Scan, kein Coverage-Ziel)"
    scope: >
      Erster Scan, mit der klarsten Hypothese des Laufs. Drei Units in Block B stossen
      unabhaengig auf dasselbe Muster: eine Route, die Bestand oder Verbindlichkeit
      veraendert, ohne dass belegt ist, dass ein zweiter Aufruf nicht doppelt bucht —
      `HandleBookPickingList` (Inventar), `HandleReceiveGoods`/`HandlePartialReceive`
      (Einkauf), `HandleApplyTemplate` (Schichten). Block A2 hat mit
      `harden-caldav-rest-routes-missing-idempotency` einen vierten Fall an einer ganz
      anderen Stelle gefunden.
      Zu tun: systematisch ermitteln, welche mutierenden Routen NICHT durch
      `authWithIdempotency` laufen. Der Weg ist NICHT ein Grep ueber die Handler, sondern ueber
      die REGISTRIERUNG: von `cmd/gateway/main.go` aus jede Registrar-Funktion verfolgen und
      notieren, welche Middleware-Kette sie bekommt. Genau der zu enge Grep auf die
      Handler-Datei hat in Lauf 11 die HR-Praemisse falsch gemacht.
      Ergebnis ist eine Liste: Route, Methode, Kette, und ob die Operation fachlich
      wiederholbar ist. Eine GET-Route braucht keine Idempotency; eine Route, die einen
      Zustandsuebergang ausloest, schon.
    sources:
      - backend/cmd/gateway/main.go
      - backend/internal/gateway/
      - backend/internal/middleware/idempotency.go
      - backend/internal/gateway/route_hr.go
    notes: >
      Die Middleware laeuft produktiv im WarnMode. Der Scan bewertet nicht, ob der Modus
      richtig ist — er stellt fest, welche Routen ueberhaupt die Moeglichkeit haben.
      Fuer jede gefundene Luecke EINE Unit, gruppiert nach Registrar (nicht je Route) —
      sonst entsteht eine Kette wie die beiden Doku-Ketten aus Lauf 11, die aus dem Loop
      genommen werden mussten.
    done_when:
      - >-
        Die Liste aller mutierenden Routen mit ihrer Middleware-Kette steht im Journal, ueber
        die Registrierung ermittelt und nicht ueber einen Handler-Grep
      - Fuer jede Luecke ist eine Unit angelegt, gruppiert nach Registrar
      - >-
        Die offen:-Zeile nennt, welche Registrare tief geprueft und welche nur gegrept wurden
      - Kein Verhalten geaendert (git diff zeigt nur BACKLOG.yml und JOURNAL.md)

  - id: scan-resource-double-booking-race
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    coverage_start: "n.a. (Scan, kein Coverage-Ziel)"
    scope: >
      Zweiter Scan mit belegter Hypothese. Vier Stellen im Lauf pruefen unabhaengig dieselbe
      Frage: kann dieselbe Ressource zweimal gleichzeitig belegt werden?
      Kalenderressourcen (`cov-gateway-calendar-resources-and-reminders`),
      Vermietungsobjekte (`cov-vermietung-repository-lowest-coverage-in-backend`),
      Maschinenbuchungen (`cov-gateway-produktion-planning-and-capacity`) und
      Fahrzeugbuchungen (`vehicle_bookings`, in Block A ueber die Retention beruehrt).
      Block A haertet mit `harden-quote-conversion-unique-index` genau dieses Muster an einer
      fuenften Stelle — und zwar mit der richtigen Loesung: ein partieller Unique-Index, nicht
      ein weiterer Read-vor-Write-Check im Service.
      Zu tun: alle Belegungsmodelle im Schema finden (Tabellen mit einem Zeitraum und einem
      Bezug auf ein belegtes Objekt), fuer jedes ermitteln, ob eine DB-seitige Sperre
      existiert (Unique-Index, Exclusion-Constraint, Advisory-Lock) oder nur ein
      Anwendungs-Check, und das Ergebnis als Tabelle ins Journal schreiben.
      PostgreSQL hat fuer genau diesen Fall `EXCLUDE USING gist` mit `tstzrange` — pruefen,
      ob eine der Tabellen es schon nutzt; falls ja, ist das die Vorlage fuer die uebrigen.
    sources:
      - backend/migrations
      - backend/internal/work/resource/
      - backend/internal/vermietung/
      - backend/internal/produktion/
      - backend/internal/fuhrpark/
    notes: >
      Die Loesung ist je Tabelle eine Migration und damit `model: opus` fuer die Folge-Units.
      Der Scan legt sie an, er baut sie nicht.
      Vor jeder angelegten Unit die Frage stellen, die `harden-quote-conversion-unique-index`
      gebraucht hat: liegen in den Daten bereits Ueberschneidungen? Dann scheitert die
      Migration beim Anlegen des Index. Die noetige Abfrage gehoert in die `notes` der
      angelegten Unit, damit Luke sie gegen Produktion laufen lassen kann.
    done_when:
      - >-
        Alle Belegungsmodelle im Schema sind gefunden und mit ihrer heutigen Absicherung
        (DB-seitig, Anwendung, keine) als Tabelle im Journal belegt
      - >-
        Fuer jede Tabelle ohne DB-seitige Sperre ist eine opus-Unit angelegt, jeweils mit der
        Produktionsabfrage nach vorhandenen Ueberschneidungen in den notes
      - >-
        Ob eine Tabelle bereits EXCLUDE USING gist nutzt, steht im Journal — falls ja, ist sie
        als Vorlage benannt
      - Kein Verhalten geaendert

