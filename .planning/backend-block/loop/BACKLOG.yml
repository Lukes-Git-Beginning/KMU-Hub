  - id: helpdesk-kb-content-opaque
    phase: 3
    service: helpdesk
    model: sonnet
    deps: []
    status: todo
    scope: >
      Bestaetigen und absichern, dass `helpdesk_kb_articles.content` serverseitig opak
      behandelt wird. Das FE speichert dort seit G3 ein Block-Dokument-JSON statt HTML
      (shared Block-Engine wie wiki und berichte), Legacy-HTML bleibt lesbar.
    sources:
      - backend/migrations/
      - backend/internal/helpdesk/
      - desktop/src/renderer/src/modules/helpdesk/kb-blocks.ts
    notes: >
      Geprueft am 2026-08-05: `content` ist TEXT NOT NULL DEFAULT '', und es gibt serverseitig
      KEINEN Sanitizer (kein bluemonday im gesamten Backend). Solange der Inhalt Block-JSON ist
      und clientseitig ueber die Registry gerendert wird ist das korrekt — Sanitizing wuerde
      das JSON zerstoeren.
      Die eigentliche Arbeit hier ist klein und defensiv: eine Groessenbegrenzung damit ein
      Artikel die Zeile nicht unbegrenzt aufblaeht, und ein Kommentar an der Spalte bzw. im
      Service der festhaelt WARUM nicht sanitized wird. Ohne diesen Kommentar repariert das
      in sechs Monaten jemand mit einem HTML-Sanitizer und zerlegt alle Artikel.
      Falls sich beim Lesen herausstellt dass content doch irgendwo als HTML gerendert oder
      weitergereicht wird: Unit auf blocked, Fund ins Journal. Das waere dann eine echte
      XSS-Flaeche und keine Kosmetik.
    done_when:
      - Groessenbegrenzung fuer content serverseitig durchgesetzt
      - Kommentar haelt fest warum nicht sanitized wird, Block-JSON und Client-Registry
      - nachgewiesen dass content nirgends serverseitig als HTML behandelt wird
      - Legacy-HTML-Inhalte bleiben lesbar

