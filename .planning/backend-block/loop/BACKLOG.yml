      Bug in den bestehenden Tests (`postgres_repository_reads_test.go`,
      `tenant_write_test.go`) nicht auf: `seedGuestSession` setzt `ip_address` dort nie. Traegt
      eine Guest-Session aber eine ECHTE IP (der Normalfall bei realen Gast-Chat-Besuchen ueber
      `CreateSession`, die die Anfrage-IP mitgibt), schlagen alle drei Lesepfade fehl -- der
      Gast-Chat-Widget-Login (`GetSessionByTokenHash`, jeder Folge-Request eines Gasts),
      die Admin-Sessionsliste pro Kanal (`ListSessionsByChannel`) und `GetSessionByID` sind
      damit fuer jede Session mit gesetzter IP unbenutzbar.
