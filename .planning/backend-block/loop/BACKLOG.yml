  - id: fix-document-share-link-survives-file-deletion
    phase: 4
    service: document
    model: sonnet
    deps: []
    status: todo
    coverage_start: n.a. (Bugfix, kein Coverage-Ziel)
    scope: >
      VERIFIZIERTER BEFUND (2026-08-26, gefunden beim Bauen von
      `cov-document-file-repository-and-service`, siehe
      `TestCreateShareLink_DeletedFile_NotRejected` und
      `TestRedeemShareLink_DeletedFile_StillDownloadable`,
      `internal/document/file/service_test.go`). Jeder andere Lesepfad in `service.go`, der mit
      einem tenant-gescopten `s.repo.GetByID` beginnt, prueft danach explizit `file.IsDeleted`
      und lehnt mit `ErrFileDeleted` ab: `GetDownloadURL` (Zeile 772), `LinkToEntity` (962),
      `Move` (747), `Copy` (665), `CreateVersion` (820), `RevertVersion` (888),
      `GetVersionDownloadURL` (788). `CreateShareLink` (224) und `RedeemShareLink` (330) tun das
      nicht. `Delete` loescht bewusst nicht aus MinIO ("Does NOT remove from MinIO (enables
      recovery)") — das bedeutet in der Praxis: (1) fuer eine bereits geloeschte Datei kann
      weiterhin ein neuer, oeffentlicher, unauthentifizierter Share-Link erzeugt werden, und
      (2) ein Share-Link, der VOR dem Loeschen erzeugt wurde, liefert nach dem Loeschen
      unveraendert weiter einen funktionierenden Presigned-Download — die Sichtbarkeit endet
      nicht mit dem "Loeschen" der Datei. Ein Nutzer, der eine Datei aus Compliance- oder
      Datenschutzgruenden loescht, geht davon aus, dass damit auch der oeffentliche Zugriff
