    scope: >
      BEFUND aus `scan-blind-aggregation-over-units-and-currencies` (Dimension Zeitzone).
      Tages- und Wochengrenzen der Arbeitszeit werden mit `time.Time.Location()` des Aufrufers
      gebildet (`timetracking.GetDailySummary`: `dayStart := time.Date(..., date.Location())`,
