    notes: >
      DAS AUDIT-LOG IST AUSDRUECKLICH LEGITIM. `internal/security/audit` speichert absichtlich,
      wer wann was getan hat — inklusive IP. Das ist die Rechtsgrundlage selbst und darf nicht
      als Fund gemeldet werden. Es geht um das ANWENDUNGSLOG (slog), nicht um das Auditlog.
      Ebenfalls kein Fund: eine ID (UUID) in einer Logzeile. Sie ist personenbeziehbar, aber
      ohne die Datenbank wertlos, und ohne sie ist kein Fehler nachvollziehbar.
      Echte Funde: die vollstaendige E-Mail-Adresse im Klartext, der Nachrichteninhalt, ein
      Token oder Anmeldedaten, ein vollstaendiger Request-Body.
