      weder in `video.proto` noch in `VideoService_ServiceDesc` — selbst mit Codec würde der
      Server `Unimplemented` liefern (`VideoService_ConfirmInitiatorConsent_Handler` wird nirgends
      registriert). Kein Test geht über den Draht: die Server-Tests rufen `ts.srv.…` direkt, die
      Gateway-Tests stoppen am 503. Die Datei kündigt selbst "replaced by regenerated proto
      output (Sprint 4 proto-regen task)" an — das ist nie passiert.
      Das Desktop (`CallControls.tsx:134`, `handleConfirmStart`) ruft die Route nach
      `startRecording` auf und zeigt bei Fehler den Toast "Aufnahme-Bestaetigung fehlgeschlagen" —
      die Aufnahme-Bestätigung kann also nie gelingen. VOR dem Bauen prüfen, ob der Rest der
      Kette überhaupt trägt: `recording.Service.StartRecording` verlangt mit gewiredetem
      `PreConsentChecker` (`cmd/work/main.go:146`) die Zustimmung VOR dem Anlegen der Zeile,
      `MarkInitiatorConsent` stempelt aber eine bestehende Zeile (`started_by = userID`). Ob
      Start und Stempel in dieser Reihenfolge je zusammenpassen, ist offen — und ob egress
      (`s.enabled`) in Produktion überhaupt konfiguriert ist (sonst ist die Aufnahme ohnehin aus
      und die Unit nur noch Vertragsreparatur).
      Lösung: RPC in `backend/proto/video/v1/video.proto` aufnehmen, `make proto-video`, die
      handgeschriebene Ext-Datei löschen, `VideoGRPCServer` auf das generierte Interface
      umstellen, Gateway-Client auf `NewVideoServiceClient`. Wire-Test: echter gRPC-Server mit
      generiertem Service, Gateway-Handler dagegen (2xx, 412 bei `stamped=false`, JWT-User kommt
      im Request an und nicht ein fremder).
    sources:
