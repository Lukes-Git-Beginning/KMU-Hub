    phase: 4
    service: rapporte
    model: sonnet
    deps: []
    status: todo
    coverage_start: n.a. (Bugfix, kein Coverage-Ziel)
    scope: >
      VERIFIZIERTER BEFUND (2026-08-27, gefunden beim Bauen von
      `fix-rapporte-measurement-position-cross-tenant-insert`). Dieselbe Fehlerklasse wie dort,
      nur eine Ebene hoeher: `RapporteGRPCServer.AddWorker` (server/rapporte_grpc.go:539) und
      `RapporteGRPCServer.CreateMeasurement` (server/rapporte_grpc.go:600) reichen die
      `report_id` aus dem Request unveraendert an `s.repo.AddWorker` bzw.
      `s.repo.CreateMeasurement` durch, ohne vorher `GetReport(ctx, tenantID, reportID)` zu
      rufen. Beide Repository-Funktionen fuegen mit einem reinen `VALUES`-INSERT ein
      (postgres_repository.go:446 bzw. 512); der FK auf `work_reports(id)` prueft nur Existenz,
      nicht Eigentum, und die RLS-Policy prueft die `tenant_id` der NEUEN Zeile. Tenant A kann
      also einen Mitarbeiter-Eintrag (mit `hours`, abrechnungsrelevant) bzw. ein Aufmass an
      einen fremden Report haengen; die Zeile ist fuer Tenant A unsichtbar, haengt aber an
      Tenant B's Report und wird von dessen CASCADE mitgeloescht.
      Der Gegenbeweis, dass das kein Generalproblem ist: `Service.AddLine`
      (rapporte/service.go:377) und `Service.UploadAttachment` (service.go:503) rufen beide
      vorher `s.repo.GetReport(ctx, input.TenantID, input.ReportID)` — die beiden gRPC-Handler
      sind die zwei Stellen, die am Service vorbei direkt auf das Repository gehen.
      Fix analog zum bereits gebauten: Guard in die Repository-Funktion, nicht in den Handler
      (`INSERT ... SELECT ... WHERE EXISTS (SELECT 1 FROM work_reports WHERE id=$n AND
      tenant_id=$m)` + `RowsAffected()==0` -> `ErrReportNotFound`). Bei `CreateMeasurement` ist
      `reportID` optional (`*uuid.UUID`) — der Guard darf nur greifen, wenn er gesetzt ist.
      Nebenbefund fuer denselben Commit pruefen: `CreateAttachment` traegt neben `report_id`
      auch eine optionale `line_id`, die nirgends gegen den Report/Tenant geprueft wird.
    sources:
