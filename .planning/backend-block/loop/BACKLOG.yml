      - Der Flow läuft als member nach dem Login, nicht als admin

  - id: fix-notification-send-action-is-a-stub
    phase: 4
    service: automation
    model: opus
    deps: []
    status: done
    decided: '2026-10-29'
    decision: >
      ENTSCHEIDUNG LUKE, 2026-10-29: Zustellung über den Event-Bus. Die Action publiziert ein Event, der vorhandene
      `InboxConsumer` im Notification-Service legt daraus Inbox-Nachricht und WebSocket-Push an. Keine neue RPC, kein
      Proto. Pflicht: Automation darf auf das eigene Event nicht wieder triggern.
    target: notification.send stellt wirklich eine Benachrichtigung zu, statt Erfolg zu melden
    coverage_start: n.a. (Bugfix)
    scope: >
      Stub, verifiziert in Lauf 17 Iteration 116 (Fund aus `cov-automation-action`).
      `SendNotificationAction.Execute` (`internal/automation/action/notification_actions.go`) erzeugt eine
      Zufalls-UUID, schreibt eine Logzeile und meldet `Success: true`. Es wird nichts zugestellt, `deep_link` wird nie
      gelesen. Registriert in `cmd/automation/main.go:121`, Teil der Vorlagen in
      `internal/automation/template/templates.go`. Fehlerklasse 2 (Stub statt Implementierung).
      Weg: Der Notification-Service registriert `eventBus.RegisterHandler("*", inboxConsumer.HandleEvent)`
      (`cmd/notification/main.go:211`), `HandleEvent` (`:421`) legt je `TargetUserIDs`-Eintrag eine `InboxMessage` mit
      `Title`/`Body`/`DeepLink` an und sendet `pg_notify` für den WS-Push. Die Action publiziert also ein
      `models.EventPayload` (TenantID aus dem Ausführungskontext, ModuleID automation, eigener Typ z. B.
      `automation.notification`, ResourceID = Ausführungs- bzw. Schritt-ID für die Dedup über `source_id`) über den
      Bus, den der Automation-Service schon hält (`cmd/automation/main.go:168`). SCHLEIFENSCHUTZ: Automation registriert
      selbst `*`; das eigene Event darf keinen Workflow auslösen (Skip auf ModuleID automation bzw. den Typ, mit
      Test). Der Ziel-Nutzer muss zum Tenant der Ausführung gehören; prüfen, wo das am billigsten geht (Action oder
      Consumer), ein fremder Nutzer erzeugt keine Nachricht.
    sources:
      - backend/internal/automation/action/notification_actions.go
      - backend/cmd/automation/main.go
      - backend/cmd/notification/main.go
      - backend/internal/automation/template/templates.go
    notes: >
      Der Test `TestSendNotificationAction_ResolvesTargetAndReturnsID` pinnt das Stub-Verhalten und ist beim Fix
      umzuschreiben. Die gemeldete ID ist danach die echte Event- bzw. Nachrichten-ID, nicht mehr zufällig.
    done_when:
      - 'Test: Ausführung publiziert genau ein Event mit Tenant, Ziel-Nutzer, Titel, Text und deep_link; Publish-Fehler ergibt Success:false'
      - 'Test: Das Event der Action löst in Automation keinen Workflow aus (Schleifenschutz)'
      - 'Test gegen echte DB als kmuhub_app: der Consumer legt die Inbox-Nachricht für den Ziel-Nutzer an, ein Nutzer aus fremdem Tenant bekommt keine'
      - go test -count=1 für internal/automation/... und den Notification-Consumer grün, DATABASE_URL gesetzt, 0 Skips

  - id: harden-csat-token-minted-at-dispatch
    phase: 4
    service: helpdesk
    model: opus
    deps: []
    status: done
    decided: '2026-10-26'
    decision: >
      ENTSCHEIDUNG LUKE, 2026-10-26 (Morgen-Check Lauf 17, Variante b): Das CSAT-Token entsteht erst beim Versand im
      Dispatcher, gespeichert wird nur der Hash. Die CSAT-Sperre ist für genau diesen Umbau des Dispatch gelockert;
      CSAT bleibt aus.
    target: kein CSAT-Token mehr im Klartext
    coverage_start: n.a.
    scope: >
      Heute mintet das Schließen des Tickets das Token, der Dispatcher liest es später per `ListDueCsatSurveys`
      (`helpdesk/postgres_repository.go:519`, `SELECT r.token`) und baut den Link (`csat_dispatch.go:288`). Neu: beim
      Schließen nur die fällige Umfrage ohne Token anlegen; der Dispatcher claimt sie, mintet per `linksecret.New`,
      speichert den Hash im selben Claim und verschickt die Mail. Die Lookup-Route hasht das vorgelegte Token.
      Migration: Bestand backfillen wie 000351, Klartext-Spalte entfernen. Scheitert der Versand nach dem Claim, darf
      ein Retry ein neues Token minten (alter Hash wird ersetzt).
    sources:
      - backend/internal/helpdesk/csat_survey.go
      - backend/internal/helpdesk/csat_dispatch.go
      - backend/internal/helpdesk/postgres_repository.go
    notes: >
      Vorbedingung `harden-share-tokens-hashed-wiki-formulare` ist in Lauf 17 gebaut (archive/lauf-17), daher keine
      deps mehr. `internal/linksecret` und das Migrationsmuster 000351 stammen von dort.
    done_when:
      - 'DB-Test: Dispatcher verschickt einen gültigen Link, in der DB steht nur der Hash, Bestands-Token gültig'
      - 'Test: Retry nach Versandfehler ersetzt den Hash, der alte Link ist ungültig'

  - id: feat-hr-team-documents-for-managers
