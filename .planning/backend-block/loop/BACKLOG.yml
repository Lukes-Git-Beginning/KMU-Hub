  - id: fix-biz-actor-attribution-uuid-nil
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: done
    coverage_start: "internal/server 74,8 %"
    scope: >
      VERIFIZIERT bei der Vorbereitung (2026-10-23), Klasse (b) "nur Attribution fehlt, wird
      aber persistiert". `internal/server/biz_grpc.go` übergibt an sieben Stellen `uuid.Nil` als
      Akteur, fünfmal mit dem Kommentar "Proto doesn't include user_id; use uuid.Nil (gateway
      handles auth)": Z. 437 `quoteService.Send`, 521 `invoiceService.CreateFromQuote`, 725
      `invoiceService.Send`, 762 `invoiceService.Cancel`, 871 `creditNoteService.Send`, 1053
      `dunningService.Send`, 2527 `dunningService.SendDunningNotice`.
      Nichts davon blockiert (die Spalten sind NOT NULL ohne FK, `invoice/service.go:327`),
      aber der Nullwert LANDET IN DER DB: `CreateFromQuote` setzt `UserID: userID`
      (`invoice/service.go:848`) -> `created_by` der Rechnung; `Cancel` reicht ihn an
      `creditNoteService.StornoInvoice` (`creditnote/service.go:243`, `UserID: userID`) ->
      `created_by` der Storno-Gutschrift; die Mahnung protokolliert `sent_by`
      (`dunning/service.go`, `sendAndNotify`). Bei GoBD-relevanten Belegen ist "wer hat
      storniert/versendet" Teil der Nachvollziehbarkeit.
      Fix wie `ea5a39a9`: `callerID(ctx)` statt `uuid.Nil`, Kommentare entfernen. Das Proto
      braucht dafür KEIN `user_id`-Feld — der Aufrufer kommt aus den gRPC-Metadaten.
    sources:
      - backend/internal/server/biz_grpc.go
      - backend/internal/server/calendar_grpc.go
      - backend/internal/biz/invoice/service.go
      - backend/internal/biz/creditnote/service.go
      - backend/internal/biz/dunning/service.go
      - backend/internal/biz/dunning/service_gobd.go
      - backend/internal/biz/quote/service.go
    notes: >
      Je Stelle prüfen, wohin der Akteur geht (Spalte, Audit-Event, Log) und das im Journal
      tabellieren. Bestehende Tests, die mit `uuid.Nil` als Akteur grün sind, auf einen echten
      Aufrufer umstellen (Regel 1 im Kopf), nicht den Fix an sie anpassen.
    done_when:
      - "DB-Test: Rechnung stornieren als Nutzer X -> Storno-Gutschrift trägt created_by = X"
      - "DB-Test: Rechnung aus Angebot als Nutzer X -> Rechnung trägt created_by = X"
      - "Test: Mahnung senden als Nutzer X -> sent_by = X"
      - "Mutations-Probe: uuid.Nil an der Cancel-Stelle zurück, der Storno-Test wird rot"
      - "go test -count=1 ./internal/server/ ./internal/biz/... grün, DATABASE_URL gesetzt, 0 Skips"

