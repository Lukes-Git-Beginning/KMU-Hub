      `RequirePermissionAny`, wenn ueberhaupt ein zweiter Key noetig ist.
      Der Test ist der Kern dieser Unit, nicht die Implementierung: ein Nutzer ohne
      `finanzen:module:view` fragt `?modules=finanzen` an und bekommt nachweislich KEINE
      Finanz-KPI zurueck.
