      - Test deckt einen verletzenden und einen zulaessigen Plan ab

  - id: a-fuhrpark-vehicle-booking
    phase: 3
    service: fuhrpark
    model: opus
    deps: []
    status: todo
    scope: >
      Fahrzeugbuchung mit Konfliktpruefung (Pool-Nutzung). Verifiziert 2026-08-07 - unter den
      27 `/api/v1/fuhrpark/*`-Pfaden gibt es keine Buchung. Neue Tabelle `vehicle_bookings`
      (tenant_id, vehicle_id -> vehicles, user_id, starts_at, ends_at, purpose TEXT NULL,
      status) plus CRUD-Routen unter `/api/v1/fuhrpark/bookings` und eine Ablehnung mit 409,
      wenn sich das Intervall mit einer bestehenden Buchung desselben Fahrzeugs ueberschneidet.
    sources:
      - backend/internal/produktion/postgres_repository.go
      - backend/internal/produktion/errors.go
      - backend/internal/fuhrpark/service.go
      - backend/internal/gateway/route_fuhrpark.go
    notes: >
      Die Ueberschneidungspruefung NICHT neu entwerfen - `internal/produktion/postgres_repository.go:282-286`
      macht genau das fuer `machine_bookings` (halboffenes Intervall [startsAt, endsAt)), und
      `produktion/errors.go:11` haelt das passende Sentinel `ErrBookingConflict`. Dasselbe
      Muster uebernehmen, inklusive der halboffenen Semantik - sonst kollidieren zwei
      Buchungen, die sich nur an der Grenze beruehren. Konflikt = 409, nicht 400. `tenant_id
      UUID NOT NULL` + `CALL enable_tenant_rls('vehicle_bookings')`. Die Konfliktabfrage muss
      selbst tenant-gescopt sein, sonst blockiert ein fremder Tenant Buchungen.
    done_when:
      - Migration legt vehicle_bookings an, tenant_id NOT NULL + RLS, up und down gefuellt
      - Ueberlappende Buchung liefert 409, angrenzende (ends_at == starts_at) wird angenommen
      - Konfliktabfrage tenant-gescopt, belegt durch einen Cross-Tenant-Test
      - Alle Routen in api/openapi.yaml, go test ./internal/gateway/ gruen

