  # --- admin ----------------------------------------------------------------

  - id: p3-admin-invite-flow
    phase: 3
    service: admin
    model: opus
    deps: []
    status: todo
    scope: >
      User-Invite-Flow: Einladung erzeugen, Token, Annahme, Seat-Verbrauch.
