units:

  - id: fix-rapporte-reject-without-reason
    phase: 3
    service: rapporte
    model: sonnet
    deps: []
    status: done
    scope: >
      `RejectReport` (internal/rapporte/service.go:333) validiert nirgends, dass `ReviewNote`
      nicht leer ist, obwohl der Backlog-Scope von `b-cov-server-rapporte` selbst "Ablehnen
      ohne Begruendung muss scheitern" fordert. Verifiziert ueber den gesamten Pfad: der
      gRPC-Handler `RejectReport` (internal/server/rapporte_grpc.go:224) reicht
      `req.GetReviewNote()` ungeprueft durch, der Service validiert nur `TenantID`/`ReportID`
      via UUID-Parse und ruft direkt `s.repo.AtomicRejectReport(...)` auf, und das Repository
      (`postgres_repository.go`, `AtomicRejectReport`) schreibt `review_note` als beliebigen
      String ohne NOT-NULL- oder Laengen-Constraint (Migration, in der `report_workflow`-Spalten
      angelegt wurden, hat keine CHECK-Klausel dafuer). Ein leerer oder reiner Whitespace-String
      wird also klaglos als Ablehnungsgrund akzeptiert. `ApproveReport` hat dasselbe Feld
      (`ReviewNote`), aber dort ist eine leere Begruendung fachlich unproblematisch - nur
      `RejectReport` hat laut Scope die explizite Anforderung.
    sources:
      - backend/internal/rapporte/service.go
      - backend/internal/server/rapporte_grpc.go
      - backend/internal/rapporte/postgres_repository.go
      - backend/internal/rapporte/errors.go
    notes: >
      Gefunden waehrend b-cov-server-rapporte (Lauf 7, Iteration 19) - im Backlog-Scope selbst
      als done_when-Kriterium benannt ("Ablehnen ohne Begruendung scheitert"), beim Lesen von
      service.go/rapporte_grpc.go/postgres_repository.go bestaetigt statt nur vermutet. Nicht in
      der Coverage-Unit gefixt - echte Verhaltensaenderung (neue Validierung), keine
      Coverage-Aenderung, nach Backlog-Regel eine eigene Unit. Fix-Vorschlag: in
      `Service.RejectReport` (service.go:333) vor dem Repository-Aufruf pruefen, dass
      `strings.TrimSpace(input.ReviewNote) != ""`, sonst `ErrInvalidInput` zurueckgeben - exakt
      das Muster, das `AddLine`/`UpdateLine` schon fuer `Description` verwenden (Trim + Leer-Check
      -> ErrInvalidInput). `mapRapporteError` bildet `ErrInvalidInput` bereits auf
      `codes.InvalidArgument` ab, keine neue Fehlerklasse noetig. `RejectReportInput.ReviewNote`
      bleibt `string` (kein Zeigertyp noetig, ein leerer String ist bereits eindeutig ablehnbar).
    done_when:
      - RejectReport mit leerem oder reinem Whitespace-ReviewNote liefert ErrInvalidInput /
        codes.InvalidArgument statt die Ablehnung anzunehmen
      - RejectReport mit nicht-leerem ReviewNote funktioniert unveraendert
      - ApproveReport bleibt bewusst ohne diese Pflicht (nicht Teil des Scopes)
      - Test fuer den leeren Fall in internal/rapporte (Service-Ebene) und internal/server
        (Handler-Ebene, Fehler-Mapping) ergaenzt
      - go test -count=1 ./internal/rapporte/... ./internal/server/... gruen

  - id: fix-einkauf-contract-call-no-value-check
    phase: 3
    service: einkauf
    model: sonnet
    deps: []
    status: todo
    scope: >
      `Service.CreateContractCall` (internal/einkauf/service_extended.go:610) validiert nur,
      dass der Abrufbetrag nicht-negativ ist (`v < 0`) - es gibt keinen Vergleich gegen
      `framework_contracts.total_value` oder den bereits verbrauchten `used_value`. Jeder
      Abruf, egal wie hoch, wird angenommen; `UpdateContractUsedValue` (postgres_repository_
      extended.go:403) rechnet danach nur die Summe aus `framework_contract_calls` neu und
      schreibt sie zurueck - rein informativ, keine Schranke. Ein Rahmenvertrag ueber 5.000 EUR
      lässt sich damit beliebig oft und beliebig hoch abrufen, ohne dass irgendeine Schicht
      (Gateway-Handler, Service, Repository, DB-Constraint) das ablehnt.
    sources:
      - backend/internal/einkauf/service_extended.go
      - backend/internal/einkauf/postgres_repository_extended.go
      - backend/internal/gateway/route_einkauf_extended.go
      - backend/internal/einkauf/models_extended.go
    notes: >
      Gefunden waehrend b-cov-gateway-einkauf-extended (Lauf 7, Iteration 16) - im Backlog
      selbst als Verdacht benannt ("ein Abruf ueber die Rahmenvertragsmenge hinaus ist der
      Fall, an dem eine fehlende Pruefung sichtbar wird"), per Code-Lektuere von Service UND
      Repository bestaetigt statt nur vermutet. Nicht in der Coverage-Unit gefixt - echte
      Verhaltensaenderung, keine Coverage-Aenderung, nach Backlog-Regel eine eigene Unit.
      Fix-Vorschlag: vor dem Insert `total_value - used_value` (oder die Summe bestehender
      Calls) laden und den neuen Betrag dagegen pruefen, Ueberschreitung als `ErrInvalidInput`
      oder eigenen Sentinel ablehnen. Ob eine Teilausschoepfung ueberhaupt erlaubt sein soll
      oder ob Ueberschreitung je nach Vertragsstatus zulaessig ist (z. B. `draft`), ist eine
      Produktfrage - kurz mit Luke klaeren, bevor der Fix geschrieben wird.
    done_when:
      - Abruf, der total_value (abzueglich bereits verbrauchtem used_value) uebersteigt, wird
        abgelehnt statt angenommen
      - Verhalten bei Vertragsstatus != active geklaert und getestet (falls relevant)
      - DB-Test gegen das reale Schema fuer den Ablehnungsfall
      - go test -count=1 ./internal/einkauf/... gruen

  - id: fix-plugin-error-mapping-gaps
    phase: 3
    service: plugin
    model: sonnet
    deps: []
    status: todo
    scope: >
      `mapPluginError` (internal/server/plugin_grpc.go:829) hat zwei getrennte Luecken,
      beide durch die neue Tabellentest-Suite `TestMapPluginError` in
      `internal/server/plugin_grpc_test.go` belegt (Faelle mit Kommentar "documents current
      gap"). Erstens vergleichen `isNotFound`/`isAlreadyExists`/`isInvalidArgument` (Zeilen
      847-868) mit einfachem `==` statt `errors.Is` - jeder Sentinel, den `Service` mit
      `fmt.Errorf("%w: ...", ...)` wrapped, wird nie erkannt. Betroffen:
      `ApprovePermissions` (wrapped `ErrPermissionNotDeclared`, service.go:324) und
      `UpdatePluginSettings` (wrapped `ErrInvalidSettings`, service.go:392) - beide liefern
      heute `codes.Internal` statt `codes.InvalidArgument`. Zweitens hat `mapPluginError`
      ueberhaupt keinen Fall fuer `ErrPluginHasInstallations` (von
      `Service.DeleteManifest` zurueckgegeben, service.go:165) - der faellt auf den
      generischen Internal-Zweig, obwohl `FailedPrecondition` der naheliegende Code waere.
      Alle sieben anderen Sentinels in `errors.go` werden korrekt gemappt, weil `Service`
      sie unwrapped zurueckgibt - nur diese drei Stellen sind betroffen. Jedes andere
      `map<X>Error` in diesem Repo (fuhrpark, rapporte, inventar) nutzt bereits
      `errors.Is` - `mapPluginError` ist die einzige Ausnahme.
    sources:
      - backend/internal/server/plugin_grpc.go
      - backend/internal/plugin/service.go
      - backend/internal/plugin/errors.go
      - backend/internal/server/plugin_grpc_test.go
    notes: >
      Gefunden waehrend b-cov-server-plugin (Lauf 7). Nicht inline gefixt - echte
      Verhaltensaenderung (aus 500 wird 400/409 fuer drei konkrete Faelle), keine
      Coverage-Aenderung, nach Backlog-Regel eine eigene Unit. Fix-Vorschlag: die drei
      Helfer `isNotFound`/`isAlreadyExists`/`isInvalidArgument` von `err ==` auf
      `errors.Is(err, ...)` umstellen (mechanisch, gleiche Fallliste), und einen vierten
      Fall `case errors.Is(err, plugin.ErrPluginHasInstallations): return
      status.Error(codes.FailedPrecondition, err.Error())` ergaenzen. Nach dem Fix muessen
      die drei als "documents current gap" markierten Testfaelle in
      `plugin_grpc_test.go` (TestMapPluginError zwei Faelle, TestPluginApprovePermissions/
      undeclared_permission, TestPluginDeleteManifest/has_active_installations,
      TestPluginSettings/schema_mismatch) auf den jetzt korrekten Code aktualisiert werden -
      sie pruefen bewusst nur den IST-Zustand.
    done_when:
      - isNotFound/isAlreadyExists/isInvalidArgument nutzen errors.Is statt ==
      - ErrPluginHasInstallations hat einen eigenen Fall in mapPluginError (FailedPrecondition
        oder gleichwertig client-actionable)
      - ApprovePermissions mit nicht deklarierter Permission liefert InvalidArgument
      - UpdatePluginSettings mit Schema-Verstoss liefert InvalidArgument
      - DeleteManifest mit aktiven Installationen liefert nicht mehr Internal
      - Die "documents current gap"-Testfaelle in plugin_grpc_test.go auf den neuen
        erwarteten Code aktualisiert
      - go test -count=1 ./internal/server/... ./internal/plugin/... gruen

  - id: fix-plugin-nil-manifest-panic-on-orphaned-installation
    phase: 3
    service: plugin
    model: sonnet
    deps: []
    status: todo
    scope: >
      Drei Methoden in `internal/plugin/service.go` laden eine Installation, dann per
      `s.manifests.GetByID(ctx, inst.ManifestID)` das zugehoerige Manifest, und greifen
      danach ungeprueft auf das Ergebnis zu, obwohl `GetByID` bei einer nicht gefundenen
      Zeile `nil, nil` liefert (siehe `ManifestRepo.GetByID`-Vertrag, den auch
      `Service.GetManifest` selbst explizit gegen nil prueft): `ApprovePermissions`
      (`for _, p := range manifest.Permissions`, Zeile ~319), `UpdatePluginSettings`
      (`s.schemaValidator.Validate(manifest.SettingsSchema, ...)`, Zeile ~390) und
      `GetPluginSettingsSchema` (`return manifest.SettingsSchema, nil`, Zeile ~412). Ein
      Manifest kann eine Installation ueberleben: `DeleteManifest` blockt nur bei
      `HasActiveInstallations` (die per Definition nur nicht-uninstallte Installationen
      zaehlt), also bleibt eine `uninstalled`-Installation mit ihrer alten `ManifestID`
      nach dem Loeschen des Manifests bestehen. Jeder der drei Aufrufe auf diese
      verwaiste Installation loest eine Nil-Pointer-Dereferenzierung aus. Reproduziert
      und belegt in `internal/server/plugin_grpc_test.go` per `require.Panics` in drei
      Testfaellen ("orphaned installation (deleted manifest) panics..."). `cmd/plugin/main.go`
      registriert `middleware.RecoveryUnaryInterceptor()`, der Panic wird also in
      Produktion zu einem opaken `codes.Internal` statt den Prozess abzuschiessen - aber
      es bleibt ein Panic bei jedem Treffer, kein behandelter Fehlerpfad.
    sources:
      - backend/internal/plugin/service.go
      - backend/internal/plugin/repository_interfaces.go
      - backend/internal/server/plugin_grpc_test.go
    notes: >
      Gefunden waehrend b-cov-server-plugin (Lauf 7). Nicht inline gefixt - echte
      Verhaltensaenderung, keine Coverage-Aenderung, nach Backlog-Regel eine eigene Unit.
      Fix-Vorschlag: an allen drei Stellen nach dem `manifests.GetByID`-Aufruf denselben
      `if manifest == nil { return ..., ErrManifestNotFound }`-Wächter einbauen, den
      `Service.GetManifest` bereits nutzt (ErrManifestNotFound mapped bereits sauber auf
      NotFound). Nach dem Fix muessen die drei `require.Panics`-Testfaelle in
      `plugin_grpc_test.go` durch normale `requireGRPCCode(t, err, codes.NotFound)`-Faelle
      ersetzt werden - sie pruefen bewusst nur den IST-Zustand (Panic), nicht das
      gewuenschte Verhalten.
    done_when:
      - ApprovePermissions, UpdatePluginSettings und GetPluginSettingsSchema pruefen das
        Manifest-Lookup-Ergebnis auf nil, bevor sie es dereferenzieren
      - Alle drei liefern bei verwaistem Manifest ErrManifestNotFound / codes.NotFound statt
        zu paniken
      - Die drei require.Panics-Testfaelle in plugin_grpc_test.go durch
        requireGRPCCode(..., codes.NotFound)-Faelle ersetzt
      - go test -count=1 ./internal/server/... ./internal/plugin/... gruen

  - id: fix-automation-actions-struct-cannot-represent-array
    phase: 3
    service: automation
    model: sonnet
    deps: []
    status: todo
    scope: >
      `automation.proto` deklariert `actions` (auf CreateAutomationRequest, UpdateAutomationRequest
      und AutomationInfo) als `google.protobuf.Struct` - ein Wire-Typ, der ausschliesslich ein
      JSON-*Objekt* (`{...}`) transportieren kann (Struct <-> JSON-Objekt ist die kanonische
      Well-Known-Type-Abbildung, siehe `google.golang.org/protobuf/types/known/structpb`). Die
      Domain-Seite verlangt aber ein JSON-*Array*: `workflow.Service.validateAutomation`
      (internal/automation/workflow/service.go:433) und `Service.DryRun` unmarshaln `auto.Actions`
      unconditional in `[]models.ActionConfig`. `automation_grpc.go`s `automationStructToJSON`
      wandelt einen `*structpb.Struct` per `s.MarshalJSON()` zurueck - das Ergebnis beginnt
      strukturell IMMER mit `{`, nie mit `[`. Jeder nicht-nil `Actions`-Wert - selbst ein leeres
      `{}` - schlaegt deshalb beim Unmarshal in `[]models.ActionConfig` fehl
      (`json: cannot unmarshal object into Go value of type []models.ActionConfig`), was
      `mapDomainError` auf `codes.InvalidArgument` abbildet. Ergebnis: `CreateAutomation` und
      `UpdateAutomation` lassen sich mit KEINER einzigen echten Aktion konfigurieren - die einzige
      Automation, die sich je erstellen laesst, ist eine ganz ohne Actions (Feld nil/omitted).
      Bewiesen durch `TestCreateAutomation_ActionsStructCannotCarryAnArray` in
      `internal/server/automation_grpc_test.go` (gebaut waehrend `b-cov-server-automation`, Lauf 7):
      ein einzelnes, sonst gueltiges `{"type":"send_email"}` als Actions-Struct fuehrt zu
      `codes.InvalidArgument`. Gateway-seitig (`route_automation.go`, `rawJSONToAutomationStruct`)
      ist der Fehler noch unauffaelliger: ein echtes JSON-Array im Request-Body
      (`s.UnmarshalJSON(data)` auf einem `*structpb.Struct`) schlaegt beim Parsen fehl, der Fehler
      wird verschluckt (`if s, sErr := ...; sErr == nil { grpcReq.Actions = s }`), das Feld bleibt
      einfach nil - der Client bekommt 200 OK, seine konfigurierten Aktionen wurden aber nie
      gesetzt. `b-cov-gateway-automation` (Lauf 7, Iteration 10) hat exakt dieses Symptom bereits
      fuer `trigger_config` als Testfall festgeschrieben, ohne die Ursache (Struct-vs-Array) oder
      die Tragweite fuer `actions` speziell zu benennen. `modules.automation` ist in
      `backend/internal/featureflag/` nicht als Flag gefuehrt (kein Gate), der Pfad ist also ohne
      Feature-Flag erreichbar.
    sources:
