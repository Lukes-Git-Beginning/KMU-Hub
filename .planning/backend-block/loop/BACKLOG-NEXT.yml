      Kollegen kennt, kann sie lesen (Vorschau, Absender, Thread-Text), archivieren, taggen
      oder als sich selbst beantworten. UUIDs sind nicht ratbar -- das ist Defense-in-Depth,
      kein offener Cross-Tenant-Zugriff; Cross-Tenant ist durch Tests belegt dicht
      (`TestInboxMessageRPCs_ForeignTenantSeesNotFound`). Team-Inbox-Nachrichten gehoeren
      fachlich mehreren Nutzern (Mitglieder, Zugewiesene) -- die Sichtbarkeitsregel ist eine
      Produktentscheidung.
