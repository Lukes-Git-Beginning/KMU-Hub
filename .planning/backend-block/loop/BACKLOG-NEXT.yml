  - id: decide-dunning-interest-feature
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: blocked
    blocked_reason: >-
      PRODUKTENTSCHEIDUNG LUKE: sollen Verzugszinsen nach Paragraph 288 BGB ueberhaupt ein
      Feature sein? Wettbewerbsdifferenzierung gegen zusaetzliche Komplexitaet in einer
      Geldflaeche.
    target: "Entscheidung Luke, danach als spitze Unit nach BACKLOG.yml"
    scope: >
      BEFUND aus Lauf 11 (`verify-dunning-calculate-interest-unreachable`, done, Iteration 12):
      `dunning.CalculateInterest` (`internal/biz/dunning/service.go:415-458`) hat NULL Aufrufer
      im Produktionscode — ein Grep nach "CalculateInterest" findet nur die Definition und die
      Tests. `models.DunningConfig` (`internal/models/finance.go:318`) traegt keinen
      Basiszinssatz, nur drei Gebuehren. Verzugszinsen werden also nie berechnet, und der
      Divisor ist fest 365.
      Die Verify-Unit aus Lauf 11 hat aufgeraeumt und dokumentiert, aber ausdruecklich NICHTS
      verdrahtet ("DIESE UNIT VERDRAHTET KEINE VERZUGSZINSEN"). Die eigentliche Frage — bauen
      wir das Feature? — stand seither nirgends als Unit.
      WAS ZU ENTSCHEIDEN IST: (a) Feature bauen. Dann braucht `DunningConfig` einen
      Basiszinssatz, der Basiszinssatz der Bundesbank aendert sich halbjaehrlich und muss
      gepflegt werden, und der Divisor 365 gehoert geprueft (Paragraph 288 rechnet
      taggenau). (b) Ersatzlos streichen: `CalculateInterest` entfernen, damit kein
      spaeterer Scan sie wieder als "toten Code" meldet.
    sources:
      - backend/internal/biz/dunning/service.go
      - backend/internal/models/finance.go
      - .planning/backend-block/loop/archive/lauf-11/JOURNAL.md
    notes: >
      Bei (a) ist der Basiszinssatz das eigentliche Problem, nicht die Rechnung: ein Wert, der
      sich halbjaehrlich aendert und den niemand pflegt, produziert nach zwei Jahren falsche
      Mahnungen. Wer (a) waehlt, entscheidet mit, WER ihn pflegt.
    done_when:
      - Die Entscheidung (a) oder (b) steht mit Begruendung und Datum in dieser Unit
      - Bei (a) ist eine spitze Unit in BACKLOG.yml angelegt, inkl. der Pflegefrage
      - Bei (b) ist eine Aufraeum-Unit in BACKLOG.yml angelegt

  - id: decide-einvoice-inbound-codelist-validation
    phase: 4
    service: biz
    model: sonnet
    deps: []
    status: blocked
    blocked_reason: >-
      PRODUKTENTSCHEIDUNG LUKE: sollen EINGANGSrechnungen gegen dieselbe Waehrungs- und
      Kategorie-Whitelist laufen wie ausgehende? Strenger heisst weniger stille Fehler, aber
      auch abgelehnte Rechnungen von Lieferanten, die es anders machen.
    target: "Entscheidung Luke, danach als spitze Unit nach BACKLOG.yml"
    scope: >
      BEFUND aus Lauf 11, Iteration 52: die Whitelist aus A5
      (`feat-einvoice-codelist-validation`, done) deckt nur den OUTBOUND-Generator ab. Fuer
      Eingangsrechnungen (`internal/biz/einvoice/parser.go`) gibt es kein Pendant.
      Die Wirkung ist asymmetrisch: was wir senden, ist normkonform; was wir empfangen,
      nehmen wir ungeprueft an. Ein Lieferant mit einem exotischen Waehrungscode oder einer
      unbekannten Kategorie erzeugt dann eine Rechnung im System, die spaeter beim Export an
      DATEV auffaellt — an der teuersten Stelle.
      WAS ZU ENTSCHEIDEN IST: (a) Inbound streng validieren und ablehnen; (b) inbound
      validieren und nur WARNEN (Rechnung annehmen, Befund protokollieren); (c) so lassen.
    sources:
      - backend/internal/biz/einvoice/parser.go
      - backend/internal/biz/einvoice/validation.go
      - backend/internal/biz/einvoice/generator_doc.go
    notes: >
      (b) ist der wahrscheinlich richtige Kompromiss: eine abgelehnte Eingangsrechnung ist ein
      Support-Fall beim Kunden, eine protokollierte Auffaelligkeit nicht. Aber das ist eine
      Produktentscheidung, keine technische — deshalb steht sie hier.
      Das Paket fuehrt inzwischen 48 EN-16931-Regel-IDs (Stand 2026-08-24); die
      Regel-Infrastruktur ist also da, es fehlt nur die Anwendung auf den Inbound-Pfad.
    done_when:
      - Die Entscheidung (a), (b) oder (c) steht mit Begruendung und Datum in dieser Unit
      - Bei (a) oder (b) ist eine spitze Unit in BACKLOG.yml angelegt

