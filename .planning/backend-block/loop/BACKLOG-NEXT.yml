  - id: fix-notification-quiet-hours-conflict-index
    phase: 3
    service: notification
    model: opus
    deps: []
    status: todo
    coverage_start: "internal/notification 66,2 % (Stand nach Iteration 85)"
    scope: >
      `PostgresRepository.UpsertQuietHours`
      (backend/internal/notification/preference/postgres_repository.go, ON CONFLICT um Zeile
      213) zielt auf `ON CONFLICT (tenant_id, user_id)`, aber `notification_quiet_hours` traegt
      seit Migration 000022 nur ein inline `UNIQUE(user_id)` (Constraint
      `notification_quiet_hours_user_id_key`). Migration 000124 hat `tenant_id` ueberall NOT
      NULL gemacht, diesen Constraint aber nie verbreitert -- verifiziert gegen die lokale DB
      (Kopf 309) und gegen alle Migrationen, die die Tabelle anfassen (000022, 000110, 000124).
      Postgres validiert den ON-CONFLICT-Zielindex beim PLANEN der Query, nicht erst bei einem
      tatsaechlichen Konflikt: deshalb schlaegt JEDER Aufruf fehl, nicht nur der zweite, mit
      SQLSTATE 42P10. Quiet Hours lassen sich ueber dieses Repository derzeit ueberhaupt nicht
      anlegen.
    sources:
      - backend/internal/notification/preference/postgres_repository.go
      - backend/migrations/000305_notification_preferences_conflict_index_tenant_fix.up.sql
      - backend/migrations/000022_create_notification_preferences.up.sql
    notes: >
      EXAKT dieselbe Bugklasse wurde fuer `notification_preferences` schon EINMAL gefixt:
      Migration 000305 verbreitert dort den analogen Event-Type-Index von
      `(user_id, event_type_key)` auf `(tenant_id, user_id, event_type_key)` mit derselben
      Begruendung im Kommentar. `notification_quiet_hours` wurde dabei uebersehen -- 000305 ist
      damit Vorlage UND Beleg, dass der Fix so funktioniert.
      Fertiger Migrationskoerper (neue Nummer zur Laufzeit ermitteln, NICHT 310 annehmen):
      `DROP INDEX notification_quiet_hours_user_id_key;`
      `CREATE UNIQUE INDEX notification_quiet_hours_user_id_tenant_id_key
       ON notification_quiet_hours(tenant_id, user_id);`
      Der neue Index ist ein Superset des alten und kann mit keiner bestehenden Zeile
      kollidieren. `postgres_repository.go` braucht voraussichtlich keine Aenderung (ON CONFLICT
      nennt nur Spalten, keinen Constraint-Namen) -- pruefen, nicht annehmen.
      ZWEITER, NICHT VERIFIZIERTER VERDACHT am selben Code, in dieser Unit mitpruefen:
      `UpsertPreference` (Zeile 99) zielt auf
      `ON CONFLICT (tenant_id, user_id, event_type_key) WHERE event_type_key IS NOT NULL`.
      Fuer Modul-Defaults mit `event_type_key IS NULL` kann dieser partielle Index gar nicht
      als Arbiter greifen -- ein zweiter Upsert desselben Modul-Defaults wuerde dann eine
      Dublette schreiben statt zu aktualisieren. Erst reproduzieren, dann entscheiden.
      Migration + RLS => `model: opus`, und die neue Tabelle/der neue Index braucht den
      RLS-Smoke aus GATE-COMMANDS.md.
    done_when:
      - Neue Migration verbreitert den Unique-Index auf (tenant_id, user_id), down-Migration
        stellt den alten Zustand her
      - Ein DB-gestuetzter Test beweist, dass UpsertQuietHours zweimal hintereinander fuer
        denselben (tenant_id, user_id) durchlaeuft und beim zweiten Mal aktualisiert statt
        einzufuegen
      - Ein zweiter Test beweist, dass zwei Tenants dieselbe user_id unabhaengig konfigurieren
        koennen (der eigentliche Grund fuer die Verbreiterung)
      - Der UpsertPreference-Verdacht (event_type_key IS NULL) ist reproduziert und entweder
        gefixt oder mit Begruendung als Nicht-Bug im Journal abgeraeumt
      - rls-smoke gruen, go test -count=1 ./internal/notification/... gruen

