      `internal/chat/file/minio_store.go`), dann die echte `file_id` senden; Kategorie-ID nur aus der
      geladenen Kategorieliste, kein Rückfall-String. Das Backend nimmt `categoryId`/`fileId` (camelCase)
      schon an.
