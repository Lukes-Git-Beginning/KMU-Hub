  - id: decide-document-access-baseline
    phase: 4
    service: document
    model: opus
    deps: []
    status: blocked
    blocked_reason: "ENTSCHEIDUNG LUKE mit Pilotabstimmung: Verhaltensbruch für Bestandsnutzer"
    target: "Pilotabstimmung"
    scope: >
      Befund der Vorbereitung (2026-10-24): Datei- und Ordner-RPCs prüfen nur Mandant und
      Permission-Guard, nie Besitz oder Raum. `fileService.GetByID(ctx, id, tenantID)`
      (`document_grpc.go:~292`) filtert nur `tenant_id`; jeder mit `documents:read` öffnet jede
      Datei per ID, `ListFiles` nimmt `owner_id` aus der Query. Grundlage für ein Modell
      existiert (`document_files.owner_id`, `document_folders.space_type personal|team|project`,
      `space_id`, `parent_id`). Entscheidung Luke 2026-10-24: im Lauf nur die
      ShareEntity-Prüfung (`fix-document-share-entity-checks`). Offen: (a) mandantenweit offen
      lassen (KMU-üblich, "Mit mir geteilt" = Lesezeichen), (b) Raum-Modell: persönlich privat,
      Team/Projekt für Mitglieder, Freigaben öffnen einzeln, Ordner vererben — 4 Units
      (Guard-Helper opus, Lesepfade, Schreibpfade; ~25 RPCs, Suche/Listen mit Filter in der
      Query), Bestandsdaten-Migration nötig.
      Aus `decide-document-share-access-effect` übernommen (Entscheidung Luke 2026-10-24):
      `read` = ansehen, Vorschau, herunterladen, Versionsliste; `write` = zusätzlich umbenennen
      und neue Version hochladen; Löschen beim Besitzer; ein Ordner-Share vererbt auf Dateien und
      Unterordner; kein Weiterteilen. TEIL (4) ERLEDIGT in Iteration 25
      (`fix-document-share-entity-checks`): ShareEntity verlangt eine lebende Entität im Mandanten
      und deren Besitzer (`owner_id` bzw. `created_by`), UnshareEntity nur Teilender oder
      Besitzer; der Teilende kommt aus dem Kontext, nicht aus `shared_by`. Ohne Admin-Waiver
      (Rollen reisen nicht über gRPC) — ein Admin teilt und entzieht fremde Dateien also nicht;
      wird in der Schreibpfad-Unit über die Whitelist (Regel 5) nachgezogen.
