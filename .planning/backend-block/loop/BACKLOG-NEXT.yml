  - id: decide-hr-self-service-permissions-for-member-manager
    phase: 4
    service: gateway
    model: sonnet
    deps: []
    status: todo
    decided: 2026-10-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-10-24: Self-Service ja. member und manager bekommen einen feinen Key
      `hr:self` (eigene Urlaubsanträge stellen und zurückziehen, eigener Saldo, eigene Zeiteinträge
      und Stempeluhr, Scope `own`), Genehmigen/Ablehnen wird als `hr:approve` von `hr:write`
      abgespalten und an manager gegeben (Reichweite wie bei `decide-hr-team-time-scope-for-
      managers`: Berichtslinie, admin alle). Guards additiv per `RequirePermissionAny` neben
      `hr:read`/`hr:write`, Seed-Migration für beide Keys, Own-Scope an `/balance/{userId}` und den
      Zeiteinträgen nachziehen. Vorher prüfen, ob die schon gesäten `hr:time_*`-Keys (Migration 224)
      die Zeit-Routen abdecken, statt einen zweiten Key für dasselbe zu säen.
    scope: >
      Gefunden in fix-hr-leave-list-ignores-user-filter (Iteration 64), gegen die lokale DB gemessen:
      `hr:read` und `hr:write` hängen NUR an der Rolle `admin` (Migration 129; Migration 224 hat member und
      manager nur Schichten, Booking, Inventar, Einkauf und `hr:time_*` gegeben). Damit bekommt jeder
      Nicht-Admin auf `/hr/leave/*` und `/hr/time/*` ein 403 — Urlaubsantrag stellen, Saldo, Stempeluhr,
      Self-Service-Ansicht. Ob das Absicht ist (HR bis zum Pilot nur für Admin), steht nirgends. Ein bloßes
      Seed-Grant von `hr:write` an member wäre falsch: derselbe Key schützt `approve`/`reject`/`cancel`
      (`route_hr.go:80-84`), jeder Mitarbeiter könnte dann Anträge genehmigen. Der Weg wäre ein feinerer Key
      (`hr:leave:create` o. ä.), additiv per `RequirePermissionAny` neben dem groben, mit Seed-Migration für
      member (Scope `own`). Die Own-Scope-Filter sind seit Iteration 64 an `GET /hr/leave/requests[/{id}]`
      vorhanden (Key `hr:read`), das Gegenstück für Saldo (`/balance/{userId}`) und Zeiteinträge fehlt.
    sources:
      - backend/internal/gateway/route_hr.go
      - backend/migrations/000129_seed_missing_module_permissions.up.sql
      - backend/migrations/000224_seed_module_manager_member_permissions.up.sql
    done_when:
      - "Entscheidung steht: HR bleibt admin-only oder member/manager bekommen Self-Service; bei 'Self-Service' ist die Fix-Unit mit Seed-Migration, additivem Guard und Own-Scope an Saldo und Zeiteinträgen angelegt"

