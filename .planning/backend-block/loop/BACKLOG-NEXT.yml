#     1. docker compose -f deploy/docker/docker-compose.yml up -d postgres
#     2. cd backend && make migrate-up
#     3. Rolle kmuhub_app (NOSUPERUSER NOBYPASSRLS) — nicht kmuhub, der hat BYPASSRLS
