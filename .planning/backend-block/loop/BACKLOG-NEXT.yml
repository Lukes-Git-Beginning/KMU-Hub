    status: todo
    decided: 2026-10-24
    decision: >-
      ENTSCHEIDUNG LUKE, 2026-10-24: Ein Tenant-Admin darf fremde Aufnahmen löschen, auch Call-
      Aufnahmen ohne Meeting. Unabhängig davon 403 statt 500, wenn das Meeting gelöscht ist.
