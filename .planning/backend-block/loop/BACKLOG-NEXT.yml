#        statt zu skippen
#     5. `backend-loop` auf `origin/main` MERGEN, nicht rebasen
#
# MIGRATIONSKOPF: stand am 21.08. auf 314. IMMER zur Laufzeit ermitteln, im Lauf entstehen
# mehrere Migrationen hintereinander:
#     ls backend/migrations | grep -E '^[0-9]{6}' | sort | tail -1
#
# ------------------------------------------------------------------------------------------
# BEFUNDE, DIE DIE VORBEREITUNG KORRIGIERT HAT — vor dem Bauen lesen
#
#  1. DATEV/Windows-1252 ist KEIN bestaetigter Bug. exporter_test.go:409-420 traegt bereits
#     einen Kommentar, der die Praemisse zurueckweist: der EXTF-Header schreibt
#     Format-Version "700", und ab 700 laesst DATEV UTF-8 mit BOM zu (erst davor war
#     ANSI/cp1252 Pflicht). Deshalb steht hier eine VERIFY-Unit mit hartem
#     Nicht-Fix-Kriterium, keine Fix-Unit. Blind umkodieren waere eine Regression.
#
#  2. Route-Dateien: 75 Quelldateien `route_*.go`, davon 23 ohne eigene Testdatei —
#     nicht 87/29 wie im Statusdokument. route_email.go (1.612) und route_settings.go
#     (1.029) sind die groessten UNGETESTETEN, nicht die groessten insgesamt
#     (route_video.go 2.379, route_hr.go 2.300, route_auth.go 1.923 haben Tests).
#
#  3. DSAR-Luecke ist groesser als beschrieben: matchUsers() (dsar_search.go:213) haengt
#     UEBERHAUPT KEIN Modul an ausser dem nackten Benutzerkonto. Fuer einen per Name/E-Mail
#     gematchten *User* liefert die Art.-15-Auskunft nichts aus Chat, Work, Kalender oder
#     Notification — obwohl sieben Erasure-Handler die Tabellen dafuer kennen. Vier Module,
#     nicht eines (A8-A10).
#
#  4. `contact_tags.contact_id` hat weiterhin KEINEN Foreign Key, und Delete() ist
#     weiterhin ein nacktes `DELETE FROM contacts` (postgres_repository.go:342). Die
#     Anonymisierung vom 19.08. deckt nur den Pfad ab, der ueber IsInUse/409 laeuft.
#
#  5. `retention_policies.resource_type` ist ein freier String ohne Enum/Whitelist
#     (route_security.go:145, nur `validate:"required"`). Der Worker braucht eine eigene,
#     im Code gepflegte Zuordnung resource_type -> Tabelle; es gibt keine Registry dafuer.
#
#  6. GoBD-Grant bestaetigt: 000121_create_app_role.up.sql:49 erteilt kmuhub_app ein
#     schema-weites GRANT SELECT, INSERT, UPDATE, DELETE — inklusive gobd_documents.
#     Kein UPDATE/DELETE gegen diese Tabellen im Go-Code (gegrept), ein REVOKE ist
#     gefahrlos.
#
