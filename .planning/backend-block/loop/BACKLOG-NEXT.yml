  - id: feat-einkauf-po-framework-contract-call-off-wiring
    phase: 4
    service: einkauf
    model: sonnet
    deps: []
    status: blocked
    blocked_reason: >-
      Wartet auf Luke (Produkt-/Vertragsentscheidung): (1) Das Feld ist ueber die API gar nicht
      setzbar - einkauf.proto kennt framework_contract_id nur in der PurchaseOrder-Response (Zeile 94),
      nicht in Create-/UpdatePurchaseOrderRequest; ein Setzen braucht Proto-Aenderung + Regen + Gateway
      + openapi.yaml + FE-Vertrag, sonst bleibt die Verdrahtung tot. (2) Betragssemantik offen: netto
      oder brutto, PO-Waehrung gegen Vertragswaehrung (CreateContractCall bucht ungeprueft), Delta
      pro Teillieferung aus line.unit_price * Delta. (3) ErrContractBudgetExceeded beim Wareneingang:
      trotzdem buchen und warnen (Vertragsdeckel verletzt) oder Wareneingang abweisen - die Notes der
      Unit nennen das selbst eine Produktentscheidung.
    coverage_start: "n.a. (Feature-Luecke, kein Coverage-Ziel)"
    scope: >
      VERIFIZIERTER BEFUND (2026-08-26, gefunden beim Bauen von
      `cov-einkauf-service-extended-real-paths`). `PurchaseOrder.FrameworkContractID`
      (backend/internal/einkauf/models.go:57-59) traegt den Kommentar "When set, ReceiveGoods
      will automatically record a contract call-off." Die Spalte existiert seit Migration
      000208_einkauf_po_framework_ref, wird in GetPO/GetPOWithLines gelesen
      (postgres_repository.go:457,473) — aber NIRGENDS gesetzt: weder `CreatePOInput` noch
      `UpdatePOInput` (service.go) haben ein `FrameworkContractID`-Feld, es gibt keinen Weg,
      die Spalte ueber den Service zu befuellen. Selbst wenn sie per Hand-SQL gesetzt wuerde,
      lesen `ReceiveGoods` (service.go:607) und `PartialReceive` (service.go:659) das Feld nie
      und rufen nie `CreateContractCall` auf — die im Docstring versprochene automatische
      Abruf-Buchung existiert im Code schlicht nicht. Ein an einen Rahmenvertrag gebundener PO
      erhoeht dessen `used_value` also nie automatisch; `CreateContractCall` ist aktuell nur
      manuell erreichbar (kein Gateway-Handler dafuer verifiziert — pruefen). Belegt durch
      `TestExtended_ReceiveGoods_LinkedToFrameworkContract_DoesNotRecordCallOff` in
      service_extended_test.go (dokumentiert die Luecke, aendert kein Verhalten).
    sources:
      - backend/internal/einkauf/models.go
      - backend/internal/einkauf/service.go
      - backend/internal/einkauf/service_extended.go
      - backend/migrations/000208_einkauf_po_framework_ref.up.sql
    notes: >
      Entscheidungen, die beim Bauen anfallen: (1) Soll ReceiveGoods und PartialReceive BEIDE
      einen Call-off buchen, oder nur der volle ReceiveGoods-Abschluss? Bei PartialReceive waere
      der Call-off-Betrag der neu geleferte Anteil (analog zum inventarAdj-Delta-Muster in
      PartialReceive, service.go:695-703), nicht der volle PO-Wert. (2) CreateContractCall
      race-sicher aus der Empfangs-Transaktion heraus aufrufen — nicht als separater Call nach
      dem Status-Update, sonst Inkonsistenz bei Teilausfall. (3) Was passiert bei
      ErrContractBudgetExceeded waehrend eines Wareneingangs? Der Wareneingang selbst darf nicht
      an einem Budget-Limit scheitern (der Wareneingang ist physisch bereits passiert) — vermutlich
      Call-off trotzdem buchen und nur loggen/warnen, analog zum inventarAdj-Best-Effort-Muster
      (service.go:634-648), nicht hart fehlschlagen. Das ist eine Produktentscheidung, kein
      Bug-Fix — bei Unsicherheit `blocked` mit der Frage an Luke.
    done_when:
      - >-
        CreatePOInput und/oder UpdatePOInput erlauben das Setzen von FrameworkContractID (oder es
        ist begruendet dokumentiert, warum absichtlich nicht)
      - >-
        ReceiveGoods bucht bei gesetztem FrameworkContractID einen Call-off in Hoehe des
        empfangenen Werts; ein Test belegt used_value auf dem Rahmenvertrag danach korrekt erhoeht
      - >-
        PartialReceive bucht denselben Call-off nur fuer das Delta der neu empfangenen Menge,
        nicht fuer den vollen PO-Wert; ein Test belegt das ueber zwei aufeinanderfolgende
        Teillieferungen
      - >-
        Verhalten bei ErrContractBudgetExceeded waehrend eines Wareneingangs ist entschieden und
        durch einen Test belegt (oder die Entscheidung ist an Luke delegiert und die Unit steht
        `blocked`)
      - go test -count=1 ./internal/einkauf/... gruen, DATABASE_URL gesetzt, 0 Skips

  - id: decide-token-lifetime-and-storage-policy
    phase: 4
    service: gateway
    model: opus
    deps: []
    status: blocked
    blocked_reason: >-
      ARCHITEKTUR-/PRODUKTENTSCHEIDUNG LUKE: gibt es eine einheitliche Token-Policy (Laufzeit,
      Ablage, gemeinsamer Generator) fuer alle Link- und Zugangstoken? Heute beantwortet jeder
      Typ die Fragen einzeln und teils abweichend; was richtig ist, ist keine Nachtarbeit.
    target: "Entscheidung Luke, danach spitze Units nach BACKLOG.yml"
    scope: >
      BEFUND aus `scan-signed-url-and-token-lifetimes` (Iteration 50, Tabelle im Journal).
      FRAGEN: (1) GEMEINSAMER HELPER: es gibt keinen. Der 32-Byte-crypto/rand-base64url-Generator
      steht viermal wortgleich (`wiki/share.go:newShareToken`, `formulare/form_share.go:newShareToken`,
      `berichte/service.go:newShareSecret`, `helpdesk/csat_survey.go:newCsatSurveyToken`), jeder
      Kommentar sagt "matches ..." auf den anderen; daneben `auth.generateSecureToken`
      (Reset-Token) und `gdpr.generateDownloadToken` (Hex). Ein `internal/`-Paket fuer
      "Link-Secrets" waere die Konsolidierung - lohnt sie sich bei vier Zeilen je Kopie, oder bleibt
      es bei den Kommentaren? (2) LAUFZEITEN: WOPI 10 h (Protokollempfehlung), Recording-URL 1 h,
      Chat-Datei/-Thumbnail 15 min, Kalender-Join-Token (`livekit/service.go:130`) 24 h,
      Video-Raum-Token (`livekit/room_manager.go:104`, kein `SetValidFor`) LiveKit-Default 6 h,
      Passwort-Reset 1 h, CSAT 30 Tage, GDPR-Export 7 Tage, Share-Links Wiki/Formulare/Berichte
      OHNE Pflichtablauf (Berichte max. 365 Tage wenn gesetzt, Wiki/Formulare unbegrenzt),
      CalDAV-App-Passwoerter unbegrenzt. Soll es eine Obergrenze fuer Share-Links geben, und
      sollen Kalender- und Video-Token dieselbe Laufzeit haben? (3) ABLAGE: Reset-Token liegt als
      SHA-256 in der DB (`auth.HashToken`), CalDAV-Passwoerter als bcrypt; Wiki-, Formulare-,
      Berichte-Share-Token und CSAT-Token liegen im KLARTEXT. Ein DB-Lesezugriff (Backup, falscher
      Join) gibt damit gueltige externe Zugaenge frei. Hash-Ablage braeuchte je Tabelle eine
      Migration plus Umgang mit den bestehenden Links (Dual-Lookup oder Invalidierung).
      (4) OFFBOARDING: soll es die CalDAV-App-Passwoerter widerrufen (Fix von `is_active` steht
      als `fix-caldav-basic-auth-ignores-user-state` in BACKLOG.yml), und sollen WOPI-Token und
      LiveKit-Token einen deaktivierten Nutzer ueberleben duerfen (bis 10 h / 24 h)?
      (5) KALENDER-JOIN-TOKEN: jeder Nutzer mit `calendars:write` bekommt fuer JEDES Event seines
      Tenants einen Token (`calendar_grpc.go:1299`), nicht nur als Teilnehmer; nach Loeschen des
      Events bleibt der Token bis zu 24 h gueltig (LiveKit kann nicht widerrufen).
    sources:
      - backend/internal/work/livekit/service.go
      - backend/internal/work/livekit/room_manager.go
      - backend/internal/document/wopi/token.go
      - backend/internal/wiki/share.go
      - backend/internal/auth/token.go
      - .planning/backend-block/loop/JOURNAL.md
    notes: >
      Die Scan-Unit bewertet nicht, welche Laufzeit richtig ist; sie hat nur gezeigt, wo die
      Antworten auseinanderliegen. Pro Frage reicht ein Ja/Nein und ein Wert. Frage (3) ist die
      teuerste (Migration je Tabelle, opus) und die einzige mit Datenabfluss-Charakter.
    done_when:
      - Je Frage (1) bis (5) steht die Entscheidung mit Datum in dieser Unit
      - Je Ja ist eine spitze Unit in BACKLOG.yml angelegt

