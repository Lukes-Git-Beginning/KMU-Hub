      adaptieren nicht, obwohl der Rest von `hr-client.ts` es tut (`adaptEmployee`, `adaptLeaveRequest`
      u. a.). Folge: `DokumenteTab.tsx:51` filtert nach `d.categoryId` und findet nie etwas, die
      Kategorie-Zähler sind leer, `b.createdAt.localeCompare` stürzt bei `undefined` ab, ab zwei
      Dokumenten; `ProfileSections.tsx` zeigt `fileName`/`categoryName` leer. Fix: `adaptEmployeeDocument`
      und `adaptDocumentCategory` in `hr-client.ts`. Das Gateway auf camelCase umzustellen wäre falsch (bricht
      die Konvention und `PersonnelDocuments.tsx`, das snake_case liest). (2) Upload: `DokumenteTab.tsx:130-131`
      sendet `fileId: 'file-<Date.now()>'` und als Rückfall `categoryId: 'hrcat-other'`; das Gateway lehnt
      beides mit 400 ab (`uploadDocumentHTTPReq`, `validate:"omitempty,uuid"`), und die Spalte
