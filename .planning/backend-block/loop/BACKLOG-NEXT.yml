      ("Sofort fällig") werden verworfen. (3) Erstes `PUT /hr/settings` ohne Policy-Felder
      schreibt 0 statt der Defaults (`route_hr.go` NotFound-Zweig).
    sources:
      - backend/internal/gateway/route_notification.go
      - backend/internal/biz/invoice/service.go
      - backend/internal/gateway/route_hr.go
    done_when:
      - je Fall ein Test, der den Teil-Request zeigt und den gespeicherten Wert behält
      - go test -count=1 ./internal/gateway/ ./internal/biz/invoice/ gruen

