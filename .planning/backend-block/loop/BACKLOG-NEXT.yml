# Backend-Nachtloop — Arbeitsqueue für den NÄCHSTEN Lauf (Lauf 12)
#
# Diese Datei liest der Treiber NICHT. Sie ist die Schleuse vor `BACKLOG.yml`.
#
# WARUM ES SIE GIBT: In Lauf 8 standen die während des Laufs gefundenen Fix-Units mit
# `status: todo` in `BACKLOG.yml` und trugen nur einen KOMMENTAR "Für Lauf 9". Ein Kommentar
# ist keine Mechanik — `Get-OpenUnitCount` im Treiber zählt `todo` unabhängig davon.
# Seitdem gilt: was nicht freigegeben ist, steht nicht in der Datei, die der Treiber parst.
#
# FREIGABE FÜR EINEN LAUF: Units aus dieser Datei nach `BACKLOG.yml` verschieben (nicht
# kopieren), Blöcke und Reihenfolge dort festlegen, `coverage_start` gegen den dann aktuellen
# CI-Stand nachziehen. Muster: PROMPT-VORBEREITUNG-LAUF-11.md.
#
# ==========================================================================================
# STAND NACH DER ENTSCHEIDUNGSRUNDE 2026-08-24
#
# `wire-biz-event-emitters-for-finance-triggers` ist entschieden (verdrahten) und nach
# BACKLOG.yml gezogen — mit einer neuen dep auf `fix-event-payload-missing-tenant-id`,
# weil die Gegenprüfung eine zweite Lücke gefunden hat: 20 von 25 EventPayload-Literalen
# setzen `TenantID` nicht, der Bus kann den Tenant deshalb nicht stempeln.
#
# `decide-retention-policy-for-unmapped-personal-data-domains` ist aufgeteilt und heißt
# jetzt `decide-retention-policy-hgb-ao-domains`. Drei der sechs Domänen sind entschieden
# und stehen als eigene Units in BACKLOG.yml; hier bleiben die vier mit gesetzlicher
# Aufbewahrungsfrist, die an Etappe 4 (Legal) hängen — nicht an eine Ad-hoc-Entscheidung.
# ==========================================================================================
#
# ==========================================================================================
# STAND NACH DER VORBEREITUNG VON LAUF 11 (2026-08-22)
#
# ÜBERHOLT von der Entscheidungsrunde 2026-08-24 (siehe Block direkt darunter).
#
# Lauf 11 ist ausgeschrieben: 64 Units in BACKLOG.yml, davon 10 Scans. Roter Faden
# "Geld- und Compliance-Pfade vor dem ersten zahlenden Kunden" (G2).
#
# NACH BACKLOG.yml VERSCHOBEN und deshalb hier ENTFERNT:
#   - `fix-booking-page-orphaned-after-owner-erasure` (entblockt, Entscheidung: deaktivieren)
#   - Journal-Befund 1 aus Lauf 10 (409/Retry-After nicht in openapi.yaml)
#     -> `fix-idempotency-inflight-409-not-in-openapi`
#   - Journal-Befund 6 (OpenAPI-Drift-Scan, Rest des Gateways)
#     -> `scan-gateway-openapi-response-code-drift-remaining`
#   - Journal-Befund 7 (RLS-Smoke hr_work_time_entries ohne Daten)
#     -> `fix-rls-smoke-hr-work-time-entries-with-data`
#   - Retention-Ausweitung auf die übrigen Services
#     -> `scan-retention-mapping-remaining-services`
#
# ERSATZLOS GESTRICHEN bei der Vorbereitung, weil die Gegenprüfung die Prämisse widerlegt hat:
#   - Die geplante Lexware-Doppelzustellungs-Sperre. `NewService` setzt `noopEmitter{}`
#     (`internal/biz/lexware/service.go:59-60`) und `SetEventEmitter` wird in `cmd/biz/main.go`
#     NIE aufgerufen — es läuft kein Automations-Workflow doppelt. `SyncContactByLexwareID`
#     schreibt auch keinen Sync-Log-Eintrag. An ihre Stelle traten
#     `verify-biz-event-emitters-never-wired` und der Scan
#     `scan-inbound-paths-without-duplicate-delivery-guard`.
#   - Eine Schematron-Validierung für EN 16931. `go.mod` führt keine XML-/XPath-/XSLT-
#     Dependency, eine reife Go-Bibliothek existiert nicht, und die Rechenregeln deckt
#     `assertTotalsMatch` bereits ab. Ersetzt durch vier Regelfamilien-Units in Go.
#
# ==========================================================================================
# OFFEN, BRAUCHT LUKE — NICHT AUSSCHREIBEN, BEVOR DAS ENTSCHIEDEN IST
#
#   - `verify-datev-extf-encoding-requirement` bleibt `blocked`. Der Exporter schreibt heute
#     UTF-8 mit BOM. Die offiziellen Feldlisten für Format 700 sagen zur Kodierung nichts,
#     die Zeichensatz-Unterseite liefert ohne Login 404, und ein unabhängiges Ruby-Gem
#     kodiert hart auf CP1252. Zwei Wege: registrierter Zugang zu developer.datev.de für die
#     Primärquelle, oder ein empirischer Test gegen einen echten DATEV-Import. Bis dahin wird
#     am Kodierungsverhalten NICHTS geändert.
#
#   - `RETENTION_MODE` bleibt `dry_run`. Scharfstellen erst, wenn die `retention_runs` aus
#     Produktion zeigen, was ein `enforce` konkret löschen würde. Produktion hat aktuell NULL
#     `retention_policies` — der erste Dry-Run ist also leer, und die Liste der nicht
#     zugeordneten `resource_type`-Werte entsteht erst, wenn Policies angelegt sind.
#
#   - `resource_type`-Whitelist/Enum für Retention-Policies. Produktentscheidung, nicht
#     Loop-Arbeit — der Worker arbeitet solange defensiv und meldet Unbekanntes als
#     "nicht zugeordnet". Die Lauf-11-Unit
#     `cov-gateway-security-retention-ip-password-routes` hält den Ist-Zustand nur fest und
#     führt ausdrücklich KEINE Whitelist ein.
#
#   - DSAR-LÜCKE, ARCHITEKTURFRAGE (Lauf 10, Iteration 62): Eine nie angenommene Einladung
#     (`accepted_at IS NULL`) hat weder `users`- noch `contacts`-Zeile, an die `SearchByQuery`
#     sie hängen könnte — Name, E-Mail und Rolle stehen in `invitations`, sind für eine
#     Auskunftsanfrage aber nicht auffindbar. Das wäre eine dritte Subjekt-Matching-Quelle
#     neben Kontakten und Benutzern. Größer als eine Unit; erst entscheiden, dann bauen.
#
#   - ANNAHME, NICHT BELEG (Lauf 10, Iteration 63): Die 730-Tage-Frist, mit der die
#     Work-Erasure Zeiteinträge zurückhält, ist eine konservative Ableitung aus
#     § 16 Abs. 2 ArbZG, keine aus einer Konfigurationsquelle gelesene Zahl. Gilt für die
#     Task-Zeiterfassung, nicht für `hr_work_time_entries`. Von Luke zu bestätigen.
#
#   - VERZUGSZINSEN (bei der Vorbereitung von Lauf 11 gefunden, 2026-08-22):
#     `dunning.CalculateInterest` hat null Aufrufer, und `models.DunningConfig` trägt keinen
#     Basiszinssatz — Verzugszinsen nach § 288 BGB werden nie berechnet. Die Lauf-11-Unit
#     `verify-dunning-calculate-interest-unreachable` belegt das und räumt auf, VERDRAHTET
#     aber nichts. Woher der Basiszinssatz kommt (Konfiguration, Pflege durch den Kunden,
#     Abruf bei der Bundesbank) ist eine Produktentscheidung. Er ändert sich halbjährlich
#     nach § 247 BGB.
#
#   - EVENT-EMITTER IN `cmd/biz/main.go` (dito): weder Lexware noch invoice noch quote setzen
#     einen Emitter, während `automationConsumer` auf "*" hört. Ob die Oberfläche
#     Automations-Trigger auf Finanzereignisse anbietet, klärt die Lauf-11-Unit
#     `verify-biz-event-emitters-never-wired`. Bietet sie welche an, ist das eine tote Zusage
#     an den Kunden — die Verdrahtung selbst ändert Produktionsverhalten und gehört Luke, nicht
#     einer Nachtlauf-Iteration.
#
#   - FREMDWÄHRUNG: soll das Produkt sie können? Der Lauf-11-Scan
#     `scan-hardcoded-eur-vs-currency-column` (Iteration 61) hat den Ist-Zustand geliefert:
#     Fremdwährung entsteht heute AUSSCHLIESSLICH über wiederkehrende Rechnungen
#     (`CreateRecurringInvoiceRequest.currency`, `biz.proto:1378`) — die Ad-hoc-Erstellung
#     `CreateInvoiceRequest` hat KEIN Currency-Feld, ist also faktisch immer Tenant-Default
#     (praktisch immer EUR). Drei echte Blind-Summierungen sind bereits als eigene Units in
#     BACKLOG.yml angelegt (`fix-dashboard-metrics-blind-currency-sum`,
#     `fix-berichte-kpi-blind-currency-sum`, `fix-gobd-export-missing-currency-column`) — die
#     brauchen KEINE Produktentscheidung, sie schließen nur die Lücke bei bereits heute
#     möglicher Fremdwährung.
#     Zwei Punkte bleiben echte Produktentscheidungen, weil sie eine Migration bzw. einen
#     Proto-Vertragswechsel voraussetzen:
#     (a) `finance_payments` (Migration `000045_create_finance_tables.up.sql:129-146`) hat bis
#         heute KEINE `currency`-Spalte — Zahlungen tragen keine Währungsangabe, der
#         Offene-Posten-Abgleich (`payment/postgres_repository.go:128-133`) vertraut
#         ungeprüft darauf, dass eine Zahlung in Rechnungswährung erfasst wurde.
#     (b) Soll Ad-hoc-Rechnungserstellung (`CreateInvoiceRequest`) überhaupt Fremdwährung
#         anbieten, oder bleibt das bewusst der Recurring-Rechnung vorbehalten?
#     Beide erst entscheiden, dann als Unit ausschreiben (Migration + Proto-Regen +
#     Wire-Shape-Prüfung).
#     NEBENBEFUND, NICHT LOOP-RELEVANT (gesperrtes Paket `internal/biz/bexio`, siehe
#     BACKLOG.yml-Kopf "GESPERRT IN DIESEM LAUF"): `resolveKMUHubCurrency`
#     (`bexio/field_mapper.go:347-353`) gibt IMMER `models.DefaultCurrency` zurück, unabhängig
#     von der tatsächlichen Bexio-`CurrencyID` — eine CHF-Rechnung aus Bexio wird im
#     KMU-Hub-Spiegel als „EUR" importiert. Bereits im Code-Kommentar als bekannte Lücke
#     dokumentiert (Z.349-350). Erst relevant, falls Bexio je wieder freigegeben wird.
#
#   - TESTSTRATEGIE `//go:build integration`: elf Testdateien laufen nur im separaten CI-Job
#     "Finance & HR Integration Tests" und zählen nicht in der Coverage. Ob sie umgestellt
#     werden, ist eine Entscheidung mit CI-Wirkung — der Loop darf `deploy/` und die
#     CI-Struktur nicht anfassen. Der Lauf-11-Scan `scan-build-tag-excluded-money-tests`
#     liefert die Liste und eine Empfehlung, mehr nicht.
#
# ==========================================================================================
# FRONTEND-NACHZÜGE — gehören NICHT in diesen Loop (kein Playwright-Gate)
#
#   1. `RecurringInvoiceDialog.tsx:158` sendet beim Entfernen des Enddatums weiterhin
#      `undefined` statt eines Leerstrings. Das Backend akzeptiert das Lösch-Signal seit
#      `a5f5aa6f`, im UI passiert trotzdem nichts. (Lauf 10, Iteration 50.)
#
#   2. SICHERHEITSRELEVANT: In `handleTemplateSelect` (ComposeInline.tsx / ComposeModal.tsx)
#      fehlt der `sanitizeHtml()`-Aufruf, den die übrigen Pfade haben. Eine E-Mail-Vorlage geht
#      damit ungefiltert in den Editor. Lässt sich mit keiner Backend-Änderung schließen.
#      (Lauf 10, Iteration 26.)
#
#   3. Frontend für die Kaskaden-Impact-Vorschau aus Lauf 10 / A2.
#
# ==========================================================================================
# KANDIDATEN FÜR LAUF 12 — noch nicht entworfen, nur vorgemerkt
#
#   - Ein gemeinsamer Helper für `pg_advisory_lock` auf einer dedizierten Verbindung. Es gibt
#     ZWEI Implementierungen desselben Musters (idempotency, gdpr), und die zweite ist als
#     Kopie der ersten samt Fehler entstanden. `internal/database` scheidet als Zuhause aus:
#     database -> middleware -> idempotency wäre ein Import-Zyklus. Ein eigenes kleines Paket
#     (etwa `internal/pglock`) wäre der Weg — Architekturentscheidung, gehört Luke.
#   - Ein dauerhafter Test gegen die Antwortcode-Drift in `openapi.yaml`. Ob daraus ein Gate
#     wird, ist eine eigene Entscheidung. Der Lauf-11-Scan D2 liefert die Datengrundlage.
#   - Die schwächsten Pakete jenseits der Geldwelt (Stand CI-Run 32570176303 aus dem
#     Kopf von BACKLOG.yml ableiten, nicht die alten Werte übernehmen):
#     `internal/work/customfield`, `internal/work/label`, `internal/email/attachment`,
#     `internal/document/share`.
#   - Gateway-Routen mit ungeprüften Handlern ausserhalb der Geldwelt. Handler-Ebene gemessen
#     (2026-08-22): route_produktion_ext 1/17, route_customization 2/5, route_crm_leads 0/4,
#     route_files 0/2, route_work_time 2/10, route_wiki 10/20, route_vertraege 5/15,
#     route_einkauf 5/18. Die Messmethode steht in Befund 6 im Kopf von BACKLOG.yml — nach
#     DATEINAMEN gemessen sähe all das grün aus.
#   - Die fünf öffentlichen Slack-/Teams-Endpunkte in `route_integration.go`
#     (Webhook, Interaktion, Slash-Command, OAuth-Installation und -Rückruf). Die Lauf-11-Unit
#     `cov-gateway-integration-config-routes` nimmt ausdrücklich nur die dreizehn
#     Konfigurations-Handler; die öffentliche Fläche ist ein eigener Zuschnitt und berührt die
#     gesperrte Public-Web-Surface-Frage.
#   - CSAT und die übrigen Public-Token-Routen bleiben gesperrt (BACKLOG-PARKED.yml, Projekt
#     "Public Web Surface"), bis dazu eine Entscheidung fällt.
#   - Aufräumen der lokalen Dev-Postgres (13,8k Müll-Tenants), damit tenant-iterierende Tests
#     lokal wieder bezahlbar sind.
#
# ==========================================================================================

units:
  - id: decide-retention-policy-hgb-ao-domains
    phase: 4
    service: security
    model: opus
    deps: []
    status: blocked
    decided: 2026-08-24
    decision: >-
      AUFGETEILT, Entscheidung Luke 2026-08-24 (A6). Die urspruengliche Sammel-Unit
      `decide-retention-policy-for-unmapped-personal-data-domains` hat sechs Domaenen in einer
      Entscheidung gebuendelt und war dadurch als Ganzes blockiert, obwohl die Haelfte davon
      keinen Anwalt braucht. Aufteilung:
      JETZT ENTSCHIEDEN und als eigene Units in BACKLOG.yml angelegt -
      `feat-retention-handler-fuhrpark-operational` (vehicle_bookings und die historischen
      driver_licenses-Zeilen, 3 Jahre nach Paragraph 195 BGB),
      `harden-advisory-protocols-retention-guard` (keine aktive Loeschung, stattdessen Schutz
      gegen verfruehte) und `feat-retention-handler-guest-sessions` (90 Tage nach
      last_activity_at).
      HIER VERBLIEBEN sind die vier Faelle mit gesetzlicher Aufbewahrungsfrist. Neu dazu kam
      beim Entscheiden `trip_logs`: das Fahrtenbuch traegt ein `is_private`-Flag und ist damit
      ein steuerlicher Beleg im Sinne von Paragraph 147 AO, sobald es als Alternative zur
      1-Prozent-Regel gefuehrt wird - es gehoert deshalb nicht in die Fuhrpark-Unit, sondern
      hierher.
    target: >-
      Etappe 4 (Legal), zusammen mit AVV und DPA - das ist der Termin, an dem ohnehin
      anwaltlich beraten wird. NICHT vorher in BACKLOG.yml zurueckholen: eine pauschale Frist
      waere bei HR nachweislich falsch (Lohnunterlagen bis 10 Jahre nach Paragraph 147 AO und
      Paragraph 257 HGB, reine Personalakte kuerzer nach Verjaehrung moeglicher Ansprueche).
    blocked_reason: >-
      Wartet auf Etappe 4 (Legal), nicht auf eine Ad-hoc-Entscheidung. Vier Domaenen mit
      gesetzlicher Aufbewahrungsfrist - HR-Personaldaten, E-Mail, Vertraege und das
      Fahrtenbuch trip_logs. Jede braucht anwaltliche Beratung zur Frist, bevor ein
      Retention-Handler gebaut werden kann.
    coverage_start: "n.a. — Produktentscheidung, kein Coverage-Ziel"
    scope: >
      Rest der aufgeteilten Sammel-Unit (siehe `decision`). Vier Domaenen, alle mit belegtem
      Personenbezug UND einer gesetzlichen Aufbewahrungsfrist, deren Laenge ohne Beratung
      nicht festgelegt werden kann.

      1. HR-Personaldaten (`internal/biz/hr`): hr_employee_profiles (Adresse, Notfallkontakt),
         hr_leave_requests, hr_leave_balances, hr_employee_documents,
         hr_profile_change_requests. DSAR-Modul existiert (Lauf 10, Iteration 59). Deutsches
         Arbeitsrecht kennt je nach Dokumenttyp unterschiedliche Fristen - Lohnunterlagen bis
         zu 10 Jahre nach Paragraph 147 AO und Paragraph 257 HGB, reine Personalakte kuerzer
         nach Verjaehrung moeglicher Ansprueche. Eine pauschale Loeschfrist waere falsch, eine
         differenzierte braucht Rechtsberatung. Groesste Datenmenge und sensibelste Kategorie
         der vier.

      2. E-Mail (`internal/email`): email_messages, email_accounts, email_contact_links.
         DSAR-Modul existiert. Zu klaeren ist, ob email_messages Handelsbriefe im Sinne von
         Paragraph 257 HGB sind (dann 6 Jahre) oder reine interne Kommunikation.

      3. Vertraege (`internal/vertraege`): contracts, contract_parties. DSAR existiert (Lauf 10,
         Iteration 40). Vertragsunterlagen unterliegen typischerweise Paragraph 257 HGB
         (6 Jahre) oder laenger je nach Vertragstyp - eine Loeschfrist vor Ablauf der
         zivilrechtlichen Verjaehrung waere riskant.

      4. `trip_logs` (`internal/fuhrpark`): Fahrtenbuch mit `is_private`-Flag
         (`000193_create_trip_logs.up.sql`, Spalten date, driver_name, start_location,
         end_location, purpose). Wird es als Alternative zur 1-Prozent-Regel gefuehrt, ist es
         ein steuerlicher Beleg nach Paragraph 147 AO (10 Jahre). Zu klaeren: gilt das immer,
         oder nur fuer die Zeilen mit `is_private = true`? Davon haengt ab, ob ein Handler
         ueberhaupt zwischen den Zeilen unterscheiden muss.

      Punkte 2 und 3 folgen derselben HGB-Frage und koennen zusammen entschieden werden.

      Zwei Klassifikationshinweise ohne offene Frage (informativ): `consent_records`
      (ip_address) sollte vermutlich NICHT geloescht werden - die Aufzeichnung ist der Nachweis
      der Einwilligung nach Artikel 7 Absatz 1 DSGVO, also das Gegenteil einer Loeschpflicht.
      `public_bookings` und `booking_pages` (Name, Mail, Telefon externer Buchender) wurden in
      keinem bisherigen Scan geprueft und sind noch nicht klassifiziert.
    sources:
      - backend/internal/security/gdpr/retention.go
      - backend/internal/biz/hr/
      - backend/internal/fuhrpark/
      - backend/internal/email/
      - backend/internal/vertraege/
      - backend/internal/crm/advisoryprotocol/
      - backend/migrations/000137_advisory_protocols.up.sql
      - backend/internal/chat/
      - .planning/backend-block/loop/archive/lauf-10/JOURNAL.md
    notes: >
      Diese Unit BAUT NICHTS. Sie ist die Sammelstelle fuer vier Rechtsfragen, die in Etappe 4
      mit dem Anwaltstermin fuer AVV und DPA zusammen beantwortet werden. Nach jeder Antwort
      wandert die zugehoerige Domaene als eigene, spitze Unit nach BACKLOG.yml - nach dem
      Muster der drei Handler, die aus derselben Aufteilung schon in BACKLOG.yml stehen, und
      nach dem Vorbild von `retention_invitations.go`.
      Wer in der Zwischenzeit einen generischen Bereinigungslauf baut: die vier Domaenen sind
      dort ausdruecklich AUSZUNEHMEN, solange die Frist nicht feststeht.
    done_when:
      - >-
        Fuer HR ist je Dokumenttyp entschieden, welche Frist gilt (Lohnunterlagen getrennt von
        der reinen Personalakte), mit Verweis auf die Rechtsgrundlage
      - >-
        Fuer E-Mail ist entschieden, ob email_messages Handelsbriefe nach Paragraph 257 HGB
        sind
      - Fuer Vertraege ist die Frist je Vertragstyp entschieden
      - >-
        Fuer trip_logs ist entschieden, ob Paragraph 147 AO fuer alle Zeilen gilt oder nur fuer
        die mit is_private
      - Jede beantwortete Domaene ist als eigene Unit in BACKLOG.yml angelegt
