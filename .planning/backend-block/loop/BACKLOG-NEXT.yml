  - id: decide-gobd-integrity-check-on-every-download
    phase: 4
    service: finance
    model: sonnet
    deps: []
    status: blocked
    blocked_reason: "GEPARKT bis zum ersten Mandanten mit nennenswertem Archiv (Last-Thema)"
    target: "Messung mit echtem Archiv"
    scope: >
      Seit `ee63b341` streamt jeder GoBD-Download das ganze Objekt aus MinIO durch SHA-256 und
      schreibt ein `integrity_check`-Event (fatal, bewusst: eine unprotokollierte Prüfung
      beweist nichts) plus das Access-Event. Bei Massen-Exports Last und Tabellenwachstum.
      Option: Prüfung nur, wenn die letzte älter als N Stunden ist. Ein manipuliertes Dokument
      ist per Download nicht mehr abrufbar, bis der Befund geklärt ist (gewollt, erzeugt
      Support-Anfragen).
    sources:
      - backend/internal/biz/gobdarchive/service.go
    done_when:
      - Messung bzw. Entscheidung dokumentiert
