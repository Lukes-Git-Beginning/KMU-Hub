        `meeting_notes` oder `meeting_chat_messages` (gegengeprueft: keiner der 15
        bestehenden `retention_*.go`-Handler referenziert eine dieser drei Tabellen).
        Notizen und Chat-Nachrichten bleiben also unbegrenzt gespeichert, auch nach
        Kontakt-Loeschung oder Aufbewahrungsfrist-Ablauf.
      - `internal/crm/consent/scrub.go` nennt nur `meetings.title/description/agenda` als
        bewusst ausgenommen — `meeting_notes.content` und `meeting_chat_messages.message`
        sind dort NICHT erwaehnt, die "accepted residual risk"-Entscheidung wurde fuer sie
        nie getroffen.
