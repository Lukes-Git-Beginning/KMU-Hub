      - backend/internal/inbox/message/service.go
      - backend/internal/inbox/message/postgres_repository.go
    notes: >
      Vor dem Bauen die Regel festlegen: sichtbar = Eigentuemer ODER zugewiesen ODER Mitglied der
      Team-Inbox der Nachricht. Wenn Luke das nicht vorgibt: `blocked` mit dieser Frage.
      Wegen `RequirePermissionAny`-Kompatibilitaet keine Guards anfassen.
