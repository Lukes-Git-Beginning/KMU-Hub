# Backend-Nachtloop — Arbeitsqueue fuer den NAECHSTEN Lauf (Lauf 9)
#
# Diese Datei liest der Treiber NICHT. Sie ist die Schleuse vor `BACKLOG.yml`.
#
# WARUM ES SIE GIBT: In Lauf 8 standen die waehrend des Laufs gefundenen Fix-Units mit
# `status: todo` in `BACKLOG.yml` und trugen nur einen KOMMENTAR "Fuer Lauf 9". Ein Kommentar
# ist keine Mechanik — `Get-OpenUnitCount` im Treiber zaehlt `todo` unabhaengig davon, und
# Schritt 2 von ITERATION.md ("nimm die erste Unit mit status: todo") haette eine davon
# gezogen. Iteration 94 hat die Luecke erkannt, keine Unit gezogen und den Lauf gestoppt; nur
# die manuelle STOP-Datei hat verhindert, dass der Treiber endlos weiter Iterationen anwirft.
# Seitdem gilt: was nicht freigegeben ist, steht nicht in der Datei, die der Treiber parst.
#
# FREIGABE FUER EINEN LAUF: Units aus dieser Datei nach `BACKLOG.yml` verschieben (nicht
# kopieren), Bloecke und Reihenfolge dort festlegen, `coverage_start` gegen den dann aktuellen
# CI-Stand nachziehen. Was hier stehen bleibt, ist fuer den Lauf nicht freigegeben.
#
# ABGRENZUNG: `BACKLOG-PARKED.yml` ist etwas anderes — dort liegt, was der Loop strukturell
# nicht bearbeiten kann oder was bewusst aus dem Scope faellt (`parked`/`dropped` mit
# `decided`/`decision`/`target`). Hier liegt Arbeit, die kommt, nur noch nicht dran ist.
#
# INHALT (Stand 2026-08-11, nach der Nachbereitung von Lauf 8): zehn Fix-Units zu
# verifizierten Produktionsbugs. Sieben stammen aus Nebenfunden von Coverage-Units in Lauf 8
# und standen schon im Backlog; drei (`fix-audit-list-verifychain-ip-address-scan`,
# `fix-notification-quiet-hours-conflict-index`, `fix-crm-list-nil-slice-wire-shape`) standen
# nur im Journal und sind bei der Nachbereitung nachgetragen worden.
#
# Alle zehn sind gegen die lokale DB oder den laufenden Code REPRODUZIERT, nicht vermutet, und
# jeder Fund ist im Code mit einem Regression-Pin-Test festgenagelt, der das KAPUTTE
# Ist-Verhalten assertiert. Diese Tests werden beim Fix UMGEDREHT, nicht geloescht.
#
# PRIORITAET: `fix-audit-list-verifychain-ip-address-scan` zuerst — Audit-Viewer, CSV/JSON-
# Export und die VerifyAuditChain-RPC sind fuer jeden Tenant mit realer Aktivitaet
# funktionsunfaehig, und das ist eine Compliance-Flaeche (Art.-30-Nachweis).

