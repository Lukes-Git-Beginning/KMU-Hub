  - id: fix-crm-list-nil-slice-wire-shape
    phase: 3
    service: server
    model: sonnet
    deps: []
    status: todo
    coverage_start: "internal/server 70,0 % (CI-Stand nach Lauf 8, Run 31465073405)"
    scope: >
      Drei List-RPCs in `backend/internal/server/crm_grpc.go` (ListCustomFields, ListTags,
      ListContacts) lassen ihr `var infos []*crmv1.<X>Info` bei einem leeren Ergebnis als
      `nil`-Slice stehen, statt es mit `make([]*T, 0, len(...))` vorzubelegen. Ueber die
      JSON-Serialisierung wird daraus `null` statt `[]` -- das Frontend bekommt fuer eine
      leere Liste einen anderen Typ als fuer eine gefuellte. Fuer `ListContacts` liegt die
      Nil-Quelle eine Ebene tiefer: `contact.Service.enrichWithRelationsBatch` gibt bei
      `len(contacts) == 0` explizit `nil, nil` zurueck
      (backend/internal/crm/contact/service.go:401-403), bevor `crm_grpc.go` ueberhaupt eine
      Slice zum Iterieren bekommt.
    sources:
      - backend/internal/server/crm_grpc.go
      - backend/internal/crm/contact/service.go
      - backend/internal/server/crm_grpc_fields_tags_contacts_test.go
    notes: >
      Gefunden beim Bau der Coverage-Unit b-cov-server-crm-fields-tags-contacts (Lauf 8,
      Iteration 10). EXAKT die Wire-Shape-Klasse, die fuer `document_grpc.go`s `toProtoFile`
      in Lauf 7 (Commit `c3f0c46f`) bereits als Bug gefunden UND direkt gefixt wurde --
      2-Zeilen-Diff, der Commit ist die Vorlage.
      Die drei Pin-Tests `TestListCustomFields_EmptyIsNilNotEmptySlice`,
      `TestListTags_EmptyIsNilNotEmptySlice` und `TestListContacts_EmptyIsNilNotEmptySlice`
      (crm_grpc_fields_tags_contacts_test.go:510/696/898) pruefen bewusst die HEUTIGE, nicht
      die gewuenschte Form und tragen einen Kommentar, der beim Fix umzudrehen ist
      (`require.NotNil` statt `require.Nil`).
      Root-Cause-Regel: fuer ListContacts an der gemeinsamen Stelle in
      `enrichWithRelationsBatch` fixen, nicht nur im Handler -- sonst bleibt die Nil-Quelle
      fuer jeden weiteren Aufrufer bestehen. Alle drei Stellen in EINEM Commit.
      Kein Routen- oder Spec-Aenderungsbedarf (reine JSON-Feldform), `swagger-cli` und
      `TestOpenAPIRouteDrift` sind nicht betroffen.
    done_when:
      - Alle drei List-RPCs liefern bei leerem Ergebnis [] statt null
      - enrichWithRelationsBatch gibt bei len(contacts) == 0 eine leere, nicht-nil Slice zurueck
      - Die drei Pin-Tests sind auf require.NotNil umgestellt statt geloescht
      - go test -count=1 ./internal/server/ ./internal/crm/... gruen
