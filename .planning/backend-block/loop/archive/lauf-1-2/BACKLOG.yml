  - id: p3-integration-webhook-adapters
    phase: 3
    service: notification
    model: opus
    deps: [p3-gateway-wire-integration-routes, p3-integration-tenant-write-gap]
    status: done   # Iteration 33 — RPC-Tunnel, Tenant aus team_id, Signatur ueber Rohbytes repariert
    scope: >
      Die drei Setter von IntegrationRoutes (SetTeamsWebhookHandler,
      SetSlackWebhookHandler, SetSlackOAuthHandler) sind in main.go bewusst
      unbelegt geblieben — die fuenf Webhook-Routen antworten darum 404
      "not configured". Zum Scharfschalten braucht es eine echte Entscheidung,
      keine Verdrahtungszeile.
    sources:
      - backend/internal/gateway/route_integration.go:32
      - backend/internal/notification/integration/slack/webhook_handler.go
      - backend/internal/notification/integration/teams/webhook_handler.go
      - backend/internal/database/postgres.go:28
    notes: >
      Zwei Huerden, beide inhaltlich:
      (1) TENANT. Die Handler brauchen `integration.Repository` — ein direktes
      DB-Repo im Gateway, also am gRPC-Layer vorbei. Und der Request kommt
      unauthentifiziert: PrepareConn setzt `app.tenant_id` dann leer, RLS
      filtert jede Zeile weg. `GetAccountLink(ctx, platform, external_user_id)`
      ist ausserdem bauartbedingt tenant-uebergreifend. Der ehrliche Weg ist
      erst Tenant aus der Plattform-Identitaet aufloesen (Slack `team_id` bzw.
      Teams `tenant`-Claim gegen integration_configs.metadata, im
      System-Context), dann alles Weitere unter WithTenantContext. Alternativ
      neue notification-RPCs, die die Webhook-Payload verarbeiten, und das
      Gateway bleibt reiner Proxy — das ist die architektonisch saubere Form
      und vermutlich die richtige.
      (2) SECRETS. Slack-Signing-Secret und OAuth-Client-ID/-Secret sind neue
      Env-Vars. Nur als os.Getenv-Opt-in bauen (Vorbild cmd/notification/main.go
      SLACK_BOT_TOKEN), NIE als config.RequireX — das waere ein Prod-Hazard.
      Ohne Secret bleibt es beim heutigen 404, das ist die richtige Antwort.
      Der OAuth-Callback persistiert den Bot-Token heute nicht (er loggt ihn) —
      das gehoert mit geklaert, siehe openapi.yaml-Note am Pfad.
      ---
      VORARBEIT Iteration 32 (Recherche steht, nicht nochmal machen):
      * Design entschieden: RPC-Tunnel. Eine notification-RPC nimmt
        `platform`, `kind`, rohen Body und die relevanten Header entgegen und
        gibt status_code/content_type/body zurueck; das Gateway proxied nur.
        Grund: die Signaturpruefung deckt die exakten Rohbytes ab, ein
        Re-Serialisieren am Gateway wuerde sie zerstoeren — Tunneln ist hier
        nicht Bequemlichkeit, sondern die einzige korrekte Form. Und nur so
        bleibt das Signing-Secret im notification-Service, wo SLACK_BOT_TOKEN
        schon liegt.
      * Tenant-Aufloesung: Slack `team_id` (Interaction: callback.Team.ID,
        Slash: Formularfeld) bzw. Teams `channelData.tenant.id` gegen
        integration_configs.metadata, gelesen unter database.WithSystemContext,
        danach alles unter dem aufgeloesten Tenant. Heute schreibt niemand eine
        team_id in metadata — bis dahin ist die Aufloesung leer und die Route
        verweigert. Das ist der richtige Zustand (kein Raten), muss aber in der
        openapi-Beschreibung stehen: Admin traegt die team_id ueber
        POST /api/v1/integrations/configs (metadata ist freies JSON) ein.
      * OAuth install/callback bleiben verweigert: es gibt KEIN Vault.
        `credentials_vault_key` ist ein blosses String-Feld, nichts loest es auf
        (verifiziert: kein internal/vault, kein Aufloeser im Forwarder). Ein
        pro-Tenant-Bot-Token hat damit keinen Platz. Zusaetzlich ist der
        Callback unauthentifiziert, braucht also einen signierten `state` mit
        dem Tenant aus einem dann authentifizierten Install. Beides zusammen =
        eigene Unit, nicht Teil dieser.
      * ACHTUNG Falsch-Erfolg: die Handler loggen Acknowledge/Approve/Reject
        heute nur. Slack aktualisiert die Karte trotzdem in-place mit einem
        "erledigt"-Banner (buildResolvedBlocks) und Teams antwortet "Aktion
        verarbeitet" — waehrend in Cosmi nichts passiert. Scharfschalten ohne
        echte Aktion ist eine fuer den Kunden sichtbare Luege; entweder die
        Aktion verdrahten oder ehrlich antworten.
      * integration.Forwarder ist heute toter Code (NewForwarder in
        cmd/notification/main.go, HandleNotification hat keinen Aufrufer).
      ---
      ERLEDIGT Iteration 33. Der RPC-Tunnel aus der Vorarbeit wurde gebaut
      (HandlePlatformWebhook: platform/kind/rohe Bytes/Header rein,
      status_code/content_type/body raus). HAUPTBEFUND war ein anderer als
      erwartet: die Slack-Signaturpruefung war kaputt. Sie verifizierte gegen
      `url.Values.Encode()` der geparsten Form — sortiert und anders escaped als
      das, was Slack signiert hat. Falsifiziert: mit dem alten Ausdruck faellt
      der neue Test auf 401 zurueck, und zwar auch bei der einfeldrigen
      Interaction. Scharfgeschaltet haette also KEIN einziger Slack-Webhook
      funktioniert. Weitere Entscheidungen: (a) Tenant ueber
      `PostgresRepository.ResolveTenant` (metadata->>'team_id' bzw.
      'tenant_id' unter WithSystemContext, LIMIT 2 -> zwei Treffer sind
      ErrTenantAmbiguous, kein Tie-Break). (b) Nur `acknowledge` wirkt wirklich
      (notification.Service.MarkRead); approve/reject/reply antworten ehrlich
      und lassen die Karte unangetastet — das war die "Falsch-Erfolg"-Warnung.
      (c) OAuth install/callback antworten jetzt 501 statt 404, mit Begruendung
      in openapi.yaml; die drei Setter am Gateway sind entfernt.
      NICHT enthalten: OAuth-Flow (braucht Vault + signierten state, eigene
      Unit), und `integration_configs` traegt weiterhin die vor-Mandanten-
      `UNIQUE(platform)` aus 000053 — pro Plattform ist global nur eine Config
      moeglich, die Aufloesung kann heute also nur einen Tenant treffen.
    done_when:
      - Tenant wird aus der Plattform-Identitaet aufgeloest, nicht geraten
      - Signaturpruefung vor jedem Datenzugriff (heute schon so, nicht kaputtmachen)
      - Kein direkter Repo-Zugriff im Gateway ohne dokumentierte Begruendung
      - Keine neue config.RequireX
      - openapi.yaml-Beschreibungen der fuenf Webhook-Pfade auf den neuen Stand
      - go build/vet/lint/test gruen

