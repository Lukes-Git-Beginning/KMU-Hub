    service: querschnitt
    model: sonnet
    deps: [p3-gateway-wire-integration-routes]
    status: done   # Iteration 28 — TestOpenAPISpecDrift, Allowlist mit genau einem Eintrag
    scope: >
      TestOpenAPIRouteDrift prueft nur eine Richtung: jede registrierte Route
