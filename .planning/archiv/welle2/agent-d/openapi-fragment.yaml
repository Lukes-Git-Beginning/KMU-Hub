# OpenAPI fragment — GoBD Belegarchiv (§147 AO)
# Insert the `paths` entries under the existing `paths:` key,
# and the `schemas` entries under `components/schemas:`.
# Security scheme name: bearerAuth (matches existing openapi.yaml).

paths:
  /api/v1/finance/gobd-archive:
    get:
      summary: List GoBD archived documents
      operationId: listGobdDocuments
      tags: [GoBD Archive]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: doc_type
          schema:
            type: string
            enum: [invoice, credit_note, receipt, contract, correspondence, other]
          description: Filter by document type
        - in: query
          name: source_invoice_id
          schema:
            type: string
            format: uuid
          description: Filter by linked invoice ID
        - in: query
          name: date_from
          schema:
            type: string
            format: date
          description: Lower bound for archived_at (YYYY-MM-DD)
        - in: query
          name: date_to
          schema:
            type: string
            format: date
          description: Upper bound for archived_at (YYYY-MM-DD)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Paginated list of archived documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GobdDocumentList"
        "401":
          description: Unauthorized
    post:
      summary: Archive a new document (Beleg archivieren)
      operationId: archiveDocument
      tags: [GoBD Archive]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, doc_type]
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (max 50 MiB)
                doc_type:
                  type: string
                  enum: [invoice, credit_note, receipt, contract, correspondence, other]
                source_invoice_id:
                  type: string
                  format: uuid
                  description: Optional — links the document to a finance_invoices record
      responses:
        "201":
          description: Document archived successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GobdDocument"
        "400":
          description: Validation error (empty file, unknown doc_type, file too large)
        "401":
          description: Unauthorized

  /api/v1/finance/gobd-archive/from-invoice/{invoiceId}:
    post:
      summary: Archive the PDF of a locked invoice
      description: |
        Generates the invoice PDF and archives it. The invoice must be locked
        (LockedAt set) — GoBD requires finalizing documents before archiving.
      operationId: archiveInvoiceDocument
      tags: [GoBD Archive]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Invoice document archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GobdDocument"
        "400":
          description: Invoice not locked
        "404":
          description: Invoice not found

  /api/v1/finance/gobd-archive/{id}:
    get:
      summary: Get a single GoBD document with its audit trail
      operationId: getGobdDocument
      tags: [GoBD Archive]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Document with events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GobdDocumentWithEvents"
        "404":
          description: Document not found

  /api/v1/finance/gobd-archive/{id}/download:
    get:
      summary: Get a presigned download URL for a GoBD document
      operationId: downloadGobdDocument
      tags: [GoBD Archive]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Presigned URL valid for 1 hour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GobdDownloadResponse"
        "404":
          description: Document not found

  /api/v1/finance/gobd-archive/{id}/annotations:
    post:
      summary: Add a text annotation to a GoBD document
      description: |
        Appends an annotation event to the immutable audit trail.
        The document itself is not modified (GoBD immutability).
      operationId: addDocumentAnnotation
      tags: [GoBD Archive]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: Annotation added
        "404":
          description: Document not found

components:
  schemas:
    GobdDocument:
      type: object
      description: An immutable archived GoBD document (§147 AO)
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        doc_type:
          type: string
          enum: [invoice, credit_note, receipt, contract, correspondence, other]
        source_invoice_id:
          type: string
          format: uuid
          nullable: true
        storage_key:
          type: string
        sha256:
          type: string
          description: Hex-encoded SHA-256 checksum of the file contents (64 chars)
        original_filename:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
          format: int64
        archived_at:
          type: string
          format: date-time
        archived_by:
          type: string
          format: uuid
        retention_until:
          type: string
          format: date
          description: "31.12 of (archive_year + 8) — minimum §147 AO retention deadline"

    GobdDocumentEvent:
      type: object
      description: An audit trail entry for a GoBD document
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [archived, annotation, access, integrity_check]
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        note:
          type: string
        metadata_json:
          type: string
          description: JSON-encoded event metadata

    GobdDocumentWithEvents:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/GobdDocument"
        events:
          type: array
          items:
            $ref: "#/components/schemas/GobdDocumentEvent"

    GobdDocumentList:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/GobdDocument"
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    GobdDownloadResponse:
      type: object
      properties:
        presigned_url:
          type: string
          format: uri
          description: Presigned MinIO/S3 URL valid for 1 hour
        original_filename:
          type: string
        mime_type:
          type: string
