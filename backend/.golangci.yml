version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - misspell
    - unconvert
  settings:
    misspell:
      ignore-rules:
        - produktion   # German module name (Produktion/PRODUKTION)
        - Produktion
        - PRODUKTION
        - Immobilien   # German DSAR field label, not the English "immobile"
    govet:
      enable: []          # Remove shadow — too aggressive for short if-err patterns
    errcheck:
      exclude-functions:
        - io.Copy
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - fmt.Fprintf
    gosec:
      excludes:
        - G404
        - G115
        - G101   # Scope constant names are not hardcoded credentials
        - G109   # int32 cast from Atoi is bounds-safe in our query contexts
        - G402   # Email TLS config — MinVersion handled by server
        - G108   # /debug/pprof — env-gated via ENABLE_PPROF
        - G304   # File inclusion via variable — TLS cert paths from config
  exclusions:
    paths:
      - proto
      - bin
      - plugins   # WASM plugins are not regular Go — compiled with GOOS=wasip1
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      - linters:
          - staticcheck
        text: "SA4017"   # Equal return value — false positive in if-conditions
      - linters:
          - staticcheck
        text: "QF1003"   # tagged switch suggestion — style only
      - linters:
          - errcheck
        source: "^\\s+defer\\s"   # deferred close/rollback errors intentionally ignored
