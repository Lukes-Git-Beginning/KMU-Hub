version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - misspell
    - unconvert
  settings:
    govet:
      enable:
        - shadow
    gosec:
      excludes:
        - G404
        - G115
  exclusions:
    paths:
      - proto
      - bin
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kmuhub/kmuhub
