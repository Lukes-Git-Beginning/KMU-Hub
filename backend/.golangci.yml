version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - misspell
    - unconvert
  settings:
    govet:
      enable: []          # Remove shadow — too aggressive for short if-err patterns
    errcheck:
      exclude-functions:
        - io.Copy
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - fmt.Fprintf
    gosec:
      excludes:
        - G404
        - G115
        - G101   # Scope constant names are not hardcoded credentials
        - G109   # int32 cast from Atoi is bounds-safe in our query contexts
        - G402   # Email TLS config — MinVersion handled by server
  exclusions:
    paths:
      - proto
      - bin
      - plugins   # WASM plugins are not regular Go — compiled with GOOS=wasip1
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      - linters:
          - staticcheck
        text: "SA4017"   # Equal return value — false positive in if-conditions
      - linters:
          - staticcheck
        text: "QF1003"   # tagged switch suggestion — style only
      - linters:
          - errcheck
        source: "^\\s+defer\\s"   # deferred close/rollback errors intentionally ignored

formatters:
  enable:
    - goimports
  exclusions:
    paths:
      - internal/models      # struct field alignment managed manually
      - internal/config      # struct field spacing differs from gofmt default
      - internal/security    # struct literal alignment differs from gofmt default
      - internal/automation  # import/func-signature formatting differs from gofmt default
      - internal/biz/bexio      # struct/const alignment differs from gofmt default
      - internal/biz/creditnote # struct field alignment differs from gofmt default
      - internal/biz/lexware    # struct field alignment differs from gofmt default
  settings:
    goimports:
      local-prefixes:
        - github.com/kmuhub/kmuhub
