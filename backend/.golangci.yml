run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - gosec
    - bodyclose
    - misspell
    - unconvert

linters-settings:
  govet:
    shadow: true
  goimports:
    local-prefixes: github.com/kmuhub/kmuhub
  gosec:
    excludes:
      - G404

issues:
  exclude-dirs:
    - proto
    - bin
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
