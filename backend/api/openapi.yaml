  # ==========================================================================
  # Chat: Messages
  # ==========================================================================

  /api/v1/channels/{id}/messages:
    get:
      summary: Get messages in a channel (cursor-based pagination)
      tags: [chat-messages]
      operationId: getMessages
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: before
          in: query
          description: Get messages before this message ID
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          description: Get messages after this message ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMessagesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Send a message to a channel
      tags: [chat-messages]
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                parent_message_id:
                  type: string
                  format: uuid
                  description: Optional parent message ID for thread replies
                mentioned_user_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: User IDs to mention in the message
                mention_everyone:
                  type: boolean
                  default: false
                  description: If true, mentions all channel members
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/messages/{id}:
    put:
      summary: Update a message (author only)
      tags: [chat-messages]
      operationId: updateMessage
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: Message updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a message (author or channel admin/owner)
      tags: [chat-messages]
      operationId: deleteMessage
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Message deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/messages/{id}/thread:
    get:
      summary: Get thread replies for a message
      tags: [chat-messages]
      operationId: getThreadReplies
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: before
          in: query
          schema:
            type: string
            format: uuid
          description: Cursor - get replies before this message ID
        - name: after
          in: query
          schema:
            type: string
            format: uuid
          description: Cursor - get replies after this message ID
      responses:
        "200":
          description: Thread replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadRepliesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/dm:
    post:
