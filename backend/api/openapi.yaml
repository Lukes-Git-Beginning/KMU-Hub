    # =========================================================================
    # WebSocket Event Types (documentation reference)
    # =========================================================================
    # The following WebSocket message types are supported via /api/v1/ws:
    #
    # Presence Events:
    #   presence.update     (Server -> Client) - User presence status changed
    #   presence.heartbeat  (Client -> Server) - Client heartbeat to maintain online status
    #   presence.subscribe  (Client -> Server) - Subscribe to presence updates for user IDs
    #   presence.set_status (Client -> Server) - Manually set presence status (online/away/dnd/offline)
    #
    # Call Events:
    #   call.incoming  (Server -> Client) - Incoming call notification
    #   call.accepted  (Client -> Server) - User accepted incoming call
    #   call.declined  (Client -> Server) - User declined incoming call
    #   call.ended     (Server -> Client) - Call has ended
    #
    # Reaction Events:
    #   reaction.toggled (Server -> Client) - Reaction added/removed on a message

