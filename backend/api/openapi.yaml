  /api/v1/files/upload:
    post:
      summary: Upload a file to a channel
      tags: [chat-files]
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, channel_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload (max 50MB)
                channel_id:
                  type: string
                  format: uuid
                  description: Channel to attach the file to
                message_id:
                  type: string
                  format: uuid
                  description: Optional message to attach the file to
      responses:
        "201":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Channel is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "507":
          description: Storage quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/files/{id}/download:
    get:
      summary: Get a presigned download URL for a file
      tags: [chat-files]
      operationId: getFileDownloadURL
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Presigned download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: Presigned URL valid for 15 minutes
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/files/{id}/thumbnail:
    get:
      summary: Get a presigned thumbnail URL for an image file
      tags: [chat-files]
      operationId: getFileThumbnailURL
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Presigned thumbnail URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: Presigned URL for the thumbnail (200x200 JPEG)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/files/{id}:
    delete:
      summary: Delete a file (soft delete)
      tags: [chat-files]
      operationId: deleteFile
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: File deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/{id}/files:
    get:
      summary: List files in a channel
      tags: [chat-files]
      operationId: listChannelFiles
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Paginated list of files
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileInfo"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/chat/search:
    get:
      summary: Search chat messages and files
      tags: [chat-search]
      operationId: searchChat
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
          description: Search query (min 2, max 200 characters)
        - name: channel_id
          in: query
          schema:
            type: string
            format: uuid
          description: Optional filter to a specific channel
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Search results (messages and files merged by relevance)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatSearchResult"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

