        description: { type: string }

    ActionDefinition:
      type: object
      properties:
        type: { type: string }
        module: { type: string }
        name: { type: string }
        description: { type: string }

    AutomationTemplate:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        complexity: { type: string, enum: [simple, medium, advanced] }
        trigger_type: { type: string }
        trigger_config: { type: object }
        conditions: { type: object }
        actions: { type: object }
        created_at: { type: string, format: date-time }

    DryRunStep:
      type: object
      properties:
        action_type: { type: string }
        action_name: { type: string }
        would_run: { type: boolean }
        error: { type: string, nullable: true }

    AutomationStats:
      type: object
      properties:
        total_automations: { type: integer }
        active_automations: { type: integer }
        total_executions: { type: integer }
        success_rate: { type: number, format: float }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict (e.g. duplicate email)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
