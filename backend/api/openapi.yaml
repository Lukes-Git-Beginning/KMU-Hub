components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (15 min expiry)

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    UserInfo:
      type: object
      description: Protobuf JSON uses camelCase field names.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        isActive:
          type: boolean
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean

    RoleRequest:
      type: object
      required: [role_name]
      properties:
        role_name:
          type: string
          enum: [admin, manager, member]

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8

    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, manager, member]

    AcceptInvitationRequest:
      type: object
      required: [password, first_name, last_name]
      properties:
        password:
          type: string
          format: password
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string

    InvitationInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    InvitationResponse:
      type: object
      properties:
        invitation:
          $ref: "#/components/schemas/InvitationInfo"
        token:
          type: string
          description: Plain token, only returned on creation

    ListInvitationsResponse:
      type: object
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/InvitationInfo"

    AuthResponse:
      type: object
      description: Returned by register and login. Fields are camelCase (protobuf JSON).
      properties:
        user:
          $ref: "#/components/schemas/UserInfo"
        accessToken:
          type: string
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    GetUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserInfo"

    ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserInfo"
        total:
          type: integer

    StatusResponse:
      type: object
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    # Custom Fields
    CustomFieldInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        entityType:
          type: string
          enum: [contact, company, deal, activity]
        fieldType:
          type: string
          enum: [text, number, date, boolean, select, multiselect]
        options:
          type: array
          items:
            type: string
        isRequired:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCustomFieldRequest:
      type: object
      required: [name, entity_type, field_type]
      properties:
        name:
          type: string
        entity_type:
          type: string
          enum: [contact, company, deal, activity]
        field_type:
          type: string
          enum: [text, number, date, boolean, select, multiselect]
        options:
          type: array
          items:
            type: string
        is_required:
          type: boolean
          default: false

    UpdateCustomFieldRequest:
      type: object
      properties:
        name:
          type: string
        options:
          type: array
          items:
            type: string
        is_required:
          type: boolean

    CustomFieldResponse:
      type: object
      properties:
        customField:
          $ref: "#/components/schemas/CustomFieldInfo"

    ListCustomFieldsResponse:
      type: object
      properties:
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CustomFieldInfo"

    # Tags
    TagInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Hex color code (#rrggbb)
        entityType:
          type: string
          enum: [contact, company, deal, activity]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTagRequest:
      type: object
      required: [name, entity_type]
      properties:
        name:
          type: string
        color:
          type: string
          description: Hex color code (#rrggbb)
          default: "#3b82f6"
        entity_type:
          type: string
          enum: [contact, company, deal, activity]

    UpdateTagRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string

    TagResponse:
      type: object
      properties:
        tag:
          $ref: "#/components/schemas/TagInfo"

    ListTagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagInfo"

    TagIdsRequest:
      type: object
      required: [tag_ids]
      properties:
        tag_ids:
          type: array
          items:
            type: string
            format: uuid

    # Contacts
    ContactInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        companyId:
          type: string
          format: uuid
        companyName:
          type: string
        notes:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagInfo"
        customFields:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateContactRequest:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        company_id:
          type: string
          format: uuid
        notes:
          type: string
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: object
          additionalProperties: true

    UpdateContactRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        company_id:
          type: string
          format: uuid
        notes:
          type: string
        custom_fields:
          type: object
          additionalProperties: true

    ContactResponse:
      type: object
      properties:
        contact:
          $ref: "#/components/schemas/ContactInfo"

    ListContactsResponse:
      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactInfo"
        total:
          type: integer

    # Companies
    CompanyInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        website:
          type: string
        industry:
          type: string
        address:
          type: string
        notes:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagInfo"
        customFields:
          type: object
          additionalProperties: true
        contactCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        website:
          type: string
        industry:
          type: string
        address:
          type: string
        notes:
          type: string
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: object
          additionalProperties: true

    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
        website:
          type: string
        industry:
          type: string
        address:
          type: string
        notes:
          type: string
        custom_fields:
          type: object
          additionalProperties: true

    CompanyResponse:
      type: object
      properties:
        company:
          $ref: "#/components/schemas/CompanyInfo"

    ListCompaniesResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: "#/components/schemas/CompanyInfo"
        total:
          type: integer

    # Pipeline Stages
    PipelineStageInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Hex color code (#rrggbb)
        sortOrder:
          type: integer
        isWon:
          type: boolean
        isLost:
          type: boolean
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 100
        dealCount:
          type: integer
        totalValue:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePipelineStageRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string
          description: Hex color code (#rrggbb)
          default: "#3b82f6"
        is_won:
          type: boolean
          default: false
        is_lost:
          type: boolean
          default: false
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 100
          default: 0

    UpdatePipelineStageRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        is_won:
          type: boolean
        is_lost:
          type: boolean
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 100

    ReorderPipelineStagesRequest:
      type: object
      required: [stage_ids]
      properties:
        stage_ids:
          type: array
          items:
            type: string
            format: uuid

    PipelineStageResponse:
      type: object
      properties:
        stage:
          $ref: "#/components/schemas/PipelineStageInfo"

    ListPipelineStagesResponse:
      type: object
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStageInfo"

    # Deals
    DealInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        value:
          type: number
          format: double
        currency:
          type: string
          description: ISO 4217 currency code
        stageId:
          type: string
          format: uuid
        stageName:
          type: string
        contactId:
          type: string
          format: uuid
        contactName:
          type: string
        companyId:
          type: string
          format: uuid
        companyName:
          type: string
        ownerId:
          type: string
          format: uuid
        ownerName:
          type: string
        expectedCloseDate:
          type: string
          format: date
        notes:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagInfo"
        customFields:
          type: object
          additionalProperties: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time

    CreateDealRequest:
