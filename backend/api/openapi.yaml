        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: List of mentions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMentionsResponse"
        "401":
