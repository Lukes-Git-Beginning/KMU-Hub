          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: List of DM channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChannelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/channels/unread:
    get:
      summary: Get unread message counts for all channels
