    get:
      summary: Get quiet hours configuration
      tags: [notifications]
      operationId: getQuietHours
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Quiet hours configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuietHours"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Update quiet hours configuration
      tags: [notifications]
      operationId: updateQuietHours
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuietHoursRequest"
      responses:
        "200":
          description: Quiet hours updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuietHours"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/notifications/dnd:
    post:
      summary: Toggle manual Do Not Disturb mode
      tags: [notifications]
      operationId: toggleDND
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                until:
                  type: string
                  format: date-time
                  description: Optional end time for DND (RFC3339)
      responses:
        "200":
          description: DND toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuietHours"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ========================================================================
  # Dashboard Endpoints
  # ========================================================================

  /api/v1/dashboard/layout:
    get:
      summary: Get effective dashboard layout for authenticated user
      tags: [dashboard]
      operationId: getDashboardLayout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard layout (user override or role default)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardLayoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Save personal dashboard layout
      tags: [dashboard]
      operationId: saveDashboardLayout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDashboardLayoutRequest"
      responses:
        "200":
          description: Layout saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardLayoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Reset dashboard to role defaults
      tags: [dashboard]
      operationId: resetDashboardLayout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Layout reset to defaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/dashboard/defaults/{role}:
    get:
      summary: Get default dashboard layout for a role (admin only)
      tags: [dashboard]
      operationId: getDashboardDefaults
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [admin, manager, member]
      responses:
        "200":
          description: Role default layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardDefault"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Save default dashboard layout for a role (admin only)
      tags: [dashboard]
      operationId: saveDashboardDefaults
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [admin, manager, member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDashboardDefaultsRequest"
      responses:
        "200":
          description: Default layout saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardDefault"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (15 min expiry)

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    UserInfo:
      type: object
      description: Go encoding/json serialization uses snake_case field names.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
        roles:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean

    RoleRequest:
      type: object
      required: [role_name]
      properties:
        role_name:
          type: string
          enum: [admin, manager, member]

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8

    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, manager, member]

    AcceptInvitationRequest:
      type: object
      required: [password, first_name, last_name]
      properties:
        password:
          type: string
          format: password
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string

    InvitationInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    InvitationResponse:
      type: object
      properties:
        invitation:
          $ref: "#/components/schemas/InvitationInfo"
        token:
          type: string
          description: Plain token, only returned on creation

    ListInvitationsResponse:
      type: object
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/InvitationInfo"

    AuthResponse:
      type: object
      description: Returned by register and login. Go encoding/json uses snake_case.
      properties:
        user:
          $ref: "#/components/schemas/UserInfo"
        access_token:
          type: string
        refresh_token:
          type: string

    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    GetUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserInfo"

    ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserInfo"
        total:
          type: integer

    StatusResponse:
      type: object
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    # Custom Fields
    CustomFieldInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        entityType:
          type: string
          enum: [contact, company, deal, activity]
        fieldType:
          type: string
          enum: [text, number, date, boolean, select, multiselect]
        options:
          type: array
          items:
            type: string
        isRequired:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCustomFieldRequest:
      type: object
      required: [name, entity_type, field_type]
      properties:
        name:
          type: string
        entity_type:
          type: string
          enum: [contact, company, deal, activity]
        field_type:
          type: string
          enum: [text, number, date, boolean, select, multiselect]
        options:
          type: array
          items:
            type: string
        is_required:
          type: boolean
          default: false

    UpdateCustomFieldRequest:
      type: object
      properties:
        name:
          type: string
        options:
          type: array
          items:
            type: string
        is_required:
          type: boolean

    CustomFieldResponse:
      type: object
      properties:
        customField:
          $ref: "#/components/schemas/CustomFieldInfo"

    ListCustomFieldsResponse:
      type: object
      properties:
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CustomFieldInfo"

    # Tags
    TagInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Hex color code (#rrggbb)
        entityType:
          type: string
          enum: [contact, company, deal, activity]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTagRequest:
      type: object
      required: [name, entity_type]
      properties:
        name:
          type: string
        color:
          type: string
          description: Hex color code (#rrggbb)
          default: "#3b82f6"
        entity_type:
          type: string
          enum: [contact, company, deal, activity]

    UpdateTagRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string

    TagResponse:
      type: object
      properties:
        tag:
          $ref: "#/components/schemas/TagInfo"

    ListTagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagInfo"

    TagIdsRequest:
      type: object
      required: [tag_ids]
      properties:
        tag_ids:
          type: array
          items:
            type: string
            format: uuid

    # Contacts
    ContactInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        companyId:
          type: string
          format: uuid
        companyName:
          type: string
        notes:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagInfo"
        customFields:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateContactRequest:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        company_id:
          type: string
          format: uuid
        notes:
          type: string
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: object
          additionalProperties: true

    UpdateContactRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        company_id:
          type: string
          format: uuid
        notes:
          type: string
        custom_fields:
          type: object
          additionalProperties: true

    ContactResponse:
      type: object
      properties:
        contact:
          $ref: "#/components/schemas/ContactInfo"

    ListContactsResponse:
      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactInfo"
        total:
          type: integer

    # Companies
    CompanyInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        website:
          type: string
        industry:
          type: string
        address:
          type: string
        notes:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagInfo"
        customFields:
          type: object
          additionalProperties: true
        contactCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        website:
          type: string
        industry:
          type: string
        address:
          type: string
        notes:
          type: string
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: object
          additionalProperties: true

    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
        website:
          type: string
        industry:
          type: string
        address:
          type: string
        notes:
          type: string
        custom_fields:
          type: object
          additionalProperties: true

    CompanyResponse:
      type: object
      properties:
        company:
          $ref: "#/components/schemas/CompanyInfo"

    ListCompaniesResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: "#/components/schemas/CompanyInfo"
        total:
          type: integer

    # Pipeline Stages
    PipelineStageInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Hex color code (#rrggbb)
        sortOrder:
          type: integer
        isWon:
          type: boolean
        isLost:
          type: boolean
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 100
        dealCount:
          type: integer
        totalValue:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePipelineStageRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string
          description: Hex color code (#rrggbb)
          default: "#3b82f6"
        is_won:
          type: boolean
          default: false
        is_lost:
          type: boolean
          default: false
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 100
          default: 0

    UpdatePipelineStageRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        is_won:
          type: boolean
        is_lost:
          type: boolean
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 100

    ReorderPipelineStagesRequest:
      type: object
      required: [stage_ids]
      properties:
        stage_ids:
          type: array
          items:
            type: string
            format: uuid

    PipelineStageResponse:
      type: object
      properties:
        stage:
          $ref: "#/components/schemas/PipelineStageInfo"

    ListPipelineStagesResponse:
      type: object
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStageInfo"

    # Deals
    DealInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        value:
          type: number
          format: double
        currency:
          type: string
          description: ISO 4217 currency code
        stageId:
          type: string
          format: uuid
        stageName:
          type: string
        contactId:
          type: string
          format: uuid
        contactName:
          type: string
        companyId:
          type: string
          format: uuid
        companyName:
          type: string
        ownerId:
          type: string
          format: uuid
        ownerName:
          type: string
        expectedCloseDate:
          type: string
          format: date
        notes:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagInfo"
        customFields:
          type: object
          additionalProperties: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time

    CreateDealRequest:
      type: object
      required: [name, stage_id]
      properties:
        name:
          type: string
        value:
          type: number
          format: double
          default: 0
        currency:
          type: string
          description: ISO 4217 currency code
          default: EUR
        stage_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        expected_close_date:
          type: string
          format: date
        notes:
          type: string
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: object
          additionalProperties: true

    UpdateDealRequest:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
          format: double
        currency:
          type: string
        contact_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        expected_close_date:
          type: string
          format: date
        notes:
          type: string
        custom_fields:
          type: object
          additionalProperties: true

    MoveDealToStageRequest:
      type: object
      required: [stage_id]
      properties:
        stage_id:
          type: string
          format: uuid

    DealResponse:
      type: object
      properties:
        deal:
          $ref: "#/components/schemas/DealInfo"

    ListDealsResponse:
      type: object
      properties:
        deals:
          type: array
          items:
            $ref: "#/components/schemas/DealInfo"
        total:
          type: integer

    # ============================================================================
    # Activity Schemas
    # ============================================================================

    ActivityInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        activity_type:
          type: string
          enum: [call, meeting, note, email, task]
        subject:
          type: string
        description:
          type: string
        contact_id:
          type: string
          format: uuid
        contact_name:
          type: string
        company_id:
          type: string
          format: uuid
        company_name:
          type: string
        deal_id:
          type: string
          format: uuid
        deal_name:
          type: string
        assigned_to:
          type: string
          format: uuid
        assigned_to_name:
          type: string
        due_date:
          type: string
          format: date-time
        is_completed:
          type: boolean
        completed_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateActivityRequest:
      type: object
      required: [activity_type, subject]
      properties:
        activity_type:
          type: string
          enum: [call, meeting, note, email, task]
        subject:
          type: string
        description:
          type: string
        contact_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        deal_id:
          type: string
          format: uuid
        assigned_to:
          type: string
          format: uuid
        due_date:
          type: string
          format: date-time

    UpdateActivityRequest:
      type: object
      properties:
        subject:
          type: string
        description:
          type: string
        contact_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        deal_id:
          type: string
          format: uuid
        assigned_to:
          type: string
          format: uuid
        due_date:
          type: string
          format: date-time

    ActivityResponse:
      type: object
      properties:
        activity:
          $ref: "#/components/schemas/ActivityInfo"

    ListActivitiesResponse:
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ActivityInfo"
        total:
          type: integer

    # ============================================================================
    # Search Schemas
    # ============================================================================

    SearchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum: [contact, company, deal, activity]
        title:
          type: string
          description: Primary display text (name, subject)
        subtitle:
          type: string
          description: Secondary display text (email, value)
        score:
          type: number
          format: double
          description: Relevance score (higher is better)

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"

    # Saved Filters Schemas

    SavedFilter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        entity_type:
          type: string
          enum: [contact, company, deal, activity]
        filter_json:
          type: string
          description: JSON-encoded filter criteria
        is_default:
          type: boolean
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSavedFilterRequest:
      type: object
      required: [name, entity_type, filter_json]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        entity_type:
          type: string
          enum: [contact, company, deal, activity]
        filter_json:
          type: string
          description: JSON-encoded filter criteria
        is_default:
          type: boolean
          default: false

    UpdateSavedFilterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        filter_json:
          type: string
          description: JSON-encoded filter criteria
        is_default:
          type: boolean

    SavedFilterResponse:
      type: object
      properties:
        filter:
          $ref: "#/components/schemas/SavedFilter"

    ListSavedFiltersResponse:
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: "#/components/schemas/SavedFilter"

    # Report Schemas

    PipelineStageValue:
      type: object
      properties:
        stage_id:
          type: string
          format: uuid
        stage_name:
          type: string
        deal_count:
          type: integer
        total_value:
          type: number
          format: double
        weighted_value:
          type: number
          format: double
          description: value × (probability / 100)

    PipelineReportResponse:
      type: object
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStageValue"
        total_deals:
          type: integer
        total_value:
          type: number
          format: double
        total_weighted_value:
          type: number
          format: double

    ConversionMetric:
      type: object
      properties:
        from_stage:
          type: string
        to_stage:
          type: string
        converted_count:
          type: integer
        conversion_rate:
          type: number
          format: double
          description: Percentage of total transitions
        average_days:
          type: number
          format: double
          description: Average days between stages

    ConversionReportResponse:
      type: object
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ConversionMetric"
        overall_win_rate:
          type: number
          format: double
          description: Percentage of deals that reached Won stage
        average_deal_cycle:
          type: number
          format: double
          description: Average days from creation to close

    ActivityMetric:
      type: object
      properties:
        activity_type:
          type: string
          enum: [call, meeting, note, email, task]
        total_count:
          type: integer
        completed_count:
          type: integer
        overdue_count:
          type: integer

    ActivityReportResponse:
      type: object
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ActivityMetric"
        total_activities:
          type: integer
        completion_rate:
          type: number
          format: double
          description: Percentage of completed activities

    # ========================================================================
    # Chat Schemas
    # ========================================================================

    ChannelInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_private:
          type: boolean
        is_dm:
          type: boolean
        is_archived:
          type: boolean
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        member_count:
          type: integer
        my_role:
          type: string
          enum: [owner, admin, member]
        last_message:
          $ref: "#/components/schemas/MessageInfo"
        unread_count:
          type: integer
          description: Number of unread messages in the channel for the current user

    MessageInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        content:
          type: string
        is_deleted:
          type: boolean
        edited_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        sender_first_name:
          type: string
        sender_last_name:
          type: string
        parent_message_id:
          type: string
          format: uuid
          description: ID of parent message (for thread replies)
        reply_count:
          type: integer
          description: Number of thread replies
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/MentionInfo"
          description: Users mentioned in this message
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileInfo"
          description: Files attached to this message

    MemberInfo:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member]
        joined_at:
          type: string
          format: date-time
        last_read_at:
          type: string
          format: date-time
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string

    CreateChannelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        is_private:
          type: boolean
          default: false
        initial_member_ids:
          type: array
          items:
            type: string
            format: uuid

    UpdateChannelRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    ChannelResponse:
      type: object
      properties:
        channel:
          $ref: "#/components/schemas/ChannelInfo"

    ListChannelsResponse:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelInfo"
        total:
          type: integer

    MemberResponse:
      type: object
      properties:
        member:
          $ref: "#/components/schemas/MemberInfo"

    ListMembersResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberInfo"
        total:
          type: integer

    MessageResponse:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/MessageInfo"

    ListMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageInfo"
        has_more:
          type: boolean

    GetOrCreateDMResponse:
      type: object
      properties:
        channel:
          $ref: "#/components/schemas/ChannelInfo"
        created:
          type: boolean
          description: true if a new DM was created, false if existing

    ThreadRepliesResponse:
      type: object
      properties:
        parent:
          $ref: "#/components/schemas/MessageInfo"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/MessageInfo"
        has_more:
          type: boolean

    MentionInfo:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        mention_type:
          type: string
          enum: [user, channel, everyone]
        first_name:
          type: string
        last_name:
          type: string

    UnreadCountsResponse:
      type: object
      properties:
        unread_counts:
          type: object
          additionalProperties:
            type: integer
          description: Map of channel_id to unread message count

    UserMentionsResponse:
      type: object
      properties:
        mentions:
          type: array
          items:
            type: object
            properties:
              message_id:
                type: string
                format: uuid
              channel_id:
                type: string
                format: uuid
              content:
                type: string
              mention_type:
                type: string
                enum: [user, channel, everyone]
              sender_first_name:
                type: string
              sender_last_name:
                type: string
              created_at:
                type: string
                format: date-time
        total:
          type: integer

    FileInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        filename:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64
          description: File size in bytes
        uploaded_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        uploader_first_name:
          type: string
        uploader_last_name:
          type: string
        has_thumbnail:
          type: boolean
          description: Whether a thumbnail is available (images only)

    ChatSearchResult:
      type: object
      properties:
        type:
          type: string
          enum: [message, file]
          description: Result type
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        channel_name:
          type: string
        score:
          type: number
          format: double
          description: Relevance score
        snippet:
          type: string
          description: Highlighted text snippet with <mark> tags
        created_at:
          type: string
          format: date-time
        first_name:
          type: string
        last_name:
          type: string
        message_id:
          type: string
          format: uuid
          description: Present for message results
        parent_message_id:
          type: string
          format: uuid
          description: Present if message is a thread reply
        file_id:
          type: string
          format: uuid
          description: Present for file results
        filename:
          type: string
          description: Present for file results
        mime_type:
          type: string
          description: Present for file results
        file_size:
          type: integer
          format: int64
          description: Present for file results

    # =========================================================================
    # Notification Schemas
    # =========================================================================

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        event_type_key:
          type: string
        module_id:
          type: string
        priority:
          type: string
          enum: [low, normal, high, urgent]
        actor_id:
          type: string
          format: uuid
        resource_id:
          type: string
        title:
          type: string
        body:
          type: string
        deep_link:
          type: string
        group_key:
          type: string
        group_count:
          type: integer
        is_read:
          type: boolean
        read_at:
          type: string
          format: date-time
        delivered_desktop:
          type: boolean
        created_at:
          type: string
          format: date-time

    NotificationPreference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        event_type_key:
          type: string
        module_id:
          type: string
        in_app:
          type: boolean
        desktop_push:
          type: boolean
        sound:
          type: string

    UpdateNotificationPreferenceRequest:
      type: object
      properties:
        event_type_key:
          type: string
          description: Specific event type key (mutually exclusive with module_id for module-level default)
        module_id:
          type: string
          description: Module ID for module-level default preference
        in_app:
          type: boolean
        desktop_push:
          type: boolean
        sound:
          type: string

    EventType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        module_id:
          type: string
        event_key:
          type: string
        display_name:
          type: string
        description:
          type: string
        default_priority:
          type: string
          enum: [low, normal, high, urgent]
        default_in_app:
          type: boolean
        default_desktop_push:
          type: boolean
        default_sound:
          type: string

    NotificationMute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        module_id:
          type: string
        resource_id:
          type: string
        created_at:
          type: string
          format: date-time

    QuietHours:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        start_time:
          type: string
          description: Start time in HH:MM format
        end_time:
          type: string
          description: End time in HH:MM format
        timezone:
          type: string
          description: IANA timezone (e.g. Europe/Berlin)
        days_of_week:
          type: array
          items:
            type: integer
          description: Days of week (0=Sunday, 6=Saturday)
        enabled:
          type: boolean
        manual_dnd:
          type: boolean
        manual_dnd_until:
          type: string
          format: date-time

    UpdateQuietHoursRequest:
      type: object
      required: [start_time, end_time, timezone, enabled]
      properties:
        start_time:
          type: string
        end_time:
          type: string
        timezone:
          type: string
        days_of_week:
          type: array
          items:
            type: integer
        enabled:
          type: boolean

    # ========================================================================
    # Dashboard Schemas
    # ========================================================================

    DashboardLayoutResponse:
      type: object
      properties:
        layout:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Grid layout items (react-grid-layout format)
        active_widgets:
          type: array
          items:
            type: string
          description: List of active widget IDs
        is_custom:
          type: boolean
          description: Whether this is a user override (true) or role default (false)
        updated_at:
          type: string
          format: date-time

    SaveDashboardLayoutRequest:
      type: object
      required: [layout, active_widgets]
      properties:
        layout:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Grid layout items
        active_widgets:
          type: array
          items:
            type: string
          description: List of active widget IDs

    DashboardDefault:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, manager, member]
        layout:
          type: array
          items:
            type: object
            additionalProperties: true
        active_widgets:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SaveDashboardDefaultsRequest:
      type: object
      required: [layout, active_widgets]
      properties:
        layout:
          type: array
          items:
            type: object
            additionalProperties: true
        active_widgets:
          type: array
          items:
            type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict (e.g. duplicate email)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
