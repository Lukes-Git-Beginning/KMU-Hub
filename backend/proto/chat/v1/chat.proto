syntax = "proto3";

package chat.v1;

option go_package = "github.com/kmuhub/kmuhub/proto/chat/v1;chatv1";

service ChatService {
  // Channels (Sprint 1)
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  rpc ArchiveChannel(ArchiveChannelRequest) returns (ArchiveChannelResponse);

  // Channel Memberships (Sprint 1)
  rpc JoinChannel(JoinChannelRequest) returns (JoinChannelResponse);
  rpc LeaveChannel(LeaveChannelRequest) returns (LeaveChannelResponse);
  rpc GetChannelMembers(GetChannelMembersRequest) returns (GetChannelMembersResponse);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);

  // Messages (Sprint 1)
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  rpc UpdateMessage(UpdateMessageRequest) returns (UpdateMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);

  // Direct Messages (Sprint 2)
  rpc GetOrCreateDM(GetOrCreateDMRequest) returns (GetOrCreateDMResponse);
  rpc ListDMs(ListDMsRequest) returns (ListDMsResponse);

  // Threads (Sprint 2)
  rpc GetThreadReplies(GetThreadRepliesRequest) returns (GetThreadRepliesResponse);

  // Mentions & Read Receipts (Sprint 3)
  rpc MarkChannelRead(MarkChannelReadRequest) returns (MarkChannelReadResponse);
  rpc GetUnreadCounts(GetUnreadCountsRequest) returns (GetUnreadCountsResponse);
  rpc GetUserMentions(GetUserMentionsRequest) returns (GetUserMentionsResponse);

  // Files (Sprint 4)
  rpc GetFileDownloadURL(GetFileDownloadURLRequest) returns (GetFileDownloadURLResponse);
  rpc GetFileThumbnailURL(GetFileThumbnailURLRequest) returns (GetFileThumbnailURLResponse);
  rpc ListChannelFiles(ListChannelFilesRequest) returns (ListChannelFilesResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);

  // Search (Sprint 4)
  rpc SearchChat(SearchChatRequest) returns (SearchChatResponse);

  // Reactions (Phase 8)
  rpc ToggleReaction(ToggleReactionRequest) returns (ToggleReactionResponse);
  rpc ListReactions(ListReactionsRequest) returns (ListReactionsResponse);
  rpc GetReactionSummary(GetReactionSummaryRequest) returns (GetReactionSummaryResponse);
}

// ============================================================================
// Channel Messages
// ============================================================================

message ChannelInfo {
  string id = 1;
  string name = 2;
  optional string description = 3;
  bool is_private = 4;
  bool is_dm = 5;
  bool is_archived = 6;
  string created_by = 7;
  string created_at = 8;
  string updated_at = 9;
  // Denormalized fields for API responses
  int32 member_count = 10;
  optional string my_role = 11;  // Current user's role in the channel
  optional MessageInfo last_message = 12;
  int32 unread_count = 13;  // Unread messages for the requesting user (Sprint 3)
  bool is_guest_enabled = 14;  // Whether this channel accepts guest chat sessions
}

message CreateChannelRequest {
  string name = 1;
  optional string description = 2;
  bool is_private = 3;
  string created_by = 4;
  repeated string initial_member_ids = 5;  // Optional initial members to add
}

message CreateChannelResponse {
  ChannelInfo channel = 1;
}

message GetChannelRequest {
  string id = 1;
  string user_id = 2;  // For calculating my_role
}

message GetChannelResponse {
  ChannelInfo channel = 1;
}

message ListChannelsRequest {
  string user_id = 1;  // List channels this user is a member of
  bool include_archived = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListChannelsResponse {
  repeated ChannelInfo channels = 1;
  int32 total = 2;
}

message UpdateChannelRequest {
  string id = 1;
  string user_id = 2;  // For permission check
  optional string name = 3;
  optional string description = 4;
}

message UpdateChannelResponse {
  ChannelInfo channel = 1;
}

message DeleteChannelRequest {
  string id = 1;
  string user_id = 2;  // Must be owner
}

message DeleteChannelResponse {}

message ArchiveChannelRequest {
  string id = 1;
  string user_id = 2;  // Must be owner or admin
}

message ArchiveChannelResponse {
  ChannelInfo channel = 1;
}

// ============================================================================
// Channel Membership Messages
// ============================================================================

message MemberInfo {
  string user_id = 1;
  string role = 2;  // owner, admin, member
  string joined_at = 3;
  optional string last_read_at = 4;
  // Denormalized user info
  string first_name = 5;
  string last_name = 6;
  string email = 7;
}

message JoinChannelRequest {
  string channel_id = 1;
  string user_id = 2;
}

message JoinChannelResponse {
  MemberInfo member = 1;
}

message LeaveChannelRequest {
  string channel_id = 1;
  string user_id = 2;
}

message LeaveChannelResponse {}

message GetChannelMembersRequest {
  string channel_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetChannelMembersResponse {
  repeated MemberInfo members = 1;
  int32 total = 2;
}

message UpdateMemberRoleRequest {
  string channel_id = 1;
  string target_user_id = 2;  // User whose role is being changed
  string requester_user_id = 3;  // User making the request (must be owner/admin)
  string new_role = 4;  // admin or member (cannot change to owner)
}

message UpdateMemberRoleResponse {
  MemberInfo member = 1;
}

// ============================================================================
// Message Messages
// ============================================================================

enum MentionType {
  MENTION_TYPE_USER = 0;
  MENTION_TYPE_CHANNEL = 1;
  MENTION_TYPE_EVERYONE = 2;
}

message MentionInfo {
  string user_id = 1;
  MentionType mention_type = 2;
  string first_name = 3;
  string last_name = 4;
}

message MessageInfo {
  string id = 1;
  string channel_id = 2;
  string content = 3;
  bool is_deleted = 4;
  optional string edited_at = 5;
  string created_by = 6;
  string created_at = 7;
  // Denormalized sender info
  string sender_first_name = 8;
  string sender_last_name = 9;
  // Thread support (Sprint 2)
  optional string parent_message_id = 10;
  int32 reply_count = 11;
  // Mentions (Sprint 3)
  repeated MentionInfo mentions = 12;
  // Files (Sprint 4)
  repeated FileInfo files = 13;
  // Guest chat (Phase 17.5)
  optional string guest_session_id = 14;
  optional string guest_display_name = 15;
}

message SendMessageRequest {
  string channel_id = 1;
  string content = 2;
  string created_by = 3;
  optional string parent_message_id = 4;  // For thread replies
  repeated string mentioned_user_ids = 5;  // User IDs to mention (Sprint 3)
  bool mention_everyone = 6;               // @everyone/@channel mention (Sprint 3)
  optional string guest_session_id = 7;    // For guest chat messages (mutually exclusive with created_by)
}

message SendMessageResponse {
  MessageInfo message = 1;
}

message GetMessagesRequest {
  string channel_id = 1;
  string user_id = 2;  // For membership check
  int32 limit = 3;  // Default 50
  optional string before = 4;  // Cursor: get messages before this message ID
  optional string after = 5;   // Cursor: get messages after this message ID
}

message GetMessagesResponse {
  repeated MessageInfo messages = 1;
  bool has_more = 2;
}

message UpdateMessageRequest {
  string id = 1;
  string user_id = 2;  // Must be the message author
  string content = 3;
}

message UpdateMessageResponse {
  MessageInfo message = 1;
}

message DeleteMessageRequest {
  string id = 1;
  string user_id = 2;  // Must be author or channel admin/owner
}

message DeleteMessageResponse {}

// ============================================================================
// Direct Message Messages (Sprint 2)
// ============================================================================

message GetOrCreateDMRequest {
  string user_id = 1;        // The requesting user
  string other_user_id = 2;  // The other user in the DM
}

message GetOrCreateDMResponse {
  ChannelInfo channel = 1;
  bool created = 2;  // true if a new DM was created, false if existing
}

message ListDMsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListDMsResponse {
  repeated ChannelInfo channels = 1;
  int32 total = 2;
}

// ============================================================================
// Thread Messages (Sprint 2)
// ============================================================================

message GetThreadRepliesRequest {
  string parent_message_id = 1;
  string user_id = 2;        // For membership check
  int32 limit = 3;           // Default 50
  optional string before = 4;  // Cursor: messages before this ID
  optional string after = 5;   // Cursor: messages after this ID
}

message GetThreadRepliesResponse {
  MessageInfo parent = 1;             // The parent message
  repeated MessageInfo replies = 2;   // Thread replies
  bool has_more = 3;
}

// ============================================================================
// Mentions & Read Receipts (Sprint 3)
// ============================================================================

message MarkChannelReadRequest {
  string channel_id = 1;
  string user_id = 2;
  string message_id = 3;  // Mark as read up to this message
}

message MarkChannelReadResponse {}

message GetUnreadCountsRequest {
  string user_id = 1;
}

message GetUnreadCountsResponse {
  map<string, int32> unread_counts = 1;  // channel_id -> unread count
}

message GetUserMentionsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message MentionDetail {
  string message_id = 1;
  string channel_id = 2;
  string content = 3;
  MentionType mention_type = 4;
  string sender_first_name = 5;
  string sender_last_name = 6;
  string created_at = 7;
}

message GetUserMentionsResponse {
  repeated MentionDetail mentions = 1;
  int32 total = 2;
}

// ============================================================================
// File Messages (Sprint 4)
// ============================================================================

message FileInfo {
  string id = 1;
  optional string message_id = 2;
  string channel_id = 3;
  string filename = 4;
  string mime_type = 5;
  int64 file_size = 6;
  string uploaded_by = 7;
  string created_at = 8;
  string uploader_first_name = 9;
  string uploader_last_name = 10;
  optional string thumbnail_url = 11;
}

message GetFileDownloadURLRequest {
  string file_id = 1;
  string user_id = 2;
}

message GetFileDownloadURLResponse {
  string url = 1;
}

message GetFileThumbnailURLRequest {
  string file_id = 1;
  string user_id = 2;
}

message GetFileThumbnailURLResponse {
  string url = 1;
}

message ListChannelFilesRequest {
  string channel_id = 1;
  string user_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListChannelFilesResponse {
  repeated FileInfo files = 1;
  int32 total = 2;
}

message DeleteFileRequest {
  string file_id = 1;
  string user_id = 2;
}

message DeleteFileResponse {}

// ============================================================================
// Search Messages (Sprint 4)
// ============================================================================

message SearchChatRequest {
  string query = 1;
  string user_id = 2;
  optional string channel_id = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ChatSearchResultProto {
  string type = 1;  // "message" or "file"
  string id = 2;
  string channel_id = 3;
  string channel_name = 4;
  double score = 5;
  string snippet = 6;
  string created_at = 7;
  string first_name = 8;
  string last_name = 9;
  optional string message_id = 10;
  optional string parent_message_id = 11;
  optional string file_id = 12;
  optional string filename = 13;
  optional string mime_type = 14;
  optional int64 file_size = 15;
}

message SearchChatResponse {
  repeated ChatSearchResultProto results = 1;
  int32 total = 2;
}

// ============================================================================
// Reaction Messages (Phase 8)
// ============================================================================

message Reaction {
  string message_id = 1;
  string user_id = 2;
  string emoji = 3;
  string created_at = 4;
  // Denormalized user info
  string first_name = 5;
  string last_name = 6;
}

message ReactionSummary {
  string message_id = 1;
  string emoji = 2;
  int32 count = 3;
  repeated string user_ids = 4;
  bool current_user_reacted = 5;
}

message ToggleReactionRequest {
  string message_id = 1;
  string user_id = 2;
  string emoji = 3;
}

message ToggleReactionResponse {
  repeated Reaction reactions = 1;
  bool added = 2;
}

message ListReactionsRequest {
  string message_id = 1;
  string user_id = 2;
}

message ListReactionsResponse {
  repeated Reaction reactions = 1;
}

message GetReactionSummaryRequest {
  repeated string message_ids = 1;
  string user_id = 2;
}

message GetReactionSummaryResponse {
  repeated ReactionSummary summaries = 1;
}
