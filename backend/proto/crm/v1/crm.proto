  string subject = 3;
  string description = 4;
  optional string contact_id = 5;
  optional string contact_name = 6;
  optional string company_id = 7;
  optional string company_name = 8;
  optional string deal_id = 9;
  optional string deal_name = 10;
  optional string assigned_to = 11;
  optional string assigned_to_name = 12;
  string due_date = 13;
  bool is_completed = 14;
  optional string completed_at = 15;
  string created_by = 16;
  string created_at = 17;
  string updated_at = 18;
}

message CreateActivityRequest {
  string tenant_id = 10;
  string activity_type = 1;
  string subject = 2;
  string description = 3;
  optional string contact_id = 4;
  optional string company_id = 5;
  optional string deal_id = 6;
  optional string assigned_to = 7;
  string due_date = 8;
  string created_by = 9;
}

message CreateActivityResponse {
  ActivityInfo activity = 1;
}

message GetActivityRequest {
  string id = 1;
  string tenant_id = 2;
}

message GetActivityResponse {
  ActivityInfo activity = 1;
}

message ListActivitiesRequest {
  string tenant_id = 11;
  optional string activity_type = 1;
  optional string contact_id = 2;
  optional string company_id = 3;
  optional string deal_id = 4;
  optional string assigned_to = 5;
  optional bool is_completed = 6;
  int32 page = 7;
  int32 page_size = 8;
  string sort_by = 9;
  bool sort_desc = 10;
}

message ListActivitiesResponse {
  repeated ActivityInfo activities = 1;
  int32 total = 2;
}

message UpdateActivityRequest {
  string id = 1;
  string tenant_id = 9;
  optional string subject = 2;
  optional string description = 3;
  optional string contact_id = 4;
  optional string company_id = 5;
  optional string deal_id = 6;
  optional string assigned_to = 7;
  optional string due_date = 8;
}

message UpdateActivityResponse {
  ActivityInfo activity = 1;
}

message DeleteActivityRequest {
  string id = 1;
  string tenant_id = 2;
}

message DeleteActivityResponse {}

message CompleteActivityRequest {
  string id = 1;
  string tenant_id = 2;
}

message CompleteActivityResponse {
  ActivityInfo activity = 1;
}

// ============================================================================
// Search Messages
// ============================================================================

message SearchResult {
