syntax = "proto3";

package crm.v1;

option go_package = "github.com/kmuhub/kmuhub/proto/crm/v1;crmv1";

service CRMService {
  // Custom Fields
  rpc CreateCustomField(CreateCustomFieldRequest) returns (CreateCustomFieldResponse);
  rpc GetCustomField(GetCustomFieldRequest) returns (GetCustomFieldResponse);
  rpc ListCustomFields(ListCustomFieldsRequest) returns (ListCustomFieldsResponse);
  rpc UpdateCustomField(UpdateCustomFieldRequest) returns (UpdateCustomFieldResponse);
  rpc DeleteCustomField(DeleteCustomFieldRequest) returns (DeleteCustomFieldResponse);

  // Tags (Sprint 1)
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc GetTag(GetTagRequest) returns (GetTagResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc UpdateTag(UpdateTagRequest) returns (UpdateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);

  // Contacts (Sprint 2)
  rpc CreateContact(CreateContactRequest) returns (CreateContactResponse);
  rpc GetContact(GetContactRequest) returns (GetContactResponse);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  rpc UpdateContact(UpdateContactRequest) returns (UpdateContactResponse);
  rpc DeleteContact(DeleteContactRequest) returns (DeleteContactResponse);
  rpc AddContactTags(AddContactTagsRequest) returns (AddContactTagsResponse);
  rpc RemoveContactTags(RemoveContactTagsRequest) returns (RemoveContactTagsResponse);

  // Contact Import/Export (Phase 10)
  rpc ImportContactsCSV(ImportContactsCSVRequest) returns (ImportContactsResponse);
  rpc ImportContactsVCard(ImportContactsVCardRequest) returns (ImportContactsResponse);
  rpc ExportContactsCSV(ExportContactsCSVRequest) returns (ExportContactsResponse);
  rpc ExportContactsVCard(ExportContactsVCardRequest) returns (ExportContactsResponse);
  rpc PreviewImportCSV(PreviewImportCSVRequest) returns (PreviewImportCSVResponse);
  rpc UpdateContactVisibility(UpdateContactVisibilityRequest) returns (UpdateContactVisibilityResponse);

  // Companies (Sprint 2)
  rpc CreateCompany(CreateCompanyRequest) returns (CreateCompanyResponse);
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse);
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse);
  rpc UpdateCompany(UpdateCompanyRequest) returns (UpdateCompanyResponse);
  rpc DeleteCompany(DeleteCompanyRequest) returns (DeleteCompanyResponse);
  rpc GetCompanyContacts(GetCompanyContactsRequest) returns (GetCompanyContactsResponse);

  // Pipeline Stages (Sprint 3)
  rpc CreatePipelineStage(CreatePipelineStageRequest) returns (CreatePipelineStageResponse);
  rpc GetPipelineStage(GetPipelineStageRequest) returns (GetPipelineStageResponse);
  rpc ListPipelineStages(ListPipelineStagesRequest) returns (ListPipelineStagesResponse);
  rpc UpdatePipelineStage(UpdatePipelineStageRequest) returns (UpdatePipelineStageResponse);
  rpc DeletePipelineStage(DeletePipelineStageRequest) returns (DeletePipelineStageResponse);
  rpc ReorderPipelineStages(ReorderPipelineStagesRequest) returns (ReorderPipelineStagesResponse);

  // Deals (Sprint 3)
  rpc CreateDeal(CreateDealRequest) returns (CreateDealResponse);
  rpc GetDeal(GetDealRequest) returns (GetDealResponse);
  rpc ListDeals(ListDealsRequest) returns (ListDealsResponse);
  rpc UpdateDeal(UpdateDealRequest) returns (UpdateDealResponse);
  rpc DeleteDeal(DeleteDealRequest) returns (DeleteDealResponse);
  rpc MoveDealToStage(MoveDealToStageRequest) returns (MoveDealToStageResponse);

  // Activities (Sprint 4)
  rpc CreateActivity(CreateActivityRequest) returns (CreateActivityResponse);
  rpc GetActivity(GetActivityRequest) returns (GetActivityResponse);
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
  rpc UpdateActivity(UpdateActivityRequest) returns (UpdateActivityResponse);
  rpc DeleteActivity(DeleteActivityRequest) returns (DeleteActivityResponse);
  rpc CompleteActivity(CompleteActivityRequest) returns (CompleteActivityResponse);

  // Search (Sprint 4)
  rpc Search(SearchRequest) returns (SearchResponse);

  // Filters (Sprint 5)
  rpc CreateSavedFilter(CreateSavedFilterRequest) returns (CreateSavedFilterResponse);
  rpc GetSavedFilter(GetSavedFilterRequest) returns (GetSavedFilterResponse);
  rpc ListSavedFilters(ListSavedFiltersRequest) returns (ListSavedFiltersResponse);
  rpc UpdateSavedFilter(UpdateSavedFilterRequest) returns (UpdateSavedFilterResponse);
  rpc DeleteSavedFilter(DeleteSavedFilterRequest) returns (DeleteSavedFilterResponse);

  // Reports (Sprint 5)
  rpc GetPipelineReport(GetPipelineReportRequest) returns (GetPipelineReportResponse);
  rpc GetConversionReport(GetConversionReportRequest) returns (GetConversionReportResponse);
  rpc GetActivityReport(GetActivityReportRequest) returns (GetActivityReportResponse);

  // Duplicate Detection
  rpc FindContactDuplicates(FindContactDuplicatesRequest) returns (FindContactDuplicatesResponse);
  rpc MergeContacts(MergeContactsRequest) returns (MergeContactsResponse);
  rpc FindCompanyDuplicates(FindCompanyDuplicatesRequest) returns (FindCompanyDuplicatesResponse);
  rpc MergeCompanies(MergeCompaniesRequest) returns (MergeCompaniesResponse);

  // Contact Timeline
  rpc GetContactTimeline(GetContactTimelineRequest) returns (GetContactTimelineResponse);

  // GDPR Consent Management
  rpc GetContactConsents(GetContactConsentsRequest) returns (GetContactConsentsResponse);
  rpc GrantConsent(GrantConsentRequest) returns (GrantConsentResponse);
  rpc RevokeConsent(RevokeConsentRequest) returns (RevokeConsentResponse);
  rpc GetConsentHistory(GetConsentHistoryRequest) returns (GetConsentHistoryResponse);
  rpc RequestDeletion(RequestDeletionRequest) returns (RequestDeletionResponse);
  rpc ProcessDeletion(ProcessDeletionRequest) returns (ProcessDeletionResponse);

  // Advisory Protocols (Beratungsprotokolle — P8)
  rpc CreateAdvisoryProtocol(CreateAdvisoryProtocolRequest) returns (CreateAdvisoryProtocolResponse);
  rpc GetAdvisoryProtocol(GetAdvisoryProtocolRequest) returns (GetAdvisoryProtocolResponse);
  rpc ListAdvisoryProtocols(ListAdvisoryProtocolsRequest) returns (ListAdvisoryProtocolsResponse);
  rpc UpdateAdvisoryProtocol(UpdateAdvisoryProtocolRequest) returns (UpdateAdvisoryProtocolResponse);
  rpc DeleteAdvisoryProtocol(DeleteAdvisoryProtocolRequest) returns (DeleteAdvisoryProtocolResponse);
  rpc HandOverAdvisoryProtocol(HandOverAdvisoryProtocolRequest) returns (HandOverAdvisoryProtocolResponse);
  rpc GetReferralReport(GetReferralReportRequest) returns (GetReferralReportResponse);
}

// ============================================================================
// Custom Fields Messages
// ============================================================================

message CustomFieldInfo {
  string id = 1;
  string entity_type = 2;
  string field_name = 3;
  string field_label = 4;
  string field_type = 5;
  repeated string options = 6;
  optional string default_value = 7;
  bool is_required = 8;
  int32 sort_order = 9;
  string created_by = 10;
  string created_at = 11;
  string updated_at = 12;
}

message CreateCustomFieldRequest {
  string entity_type = 1;
  string field_name = 2;
  string field_label = 3;
  string field_type = 4;
  repeated string options = 5;
  optional string default_value = 6;
  bool is_required = 7;
  int32 sort_order = 8;
  string created_by = 9;
}

message CreateCustomFieldResponse {
  CustomFieldInfo custom_field = 1;
}

message GetCustomFieldRequest {
  string id = 1;
}

message GetCustomFieldResponse {
  CustomFieldInfo custom_field = 1;
}

message ListCustomFieldsRequest {
  string entity_type = 1;  // Filter by entity type (optional)
  int32 page = 2;
  int32 page_size = 3;
}

message ListCustomFieldsResponse {
  repeated CustomFieldInfo custom_fields = 1;
  int32 total = 2;
}

message UpdateCustomFieldRequest {
  string id = 1;
  optional string field_label = 2;
  repeated string options = 3;
  optional string default_value = 4;
  optional bool is_required = 5;
  optional int32 sort_order = 6;
}

message UpdateCustomFieldResponse {
  CustomFieldInfo custom_field = 1;
}

message DeleteCustomFieldRequest {
  string id = 1;
}

message DeleteCustomFieldResponse {}

// ============================================================================
// Tags Messages
// ============================================================================

message TagInfo {
  string id = 1;
  string name = 2;
  string color = 3;
  string entity_type = 4;
  string created_at = 5;
}

message CreateTagRequest {
  string name = 1;
  string color = 2;
  string entity_type = 3;
}

message CreateTagResponse {
  TagInfo tag = 1;
}

message GetTagRequest {
  string id = 1;
}

message GetTagResponse {
  TagInfo tag = 1;
}

message ListTagsRequest {
  string entity_type = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListTagsResponse {
  repeated TagInfo tags = 1;
  int32 total = 2;
}

message UpdateTagRequest {
  string id = 1;
  optional string name = 2;
  optional string color = 3;
}

message UpdateTagResponse {
  TagInfo tag = 1;
}

message DeleteTagRequest {
  string id = 1;
}

message DeleteTagResponse {}

// ============================================================================
// Contacts Messages
// ============================================================================

message CustomFieldValueInput {
  string field_id = 1;
  string value = 2;  // JSON-encoded value
}

message ContactInfo {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  optional string company_id = 6;
  optional string company_name = 7;
  string position = 8;
  string notes = 9;
  repeated TagInfo tags = 10;
  map<string, string> custom_fields = 11;  // field_name -> JSON value
  string created_by = 12;
  string created_at = 13;
  string updated_at = 14;
  string visibility = 15;  // "shared" or "personal"
  optional string owner_id = 16;
}

message CreateContactRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
  optional string company_id = 5;
  string position = 6;
  string notes = 7;
  repeated string tag_ids = 8;
  repeated CustomFieldValueInput custom_fields = 9;
  string created_by = 10;
}

message CreateContactResponse {
  ContactInfo contact = 1;
}

message GetContactRequest {
  string id = 1;
}

message GetContactResponse {
  ContactInfo contact = 1;
}

message ListContactsRequest {
  optional string company_id = 1;
  repeated string tag_ids = 2;
  string search = 3;
  int32 page = 4;
  int32 page_size = 5;
  string sort_by = 6;
  bool sort_desc = 7;
  string user_id = 8;       // For visibility filtering
  bool is_admin = 9;        // Admin sees all contacts
  string visibility_filter = 10; // "", "shared", "personal"
}

message ListContactsResponse {
  repeated ContactInfo contacts = 1;
  int32 total = 2;
}

message UpdateContactRequest {
  string id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string email = 4;
  optional string phone = 5;
  optional string company_id = 6;
  optional string position = 7;
  optional string notes = 8;
  repeated CustomFieldValueInput custom_fields = 9;
}

message UpdateContactResponse {
  ContactInfo contact = 1;
}

message DeleteContactRequest {
  string id = 1;
}

message DeleteContactResponse {}

message AddContactTagsRequest {
  string contact_id = 1;
  repeated string tag_ids = 2;
}

message AddContactTagsResponse {
  ContactInfo contact = 1;
}

message RemoveContactTagsRequest {
  string contact_id = 1;
  repeated string tag_ids = 2;
}

message RemoveContactTagsResponse {
  ContactInfo contact = 1;
}

// ============================================================================
// Contact Import/Export Messages
// ============================================================================

message ImportContactsCSVRequest {
  bytes file_content = 1;
  map<string, string> field_mapping = 2;  // CSV column -> CRM field
  string visibility = 3;                  // "shared" or "personal"
  bool merge_by_email = 4;
  string user_id = 5;
}

message ImportContactsVCardRequest {
  bytes file_content = 1;
  string visibility = 2;
  bool merge_by_email = 3;
  string user_id = 4;
}

message ImportContactsResponse {
  int32 imported_count = 1;
  int32 merged_count = 2;
  int32 skipped_count = 3;
  repeated ImportContactError errors = 4;
}

message ImportContactError {
  int32 row = 1;
  string reason = 2;
}

message ExportContactsCSVRequest {
  repeated string contact_ids = 1;
  repeated string fields = 2;     // CRM field names to include
  string user_id = 3;
  bool is_admin = 4;
}

message ExportContactsVCardRequest {
  repeated string contact_ids = 1;
  string user_id = 2;
  bool is_admin = 3;
}

message ExportContactsResponse {
  bytes file_content = 1;
  string content_type = 2;   // "text/csv" or "text/vcard"
  string filename = 3;
}

message PreviewImportCSVRequest {
  bytes file_content = 1;
}

message PreviewImportCSVResponse {
  repeated string columns = 1;
  repeated CSVSampleRow sample_rows = 2;
  map<string, string> detected_mapping = 3;
}

message CSVSampleRow {
  repeated string values = 1;
}

message UpdateContactVisibilityRequest {
  string contact_id = 1;
  string visibility = 2;   // "shared" or "personal"
  string user_id = 3;
  bool is_admin = 4;
}

message UpdateContactVisibilityResponse {
  ContactInfo contact = 1;
}

// ============================================================================
// Companies Messages
// ============================================================================

message CompanyInfo {
  string id = 1;
  string name = 2;
  string domain = 3;
  string industry = 4;
  int32 employee_count = 5;
  string address = 6;
  string city = 7;
  string country = 8;
  string notes = 9;
  repeated TagInfo tags = 10;
  map<string, string> custom_fields = 11;
  int32 contact_count = 12;
  string created_by = 13;
  string created_at = 14;
  string updated_at = 15;
}

message CreateCompanyRequest {
  string name = 1;
  string domain = 2;
  string industry = 3;
  int32 employee_count = 4;
  string address = 5;
  string city = 6;
  string country = 7;
  string notes = 8;
  repeated string tag_ids = 9;
  repeated CustomFieldValueInput custom_fields = 10;
  string created_by = 11;
}

message CreateCompanyResponse {
  CompanyInfo company = 1;
}

message GetCompanyRequest {
  string id = 1;
}

message GetCompanyResponse {
  CompanyInfo company = 1;
}

message ListCompaniesRequest {
  string industry = 1;
  repeated string tag_ids = 2;
  string search = 3;
  int32 page = 4;
  int32 page_size = 5;
  string sort_by = 6;
  bool sort_desc = 7;
}

message ListCompaniesResponse {
  repeated CompanyInfo companies = 1;
  int32 total = 2;
}

message UpdateCompanyRequest {
  string id = 1;
  optional string name = 2;
  optional string domain = 3;
  optional string industry = 4;
  optional int32 employee_count = 5;
  optional string address = 6;
  optional string city = 7;
  optional string country = 8;
  optional string notes = 9;
  repeated CustomFieldValueInput custom_fields = 10;
}

message UpdateCompanyResponse {
  CompanyInfo company = 1;
}

message DeleteCompanyRequest {
  string id = 1;
}

message DeleteCompanyResponse {}

message GetCompanyContactsRequest {
  string company_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetCompanyContactsResponse {
  repeated ContactInfo contacts = 1;
  int32 total = 2;
}

// ============================================================================
// Pipeline Stages Messages
// ============================================================================

message PipelineStageInfo {
  string id = 1;
  string name = 2;
  string color = 3;
  int32 sort_order = 4;
  bool is_won = 5;
  bool is_lost = 6;
  double probability = 7;
  int32 deal_count = 8;
  double total_value = 9;
  string created_at = 10;
}

message CreatePipelineStageRequest {
  string name = 1;
  string color = 2;
  int32 sort_order = 3;
  bool is_won = 4;
  bool is_lost = 5;
  double probability = 6;
}

message CreatePipelineStageResponse {
  PipelineStageInfo stage = 1;
}

message GetPipelineStageRequest {
  string id = 1;
}

message GetPipelineStageResponse {
  PipelineStageInfo stage = 1;
}

message ListPipelineStagesRequest {}

message ListPipelineStagesResponse {
  repeated PipelineStageInfo stages = 1;
}

message UpdatePipelineStageRequest {
  string id = 1;
  optional string name = 2;
  optional string color = 3;
  optional bool is_won = 4;
  optional bool is_lost = 5;
  optional double probability = 6;
}

message UpdatePipelineStageResponse {
  PipelineStageInfo stage = 1;
}

message DeletePipelineStageRequest {
  string id = 1;
}

message DeletePipelineStageResponse {}

message ReorderPipelineStagesRequest {
  repeated string stage_ids = 1;  // Ordered list of stage IDs
}

message ReorderPipelineStagesResponse {
  repeated PipelineStageInfo stages = 1;
}

// ============================================================================
// Deals Messages
// ============================================================================

message DealInfo {
  string id = 1;
  string name = 2;
  double value = 3;
  string currency = 4;
  string stage_id = 5;
  string stage_name = 6;
  optional string contact_id = 7;
  optional string contact_name = 8;
  optional string company_id = 9;
  optional string company_name = 10;
  optional string owner_id = 11;
  optional string owner_name = 12;
  string expected_close_date = 13;
  string notes = 14;
  repeated TagInfo tags = 15;
  map<string, string> custom_fields = 16;
  string created_by = 17;
  string created_at = 18;
  string updated_at = 19;
  optional string closed_at = 20;
}

message CreateDealRequest {
  string tenant_id = 13;
  string name = 1;
  double value = 2;
  string currency = 3;
  string stage_id = 4;
  optional string contact_id = 5;
  optional string company_id = 6;
  optional string owner_id = 7;
  string expected_close_date = 8;
  string notes = 9;
  repeated string tag_ids = 10;
  repeated CustomFieldValueInput custom_fields = 11;
  string created_by = 12;
}

message CreateDealResponse {
  DealInfo deal = 1;
}

message GetDealRequest {
  string id = 1;
  string tenant_id = 2;
}

message GetDealResponse {
  DealInfo deal = 1;
}

message ListDealsRequest {
  string tenant_id = 11;
  optional string stage_id = 1;
  optional string contact_id = 2;
  optional string company_id = 3;
  optional string owner_id = 4;
  repeated string tag_ids = 5;
  string search = 6;
  int32 page = 7;
  int32 page_size = 8;
  string sort_by = 9;
  bool sort_desc = 10;
}

message ListDealsResponse {
  repeated DealInfo deals = 1;
  int32 total = 2;
}

message UpdateDealRequest {
  string id = 1;
  string tenant_id = 11;
  optional string name = 2;
  optional double value = 3;
  optional string currency = 4;
  optional string contact_id = 5;
  optional string company_id = 6;
  optional string owner_id = 7;
  optional string expected_close_date = 8;
  optional string notes = 9;
  repeated CustomFieldValueInput custom_fields = 10;
}

message UpdateDealResponse {
  DealInfo deal = 1;
}

message DeleteDealRequest {
  string id = 1;
  string tenant_id = 2;
}

message DeleteDealResponse {}

message MoveDealToStageRequest {
  string deal_id = 1;
  string stage_id = 2;
  string tenant_id = 3;
}

message MoveDealToStageResponse {
  DealInfo deal = 1;
}

