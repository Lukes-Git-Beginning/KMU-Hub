  string updated_at = 8;
}

message CreateSavedFilterRequest {
  string name = 1;
  string entity_type = 2;
  string filter_json = 3;
  bool is_default = 4;
  string created_by = 5;
}

message CreateSavedFilterResponse {
  SavedFilterInfo filter = 1;
}

message GetSavedFilterRequest {
  string id = 1;
}

message GetSavedFilterResponse {
  SavedFilterInfo filter = 1;
}

message ListSavedFiltersRequest {
  string entity_type = 1;
  string user_id = 2;
}

message ListSavedFiltersResponse {
  repeated SavedFilterInfo filters = 1;
}

message UpdateSavedFilterRequest {
  string id = 1;
  optional string name = 2;
  optional string filter_json = 3;
  optional bool is_default = 4;
}

message UpdateSavedFilterResponse {
  SavedFilterInfo filter = 1;
}

message DeleteSavedFilterRequest {
  string id = 1;
}

message DeleteSavedFilterResponse {}

// ============================================================================
// Reports Messages
// ============================================================================

message PipelineStageValue {
  string stage_id = 1;
  string stage_name = 2;
  int32 deal_count = 3;
  double total_value = 4;
  double weighted_value = 5;
}

message GetPipelineReportRequest {
  optional string owner_id = 1;
  string start_date = 2;
  string end_date = 3;
}

message GetPipelineReportResponse {
  repeated PipelineStageValue stages = 1;
  int32 total_deals = 2;
  double total_value = 3;
  double total_weighted_value = 4;
}

message ConversionMetric {
  string from_stage = 1;
  string to_stage = 2;
  int32 converted_count = 3;
  double conversion_rate = 4;
  double average_days = 5;
}

message GetConversionReportRequest {
  string start_date = 1;
  string end_date = 2;
}

message GetConversionReportResponse {
  repeated ConversionMetric metrics = 1;
  double overall_win_rate = 2;
  double average_deal_cycle = 3;
}

message ActivityMetric {
  string activity_type = 1;
  int32 total_count = 2;
  int32 completed_count = 3;
  int32 overdue_count = 4;
}

message GetActivityReportRequest {
  optional string user_id = 1;
  string start_date = 2;
  string end_date = 3;
}

message GetActivityReportResponse {
  repeated ActivityMetric metrics = 1;
  int32 total_activities = 2;
  double completion_rate = 3;
}

// ============================================================================
// Duplicate Detection Messages
// ============================================================================

message DuplicateContactCandidate {
  ContactInfo contact = 1;
  double similarity = 2;
  string match_type = 3;  // "email_exact", "name_fuzzy", "phone_exact"
}

message FindContactDuplicatesRequest {
  string contact_id = 1;
}

message FindContactDuplicatesResponse {
  repeated DuplicateContactCandidate duplicates = 1;
  int32 total = 2;
}

message MergeContactsRequest {
  string primary_id = 1;
  string duplicate_id = 2;
}

message MergeContactsResponse {
  ContactInfo contact = 1;
}

message DuplicateCompanyCandidate {
  CompanyInfo company = 1;
  double similarity = 2;
  string match_type = 3;  // "domain_exact", "name_fuzzy"
}

message FindCompanyDuplicatesRequest {
  string company_id = 1;
}

message FindCompanyDuplicatesResponse {
  repeated DuplicateCompanyCandidate duplicates = 1;
  int32 total = 2;
}

message MergeCompaniesRequest {
  string primary_id = 1;
  string duplicate_id = 2;
}

message MergeCompaniesResponse {
  CompanyInfo company = 1;
}

// ============================================================================
// Contact Timeline Messages
// ============================================================================

message TimelineEventMetadata {
  map<string, string> data = 1;
}

message TimelineEvent {
  string id = 1;
  string event_type = 2;      // "activity", "deal_linked"
  string occurred_at = 3;
  string title = 4;
  optional string description = 5;
  string created_by_name = 6;
  TimelineEventMetadata metadata = 7;
}

message GetContactTimelineRequest {
  string contact_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetContactTimelineResponse {
  repeated TimelineEvent events = 1;
  int32 total = 2;
}

// ============================================================================
// GDPR Consent Management Messages
// ============================================================================

message ConsentRecord {
  string id = 1;
  string contact_id = 2;
  string consent_type = 3;
  bool granted = 4;
  string legal_basis = 5;
  string source = 6;
  optional string ip_address = 7;
  string notes = 8;
  optional string granted_at = 9;
  optional string revoked_at = 10;
  optional string created_by = 11;
  string created_at = 12;
}

message ConsentSummary {
  string contact_id = 1;
  map<string, ConsentRecord> consents = 2;  // consent_type -> latest record
}

message GetContactConsentsRequest {
  string contact_id = 1;
}

message GetContactConsentsResponse {
  ConsentSummary summary = 1;
}

message GrantConsentRequest {
  string contact_id = 1;
  string consent_type = 2;
  string source = 3;
  string legal_basis = 4;
  optional string ip_address = 5;
  optional string created_by = 6;
}

message GrantConsentResponse {
  ConsentRecord record = 1;
}

message RevokeConsentRequest {
  string contact_id = 1;
  string consent_type = 2;
  string notes = 3;
  optional string revoked_by = 4;
}

message RevokeConsentResponse {
  ConsentRecord record = 1;
}

message GetConsentHistoryRequest {
  string contact_id = 1;
  string consent_type = 2;
}

message GetConsentHistoryResponse {
  repeated ConsentRecord history = 1;
  int32 total = 2;
}

message GDPRDeletionRequest {
  string id = 1;
  string contact_id = 2;
  optional string requested_by = 3;
  string reason = 4;
  string status = 5;  // "pending", "processing", "completed"
  optional string completed_at = 6;
  string created_at = 7;
}

message RequestDeletionRequest {
  string contact_id = 1;
  string reason = 2;
  optional string requested_by = 3;
}

message RequestDeletionResponse {
  GDPRDeletionRequest deletion_request = 1;
}

message ProcessDeletionRequest {
  string request_id = 1;
}

message ProcessDeletionResponse {
  string status = 1;  // "completed"
}

// ============================================================================
// Advisory Protocol Messages (P8)
// ============================================================================

message AdvisoryProductProto {
  string id = 1;
  string name = 2;
  optional string isin = 3;
  optional string category = 4;
  int32 risk_class = 5;
  optional string opportunities = 6;
  string risks = 7;
  optional double costs_one_time = 8;
  optional double costs_running = 9;
  bool recommended = 10;
}

message AdvisoryProtocolProto {
  string id = 1;
  string tenant_id = 2;
  string contact_id = 3;
  string created_by = 4;
  string status = 5;
  optional string handed_over_at = 6;
  optional string date = 7;
  string time_from = 8;
  string time_to = 9;
  string location = 10;
  string advisor = 11;
  string occasion = 12;
  string occasion_note = 13;
  string customer_category = 14;
  optional string birth_date = 15;
  string marital_status = 16;
  string tax_status = 17;
  repeated string known_asset_classes = 18;
  string past_transactions = 19;
  string financial_education = 20;
  string professional_experience = 21;
  optional int32 self_assessment = 22;
  optional double monthly_net_income = 23;
  optional double recurring_liabilities = 24;
  optional double liquid_assets = 25;
  optional double current_investments = 26;
  string real_estate = 27;
  string existing_insurance = 28;
  optional double max_loss_capacity_abs = 29;
  optional double max_loss_capacity_pct = 30;
  repeated string investment_purpose = 31;
  string horizon = 32;
  string risk_tolerance = 33;
  string risk_capacity = 34;
  int32 risk_class = 35;
  bool esg_preference = 36;
  string esg_details = 37;
  optional double one_time_amount = 38;
  optional double monthly_savings = 39;
  repeated AdvisoryProductProto products = 40;
  string recommendation_summary = 41;
  string suitability_reasoning = 42;
  string goal_reference = 43;
  string alternatives = 44;
  string not_recommended = 45;
  string main_concerns = 46;
  repeated string warnings_given = 47;
  bool document_delivered = 48;
  optional string document_delivered_date = 49;
  string delivery_form = 50;
  string advisor_signature = 51;
  bool customer_confirmation = 52;
  bool document_waiver = 53;
  optional string followup_date = 54;
  string internal_notes = 55;
  string created_at = 56;
  string updated_at = 57;
}

message CreateAdvisoryProtocolRequest { string contact_id = 1; }
message CreateAdvisoryProtocolResponse { AdvisoryProtocolProto protocol = 1; }
message GetAdvisoryProtocolRequest { string id = 1; }
message GetAdvisoryProtocolResponse { AdvisoryProtocolProto protocol = 1; }
message ListAdvisoryProtocolsRequest { string contact_id = 1; }
message ListAdvisoryProtocolsResponse { repeated AdvisoryProtocolProto protocols = 1; }
message UpdateAdvisoryProtocolRequest { string id = 1; AdvisoryProtocolProto protocol = 2; }
message UpdateAdvisoryProtocolResponse { AdvisoryProtocolProto protocol = 1; }
message DeleteAdvisoryProtocolRequest { string id = 1; }
message DeleteAdvisoryProtocolResponse { bool ok = 1; }
message HandOverAdvisoryProtocolRequest { string id = 1; }
message HandOverAdvisoryProtocolResponse { AdvisoryProtocolProto protocol = 1; }

message ReferralReportEntry {
  string referrer_id = 1;
  string referrer_first_name = 2;
  string referrer_last_name = 3;
  int32 referred_count = 4;
}
message GetReferralReportRequest {}
message GetReferralReportResponse { repeated ReferralReportEntry entries = 1; }
