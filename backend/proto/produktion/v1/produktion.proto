syntax = "proto3";

package produktion.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kmuhub/kmuhub/proto/produktion/v1;produktionv1";

service ProduktionService {
  // Production Orders
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc UpdateOrder(UpdateOrderRequest) returns (OrderResponse);
  rpc DeleteOrder(DeleteOrderRequest) returns (DeleteOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);

  // Order lifecycle transitions
  rpc StartOrder(OrderActionRequest) returns (OrderResponse);
  rpc CompleteOrder(OrderActionRequest) returns (OrderResponse);
  rpc CancelOrder(OrderActionRequest) returns (OrderResponse);

  // Machine Bookings
  rpc CreateMachineBooking(CreateMachineBookingRequest) returns (MachineBookingResponse);
  rpc UpdateMachineBooking(UpdateMachineBookingRequest) returns (MachineBookingResponse);
  rpc DeleteMachineBooking(DeleteMachineBookingRequest) returns (DeleteMachineBookingResponse);
  rpc ListMachineBookings(ListMachineBookingsRequest) returns (ListMachineBookingsResponse);

  // Production Plans
  rpc CreatePlan(CreatePlanRequest) returns (PlanResponse);
  rpc UpdatePlan(UpdatePlanRequest) returns (PlanResponse);
  rpc GetPlan(GetPlanRequest) returns (PlanResponse);
  rpc GetCapacityOverview(GetCapacityOverviewRequest) returns (CapacityOverviewResponse);

  // BOMs (Stücklisten)
  rpc CreateBOM(CreateBOMRequest) returns (BOMResponse);
  rpc UpdateBOM(UpdateBOMRequest) returns (BOMResponse);
  rpc DeleteBOM(DeleteBOMRequest) returns (DeleteBOMResponse);
  rpc GetBOM(GetBOMRequest) returns (BOMResponse);
  rpc ListBOMs(ListBOMsRequest) returns (ListBOMsResponse);

  // Work Steps (Arbeitsschritte)
  rpc CreateWorkStep(CreateWorkStepRequest) returns (WorkStepResponse);
  rpc UpdateWorkStep(UpdateWorkStepRequest) returns (WorkStepResponse);
  rpc DeleteWorkStep(DeleteWorkStepRequest) returns (DeleteWorkStepResponse);
  rpc ListWorkSteps(ListWorkStepsRequest) returns (ListWorkStepsResponse);

  // Machines (Maschinen)
  rpc CreateMachine(CreateMachineRequest) returns (MachineResponse);
  rpc UpdateMachine(UpdateMachineRequest) returns (MachineResponse);
  rpc DeleteMachine(DeleteMachineRequest) returns (DeleteMachineResponse);
  rpc GetMachine(GetMachineRequest) returns (MachineResponse);
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);

  // Quality Checks (Qualitätsprüfungen)
  rpc CreateQualityCheck(CreateQualityCheckRequest) returns (QualityCheckResponse);
  rpc GetQualityCheck(GetQualityCheckRequest) returns (QualityCheckResponse);
  rpc ListQualityChecks(ListQualityChecksRequest) returns (ListQualityChecksResponse);

  // Material availability
  rpc GetMaterialAvailability(GetMaterialAvailabilityRequest) returns (MaterialAvailabilityResponse);
}

// ============================================================================
// Domain Messages
// ============================================================================

message ProductionOrder {
  string id = 1;
  string tenant_id = 2;
  string order_number = 3;
  string product_name = 4;
  int32 quantity = 5;
  string status = 6; // planned|in_progress|completed|cancelled
  google.protobuf.Timestamp planned_start = 7;
  google.protobuf.Timestamp planned_end = 8;
  optional google.protobuf.Timestamp actual_start = 9;
  optional google.protobuf.Timestamp actual_end = 10;
  int32 priority = 11; // 1-5
  string notes = 12;
  optional string created_by = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  optional string bom_id = 16;
}

message MachineBooking {
  string id = 1;
  string tenant_id = 2;
  string machine_id = 3;
  string production_order_id = 4;
  google.protobuf.Timestamp starts_at = 5;
  google.protobuf.Timestamp ends_at = 6;
  string status = 7; // booked|in_use|completed|cancelled
  string notes = 8;
  optional string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ProductionPlan {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  int32 week_number = 4;
  int32 year = 5;
  double total_capacity_hours = 6;
  double planned_capacity_hours = 7;
  string status = 8; // draft|active|completed
  string notes = 9;
  optional string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message CapacityOverview {
  string machine_id = 1;
  double total_capacity_hours = 2;
  double booked_hours = 3;
  double available_hours = 4;
}

// ============================================================================
// Order Requests / Responses
// ============================================================================

message CreateOrderRequest {
  string tenant_id = 1;
  string order_number = 2;
  string product_name = 3;
  int32 quantity = 4;
  google.protobuf.Timestamp planned_start = 5;
  google.protobuf.Timestamp planned_end = 6;
  int32 priority = 7;
  string notes = 8;
  optional string created_by = 9;
  optional string bom_id = 10;
}

message UpdateOrderRequest {
  string tenant_id = 1;
  string order_id = 2;
  optional string product_name = 3;
  optional int32 quantity = 4;
  optional google.protobuf.Timestamp planned_start = 5;
  optional google.protobuf.Timestamp planned_end = 6;
  optional int32 priority = 7;
  optional string notes = 8;
  optional string bom_id = 9;
}

message DeleteOrderRequest {
  string tenant_id = 1;
  string order_id = 2;
}

message DeleteOrderResponse {}

message GetOrderRequest {
  string tenant_id = 1;
  string order_id = 2;
}

message OrderResponse {
  ProductionOrder order = 1;
}

message OrderActionRequest {
  string tenant_id = 1;
  string order_id = 2;
}

message ListOrdersRequest {
  string tenant_id = 1;
  optional string status = 2;
  optional int32 priority = 3;
  optional google.protobuf.Timestamp date_from = 4;
  optional google.protobuf.Timestamp date_to = 5;
  int32 page = 6;
  int32 page_size = 7;
}

message ListOrdersResponse {
  repeated ProductionOrder orders = 1;
  int32 total = 2;
}

// ============================================================================
// Machine Booking Requests / Responses
// ============================================================================

message CreateMachineBookingRequest {
  string tenant_id = 1;
  string machine_id = 2;
  string production_order_id = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  string notes = 6;
  optional string created_by = 7;
}

message UpdateMachineBookingRequest {
  string tenant_id = 1;
  string booking_id = 2;
  optional string machine_id = 3;
  optional string production_order_id = 4;
  optional google.protobuf.Timestamp starts_at = 5;
  optional google.protobuf.Timestamp ends_at = 6;
  optional string notes = 7;
}

message DeleteMachineBookingRequest {
  string tenant_id = 1;
  string booking_id = 2;
}

message DeleteMachineBookingResponse {}

message MachineBookingResponse {
  MachineBooking booking = 1;
}

message ListMachineBookingsRequest {
  string tenant_id = 1;
  optional string machine_id = 2;
  optional google.protobuf.Timestamp date_from = 3;
  optional google.protobuf.Timestamp date_to = 4;
  optional string production_order_id = 5;
  int32 page = 6;
  int32 page_size = 7;
}

message ListMachineBookingsResponse {
  repeated MachineBooking bookings = 1;
  int32 total = 2;
}

// ============================================================================
// Plan Requests / Responses
// ============================================================================

message CreatePlanRequest {
  string tenant_id = 1;
  string name = 2;
  int32 week_number = 3;
  int32 year = 4;
  double total_capacity_hours = 5;
  double planned_capacity_hours = 6;
  string notes = 7;
  optional string created_by = 8;
}

message UpdatePlanRequest {
  string tenant_id = 1;
  string plan_id = 2;
  optional string name = 3;
  optional int32 week_number = 4;
  optional int32 year = 5;
  optional double total_capacity_hours = 6;
  optional double planned_capacity_hours = 7;
  optional string status = 8;
  optional string notes = 9;
}

message GetPlanRequest {
  string tenant_id = 1;
  string plan_id = 2;
}

message PlanResponse {
  ProductionPlan plan = 1;
}

message GetCapacityOverviewRequest {
  string tenant_id = 1;
  string machine_id = 2;
  string plan_id = 3;
}

message CapacityOverviewResponse {
  CapacityOverview overview = 1;
}

// ============================================================================
// BOM Messages
// ============================================================================

message BomItem {
  string id = 1;
  string tenant_id = 2;
  string bom_id = 3;
  string material_name = 4;
  double quantity = 5;
  string unit = 6;
  int32 sort_order = 7;
}

message BOM {
  string id = 1;
  string tenant_id = 2;
  string product_name = 3;
  string sku = 4;
  string version = 5;
  bool active = 6;
  string notes = 7;
  repeated BomItem items = 8;
  optional string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreateBOMRequest {
  string tenant_id = 1;
  string product_name = 2;
  string sku = 3;
  string version = 4;
  bool active = 5;
  string notes = 6;
  repeated CreateBomItemInput items = 7;
  optional string created_by = 8;
}

message CreateBomItemInput {
  string material_name = 1;
  double quantity = 2;
  string unit = 3;
  int32 sort_order = 4;
}

message UpdateBOMRequest {
  string tenant_id = 1;
  string bom_id = 2;
  optional string product_name = 3;
  optional string sku = 4;
  optional string version = 5;
  optional bool active = 6;
  optional string notes = 7;
}

message DeleteBOMRequest {
  string tenant_id = 1;
  string bom_id = 2;
}

message DeleteBOMResponse {}

message GetBOMRequest {
  string tenant_id = 1;
  string bom_id = 2;
}

message BOMResponse {
  BOM bom = 1;
}

message ListBOMsRequest {
  string tenant_id = 1;
  optional bool active = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListBOMsResponse {
  repeated BOM boms = 1;
  int32 total = 2;
}

// ============================================================================
// Work Step Messages
// ============================================================================

message WorkStep {
  string id = 1;
  string tenant_id = 2;
  string order_id = 3;
  int32 step_nr = 4;
  string name = 5;
  string description = 6;
  int32 duration_minutes = 7;
  string status = 8; // pending|in_progress|completed|skipped
  string assignee = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreateWorkStepRequest {
  string tenant_id = 1;
  string order_id = 2;
  int32 step_nr = 3;
  string name = 4;
  string description = 5;
  int32 duration_minutes = 6;
  string assignee = 7;
}

message UpdateWorkStepRequest {
  string tenant_id = 1;
  string step_id = 2;
  optional string name = 3;
  optional string description = 4;
  optional int32 duration_minutes = 5;
  optional string status = 6;
  optional string assignee = 7;
}

message DeleteWorkStepRequest {
  string tenant_id = 1;
  string step_id = 2;
}

message DeleteWorkStepResponse {}

message WorkStepResponse {
  WorkStep step = 1;
}

message ListWorkStepsRequest {
  string tenant_id = 1;
  string order_id = 2;
}

message ListWorkStepsResponse {
  repeated WorkStep steps = 1;
  int32 total = 2;
}

// ============================================================================
// Machine Messages
// ============================================================================

message Machine {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string type = 4;
  string status = 5; // available|in_use|maintenance
  string notes = 6;
  optional string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateMachineRequest {
  string tenant_id = 1;
  string name = 2;
  string type = 3;
  string notes = 4;
  optional string created_by = 5;
}

message UpdateMachineRequest {
  string tenant_id = 1;
  string machine_id = 2;
  optional string name = 3;
  optional string type = 4;
  optional string status = 5;
  optional string notes = 6;
}

message DeleteMachineRequest {
  string tenant_id = 1;
  string machine_id = 2;
}

message DeleteMachineResponse {}

message GetMachineRequest {
  string tenant_id = 1;
  string machine_id = 2;
}

message MachineResponse {
  Machine machine = 1;
}

message ListMachinesRequest {
  string tenant_id = 1;
  optional string status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListMachinesResponse {
  repeated Machine machines = 1;
  int32 total = 2;
}

// ============================================================================
// Quality Check Messages
// ============================================================================

message QualityCheck {
  string id = 1;
  string tenant_id = 2;
  string order_id = 3;
  string inspector = 4;
  google.protobuf.Timestamp checked_at = 5;
  bool passed = 6;
  int32 defects_found = 7;
  string notes = 8;
  optional string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreateQualityCheckRequest {
  string tenant_id = 1;
  string order_id = 2;
  string inspector = 3;
  google.protobuf.Timestamp checked_at = 4;
  bool passed = 5;
  int32 defects_found = 6;
  string notes = 7;
  optional string created_by = 8;
}

message GetQualityCheckRequest {
  string tenant_id = 1;
  string check_id = 2;
}

message QualityCheckResponse {
  QualityCheck check = 1;
}

message ListQualityChecksRequest {
  string tenant_id = 1;
  optional string order_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListQualityChecksResponse {
  repeated QualityCheck checks = 1;
  int32 total = 2;
}

// ============================================================================
// Material Availability Messages
// ============================================================================

message MaterialAvailabilityLine {
  string material_name = 1;
  string unit = 2;
  double required_quantity = 3;
  // available_quantity/shortfall_quantity are unset when the material could
  // not be matched against an inventar item (unknown SKU/name, or the
  // inventar lookup was unavailable) -- an unmatched position is not an
  // error, it is a position with unknown availability.
  optional double available_quantity = 4;
  optional double shortfall_quantity = 5;
}

message GetMaterialAvailabilityRequest {
  string tenant_id = 1;
  string order_id = 2;
}

message MaterialAvailabilityResponse {
  string order_id = 1;
  string bom_id = 2;
  repeated MaterialAvailabilityLine lines = 3;
}
