// ============================================================================
// GoBD Belegarchiv Messages (§147 AO — Revisionssichere Beleg-Ablage)
// ============================================================================

// GobdDocumentProto represents an immutable archived document.
message GobdDocumentProto {
  string id = 1;
  string tenant_id = 2;
  string doc_type = 3;                   // gobd_document_type enum value as string
  string source_invoice_id = 4;          // empty string if null
  string storage_key = 5;
  string sha256 = 6;
  string original_filename = 7;
  string mime_type = 8;
  int64 file_size_bytes = 9;
  google.protobuf.Timestamp archived_at = 10;
  string archived_by = 11;
  string retention_until = 12;           // YYYY-MM-DD
}

// GobdDocumentEventProto represents a single audit trail entry.
message GobdDocumentEventProto {
  string id = 1;
  string tenant_id = 2;
  string document_id = 3;
  string event_type = 4;                 // gobd_event_type enum value as string
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  string note = 7;
  string metadata_json = 8;             // JSON-encoded metadata
}

// ============================================================================
// ArchiveDocument Request/Response
// ============================================================================

message ArchiveDocumentRequest {
  string tenant_id = 1;
  string doc_type = 2;                   // required; one of gobd_document_type values
  string source_invoice_id = 3;          // optional; empty string = null
  string original_filename = 4;
  string mime_type = 5;
  bytes content = 6;                     // raw file bytes (max 50 MiB)
  string archived_by = 7;               // user ID performing the archival
}

message ArchiveDocumentResponse {
  GobdDocumentProto document = 1;
}

// ============================================================================
// ArchiveInvoiceDocument Request/Response
// ============================================================================

message ArchiveInvoiceDocumentRequest {
  string tenant_id = 1;
  string invoice_id = 2;                 // must be locked (LockedAt != nil)
  string archived_by = 3;
}

message ArchiveInvoiceDocumentResponse {
  GobdDocumentProto document = 1;
}

// ============================================================================
// GetGobdDocument Request/Response
// ============================================================================

message GetGobdDocumentRequest {
  string tenant_id = 1;
  string id = 2;
}

message GetGobdDocumentResponse {
  GobdDocumentProto document = 1;
  repeated GobdDocumentEventProto events = 2;
}

// ============================================================================
// ListGobdDocuments Request/Response
// ============================================================================

message ListGobdDocumentsRequest {
  string tenant_id = 1;
  string doc_type = 2;                   // optional filter; empty = all types
  string source_invoice_id = 3;          // optional filter; empty = all
  string date_from = 4;                  // optional; YYYY-MM-DD (archived_at >=)
  string date_to = 5;                    // optional; YYYY-MM-DD (archived_at <=)
  int32 page = 6;                        // 1-based; defaults to 1
  int32 per_page = 7;                    // defaults to 50
}

message ListGobdDocumentsResponse {
  repeated GobdDocumentProto documents = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
}

// ============================================================================
// DownloadGobdDocument Request/Response
// ============================================================================

message DownloadGobdDocumentRequest {
