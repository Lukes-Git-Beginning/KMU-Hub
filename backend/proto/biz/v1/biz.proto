// ============================================================================
// Incoming Invoices (E-Rechnung Eingang)
// ============================================================================

message IncomingInvoiceLineItem {
  int32  position    = 1;
  string description = 2;
  string quantity    = 3;
  string unit_price  = 4;
  string tax_rate    = 5;
  string line_total  = 6;
}

message IncomingInvoiceTaxEntry {
  string tax_rate    = 1;
  string taxable_net = 2;
  string tax_amount  = 3;
}

message IncomingInvoice {
  string id                = 1;
  string tenant_id         = 2;
  string supplier_name     = 3;
  string supplier_address  = 4;
  string supplier_vat_id   = 5;
  string invoice_number    = 6;
  string invoice_date      = 7;  // YYYY-MM-DD
  string due_date          = 8;  // YYYY-MM-DD, optional (empty if null)
  string currency          = 9;
  repeated IncomingInvoiceLineItem line_items   = 10;
  repeated IncomingInvoiceTaxEntry tax_breakdown = 11;
  string subtotal          = 12;
  string total_tax         = 13;
  string gross_total       = 14;
  string source_format     = 15; // zugferd_cii | xrechnung_ubl | xml_only
  string original_filename = 16;
  string status            = 17; // received | reviewed | booked | rejected
  string created_by        = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}

message ImportIncomingInvoiceRequest {
  string tenant_id  = 1;
  string filename   = 2;
  string mime_type  = 3;  // application/pdf | application/xml | text/xml
  bytes  content    = 4;
  string created_by = 5;
}

message ImportIncomingInvoiceResponse {
  IncomingInvoice invoice = 1;
}

message GetIncomingInvoiceRequest {
  string tenant_id = 1;
  string id        = 2;
}

message GetIncomingInvoiceResponse {
  IncomingInvoice invoice = 1;
}

message ListIncomingInvoicesRequest {
  string tenant_id  = 1;
  string status     = 2;  // optional filter
  string date_from  = 3;  // YYYY-MM-DD, optional
  string date_to    = 4;  // YYYY-MM-DD, optional
  int32  page       = 5;
  int32  per_page   = 6;
}

message ListIncomingInvoicesResponse {
  repeated IncomingInvoice invoices = 1;
  int32 total                       = 2;
}

message UpdateIncomingInvoiceStatusRequest {
  string tenant_id  = 1;
  string id         = 2;
  string new_status = 3;  // reviewed | booked | rejected
}

message UpdateIncomingInvoiceStatusResponse {
  IncomingInvoice invoice = 1;
}

// ============================================================================
// Recurring Invoices (Abo-Rechnungen) — Migration 000246
// ============================================================================

// A recurring invoice schedule. Interval and status travel as strings because the
// frontend types them as string unions (weekly|monthly|quarterly|yearly and
// active|paused|ended); an enum would force a mapping on both ends for no gain.
message RecurringInvoice {
  string id                  = 1;
  string tenant_id           = 2;
  string title               = 3;
  CustomerSnapshot customer  = 4;
  repeated LineItem line_items = 5;
  TaxMode tax_mode           = 6;
  TaxBreakdown tax_breakdown = 7;
  string currency            = 8;
  string interval            = 9;   // weekly | monthly | quarterly | yearly
  string status              = 10;  // active | paused | ended
  string start_date          = 11;  // YYYY-MM-DD
  string end_date            = 12;  // YYYY-MM-DD, empty when open-ended
  string next_run            = 13;  // YYYY-MM-DD
  int32  payment_terms_days  = 14;
  int32  generated_count     = 15;
  string last_generated_at   = 16;  // YYYY-MM-DD, empty before the first run
  string notes               = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

message CreateRecurringInvoiceRequest {
  string tenant_id             = 1;
  string title                 = 2;
  CustomerSnapshot customer    = 3;
  repeated LineItem line_items = 4;
  TaxMode tax_mode             = 5;
  string currency              = 6;
  string interval              = 7;
  string start_date            = 8;   // YYYY-MM-DD
  string end_date              = 9;   // YYYY-MM-DD, optional
  int32  payment_terms_days    = 10;
  string notes                 = 11;
  string created_by            = 12;
}

message CreateRecurringInvoiceResponse {
  RecurringInvoice recurring = 1;
}

message GetRecurringInvoiceRequest {
  string tenant_id = 1;
  string id        = 2;
}

message GetRecurringInvoiceResponse {
  RecurringInvoice recurring = 1;
}

message ListRecurringInvoicesRequest {
  string tenant_id = 1;
  string status    = 2;  // optional filter
  int32  page      = 3;
  int32  per_page  = 4;
}

message ListRecurringInvoicesResponse {
  repeated RecurringInvoice recurring = 1;
  int32 total                         = 2;
}

// Partial update: only the fields the client sends are applied, matching
// Partial<CreateRecurringInvoiceRequest> on the frontend. line_items is applied
// when non-empty; clear_end_date removes an existing end date.
message UpdateRecurringInvoiceRequest {
  string tenant_id                    = 1;
  string id                           = 2;
  optional string title               = 3;
  CustomerSnapshot customer           = 4;
  repeated LineItem line_items        = 5;
  optional TaxMode tax_mode           = 6;
  optional string currency            = 7;
  optional string interval            = 8;
  optional string start_date          = 9;
  optional string end_date            = 10;
  bool clear_end_date                 = 11;
  optional int32 payment_terms_days   = 12;
  optional string notes               = 13;
}

message UpdateRecurringInvoiceResponse {
  RecurringInvoice recurring = 1;
}

message DeleteRecurringInvoiceRequest {
  string tenant_id = 1;
  string id        = 2;
}

message DeleteRecurringInvoiceResponse {
  bool success = 1;
}

message SetRecurringInvoiceStatusRequest {
  string tenant_id = 1;
  string id        = 2;
  string status    = 3;  // active | paused | ended
}

message SetRecurringInvoiceStatusResponse {
  RecurringInvoice recurring = 1;
}

message GenerateRecurringInvoiceRequest {
  string tenant_id = 1;
  string id        = 2;
  string user_id   = 3;
}

// The emitted invoice plus the advanced schedule. A repeated call for the same
// period returns the very same invoice — generation is idempotent per period.
message GenerateRecurringInvoiceResponse {
  Invoice invoice            = 1;
  RecurringInvoice recurring = 2;
}
