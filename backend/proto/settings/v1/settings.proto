syntax = "proto3";

package settings.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/kmuhub/kmuhub/proto/settings/v1;settingsv1";

// SettingsService manages the 3-level scope hierarchy:
//   tenant-default → Modul-Leiter-override (tenant-wide) → user-override (personal)
//
// Module-lead grant/revoke lives here too because it gates who may write tenant-scope
// settings. Admin role implicitly leads all modules — the service enforces this, not
// the database.
service SettingsService {
  // Module-lead management (admin only for write)
  rpc ListModuleLeads(ListModuleLeadsRequest)   returns (ListModuleLeadsResponse);
  rpc GrantModuleLead(GrantModuleLeadRequest)   returns (ModuleLead);
  rpc RevokeModuleLead(RevokeModuleLeadRequest) returns (RevokeModuleLeadResponse);
  // "Am I a lead?" fast-path used by the FE useIsModuleLead hook
  rpc GetMyModuleLeads(GetMyModuleLeadsRequest) returns (GetMyModuleLeadsResponse);

  // Module-access grant management (admin only for write). Distinct from
  // module-lead: a grant gives a user ACCESS to a module; a lead may configure it.
  rpc ListModuleGrants(ListModuleGrantsRequest)             returns (ListModuleGrantsResponse);
  rpc GrantModuleAccess(GrantModuleAccessRequest)           returns (UserModuleGrant);
  rpc RevokeModuleAccess(RevokeModuleAccessRequest)         returns (RevokeModuleAccessResponse);
  rpc BulkRevokeModuleAccess(BulkRevokeModuleAccessRequest) returns (BulkRevokeModuleAccessResponse);

  // Resolved settings (user > tenant > not-set), returned as a flat key→value map
  rpc GetResolvedSettings(GetResolvedSettingsRequest) returns (GetResolvedSettingsResponse);

  // Tenant-scope settings (Modul-Leiter or admin only for write)
  rpc GetTenantSettings(GetTenantSettingsRequest) returns (GetTenantSettingsResponse);
  rpc PutTenantSettings(PutTenantSettingsRequest) returns (PutTenantSettingsResponse);

  // User-scope settings (own user only)
  rpc GetUserSettings(GetUserSettingsRequest) returns (GetUserSettingsResponse);
  rpc PutUserSettings(PutUserSettingsRequest) returns (PutUserSettingsResponse);
  // Full-replace semantics: entries not included are deleted rather than left
  // untouched. Backs /api/v1/users/preferences, whose client always sends the
  // complete preference set.
  rpc ReplaceUserSettings(ReplaceUserSettingsRequest) returns (ReplaceUserSettingsResponse);

  // Tenant-wide branding (name, logo/icon, accent color). Backed by
  // tenant_settings under module_id="branding" — no dedicated table. Write is
  // admin-or-module-lead like PutTenantSettings; in practice admin-only, since
  // no UI ever grants module-lead for "branding".
  rpc GetBranding(GetBrandingRequest) returns (GetBrandingResponse);
  rpc PutBranding(PutBrandingRequest) returns (PutBrandingResponse);

  // Licensing: which modules the tenant has booked, and the booked plan itself.
  // Activation is bookkeeping — the deployment-wide modules.* flags remain the
  // access gate, and the gateway masks an activation a flag does not cover.
  rpc GetTenantLicense(GetTenantLicenseRequest)           returns (GetTenantLicenseResponse);
  rpc SetTenantModuleActive(SetTenantModuleActiveRequest) returns (TenantModule);
  rpc GetTenantSubscription(GetTenantSubscriptionRequest) returns (TenantSubscription);

  // Value-sets (customization_value_sets / _options, migration 000295): named
  // option lists (deal stages, ticket priority, ...) resolved from the shipped
  // registry (internal/settings/valueset.go) overlaid with the tenant's stored
  // override. Delete is deliberately not exposed here yet -- no caller needs it
  // (see BACKLOG.yml customization-value-sets-routes).
  rpc ListValueSets(ListValueSetsRequest)   returns (ListValueSetsResponse);
  rpc GetValueSet(GetValueSetRequest)       returns (ValueSet);
  rpc UpsertValueSet(UpsertValueSetRequest) returns (ValueSet);
}

// ============================================================================
// Domain Messages
// ============================================================================

message ModuleLead {
  string tenant_id  = 1;
  string user_id    = 2;
  string module_id  = 3;
  string granted_by = 4;
  google.protobuf.Timestamp granted_at = 5;
}

// A single key→JSONB setting entry.
// value is encoded as google.protobuf.Value so callers can pass any JSON shape
// (string, number, boolean, array, object) without a dedicated wrapper type.
message SettingEntry {
  string                 key   = 1;
  google.protobuf.Value  value = 2;
}

// ============================================================================
// Module-Lead Requests / Responses
// ============================================================================

message ListModuleLeadsRequest {
  string tenant_id = 1;
  // Optional: filter by user_id
  optional string user_id   = 2;
  // Optional: filter by module_id
  optional string module_id = 3;
}

message ListModuleLeadsResponse {
  repeated ModuleLead leads = 1;
}

message GrantModuleLeadRequest {
  string tenant_id  = 1;
  string user_id    = 2;
  string module_id  = 3;
  string granted_by = 4;
}

message RevokeModuleLeadRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string module_id = 3;
}

message RevokeModuleLeadResponse {}

message GetMyModuleLeadsRequest {
  string tenant_id = 1;
  string user_id   = 2;
}

message GetMyModuleLeadsResponse {
  // module_ids the caller is lead for (empty if none; admin = all)
  repeated string module_ids = 1;
  bool            is_admin   = 2;
}

// ============================================================================
// Module-Access Grant Requests / Responses
// ============================================================================

// UserModuleGrant records that a user has access to a module. user_name is
// joined from the users table for display; last_active_at is reserved for a
// future activity pipeline and is absent until then.
message UserModuleGrant {
  string tenant_id  = 1;
  string user_id    = 2;
  string user_name  = 3;
  string module_id  = 4;
  string granted_by = 5;
  google.protobuf.Timestamp granted_at     = 6;
  optional google.protobuf.Timestamp last_active_at = 7;
}

message ListModuleGrantsRequest {
  string tenant_id = 1;
  optional string user_id   = 2;
  optional string module_id = 3;
}

message ListModuleGrantsResponse {
  repeated UserModuleGrant grants = 1;
}

message GrantModuleAccessRequest {
  string tenant_id  = 1;
  string user_id    = 2;
  string module_id  = 3;
  string granted_by = 4;
}

message RevokeModuleAccessRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string module_id = 3;
}

message RevokeModuleAccessResponse {}

// A (user, module) pair targeted by a bulk revoke.
message ModuleGrantRef {
  string user_id   = 1;
  string module_id = 2;
}

message BulkRevokeModuleAccessRequest {
  string tenant_id = 1;
  repeated ModuleGrantRef refs = 2;
}

message BulkRevokeModuleAccessResponse {
  int32 revoked_count = 1;
}

// ============================================================================
// Settings Requests / Responses
// ============================================================================

message GetResolvedSettingsRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string module_id = 3;
}

// Resolved map: user overrides win over tenant defaults.
// Keys not set at any level are absent from the map.
message GetResolvedSettingsResponse {
  repeated SettingEntry entries = 1;
}

message GetTenantSettingsRequest {
  string tenant_id = 1;
  string module_id = 2;
}

message GetTenantSettingsResponse {
  repeated SettingEntry entries = 1;
}

message PutTenantSettingsRequest {
  string tenant_id   = 1;
  string module_id   = 2;
  string updated_by  = 3;
  // Patch semantics: only supplied keys are written; others are untouched.
  repeated SettingEntry entries = 4;
}

message PutTenantSettingsResponse {
  repeated SettingEntry entries = 1;
}

message GetUserSettingsRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string module_id = 3;
}

message GetUserSettingsResponse {
  repeated SettingEntry entries = 1;
}

message PutUserSettingsRequest {
  string tenant_id  = 1;
  string user_id    = 2;
  string module_id  = 3;
  // Patch semantics: only supplied keys are written; others are untouched.
  repeated SettingEntry entries = 4;
}

message PutUserSettingsResponse {
  repeated SettingEntry entries = 1;
}

message ReplaceUserSettingsRequest {
  string tenant_id  = 1;
  string user_id    = 2;
  string module_id  = 3;
  // Full-replace semantics: entries not included here are deleted.
  repeated SettingEntry entries = 4;
}

message ReplaceUserSettingsResponse {
  repeated SettingEntry entries = 1;
}

// ============================================================================
// Branding Requests / Responses
// ============================================================================

// Branding is a tenant's workspace branding. Logo/icon are stored as MinIO
// object keys, never full URLs — the frontend resolves an object key to a
// downloadable URL via POST /api/v1/files/presign-download, the same pattern
// User.avatar_url already uses. accent_color is restricted to the Cosmi
// swatch palette (desktop/src/renderer/src/lib/swatch-colors.ts); the service
// rejects any other value.
message Branding {
  string name            = 1;
  string logo_object_key = 2;
  string icon_object_key = 3;
  string accent_color    = 4;
}

message GetBrandingRequest {
  string tenant_id = 1;
}

message GetBrandingResponse {
  Branding branding = 1;
}

message PutBrandingRequest {
  string tenant_id  = 1;
  string updated_by = 2;
  Branding branding = 3;
}

message PutBrandingResponse {
  Branding branding = 1;
}

// ============================================================================
// Licensing Requests / Responses
// ============================================================================

// TenantModule is one catalogue module plus this tenant's activation state.
// flag_key names the deployment-wide feature flag gating the module ("" when
// the module ships unconditionally); the gateway resolves it and never puts it
// on the wire.
message TenantModule {
  string module_id      = 1;
  string group          = 2;
  bool   active         = 3;
  int32  assigned_seats = 4;
  string flag_key       = 5;
}

message GetTenantLicenseRequest {
  string tenant_id = 1;
}

message GetTenantLicenseResponse {
  repeated TenantModule modules = 1;
}

message SetTenantModuleActiveRequest {
  string tenant_id  = 1;
  string module_id  = 2;
  bool   active     = 3;
  // The admin performing the change; recorded on the activation row.
  string updated_by = 4;
}

message GetTenantSubscriptionRequest {
  string tenant_id = 1;
}

// TenantSubscription is the booked contract, not a usage snapshot: seats in use
// are counted where they are enforced (the invitation path in auth).
message TenantSubscription {
  string plan_type    = 1;  // cosmi | orbit
  string support_tier = 2;  // standard | priority | enterprise
  string status       = 3;  // active | past_due | paused
  // ISO date (YYYY-MM-DD); absent while no billing period has been agreed.
  optional string billing_period_end = 4;
  // Booked seats; absent means unlimited.
  optional int32  total_seats        = 5;
}

// ============================================================================
// Value-Set Requests / Responses
// ============================================================================

// One option within a named value-set (a deal pipeline stage, a ticket
// priority). provenance is resolved-read-only ("default" | "tenant"); the
// write path (UpsertValueSetRequest) ignores it.
message ValueSetOption {
  string key        = 1;
  string label      = 2;
  string color      = 3;
  int32  order      = 4;
  bool   active     = 5;
  string provenance = 6;
}

// A value-set resolved for one tenant: the shipped baseline (internal/
// settings/valueset.go) overlaid with the tenant's stored override, per
// option key. provenance and is_system are resolved-read-only; the write
// path ignores both -- system-ness is derived from the shipped registry,
// never stored (migration 000295 head comment).
message ValueSet {
  string key                      = 1;
  string name                     = 2;
  repeated ValueSetOption options = 3;
  string provenance               = 4;
  bool   is_system                = 5;
}

message ListValueSetsRequest {
  string tenant_id = 1;
  // true returns only the shipped baselines (editor's "reset to" view);
  // tenant-only lists have no baseline and are omitted.
  bool   base       = 2;
}

message ListValueSetsResponse {
  repeated ValueSet value_sets = 1;
}

message GetValueSetRequest {
  string tenant_id = 1;
  string key       = 2;
  bool   base       = 3;
}

message UpsertValueSetRequest {
  string tenant_id   = 1;
  // Empty when the caller could not be resolved (should not happen on an
  // authenticated route; mirrors PutBrandingRequest.updated_by).
  string updated_by  = 2;
  ValueSet value_set = 3;
}
