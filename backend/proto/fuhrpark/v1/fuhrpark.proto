syntax = "proto3";

package fuhrpark.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kmuhub/kmuhub/proto/fuhrpark/v1;fuhrparkv1";

service FuhrparkService {
  // Vehicles
  rpc CreateVehicle(CreateVehicleRequest)       returns (VehicleResponse);
  rpc UpdateVehicle(UpdateVehicleRequest)       returns (VehicleResponse);
  rpc DeleteVehicle(DeleteVehicleRequest)       returns (DeleteVehicleResponse);
  rpc GetVehicle(GetVehicleRequest)             returns (VehicleResponse);
  rpc ListVehicles(ListVehiclesRequest)         returns (ListVehiclesResponse);

  // Services
  rpc ScheduleService(ScheduleServiceRequest)   returns (VehicleServiceResponse);
  rpc UpdateService(UpdateServiceRequest)       returns (VehicleServiceResponse);
  rpc DeleteService(DeleteServiceRequest)       returns (DeleteServiceResponse);
  rpc CompleteService(CompleteServiceRequest)   returns (VehicleServiceResponse);
  rpc ListServices(ListServicesRequest)         returns (ListServicesResponse);

  // Damages
  rpc ReportDamage(ReportDamageRequest)         returns (DamageResponse);
  rpc UpdateDamage(UpdateDamageRequest)         returns (DamageResponse);
  rpc ResolveDamage(ResolveDamageRequest)       returns (DamageResponse);
  rpc ListDamages(ListDamagesRequest)           returns (ListDamagesResponse);

  // History & Reports
  rpc GetVehicleHistory(GetVehicleHistoryRequest)         returns (VehicleHistoryResponse);
  rpc CheckTuevDue(CheckTuevDueRequest)                   returns (CheckTuevDueResponse);
  rpc ListUpcomingServices(ListUpcomingServicesRequest)   returns (ListServicesResponse);
  rpc ExportVehicleReport(ExportVehicleReportRequest)     returns (ExportVehicleReportResponse);

  // Fuel logs
  rpc ListFuelLogs(ListFuelLogsRequest)         returns (ListFuelLogsResponse);
  rpc CreateFuelLog(CreateFuelLogRequest)       returns (CreateFuelLogResponse);
  rpc UpdateFuelLog(UpdateFuelLogRequest)       returns (UpdateFuelLogResponse);
  rpc DeleteFuelLog(DeleteFuelLogRequest)       returns (DeleteFuelLogResponse);

  // Trip logs
  rpc ListTripLogs(ListTripLogsRequest)         returns (ListTripLogsResponse);
  rpc CreateTripLog(CreateTripLogRequest)       returns (CreateTripLogResponse);
  rpc UpdateTripLog(UpdateTripLogRequest)       returns (UpdateTripLogResponse);
  rpc DeleteTripLog(DeleteTripLogRequest)       returns (DeleteTripLogResponse);

  // Vehicle documents
  rpc ListVehicleDocuments(ListVehicleDocumentsRequest)     returns (ListVehicleDocumentsResponse);
  rpc CreateVehicleDocument(CreateVehicleDocumentRequest)   returns (CreateVehicleDocumentResponse);
  rpc DeleteVehicleDocument(DeleteVehicleDocumentRequest)   returns (DeleteVehicleDocumentResponse);

  // GPS / Tracking
  rpc IngestGpsPositions(IngestGpsPositionsRequest)   returns (IngestGpsPositionsResponse);
  rpc GetVehicleRoutes(GetVehicleRoutesRequest)       returns (GetVehicleRoutesResponse);
  rpc GetGpsPositions(GetGpsPositionsRequest)         returns (GetGpsPositionsResponse);

  // Driver licenses (Fuehrerscheinkontrolle)
  rpc ListDriverLicenses(ListDriverLicensesRequest)   returns (ListDriverLicensesResponse);
  rpc CreateDriverLicense(CreateDriverLicenseRequest) returns (CreateDriverLicenseResponse);
  rpc UpdateDriverLicense(UpdateDriverLicenseRequest) returns (UpdateDriverLicenseResponse);
  rpc DeleteDriverLicense(DeleteDriverLicenseRequest) returns (DeleteDriverLicenseResponse);

  // Bookings (Poolfahrzeug-Reservierung)
  rpc ListVehicleBookings(ListVehicleBookingsRequest)   returns (ListVehicleBookingsResponse);
  rpc CreateVehicleBooking(CreateVehicleBookingRequest) returns (VehicleBookingResponse);
  rpc UpdateVehicleBooking(UpdateVehicleBookingRequest) returns (VehicleBookingResponse);
  rpc DeleteVehicleBooking(DeleteVehicleBookingRequest) returns (DeleteVehicleBookingResponse);
}

// ============================================================================
// Domain Messages
// ============================================================================

message Vehicle {
  string id = 1;
  string tenant_id = 2;
  string license_plate = 3;
  string make = 4;
  string model = 5;
  int32 year = 6;
  optional string vin = 7;
  optional string color = 8;
  string fuel_type = 9;     // petrol|diesel|electric|hybrid|other
  string status = 10;        // active|in_service|inactive|decommissioned
  int64 mileage_km = 11;
  optional string tuev_due_date = 12;       // ISO date YYYY-MM-DD
  optional string assigned_driver_id = 13;  // stub Sprint 3
  optional string notes = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message VehicleService {
  string id = 1;
  string tenant_id = 2;
  string vehicle_id = 3;
  string service_type = 4;
  optional string description = 5;
  string scheduled_at = 6;   // ISO date YYYY-MM-DD
  optional google.protobuf.Timestamp completed_at = 7;
  optional int64 cost_cents = 8;
  optional string workshop = 9;
  optional int64 mileage_km = 10;
  string status = 11;        // scheduled|in_progress|completed|cancelled
  optional string notes = 12;
  optional string created_by = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message Damage {
  string id = 1;
  string tenant_id = 2;
  string vehicle_id = 3;
  string description = 4;
  string severity = 5;       // minor|moderate|major|totalled
  string status = 6;         // reported|in_repair|resolved
  optional string reported_by = 7;
  optional string resolved_by = 8;
  optional google.protobuf.Timestamp resolved_at = 9;
  repeated string photo_keys = 10;
  optional int64 cost_cents = 11;
  optional string notes = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// ============================================================================
// Vehicle Requests / Responses
// ============================================================================

message CreateVehicleRequest {
  string tenant_id = 1;
  string license_plate = 2;
  string make = 3;
  string model = 4;
  int32 year = 5;
  optional string vin = 6;
  optional string color = 7;
  string fuel_type = 8;
  int64 mileage_km = 9;
  optional string tuev_due_date = 10;
  optional string assigned_driver_id = 11;
  optional string notes = 12;
}

message UpdateVehicleRequest {
  string tenant_id = 1;
  string vehicle_id = 2;
  optional string license_plate = 3;
  optional string make = 4;
  optional string model = 5;
  optional int32 year = 6;
  optional string vin = 7;
  optional string color = 8;
  optional string fuel_type = 9;
  optional string status = 10;
  optional int64 mileage_km = 11;
  optional string tuev_due_date = 12;
  optional string assigned_driver_id = 13;
  optional string notes = 14;
}

message DeleteVehicleRequest {
  string tenant_id = 1;
  string vehicle_id = 2;
}

message DeleteVehicleResponse {}

message GetVehicleRequest {
  string tenant_id = 1;
  string vehicle_id = 2;
}

message VehicleResponse {
  Vehicle vehicle = 1;
}

message ListVehiclesRequest {
  string tenant_id = 1;
  string search = 2;
  optional string status = 3;
  optional string fuel_type = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListVehiclesResponse {
  repeated Vehicle vehicles = 1;
  int32 total = 2;
}

// ============================================================================
// Service Requests / Responses
// ============================================================================

message ScheduleServiceRequest {
  string tenant_id = 1;
  string vehicle_id = 2;
  string service_type = 3;
  optional string description = 4;
  string scheduled_at = 5;   // ISO date YYYY-MM-DD
  optional int64 cost_cents = 6;
  optional string workshop = 7;
  optional int64 mileage_km = 8;
  optional string notes = 9;
  optional string created_by = 10;
}

message UpdateServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
  optional string service_type = 3;
  optional string description = 4;
  optional string scheduled_at = 5;
  optional int64 cost_cents = 6;
  optional string workshop = 7;
  optional int64 mileage_km = 8;
  optional string status = 9;
  optional string notes = 10;
}

message DeleteServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
}

message DeleteServiceResponse {}

message CompleteServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
  optional int64 cost_cents = 3;
  optional int64 mileage_km = 4;
  optional string notes = 5;
}

message ListServicesRequest {
  string tenant_id = 1;
  optional string vehicle_id = 2;
  optional string status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message VehicleServiceResponse {
  VehicleService service = 1;
}

message ListServicesResponse {
  repeated VehicleService services = 1;
  int32 total = 2;
}

// ============================================================================
// Damage Requests / Responses
// ============================================================================

message ReportDamageRequest {
  string tenant_id = 1;
  string vehicle_id = 2;
  string description = 3;
  string severity = 4;
  optional string reported_by = 5;
  repeated string photo_keys = 6;
  optional int64 cost_cents = 7;
  optional string notes = 8;
}

message UpdateDamageRequest {
  string tenant_id = 1;
  string damage_id = 2;
  optional string description = 3;
  optional string severity = 4;
  optional string status = 5;
  repeated string photo_keys = 6;
  optional int64 cost_cents = 7;
  optional string notes = 8;
}

message ResolveDamageRequest {
  string tenant_id = 1;
  string damage_id = 2;
  optional string resolved_by = 3;
  optional int64 cost_cents = 4;
  optional string notes = 5;
}

message ListDamagesRequest {
  string tenant_id = 1;
  optional string vehicle_id = 2;
  optional string status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message DamageResponse {
  Damage damage = 1;
}

message ListDamagesResponse {
  repeated Damage damages = 1;
  int32 total = 2;
}

// ============================================================================
// History & Report Requests / Responses
// ============================================================================

message GetVehicleHistoryRequest {
  string tenant_id = 1;
  string vehicle_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message VehicleHistoryEntry {
  string kind = 1;    // "service" | "damage"
  string id = 2;
  string summary = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message VehicleHistoryResponse {
  repeated VehicleHistoryEntry entries = 1;
  int32 total = 2;
}

message CheckTuevDueRequest {
  string tenant_id = 1;
  optional int32 days_ahead = 2;  // default 30
}

message CheckTuevDueResponse {
  repeated Vehicle vehicles = 1;
}

message ListUpcomingServicesRequest {
  string tenant_id = 1;
  int32 days_ahead = 2;  // default 30
  int32 page = 3;
  int32 page_size = 4;
}

message ExportVehicleReportRequest {
  string tenant_id = 1;
  string format = 2;   // csv
}

message ExportVehicleReportResponse {
  bytes payload = 1;
  string content_type = 2;
  string filename = 3;
}

// ============================================================================
// Fuel Logs
// ============================================================================

message FuelLog {
  string id         = 1;
  string tenant_id  = 2;
  string vehicle_id = 3;
  string date       = 4; // ISO date "2024-01-15"
  double liters     = 5;
  int64  cost_cents = 6;
  int64  mileage_km = 7;
  string fuel_type  = 8;
  string notes      = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ListFuelLogsRequest {
  string vehicle_id = 1; // optional filter
  int32  page       = 2;
  int32  page_size  = 3;
}
message ListFuelLogsResponse {
  repeated FuelLog fuel_logs = 1;
  int32 total = 2;
}
message CreateFuelLogRequest {
  string vehicle_id = 1;
  string date       = 2;
  double liters     = 3;
  int64  cost_cents = 4;
  int64  mileage_km = 5;
  string fuel_type  = 6;
  string notes      = 7;
}
message CreateFuelLogResponse { FuelLog fuel_log = 1; }
message UpdateFuelLogRequest {
  string id         = 1;
  string date       = 2;
  double liters     = 3;
  int64  cost_cents = 4;
  int64  mileage_km = 5;
  string fuel_type  = 6;
  string notes      = 7;
}
message UpdateFuelLogResponse { FuelLog fuel_log = 1; }
message DeleteFuelLogRequest  { string id = 1; }
message DeleteFuelLogResponse {}

// ============================================================================
// Trip Logs
// ============================================================================

message TripLog {
  string id             = 1;
  string tenant_id      = 2;
  string vehicle_id     = 3;
  string date           = 4;
  string start_location = 5;
  string end_location   = 6;
  string purpose        = 7;
  int64  start_km       = 8;
  int64  end_km         = 9;
  int64  km             = 10; // computed: end_km - start_km
  bool   is_private     = 11;
  string driver_name    = 12;
  string notes          = 13;
  string created_at     = 14;
  string updated_at     = 15;
}
message ListTripLogsRequest {
  string vehicle_id = 1;
  int32  page       = 2;
  int32  page_size  = 3;
}
message ListTripLogsResponse {
  repeated TripLog trip_logs = 1;
  int32 total = 2;
}
message CreateTripLogRequest {
  string vehicle_id     = 1;
  string date           = 2;
  string start_location = 3;
  string end_location   = 4;
  string purpose        = 5;
  int64  start_km       = 6;
  int64  end_km         = 7;
  bool   is_private     = 8;
  string driver_name    = 9;
  string notes          = 10;
}
message CreateTripLogResponse { TripLog trip_log = 1; }
message UpdateTripLogRequest {
  string id             = 1;
  string date           = 2;
  string start_location = 3;
  string end_location   = 4;
  string purpose        = 5;
  int64  start_km       = 6;
  int64  end_km         = 7;
  bool   is_private     = 8;
  string driver_name    = 9;
  string notes          = 10;
}
message UpdateTripLogResponse { TripLog trip_log = 1; }
message DeleteTripLogRequest  { string id = 1; }
message DeleteTripLogResponse {}

// ============================================================================
// Vehicle Documents
// ============================================================================

message VehicleDocument {
  string id          = 1;
  string tenant_id   = 2;
  string vehicle_id  = 3;
  string doc_type    = 4;
  string name        = 5;
  string object_key  = 6;
  string upload_date = 7;
  string expiry_date = 8; // optional
  string created_at  = 9;
  string updated_at  = 10;
}
message ListVehicleDocumentsRequest {
  string vehicle_id = 1;
  int32  page       = 2;
  int32  page_size  = 3;
}
message ListVehicleDocumentsResponse {
  repeated VehicleDocument documents = 1;
  int32 total = 2;
}
message CreateVehicleDocumentRequest {
  string vehicle_id  = 1;
  string doc_type    = 2;
  string name        = 3;
  string object_key  = 4;
  string expiry_date = 5; // optional
}
message CreateVehicleDocumentResponse { VehicleDocument document = 1; }
message DeleteVehicleDocumentRequest  { string id = 1; }
message DeleteVehicleDocumentResponse {}

// ============================================================================
// GPS / Tracking
// ============================================================================

message GpsPosition {
  string id          = 1;
  string vehicle_id  = 2;
  double lat         = 3;
  double lng         = 4;
  double speed_kmh   = 5;
  string recorded_at = 6;
}
message VehicleRoute {
  string vehicle_id   = 1;
  string vehicle_name = 2;
  string date         = 3;
  repeated GpsPosition positions = 4;
  double daily_km     = 5;
  string status       = 6; // driving|parked|unknown
  string driver       = 7;
}
message IngestGpsPositionsRequest {
  string vehicle_id = 1;
  repeated GpsPosition positions = 2;
}
message IngestGpsPositionsResponse { int32 ingested = 1; }
message GetVehicleRoutesRequest {
  string date_from  = 1; // ISO date
  string date_to    = 2; // ISO date
  string vehicle_id = 3; // optional filter
}
message GetVehicleRoutesResponse {
  repeated VehicleRoute routes = 1;
}
message GetGpsPositionsRequest {
  string vehicle_id = 1;
  string from       = 2; // RFC3339
  string to         = 3; // RFC3339
  int32  limit      = 4;
}
message GetGpsPositionsResponse {
  repeated GpsPosition positions = 1;
}

// ============================================================================
// Driver Licenses (Fuehrerscheinkontrolle)
// ============================================================================

message DriverLicense {
  string id                   = 1;
  string tenant_id            = 2;
  string driver_id            = 3;
  repeated string license_classes = 4;
  string expiry_date          = 5; // optional, ISO date
  string checked_at           = 6; // ISO date
  string next_check_due_date  = 7; // ISO date
  string notes                = 8; // optional
  string created_at           = 9;
  string updated_at           = 10;
}
message ListDriverLicensesRequest {
  string driver_id = 1; // optional filter
  int32  page       = 2;
  int32  page_size  = 3;
}
message ListDriverLicensesResponse {
  repeated DriverLicense licenses = 1;
  int32 total = 2;
}
message CreateDriverLicenseRequest {
  string driver_id            = 1;
  repeated string license_classes = 2;
  string expiry_date          = 3; // optional
  string checked_at           = 4; // optional, defaults to today
  string next_check_due_date  = 5;
  string notes                = 6; // optional
}
message CreateDriverLicenseResponse { DriverLicense license = 1; }
message UpdateDriverLicenseRequest {
  string id                   = 1;
  repeated string license_classes = 2;
  string expiry_date          = 3; // optional
  string checked_at           = 4;
  string next_check_due_date  = 5;
  string notes                = 6; // optional
}
message UpdateDriverLicenseResponse { DriverLicense license = 1; }
message DeleteDriverLicenseRequest  { string id = 1; }
message DeleteDriverLicenseResponse {}

// ============================================================================
// Vehicle Bookings
// ============================================================================

message VehicleBooking {
  string id         = 1;
  string tenant_id  = 2;
  string vehicle_id = 3;
  string user_id    = 4;
  string starts_at  = 5; // RFC3339
  string ends_at    = 6; // RFC3339
  string purpose    = 7;
  string status     = 8; // booked|in_use|completed|cancelled
  string created_by = 9; // empty when the booking has no known creator
  string created_at = 10;
  string updated_at = 11;
}
message ListVehicleBookingsRequest {
  string vehicle_id = 1; // optional filter
  string user_id    = 2; // optional filter
  string status     = 3; // optional filter
  string from       = 4; // optional RFC3339 window start
  string to         = 5; // optional RFC3339 window end
  int32  page       = 6;
  int32  page_size  = 7;
}
message ListVehicleBookingsResponse {
  repeated VehicleBooking bookings = 1;
  int32 total = 2;
}
message CreateVehicleBookingRequest {
  string vehicle_id = 1;
  string user_id    = 2;
  string starts_at  = 3; // RFC3339
  string ends_at    = 4; // RFC3339
  string purpose    = 5;
}
// Optional so an omitted field stays untouched instead of being cleared.
message UpdateVehicleBookingRequest {
  string id                  = 1;
  optional string starts_at  = 2;
  optional string ends_at    = 3;
  optional string purpose    = 4;
  optional string status     = 5;
}
message VehicleBookingResponse { VehicleBooking booking = 1; }
message DeleteVehicleBookingRequest  { string id = 1; }
message DeleteVehicleBookingResponse {}
