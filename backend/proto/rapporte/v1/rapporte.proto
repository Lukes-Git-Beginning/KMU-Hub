syntax = "proto3";

package rapporte.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kmuhub/kmuhub/proto/rapporte/v1;rapportev1";

service RapporteService {
  // Reports
  rpc CreateReport(CreateReportRequest) returns (ReportResponse);
  rpc GetReport(GetReportRequest) returns (ReportResponse);
  rpc UpdateReport(UpdateReportRequest) returns (ReportResponse);
  rpc DeleteReport(DeleteReportRequest) returns (DeleteReportResponse);
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);

  // State machine
  rpc SubmitReport(SubmitReportRequest) returns (ReportResponse);
  rpc ApproveReport(ApproveReportRequest) returns (ReportResponse);
  rpc RejectReport(RejectReportRequest) returns (ReportResponse);

  // Lines
  rpc AddLine(AddLineRequest) returns (LineResponse);
  rpc UpdateLine(UpdateLineRequest) returns (LineResponse);
  rpc DeleteLine(DeleteLineRequest) returns (DeleteLineResponse);
  rpc ListLines(ListLinesRequest) returns (ListLinesResponse);

  // Attachments
  rpc UploadAttachment(UploadAttachmentRequest) returns (AttachmentResponse);
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse);
  rpc DeleteAttachment(DeleteAttachmentRequest) returns (DeleteAttachmentResponse);

  // Reports & export
  rpc GetReportStats(GetReportStatsRequest) returns (ReportStatsResponse);
  rpc ListPendingApprovals(ListPendingApprovalsRequest) returns (ListReportsResponse);
  rpc ExportPDF(ExportPDFRequest) returns (ExportPDFResponse);

  // Signature
  rpc SaveSignature(SaveReportSignatureRequest) returns (ReportResponse);

  // Workers
  rpc AddWorker(AddWorkerRequest) returns (AddWorkerResponse);
  rpc RemoveWorker(RemoveWorkerRequest) returns (RemoveWorkerResponse);
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);

  // Measurements
  rpc CreateMeasurement(CreateMeasurementRequest) returns (CreateMeasurementResponse);
  rpc GetMeasurement(GetMeasurementRequest) returns (GetMeasurementResponse);
  rpc ListMeasurements(ListMeasurementsRequest) returns (ListMeasurementsResponse);
  rpc UpdateMeasurement(UpdateMeasurementRequest) returns (UpdateMeasurementResponse);
  rpc DeleteMeasurement(DeleteMeasurementRequest) returns (DeleteMeasurementResponse);
  rpc AddMeasurementPosition(AddMeasurementPositionRequest) returns (AddMeasurementPositionResponse);
  rpc DeleteMeasurementPosition(DeleteMeasurementPositionRequest) returns (DeleteMeasurementPositionResponse);

  // Templates
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
}

// ============================================================================
// Domain Messages
// ============================================================================

message WorkReport {
  string id = 1;
  string tenant_id = 2;
  string title = 3;
  string description = 4;
  string status = 5; // draft|submitted|approved|rejected
  string author_id = 6;
  optional string reviewer_id = 7;
  optional google.protobuf.Timestamp reviewed_at = 8;
  string review_note = 9;
  optional double lat = 10;
  optional double lon = 11;
  string report_date = 12; // YYYY-MM-DD
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  string signature_data = 15; // data:image/png;base64,... or data:image/svg+xml;base64,...
  optional google.protobuf.Timestamp signed_at = 16;
  string signed_by = 17;
  // Extended fields (Migration 000162)
  string weather = 18;
  double temperature = 19;
  string work_start = 20;   // HH:MM
  string work_end = 21;     // HH:MM
  int32 break_minutes = 22;
  string project_name = 23;
  repeated Worker workers = 24;
}

message ReportLine {
  string id = 1;
  string tenant_id = 2;
  string report_id = 3;
  int32 position = 4;
  string description = 5;
  double quantity = 6;
  string unit = 7;
  string notes = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Extended fields (Migration 000162)
  string category = 11;
  string article = 12;
}

message ReportAttachment {
  string id = 1;
  string tenant_id = 2;
  string report_id = 3;
  optional string line_id = 4;
  string filename = 5;
  string content_type = 6;
  int64 size_bytes = 7;
  string object_key = 8;
  string presigned_url = 9;
  string uploaded_by = 10;
  google.protobuf.Timestamp created_at = 11;
}

// ============================================================================
// Worker Message (report_workers table)
// ============================================================================

message Worker {
  string id = 1;
  string tenant_id = 2;
  string report_id = 3;
  string name = 4;
  string role = 5;
  double hours = 6;
  string created_at = 7;
}

// ============================================================================
// Measurement Messages
// ============================================================================

message Measurement {
  string id = 1;
  string tenant_id = 2;
  string report_id = 3;
  string title = 4;
  string location = 5;
  string measured_by = 6;
  string measured_at = 7;
  string notes = 8;
  repeated MeasurementPosition positions = 9;
  string created_at = 10;
  string updated_at = 11;
}

message MeasurementPosition {
  string id = 1;
  string tenant_id = 2;
  string measurement_id = 3;
  int32 position_number = 4;
  string description = 5;
  string unit = 6;
  double quantity = 7;
  double unit_price = 8;
  string created_at = 9;
}

// ============================================================================
// Template Message
// ============================================================================

message ReportTemplate {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  string category = 5;
  string default_lines_json = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
}

// ============================================================================
// Report Requests / Responses
// ============================================================================

message CreateReportRequest {
  string tenant_id = 1;
  string title = 2;
  string description = 3;
  string author_id = 4;
  optional double lat = 5;
  optional double lon = 6;
  string report_date = 7; // YYYY-MM-DD, empty = today
  string weather = 8;
  double temperature = 9;
  string work_start = 10;
  string work_end = 11;
  int32 break_minutes = 12;
  string project_name = 13;
}

message GetReportRequest {
  string tenant_id = 1;
  string report_id = 2;
}

message UpdateReportRequest {
  string tenant_id = 1;
  string report_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional double lat = 5;
  optional double lon = 6;
  optional string report_date = 7;
  optional string weather = 8;
  optional double temperature = 9;
  optional string work_start = 10;
  optional string work_end = 11;
  optional int32 break_minutes = 12;
  optional string project_name = 13;
}

message DeleteReportRequest {
  string tenant_id = 1;
  string report_id = 2;
}

message DeleteReportResponse {}

message ReportResponse {
  WorkReport report = 1;
}

message ListReportsRequest {
  string tenant_id = 1;
  optional string status = 2;
  optional string author_id = 3;
  string search = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListReportsResponse {
  repeated WorkReport reports = 1;
  int32 total = 2;
}

// ============================================================================
// State Machine Requests
// ============================================================================

message SubmitReportRequest {
  string tenant_id = 1;
  string report_id = 2;
}

message ApproveReportRequest {
  string tenant_id = 1;
  string report_id = 2;
  string reviewer_id = 3;
  string review_note = 4;
}

message RejectReportRequest {
  string tenant_id = 1;
  string report_id = 2;
  string reviewer_id = 3;
  string review_note = 4;
}

// ============================================================================
// Line Requests / Responses
// ============================================================================

message AddLineRequest {
  string tenant_id = 1;
  string report_id = 2;
  string description = 3;
  double quantity = 4;
  string unit = 5;
  string notes = 6;
  int32 position = 7;
  string category = 8;
  string article = 9;
}

message UpdateLineRequest {
  string tenant_id = 1;
  string line_id = 2;
  optional string description = 3;
  optional double quantity = 4;
  optional string unit = 5;
  optional string notes = 6;
  optional int32 position = 7;
  optional string category = 8;
  optional string article = 9;
}

message DeleteLineRequest {
  string tenant_id = 1;
  string line_id = 2;
}

message DeleteLineResponse {}

message LineResponse {
  ReportLine line = 1;
}

message ListLinesRequest {
  string tenant_id = 1;
  string report_id = 2;
}

message ListLinesResponse {
  repeated ReportLine lines = 1;
}

// ============================================================================
// Attachment Requests / Responses
// ============================================================================

message UploadAttachmentRequest {
  string tenant_id = 1;
  string report_id = 2;
  optional string line_id = 3;
  string filename = 4;
  string content_type = 5;
  int64 size_bytes = 6;
  string object_key = 7; // pre-computed by caller, stored as-is
  string uploaded_by = 8;
}

message ListAttachmentsRequest {
  string tenant_id = 1;
  string report_id = 2;
  optional string line_id = 3;
}

message ListAttachmentsResponse {
  repeated ReportAttachment attachments = 1;
}

message AttachmentResponse {
  ReportAttachment attachment = 1;
}

message DeleteAttachmentRequest {
  string tenant_id = 1;
  string attachment_id = 2;
}

message DeleteAttachmentResponse {}

// ============================================================================
// Stats / Export
// ============================================================================

message GetReportStatsRequest {
  string tenant_id = 1;
}

message ReportStatsResponse {
  int32 total_reports = 1;
  int32 draft_count = 2;
  int32 submitted_count = 3;
  int32 approved_count = 4;
  int32 rejected_count = 5;
}

message ListPendingApprovalsRequest {
  string tenant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  // Set by the gateway when the caller's rapporte:report:read grant is scoped
  // to "own": the queue then shows only their own submitted reports. Never
  // taken from the request body.
  optional string author_id = 4;
}

message ExportPDFRequest {
  string tenant_id = 1;
  string report_id = 2;
}

message ExportPDFResponse {
  bytes payload = 1;
  string content_type = 2;
  string filename = 3;
}

// ============================================================================
// Signature
// ============================================================================

message SaveReportSignatureRequest {
  string tenant_id = 1;
  string report_id = 2;
  string signature_data = 3; // data:image/png;base64,... or data:image/svg+xml;base64,...
  string signed_by = 4;
}

// ============================================================================
// Worker Requests / Responses
// ============================================================================

message AddWorkerRequest {
  string tenant_id = 1;
  string report_id = 2;
  string name = 3;
  string role = 4;
  double hours = 5;
}

message AddWorkerResponse {
  Worker worker = 1;
}

message RemoveWorkerRequest {
  string tenant_id = 1;
  string worker_id = 2;
}

message RemoveWorkerResponse {
  bool success = 1;
}

message ListWorkersRequest {
  string tenant_id = 1;
  string report_id = 2;
}

message ListWorkersResponse {
  repeated Worker workers = 1;
}

// ============================================================================
// Measurement Requests / Responses
// ============================================================================

message CreateMeasurementRequest {
  string tenant_id = 1;
  string report_id = 2;
  string title = 3;
  string location = 4;
  string measured_by = 5;
  string measured_at = 6;
  string notes = 7;
  string idempotency_key = 8;
}

message CreateMeasurementResponse {
  Measurement measurement = 1;
}

message GetMeasurementRequest {
  string tenant_id = 1;
  string measurement_id = 2;
}

message GetMeasurementResponse {
  Measurement measurement = 1;
}

message ListMeasurementsRequest {
  string tenant_id = 1;
  string report_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListMeasurementsResponse {
  repeated Measurement measurements = 1;
  int32 total = 2;
}

message UpdateMeasurementRequest {
  string tenant_id = 1;
  string measurement_id = 2;
  string title = 3;
  string location = 4;
  string measured_by = 5;
  string measured_at = 6;
  string notes = 7;
}

message UpdateMeasurementResponse {
  Measurement measurement = 1;
}

message DeleteMeasurementRequest {
  string tenant_id = 1;
  string measurement_id = 2;
}

message DeleteMeasurementResponse {
  bool success = 1;
}

message AddMeasurementPositionRequest {
  string tenant_id = 1;
  string measurement_id = 2;
  int32 position_number = 3;
  string description = 4;
  string unit = 5;
  double quantity = 6;
  double unit_price = 7;
}

message AddMeasurementPositionResponse {
  MeasurementPosition position = 1;
}

message DeleteMeasurementPositionRequest {
  string tenant_id = 1;
  string position_id = 2;
}

message DeleteMeasurementPositionResponse {
  bool success = 1;
}

// ============================================================================
// Template Requests / Responses
// ============================================================================

message CreateTemplateRequest {
  string tenant_id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  string default_lines_json = 5;
  string idempotency_key = 6;
}

message CreateTemplateResponse {
  ReportTemplate template = 1;
}

message GetTemplateRequest {
  string tenant_id = 1;
  string template_id = 2;
}

message GetTemplateResponse {
  ReportTemplate template = 1;
}

message UpdateTemplateRequest {
  string tenant_id = 1;
  string template_id = 2;
  string name = 3;
  string description = 4;
  string category = 5;
  string default_lines_json = 6;
  bool is_active = 7;
}

message UpdateTemplateResponse {
  ReportTemplate template = 1;
}

message DeleteTemplateRequest {
  string tenant_id = 1;
  string template_id = 2;
}

message DeleteTemplateResponse {
  bool success = 1;
}

message ListTemplatesRequest {
  string tenant_id = 1;
  bool active_only = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListTemplatesResponse {
  repeated ReportTemplate templates = 1;
  int32 total = 2;
}
