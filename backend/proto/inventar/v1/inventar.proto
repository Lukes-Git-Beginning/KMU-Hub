syntax = "proto3";

package inventar.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kmuhub/kmuhub/proto/inventar/v1;inventarv1";

service InventarService {
  // Items
  rpc CreateItem(CreateItemRequest) returns (ItemResponse);
  rpc GetItem(GetItemRequest) returns (ItemResponse);
  rpc UpdateItem(UpdateItemRequest) returns (ItemResponse);
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);

  // Stock operations
  rpc AdjustStock(AdjustStockRequest) returns (ItemResponse);
  rpc TransferStock(TransferStockRequest) returns (TransferStockResponse);
  rpc RecordMovement(RecordMovementRequest) returns (MovementResponse);
  rpc ListMovements(ListMovementsRequest) returns (ListMovementsResponse);
  rpc GetStockHistory(GetStockHistoryRequest) returns (ListMovementsResponse);

  // Warnings
  rpc CreateWarning(CreateWarningRequest) returns (WarningResponse);
  rpc UpdateWarning(UpdateWarningRequest) returns (WarningResponse);
  rpc AcknowledgeWarning(AcknowledgeWarningRequest) returns (WarningResponse);
  rpc ListWarnings(ListWarningsRequest) returns (ListWarningsResponse);

  // Reports
  rpc GetStockReport(GetStockReportRequest) returns (StockReportResponse);
  rpc ExportInventory(ExportInventoryRequest) returns (ExportInventoryResponse);

  // Locations
  rpc CreateLocation(CreateLocationRequest) returns (LocationResponse);
  rpc GetLocation(GetLocationRequest) returns (LocationResponse);
  rpc UpdateLocation(UpdateLocationRequest) returns (LocationResponse);
  rpc DeleteLocation(DeleteLocationRequest) returns (DeleteLocationResponse);
  rpc ListLocations(ListLocationsRequest) returns (ListLocationsResponse);

  // Inventur sessions
  rpc CreateInventurSession(CreateInventurSessionRequest) returns (InventurSessionResponse);
  rpc GetInventurSession(GetInventurSessionRequest) returns (InventurSessionResponse);
  rpc UpdateInventurSessionStatus(UpdateInventurSessionStatusRequest) returns (InventurSessionResponse);
  rpc DeleteInventurSession(DeleteInventurSessionRequest) returns (DeleteInventurSessionResponse);
  rpc ListInventurSessions(ListInventurSessionsRequest) returns (ListInventurSessionsResponse);
  rpc UpsertInventurCount(UpsertInventurCountRequest) returns (InventurCountResponse);
  rpc BookInventurDifferences(BookInventurDifferencesRequest) returns (InventurSessionResponse);

  // Picking lists
  rpc CreatePickingList(CreatePickingListRequest) returns (PickingListResponse);
  rpc GetPickingList(GetPickingListRequest) returns (PickingListResponse);
  rpc UpdatePickingList(UpdatePickingListRequest) returns (PickingListResponse);
  rpc DeletePickingList(DeletePickingListRequest) returns (DeletePickingListResponse);
  rpc ListPickingLists(ListPickingListsRequest) returns (ListPickingListsResponse);
  rpc UpsertPickingListItem(UpsertPickingListItemRequest) returns (PickingListItemResponse);
  rpc DeletePickingListItem(DeletePickingListItemRequest) returns (DeletePickingListItemResponse);
  rpc BookPickingList(BookPickingListRequest) returns (PickingListResponse);

  // Item attachments
  rpc CreateItemAttachment(CreateItemAttachmentRequest) returns (ItemAttachmentResponse);
  rpc ListItemAttachments(ListItemAttachmentsRequest) returns (ListItemAttachmentsResponse);
  rpc DeleteItemAttachment(DeleteItemAttachmentRequest) returns (DeleteItemAttachmentResponse);
}

// ============================================================================
// Domain Messages
// ============================================================================

message Item {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string sku = 4;
  optional string barcode = 5;
  int64 quantity = 6;
  int64 min_quantity = 7;
  string unit = 8;
  optional string location = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional string location_id = 12;
  optional string category = 13;
  optional double price = 14;
  optional string currency = 15;
  optional string batch_number = 16;
  repeated string serial_numbers = 17;
  optional string linked_purchase_order = 18;
}

message Movement {
  string id = 1;
  string tenant_id = 2;
  string item_id = 3;
  string movement_type = 4; // in|out|adjustment|transfer
  int64 quantity = 5;
  optional string performed_by = 6;
  string reason = 7;
  google.protobuf.Timestamp created_at = 8;
  optional string reference = 9;
  optional string location_from = 10;
  optional string location_to = 11;
  optional string notes = 12;
}

message Warning {
  string id = 1;
  string tenant_id = 2;
  string item_id = 3;
  int64 threshold = 4;
  int64 current_quantity = 5;
  string status = 6; // active|acknowledged|resolved
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp acknowledged_at = 8;
  optional string acknowledged_by = 9;
}

// ============================================================================
// Item Requests / Responses
// ============================================================================

message CreateItemRequest {
  string tenant_id = 1;
  string name = 2;
  string sku = 3;
  optional string barcode = 4;
  int64 quantity = 5;
  int64 min_quantity = 6;
  string unit = 7;
  optional string location = 8;
  optional string location_id = 9;
  optional string category = 10;
  optional double price = 11;
  optional string currency = 12;
  optional string batch_number = 13;
  repeated string serial_numbers = 14;
  optional string linked_purchase_order = 15;
}

message GetItemRequest {
  string tenant_id = 1;
  string item_id = 2;
}

message UpdateItemRequest {
  string tenant_id = 1;
  string item_id = 2;
  optional string name = 3;
  optional string sku = 4;
  optional string barcode = 5;
  optional int64 min_quantity = 6;
  optional string unit = 7;
  optional string location = 8;
  optional string location_id = 9;
  optional string category = 10;
  optional double price = 11;
  optional string currency = 12;
  optional string batch_number = 13;
  optional string linked_purchase_order = 14;
}

message DeleteItemRequest {
  string tenant_id = 1;
  string item_id = 2;
}

message DeleteItemResponse {}

message ItemResponse {
  Item item = 1;
}

message ListItemsRequest {
  string tenant_id = 1;
  string search = 2;
  optional string location = 3;
  bool low_stock = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListItemsResponse {
  repeated Item items = 1;
  int32 total = 2;
}

// ============================================================================
// Stock Operation Requests / Responses
// ============================================================================

message AdjustStockRequest {
  string tenant_id = 1;
  string item_id = 2;
  int64 delta = 3; // positive = in, negative = out
  optional string performed_by = 4;
  string reason = 5;
}

message TransferStockRequest {
  string tenant_id = 1;
  string from_item_id = 2;
  string to_item_id = 3;
  int64 quantity = 4;
  optional string performed_by = 5;
  string reason = 6;
}

message TransferStockResponse {}

message RecordMovementRequest {
  string tenant_id = 1;
  string item_id = 2;
  string movement_type = 3; // in|out|adjustment|transfer
  int64 quantity = 4;
  optional string performed_by = 5;
  string reason = 6;
}

message MovementResponse {
  Movement movement = 1;
}

message ListMovementsRequest {
  string tenant_id = 1;
  string item_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListMovementsResponse {
  repeated Movement movements = 1;
  int32 total = 2;
}

message GetStockHistoryRequest {
  string tenant_id = 1;
  string item_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ============================================================================
// Warning Requests / Responses
// ============================================================================

message CreateWarningRequest {
  string tenant_id = 1;
  string item_id = 2;
  int64 threshold = 3;
  int64 current_quantity = 4;
}

message UpdateWarningRequest {
  string tenant_id = 1;
  string warning_id = 2;
  string status = 3; // active|acknowledged|resolved
}

message AcknowledgeWarningRequest {
  string tenant_id = 1;
  string warning_id = 2;
  string acknowledged_by = 3;
}

message WarningResponse {
  Warning warning = 1;
}

message ListWarningsRequest {
  string tenant_id = 1;
  optional string status = 2; // filter by status
  int32 page = 3;
  int32 page_size = 4;
}

message ListWarningsResponse {
  repeated Warning warnings = 1;
  int32 total = 2;
}

// ============================================================================
// Report Requests / Responses
// ============================================================================

message GetStockReportRequest {
  string tenant_id = 1;
}

message StockReportResponse {
  int32 total_items = 1;
  int64 total_quantity = 2;
  int32 low_stock_count = 3;
  int32 active_warnings = 4;
}

message ExportInventoryRequest {
  string tenant_id = 1;
  string format = 2; // csv
}

message ExportInventoryResponse {
  bytes payload = 1;
  string content_type = 2;
  string filename = 3;
}

// ============================================================================
// Location Messages
// ============================================================================

message Location {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string address = 4;
  string type = 5; // warehouse|store|vehicle
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreateLocationRequest {
  string tenant_id = 1;
  string name = 2;
  string address = 3;
  string type = 4;
}

message GetLocationRequest {
  string tenant_id = 1;
  string location_id = 2;
}

message UpdateLocationRequest {
  string tenant_id = 1;
  string location_id = 2;
  optional string name = 3;
  optional string address = 4;
  optional string type = 5;
}

message DeleteLocationRequest {
  string tenant_id = 1;
  string location_id = 2;
}

message DeleteLocationResponse {}

message LocationResponse {
  Location location = 1;
}

message ListLocationsRequest {
  string tenant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListLocationsResponse {
  repeated Location locations = 1;
  int32 total = 2;
}

// ============================================================================
// Inventur Session Messages
// ============================================================================

message InventurCount {
  string id = 1;
  string tenant_id = 2;
  string session_id = 3;
  string item_id = 4;
  int64 expected = 5;
  optional int64 counted = 6;
  optional google.protobuf.Timestamp counted_at = 7;
}

message InventurSession {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  google.protobuf.Timestamp date = 4;
  string status = 5; // open|counting|review|completed
  optional string location_id = 6;
  optional string created_by = 7;
  repeated InventurCount counts = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateInventurSessionRequest {
  string tenant_id = 1;
  string name = 2;
  google.protobuf.Timestamp date = 3;
  optional string location_id = 4;
  optional string created_by = 5;
  repeated string item_ids = 6;
}

message GetInventurSessionRequest {
  string tenant_id = 1;
  string session_id = 2;
}

message UpdateInventurSessionStatusRequest {
  string tenant_id = 1;
  string session_id = 2;
  string status = 3;
}

message DeleteInventurSessionRequest {
  string tenant_id = 1;
  string session_id = 2;
}

message DeleteInventurSessionResponse {}

message ListInventurSessionsRequest {
  string tenant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListInventurSessionsResponse {
  repeated InventurSession sessions = 1;
  int32 total = 2;
}

message UpsertInventurCountRequest {
  string tenant_id = 1;
  string session_id = 2;
  string item_id = 3;
  int64 counted = 4;
}

message InventurCountResponse {
  InventurCount count = 1;
}

message BookInventurDifferencesRequest {
  string tenant_id = 1;
  string session_id = 2;
  optional string booked_by = 3;
}

message InventurSessionResponse {
  InventurSession session = 1;
}

// ============================================================================
// Picking List Messages
// ============================================================================

message PickingListItem {
  string id = 1;
  string tenant_id = 2;
  string picking_list_id = 3;
  string item_id = 4;
  int64 quantity_requested = 5;
  int64 quantity_picked = 6;
  optional string location = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message PickingList {
  string id = 1;
  string tenant_id = 2;
  string reference = 3;
  string status = 4; // open|picking|completed
  optional string assigned_to = 5;
  optional string created_by = 6;
  repeated PickingListItem items = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreatePickingListItemInput {
  string item_id = 1;
  int64 quantity_requested = 2;
  int64 quantity_picked = 3;
  optional string location = 4;
}

message CreatePickingListRequest {
  string tenant_id = 1;
  string reference = 2;
  optional string assigned_to = 3;
  optional string created_by = 4;
  repeated CreatePickingListItemInput items = 5;
}

message GetPickingListRequest {
  string tenant_id = 1;
  string picking_list_id = 2;
}

message UpdatePickingListRequest {
  string tenant_id = 1;
  string picking_list_id = 2;
  optional string reference = 3;
  optional string status = 4;
  optional string assigned_to = 5;
}

message DeletePickingListRequest {
  string tenant_id = 1;
  string picking_list_id = 2;
}

message DeletePickingListResponse {}

message ListPickingListsRequest {
  string tenant_id = 1;
  optional string status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListPickingListsResponse {
  repeated PickingList picking_lists = 1;
  int32 total = 2;
}

message UpsertPickingListItemRequest {
  string tenant_id = 1;
  string picking_list_id = 2;
  string item_id = 3;
  int64 quantity_requested = 4;
  int64 quantity_picked = 5;
  optional string location = 6;
}

message PickingListItemResponse {
  PickingListItem item = 1;
}

message DeletePickingListItemRequest {
  string tenant_id = 1;
  string picking_list_item_id = 2;
}

message DeletePickingListItemResponse {}

message BookPickingListRequest {
  string tenant_id = 1;
  string picking_list_id = 2;
  optional string booked_by = 3;
}

message PickingListResponse {
  PickingList picking_list = 1;
}

// ============================================================================
// Item Attachment Messages
// ============================================================================

message ItemAttachment {
  string id = 1;
  string tenant_id = 2;
  string item_id = 3;
  string name = 4;
  string object_key = 5;
  string file_type = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateItemAttachmentRequest {
  string tenant_id = 1;
  string item_id = 2;
  string name = 3;
  string object_key = 4;
  string file_type = 5;
}

message ItemAttachmentResponse {
  ItemAttachment attachment = 1;
}

message ListItemAttachmentsRequest {
  string tenant_id = 1;
  string item_id = 2;
}

message ListItemAttachmentsResponse {
  repeated ItemAttachment attachments = 1;
}

message DeleteItemAttachmentRequest {
  string tenant_id = 1;
  string attachment_id = 2;
}

message DeleteItemAttachmentResponse {}
