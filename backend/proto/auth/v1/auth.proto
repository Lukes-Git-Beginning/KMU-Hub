syntax = "proto3";

package auth.v1;

option go_package = "github.com/kmuhub/kmuhub/proto/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RemoveRole(RemoveRoleRequest) returns (RemoveRoleResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);

  // Profile & Password
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // Invitations
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse);
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
  rpc CancelInvitation(CancelInvitationRequest) returns (CancelInvitationResponse);

  // Two-Factor Authentication
  rpc Setup2FA(Setup2FARequest) returns (Setup2FAResponse);
  rpc Verify2FA(Verify2FARequest) returns (Verify2FAResponse);
  rpc Validate2FALogin(Validate2FALoginRequest) returns (Validate2FALoginResponse);
  rpc Disable2FA(Disable2FARequest) returns (Disable2FAResponse);
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse);
  rpc AdminReset2FA(AdminReset2FARequest) returns (AdminReset2FAResponse);

  // Sessions
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc TerminateSession(TerminateSessionRequest) returns (TerminateSessionResponse);
  rpc TerminateAllSessions(TerminateAllSessionsRequest) returns (TerminateAllSessionsResponse);

  // Two-Factor Policy
  rpc GetTwoFactorPolicy(GetTwoFactorPolicyRequest) returns (GetTwoFactorPolicyResponse);
  rpc UpdateTwoFactorPolicy(UpdateTwoFactorPolicyRequest) returns (UpdateTwoFactorPolicyResponse);

  // Password Reset
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
}

message RegisterResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
  bool requires_two_factor = 4;
  string pending_token = 5;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  repeated string roles = 3;
  repeated string permissions = 4;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  UserInfo user = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListUsersResponse {
  repeated UserInfo users = 1;
  int32 total = 2;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional bool is_active = 4;
}

message UpdateUserResponse {
  UserInfo user = 1;
}

message AssignRoleRequest {
  string user_id = 1;
  string role_name = 2;
}

message AssignRoleResponse {}

message RemoveRoleRequest {
  string user_id = 1;
  string role_name = 2;
}

message RemoveRoleResponse {}

message CheckPermissionRequest {
  string user_id = 1;
  string resource = 2;
  string action = 3;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message UserInfo {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  bool is_active = 5;
  repeated string roles = 6;
  string created_at = 7;
  bool two_factor_enabled = 8;
  string locale = 9;
  string avatar_url = 10;
}

// Profile & Password messages

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  UserInfo user = 1;
}

// Self-service profile update. user_id is injected by the gateway from the
// authenticated context, never trusted from the request body. Unlike the
// admin-only UpdateUser, this cannot change is_active.
message UpdateProfileRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string avatar_url = 4;
}

message UpdateProfileResponse {
  UserInfo user = 1;
}

message ChangePasswordRequest {
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {}

// Invitation messages

message InvitationInfo {
  string id = 1;
  string email = 2;
  string role = 3;
  string expires_at = 4;
  string created_by = 5;
  string created_at = 6;
}

message CreateInvitationRequest {
  string email = 1;
  string role = 2;
  string created_by = 3;
}

message CreateInvitationResponse {
  InvitationInfo invitation = 1;
  string token = 2;
}

message ListInvitationsRequest {}

message ListInvitationsResponse {
  repeated InvitationInfo invitations = 1;
}

message AcceptInvitationRequest {
  string token = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
}

message AcceptInvitationResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message CancelInvitationRequest {
  string invitation_id = 1;
}

message CancelInvitationResponse {}

// ---------------------------------------------------------------------------
// Two-Factor Authentication messages
// ---------------------------------------------------------------------------

message Setup2FARequest {
  string user_id = 1;
}

message Setup2FAResponse {
  bytes qr_code_png = 1;
  string manual_secret = 2;
}

message Verify2FARequest {
  string user_id = 1;
  string code = 2;
}

message Verify2FAResponse {
  repeated string recovery_codes = 1;
}

message Validate2FALoginRequest {
  string pending_token = 1;
  string code = 2;
  bool is_recovery_code = 3;
}

message Validate2FALoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  UserInfo user = 3;
}

message Disable2FARequest {
  string user_id = 1;
  string code = 2; // current TOTP code for confirmation
}

message Disable2FAResponse {}

message RegenerateRecoveryCodesRequest {
  string user_id = 1;
  string code = 2; // current TOTP code for confirmation
}

message RegenerateRecoveryCodesResponse {
  repeated string recovery_codes = 1;
}

message AdminReset2FARequest {
  string user_id = 1;
  string reason = 2;
  string admin_id = 3;
}

message AdminReset2FAResponse {}

// ---------------------------------------------------------------------------
// Session messages
// ---------------------------------------------------------------------------

message SessionInfo {
  string id = 1;
  string user_id = 2;
  string device_name = 3;
  string device_type = 4;
  string ip_address = 5;
  string location = 6;
  string user_agent = 7;
  bool is_current = 8;
  google.protobuf.Timestamp last_active_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListSessionsRequest {
  string user_id = 1;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message TerminateSessionRequest {
  string session_id = 1;
  string user_id = 2;
}

message TerminateSessionResponse {}

message TerminateAllSessionsRequest {
  string user_id = 1;
  string current_session_id = 2; // keep this one alive
}

message TerminateAllSessionsResponse {
  int32 terminated_count = 1;
}

// ---------------------------------------------------------------------------
// Two-Factor Policy messages
// ---------------------------------------------------------------------------

message TwoFactorPolicy {
  string id = 1;
  string role_name = 2;
  bool enforced = 3;
  int32 grace_period_days = 4;
  google.protobuf.Timestamp updated_at = 5;
  string updated_by = 6;
}

message GetTwoFactorPolicyRequest {
  string role_name = 1; // empty = all policies
}

message GetTwoFactorPolicyResponse {
  repeated TwoFactorPolicy policies = 1;
}

message UpdateTwoFactorPolicyRequest {
  string role_name = 1;
  bool enforced = 2;
  int32 grace_period_days = 3;
  string updated_by = 4;
}

message UpdateTwoFactorPolicyResponse {
  TwoFactorPolicy policy = 1;
}

// ---------------------------------------------------------------------------
// Password Reset messages
// ---------------------------------------------------------------------------

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {
  // Always returns the same message regardless of whether the email exists,
  // to prevent user enumeration.
  string message = 1;
}

message ResetPasswordRequest {
  string token       = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}
