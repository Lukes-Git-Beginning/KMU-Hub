syntax = "proto3";

package auth.v1;

option go_package = "github.com/kmuhub/kmuhub/proto/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RemoveRole(RemoveRoleRequest) returns (RemoveRoleResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  // Resolves the fine-grained capability keys of a user across all assigned roles.
  rpc GetEffectivePermissions(GetEffectivePermissionsRequest) returns (GetEffectivePermissionsResponse);

  // Role administration — tenant-scoped custom roles on top of the immutable
  // system presets. Presets are readable by every tenant and writable by none.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc GetRolePermissions(GetRolePermissionsRequest) returns (GetRolePermissionsResponse);
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (SetRolePermissionsResponse);
  rpc AssignUserRole(AssignUserRoleRequest) returns (AssignUserRoleResponse);
  rpc RevokeUserRole(RevokeUserRoleRequest) returns (RevokeUserRoleResponse);

  // Per-user permission overrides (RBAC R-6) — the deviations one account
  // carries on top of its roles. Storage and CRUD only; folding them into the
  // resolved capability set is a separate step.
  rpc GetUserOverrides(GetUserOverridesRequest) returns (UserOverridesResponse);
  rpc SetUserOverrides(SetUserOverridesRequest) returns (UserOverridesResponse);
  rpc ClearUserOverrides(ClearUserOverridesRequest) returns (ClearUserOverridesResponse);

  // Admin account roster (phase 3) — the tenant's login accounts merged with
  // its still-open invitations into the one list the account admin surface
  // shows (admin-types.ts, AdminUser).
  rpc ListAdminUsers(ListAdminUsersRequest) returns (ListAdminUsersResponse);
  // The three writing counterparts of the roster. Each answers with the single
  // roster row it produced, so the surface can patch its list without refetching.
  rpc InviteAdminUser(InviteAdminUserRequest) returns (AdminUserResponse);
  rpc UpdateAdminUser(UpdateAdminUserRequest) returns (AdminUserResponse);
  rpc ResendAdminUserInvite(ResendAdminUserInviteRequest) returns (AdminUserResponse);

  // Profile & Password
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // Tenant provisioning — platform operation, gated by tenants:write.
  rpc ProvisionTenant(ProvisionTenantRequest) returns (ProvisionTenantResponse);

  // Invitations
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse);
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
  rpc CancelInvitation(CancelInvitationRequest) returns (CancelInvitationResponse);

  // Two-Factor Authentication
  rpc Setup2FA(Setup2FARequest) returns (Setup2FAResponse);
  rpc Verify2FA(Verify2FARequest) returns (Verify2FAResponse);
  rpc Validate2FALogin(Validate2FALoginRequest) returns (Validate2FALoginResponse);
  rpc Disable2FA(Disable2FARequest) returns (Disable2FAResponse);
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse);
  rpc AdminReset2FA(AdminReset2FARequest) returns (AdminReset2FAResponse);

  // Sessions
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc TerminateSession(TerminateSessionRequest) returns (TerminateSessionResponse);
  rpc TerminateAllSessions(TerminateAllSessionsRequest) returns (TerminateAllSessionsResponse);

  // Two-Factor Policy
  rpc GetTwoFactorPolicy(GetTwoFactorPolicyRequest) returns (GetTwoFactorPolicyResponse);
  rpc UpdateTwoFactorPolicy(UpdateTwoFactorPolicyRequest) returns (UpdateTwoFactorPolicyResponse);

  // Password Reset
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
}

message RegisterResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
  bool requires_two_factor = 4;
  string pending_token = 5;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  repeated string roles = 3;
  repeated string permissions = 4;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  UserInfo user = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListUsersResponse {
  repeated UserInfo users = 1;
  int32 total = 2;
}

// AdminUserInfo is one row of the account roster: either a real account
// (status active/deactivated, derived from users.is_active) or a still-open
// invitation (status invited, no user row exists yet — first_name/last_name
// are empty because invitations do not collect a name). Dates are RFC3339
// strings, empty when unset, matching TenantInfo/InvitationInfo.
message AdminUserInfo {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  repeated string role_ids = 5;
  string status = 6;
  string last_login_at = 7;
  string invited_at = 8;
}

message ListAdminUsersRequest {}

message ListAdminUsersResponse {
  repeated AdminUserInfo users = 1;
}

// AdminUserResponse is the shared answer of the three writing roster routes:
// the one row the operation produced, in the same shape the list returns.
//
// invite_token is set by the two invitation routes and empty otherwise. It is
// the same one-time token CreateInvitationResponse returns and travels the same
// way — the caller builds the accept link from it, since nothing in the auth
// service dispatches invitation mail (Mailer only knows password resets).
message AdminUserResponse {
  AdminUserInfo user = 1;
  string invite_token = 2;
}

message InviteAdminUserRequest {
  string email = 1;
  string first_name = 2;
  string last_name = 3;
  // Role ids, not names — a name cannot identify a custom role (roles is
  // unique per tenant+name, so two tenants may own the same one).
  repeated string role_ids = 4;
}

// UpdateAdminUserRequest carries two independent edits. role_ids is a FULL
// REPLACEMENT when present and untouched when absent, which is why it needs the
// has_role_ids companion: proto3 cannot tell "clear all roles" from "do not
// touch roles" on a repeated field.
message UpdateAdminUserRequest {
  string user_id = 1;
  repeated string role_ids = 2;
  bool has_role_ids = 3;
  optional string status = 4;
}

// ResendAdminUserInviteRequest takes the INVITATION id — the id an invited
// roster row carries, since no user row exists for it yet.
message ResendAdminUserInviteRequest {
  string invitation_id = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional bool is_active = 4;
}

message UpdateUserResponse {
  UserInfo user = 1;
}

message AssignRoleRequest {
  string user_id = 1;
  string role_name = 2;
}

message AssignRoleResponse {}

message RemoveRoleRequest {
  string user_id = 1;
  string role_name = 2;
}

message RemoveRoleResponse {}

message CheckPermissionRequest {
  string user_id = 1;
  string resource = 2;
  string action = 3;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

// Empty user_id means "the caller", resolved from the request context.
message GetEffectivePermissionsRequest {
  string user_id = 1;
  // base asks for the pure role union, before per-user overrides (RBAC R-6)
  // are folded in. That is the greyed "inherited" baseline the override editor
  // renders next to the effective set, so it must stay reachable even for an
  // account whose overrides change half of it.
  bool base = 2;
}

// A role assigned to the user. Preset roles carry tenant_id IS NULL and are
// reported as is_system.
message EffectiveRole {
  string id = 1;
  string name = 2;
  bool is_system = 3;
  string color = 4;
}

// A resolved capability. key is the fine-grained "module:subject:action" form,
// scope is the widest scope granted across all contributing roles
// (own < team < all), sources lists the names of every contributing role.
message EffectiveCapability {
  string key = 1;
  string scope = 2;
  repeated string sources = 3;
}

// A capability the account's roles grant but a deny override revokes. It is
// absent from capabilities — this list exists so the effective view can show it
// struck through instead of silently missing, which is the difference between
// "you never had it" and "it was taken from you".
//
// role_scope is the scope the roles would have granted, kept for that display;
// sources are the contributing role ids, same currency as EffectiveCapability.
message DeniedCapability {
  string key = 1;
  string role_scope = 2;
  repeated string sources = 3;
}

message GetEffectivePermissionsResponse {
  repeated EffectiveRole roles = 1;
  repeated EffectiveCapability capabilities = 2;
  // Both fields stay empty for a base=true request and for an account without
  // a single override, so its answer is byte-identical to the one this RPC
  // gave before overrides existed.
  bool has_overrides = 3;
  repeated DeniedCapability denied_by_override = 4;
}

// Role administration messages.
//
// A role as the admin surface sees it. An empty tenant_id means a
// Zentria-maintained system preset (also reported as is_system); the gateway
// renders that as JSON null. preset_id names the role a custom role was cloned
// from and is empty on presets themselves (FE contract: basedOn).
message Role {
  string id = 1;
  string name = 2;
  string description = 3;
  string tenant_id = 4;
  string preset_id = 5;
  bool is_system = 6;
  string color = 7;
  int32 member_count = 8;
  int32 capability_count = 9;
}

// One capability grant of a role. key is the fine-grained
// "module:subject:action" form, scope is one of own|team|all.
message RoleGrant {
  string key = 1;
  string scope = 2;
}

message ListRolesRequest {}

// System presets plus the custom roles of the calling tenant.
message ListRolesResponse {
  repeated Role roles = 1;
}

// Creating a role is always a clone: every grant of based_on is copied over,
// scope included. based_on is usually a preset.
message CreateRoleRequest {
  string name = 1;
  string description = 2;
  string color = 3;
  string based_on = 4;
}

message CreateRoleResponse {
  Role role = 1;
}

message UpdateRoleRequest {
  string role_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string color = 4;
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string role_id = 1;
}

message DeleteRoleResponse {}

message GetRolePermissionsRequest {
  string role_id = 1;
}

message GetRolePermissionsResponse {
  string role_id = 1;
  repeated RoleGrant grants = 2;
}

// Full replacement of the grant set: every key missing from grants is revoked.
message SetRolePermissionsRequest {
  string role_id = 1;
  repeated RoleGrant grants = 2;
}

message SetRolePermissionsResponse {
  string role_id = 1;
  repeated RoleGrant grants = 2;
}

message AssignUserRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

// The role ids the account holds after the mutation (FE contract: roles).
message AssignUserRoleResponse {
  repeated string role_ids = 1;
}

message RevokeUserRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message RevokeUserRoleResponse {
  repeated string role_ids = 1;
}

// Per-user permission override messages (RBAC R-6).
//
// One deviation from what the account's roles grant. mode is allow|deny,
// scope one of own|team|all — carried for both modes but only meaningful for
// allow, matching the frontend type (rbac-types.ts, CapabilityOverride).
message CapabilityOverride {
  string key = 1;
  string mode = 2;
  string scope = 3;
}

message GetUserOverridesRequest {
  string user_id = 1;
}

// The full override map after the call. A repeated field, not a map: the
// gateway reshapes it into the frontend's `Record<key, {mode, scope}>`, and a
// proto map would lose the stable key order the editor renders in.
message UserOverridesResponse {
  string user_id = 1;
  repeated CapabilityOverride overrides = 2;
}

// Replaces the WHOLE map: a key absent from overrides goes back to following
// the roles. An empty list therefore clears every override of the account,
// exactly like ClearUserOverrides.
message SetUserOverridesRequest {
  string user_id = 1;
  repeated CapabilityOverride overrides = 2;
}

message ClearUserOverridesRequest {
  string user_id = 1;
}

message ClearUserOverridesResponse {}

message UserInfo {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  bool is_active = 5;
  repeated string roles = 6;
  string created_at = 7;
  bool two_factor_enabled = 8;
  string locale = 9;
  string avatar_url = 10;
}

// Profile & Password messages

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  UserInfo user = 1;
}

// Self-service profile update. user_id is injected by the gateway from the
// authenticated context, never trusted from the request body. Unlike the
// admin-only UpdateUser, this cannot change is_active.
message UpdateProfileRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string avatar_url = 4;
}

message UpdateProfileResponse {
  UserInfo user = 1;
}

message ChangePasswordRequest {
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {}

// Tenant provisioning messages
//
// Dates are RFC3339 strings, matching the invitation messages below. The
// gateway marshals with UseEnumNumbers, so nothing here is an enum.

message TenantInfo {
  string id = 1;
  string name = 2;
  string plan_type = 3;
  string support_tier = 4;
  string subscription_status = 5;
  // Empty when no billing period has been agreed.
  string billing_period_end = 6;
  // Unset (has_seat_limit = false) means an uncapped tenant.
  int32 seat_limit = 7;
  bool has_seat_limit = 8;
  string created_at = 9;
  // The module ids activated at provisioning time.
  repeated string modules = 10;
}

message ProvisionTenantRequest {
  string name = 1;
  string plan_type = 2;
  string support_tier = 3;
  int32 seat_limit = 4;
  bool has_seat_limit = 5;
  string billing_period_end = 6;
  // Empty activates the whole catalogue.
  repeated string modules = 7;
  string admin_email = 8;
  // The platform operator issuing the invitation.
  string created_by = 9;
}

message ProvisionTenantResponse {
  TenantInfo tenant = 1;
  InvitationInfo invitation = 2;
  // The plaintext invitation token, returned once and never stored.
  string invitation_token = 3;
}

// Invitation messages

message InvitationInfo {
  string id = 1;
  string email = 2;
  string role = 3;
  string expires_at = 4;
  string created_by = 5;
  string created_at = 6;
}

message CreateInvitationRequest {
  string email = 1;
  string role = 2;
  string created_by = 3;
}

message CreateInvitationResponse {
  InvitationInfo invitation = 1;
  string token = 2;
}

message ListInvitationsRequest {}

message ListInvitationsResponse {
  repeated InvitationInfo invitations = 1;
}

message AcceptInvitationRequest {
  string token = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
}

message AcceptInvitationResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message CancelInvitationRequest {
  string invitation_id = 1;
}

message CancelInvitationResponse {}

// ---------------------------------------------------------------------------
// Two-Factor Authentication messages
// ---------------------------------------------------------------------------

message Setup2FARequest {
  string user_id = 1;
}

message Setup2FAResponse {
  bytes qr_code_png = 1;
  string manual_secret = 2;
}

message Verify2FARequest {
  string user_id = 1;
  string code = 2;
}

message Verify2FAResponse {
  repeated string recovery_codes = 1;
}

message Validate2FALoginRequest {
  string pending_token = 1;
  string code = 2;
  bool is_recovery_code = 3;
}

message Validate2FALoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  UserInfo user = 3;
}

message Disable2FARequest {
  string user_id = 1;
  string code = 2; // current TOTP code for confirmation
}

message Disable2FAResponse {}

message RegenerateRecoveryCodesRequest {
  string user_id = 1;
  string code = 2; // current TOTP code for confirmation
}

message RegenerateRecoveryCodesResponse {
  repeated string recovery_codes = 1;
}

message AdminReset2FARequest {
  string user_id = 1;
  string reason = 2;
  string admin_id = 3;
}

message AdminReset2FAResponse {}

// ---------------------------------------------------------------------------
// Session messages
// ---------------------------------------------------------------------------

message SessionInfo {
  string id = 1;
  string user_id = 2;
  string device_name = 3;
  string device_type = 4;
  string ip_address = 5;
  string location = 6;
  string user_agent = 7;
  bool is_current = 8;
  google.protobuf.Timestamp last_active_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListSessionsRequest {
  string user_id = 1;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message TerminateSessionRequest {
  string session_id = 1;
  string user_id = 2;
}

message TerminateSessionResponse {}

message TerminateAllSessionsRequest {
  string user_id = 1;
  string current_session_id = 2; // keep this one alive
}

message TerminateAllSessionsResponse {
  int32 terminated_count = 1;
}

// ---------------------------------------------------------------------------
// Two-Factor Policy messages
// ---------------------------------------------------------------------------

message TwoFactorPolicy {
  string id = 1;
  string role_name = 2;
  bool enforced = 3;
  int32 grace_period_days = 4;
  google.protobuf.Timestamp updated_at = 5;
  string updated_by = 6;
}

message GetTwoFactorPolicyRequest {
  string role_name = 1; // empty = all policies
}

message GetTwoFactorPolicyResponse {
  repeated TwoFactorPolicy policies = 1;
}

message UpdateTwoFactorPolicyRequest {
  string role_name = 1;
  bool enforced = 2;
  int32 grace_period_days = 3;
  string updated_by = 4;
}

message UpdateTwoFactorPolicyResponse {
  TwoFactorPolicy policy = 1;
}

// ---------------------------------------------------------------------------
// Password Reset messages
// ---------------------------------------------------------------------------

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {
  // Always returns the same message regardless of whether the email exists,
  // to prevent user enumeration.
  string message = 1;
}

message ResetPasswordRequest {
  string token       = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}
